<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최신 수의학 논문 | 위케어동물의료센터</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f4f7fb; color: #222; }

  header {
    background: #1a3a5c;
    color: #fff;
    padding: 36px 40px 28px;
  }
  header .label {
    font-size: 11px;
    letter-spacing: 2px;
    color: #7ec8e3;
    margin-bottom: 8px;
  }
  header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  header p { font-size: 13px; color: #a8c8e0; }

  .filter-bar {
    background: #fff;
    border-bottom: 1px solid #e0e8f5;
    padding: 14px 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .filter-bar span { font-size: 12px; color: #888; margin-right: 4px; }
  .filter-btn {
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid #c8dff5;
    background: #fff;
    color: #2e6da8;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active, .filter-btn:hover {
    background: #2e6da8;
    color: #fff;
    border-color: #2e6da8;
  }

  .container { max-width: 900px; margin: 32px auto; padding: 0 20px; }

  .update-info {
    font-size: 12px;
    color: #888;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .update-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4caf82;
    display: inline-block;
  }

  .paper-card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e0e8f5;
    padding: 22px 24px;
    margin-bottom: 14px;
    transition: box-shadow 0.15s;
  }
  .paper-card:hover { box-shadow: 0 4px 16px rgba(46,109,168,0.10); }

  .paper-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .journal-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    background: #e8f3fb;
    color: #2e6da8;
    letter-spacing: 0.5px;
  }
  .date-badge {
    font-size: 11px;
    color: #aaa;
  }
  .new-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: #e8f7f0;
    color: #2a9d6e;
    font-weight: 700;
  }

  .paper-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a3a5c;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .paper-title a {
    color: inherit;
    text-decoration: none;
  }
  .paper-title a:hover { color: #2e6da8; text-decoration: underline; }

  .paper-authors {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .paper-abstract {
    font-size: 12.5px;
    color: #666;
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .paper-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .pubmed-link {
    font-size: 12px;
    color: #2e6da8;
    text-decoration: none;
    border: 1px solid #c8dff5;
    border-radius: 6px;
    padding: 4px 12px;
  }
  .pubmed-link:hover { background: #e8f3fb; }

  .loading {
    text-align: center;
    padding: 60px 0;
    color: #aaa;
    font-size: 14px;
  }
  .loading-spinner {
    width: 32px; height: 32px;
    border: 3px solid #e0e8f5;
    border-top-color: #2e6da8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    background: #fff5f5;
    border: 1px solid #f5c6c6;
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    color: #c0392b;
    font-size: 13px;
  }

  .no-result {
    text-align: center;
    padding: 48px 0;
    color: #aaa;
    font-size: 14px;
  }

  footer {
    text-align: center;
    padding: 32px;
    font-size: 12px;
    color: #bbb;
  }
</style>
</head>
<body>

<header>
  <div class="label">WCARE ANIMAL MEDICAL CENTER · RESEARCH</div>
  <h1>소동물 최신 수의학 논문</h1>
  <p>PubMed 주요 저널에서 매일 자동으로 업데이트됩니다</p>
</header>

<div class="filter-bar">
  <span>분야 필터</span>
  <button class="filter-btn active" onclick="filterBy('all')">전체</button>
  <button class="filter-btn" onclick="filterBy('cardiology')">심장</button>
  <button class="filter-btn" onclick="filterBy('internal')">내과</button>
  <button class="filter-btn" onclick="filterBy('oncology')">종양</button>
  <button class="filter-btn" onclick="filterBy('surgery')">외과</button>
  <button class="filter-btn" onclick="filterBy('neurology')">신경</button>
  <button class="filter-btn" onclick="filterBy('dermatology')">피부</button>
</div>

<div class="container">
  <div class="update-info">
    <span class="update-dot"></span>
    <span id="update-time">논문을 불러오는 중...</span>
  </div>
  <div id="paper-list">
    <div class="loading">
      <div class="loading-spinner"></div>
      최신 논문을 불러오는 중입니다...
    </div>
  </div>
</div>

<footer>© 위케어동물의료센터 · 데이터 출처: PubMed (NCBI)</footer>

<script>
const JOURNALS = [
  { name: 'AJVR', query: '"Am J Vet Res"[jour]' },
  { name: 'JVIM', query: '"J Vet Intern Med"[jour]' },
  { name: 'JVCS', query: '"J Vet Cardiol"[jour]' },
  { name: 'Vet J', query: '"Vet J"[jour]' },
  { name: 'BMC Vet Res', query: '"BMC Vet Res"[jour]' },
  { name: 'JSAP', query: '"J Small Anim Pract"[jour]' },
  { name: 'Vet Clin Pathol', query: '"Vet Clin Pathol"[jour]' },
  { name: 'JAVMA', query: '"J Am Vet Med Assoc"[jour]' },
];

const CATEGORY_KEYWORDS = {
  cardiology: ['cardiac','heart','mitral','cardiomyopathy','arrhythmia','torsemide','tolvaptan','diuretic','valve'],
  internal: ['kidney','renal','liver','hepatic','diabetes','endocrine','azotemia','nephrology','pancreatitis'],
  oncology: ['tumor','cancer','neoplasia','lymphoma','mast cell','sarcoma','oncology'],
  surgery: ['surgery','surgical','fracture','orthopedic','laparoscopy','wound'],
  neurology: ['neuro','epilepsy','seizure','spinal','brain','vestibular','disc'],
  dermatology: ['skin','dermatitis','atopy','pruritus','alopecia','allergy','dermatology'],
};

let allPapers = [];
let currentFilter = 'all';

function categorize(paper) {
  const text = (paper.title + ' ' + (paper.abstract || '')).toLowerCase();
  for (const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
    if (keywords.some(k => text.includes(k))) return cat;
  }
  return 'other';
}

function isNew(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  return (now - d) < 7 * 24 * 60 * 60 * 1000;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

async function fetchPapers(journalQuery, journalName) {
  const base = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
  const searchQuery = encodeURIComponent(`(${journalQuery}) AND ("dogs"[tiab] OR "cats"[tiab] OR "feline"[tiab] OR "canine"[tiab] OR "small animal"[tiab])`);
  const searchUrl = `${base}esearch.fcgi?db=pubmed&term=${searchQuery}&retmax=10&sort=pub+date&retmode=json`;

  const searchRes = await fetch(searchUrl);
  const searchData = await searchRes.json();
  const ids = searchData.esearchresult?.idlist || [];
  if (!ids.length) return [];

  const summaryUrl = `${base}esummary.fcgi?db=pubmed&id=${ids.join(',')}&retmode=json`;
  const summaryRes = await fetch(summaryUrl);
  const summaryData = await summaryRes.json();
  const result = summaryData.result || {};

  return ids.map(id => {
    const item = result[id];
    if (!item) return null;
    return {
      id,
      title: item.title?.replace(/<[^>]+>/g, '') || '제목 없음',
      authors: item.authors?.map(a => a.name).join(', ') || '',
      journal: journalName,
      date: item.pubdate || '',
      abstract: item.abstract || '',
      url: `https://pubmed.ncbi.nlm.nih.gov/${id}/`,
    };
  }).filter(Boolean);
}

function renderPapers() {
  const list = document.getElementById('paper-list');
  const filtered = currentFilter === 'all'
    ? allPapers
    : allPapers.filter(p => categorize(p) === currentFilter);

  if (!filtered.length) {
    list.innerHTML = '<div class="no-result">해당 분야의 최신 논문이 없습니다.</div>';
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="paper-card">
      <div class="paper-meta">
        <span class="journal-badge">${p.journal}</span>
        <span class="date-badge">${formatDate(p.date)}</span>
        ${isNew(p.date) ? '<span class="new-badge">NEW</span>' : ''}
      </div>
      <div class="paper-title">
        <a href="${p.url}" target="_blank" rel="noopener">${p.title}</a>
      </div>
      <div class="paper-authors">${p.authors}</div>
      ${p.abstract ? `<div class="paper-abstract">${p.abstract}</div>` : ''}
      <div class="paper-footer">
        <span></span>
        <a class="pubmed-link" href="${p.url}" target="_blank" rel="noopener">PubMed에서 보기 →</a>
      </div>
    </div>
  `).join('');
}

function filterBy(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderPapers();
}

async function init() {
  try {
    const results = await Promise.allSettled(
      JOURNALS.map(j => fetchPapers(j.query, j.name))
    );

    allPapers = results
      .filter(r => r.status === 'fulfilled')
      .flatMap(r => r.value)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    const now = new Date();
    document.getElementById('update-time').textContent =
      `마지막 업데이트: ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} · 총 ${allPapers.length}편`;

    renderPapers();
  } catch (e) {
    document.getElementById('paper-list').innerHTML =
      '<div class="error-box">논문을 불러오는 중 오류가 발생했습니다.<br>잠시 후 다시 시도해주세요.</div>';
  }
}

init();
</script>
</body>
</html>
