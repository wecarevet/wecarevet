<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>LoL 매니저 HUD 폭 검증 (폴드 펼침·커버)</title>
<style>
  html,body{margin:0;background:#15171b;color:#9aa2b2;font:12px/1.4 system-ui,sans-serif}
  .wrap{padding:8px}
  .lab{margin:0 0 4px;font-weight:800}
  iframe{border:1px solid #333;background:#000;display:block}
</style>
</head>
<body>
<div class="wrap"><div class="lab" id="lab"></div><iframe id="fr" src="lol-manager.html?v=34.12.1"></iframe></div>
<script>
/* 검증용 임시 하네스 — 지정 뷰포트(폴드 펼침/커버)로 실제 경기를 띄우고 아이템 6칸이 보이는지 확인한다.
   ?w=673&h=841&sp=8  (뷰포트 폭/높이, 배속) */
var q=new URLSearchParams(location.search);
var W=parseInt(q.get('w')||'673',10), H=parseInt(q.get('h')||'841',10), SP=parseFloat(q.get('sp')||'8');
var fr=document.getElementById('fr');
fr.width=W; fr.height=H;
/* 캐시 방지 — 같은 ?v 라도 새 파일을 받도록 */
fr.src='lol-manager.html?v=34.12.1&cb='+(q.get('cb')||Date.now());
var lab=document.getElementById('lab');
lab.textContent=W+' x '+H+' — 경기 HUD (아이템 6칸)';
fr.addEventListener('load',function(){
  var w=fr.contentWindow;
  function G(){ return w.__game; }
  function boot(){
    try{
      w.createState('T1');
      var s=w.createSeries('GEN',3,'regular',{}); s.meta.pressDone=true;
      w.startDraft(s); w.autoDraftRun();
      var D=G().D;
      D.assign.me=w.recommendAssign(w.dMyPicks());
      D.assign.opp=w.aiAssign(w.dOppPicks(),D.oppId);
      D.result=w.evalDraft();
      w.startMatch(D.result);
      var M=G().M;
      M.running=true; M.speed=SP;
      w.mmReset(); w.mmJumpTargets();
      w.renderMatch();
      try{ w.mmStart(); }catch(e){}
      setInterval(function(){
        var it=0, n=0;
        try{ ROLES.forEach(function(r){ ['me','opp'].forEach(function(sd){ var st=M.items&&M.items[sd]&&M.items[sd][r]; it+=(st&&st.bought)?st.bought.length:0; n++; }); }); }catch(e){}
        lab.textContent=W+' x '+H+' — '+M.minute+'분 · 아이템 '+it+'개';
        document.title='OK '+W+'x'+H+' '+M.minute+'분 item='+it;
      },1500);
    }catch(e){ document.title='ERR '+e; lab.textContent='ERR '+e; }
  }
  setTimeout(boot,400);
});
</script>
</body>
</html>
