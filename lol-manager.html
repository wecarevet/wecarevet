/* ---------- 가치 · 요구액 ---------- */
function stoveMarketSalary(p){
  const ovr=rawOverall(p);
  const raw=Math.pow(Math.max(ovr,50)-54,1.62)/11*2;
  return Math.max(0.5,Math.round(raw*2)/2);
}
function stoveDemand(p,years){
  const yrs=clamp(Math.round(Number(years)||2),1,3);
  const base=Math.max(p.salary||0.5,stoveMarketSalary(p));
  const ageF=p.age<=21?1.14:p.age<=23?1.07:p.age<=26?1.0:p.age<=28?0.93:0.86;
  const formF=0.96+((p.form||70)/100)*0.1;
  const gradeF=({'S+':1.15,'S':1.12,'A+':1.08,'A':1.05,'B+':1.0,'B':0.95,'B-':0.95,'C':0.9})[p.grade]||1;
  const yrsF=yrs>=3?0.96:yrs===1?1.04:1;
  return Math.max(0.5,Math.round(base*ageF*formF*gradeF*yrsF*10)/10);
}
function stoveValue(p){
  if(!p) return 0;
  const ovr=rawOverall(p);
  const ageF=p.age<=20?1.3:p.age<=22?1.2:p.age<=24?1.1:p.age<=26?1.0:p.age<=28?0.85:p.age<=30?0.7:0.5;
  const potF=1+Math.max(0,(24-(p.age||24)))*0.02;
  return Math.round(Math.pow(Math.max(ovr-40,1),1.55)*ageF*potF/10)/10;
}

/* ---------- 1) 재계약 협상 (연봉·계약기간) ---------- */
function stoveReSign(name,salary,years){
  stoveInit();
  const p=S.players[name];
  if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  if(p.team!==t.id) return {ok:false,msg:'우리 팀 소속 선수가 아닙니다'};
  const yrs=clamp(Math.round(Number(years)||2),1,3);
  const sal=Math.max(0.5,Math.round((Number(salary)||p.salary)*10)/10);
  const demand=stoveDemand(p,yrs);
  const bonus=Math.round(sal*0.4*10)/10;
  if(t.budget<bonus) return {ok:false,msg:'예산 부족 — 계약금 '+bonus.toFixed(1)+'억 필요',demand:demand};
  const c=(typeof clubC==='function')?clubC():null;
  const loyalty=(((c&&c.trust)||55)-50)/100*0.12+((t.wins||0)-(t.losses||0))*0.004
    +(((p.form||70)-70)*0.0008)+((p.persons||[]).indexOf('loyal')>=0?0.06:0);
  const fit=sal/demand-1+loyalty;
  const accept=fit>=0||Math.random()<Math.max(0,1+fit*3)*0.25;
  if(accept){
    t.budget=Math.round((t.budget-bonus)*10)/10;
    const old=p.salary;
    p.salary=sal; p.contract=yrs;
    if(S.offseason&&Array.isArray(S.offseason.players)) S.offseason.players=S.offseason.players.filter(n=>n!==name);
    stoveLog('resign',name+' 재계약 — 연봉 '+sal.toFixed(1)+'억 · '+yrs+'년');
    try{ newsAdd('계약','📝 '+name+' 재계약 — 연봉 '+sal.toFixed(1)+'억(기존 '+old+'억) · '+yrs+'년 · 계약금 '+bonus.toFixed(1)+'억'); }catch(e){}
    if(sal>=demand*1.08) stoveReaction(true,'resign',{p:name});
    saveGame();
    return {ok:true,msg:name+' 재계약 완료 — 연봉 '+sal.toFixed(1)+'억 · '+yrs+'년 (계약금 '+bonus.toFixed(1)+'억)',demand:demand,bonus:bonus};
  }
  const counter=Math.round(demand*0.98*10)/10;
  p.form=clamp((p.form||70)-2,10,100);
  stoveLog('reject',name+' 재계약 협상 결렬 — 요구 '+counter.toFixed(1)+'억');
  saveGame();
  return {ok:false,msg:name+' 측 거절 — 요구 연봉 '+counter.toFixed(1)+'억 이상 필요',demand:demand,counter:counter};
}

/* ---------- 2) FA 입찰 (경쟁 구단과 경합) ---------- */
function stoveRivals(name){
  const p=S.players[name];
  if(!p) return [];
  return Object.values(S.teams).filter(t=>t.id!==S.userTeam&&t.roster.length<9)
    .map(t=>{
      const cur=t.lineup[p.role]?S.players[t.lineup[p.role]]:null;
      const need=!cur||rawOverall(cur)<rawOverall(p)+4;
      const v=clamp(((teamPower(t)-66)/28)+(t.budget>14?0.18:-0.12)+(need?0.22:-0.18)+Math.random()*0.5,-1,1);
      return {id:t.id,t:t,v:v,need:need};
    })
    .filter(r=>r.v>-0.2)
    .sort((a,b)=>b.v-a.v).slice(0,3);
}
function stoveFaOffer(name,salary,years){
  stoveInit();
  const p=S.players[name];
  if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  if(!p.fa||p.team) return {ok:false,msg:'이미 영입된 선수입니다'};
  const t=myTeam();
  if(t.roster.length>=9) return {ok:false,msg:'로스터 정원 초과 (최대 9명)'};
  const yrs=clamp(Math.round(Number(years)||2),1,3);
  const sal=Math.max(0.5,Math.round((Number(salary)||p.salary)*10)/10);
  const fee=Math.round((p.fee||p.salary*1.7)*10)/10;
  const bonus=Math.round(sal*0.3*10)/10;
  const cost=Math.round((fee+bonus)*10)/10;
  if(t.budget<cost) return {ok:false,msg:'예산 부족 — 이적료 '+fee.toFixed(1)+'억 + 계약금 '+bonus.toFixed(1)+'억 = '+cost.toFixed(1)+'억'};
  const demand=stoveDemand(p,yrs);
  const rivals=stoveRivals(name);
  let bestRival=0,bestTeam=null;
  rivals.forEach(r=>{
    const offer=Math.round(demand*(0.96+r.v*0.26)*10)/10;
    if(offer>bestRival){ bestRival=offer; bestTeam=r.id; }
  });
  const myPower=teamPower(t), rvPower=bestTeam?teamPower(T(bestTeam)):0;
  const myScore=sal+((myPower-rvPower)*0.04);
  const rivalScore=bestRival;
  if(!bestTeam||myScore>=rivalScore){
    t.budget=Math.round((t.budget-cost)*10)/10;
    p.team=t.id; p.fa=false; p.contract=yrs; p.salary=sal;
    t.roster.push(p.name);
    stoveFillLineup(t.id);
    stoveLog('fa',name+' 영입 — 연봉 '+sal.toFixed(1)+'억 · '+yrs+'년 · 이적료 '+fee.toFixed(1)+'억');
    try{ newsAdd('이적','✍️ '+name+' 영입 완료 — 연봉 '+sal.toFixed(1)+'억 · '+yrs+'년 · 이적료 '+fee.toFixed(1)+'억'+(rivals.length?' (경쟁 '+rivals.map(x=>x.t.tag).join('·')+' 제압)':'')); }catch(e){}
    stoveReaction(true,'fa',{p:name});
    saveGame();
    return {ok:true,msg:name+' 영입 완료 — 연봉 '+sal.toFixed(1)+'억 · '+yrs+'년 (이적료 '+fee.toFixed(1)+'억)',rivals:rivals.map(x=>x.t.tag),cost:cost};
  }
  /* 경쟁 구단에 밀림 */
  const winT=T(bestTeam);
  p.team=bestTeam; p.fa=false; p.contract=yrs; p.salary=bestRival;
  winT.roster.push(p.name); stoveFillLineup(bestTeam);
  stoveLog('fa-fail',name+' 영입 경쟁 패배 — '+winT.name+' 연봉 '+bestRival.toFixed(1)+'억');
  try{ newsAdd('이적','❌ '+name+' 영입 경쟁 패배 — '+winT.name+'와(과) 연봉 '+bestRival.toFixed(1)+'억에 계약'); }catch(e){}
  stoveReaction(false,'fa',{p:name});
  saveGame();
  return {ok:false,msg:name+' 영입 실패 — '+winT.name+'가 연봉 '+bestRival.toFixed(1)+'억을 제시했습니다 (내 제시 '+sal.toFixed(1)+'억)',rival:winT.name,rivalSalary:bestRival};
}

/* ---------- 3) 트레이드 · 현금 영입 ---------- */
function stoveFillLineup(id){
  const t=T(id); if(!t) return;
  ROLES.forEach(r=>{
    const cur=t.lineup[r]?S.players[t.lineup[r]]:null;
    if(cur&&cur.team===id) return;
    const best=t.roster.map(n=>S.players[n]).filter(p=>p&&p.team===id&&p.role===r).sort((a,b)=>rawOverall(b)-rawOverall(a))[0];
    if(best) t.lineup[r]=best.name; else delete t.lineup[r];
  });
}
function stoveTradePropose(theirName,myName,cash){
  stoveInit();
  const st=stoveInit();
  const tp=S.players[theirName], mp=S.players[myName];
  if(!tp) return {ok:false,msg:'영입 대상 선수를 선택하세요'};
  if(!tp.team||tp.team===S.userTeam) return {ok:false,msg:'상대 구단 소속 선수를 선택하세요'};
  if(!mp||mp.team!==S.userTeam) return {ok:false,msg:'내 선수를 선택하세요'};
  const t=myTeam(), theirT=T(tp.team);
  if(theirT.roster.length<=6) return {ok:false,msg:theirT.name+' 로스터가 6명 이하라 트레이드를 받지 않습니다'};
  const money=Math.max(0,Math.round((Number(cash)||0)*10)/10);
  if(money>t.budget) return {ok:false,msg:'예산 부족 (현금 '+money.toFixed(1)+'억)'};
  const vT=stoveValue(tp), vM=stoveValue(mp);
  let need=vT*(1+(tp.age<=21?0.08:0));
  if(tp.role!==mp.role) need*=1.14;
  if(rawOverall(tp)>=86&&rawOverall(tp)>=rawOverall(mp)+6) need*=1.22;
  const offer=vM+money*2.2;
  const accept=offer>=need*(1+(Math.random()-0.5)*0.12);
  if(!accept){
    const ask=Math.max(0,Math.ceil(((need-vM)/2.2)*10)/10);
    stoveLog('trade-fail',tp.name+' 트레이드 거절 — 현금 '+ask.toFixed(1)+'억 이상 필요');
    return {ok:false,msg:theirT.name+' 거절 — 내 선수 가치가 부족합니다 (현금 '+ask.toFixed(1)+'억 이상 필요)',need:Math.round(need*10)/10,ask:ask};
  }
  const from=tp.team;
  t.budget=Math.round((t.budget-money)*10)/10;
  theirT.budget=Math.round((theirT.budget+money)*10)/10;
  tp.team=t.id; mp.team=theirT.id;
  t.roster=t.roster.filter(n=>n!==mp.name); t.roster.push(tp.name);
  theirT.roster=theirT.roster.filter(n=>n!==tp.name); theirT.roster.push(mp.name);
  Object.keys(t.lineup).forEach(r=>{ if(t.lineup[r]===mp.name) delete t.lineup[r]; });
  Object.keys(theirT.lineup).forEach(r=>{ if(theirT.lineup[r]===tp.name) delete theirT.lineup[r]; });
  stoveFillLineup(t.id); stoveFillLineup(theirT.id);
  const good=stoveValue(tp)>=stoveValue(mp);
  const rec={k:'trade',text:mp.name+' ↔ '+tp.name+(money?' + '+money.toFixed(1)+'억':''),season:S.season,week:S.week,
    with:theirT.name,money:money};
  st.trades.unshift(rec); if(st.trades.length>20) st.trades.pop();
  stoveLog('trade',rec.text+' ('+theirT.name+')');
  try{ newsAdd('이적','🔄 트레이드 성사 — '+mp.name+' ↔ '+tp.name+(money?' + '+money.toFixed(1)+'억':'')); }catch(e){}
  stoveReaction(good,'trade',{a:mp.name,b:tp.name});
  saveStateAfterStove();
  return {ok:true,msg:'트레이드 성사 — '+mp.name+' ↔ '+tp.name+(money?' + '+money.toFixed(1)+'억':''),trade:rec};
}
function stoveBuyout(theirName,cash){
  stoveInit();
  const p=S.players[theirName];
  if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  if(!p.team||p.team===S.userTeam) return {ok:false,msg:'상대 구단 소속 선수만 제안할 수 있습니다'};
  const t=myTeam(), theirT=T(p.team);
  if(theirT.roster.length<=6) return {ok:false,msg:theirT.name+' 로스터가 6명 이하라 이적료 제안을 받지 않습니다'};
  const money=Math.round((Number(cash)||0)*10)/10;
  if(money<=0) return {ok:false,msg:'이적료를 입력하세요'};
  if(money>t.budget) return {ok:false,msg:'예산 부족 (제안 '+money.toFixed(1)+'억)'};
  if(t.roster.length>=9) return {ok:false,msg:'로스터 정원 초과 (최대 9명)'};
  const val=stoveValue(p);
  const need=Math.round(val*(p.age<=22?1.5:1.25)*10)/10;
  if(money<need) return {ok:false,msg:theirT.name+' 거절 — 요구 이적료 '+need.toFixed(1)+'억 이상',need:need};
  const from=p.team;
  t.budget=Math.round((t.budget-money)*10)/10;
  theirT.budget=Math.round((theirT.budget+money)*10)/10;
  p.team=t.id; p.fa=false;
  theirT.roster=theirT.roster.filter(n=>n!==p.name);
  Object.keys(theirT.lineup).forEach(r=>{ if(theirT.lineup[r]===p.name) delete theirT.lineup[r]; });
  t.roster.push(p.name);
  stoveFillLineup(t.id); stoveFillLineup(from);
  const st=stoveInit();
  st.trades.unshift({k:'buy',text:'현금 '+money.toFixed(1)+'억 → '+p.name,season:S.season,week:S.week,with:theirT.name,money:money});
  if(st.trades.length>20) st.trades.pop();
  stoveLog('buy',theirT.name+' '+p.name+' 현금 '+money.toFixed(1)+'억 영입');
  try{ newsAdd('이적','💰 '+p.name+' 영입 — '+theirT.name+'에 이적료 '+money.toFixed(1)+'억 지급'); }catch(e){}
  stoveReaction(true,'fa',{p:p.name});
  saveStateAfterStove();
  return {ok:true,msg:theirT.name+' '+p.name+' 영입 완료 — 이적료 '+money.toFixed(1)+'억'};
}

/* ============ CHEM: 선수 케미 · 듀오 시너지 · 라커룸 불화 ============ */
const CHEM_BAD=['hothead','maverick','genius','glassmental','perfectionist','trashtalker'];
const CHEM_GOOD=['moodmaker','teamfirst','mentalcarer','loyalist','orderleader','clown','ironheart'];
const CHEM_POS_KR={TOP:'탑',JGL:'정글',MID:'미드',ADC:'원딜',SUP:'서폿'};

function chemKey(a,b){ return [String(a),String(b)].sort().join('|'); }
function chemInit(){
  if(!S) return null;
  if(!S.chem||typeof S.chem!=='object') S.chem={pairs:{},drama:[],log:[]};
  const c=S.chem;
  if(!c.pairs||typeof c.pairs!=='object') c.pairs={};
  if(!Array.isArray(c.drama)) c.drama=[];
  if(!Array.isArray(c.log)) c.log=[];
  const t=S.teams[S.userTeam];
  if(t){
    const names=(t.roster||[]).slice();
    for(let i=0;i<names.length;i++){
      for(let j=i+1;j<names.length;j++){
        const k=chemKey(names[i],names[j]);
        if(c.pairs[k]==null) c.pairs[k]=chemSeed(names[i],names[j]);
      }
    }
  }
  return c;
}
function chemSeed(a,b){
  const pa=S&&S.players?S.players[a]:null;
  const pb=S&&S.players?S.players[b]:null;
  if(!pa||!pb) return 50;
  let v=50;
  v+=(persMod(pa,'chem','avg')+persMod(pb,'chem','avg'))*7;
  const A=pa.persons||[], B=pb.persons||[];
  let clash=0;
  A.concat(B).forEach(k=>{
    if(CHEM_BAD.indexOf(k)>=0) clash+=1;
    else if(CHEM_GOOD.indexOf(k)>=0) clash-=0.55;
  });
  v-=clash*4.5;
  if(pa.role===pb.role) v-=7;                 /* 같은 포지션 경쟁 */
  if(pa.role==='MID'&&pb.role==='JGL') v+=4;   /* 미드-정글 기본 시너지 */
  if((pa.role==='ADC'&&pb.role==='SUP')||(pa.role==='SUP'&&pb.role==='ADC')) v+=5;
  if(Math.abs((pa.age||24)-(pb.age||24))>=6) v-=3;
  v+=(hashN(String(a)+String(b))%11)-5;
  return clamp(Math.round(v),5,96);
}
function chemOf(a,b,teamId){
  if(!S||!a||!b) return 50;
  const mine=(teamId&&teamId===S.userTeam)||(!teamId&&S.players[a]&&S.players[a].team===S.userTeam);
  if(mine){
    const c=chemInit();
    const k=chemKey(a,b);
    return c.pairs[k]!=null?c.pairs[k]:chemSeed(a,b);
  }
  return chemSeed(a,b);
}
function chemLevel(v){
  if(v>=82) return {k:'duo',n:'환상의 듀오',ic:'💞',col:'#ff8ade'};
  if(v>=70) return {k:'best',n:'절친',ic:'🤝',col:'#7cf7ff'};
  if(v>=50) return {k:'ok',n:'보통',ic:'🙂',col:'#9aa2b2'};
  if(v>=35) return {k:'cool',n:'서먹함',ic:'😐',col:'#ffc94a'};
  return {k:'feud',n:'불화',ic:'💢',col:'#ff5c6e'};
}
function chemTeamPairs(teamId){
  const t=T(teamId||S.userTeam); if(!t) return [];
  const ps=(t.roster||[]).map(n=>S.players[n]).filter(Boolean).slice(0,9);
  const out=[];
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
    out.push({a:ps[i].name,b:ps[j].name,v:chemOf(ps[i].name,ps[j].name,t.id),
      la:ps[i].role,lb:ps[j].role});
  }
  return out.sort((x,y)=>y.v-x.v);
}
/* 미드-정글 · 봇듀오 시너지 → 경기력 보정 */
function chemRoleEdge(team){
  if(!team) return 0;
  const mid=S.players[team.lineup.MID], jgl=S.players[team.lineup.JGL];
  const adc=S.players[team.lineup.ADC], sup=S.players[team.lineup.SUP];
  let e=0;
  if(mid&&jgl) e+=((chemOf(mid.name,jgl.name,team.id)-50)/50)*0.42;
  if(adc&&sup) e+=((chemOf(adc.name,sup.name,team.id)-50)/50)*0.30;
  return clamp(e,-0.5,0.5);
}
function chemTeamScore(teamId){
  const t=T(teamId||S.userTeam); if(!t) return 50;
  const ps=ROLES.map(r=>S.players[t.lineup[r]]).filter(Boolean);
  if(ps.length<2) return 50;
  let s=0,n=0;
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){ s+=chemOf(ps[i].name,ps[j].name,t.id); n++; }
  return n?Math.round(s/n):50;
}
/* 경기 후 케미 변화 */
function chemAfterGame(win){
  if(!S) return;
  const c=chemInit(); if(!c) return;
  const t=myTeam();
  const starters=ROLES.map(r=>S.players[t.lineup[r]]).filter(Boolean);
  const delta=win?1:-1;
  for(let i=0;i<starters.length;i++) for(let j=i+1;j<starters.length;j++){
    const k=chemKey(starters[i].name,starters[j].name);
    const cur=c.pairs[k]!=null?c.pairs[k]:chemSeed(starters[i].name,starters[j].name);
    const swing=win?rnd(0.8,2.2):-rnd(0.6,2.6);
    c.pairs[k]=clamp(Math.round((cur+swing)*10)/10,5,96);
  }
  /* 불화 이벤트 판정 */
  chemDramaCheck(win);
  try{ saveGame(); }catch(e){}
}
function chemDramaCheck(win){
  const c=chemInit(); if(!c) return null;
  if(c.drama.some(d=>!d.resolved)) return null;
  const pairs=chemTeamPairs(S.userTeam);
  const worst=pairs.slice().reverse()[0];
  if(!worst) return null;
  const t=myTeam();
  const losing=(t.losses>=2&&t.wins<t.losses+1);
  const chance=win?0.06:(worst.v<40?0.55:worst.v<52?0.28:0.10)+(losing?0.12:0);
  if(Math.random()>chance) return null;
  const pa=S.players[worst.a], pb=S.players[worst.b];
  if(!pa||!pb) return null;
  const kinds=[
    {k:'argument', t:pa.name+'와(과) '+pb.name+'이(가) 스크림 피드백 중 언성을 높였습니다'},
    {k:'silent', t:pb.name+'이(가) '+pa.name+'의 콜을 무시한다는 이야기가 돕니다'},
    {k:'tilt', t:pa.name+'이(가) 연패 후 혼자 솔로랭크만 돌리고 있습니다'},
    {k:'blame', t:'경기 복기에서 '+pa.name+'와(과) '+pb.name+'이(가) 서로의 판단을 문제 삼았습니다'},
  ];
  const kind=pickOf(kinds);
  const d={id:'d'+Date.now()+'-'+Math.floor(Math.random()*999), a:worst.a, b:worst.b,
    kind:kind.k, text:kind.t, v:worst.v, week:S.week, season:S.season, resolved:false, at:Date.now()};
  c.drama.unshift(d);
  if(c.drama.length>12) c.drama.length=12;
  try{ newsAdd('라커룸','🔥 '+d.text+' — 케미 '+Math.round(worst.v)+' ('+chemLevel(worst.v).n+'). 구단 › 선수단에서 중재하세요.'); }catch(e){}
  return d;
}

const CHEM_ACTIONS=[
  {k:'mediate', n:'구단주 직접 중재', d:'직접 불러 앉혀 이야기합니다 (비용 없음)', cost:0, gain:[6,14], trust:-1},
  {k:'dinner',  n:'팀 회식 · 워크숍', d:'예산 1.5억으로 분위기를 바꿉니다', cost:1.5, gain:[14,24], fan:1},
  {k:'talk',    n:'1:1 면담', d:'한 명씩 따로 만나 정리합니다', cost:0, gain:[4,10], form:2},
  {k:'warn',    n:'엄중 경고', d:'공개 경고로 긴장감을 조성합니다', cost:0, gain:[0,4], trust:-3, fan:-2},
  {k:'swap',    n:'2군 강등 · 주전 교체', d:'문제의 선수를 벤치로 내립니다', cost:0, gain:[-2,6], trust:-2, swap:true},
];
function chemResolve(id,kind){
  const c=chemInit(); if(!c) return {ok:false,msg:'케미 데이터가 없습니다'};
  const d=(c.drama||[]).find(x=>x.id===id);
  if(!d||d.resolved) return {ok:false,msg:'이미 해결된 사건입니다'};
  const act=CHEM_ACTIONS.find(a=>a.k===kind)||CHEM_ACTIONS[0];
  const t=myTeam();
  if(act.cost&&t.budget<act.cost) return {ok:false,msg:'예산 부족 ('+act.cost+'억 필요)'};
  if(act.cost){ t.budget=Math.round((t.budget-act.cost)*10)/10; }
  const k=chemKey(d.a,d.b);
  const cur=c.pairs[k]!=null?c.pairs[k]:chemSeed(d.a,d.b);
  const gain=ri(act.gain[0],act.gain[1]);
  c.pairs[k]=clamp(Math.round((cur+gain)*10)/10,5,96);
  /* 같은 라인 다른 동료에게도 약간 파급 */
  const ps=lineupOf(myTeam()).filter(p=>p&&p.name!==d.a&&p.name!==d.b);
  ps.forEach(p=>{
    const kk=chemKey(p.name,d.a);
    if(c.pairs[kk]!=null) c.pairs[kk]=clamp(Math.round((c.pairs[kk]+gain*0.15)*10)/10,5,96);
  });
  const cl=S.club;
  if(cl){
    cl.trust=clamp((cl.trust||55)+(act.trust||0),1,100);
    cl.fanbase=clamp((cl.fanbase||50)+(act.fan||0),1,100);
    cl.community=null;
  }
  if(act.form){
    [d.a,d.b].forEach(n=>{ const p=S.players[n]; if(p) p.form=clamp((p.form||70)+act.form,10,100); });
  }
  if(act.swap){
    const p=S.players[d.a], q=S.players[d.b];
    const tgt=(p&&p.role)?p:q;
    if(tgt){
      const bench=t.roster.map(n=>S.players[n]).filter(x=>x&&x.role===tgt.role&&x.name!==tgt.name&&!Object.values(t.lineup).includes(x.name));
      if(bench.length){ setStarter(tgt.role,bench[0].name); }
      if(p) p.form=clamp((p.form||70)-8,10,100);
    }
  }
  d.resolved=true; d.choice=act.k;
  c.log.unshift({k:'resolve',text:act.n+' — '+d.a+' · '+d.b+' 케미 '+Math.round(cur)+'→'+Math.round(c.pairs[k]),week:S.week,season:S.season});
  if(c.log.length>30) c.log.pop();
  try{ newsAdd('라커룸','🛠 '+act.n+' — '+d.a+' · '+d.b+' 케미 '+Math.round(c.pairs[k])+'로 회복'); }catch(e){}
  try{ saveGame(); }catch(e){}
  return {ok:true,msg:act.n+' 완료 — 케미 '+Math.round(c.pairs[k]),drama:d};
}
function chemPlayerPairs(name){
  if(!S||!name) return [];
  const p=S.players[name]; if(!p||!p.team) return [];
  const t=T(p.team);
  return (t.roster||[]).map(n=>S.players[n]).filter(x=>x&&x.name!==name)
    .map(x=>({name:x.name,role:x.role,v:chemOf(name,x.name,t.id)}))
    .sort((a,b)=>b.v-a.v);
}

const COACH_TRAITS_DEF=['scrimMaster','laneCoach','condition','cureExpert','potential','macroCoach'];
function coachSupport(){
  const s=(typeof staffOf==='function'&&S)?staffOf(S.userTeam):{head:null,coaches:[]};
  const head=s.head, coaches=s.coaches||[];
  const traits={};
  [head].concat(coaches).filter(Boolean).forEach(st=>(st.traits||[]).forEach(t=>{ traits[t]=1; }));
  const coachTraits={};
  coaches.filter(Boolean).forEach(st=>(st.traits||[]).forEach(t=>{ coachTraits[t]=1; }));
  return {head:head, coaches:coaches, traits:traits, coachTraits:coachTraits, rating:head?head.rating:0};
}
function tacticUnlocked(k){
  const r=TACTIC_REQ[k];
  if(!r) return {ok:true, bonus:0, req:null, why:''};
  const c=coachSupport();
  if(r.trait&&c.traits[r.trait]) return {ok:true, bonus:r.bonus, req:r, why:r.label+' 특성'};
  if(r.alt==='rating'&&c.rating>=r.rating) return {ok:true, bonus:Math.round(r.bonus*0.6*1000)/1000, req:r, why:'감독 레이팅 '+c.rating};
  if(r.alt==='coachTrait'&&(c.coachTraits[r.trait]||c.rating>=82)) return {ok:true, bonus:Math.round(r.bonus*0.7*1000)/1000, req:r, why:'코치진 설계'};
  return {ok:false, bonus:0, req:r, why:r.why||''};
}
function tacticEdgeBonus(k){
  if(!k) return 0;
  const u=tacticUnlocked(k);
  return u.ok?(u.bonus||0):0;
}
function tacCoachBadge(k){
  const u=tacticUnlocked(k);
  if(!u.req) return '';
  if(u.ok) return `<em class="tac-badge on" title="${esc(u.why)}">코치</em>`;
  return `<em class="tac-badge off" title="필요: ${esc(u.req.label||u.req.why)}">🔒</em>`;
}
function coachTacticList(){
  return Object.keys(TACTIC_REQ).map(k=>FOCUS_MAP[k]).filter(Boolean);
}

/* lol.ps 실측(패치 26.22) 기반 훈수 — 승률·상성·밴률을 실제 집계값으로 말한다 */
function coachLolpsTips(phase, myP, opP){
  const out=[];
  if(typeof lolpsBoard!=='function'||typeof lolpsOf!=='function') return out;
  if(!lolpsBoard('ALL').length) return out;
  const used=typeof dUsed==='function'?dUsed():[];
  if(phase==='ban'){
    const avail=lolpsBoard('ALL').filter(x=>used.indexOf(x.n)<0);
    const pick=avail[0];
    if(pick) out.push({k:'ps', t:'lol.ps 26.22 실측 최상위: '+pick.n+' ('+ROLE_KR[pick.role]+' 승률 '+lolpsPct(pick.wr)+' · 픽률 '+lolpsPct(pick.pr)+' · 밴률 '+lolpsPct(pick.br)+') — 밴 가치가 가장 큽니다'});
    const banTop=avail.slice().sort((a,b)=>b.br-a.br)[0];
    if(banTop&&(!pick||banTop.n!==pick.n)) out.push({k:'ps', t:'밴률 1위는 '+banTop.n+' ('+lolpsPct(banTop.br)+' · 승률 '+lolpsPct(banTop.wr)+') — 상대도 노리는 카드입니다'});
  }
  if(opP&&opP.length){
    // 상대 픽을 잡는 실측 카운터 (그 챔프가 지는 상대 = 우리 카드)
    const opp=opP[opP.length-1];
    const cnt=(typeof lolpsCounterList==='function'?lolpsCounterList(opp,'weak'):[])
      .filter(x=>used.indexOf(x.n)<0).slice(0,2);
    if(cnt.length) out.push({k:'ps', t:'상대 '+opp+' 상대로는 '+cnt.map(x=>x.n+'('+(100-x.wr).toFixed(1)+'% · '+x.cnt.toLocaleString()+'표본)').join(' / ')+' 가 실측 카운터입니다'});
    if(myP&&myP.length){
      const me=myP[myP.length-1];
      const vs=(typeof lolpsVs==='function')?lolpsVs(me,opp):null;
      if(vs&&vs.cnt>=200){
        out.push({k:'ps', t:'내 '+me+' vs 상대 '+opp+' = 실측 '+lolpsPct(vs.wr)+(vs.wr>=50?' (유리)':' (열세)')+' · '+vs.cnt.toLocaleString()+'표본'});
      }
    }
  }
  if(phase==='pick'&&myP&&myP.length){
    // 우리 픽의 실측 승률로 픽 상태 점검
    const rows=myP.map(n=>{const s=(typeof lolpsLaneStat==='function')?lolpsLaneStat(n):null; return s?{n:n,s:s}:null;}).filter(Boolean);
    if(rows.length){
      const avg=rows.reduce((a,x)=>a+x.s.wr,0)/rows.length;
      const weak=rows.filter(x=>x.s.wr<48).sort((a,b)=>a.s.wr-b.s.wr)[0];
      out.push({k:'ps', t:'내 픽 실측 평균 승률 '+lolpsPct(Math.round(avg*10)/10)+(weak?' — '+weak.n+'('+lolpsPct(weak.s.wr)+')가 가장 불리합니다':'')});
    }
  }
  return out;
}
function coachDraftAdvice(){
  if(typeof D==='undefined'||!D) return null;
  const c=coachSupport();
  const head=c.head; const rating=head?head.rating:60;
  const sharp=rating>=88?2:rating>=80?1:0;
  const myP=dMyPicks(), opP=dOppPicks(), opB=dOppBans(), myB=dMyBans();
  const phase=dPhaseNow();
  const tips=[];
  const myComp=evalComp(myP), opComp=evalComp(opP);
  // 아직 상대 밴이 없으면 시그니처 챔프 경계
  const oppTeam=T(D.oppId);
  const oppSigs=[];
  ROLES.forEach(r=>{ const p=S.players[oppTeam.lineup[r]]; if(p&&p.sigs) p.sigs.forEach(n=>oppSigs.push(n)); });
  if(phase==='ban'){
    const threat=oppSigs.filter(n=>!dOppBans().includes(n)&&!CHAMP_MAP[n]==false);
    if(opP.length===0&&threat.length){
      tips.push({k:'ban', t:'상대 주특기 '+threat.slice(0,3).join('·')+' 를 먼저 잘라내는 게 좋습니다.'});
    }else if(opP.length){
      const oppAd=opComp.ad, oppAp=opComp.ap;
      if(oppAd-oppAp>2) tips.push({k:'ban', t:'상대 조합이 AD에 쏠립니다. 탱커/브루저 밴으로 앞라인을 흔들어 보세요.'});
      else if(oppAp-oppAd>2) tips.push({k:'ban', t:'상대가 AP 중심입니다. 마법 저항 아이템 가는 쪽을 잘라내세요.'});
      else tips.push({k:'ban', t:'상대 조합이 균형형입니다. 밴은 우리 조합의 카운터에 쓰는 게 낫습니다.'});
    }else{
      tips.push({k:'ban', t:'첫 밴입니다. 상대 정글의 템포 챔프를 견제하면 초반이 편해집니다.'});
    }
  }
  // 픽 단계
  if(phase==='pick'||(myP.length&&myP.length<5&&phase!=='ban')){
    const need=[];
    if(!myP.length) tips.push({k:'pick', t:'1픽은 플렉스가 가능한 챔프가 좋습니다. 상대에게 정보를 덜 주면서 라인을 남길 수 있습니다.'});
    if(myComp.front<5) need.push('탱커/이니시');
    if(myComp.cc<6) need.push('CC');
    if(myComp.ad+myComp.ap>0){
      if(myComp.ad-myComp.ap>3) need.push('AP 딜러');
      if(myComp.ap-myComp.ad>3) need.push('AD 딜러');
    }
    if(myP.length>=3&&need.length) tips.push({k:'pick', t:'지금 조합에 필요한 것은 '+need.join(', ')+'입니다.'});
    if(typeof activeSynergies==='function'){
      const syn=activeSynergies(myP);
      const near=activeSynergies(myP.concat(['자야','라칸','루시안','나미','오리아나','말파이트']));
      if(syn.length){
        const ev=syn[0].champs.map(n=>{const s=(typeof lolpsLaneStat==='function')?lolpsLaneStat(n):null; return s?n+' '+lolpsPct(s.wr):null;}).filter(Boolean).join(' · ');
        tips.push({k:'synergy', t:'✨ '+syn.map(x=>x.n).join(', ')+' 시너지가 발동했습니다. 이 조합은 '+syn[0].d+'으로 굴리세요.'+(ev?' (실측 '+ev+')':'')});
      }
    }
    const sigs=mySigs().filter(n=>!dUsed().includes(n));
    if(sigs.length) tips.push({k:'sig', t:'내 선수 주특기 '+sigs.slice(0,2).join('·')+' 가 아직 열려 있습니다.'});
  }
  // 상대 카운터 (레이팅 높을수록 구체적)
  if(opP.length&&sharp>=1){
    const topOpp=opP.slice(0,3);
    tips.push({k:'counter', t:'상대 ' + topOpp.join('·') + ' 조합에는 '+ (opComp.front>7?'포킹·분산 딜교':'강한 이니시')+'로 받아치는 편이 좋습니다.'});
  }
  if(sharp>=2&&opP.length>=3){
    const lacks=opComp.tags.scale<opComp.tags.engage;
    tips.push({k:'detail', t:lacks?'상대는 초중반 교전형입니다. 20분 전 사고를 줄이고 후반 밸류로 뒤집으세요.':'상대 후반 밸류가 높습니다. 15분 전에 유충·전령으로 판을 벌리세요.'});
  }
  if(!head) tips.push({k:'none', t:'감독이 없어 훈수가 제한적입니다. 스태프 영입을 권합니다.'});
  const realTips=coachLolpsTips(phase, myP, opP);
  const cut=sharp>=2?5:sharp>=1?4:3;
  return {tips:realTips.concat(tips).slice(0,cut), head:head, sharp:sharp};
}

/* ---------- 자동 밴픽 (감독에게 위임) ---------- */
function autoDraftQuality(){
  const c=coachSupport();
  const r=c.rating||60;
  return clamp((r-68)/24,0.05,1);   // 68점 → 0, 92점 → 1
}
function autoDraftChoose(kind){
  const q=autoDraftQuality();
  const pool=dAvailable();
  if(!pool.length) return null;
  if(kind==='ban'){
    const opp=T(D.oppId);
    const sigs=[];
    ROLES.forEach(r=>{ const p=S.players[opp.lineup[r]]; if(p&&p.sigs) p.sigs.forEach(n=>sigs.push(n)); });
    const scored=pool.map(ch=>({n:ch.n, s:(sigs.indexOf(ch.n)>=0?9*q:0)+champTier(ch)*1.1+Math.random()*9*(1-q)}));
    scored.sort((a,b)=>b.s-a.s);
    return scored[0].n;
  }
  const myS=dMySigs();
  const myPicked=typeof dMyPicks==='function'?dMyPicks():[];
  const covered={};
  myPicked.forEach(n=>{ const cc=CHAMP_MAP[n]; if(cc&&cc.r) cc.r.forEach(r=>{covered[r]=1;}); });
  const scored=pool.map(ch=>{
    let best=-999;
    if(ch.r&&!covered[ch.r[0]]) best+=26;
    else if(ch.r&&covered[ch.r[0]]) best-=14;
    ROLES.forEach(r=>{
      const p=S.players[myTeam().lineup[r]]; if(!p) return;
      const s=assignScoreFor(p,ch.n,r)+styleSynergy(p,ch,r)*0.9;
      if(s>best) best=s;
    });
    if(myS.indexOf(ch.n)>=0) best+=4*q;
    return {n:ch.n, s:best+champTier(ch)*0.6+Math.random()*11*(1-q)};
  });
  scored.sort((a,b)=>b.s-a.s);
  return scored[0].n;
}
function dMySigs(){
  const out=[];
  ROLES.forEach(r=>{ const p=S.players[myTeam().lineup[r]]; if(p&&p.sigs) p.sigs.forEach(n=>out.push(n)); });
  return out;
}
function autoDraftRun(){
  if(!D||D.done) return;
  const c=coachSupport();
  let guard=0;
  while(D&&!D.done&&D.phase!=='assign'&&guard<70){
    guard++;
    const cur=dCur(); if(!cur) break;
    if(dActor()==='me'){
      const name=autoDraftChoose(cur.t);
      if(!name) break;
      if(cur.t==='ban') draftMyBan(name); else draftMyPick(name);
    }else{
      aiDraftAct();
    }
  }
  if(D&&D.phase==='assign'){
    D.assign.me=recommendAssign(dMyPicks());
    D.result=evalDraft();
    renderDraft();
  }
  toast('🧑‍🏫 '+(c.head?c.head.name+' 감독':'감독')+'이 밴픽을 마쳤습니다 — 라인 배정을 확인하세요');
}

let AUTOTL=false, AUTOTL_AT=-99;
function autoTacticsQuality(){
  const c=coachSupport();
  const coachT=r=>{ const cs=c.coaches||[]; return cs.length?Math.max.apply(null,cs.map(x=>x.rating||70)):70; };
  return clamp(((c.rating||60)*0.6+coachT()*0.4-70)/22,0.05,1);
}
function autoTacticsStep(){
  if(!M||M.over) return;
  const m=M.minute;
  if(m-AUTOTL_AT<2) return;
  AUTOTL_AT=m;
  const q=autoTacticsQuality();
  const sugg=(typeof suggestTactics==='function'?suggestTactics():[]).filter(f=>tacticUnlocked(f.k).ok);
  const gd=M.gold[0]-M.gold[1];
  let stance=M.stance;
  if(gd<-2200) stance='defensive';
  else if(gd>2200) stance='aggro';
  else stance='standard';
  if(q<0.45&&Math.random()<0.35) stance=pickOf(['aggro','defensive','standard']);
  if(stance!==M.stance){ M.stance=stance; M.stanceAt=m; }
  if(sugg.length){
    const want=sugg[0];
    const pickOne=(q>0.65)?want:((Math.random()<0.55+q*0.3)?want:pickOf(sugg));
    if(M.focusKey!==pickOne.k){
      M.focusKey=pickOne.k; M.focusAt=m;
      logEvent('sys','🤖 코치 자동 전술 → '+pickOne.n);
    }
  }
  M.tacticEdge=liveTacticEdge();
}

/* ============ STATS — 시즌 개인 지표 · 어워드 · 트로피 ============ */
function statsInit(){
  if(!S) return null;
  if(!S.stats) S.stats={};
  if(!S.trophies) S.trophies={};
  if(!S.awards) S.awards=[];
  if(!S.clubTrophies) S.clubTrophies=[];
  return S.stats;
}
function statRow(name){
  const st=statsInit();
  if(!st[name]) st[name]={k:0,d:0,a:0,dpm:0,g:0,dpmSum:0,cs:0,csSum:0,vs:0,vsSum:0,minSum:0,solo:0,wins:0,kpSum:0};
  const r=st[name];
  /* 구버전 저장 호환 */
  ['cs','csSum','vs','vsSum','minSum','solo','wins','kpSum'].forEach(k=>{ if(typeof r[k]!=='number') r[k]=0; });
  return r;
}
function statAdd(name,k,d,a,dpm,extra){
  if(!name||!S.players[name]) return;
  const r=statRow(name);
  r.k+=k||0; r.d+=d||0; r.a+=a||0; r.g=(r.g||0)+1;
  if(dpm){ r.dpmSum=(r.dpmSum||0)+dpm; r.dpm=Math.round(r.dpmSum/r.g); }
  else r.dpm=Math.round((r.dpmSum||0)/Math.max(1,r.g));
  const ex=extra||{};
  const cs=ex.cs||0;
  r.cs=(r.cs||0)+cs; r.csSum=(r.csSum||0)+cs;
  r.vs=(r.vs||0)+(cs?0:0);
  const vv=ex.vision||0;
  r.vs=(r.vs||0)+vv; r.vsSum=(r.vsSum||0)+vv;
  r.minSum=(r.minSum||0)+(ex.minutes||0);
  r.solo=(r.solo||0)+(ex.solo||0);
  r.wins=(r.wins||0)+(ex.won?1:0);
  r.kpSum=(r.kpSum||0)+(ex.kp||0);
  if(typeof stat5ChampAdd==='function'&&ex.champ) stat5ChampAdd(name,ex.champ,k,d,a,ex.won);
}
function statCSM(r){
  if(!r||!r.minSum) return 0;
  return Math.round((r.csSum||0)/Math.max(1,r.minSum)*10)/10;
}
function statVSPM(r){
  if(!r||!r.minSum) return 0;
  return Math.round((r.vsSum||0)/Math.max(1,r.minSum)*100)/100;
}
function statKP(r){ return r&&r.g?Math.round((r.kpSum||0)/r.g):0; }
function statKDA(r){
  if(!r) return 0;
  const v=(r.k+r.a)/Math.max(1,r.d);
  return Math.round(v*100)/100;
}
function simAiStats(teamId,win,killsFor,killsAgainst){
  const t=T(teamId); if(!t) return;
  const ps=ROLES.map(r=>S.players[t.lineup[r]]).filter(Boolean);
  if(!ps.length) return;
  const wsum=ps.reduce((a,p)=>a+rawOverall(p),0)||1;
  let left=killsFor, leftD=killsAgainst;
  ps.forEach((p,i)=>{
    const share=i===ps.length-1?Math.max(0,left):Math.min(left,Math.max(0,Math.round(killsFor*rawOverall(p)/wsum)));
    left-=share;
    const d=p.role==='SUP'?Math.round(killsAgainst*0.18):Math.round(killsAgainst*0.22);
    const a=Math.max(0,Math.round(killsFor*(p.role==='SUP'?0.7:p.role==='JGL'?0.75:0.45)*rnd(0.7,1.3)));
    const dpm=Math.round((({TOP:520,JGL:430,MID:640,ADC:700,SUP:180})[p.role]||500)*(win?1.06:0.94)*rnd(0.85,1.15));
    const mins=Math.round(rnd(28,35));
    const cs=Math.round((({TOP:8.4,JGL:5.4,MID:9.0,ADC:9.2,SUP:1.6})[p.role]||8)*mins*rnd(0.9,1.1));
    const vis=Math.round((p.role==='SUP'?rnd(38,76):p.role==='JGL'?rnd(28,55):rnd(12,30)));
    const solo=p.role==='SUP'?0:(Math.random()<0.22?1:0);
    const champ=(p.sigs&&p.sigs.length)?p.sigs[Math.floor(Math.random()*p.sigs.length)]:(CHAMPS[0]||{}).n;
    statAdd(p.name,share,d,a,dpm,{cs:cs,vision:vis,minutes:mins,solo:solo,won:win,
      kp:Math.round((share+a)/Math.max(1,killsFor)*100),champ:champ});
  });
  // 죽음 총합 보정
  const sumD=ps.reduce((a,p)=>a+((S.stats[p.name]||{}).d||0),0);
  if(sumD>0&&killsAgainst>0){
    const factor=killsAgainst/Math.max(1,Math.round(killsAgainst*0.98));
    if(factor<0.9){} // 통계적 근사 — 보정 생략
  }
  S.pog=S.pog||{};
  if(win){
    const mvp=ps.slice().sort((a,b)=>rawOverall(b)-rawOverall(a))[0];
    if(mvp) S.pog[mvp.name]=(S.pog[mvp.name]||0)+ri(40,100);
  }
}

function computeAwards(split){
  const st=statsInit();
  const splitName=split==='spring'?'스프링':'서머';
  const entries=Object.keys(st).map(n=>({name:n,r:st[n],p:S.players[n]})).filter(o=>o.p);
  const games=(o)=>o.r.g||0;
  const score=(o)=>((o.r.k||0)*1.1+(o.r.a||0)*0.9-Math.max(0,(o.r.d||0))*0.6)/Math.max(1,games(o))+(S.pog[o.name]||0)/400+rawOverall(o.p)/100;
  const mvp=entries.slice().sort((a,b)=>score(b)-score(a))[0];
  const team=(n)=>{ const p=S.players[n]; const t=p&&p.team?T(p.team):null; return t?t.tag:'FA'; };
  const awards=[];
  if(mvp) awards.push({k:'mvp',title:splitName+' 정규시즌 MVP',name:mvp.name,team:team(mvp.name),val:Math.round(score(mvp)*100)/100});
  // 파이널 MVP — 결승에서 POG를 가장 많이 받은 선수
  const fin=(S.playoffs&&S.playoffs.rounds&&S.playoffs.rounds[2]&&S.playoffs.rounds[2].matches[0])||null;
  if(fin&&fin.winner){
    const wteam=T(fin.winner);
    const ps=ROLES.map(r=>S.players[wteam.lineup[r]]).filter(Boolean);
    const fm=ps.slice().sort((a,b)=>(S.pog[b.name]||0)-(S.pog[a.name]||0))[0];
    if(fm) awards.push({k:'fmvp',title:splitName+' 파이널 MVP',name:fm.name,team:wteam.tag,val:null});
  }
  // All-LCK 1/2/3팀 (포지션별 상위 3)
  const allLck=[];
  ROLES.forEach(r=>{
    const list=entries.filter(o=>o.p.role===r).sort((a,b)=>score(b)-score(a)).slice(0,3);
    list.forEach((o,i)=>{ allLck.push({teamNo:i+1,role:r,name:o.name,team:team(o.name),val:Math.round(score(o)*100)/100}); });
  });
  awards.push({k:'alllck',title:'All-LCK 팀',list:allLck});
  // 지표 1위
  const boards=statBoards();
  const leaders=[
    ['KDA왕',boards.kda[0],o=>statKDA(o.r)],
    ['킬왕',boards.kills[0],o=>(o.r.k||0)],
    ['어시왕',boards.assists[0],o=>(o.r.a||0)],
    ['DPM왕',boards.dpm[0],o=>(o.r.dpm||0)],
    ['POG왕',boards.pog[0],o=>(S.pog[o.name]||0)],
  ].filter(x=>x[1]).map(x=>({k:'leader',title:x[0],name:x[1].name,team:team(x[1].name),val:x[2](x[1])}));
  const rec={season:S.season, split:split, at:S.week, awards:awards, leaders:leaders};
  S.awards.push(rec);
  // 트로피 적립
  awards.forEach(a=>{
    if(a.name) addTrophy(a.name,a.title,S.season,split);
    if(a.k==='alllck'&&a.list) a.list.forEach(x=>addTrophy(x.name,'All-LCK '+x.teamNo+'팀',S.season,split));
  });
  leaders.forEach(l=>addTrophy(l.name,l.title,S.season,split));
  const champId=split==='spring'?S.springChampion:S.summerChampion;
  if(champId){
    const ct=T(champId);
    ROLES.map(r=>S.players[ct.lineup[r]]).filter(Boolean).forEach(p=>addTrophy(p.name,'LCK '+splitName+' 우승',S.season,split));
  }
  if(mvp&&S.teams[mvp.p.team]===myTeam()) S.clubTrophies.push({t:splitName+' MVP',n:mvp.name,s:S.season});
  saveGame();
  return rec;
}

  S.trophies[name]=S.trophies[name]||[];
  if(!S.trophies[name].some(t=>t.title===title&&t.season===season&&t.split===split))
    S.trophies[name].push({title:title,season:season,split:split});

/* ============ V5 STATS: 챔피언 픽 기록 · 모스트 챔피언 · 시즌 세부 지표 ============ */
/* S.stats[name]  : k,d,a,g,dpm,csSum,vsSum,minSum,solo,wins,kpSum (stats.js에서 누적)
   S.champHist[name][champ] : {g,w,k,d,a}  ← 챔피언별 출전/승/킬/데스/어시 */
const STAT5_ROLE_CSM={TOP:8.4,JGL:5.4,MID:9.0,ADC:9.2,SUP:1.6};
const STAT5_ROLE_DPM={TOP:520,JGL:430,MID:640,ADC:700,SUP:180};

function stat5Init(){
  if(!S) return null;
  if(!S.champHist||typeof S.champHist!=='object') S.champHist={};
  return S.champHist;
}
function stat5Champ(name,champ){
  const h=stat5Init();
  if(!h||!name||!champ) return null;
  if(!h[name]) h[name]={};
  if(!h[name][champ]) h[name][champ]={g:0,w:0,k:0,d:0,a:0};
  return h[name][champ];
}
function stat5ChampAdd(name,champ,k,d,a,won){
  const c=stat5Champ(name,champ);
  if(!c) return;
  c.g=(c.g||0)+1; if(won) c.w=(c.w||0)+1;
  c.k=(c.k||0)+(k||0); c.d=(c.d||0)+(d||0); c.a=(c.a||0)+(a||0);
}
function stat5ChampList(name){
  const h=stat5Init();
  const o=(h&&h[name])||{};
  return Object.keys(o).map(ch=>{
    const x=o[ch]||{};
    const g=x.g||0;
    return {champ:ch,g:g,w:x.w||0,k:x.k||0,d:x.d||0,a:x.a||0,
      wr:g?Math.round((x.w||0)/g*100):0,
      kda:Math.round((((x.k||0)+(x.a||0))/Math.max(1,x.d||0))*100)/100};
  }).sort((a,b)=>b.g-a.g||b.wr-a.wr||b.kda-a.kda);
}
function stat5TeamChamps(teamId,limit){
  const t=T(teamId); if(!t) return [];
  const out={};
  (t.roster||[]).forEach(n=>{
    stat5ChampList(n).forEach(x=>{
      if(!out[x.champ]) out[x.champ]={champ:x.champ,g:0,w:0,players:[]};
      out[x.champ].g+=x.g; out[x.champ].w+=x.w;
      if(out[x.champ].players.indexOf(n)<0) out[x.champ].players.push(n);
    });
  });
  return Object.values(out).sort((a,b)=>b.g-a.g).slice(0,limit||6);
}
function stat5LeagueChamps(limit){
  const out={};
  Object.keys(S.players||{}).forEach(n=>{
    stat5ChampList(n).forEach(x=>{
      if(!out[x.champ]) out[x.champ]={champ:x.champ,g:0,w:0,players:[]};
      out[x.champ].g+=x.g; out[x.champ].w+=x.w;
      if(out[x.champ].players.length<40) out[x.champ].players.push(n);
    });
  });
  return Object.values(out).sort((a,b)=>b.g-a.g).slice(0,limit||10);
}
/* ---------- 랭킹 보드 (전체 목록 · 정렬 · 포지션 필터) ---------- */
const STAT5_BOARDS=[
  {k:'kda',n:'KDA'},{k:'kills',n:'킬'},{k:'assists',n:'어시'},{k:'dpm',n:'DPM'},
  {k:'cs',n:'CS/m'},{k:'vision',n:'시야'},{k:'kp',n:'KP%'},{k:'pog',n:'POG'},
];
function stat5Val(key,o){
  const r=(o&&o.r)||{};
  switch(key){
    case 'kda': return statKDA(r);
    case 'kills': return r.k||0;
    case 'deaths': return r.d||0;

    case 'cs': return statCSM(r);
    case 'vision': return statVSPM(r);
    case 'kp': return statKP(r);
    case 'solo': return r.solo||0;
    case 'pog': return (S.pog&&S.pog[o.name])||0;
    case 'games': return r.g||0;
  }
  return 0;
}
function stat5AllRows(){
  const st=(typeof statsInit==='function')?statsInit():{};
  return Object.keys(st).map(n=>({name:n,r:st[n],p:S.players[n]})).filter(o=>o.p&&(o.r.g||0)>0);
}
function stat5BoardList(key,role){

function stat5LiveCs(side,role,sec){
  const m=Math.max(0,(sec||0)/60);
  const base=STAT5_ROLE_CSM[role]||8;
  const lane=role==='TOP'?'TOP':role==='MID'?'MID':(role==='ADC'||role==='SUP')?'BOT':null;
  let adv=0;
  if(lane&&M&&M.lane&&M.lane[lane]){
    const L=M.lane[lane];
    adv=(side==='me'?1:-1)*(((L.my||60)-(L.opp||60))/100);
  }
  const seed=(hashN(side+role+'cs')%100)/1200;
  let cs=base*m*(0.94+seed)+adv*m*0.6;
  if(role==='JGL') cs+=m*0.5;
  return Math.max(0,Math.round(cs));
}
function stat5LiveDpm(side,role){
  const base=STAT5_ROLE_DPM[role]||500;
  const wp=(M&&M.winProb)||0.5;
  const cond=side==='me'?wp:1-wp;
  const seed=(hashN(side+role+'dpm')%100)/500;
  return Math.round(clamp(base*(0.72+cond*0.55)*(0.94+seed),120,1100));
}

/* ============ AUDIO — Web Audio 밴픽 BGM & 효과음 (외부 파일 0) ============ */
const SND={ctx:null, master:null, bgmGain:null, on:true, playing:null, timer:null, step:0, nextAt:0, ready:false};
function sndCtx(){
  if(SND.ctx) return SND.ctx;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    SND.ctx=new AC();
    SND.master=SND.ctx.createGain(); SND.master.gain.value=0.9; SND.master.connect(SND.ctx.destination);
    SND.bgmGain=SND.ctx.createGain(); SND.bgmGain.gain.value=0.0; SND.bgmGain.connect(SND.master);
    SND.ready=true;
  }catch(e){ SND.ready=false; }
  return SND.ctx;
}
function sndWake(){
  const c=sndCtx();
  if(c&&c.state==='suspended'){ try{ c.resume(); }catch(e){} }
}
document.addEventListener('pointerdown',sndWake,{passive:true});
document.addEventListener('keydown',sndWake,{passive:true});
function sndTone(freq,dur,type,vol,when,detune){
  const c=sndCtx(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(detune) o.detune.value=detune;
  const t0=(when||c.currentTime);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.15),t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(SND.master);
  o.start(t0); o.stop(t0+dur+0.02);
}
function sndNoise(dur,vol,when,filterHz){
  const c=sndCtx(); if(!c) return;
  const len=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,len,c.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*(1-i/len); }
  const src=c.createBufferSource(); src.buffer=buf;
  const g=c.createGain(); g.gain.value=vol||0.2;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=filterHz||1800; f.Q.value=0.8;
  src.connect(f); f.connect(g); g.connect(SND.master);
  const t0=when||c.currentTime;
  g.gain.setValueAtTime(vol||0.2,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.start(t0); src.stop(t0+dur+0.02);
}
function sfx(kind){
  if(!SND.on) return; const c=sndCtx(); if(!c) return; sndWake();
  const t=c.currentTime;
  if(kind==='ban'){
    sndTone(180,0.16,'sawtooth',0.20,t);
    sndTone(120,0.22,'square',0.16,t+0.04);
    sndNoise(0.16,0.16,t,'1200');
    sndTone(70,0.26,'sine',0.20,t+0.02);
  }else if(kind==='pick'){
    [660,880,1320].forEach((f,i)=>sndTone(f,0.14,'triangle',0.13,t+i*0.055));
    sndNoise(0.08,0.06,t+0.02,'3200');
  }else if(kind==='lock'){
    sndTone(523,0.10,'triangle',0.16,t);
    sndTone(784,0.18,'triangle',0.16,t+0.08);
    sndTone(1046,0.22,'sine',0.10,t+0.14);
  }else if(kind==='start'){
    sndNoise(0.5,0.18,t,'700');
    [110,165,220,330].forEach((f,i)=>sndTone(f,0.42,'sawtooth',0.11,t+i*0.03));
    sndTone(55,0.7,'sine',0.20,t);
  }else if(kind==='win'){
    const seq=[523,659,784,1046,1318];
    seq.forEach((f,i)=>sndTone(f,0.34,'triangle',0.15,t+i*0.11));
    sndTone(261,0.9,'sine',0.10,t);
  }else if(kind==='lose'){
    [440,392,330,262].forEach((f,i)=>sndTone(f,0.4,'sine',0.13,t+i*0.14));
  }else if(kind==='tick'){
    sndTone(1100,0.04,'square',0.05,t);
  }else if(kind==='click'){
    sndTone(880,0.05,'triangle',0.06,t);
  }else if(kind==='alert'){
    sndTone(880,0.12,'square',0.10,t);
    sndTone(660,0.16,'square',0.10,t+0.12);
  }
}
/* ---- BGM: 8분음표 시퀀서 ---- */
const BGM_PAT={
  /* A단조 긴장감 루프 */
  bass:[55,55,82.4,55, 55,55,73.4,55, 65.4,65.4,98,65.4, 49,49,73.4,49],
  lead:[440,0,523,0, 659,0,523,0, 587,0,494,0, 392,0,440,0],
  chord:[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,196,246.9]],
};
function bgmStart(mode){
  if(!SND.on) return;
  if(typeof bgmStartCustom==='function'&&bgmStartCustom(mode)){ sndWake(); return; }
  stopCustomBgm();
  const c=sndCtx(); if(!c) return;
  sndWake();
  if(SND.playing===mode) return;
  SND.playing=mode; SND.step=0; SND.nextAt=c.currentTime+0.06;
  try{ SND.bgmGain.gain.cancelScheduledValues(c.currentTime); SND.bgmGain.gain.setValueAtTime(0.0001,c.currentTime); SND.bgmGain.gain.linearRampToValueAtTime(mode==='draft'?0.55:0.35,c.currentTime+0.6); }catch(e){}
  if(SND.timer) clearInterval(SND.timer);
  const spb=60/(mode==='draft'?104:96)/2;  // 8분음표
  SND.timer=setInterval(()=>{ bgmSchedule(spb,mode); },70);
}
function bgmSchedule(spb,mode){
  const c=SND.ctx; if(!c||!SND.playing) return;
  while(SND.nextAt<c.currentTime+0.25){
    const i=SND.step%16, t=SND.nextAt;
    const bass=BGM_PAT.bass[i];
    // 베이스
    const o=c.createOscillator(), g=c.createGain();
    o.type='sawtooth'; o.frequency.value=bass;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.10,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+spb*0.9);
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420;
    o.connect(f); f.connect(g); g.connect(SND.bgmGain);
    o.start(t); o.stop(t+spb*1.1);
    // 하이햇
    if(i%2===0){
      const len=Math.max(1,Math.floor(c.sampleRate*0.05));
      const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0);
      for(let n=0;n<len;n++) d[n]=(Math.random()*2-1)*(1-n/len);
      const src=c.createBufferSource(); src.buffer=buf;
      const hg=c.createGain(); hg.gain.value=i%4===0?0.055:0.03;
      const hf=c.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=6500;
      src.connect(hf); hf.connect(hg); hg.connect(SND.bgmGain);
      src.start(t); src.stop(t+0.06);
    }
    // 리드 (밴픽 모드에서만)
    if(mode==='draft'&&BGM_PAT.lead[i]){
      const lo=c.createOscillator(), lg=c.createGain();
      lo.type='triangle'; lo.frequency.value=BGM_PAT.lead[i];
      lg.gain.setValueAtTime(0.0001,t);
      lg.gain.exponentialRampToValueAtTime(0.045,t+0.02);
      lg.gain.exponentialRampToValueAtTime(0.0001,t+spb*1.6);
      lo.connect(lg); lg.connect(SND.bgmGain);
      lo.start(t); lo.stop(t+spb*1.8);
    }
    // 패드 (2마디마다)
    if(i%8===0){
      const ch=BGM_PAT.chord[(Math.floor(SND.step/8))%4];
      ch.forEach((fq,ci)=>{
        const po=c.createOscillator(), pg=c.createGain();
        po.type='sine'; po.frequency.value=fq; po.detune.value=(ci-1)*6;
        pg.gain.setValueAtTime(0.0001,t);
        pg.gain.linearRampToValueAtTime(0.022,t+0.35);
        pg.gain.linearRampToValueAtTime(0.0001,t+spb*7.6);
        po.connect(pg); pg.connect(SND.bgmGain);
        po.start(t); po.stop(t+spb*8);
      });
    }
    SND.nextAt+=spb; SND.step++;
  }
}
function bgmStop(){
  SND.playing=null;
  try{ stopCustomBgm(); }catch(e){}
  if(SND.timer){ clearInterval(SND.timer); SND.timer=null; }
  const c=SND.ctx;
  if(c&&SND.bgmGain){
    try{ SND.bgmGain.gain.cancelScheduledValues(c.currentTime); SND.bgmGain.gain.setValueAtTime(SND.bgmGain.gain.value,c.currentTime); SND.bgmGain.gain.linearRampToValueAtTime(0.0001,c.currentTime+0.25); }catch(e){}
  }
}

  SND.on=!SND.on;

/* ============ 커스텀 BGM (YouTube / 로컬 파일) ============ */
const BGMST={draft:{mode:'synth',yt:'',data:'',name:''},worlds:{mode:'synth',yt:'',data:'',name:''}};
let YTEL=null, FILEEL=null;
function bgmLoad(){ try{ const v=JSON.parse(localStorage.getItem('lckManager.bgm')||'null'); if(v&&v.draft&&v.worlds){ BGMST.draft=v.draft; BGMST.worlds=v.worlds; } }catch(e){} }
function bgmSave(){ try{ localStorage.setItem('lckManager.bgm',JSON.stringify(BGMST)); }catch(e){ toast('저장 공간이 부족합니다 — 파일이 너무 큽니다'); } }
function ytId(url){
  if(!url) return '';
  const m=String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{6,}$/.test(url)) return url;
  return '';
}
function stopCustomBgm(){
  if(YTEL){ try{ YTEL.remove(); }catch(e){} YTEL=null; }
  if(FILEEL){ try{ FILEEL.pause(); FILEEL.currentTime=0; }catch(e){} if(FILEEL.parentElement) FILEEL.parentElement.removeChild(FILEEL); FILEEL=null; }
}
function playCustomBgm(ctxKey){
  const c=BGMST[ctxKey]; if(!c||c.mode==='synth') return false;
  if(c.mode==='yt'){
    const id=ytId(c.yt); if(!id) return false;
    stopCustomBgm();
    YTEL=document.createElement('iframe');
    YTEL.setAttribute('allow','autoplay');
    YTEL.setAttribute('title','custom bgm');
    YTEL.style.cssText='position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0';
    YTEL.src='https://www.youtube.com/embed/'+id+'?autoplay=1&loop=1&playlist='+id+'&controls=0&modestbranding=1&playsinline=1';
    document.body.appendChild(YTEL);
    return true;
  }
  if(c.mode==='file'&&c.data){
    stopCustomBgm();
    FILEEL=document.createElement('audio');
    FILEEL.src=c.data; FILEEL.loop=true; FILEEL.volume=0.85;
    FILEEL.style.cssText='display:none';
    document.body.appendChild(FILEEL);
    const pr=FILEEL.play();
    if(pr&&pr.catch) pr.catch(()=>{});
    return true;
  }
  return false;
}
function bgmStartCustom(mode){
  const ctxKey=(mode==='worlds'||mode==='final')?'worlds':'draft';
  if(playCustomBgm(ctxKey)){ SND.playing='custom'; return true; }
  return false;
}

function _shade(hex,amt){
  const h=(hex||'#25e0ff').replace('#','');
  const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------- hub bindings ---------- */
function bindHub(){
  const c=$('view-hub');
  c.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ S.weekAction=b.dataset.act; renderHub(); });
  c.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{ S.weekActionTarget=b.dataset.focus; renderHub(); });
  const gm=$('goMatch'); if(gm) gm.onclick=()=>prepareMatch();
  const rs=$('resumeSeries'); if(rs) rs.onclick=()=>{ if(S.currentSeries){ if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries);} };
  const sp=$('seePatch'); if(sp) sp.onclick=()=>{ if(S.patchNotes&&S.patchNotes[0]) showPatchNote(S.patchNotes[0]); };
  const gs=$('goStaff'); if(gs) gs.onclick=()=>{TAB='staff';renderHub();};
  const os=$('openStaffTab'); if(os) os.onclick=()=>{TAB='staff';renderHub();};
  const oe=$('openEditor'); if(oe) oe.onclick=()=>openPlayerEditor(null);
  const vw=$('viewWorlds'); if(vw) vw.onclick=()=>{ if(S.worlds){ show('worlds'); renderWorlds(); } };
  c.querySelectorAll('[data-player]').forEach(el=>el.onclick=()=>openPlayer(el.dataset.player));
  c.querySelectorAll('[data-sign]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const sel=c.querySelector('[data-years="'+b.dataset.sign.replace(/"/g,'\\"')+'"]');
    const years=sel?Number(sel.value):2;
    const r=signFA(b.dataset.sign,years); if(!r.ok) toast(r.msg);
  });
  c.querySelectorAll('[data-release]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); if(confirm(b.dataset.release+' 선수를 방출할까요?')){const r=releasePlayer(b.dataset.release); if(!r.ok) toast(r.msg);}});
  c.querySelectorAll('[data-hire]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const sel=c.querySelector('[data-styears="'+b.dataset.hire+'"]');
    const seasons=sel?Number(sel.value):2;
    const r=hireStaff(b.dataset.hire,seasons); if(!r.ok) toast(r.msg);
  });
  c.querySelectorAll('[data-renew]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); const r=renewStaff(b.dataset.renew); if(!r.ok) toast(r.msg);});
  c.querySelectorAll('[data-fire]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); if(confirm('이 스태프와 계약을 해지할까요? (위약금 발생)')){const r=fireStaff(b.dataset.fire); if(!r.ok) toast(r.msg);}});
  c.querySelectorAll('[data-subgo]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const role=b.dataset.subgo;
    const sel=c.querySelector('[data-subsel="'+role+'"]');
    if(sel){ const r=setSeriesSub(role,sel.value); if(r&&!r.ok) toast(r.msg); else renderHub(); }
  });
  const cq=$('codexQ'); if(cq) cq.oninput=()=>{ CODEX.q=cq.value; renderHub(); const el=$('codexQ'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} };
  c.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ CODEX.cat=b.dataset.cat; renderHub(); });
  c.querySelectorAll('[data-patchview]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const rec=(S.patchNotes||[]).find(x=>String(x.no)===String(b.dataset.patchview)); if(rec) showPatchNote(rec); });
  c.querySelectorAll('[data-editstaff]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); openStaffEditor(b.dataset.editstaff);});
}
function prepareMatch(){
  if(S.currentSeries && !S.currentSeries.done){
    if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries);
    return;
  }
  if(!S.actionApplied) applyWeekAction();
  const opp=weekOpponent(); if(!opp) return;
  const s=createSeries(opp.oppId,3,'regular',{});
  saveGame();
  startDraft(s);
}

  return '26.01';

  return (S&&S.patchNotes&&S.patchNotes[0])||null;
}
function patchIsNew(){
  const n=patchCurrent();
  if(!n||!S) return false;
  if(S.patchSeenNo===n.no) return false;
  return true;
}
function patchMarkSeen(){
  const n=patchCurrent();
  if(!n||!S) return;
  if(S.patchSeenNo!==n.no){ S.patchSeenNo=n.no; try{ saveGame(); }catch(e){} }
}

  patchMarkSeen();

}
function openLatestPatch(){
  const n=patchCurrent();

  gotoPatchTab(); return false;
}

function effectLines(t){
  const e=t.e||{}; const out=[];
  const map={lane:'라인전',fight:'한타',macro:'운영',obj:'오브젝트',mental:'멘탈',pool:'챔프폭',vision:'시야',risk:'리스크'};
  Object.keys(map).forEach(k=>{ if(e[k]) out.push(map[k]+' '+(e[k]>0?'+':'')+e[k].toFixed(1)); });
  if(t.late) out.push('후반(25분+) 추가 효과');
  if(t.early) out.push('초반(12분-) 추가 효과');
  return out;
}

function bindHub(){
  const c=$('view-hub'); if(!c) return;
  /* 문서 레벨 위임: #view-hub가 다시 그려지거나 내부 노드가 교체돼도 클릭이 살아남는다 */
  if(HUB_BOUND) return;
  HUB_BOUND=true;
  document.addEventListener('click',ev=>{
    const t=ev.target;
    if(!t||!t.closest) return;
    const hub=document.getElementById('view-hub');
    if(!hub||!hub.contains(t)) return;
    const el=t.closest('[data-a]'); if(!el) return;
    ev.__hubHandled=true;
    ev.preventDefault(); ev.stopPropagation();
    try{ hubAction(el.dataset.a,el.dataset.v,el); }
    catch(e){ toast('처리 중 오류가 발생했습니다'); try{ console.error(e); }catch(_){} }
  });
  document.addEventListener('input',ev=>{
    const t=ev.target;
    if(t&&t.id==='codexQ'&&document.getElementById('view-hub')&&document.getElementById('view-hub').contains(t)){
      CODEX.q=t.value; renderHub();
      const el=$('codexQ'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }
    }
  });
}

function hubAction(a,v,el){
  if(!S) return;
  clubInit();
  if(a==='noop') return;
  try{ if(typeof hubActionMkt==='function'&&hubActionMkt(a,v,el)) return; }catch(e){}
  try{ if(typeof hubActionStove==='function'&&hubActionStove(a,v)) return; }catch(e){}
  if(a==='tab'){
    if(!v){ return; }
    const parts=v.split(':');
    TAB=parts[0];
    if(parts[1]){
      if(TAB==='club') CLUB_TAB=parts[1];
      if(TAB==='marketing') MK_TAB=parts[1];
      if(TAB==='league') LG_TAB=parts[1];
      if(TAB==='records') REC_TAB=parts[1];
    }
    sfx('click'); renderHub(); return;
  }
  if(a==='advance'){ prepareMatchV3(); return; }
  if(a==='match'){ prepareMatchV3(); return; }
  if(a==='resume'){ if(S.currentSeries){ if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries); } return; }
  if(a==='player'){ openPlayer(v); return; }
  if(a==='setstarter'){ const parts=String(v||'').split(':'); const r=setStarter(parts[0],parts[1]); closeModal(); renderHub(); return; }
  if(a==='editor'){ openPlayerEditor(null); return; }
  if(a==='plan'){ planSet(v,Number(el.dataset.d),cyclePlan(planGet(v)[Number(el.dataset.d)])); renderHub(); return; }
  if(a==='pland'){ openPlanPicker(Number(v),null); return; }
  if(a==='planrow'){ openPlanPicker(null,v); return; }
  if(a==='planweek'){ openPlanPicker(null,'ALL'); return; }
  if(a==='coach'){ planAutofill(true); renderHub(); return; }
  if(a==='invest'){ academyInvestSet(v); return; }
  if(a==='callup'){ const r=academyCallup(Number(v)); toast(r.msg); if(r.ok) renderHub(); return; }
  if(a==='acadsign'){ academySign(); return; }
  if(a==='hire'){ const sel=$('view-hub').querySelector('[data-styears="'+v+'"]'); const n=sel?Number(sel.value):2; const r=hireStaff(v,n); if(!r.ok) toast(r.msg); else { toast('코치를 영입했습니다'); renderHub(); } return; }
  if(a==='sppick'){
    const s=sponsorPool().find(x=>x.id===v)||SPONSOR_MAP[v];
    if(!s){ toast('이 제안은 이미 종료되었습니다'); renderHub(); return; }
    const same=(negot.id===v);
    negot={years:same?(negot.years||2):2, terms:same?(negot.terms||'same'):'same', id:(same?null:v)};
    if(same) toast('협상을 접었습니다');
    else toast(s.name+' — 기간·조건을 정하고 계약하세요');
    renderHub();
    return;
  }
  if(a==='spyears'){ negot.years=Number(v)||2; renderHub(); return; }
  if(a==='spterms'){ negot.terms=(v==='base'||v==='bonus')?v:'same'; renderHub(); return; }
  if(a==='spsign'){
    const c=clubC();
    const def=negoTarget();
    if(!def){ toast('먼저 협상할 스폰서를 선택하세요'); renderHub(); return; }
    const tier=(def.tier==='main'&&!c.sponsors.main)?'main':'sub';
    const r=sponsorSign(tier,def.id,negot.years,negot.terms);
    toast(r.msg);
    if(r.ok){ const yrs=negot.years, tms=negot.terms; negot={years:2,terms:'same',id:null}; renderHub(); openContractStamp(def,yrs,tms); }
    else renderHub();
    return;
  }
  if(a==='spnext'){
    const c=clubC(); const d=negoTarget();
    if(!d){ toast('먼저 협상할 스폰서를 선택하세요'); renderHub(); return; }
    c.offers.main=(c.offers.main||[]).filter(x=>x.id!==d.id);
    c.offers.sub=(c.offers.sub||[]).filter(x=>x.id!==d.id);
    negot={years:2,terms:'same',id:null}; saveGame(); renderHub();
    toast(d.name+' 제안을 비워 두었습니다'); return;
  }
  if(a==='newsread'){ newsReadAll(); renderHub(); return; }
  if(a==='board'){ STAT_BOARD=v; renderHub(); return; }
  if(a==='statrole'){ STAT_ROLE=v||'ALL'; renderHub(); return; }
  if(a==='drama'){ openDramaModal(v); return; }
  if(a==='post'){ const parts=String(v||'').split(':'); openPostModal(parts[0],Number(parts[1])); return; }
  if(a==='pledge'){ introApplyPledge(v); return; }
  if(a==='intro'){ introNext(v); return; }
  if(a==='cat'){ CODEX.cat=v; renderHub(); return; }
  if(a==='mrole'){ META_ROLE=v||'ALL'; sfx('click'); renderHub(); return; }
  if(a==='champinfo'){ openChampInfo(v); return; }
  if(a==='patchview'){ const rec=(S.patchNotes||[]).find(x=>String(x.no)===String(v)); if(rec) showPatchNote(rec); return; }
  if(a==='patchopen'){ openLatestPatch(); return; }
  if(a==='drama'){ openDramaModal(v); return; }
  if(a==='trait'){ const parts=String(v||'').split(':'); showTraitCard(parts[0]||'good',parts[1]||''); return; }
  if(a==='press'){ pressAnswer(v); return; }
  if(a==='pressauto'){ pressAuto(); return; }
  if(a==='go'){ if(v){ TAB=v; renderHub(); } return; }
}

function playerCareerRows(p,t){
  const rows=[];
  const start=Math.max(17,p.age-Math.min(6,Math.max(1,Math.floor((p.age-17)*0.8))));
  const h=hashN(p.name||'x');
  for(let age=start;age<=p.age;age++){
    const season=2026-(p.age-age);
    const team=(age===p.age)?(t?t.name:'FA'):(h%(age%3===0?3:6)===0?'FA':['T1','GEN','KT','DK','HLE','BRO','NS','DRX','KDF','BFX'][(h+age)%10]);
    const ov=(age===p.age)?rawOverall(p):clamp(rawOverall(p)-(p.age-age)*(p.age<=21?3:2)+(age%3),40,99);
    const done=(playerTrophies&&playerTrophies(p.name)||[]).filter(x=>x.season===season).map(x=>x.title);
    rows.push({season,age,team,ovr:ov,notes:done.join(' · ')});
  }
  return rows.reverse();
}

function openAudioSettings(){
  const row=(key,label,desc)=>{
    const c=BGMST[key];
    return `<div class="aud-slot">
      <div class="aud-h"><b>${label}</b><span>${desc}</span></div>

        <button class="seg-b ${c.mode==='yt'?'on':''}" data-aud="${key}" data-mode="yt">YouTube</button>
        <button class="seg-b ${c.mode==='file'?'on':''}" data-aud="${key}" data-mode="file">파일</button>
      </div>
      ${c.mode==='yt'?`<div class="aud-line"><input id="yt_${key}" class="aud-in" placeholder="https://www.youtube.com/watch?v=..." value="${esc(c.yt||'')}"><button class="btn sm" data-aud="${key}" data-act="saveyt">적용</button></div>`:''}
      ${c.mode==='file'?`<div class="aud-line"><input type="file" id="f_${key}" accept="audio/*" class="aud-file"><span class="tiny">${c.name?esc(c.name):'선택된 파일 없음'}</span></div>`:''}
      <div class="aud-line"><span class="tiny">${c.mode==='synth'?'내장 신스 BGM 사용 중 (오프라인 OK)':c.mode==='yt'?(c.yt?'YouTube · '+esc(ytId(c.yt)||'—'):'URL을 붙여넣고 적용'):(c.name?esc(c.name):'오디오 파일을 선택하면 자동 재생됩니다')}</span>
        <button class="btn sm ghost" data-aud="${key}" data-act="test">▶ 테스트</button></div>
    </div>`;
  };
  $('modal').innerHTML=`<div class="modal-wrap" id="modalWrap"><div class="modal">
    <div class="grab"></div>
    <h3 style="font-size:17px;margin-bottom:4px">🎵 사운드 · BGM 설정</h3>
    <div class="tiny" style="margin-bottom:10px">밴픽·월즈 결승 BGM을 직접 고를 수 있습니다. 커스텀 BGM이 없으면 내장 신스가 재생됩니다.</div>
    <div class="row between" style="margin-bottom:8px">
      <span class="tiny">전체 사운드</span>
      <button class="btn sm ${SND.on?'gold':''}" id="sndAll">${SND.on?'🔊 켜짐':'🔇 꺼짐'}</button>
    </div>
    ${row('draft','밴픽 BGM','BAN/PICK 화면')}
    ${row('worlds','월즈·결승 BGM','국제대회·결승')}
    <div class="tiny" style="margin-top:8px">저작권 있는 음원은 포함하지 않습니다. YouTube 링크나 사용자가 가진 파일만 사용합니다.</div>
    <div style="height:12px"></div>
    <button class="btn ghost block" id="modalClose">닫기</button>
  </div></div>`;
  $('modal').classList.remove('hidden');
  $('modalClose').onclick=closeModal;
  $('modalWrap').onclick=e=>{ if(e.target.id==='modalWrap') closeModal(); };
  const sa=$('sndAll'); if(sa) sa.onclick=()=>{ sndToggle(); openAudioSettings(); };
  $('modal').querySelectorAll('[data-aud]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.aud;
    if(b.dataset.mode){ BGMST[key].mode=b.dataset.mode; bgmSave(); openAudioSettings(); return; }
    const act=b.dataset.act;
    if(act==='saveyt'){
      const inp=$('yt_'+key); const id=ytId(inp?inp.value:'');
      if(!id){ toast('YouTube URL을 확인하세요'); return; }
      BGMST[key].yt=inp.value; BGMST[key].mode='yt'; bgmSave(); toast('🎵 YouTube BGM을 저장했습니다'); openAudioSettings(); return;
    }
    if(act==='test'){ bgmStop(); const cfg=BGMST[key]; const ok=playCustomBgm(key); toast(ok?'재생 중… (브라우저가 막으면 한 번 더)':'재생할 수 없습니다'); return; }
  });
  $('modal').querySelectorAll('input[type=file]').forEach(inp=>{
    inp.onchange=()=>{
      const key=inp.id.slice(2);
      const f=inp.files&&inp.files[0]; if(!f) return;
      if(f.size>3.5*1024*1024){ toast('파일이 너무 큽니다 (3.5MB 이하)'); return; }
      const rd=new FileReader();
      rd.onload=()=>{ BGMST[key].data=String(rd.result); BGMST[key].name=f.name; BGMST[key].mode='file'; bgmSave(); toast('🎵 '+f.name+' 저장'); openAudioSettings(); };
      rd.readAsDataURL(f);
    };
  });
}

function bindDraft(){

  v.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{D.roleFilter=b.dataset.rf;draftRefreshGrid();});
  const cq=$('champQ');
  if(cq){
    cq.oninput=()=>{ D.q=cq.value; draftRefreshGrid(); };
    cq.onkeydown=(e)=>{ if(e.key==='Escape'){ D.q=''; draftRefreshGrid(); } };
    if(D.q){ cq.focus(); try{ cq.setSelectionRange(cq.value.length,cq.value.length); }catch(e){} }
  }
  bindChampGrid();
  v.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ D.sel=(D.sel===b.dataset.sel?null:b.dataset.sel); renderDraft(); });
  v.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
    if(D.phase!=='assign') return;
    const role=b.dataset.role;
    if(D.sel){ setAssign(role,D.sel); D.sel=null; }
    else { const cur=D.assign.me[role]; if(cur) D.sel=cur; renderDraft(); }
  });
  const aa=$('autoAssign'); if(aa) aa.onclick=()=>{ D.assign.me=recommendAssign(dMyPicks()); D.sel=null; D.result=evalDraft(); renderDraft(); toast('추천 배정을 적용했습니다'); };
  const ca=$('confirmAssign'); if(ca) ca.onclick=()=>{
    if(ROLES.some(r=>!D.assign.me[r])){ toast('5개 라인을 모두 배정하세요'); return; }
    confirmAssign();
  };
  const tp=$('toPlan'); if(tp) tp.onclick=()=>renderGameplan();
}

/* 상황별 추천 전술 5개 */
function suggestTactics(){
  const m=M.minute;
  const gd=M.gold[0]-M.gold[1];
  const behind=gd<-1500, ahead=gd>1500;
  const soulNear=(M.dragons[0]>=2||M.dragons[1]>=2);
  const out=[];
  if(m<5){
    out.push('invade','botDive','topDive','midJungle','laneSwap');
    if(behind) out.push('counterGank');
  }else if(m<8){
    out.push('topDive','botDive','midJungle','laneSwap','counterGank');
    if(behind) out.push('freeze');
  }else if(m<14){
    out.push('plate','midJungle','counterGank','heraldMid','grubs');
    if(behind) out.push('freeze');
  }else if(m<20){
    out.push('heraldMid','grubs','dragonTrade','split131','cross');
    if(soulNear) out.unshift('soulDeny');
    if(behind) out.splice(3,2,'tpFlank','avoid');
  }else{
    out.push('baronBush','baronBurst','soulDeny','engage','peel');
    if(ahead) out.splice(4,1,'push3');
    if(behind) out.splice(3,2,'avoid','scale');
    if(M.soulGranted.opp||M.elderAt) out.unshift('elderAll');
  }
  /* 시간대에 맞지 않는 전술은 추천에서 제외 */
  return [...new Set(out)].filter(k=>FOCUS_MAP[k]&&tacticTimeOk(k).ok).slice(0,5).map(k=>FOCUS_MAP[k]);
}

function drawGraph(){
  const cv=$('goldCanvas'); if(!cv||!M) return;
  const w=cv.clientWidth||320, h=132, dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){ const y=h*i/4; ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke(); }
  const hist=M.history.length>1?M.history:[{min:0,diff:0},{min:M.minute,diff:0}];
  const span=Math.max(30,Math.min(40,Math.ceil((M.minute*1.35)/5)*5));
  const maxAbs=Math.max(2000,...hist.map(p=>Math.abs(p.diff)))*1.2;
  const X=m=>8+(m/span)*(w-16);
  const Y=d=>h/2-(d/maxAbs)*(h/2-8);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
  const pts=hist.map(p=>[X(Math.min(p.min,span)),Y(p.diff)]);
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(37,224,255,.35)');grad.addColorStop(.5,'rgba(37,224,255,.03)');grad.addColorStop(.5,'rgba(255,77,109,.03)');grad.addColorStop(1,'rgba(255,77,109,.35)');
  ctx.beginPath(); ctx.moveTo(pts[0][0],h/2);
  pts.forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(pts[pts.length-1][0],h/2); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.strokeStyle='#7ceaff'; ctx.lineWidth=2; ctx.stroke();
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],3.2,0,7); ctx.fillStyle=M.gold[0]>=M.gold[1]?'#25e0ff':'#ff4d6d'; ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='9px sans-serif';
  ctx.fillText("+"+Math.round(maxAbs/1000)+"K",6,14);
  ctx.fillText("-"+Math.round(maxAbs/1000)+"K",6,h-6);
  ctx.fillText(span+"'",w-20,h-6);
}

function mmTowerParam(side,lane,tier){
  const p=MAP_TOWERS[side]&&MAP_TOWERS[side][lane]?MAP_TOWERS[side][lane][Math.max(0,Math.min(2,(tier||1)-1))]:null;
  if(!p) return 0.5;
  let best=0.5,bd=9;
  for(let i=0;i<=40;i++){
    const t=i/40, q=mmPathPoint(LANE_PATH[lane],t);
    const d=Math.hypot(q[0]-p[0],q[1]-p[1]);
    if(d<bd){ bd=d; best=t; }
  }
  return best;
}

MM.zoom={on:false, cx:0.5, cy:0.5, s:1, tx:0.5, ty:0.5, ts:1, focusUntil:0};
function mmZoomTo(x,y,scale,ms){
  const z=MM.zoom;
  z.tx=clamp(x,0.08,0.92); z.ty=clamp(y,0.08,0.92); z.ts=clamp(scale||1.85,1,2.2);
  z.focusUntil=performance.now()+(ms||4200);
}
/* 줌이 켜져 있을 때 "지금 볼 곳" — 교전 → 오브젝트 → 가장 밀집한 교전 지역 */
function mmZoomHotspot(){
  if(MM.focus&&(M.minute||0)<=MM.focusUntil+0.01) return [MM.focus[0],MM.focus[1],1.95];
  const win=mmObjectiveWindow(M.minute||0);
  if(win){ const p=PIT[win==='grub'?'baron':win]; return [p[0],p[1],1.8]; }
  const alive=Object.values(MM.units).filter(u=>u.alive);
  if(!alive.length) return [0.5,0.5,1.5];
  let best=null,bs=-1;
  for(let i=0;i<alive.length;i++) for(let j=i+1;j<alive.length;j++){
    const a=alive[i],b=alive[j]; if(a.side===b.side) continue;
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const score=(1-d)*2+((a.x+b.x)/2<0.9?0.2:0);
    if(score>bs){ bs=score; best=[(a.x+b.x)/2,(a.y+b.y)/2,1.7]; }
  }
  if(best&&bs>0.2) return best;
  const jg=MM.units['me-JGL'];
  return jg&&jg.alive?[jg.x,jg.y,1.6]:[0.5,0.5,1.4];
}
function mmZoomStep(dt){
  const z=MM.zoom;
  if(!z.on){ z.ts=1; z.tx=0.5; z.ty=0.5; }
  else if(performance.now()>z.focusUntil+400){ const h=mmZoomHotspot(); z.tx=h[0]; z.ty=h[1]; z.ts=h[2]; }
  // 프레임이 지도 밖을 비추지 않도록 중심을 클램프
  const half=0.5/z.ts;
  z.tx=clamp(z.tx,half,1-half); z.ty=clamp(z.ty,half,1-half);
  const k=1-Math.exp(-(dt||16)/200);
  z.s=z.s+(z.ts-z.s)*k; z.cx=z.cx+(z.tx-z.cx)*k; z.cy=z.cy+(z.ty-z.cy)*k;
  if(z.s<1.02){ z.s=1; if(!z.on){ z.cx=0.5; z.cy=0.5; } }
  if(z.s>2.2) z.s=2.2;
}

function mmObjectiveWindow(m){
  const gp=(M&&M.gp)||{};
  const first=gp.firstObj||'grub';
  const hit=(kind)=>OBJ_TIMES[kind]&&OBJ_TIMES[kind].some(t=>m>=t-1&&m<=t+1);
  if(hit(first)) return first;
  for(const kind in OBJ_TIMES){ if(hit(kind)) return kind; }
  return null;
}

  const s=(sec===undefined)?mmGameSec():sec;
  if(gp.laneSwap&&s>=90&&s<=270){
    if(role==='ADC'||role==='SUP') return 'TOP';
    if(role==='TOP') return 'BOT';
    return 'MID';
  }
  if(role==='TOP') return 'TOP';
  if(role==='MID') return 'MID';
  if(role==='ADC'||role==='SUP') return 'BOT';
  return 'MID';
}

  const order=dir==='bottomUp'?[5,4,3,2,1,0]:[0,1,2,3,4,5];
  const sec=mmGameSec();
  for(let i=0;i<order.length;i++){
