    logEvent(team==='me'?'blue':'red', m+'분 · <b>부시 매복 픽오프</b> — '+(team==='me'?myNameAt(role):oppNameAt(role))+'이(가) 시야 밖에서 끊어냅니다.');
  }
  // 위험 특성
  const riskMe=Math.max(0,M.trait.me.risk-1.2), riskOp=Math.max(0,M.trait.opp.risk-1.2);
  const calmMul=1-Math.min(0.5,(M.coach.me.calm||0));
  if(Math.abs(M.gold[0]-M.gold[1])>1800 && Math.random()<0.035*(riskMe+riskOp)*calmMul){
    const loser=(M.gold[0]>M.gold[1])?'me':'opp';
    const team=loser==='me'?'opp':'me';
    addGold(team,420); M.kills[sideIdx(team)]++;
    const role=pickOf(ROLES);
    const pl=playerAt(team==='me'?'opp':'me',role);
    const bad=badStyleLine(pl)||'무리한 진입';
    logEvent(team==='me'?'blue':'red', m+'분 · <b>'+bad+'</b> — '+(team==='me'?M.oppName:M.myName)+'이(가) 역습 킬을 챙깁니다.');
  }
  // 공허 유충
  if(m===6||m===10){
    const macro=(typeof v5MacroPlan==='function')?v5MacroPlan('grub',m):{me:'contest',opp:'contest'};
    M.objMacro={kind:'grub',at:m,me:macro.me,opp:macro.opp};
    if(macro.me==='trade') try{ v5MacroTrade('me','grub',m); }catch(e){}
    if(macro.opp==='trade') try{ v5MacroTrade('opp','grub',m); }catch(e){}
    const focus=(M.gp.firstObj==='grub'?0.25:-0.05)+(fo&&fo.mm==='top'?0.1:0)+((M.focusKey==='grubs'||M.focusKey==='obj')?0.12:0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.012+(M.trait.me.vision-M.trait.opp.vision)*0.006;
    let favor=killFavor+focus+objEdge+(sta.obj||0);
    if(macro.me==='trade'&&macro.opp!=='trade') favor=0.08;
    else if(macro.opp==='trade'&&macro.me!=='trade') favor=0.92;
    const meWins=Math.random()<clamp(favor,0.08,0.92);
    const team=meWins?'me':'opp';
    M.grubs[sideIdx(team)]+=3; addGold(team,190*S.meta.obj.grub);
    ROLES.forEach(r=>lvAddXp(team,r,16));
    logEvent(team==='me'?'blue':'red', m+'분 · 공허 유충 3스택 — <b>'+(team==='me'?M.myName:M.oppName)+'</b>이(가) 유충을 가져갑니다.');
  }
  // ---------- 드래곤: 원소 · 영혼 · 장로 ----------
  const dTimes=[5,11,17,23,29];
  const soulClaimed=(M.soulGranted.me||M.soulGranted.opp);
  const soulEdgeDiff=((M.soulGranted.me?0.03:0)-(M.soulGranted.opp?0.03:0));
  const elderEdgeDiff=((M.elder.me&&m<=(M.elderUntil.me||0))?0.08:0)-((M.elder.opp&&m<=(M.elderUntil.opp||0))?0.08:0);
  if(!soulClaimed && dTimes.includes(m)){
    const macro=(typeof v5MacroPlan==='function')?v5MacroPlan('dragon',m):{me:'contest',opp:'contest'};
    M.objMacro={kind:'dragon',at:m,me:macro.me,opp:macro.opp};
    if(macro.me==='trade') try{ v5MacroTrade('me','dragon',m); }catch(e){}
    if(macro.opp==='trade') try{ v5MacroTrade('opp','dragon',m); }catch(e){}
    const dFocus=(M.gp.firstObj==='dragon'?0.2:-0.05)+(M.gp.jungle==='bot'?0.08:0)+(fo?(fo.obj||0):0)+(sta.obj||0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.014+(M.trait.me.vision-M.trait.opp.vision)*0.007+((M.coach.me.obj||0)-(M.coach.opp.obj||0))*0.3+soulEdgeDiff+elderEdgeDiff+(typeof v5ObjVision==='function'?v5ObjVision():0);
    let favor=killFavor+dFocus+objEdge;
    if(macro.me==='trade'&&macro.opp!=='trade') favor=0.06;
    else if(macro.opp==='trade'&&macro.me!=='trade') favor=0.94;
    else if(macro.me==='trade'&&macro.opp==='trade') favor=0.5;
    const meWins=Math.random()<clamp(favor,0.04,0.96);
    const team=meWins?'me':'opp';
    const n=(M.dragons[sideIdx(team)]||0)+1;
    M.dragons[sideIdx(team)]=n;
    const elem=(n>=4&&M.soulType[team])?M.soulType[team]:(pickOf(DRAKE_ELEMENTS).k);
    M.dragonElems[team].push(elem);
    addGold(team,380*S.meta.obj.dragon);
    ROLES.forEach(r=>lvAddXp(team,r,18));
    if(n===3&&!M.soulType[team]){
      M.soulType[team]=elem;
      logEvent(team==='me'?'blue':'red', m+'분 · <b>3용</b> — '+(team==='me'?M.myName:M.oppName)+'의 드래곤 영혼 예고: <b>'+drakeName(elem)+'의 영혼</b>');
    }else if(n>=4&&!M.soulGranted[team]){
      M.soulGranted[team]=true; M.soulType[team]=M.soulType[team]||elem;
      M.elderAt=m+6;
      logEvent(team==='me'?'blue':'red', m+'분 · 💠 <b>드래곤 영혼 획득!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) '+drakeName(M.soulType[team])+'의 영혼을 흡수했습니다 — 한타력 급상승');
    }else{
      logEvent(team==='me'?'blue':'red', m+'분 · '+drakeIcon(elem)+' '+drakeName(elem)+' 드래곤 처치 — <b>'+(team==='me'?M.myName:M.oppName)+'</b> ('+n+'스택)');
    }
  }
  // 장로 드래곤 (영혼 획득 6분 후)
  if(M.elderAt && m>=M.elderAt && (m-M.elderAt)%6===0){
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.012+soulEdgeDiff;
    const meWins=Math.random()<clamp(killFavor+0.02+objEdge,0.08,0.92);
    const team=meWins?'me':'opp';
    M.elder[team]=true; M.elderUntil[team]=m+3; M.elderCount[sideIdx(team)]++;
    addGold(team,600);
    logEvent(team==='me'?'blue':'red', m+'분 · 🐲 <b>장로 드래곤 처치!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) 처형 버프를 얻습니다 (3분)');
  }
  // 협곡의 전령
  if(m===14){
    const macro=(typeof v5MacroPlan==='function')?v5MacroPlan('herald',m):{me:'contest',opp:'contest'};
    M.objMacro={kind:'herald',at:m,me:macro.me,opp:macro.opp};
    if(macro.me==='trade') try{ v5MacroTrade('me','herald',m); }catch(e){}
    if(macro.opp==='trade') try{ v5MacroTrade('opp','herald',m); }catch(e){}
    let favor=killFavor+(fo&&fo.mm==='top'?0.1:0)+(M.gp.firstObj==='grub'?0.05:0)+(M.gp.firstObj==='herald'?0.18:0);
    if(macro.me==='trade'&&macro.opp!=='trade') favor=0.06;
    else if(macro.opp==='trade'&&macro.me!=='trade') favor=0.94;
    const meWins=Math.random()<clamp(favor,0.06,0.94);
    const team=meWins?'me':'opp';
    M.heralds[sideIdx(team)]++;
    addGold(team,450);
    logEvent(team==='me'?'blue':'red', m+'분 · 🕯 <b>협곡의 전령 처치</b> — '+(team==='me'?M.myName:M.oppName)+'이(가) 전령을 확보해 타워 압박에 나섭니다.');
  }
  // 타워 (라인 전선 잠금: T1→T2→T3→억제기→넥서스 순서만)
  if(m>=8 && Math.random()<Math.max(0.05,0.20+(fo?(fo.tower||0):0))*(M.stance==='defensive'?0.85:1)*S.meta.obj.tower){
    const meWins=Math.random()<clamp(killFavor+(M.trait.me.macro-M.trait.opp.macro)*0.008,0.08,0.92);
    const team=meWins?'me':'opp';
    if(typeof v5TowerFall==='function') v5TowerFall(team,m); else M.towers[sideIdx(team)]++;
  }
  // 한타
  if(m>=13 && Math.random()<0.07*(1+((fo&&fo.fight)||0))*(1+(M.stance==='aggro'?0.5:M.stance==='defensive'?-0.35:0))){
    let fightEdge=(M.myComp.tags.fight-M.oppComp.tags.fight)*0.015+(M.myComp.front-M.oppComp.front)*0.01+(M.myComp.cc-M.oppComp.cc)*0.006+(M.trait.me.fight-M.trait.opp.fight)*0.012;
    if(M.soulGranted.me) fightEdge+=0.035; if(M.soulGranted.opp) fightEdge-=0.035;
    if(M.elder.me&&m<=(M.elderUntil.me||0)) fightEdge+=0.06; if(M.elder.opp&&m<=(M.elderUntil.opp||0)) fightEdge-=0.06;
    const meWins=Math.random()<clamp(killFavor+fightEdge+(M.stance==='aggro'?0.04:0)-(M.stance==='defensive'?0.05:0),0.05,0.95);
    const team=meWins?'me':'opp';
    const n=ri(1,3);
    M.kills[sideIdx(team)]+=n; addGold(team,n*300+120);
    M.fights[sideIdx(team)]++;
    const hero=pickOf(ROLES);
    const pl=playerAt(team,hero);
    const flavour=pl?styleLine(pl):'';
    const archTag=(M.arch&&M.arch.label)?(' <i>'+M.arch.label[(team==='me'?M.arch.me:M.arch.opp).arch]+'</i>'):'';
    logEvent(team==='me'?'blue':'red', m+'분 · <b>대규모 한타</b> — '+(team==='me'?M.myName:M.oppName)+archTag+'이(가) '+n+'킬 스왑'+(flavour?' · '+flavour+'!':'하며 주도권을 가져갑니다.'));
  }
  // 바론
  if([20,26,32].includes(m)){
    const macro=(typeof v5MacroPlan==='function')?v5MacroPlan('baron',m):{me:'contest',opp:'contest'};
    M.objMacro={kind:'baron',at:m,me:macro.me,opp:macro.opp};
    if(macro.me==='trade') try{ v5MacroTrade('me','baron',m); }catch(e){}
    if(macro.opp==='trade') try{ v5MacroTrade('opp','baron',m); }catch(e){}
    const baronFocus=(M.focusKey==='baronBush'?0.45:0)+(fo&&fo.mm==='obj'?0.2:0)+(M.grubs[0]>M.grubs[1]?0.06:0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.016+(typeof v5ObjVision==='function'?v5ObjVision():0);
    let favor=killFavor+baronFocus+objEdge;
    if(macro.me==='trade'&&macro.opp!=='trade') favor=0.04;
    else if(macro.opp==='trade'&&macro.me!=='trade') favor=0.96;
    const meWins=Math.random()<clamp(favor,0.04,0.96);
    const team=meWins?'me':'opp';
    M.barons[sideIdx(team)]++;
    addGold(team,1200*S.meta.obj.baron);
    ROLES.forEach(r=>lvAddXp(team,r,22));
    try{ if(typeof v5BaronTaken==='function') v5BaronTaken(team,m); }catch(e){}
    logEvent(team==='me'?'blue':'red', m+'분 · <b>바론 처치!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) 바론 버프로 공성을 시작합니다 — 3분간 2차·3차 타워 압박, 슈퍼 미니언과 함께 넥서스를 노립니다.');
  }
  // V5: 시야전 · 바론 공성 · 억제기
  try{ if(typeof v5Tick==='function') v5Tick(m); }catch(e){}
  // 작전 패시브
  if(M.focusKey==='split131'||M.focusKey==='split14'||M.focusKey==='cross'){
    const bonus=M.focusKey==='split14'?60:M.focusKey==='split131'?48:40;
    addGold(Math.random()<killFavor?'me':'opp',bonus);
  }
  M.vision[0]+=ri(2,4); M.vision[1]+=ri(2,4);
  M.winProb=winProb();
  M.history.push({min:m,diff:M.gold[0]-M.gold[1]});
  const gd=M.gold[0]-M.gold[1];
  if((m>=27&&Math.abs(gd)>6000)||(m>=31&&Math.abs(gd)>3800)||(m>=35&&Math.abs(gd)>2000)||m>=38){
    finishGame();
    return;
  }
  if(!silent) renderMatch();
}
function finishGame(){
  if(!M||M.over) return;
  M.over=true; M.running=false; stopTimer();
  const gd=M.gold[0]-M.gold[1];
  let meWin;
  if(Math.abs(gd)>3000) meWin=gd>0;
  else meWin=Math.random()<clamp(0.5+gd/6000,0.15,0.85);
  M.meWin=meWin;
  M.winProb=meWin?1:0;
  const winTeam=meWin?'me':'opp';
  logEvent(meWin?'blue':'red', M.minute+'분 · <b>넥서스 파괴!</b> '+(meWin?M.myName:M.oppName)+' 승리', M.minute);
  const winners=winTeam==='me'?M.lineups.me:M.lineups.opp;
  const mvp=pickOf(winners.filter(x=>x.name));
  M.mvp=mvp;
  S.seriesMomentum=meWin?0.8:-0.8;
  const me=T(S.userTeam), opp=T(M.oppId);
  const myPlayers=lineupOf(me), oppPlayers=lineupOf(opp);
  const volOf=p=>persMod(p,'vol','avg');
  if(meWin){
    myPlayers.forEach(p=>{p.form=clamp(p.form+Math.round(ri(2,6)*volOf(p)),10,100);p.fatigue=clamp(p.fatigue+ri(6,11),0,100);});
    oppPlayers.forEach(p=>{p.form=clamp(p.form-Math.round(ri(2,6)*volOf(p)),10,100);p.fatigue=clamp(p.fatigue+ri(5,10),0,100);});
  }else{
    const wall=1-Math.min(0.6,(staffMods(S.userTeam).mental||0)*0.9);
    myPlayers.forEach(p=>{p.form=clamp(p.form-Math.round(ri(2,6)*wall),10,100);p.fatigue=clamp(p.fatigue+ri(6,11),0,100);});
    oppPlayers.forEach(p=>{p.form=clamp(p.form+ri(1,4),10,100);});
  }
  if(M.mvp && M.mvp.name) S.pog[M.mvp.name]=(S.pog[M.mvp.name]||0)+(meWin?100:60);
  // ---- 실전 경험치 & 성장 ----
  S.lastGrowth=[];
  const growTeam=(teamId,won)=>{
    const team=(typeof teamId==='string')?T(teamId):teamId;
    if(!team||!team.lineup) return;
    ROLES.forEach(r=>{
      const p=S.players[team.lineup[r]]; if(!p) return;
      let base=18+(won?8:0)+(p.age<=21?10:p.age<=23?5:0);
      if(M.mvp&&M.mvp.name===p.name) base+=18;
      const mult=persMod(p,'growth','avg');
      p.exp=(p.exp||0)+Math.round(base*mult);
      if(p.exp>=100){
        p.exp-=100;
        const keys=({TOP:['lane','fight','macro'],JGL:['macro','fight','mental'],MID:['lane','fight','macro'],ADC:['lane','fight','mental'],SUP:['macro','mental','lane']})[p.role]||['lane','fight'];
        const k=keys[Math.floor(Math.random()*keys.length)];
        const before=p.stats[k];
        p.stats[k]=clamp(p.stats[k]+1,40,99);
        S.lastGrowth.push({team,name:p.name,stat:k,amt:p.stats[k]-before,exp:0});
      }else{
        S.lastGrowth.push({team,name:p.name,exp:p.exp});
      }
    });
  };
  try{ growTeam(S.userTeam,meWin); growTeam(M.oppId,!meWin); }catch(e){ S.lastGrowth=S.lastGrowth||[]; }
  try{ if(typeof statApplyMyGame==='function') statApplyMyGame(); }catch(e){}
  const sr=M.series;
  if(meWin) sr.score.me++; else sr.score.opp++;
  S.bestDraftPct=Math.max(S.bestDraftPct||0, M.draftPct||0);
  if(M.elder&&M.elder.me) S.elderTaken=(S.elderTaken||0)+1;
  /* V5: 케미 진화 · 듀오 소식 */
  try{ if(typeof chemAfterGame==='function') chemAfterGame(meWin); }catch(e){}
  try{ if(meWin&&typeof chemDuoNews==='function') chemDuoNews(); }catch(e){}
  if(M.soulGranted&&M.soulGranted.opp&&meWin) S.soulComeback=(S.soulComeback||0)+1;
  if(M.barons[0]>0&&M.gold[0]<M.gold[1]-3000&&meWin) S.baronSteals=(S.baronSteals||0)+1;
  sr.games.push({win:meWin, minute:M.minute, kills:M.kills.slice(), gold:M.gold.slice(),
    mvp:(M.mvp||{}).name||'', mvpChamp:(M.mvp||{}).champ||'',
    dragons:M.dragons.slice(), towers:M.towers.slice(), barons:M.barons.slice(),
    myComp:M.myComp, oppComp:M.oppComp, lane:M.lane, edge:M.edge, tactics:M.tacticAt, history:M.history.slice(),
    myPct:M.draftPct, myPicks:dMyPicks().slice(), oppPicks:dOppPicks().slice(),
    assign:{me:Object.assign({},D.assign.me),opp:Object.assign({},D.assign.opp)}});
  if(sr.fearless){ sr.fearlessUsed.push(...dMyPicks(), ...dOppPicks()); }
  if(sr.bo>=3&&sr.score.me-sr.score.opp>=2) S.sweeps=(S.sweeps||0)+1;
  saveGame();
  try{ checkAchievements(); }catch(e){}
  try{ gameEndFlow(); }catch(e){ try{ renderSeriesResult(); }catch(e2){ try{ renderAll(); }catch(e3){} } }
}
function analyzeGame(game){
  if(!game) return {reasons:[]};
  const lane=game.lane||{}; const reasons=[]; const laneR=[];
  ROLES.forEach(r=>{ if(!lane[r]) lane[r]={my:60,opp:60}; });
  ROLES.forEach(r=>{
    const d=(lane[r]?lane[r].my-lane[r].opp:0);
    if(Math.abs(d)>2.5) laneR.push({k:'lane',v:Math.sign(d),d,txt:ROLE_KR[r]+' 라인전 '+(d>0?'우위':'열세')+' ('+(d>0?'+':'')+d.toFixed(1)+')'});
  });
  laneR.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  laneR.slice(0,3).forEach(x=>reasons.push(x));
  const myC=game.myComp, opC=game.oppComp;
  if(myC&&opC){
    if(game.win && opC.tags.scale>myC.tags.scale+2) reasons.push({k:'comp',v:1,txt:'후반 밸류 싸움에서 앞섰습니다'});
    if(!game.win && myC.tags.scale<opC.tags.scale-2) reasons.push({k:'late',v:-1,txt:'후반 밸류 열세 — 30분 이후 한타에서 밀렸습니다'});
    if(!game.win && myC.tags.engage<opC.tags.engage-2) reasons.push({k:'engage',v:-1,txt:'이니시 싸움에서 밀렸습니다'});
    if(!game.win && myC.front<opC.front-2) reasons.push({k:'front',v:-1,txt:'프론트라인이 무너졌습니다'});
    if(myC.tags.engage>=9 && game.win) reasons.push({k:'engage',v:1,txt:'강한 이니시로 교전을 열었습니다'});
  }
  if(game.kills && game.kills[0]<game.kills[1]-4) reasons.push({k:'fight',v:-1,txt:'교전 킬 스코어 열세'});
  if(game.myPct){ const adv=game.myPct-50; reasons.push({k:'draft',v:Math.sign(adv),txt:'밴픽 우세도 '+game.myPct.toFixed(0)+'% : '+(100-game.myPct).toFixed(0)+'% — '+(adv>0?'밴픽에서 앞섰습니다':'밴픽에서 밀렸습니다')}); }
  return {reasons};
}

/* ============ V5: 03:30 바위게 · 시야/와드 전쟁 · 바론 공성·억제기 ============ */

const V5_OBJ_NAME={dragon:'드래곤',baron:'바론',grub:'공허 유충'};
/* 와드 자리: [x, y, 종류] — 핏 주변 부시·강가·적 정글 입구 */
const V5_WARD_SPOTS={

  baron: [[0.252,0.312,'yellow'],[0.300,0.248,'pink'],[0.348,0.300,'yellow'],[0.300,0.358,'yellow']],
  grub:  [[0.332,0.252,'yellow'],[0.268,0.360,'pink'],[0.360,0.330,'yellow']],
};
const V5_SCUTTLE_CAST=[
  '3분 30초 바위게 싸움 터졌습니다!',
  '3분 30초, 게 하나에 이렇게 많이 붙습니다!',
  '바위게 하나를 두고 정글러끼리 정면으로 만납니다!',
  '여기서 게를 먹는 쪽이 초반 주도권을 통째로 가져갑니다!',
  '라인 주도권이 있는 쪽이 먼저 로밍을 붙입니다, 게 하나에 판이 걸렸습니다!',
  '양 팀 미드가 동시에 움직입니다! 3분 30초 바위게 각입니다!',
];
const V5_SCUTTLE_ANALYST=[
  '게 하나에 라인 주도권이 다 걸려 있어요, 이건 초반 설계입니다',
  '먼저 합류한 쪽이 숫자 싸움에서 이깁니다, 한 발이 차이를 만듭니다',
  '정글 두 명이 같은 게를 노리면 반드시 교전이 열립니다',
  '이 게를 먹으면 다음 캠프 동선이 완전히 달라져요',
  '탑·미드가 먼저 움직였는지가 관건입니다, 라인을 비우는 판단이에요',
  '바위게는 시야도 같이 주니까 초반 시야 싸움의 시작점입니다',
];
function v5Pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function v5Rnd(a,b){ return a+Math.random()*(b-a); }

/* ---------- 매치 초기화 ---------- */
function v5InitMatch(){
  if(!M) return;
  M.scuttleWar={fired:false,at:3.5,minute:0,type:null,winners:null,me:0,opp:0,kills:[0,0],
    lane:null,size:0,roam:{me:[],opp:[]},edge:0};
  M.visionWar={wards:{me:[],opp:[]},sweeps:[],lastSetup:{},seq:0,ambush:{me:0,opp:0},
    wardsMe:0,wardsOpp:0};
  M.baronBuff={me:-1,opp:-1};
  M.baronTakes={me:0,opp:0};
  M.inhib={
    me:{TOP:{alive:true,at:null,respawnAt:null},MID:{alive:true,at:null,respawnAt:null},BOT:{alive:true,at:null,respawnAt:null}},
    opp:{TOP:{alive:true,at:null,respawnAt:null},MID:{alive:true,at:null,respawnAt:null},BOT:{alive:true,at:null,respawnAt:null}},
  };
  M.inhibCount=[0,0];
  /* 라인별 타워 전선 (0=파괴, 1=생존). 반드시 T1→T2→T3 순서로만 붕괴 */
  M.tw={me:{TOP:[1,1,1],MID:[1,1,1],BOT:[1,1,1]},opp:{TOP:[1,1,1],MID:[1,1,1],BOT:[1,1,1]},meNex:[1,1],oppNex:[1,1]};
  M.scuttleEdge=0;
  if(!M.vision) M.vision=[0,0];
}
function v5LaneKR(l){ return ({TOP:'탑',MID:'미드',BOT:'봇'})[l]||l; }
/* 타워 하나 철거 — 해당 라인의 첫 생존 타워(T1→T2→T3)만 붕괴 */
function v5TowerFall(side,m){
  if(!M) return null;
  if(!M.tw) v5InitMatch();
  if(M.lastTowerAt===m) return null;   /* 1분당 타워 1개까지만 */
  M.lastTowerAt=m;
  if(!M.inhib) M.inhib={};
  const def=side==='me'?'opp':'me';
  const pw={TOP:v5LanePrio('TOP'),MID:v5LanePrio('MID'),BOT:v5LanePrio('ADC')};
  const lanes=['TOP','MID','BOT'];
  const w=lanes.map(l=>Math.max(0.08,0.7+pw[l]*0.9+(pw[l]>0.25?0.5:0)+(l==='MID'?0.1:0)+Math.random()*0.5));
  let lane=lanes[0], r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<lanes.length;i++){ r-=w[i]; if(r<=0){ lane=lanes[i]; break; } }
  const arr=M.tw[def]&&M.tw[def][lane]?M.tw[def][lane]:[1,1,1];
  let tier=arr.indexOf(1), nx=false;
  if(tier<0){
    const inh=M.inhib[def]&&M.inhib[def][lane]?M.inhib[def][lane]:null;
    if(inh&&inh.alive) return null;   /* 억제기 먼저 */
    const key=def==='me'?'meNex':'oppNex';
    const nex=M.tw[key]||[1,1];
    tier=nex.indexOf(1);
    if(tier<0) return null;
    nex[tier]=0; M.tw[key]=nex; nx=true;
  } else { arr[tier]=0; M.tw[def][lane]=arr; }
  const idx=side==='me'?0:1;
  M.towers[idx]=(M.towers[idx]||0)+1;
  addGold(side,nx?320:240);
  ROLES.forEach(r2=>lvAddXp(side,r2,10));
  const teamNm=side==='me'?M.myName:M.oppName;
  const tierNm=nx?'넥서스 타워':('T'+(tier+1)+' 타워');
  logEvent(side==='me'?'blue':'red', m+'분 · '+v5LaneKR(lane)+' '+tierNm+' 철거 — <b>'+teamNm+'</b>'+(tier===0?'이(가) 1차 타워를 부수고 2차로 진입합니다':tier===1?'이(가) 2차 타워를 부수고 3차(억제기) 앞으로':tier===2?'이(가) 3차 타워를 부수고 억제기를 노출했습니다':'이(가) 넥서스 타워를 밀어냅니다'));
  return {lane:lane,tier:tier,nx:nx};
}

/* ---------- 1) 03:30 바위게 교전 & 라인 주도권 로밍 ---------- */
function v5LanePrio(role){
  if(!M) return 0;
  const L=(M.lane&&M.lane[role])||{my:60,opp:60};
  const d=((L.my||60)-(L.opp||60))/22;
  const tr=M.trait?(((M.trait.me.lane||0)-(M.trait.opp.lane||0))*0.035):0;
  return clamp(d+tr,-1,1);
}
function v5Scuttle(){
  if(!M) return null;
  if(!M.scuttleWar) v5InitMatch();
  const W=M.scuttleWar;
  if(W.fired) return null;
  W.fired=true; W.at=3.5; W.minute=3.5;
  const prio={TOP:v5LanePrio('TOP'),MID:v5LanePrio('MID'),ADC:v5LanePrio('ADC')};
  const gp=M.gp||{};
  /* 내 정글러가 먼저 가는 쪽 / 상대 정글러가 먼저 가는 쪽 */
  const myPref=gp.jungle==='top'?-1:gp.jungle==='bot'?1:(prio.TOP>=prio.ADC?-1:1);
  const opPref=(prio.TOP<prio.ADC?-1:1)*(Math.random()<0.3?-1:1);
  const contested=(myPref===opPref)?(myPref<0?'TOP':'BOT'):null;
  let edge=prio.TOP*0.34+prio.ADC*0.34+prio.MID*0.32;
  edge+=((M.trait.me.vision||0)-(M.trait.opp.vision||0))*0.012;
  edge+=((M.trait.me.obj||0)-(M.trait.opp.obj||0))*0.012;
  edge+=(((M.coach.me||{}).early||0)-((M.coach.opp||{}).early||0))*0.9;
  edge+=v5Rnd(-0.22,0.22);
  const winner=edge>=0?'me':'opp';
  const loser=winner==='me'?'opp':'me';
  W.edge=Math.round(edge*1000)/1000;
  W.lane=contested||(myPref<0?'TOP':'BOT');
  W.roam={me:[],opp:[]};
  const rotRole=W.lane==='TOP'?'TOP':'ADC';
  const midRot=Math.abs(prio.MID)>0.1||Math.random()<0.45;
  W.roam[winner]=[rotRole].concat(midRot?['MID']:[]);
  W.roam[loser]=(Math.random()<0.6)?[rotRole].concat(midRot?['MID']:[]):(midRot?['MID']:[]);
  const absE=Math.abs(edge);
  if(!contested){
    W.type='split'; W.me=1; W.opp=1; W.kills=[0,0]; W.winners=null;
  }else if(absE>0.34&&Math.random()<0.62){
    W.type='double'; W.winners=winner; W[winner]=2; W[loser]=0; W.kills=[0,0];
  }else{
    W.type='skirmish'; W.winners=winner; W.size=midRot?3:2;
    const n=1+(Math.random()<0.35?1:0);
    W.kills=[0,0]; W.kills[winner==='me'?0:1]=n;
    W[winner]=1; if(Math.random()<0.3) W[loser]=(W[loser]||0)+1;
  }
  /* 보상: 게 골드·경험치·시야 */
  ['me','opp'].forEach(side=>{
    const n=W[side]||0;
    if(!n) return;
    addGold(side,130*n);
    lvAddXp(side,'JGL',10*n);
    (W.roam[side]||[]).forEach(r=>lvAddXp(side,r,7*n));
    M.vision[side==='me'?0:1]+=4*n;
    if(M.trait&&M.trait[side]) M.trait[side].vision=(M.trait[side].vision||0)+0.15*n;
  });
  ['me','opp'].forEach(side=>{
    const k=W.kills[side==='me'?0:1]||0;
    if(!k) return;
    M.kills[side==='me'?0:1]+=k;
    addGold(side,300*k);
    const r=(W.roam[side]&&W.roam[side][0])||'JGL';
    lvAddXp(side,r,14);
    logEvent(side==='me'?'blue':'red', '3분 · <b>바위게 교전 '+k+'킬</b> — '+
      (side==='me'?myNameAt(r):oppNameAt(r))+'('+(side==='me'?myChampAt(r):oppChampAt(r))+')이(가) 강타 싸움에서 이깁니다.');
  });
  W.edgeScore=(W.me-W.opp)*0.012+(W.kills[0]-W.kills[1])*0.004;
  M.scuttleEdge=W.edgeScore;
  const nm=s=>s==='me'?M.myName:M.oppName;
  if(W.type==='split'){
    logEvent('sys','⏱ 03:30 바위게 — 양 팀이 게를 하나씩 나눠 먹습니다 ('+nm('me')+' '+W.me+' : '+W.opp+' '+nm('opp')+')');
  }else if(W.type==='double'){
    logEvent(W.winners==='me'?'blue':'red','3분 · <b>더블 바위게!</b> '+nm(W.winners)+'이(가) 양쪽 게를 모두 가져갑니다 — '+nm(loser)+'은(는) 싸움을 포기하고 라인으로 복귀합니다.');
  }else{
    logEvent('sys','⏱ 03:30 바위게 — '+W.lane+'에서 '+(W.size||2)+'대'+(W.size||2)+' 교전. 라인 주도권이 있는 '+
      (W.roam.me.length?ROLE_KR[W.roam.me[0]]:'탑')+'·'+(W.roam.me.indexOf('MID')>=0?'미드':'정글')+'이(가) 먼저 로밍을 붙였습니다.');
  }
  logEvent('sys','🎤 전용준: '+v5Pick(V5_SCUTTLE_CAST));
  logEvent('sys','🎙 클템: '+v5Pick(V5_SCUTTLE_ANALYST));
  return W;
}

/* ---------- 2) 시야·와드 전쟁 ---------- */
function v5WardPut(side,kind,x,y,m){
  if(!M) return null;
  if(!M.visionWar) v5InitMatch();
  const W=M.visionWar;
  const w={x:clamp(Number(x)||0.5,0.04,0.96),y:clamp(Number(y)||0.5,0.04,0.96),
    kind:(kind==='pink'?'pink':'yellow'),at:m,until:(m||0)+V5_WARD_LIFE,seq:(++W.seq),side:side};
  W.wards[side].push(w);
  if(W.wards[side].length>10) W.wards[side].shift();
  M.vision[side==='me'?0:1]+=(w.kind==='pink'?4:2);
  return w;
}
function v5Sweep(side,x,y,m){
  if(!M) return 0;
  if(!M.visionWar) v5InitMatch();
  const W=M.visionWar;
  const enemy=side==='me'?'opp':'me';
  const before=W.wards[enemy].length;
  W.wards[enemy]=W.wards[enemy].filter(w=>Math.hypot(w.x-x,w.y-y)>0.07);
  const removed=before-W.wards[enemy].length;
  if(removed>0){
    W.sweeps.push({x:x,y:y,side:side,at:m,seq:(++W.seq),removed:removed});
    if(W.sweeps.length>24) W.sweeps.shift();
    M.vision[side==='me'?0:1]+=3*removed;
  }
  return removed;
}
function v5VisionScoreEdge(){
  if(!M||!M.vision) return 0;
  return clamp(((M.vision[0]||0)-(M.vision[1]||0))/520,-0.05,0.05);
}
/* 오브젝트 경합·한타에서 시야 우위가 주는 보정 */
function v5ObjVision(){ return clamp(v5VisionScoreEdge()*1.6,-0.07,0.07); }
function v5WardSetup(kind,m){
  if(!M||!M.visionWar) return;
  const spots=V5_WARD_SPOTS[kind]||V5_WARD_SPOTS.dragon;
  const vis={me:((M.trait.me||{}).vision||0),opp:((M.trait.opp||{}).vision||0)};
  ['me','opp'].forEach(side=>{
    const mine=vis[side], rival=side==='me'?vis.opp:vis.me;
    const n=clamp(Math.round(2+mine*0.6),1,spots.length);
    const off=side==='me'?-0.011:0.011;
    for(let i=0;i<n;i++){
      const sp=spots[i];
      v5WardPut(side,sp[2],sp[0]+off,sp[1]+off,m);
    }
    /* 제어와드 · 상대 와드 스윕 */
    const chance=clamp(0.24+(mine-rival)*0.05+v5Rnd(-0.08,0.14),0.05,0.8);
    if(Math.random()<chance){
      const c=spots[0];
      const r=v5Sweep(side,c[0]+(side==='me'?-0.011:0.011),c[1]+(side==='me'?-0.011:0.011),m);
      if(r>0){
        logEvent('sys', m+'분 · 👁 시야 싸움 — '+(side==='me'?M.myName:M.oppName)+'이(가) 제어와드로 상대 와드 '+r+'개를 지웁니다.');
      }
    }
  });
  const at=V5_OBJ_NAME[kind]||'오브젝트';
  logEvent('sys', m+'분 · 👁 '+at+' 60초 전 — '+(M.myName)+'·'+(M.oppName)+' 서폿·정글러가 강가 부시에 와드를 박고 시야를 다툽니다.');
}
function v5VisionTick(m){
  if(!M) return;
  if(!M.visionWar) v5InitMatch();
  const W=M.visionWar;
  ['dragon','baron','grub'].forEach(kind=>{
    (V5_OBJ_AT[kind]||[]).forEach(t=>{
      if(m===t-1){
        const key=kind+':'+t;
        if(!W.lastSetup[key]){ W.lastSetup[key]=1; v5WardSetup(kind,m); }
      }
    });
  });
  ['me','opp'].forEach(side=>{
    W.wards[side]=W.wards[side].filter(w=>(w.until||0)>m);
  });
  W.wardsMe=W.wards.me.length; W.wardsOpp=W.wards.opp.length;
  M.vision[0]+=W.wardsMe; M.vision[1]+=W.wardsOpp;
  /* 시야 우위 → 오브젝트 앞 부시 매복 픽오프 */
  const diff=(M.vision[0]||0)-(M.vision[1]||0);
  const atObj=['dragon','baron'].some(kind=>(V5_OBJ_AT[kind]||[]).indexOf(m)>=0);
  if(atObj&&Math.abs(diff)>=20&&Math.random()<clamp(0.26+Math.abs(diff)/300,0.2,0.62)){
    const side=diff>0?'me':'opp';
    const role=v5Pick(['SUP','JGL','MID']);
    const idx=side==='me'?0:1;
    M.kills[idx]=(M.kills[idx]||0)+1;
    addGold(side,380);
    lvAddXp(side,role,26);
    W.ambush[side]=(W.ambush[side]||0)+1;
    logEvent(side==='me'?'blue':'red', m+'분 · <b>시야 매복 픽오프</b> — '+
      (side==='me'?myNameAt(role):oppNameAt(role))+'('+(side==='me'?myChampAt(role):oppChampAt(role))+
      ')이(가) 부시에서 상대를 끊어냅니다 (시야 '+Math.round(M.vision[0])+':'+Math.round(M.vision[1])+')');
  }
}

/* ---------- 3) 바론 버프 공성 · 억제기 · 슈퍼 미니언 ---------- */
function v5BaronTaken(side,m){
  if(!M) return;
  if(!M.baronBuff) M.baronBuff={me:-1,opp:-1};
  if(!M.baronTakes) M.baronTakes={me:0,opp:0};
  M.baronBuff[side]=(m||M.minute||20)+3;
  M.baronTakes[side]=(M.baronTakes[side]||0)+1;
}
function v5BaronTick(m){
  if(!M||!M.baronBuff) return;
  const B=M.baronBuff;
  ['me','opp'].forEach(side=>{
    if(B[side]>=m){
      if(Math.random()<0.22){
        const res=v5TowerFall(side,m);
        if(res){ addGold(side,80); }
        const lane=v5Pick(['TOP','MID','BOT']);
        logEvent(side==='me'?'blue':'red', m+'분 · <b>바론 버프 공성</b> — '+
          (side==='me'?M.myName:M.oppName)+' '+v5LaneKR(lane)+' 웨이브가 강화돼 2차·3차 타워를 밀어냅니다.');
      }
    }else if(B[side]===m-1){
      logEvent('sys', m+'분 · 🟣 바론 버프 종료 — '+(side==='me'?M.myName:M.oppName));
      B[side]=-1;
    }
  });
}
function v5InhibCheck(m){
  if(!M||!M.inhib) return;
  ['me','opp'].forEach(atk=>{
    const def=atk==='me'?'opp':'me';
    ['MID','TOP','BOT'].forEach(l=>{
      const rec=M.inhib[def][l];
      if(!rec||!rec.alive||rec.at) return;
      if(m<14) return;               /* 14분 이전 억제기 불가 */
      const t3=(M.tw&&M.tw[def]&&M.tw[def][l])?M.tw[def][l][2]:1;
      if(t3) return;                 /* 3차 타워 살아있으면 억제기 불가 */
      rec.alive=false; rec.at=m; rec.respawnAt=m+5;
      if(!M.inhibCount) M.inhibCount=[0,0];
      M.inhibCount[atk==='me'?0:1]++;
      addGold(atk,420);
      logEvent(atk==='me'?'blue':'red', m+'분 · <b>억제기 파괴!</b> '+
        (def==='me'?M.myName:M.oppName)+' '+v5LaneKR(l)+' 억제기 붕괴 — '+
        (atk==='me'?M.myName:M.oppName)+' 슈퍼 미니언 출현');
    });
  });
}
function v5InhibRespawn(m){
  if(!M||!M.inhib) return;
  ['me','opp'].forEach(side=>{
    ['TOP','MID','BOT'].forEach(l=>{
      const rec=M.inhib[side][l];
      if(rec&&!rec.alive&&rec.respawnAt!=null&&m>=rec.respawnAt){
        rec.alive=true; rec.respawnAt=null;
        logEvent('sys', m+'분 · 🔧 '+(side==='me'?M.myName:M.oppName)+' '+l+' 억제기 재생성 — 슈퍼 미니언 중단');
      }
    });
  });
}
function v5SuperLanes(){
  /* {me:[lane...], opp:[lane...]} — 내가 밀어넣는 슈퍼 미니언 라인 */
  const out={me:[],opp:[]};
  if(!M||!M.inhib) return out;
  ['TOP','MID','BOT'].forEach(l=>{
    if(M.inhib.opp&&M.inhib.opp[l]&&!M.inhib.opp[l].alive) out.me.push(l);
    if(M.inhib.me&&M.inhib.me[l]&&!M.inhib.me[l].alive) out.opp.push(l);
  });
  return out;
}
function v5Tick(m){
  try{ v5VisionTick(m); }catch(e){}
  try{ v5BaronTick(m); }catch(e){}
  try{ v5InhibCheck(m); }catch(e){}
  try{ v5InhibRespawn(m); }catch(e){}
}

/* ---------- 4) 매크로 판단: 포기하고 교차 이득 ---------- */
function v5ObjNameKR(kind){ return ({dragon:'드래곤',baron:'바론',grub:'공허 유충',herald:'전령'})[kind]||'오브젝트'; }
function v5MacroPlan(kind,m){
  if(!M) return {me:'contest',opp:'contest'};
  const gd=(M.gold[0]||0)-(M.gold[1]||0);
  const prio=v5LanePrio('TOP')+v5LanePrio('MID')+v5LanePrio('ADC');
  const mySplit=!!(M.myComp&&M.myComp.tags&&(M.myComp.tags.split||0)>=3)||M.focusKey==='split131'||M.focusKey==='split14';
  const opSplit=!!(M.oppComp&&M.oppComp.tags&&(M.oppComp.tags.split||0)>=3);
  const myScore=prio*0.5+gd/2600+(mySplit?0.8:0)+(((M.coach.me||{}).obj||0)*1.2);
  const opScore=-prio*0.5-gd/2600+(opSplit?0.8:0)+(((M.coach.opp||{}).obj||0)*1.2);
  const plan={me:'contest',opp:'contest'};
  if(myScore<-0.5&&Math.random()<0.62) plan.me='trade';
  if(opScore<-0.5&&Math.random()<0.62) plan.opp='trade';
  if(mySplit&&Math.random()<0.55) plan.me='trade';
  if(opSplit&&Math.random()<0.55) plan.opp='trade';
  /* 앞 라인 억제기를 이미 밀고 있으면 바로 사이드로 갈라지는 게 정답 */
  if(kind==='baron'&&M.inhib&&M.inhib.opp&&M.inhib.opp.MID&&!M.inhib.opp.MID.alive) plan.me='trade';
  if(kind==='dragon'&&M.inhib&&M.inhib.me&&M.inhib.me.BOT&&!M.inhib.me.BOT.alive) plan.me='trade';
  return plan;
}
function v5MacroTradeLane(kind){ return (kind==='dragon')?'TOP':(kind==='baron')?'BOT':(kind==='grub'?'BOT':'BOT'); }
function v5MacroTrade(side,kind,m){
  if(!M) return null;
  const lane=v5MacroTradeLane(kind);
  const res=(Math.random()<0.55)?v5TowerFall(side,m):null;
  addGold(side,res?300:180);
  ROLES.forEach(r=>lvAddXp(side,r,7));
  if(M.vision) M.vision[side==='me'?0:1]+=3;
  logEvent(side==='me'?'blue':'red', m+'분 · <b>교차 이득</b> — '+(side==='me'?M.myName:M.oppName)+
    '이(가) '+v5ObjNameKR(kind)+' 교전을 포기하고 '+v5LaneKR(lane)+' 사이드 타워·플레이트를 밀어 교환합니다'+
    (res?' ('+v5LaneKR(res.lane)+' T'+((res.tier||0)+1)+' 철거)':'')+'.');
  return {lane:lane,res:res};
}

/* ============ SEASON / FLOW ============ */
const CAL_WEEKS=['1월 3주','2월 1주','2월 4주','3월 3주','4월 2주','5월 4주','7월 1주','8월 1주','8월 4주'];
const CAL_STAGES=[
  {k:'spring', month:'1~3월', label:'LCK 스프링', detail:'정규 5주 + 플레이오프', icon:'🌸'},
  {k:'msi',    month:'5월',   label:'MSI', detail:'LCK·LPL·LEC·LCS 8팀 토너먼트', icon:'🌏'},
  {k:'summer', month:'6~8월', label:'LCK 서머', detail:'정규 4주 + 플레이오프', icon:'☀️'},
  {k:'ewc',    month:'7월',   label:'EWC 이스포츠 월드컵', detail:'8팀 초청 토너먼트', icon:'🏅'},
  {k:'worlds', month:'10~11월', label:'롤드컵', detail:'스위스 → 8강 → 4강 → 결승', icon:'🌍'},
  {k:'offseason', month:'11~12월', label:'스토브리그', detail:'재계약 · FA 이적시장', icon:'💼'},
];
function stagePhase(){ return S?S.phase:'regular'; }
function calendarNow(){
  if(!S) return 'spring';
  if(S.phase==='msi') return 'msi';
  if(S.phase==='ewc') return 'ewc';
  if(S.phase==='offseason') return 'offseason';
  if(S.phase==='regular') return S.split==='summer'?'summer':'spring';
  if(S.phase==='playoffs') return S.split==='summer'?'summer':'spring';
  if(S.phase==='worlds'){
    const W=S.worlds;
    if(W){
      if(W.stage==='swiss') return 'swiss';
      if(W.stage==='bracket'){ const r=W.bracket?W.bracket.round:0; return r<=0?'quarters':r===1?'semis':'final'; }
      return 'final';
    }
    return 'swiss';
  }
  return 'worlds';
}
function weekCalLabel(w){ return CAL_WEEKS[(w-1)%CAL_WEEKS.length]; }

function genSchedule(ids){
  const arr=ids.slice(); const n=arr.length; const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i],b=arr[n-1-i];
      pairs.push(r%2===0?[a,b]:[b,a]);
    }
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function standings(){
  return Object.values(S.teams).filter(t=>t.region==='LCK').sort((x,y)=>(y.wins-x.wins)||((y.gw-y.gl)-(x.gw-x.gl))||(y.gw-x.gw));
}
function myRank(){ return standings().findIndex(t=>t.id===S.userTeam)+1; }
function weekOpponent(){
  const pairs=S.schedule[S.week-1]||[];
  const p=pairs.find(x=>x.includes(S.userTeam));
  if(!p) return null;
  return {oppId:p[0]===S.userTeam?p[1]:p[0], pair:p};
}
function recordResult(aId,bId,sa,sb,week,stage){
  const a=T(aId),b=T(bId);
  a.gw+=sa;a.gl+=sb;b.gw+=sb;b.gl+=sa;
  if(sa>sb){a.wins++;b.losses++;a.form.push('W');b.form.push('L');}
  else{b.wins++;a.losses++;b.form.push('W');a.form.push('L');}
  if(a.form.length>6)a.form.shift(); if(b.form.length>6)b.form.shift();
  try{
    if(typeof simAiStats==='function'){
      const kA=ri(6,18)+sa*3, kB=ri(6,18)+sb*3;
      if(aId!==S.userTeam) simAiStats(aId,sa>sb,kA,kB);
      if(bId!==S.userTeam) simAiStats(bId,sb>sa,kB,kA);
    }
  }catch(e){}
  if(aId!==S.userTeam && bId!==S.userTeam){
    const winT=sa>sb?a:b;
    const ps=winT.roster.map(n=>S.players[n]).filter(Boolean);
    const star=ps.sort((x,y)=>rawOverall(y)-rawOverall(x)).slice(0,2);
    star.forEach(p=>{ S.pog[p.name]=(S.pog[p.name]||0)+ri(40,100); });
  }
  S.results.push({week,stage,a:aId,b:bId,sa,sb});
}
function simAIBo(aId,bId,bo){
  const pa=teamPower(T(aId)),pb=teamPower(T(bId));
  const need=Math.ceil(bo/2); let sa=0,sb=0;
  const base=sig((pa-pb)/5.5);
  while(sa<need&&sb<need){
    if(Math.random()<clamp(base+ (Math.random()-0.5)*0.16,0.05,0.95)) sa++; else sb++;
  }
  return {sa,sb};
}

/* ---------- series ---------- */
function createSeries(oppId,bo,stage,meta){
  const s={oppId,bo,stage,meta:meta||{},score:{me:0,opp:0},games:[],sides:[],fearless:!!S.fearless,
    fearlessUsed:[],done:false,pendingSide:false,coach:null,momentum:0,startedAt:Date.now()};
  s.sides[0]=Math.random()<0.5?'blue':'red';
  S.currentSeries=s; S.seriesMomentum=0;
  return s;
}
function seriesWinNeed(s){ return Math.ceil(s.bo/2); }
function seriesOver(s){ return s.score.me>=seriesWinNeed(s)||s.score.opp>=seriesWinNeed(s); }
function userWonSeries(s){ return s.score.me>=seriesWinNeed(s); }
function aiSideChoice(){
  const opp=T(S.currentSeries.oppId);
  const topPick=Math.max(...Object.values(opp.lineup).map(n=>{
    const p=S.players[n]; return p?Math.max(...p.sigs.map(x=>champTier(x))):0;
  }));
  return topPick>=5?'blue':'red';
}
function setNextSide(side){
  const s=S.currentSeries; if(!s) return;
  s.sides[s.games.length]=side; s.pendingSide=false;
  startDraft(s);
}
function nextSeriesGame(){
  const s=S.currentSeries; if(!s) return;
  if(seriesOver(s)){ finishSeries(); return; }
  const last=s.games[s.games.length-1];
  if(!last){ startDraft(s); return; }
  const userLost=!last.win;
  if(userLost){ s.pendingSide=true; renderSideChoice(); }
  else { s.sides[s.games.length]=aiSideChoice(); startDraft(s); }
}
function applyCoaching(kind){
  const s=S.currentSeries; if(!s||!s.coach||s.coach.applied) return;
  const me=myTeam();
  if(kind==='mental'){
    lineupOf(me).forEach(p=>{p.form=clamp(p.form+ri(5,10),20,100);p.fatigue=clamp(p.fatigue-ri(3,7),0,100);});
    s.coach.msg='멘탈 케어 완료 — 선수단 컨디션과 집중력이 올라갔습니다';
  }else if(kind==='tactic'){
    s.nextEdge=(s.nextEdge||0)+1.1;
    s.coach.msg='전술 수정 — 다음 세트 초반 설계와 교전 규칙을 재정비했습니다';
  }else if(kind==='sub'){
    const worst=lineupOf(me).slice().sort((a,b)=>effRating(a)-effRating(b))[0];
    const bench=me.roster.map(n=>S.players[n]).filter(p=>!Object.values(me.lineup).includes(p.name));
    const best=bench.sort((a,b)=>effRating(b)-effRating(a))[0];
    if(worst&&best){
      const role=Object.keys(me.lineup).find(r=>me.lineup[r]===worst.name);
      me.lineup[role]=best.name;
      s.coach.msg='식스맨 교체 — '+worst.name+' OUT, '+best.name+' IN ('+ROLE_KR[role]+')';
    }else{ s.coach.msg='교체 가능한 식스맨이 없습니다'; }
  }
  s.coach.applied=kind;
  saveGame(); renderSeriesResult();
}
function finishSeries(){
  const s=S.currentSeries; if(!s) return;
  s.done=true;
  const meWon=userWonSeries(s);
  const oppId=s.oppId;
  if(s.stage==='regular'){
    recordResult(S.userTeam,oppId,s.score.me,s.score.opp,S.week,'regular');
    (S.schedule[S.week-1]||[]).forEach(([a,b])=>{
      if(a===S.userTeam||b===S.userTeam) return;
      const r=simAIBo(a,b,3);
      recordResult(a,b,r.sa,r.sb,S.week,'regular');
    });
    S.history.push({week:S.week,opp:oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'regular'});
    try{
      if(S.pressTrash&&S.club){
        const c=S.club;
        if(meWon){
          c.fanbase=clamp(c.fanbase+8,0,100); c.prestige=clamp(c.prestige+3,0,100); c.trust=clamp((c.trust||55)+2,0,100);
          newsAdd('press','🔥 도발 적중 — 여론 폭발! 팬심 +8 · 명성 +3');
        }else{
          c.fanbase=clamp(c.fanbase-6,0,100); c.prestige=clamp(c.prestige-2,0,100); c.trust=clamp((c.trust||55)-3,0,100);
          newsAdd('press','💬 도발 역풍 — 커뮤니티가 들끓습니다. 팬심 -6 · 명성 -2');
        }
        S.pressTrash=null; c.community=null;
      }
    }catch(e){}
    /* ---- 업셋 보상: 전력 열세를 이기면 팬심·명성이 크게 오른다 ---- */
    try{
      const pw=(s.meta&&s.meta.power)||null;
      const c=clubC();
      if(meWon&&pw&&pw.my<pw.opp-2){
        const gap=Math.round((pw.opp-pw.my)*10)/10;
        c.fanbase=clamp(c.fanbase+7,0,100);
        c.prestige=clamp(c.prestige+3,0,100);
        c.trust=clamp((c.trust||55)+2,0,100);
        S.upsets=(S.upsets||0)+1;
        newsAdd('match','⚡ 업셋 — 전력차 '+gap+' 열세를 밴픽·코칭으로 뒤집었습니다. 팬심 +7 · 명성 +3');
      }
    }catch(e){}
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'regular'};
    S.week++;
    S.actionApplied=false; S.weekActionTarget=null; S.gameplan=null;
    try{ clubWeekAdvance(); }catch(e){}
    if(S.split==='spring'&&S.week>5){ startPlayoffs('spring'); }
    else if(S.split==='summer'&&S.week>ROUNDS){ startPlayoffs('summer'); }
    else if(Math.abs(S.week-(S.lastPatchWeek||1))>=2){ applyRandomPatch('WK'+S.week); }
    else if(S.split==='summer'&&S.week===8&&!S.ewc){ startEWC(); }
    S.currentSeries=null; S.seriesMomentum=0;
  }else if(s.stage==='kespa'){
    const km=s.meta&&s.meta.kespaMatch;
    if(km){ kespaRecord(km,s.score.me,s.score.opp); }
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'kespa'};
    if(meWon){ S.club.fanbase=clamp(S.club.fanbase+2,0,100); }
    S.currentSeries=null; S.seriesMomentum=0;
    saveGame();
    renderAll();
    return;
  }else if(s.stage==='msi'||s.stage==='ewc'){
    const m=s.meta.match;
    if(m){ m.sa=s.score.me; m.sb=s.score.opp; m.winner=s.score.me>s.score.opp?S.userTeam:oppId; m.done=true; }
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:s.stage};
    S.currentSeries=null; S.seriesMomentum=0;
    saveGame();
    renderIntl();
    return;
  }else if(s.stage==='worlds'){
    const m=s.meta.match;
    if(m){ m.sa=s.score.me; m.sb=s.score.opp; m.winner=s.score.me>s.score.opp?S.userTeam:oppId; m.done=true; }
    S.history.push({stage:'worlds',round:(s.meta.roundName||'월즈'),opp:oppId,score:s.score.me+'-'+s.score.opp,win:meWon});
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'worlds'};
    S.currentSeries=null; S.seriesMomentum=0;
    saveGame();
    renderWorlds();
    return;
  }else{
    const m=s.meta.match;
    m.sa=s.score.me; m.sb=s.score.opp; m.winner=meWon?S.userTeam:oppId; m.done=true;
    recordResult(S.userTeam,oppId,s.score.me,s.score.opp,S.week,'playoffs');
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:s.stage};
    if(!meWon) S.myExit={round:(s.meta&&s.meta.roundName)||'플레이오프',score:s.score.opp+'-'+s.score.me};
    S.currentSeries=null; S.seriesMomentum=0;
    checkPlayoffComplete();
  }
  saveGame();
  if(S.phase==='worlds'){ renderWorlds(); return; }
  if(S.phase==='end'){ renderChampion(); return; }
  renderAfterSeries();
}

/* ---------- playoffs ---------- */
function startPlayoffs(split){
  S.playoffSplit=split||S.split||'summer';
  applyRandomPatch('플레이오프 직전');
  const st=standings();
  const seeds=st.slice(0,6).map(t=>t.id);
  S.playoffs={
    seeds,
    rounds:[
      {name:'6강 PO',matches:[
        {a:seeds[2],b:seeds[5],done:false},
        {a:seeds[3],b:seeds[4],done:false},
      ]},
      {name:'4강 PO',matches:[
        {a:seeds[0],b:null,done:false},
        {a:seeds[1],b:null,done:false},
      ]},
      {name:'결승',matches:[{a:null,b:null,done:false}]},
    ],
    done:false,
  };
  S.phase='playoffs';
  saveGame();
}
function ensureBracket(){
  const P=S.playoffs; if(!P) return;
  const r0=P.rounds[0],r1=P.rounds[1],r2=P.rounds[2];
  if(r0.matches.every(m=>m.done)){
    r1.matches[0].b=r0.matches[0].winner;
    r1.matches[1].b=r0.matches[1].winner;
  }
  if(r1.matches.every(m=>m.done&&m.winner)){
    r2.matches[0].a=r1.matches[0].winner;
    r2.matches[0].b=r1.matches[1].winner;
  }
}
function checkPlayoffComplete(){
  const P=S.playoffs; if(!P) return false;
  const fin=P.rounds[2].matches[0];
  if(!fin.done) return false;
  P.done=true;
  S.lckChampion=fin.winner;
  S.lckRunnerUp=fin.winner===fin.a?fin.b:fin.a;
  S.champion=S.lckChampion; S.runnerUp=S.lckRunnerUp;
  if(S.playoffSplit==='spring'){
    S.springChampion=fin.winner; S.springRunnerUp=S.lckRunnerUp;
    try{ if(typeof computeAwards==='function') S.awardsPending=computeAwards('spring'); }catch(e){}
    startMSI();
  }else{
    S.summerChampion=fin.winner; S.summerRunnerUp=S.lckRunnerUp;
    try{ if(typeof computeAwards==='function') S.awardsPending=computeAwards('summer'); }catch(e){}
    startWorlds();
  }
  return true;
}
function playoffNext(){
  const P=S.playoffs; if(!P||P.done) return {action:'done'};
  for(let pass=0;pass<6;pass++){
    ensureBracket();
    let simmed=false;
    for(let r=0;r<P.rounds.length;r++){
      for(const m of P.rounds[r].matches){
        if(m.done||!m.a||!m.b) continue;
        if(m.a===S.userTeam||m.b===S.userTeam){
          return {action:'user',match:m,round:r,roundName:P.rounds[r].name};
        }
        const res=simAIBo(m.a,m.b,5);
        m.sa=res.sa;m.sb=res.sb;m.winner=res.sa>res.sb?m.a:m.b;m.done=true;
        recordResult(m.a,m.b,res.sa,res.sb,S.week,'playoffs');
        simmed=true;
      }
    }
    ensureBracket();
    const fin=P.rounds[2].matches[0];
    if(fin.done){ checkPlayoffComplete(); return {action:'done'}; }
    if(!simmed) break;
  }
  return {action:'none'};
}
function startPlayoffSeries(match,roundName){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const s=createSeries(oppId,5,'playoff',{match,roundName});
  if(!s.sides[0]) s.sides[0]='blue';
  saveGame();
  return s;
}

/* ================= MSI / EWC 국제 초청 토너먼트 ================= */
function startMSI(){
  try{ S.splashPending='msi'; }catch(e){}
  const st=standings();
  const lck=[S.springChampion,S.springRunnerUp].filter(id=>id&&S.teams[id]);
  st.forEach(t=>{ if(lck.length<2&&!lck.includes(t.id)) lck.push(t.id); });
  const teams=[lck[0],lck[1],'BLG','TES','G2','FNC','FLY','TL'].filter((x,i,a)=>x&&a.indexOf(x)===i);
  S.msi={kind:'msi',name:'MSI',month:'5월',bo:5,teams,bracket:makeIntlBracket(teams,5,'5월'),
    done:false,champion:null,runnerUp:null,userIn:teams.includes(S.userTeam)};
  S.phase='msi';
  applyRandomPatch('MSI 패치');
  saveGame();
}
function startEWC(){
  try{ S.splashPending='ewc'; }catch(e){}
  const lck=standings().slice(0,2).map(t=>t.id);
  const teams=[...lck,'BLG','TES','G2','FNC','FLY','TL'].filter((x,i,a)=>x&&a.indexOf(x)===i);
  S.ewc={kind:'ewc',name:'EWC 이스포츠 월드컵',month:'7월',bo:3,teams,bracket:makeIntlBracket(teams,3,'7월'),
    done:false,champion:null,runnerUp:null,userIn:teams.includes(S.userTeam)};
  S.phase='ewc';
  saveGame();
}
function makeIntlBracket(teams,bo,month){
  const s=teams.slice(0,8);
  const mk=(a,b)=>({a,b,bo,done:false});
  return {round:0, rounds:[
    {name:'8강', month, matches:[mk(s[0],s[7]),mk(s[3],s[4]),mk(s[1],s[6]),mk(s[2],s[5])]},
    {name:'4강', month, matches:[mk(null,null),mk(null,null)]},
    {name:'결승', month, matches:[mk(null,null)]},
  ]};
}
function intlNow(){ return S.phase==='msi'?S.msi:(S.phase==='ewc'?S.ewc:null); }
function simIntlMatch(m,tour){
  const r=simAIBo(m.a,m.b,m.bo||tour.bo||5);
  m.sa=r.sa; m.sb=r.sb; m.winner=r.sa>r.sb?m.a:m.b; m.done=true;
}
function intlAdvance(tour){
  const B=tour.bracket; const rd=B.rounds[B.round];
  if(!rd.matches.every(m=>m.done)) return {action:'pending'};
  if(B.round>=B.rounds.length-1){
    const fin=rd.matches[0];
    tour.done=true; tour.champion=fin.winner; tour.runnerUp=fin.winner===fin.a?fin.b:fin.a;
    if(tour.kind==='msi'){
      S.msiChampion=tour.champion;
      S.split='summer'; S.phase='regular'; S.week=6; S.splashPending='summer';
      S.actionApplied=false; S.weekActionTarget=null; S.gameplan=null;
      toast('☀️ MSI 종료 — 서머 시즌이 시작됩니다');
    }else{
      S.ewcChampion=tour.champion;
      S.phase='regular'; S.splashPending='summer';
      toast('🏅 EWC 종료 — 서머 시즌으로 복귀합니다');
    }
    saveGame();
    return {action:'done'};
  }
  const winners=rd.matches.map(m=>m.winner);
  const next=B.rounds[B.round+1];
  next.matches.forEach((m,i)=>{ m.a=winners[i*2]||null; m.b=winners[i*2+1]||null; });
  B.round++;
  saveGame();
  return {action:'advanced'};
}
function intlNext(){
  const tour=intlNow(); if(!tour) return {action:'none'};
  const rd=tour.bracket.rounds[tour.bracket.round];

  rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b) simIntlMatch(m,tour); });

}
function intlSeries(match,roundName,tour){

/* ================= WORLDS (롤드컵) ================= */
const WORLDS_INTL=['BLG','TES','LNG','WBG','G2','FNC','MKOI','KC','FLY','TL','C9','100T'];
function lckSeeds(){
  const P=S.playoffs;
  const st=standings().map(t=>t.id);
  const out=[];
  const fin=P?P.rounds[2].matches[0]:null;
  if(fin&&fin.winner){
    out.push(fin.winner);
    const loser=fin.winner===fin.a?fin.b:fin.a;
    if(loser&&!out.includes(loser)) out.push(loser);
  }
  if(P&&P.rounds[1]){
    P.rounds[1].matches.forEach(m=>{ if(m.done&&m.winner){ const loser=m.winner===m.a?m.b:m.a; if(loser&&!out.includes(loser)) out.push(loser); } });
  }
  st.forEach(id=>{ if(out.length<4&&!out.includes(id)) out.push(id); });
  return out.slice(0,4);
}
function startWorlds(seedOverride){
  try{ S.splashPending='worlds'; }catch(e){}
  applyRandomPatch('월즈 메이저 패치');
  let seeds=(seedOverride&&seedOverride.length?seedOverride:lckSeeds()).slice(0,4);
  if(!seedOverride&&S.msiChampion&&T(S.msiChampion)&&T(S.msiChampion).region==='LCK'&&!seeds.includes(S.msiChampion)){
    seeds=[S.msiChampion,...seeds.slice(0,3)];
  }
  const teams=[...seeds, ...WORLDS_INTL.filter(id=>!seeds.includes(id)&&T(id))];
  const rec={};
  teams.forEach(id=>{ rec[id]={w:0,l:0,opp:[],region:T(id).region}; });
  S.worlds={
    season:S.season, teams, rec, seeds, round:0, rounds:[],
    stage:'swiss', qualified:[], eliminated:[], bracket:null,
    champion:null, runnerUp:null, done:false, userIn:teams.includes(S.userTeam),
  };
  S.phase='worlds';
  worldsPairRound();
  saveGame();
}
function worldsActive(){
  const W=S.worlds; if(!W) return [];
  return W.teams.filter(id=>!W.qualified.includes(id)&&!W.eliminated.includes(id));
}
function worldsPairRound(){
  const W=S.worlds; if(!W) return;
  const active=worldsActive();
  const groups={};
  active.forEach(id=>{ const k=W.rec[id].w+'-'+W.rec[id].l; (groups[k]=groups[k]||[]).push(id); });
  const matches=[];
  Object.keys(groups).forEach(k=>{
    const list=groups[k].sort((a,b)=>teamPowerRaw(T(b))-teamPowerRaw(T(a)));
    const pool=list.slice();
    while(pool.length>=2){
      const a=pool.shift();
      let idx=pool.findIndex(b=>!W.rec[a].opp.includes(b)&&b!==a);
      if(idx<0) idx=0;
      const b=pool.splice(idx,1)[0];
      matches.push({a,b,bo:1,done:false,stage:'swiss',round:W.round+1});
    }
  });
  W.rounds.push({name:'스위스 R'+(W.round+1), swiss:true, matches, done:false, month:'10월'});
  W.round++;
  saveGame();
}
function simWorldsMatch(m){
  if(m.done) return;
  const bo=m.bo||1;
  const r=simAIBo(m.a,m.b,bo);
  m.sa=r.sa; m.sb=r.sb; m.winner=r.sa>r.sb?m.a:m.b; m.done=true;
  const w=m.winner,l=(w===m.a?m.b:m.a);
  const ps=(w===S.userTeam?[]:[]);
  return m;
}
function worldsCloseRound(){
  const W=S.worlds; if(!W) return;
  const rd=W.rounds[W.rounds.length-1];
  rd.matches.forEach(m=>{
    const w=m.winner, l=(w===m.a?m.b:m.a);
    if(!W.rec[w]) return;
    W.rec[w].w++; W.rec[l].l++;
    W.rec[w].opp.push(l); W.rec[l].opp.push(w);
    if(W.rec[w].w>=3&&!W.qualified.includes(w)) W.qualified.push(w);
    if(W.rec[l].l>=3&&!W.eliminated.includes(l)) W.eliminated.push(l);
  });
  rd.done=true;
  if(W.qualified.length>=8){ W.stage='bracket'; buildWorldsBracket(); return; }
  worldsPairRound();
}
function worldsSeedOrder(){
  const W=S.worlds;
  return W.qualified.slice().sort((a,b)=>{
    const ra=W.rec[a], rb=W.rec[b];
    return (rb.w-ra.w)||(ra.l-rb.l)||(teamPowerRaw(T(b))-teamPowerRaw(T(a)));
  });
}
function buildWorldsBracket(){
  const W=S.worlds;
  const s=worldsSeedOrder();
  const mk=(a,b)=>({a,b,bo:5,done:false,stage:'ko'});
  W.bracket={ round:0, rounds:[
    {name:'8강', month:'10월', matches:[mk(s[0],s[7]),mk(s[3],s[4]),mk(s[1],s[6]),mk(s[2],s[5])]},
    {name:'4강', month:'11월', matches:[{a:null,b:null,bo:5,done:false,stage:'ko'},{a:null,b:null,bo:5,done:false,stage:'ko'}]},
    {name:'결승', month:'11월', matches:[{a:null,b:null,bo:5,done:false,stage:'ko'}]},
  ]};
  W.stage='bracket';
  saveGame();
}
function worldsBracketRound(){ const W=S.worlds; return W&&W.bracket?W.bracket.rounds[W.bracket.round]:null; }
function worldsAdvanceBracket(){
  const W=S.worlds; const B=W.bracket; if(!B) return {action:'none'};
  const rd=B.rounds[B.round];
  if(!rd.matches.every(m=>m.done)) return {action:'pending'};
  if(B.round>=B.rounds.length-1){ worldsFinish(); return {action:'done'}; }
  const winners=rd.matches.map(m=>m.winner);
  const next=B.rounds[B.round+1];
  next.matches.forEach((m,i)=>{ m.a=winners[i*2]||null; m.b=winners[i*2+1]||null; });
  B.round++;
  saveGame();
  return {action:'advanced'};
}
function worldsNext(){
  const W=S.worlds; if(!W) return {action:'none'};
  if(W.stage==='swiss'){
    const rd=W.rounds[W.rounds.length-1];
    if(!rd) return {action:'none'};
    const mine=rd.matches.find(m=>!m.done&&(m.a===S.userTeam||m.b===S.userTeam));
    if(mine) return {action:'user', match:mine, roundName:rd.name};
    rd.matches.forEach(m=>{ if(!m.done) simWorldsMatch(m); });
    worldsCloseRound();
    return {action:'advanced'};
  }
  if(W.stage==='bracket'){
    const rd=worldsBracketRound();
    if(!rd) return {action:'none'};
    const mine=rd.matches.find(m=>!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam));
    if(mine) return {action:'user', match:mine, roundName:rd.name};
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b) simWorldsMatch(m); });
    return worldsAdvanceBracket();
  }
  return {action:'none'};
}
function worldsSeries(match,roundName){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const bo=match.bo||1;
  const s=createSeries(oppId,bo,'worlds',{match,roundName});
  s.sides[0]=Math.random()<0.5?'blue':'red';
  saveGame();
  return s;
}
function worldsFinish(){
  const W=S.worlds; if(!W||!W.bracket) return;
  const fin=W.bracket.rounds[2].matches[0];
  W.done=true; W.stage='done';
  W.champion=fin.winner; W.runnerUp=fin.winner===fin.a?fin.b:fin.a;
  S.phase='end';
  S.champion=W.champion; S.runnerUp=W.runnerUp;
  S.worldsHistory=S.worldsHistory||[];
  S.worldsHistory.push({season:S.season, champion:W.champion, runnerUp:W.runnerUp, userTeam:S.userTeam, place:worldsUserPlace()});
  saveGame();
}
function worldsUserPlace(){
  const W=S.worlds; if(!W) return '-';
  if(W.champion===S.userTeam) return '우승';
  if(W.runnerUp===S.userTeam) return '준우승';
  if(!W.userIn) return '진출 실패';
  if(W.bracket){
    for(const rd of W.bracket.rounds){
      for(const m of rd.matches){
        if(m.done&&(m.a===S.userTeam||m.b===S.userTeam)&&m.winner!==S.userTeam) return rd.name+' 탈락';
      }
    }
  }
  return '스위스 탈락';
}

/* ---------- offseason: 계약 만료 · 재계약 / FA ---------- */
function startOffseason(){
  const st={players:[],staff:[],aiLog:[]};
  // 계약 1년 차감
  Object.values(S.players).forEach(p=>{
    if(p.retired) return;
    p.contract=(p.contract===undefined?1:p.contract)-1;
  });
  Object.values(S.staffLib||{}).forEach(s=>{ if(s.team) s.contract=(s.contract===undefined?1:s.contract)-1; });
  // 우리 팀 만료자
  const me=myTeam();
  me.roster.forEach(n=>{
    const p=S.players[n];
    if(p && p.contract<=0) st.players.push(n);
  });
  staffAll(S.userTeam).forEach(s=>{ if(s.contract<=0) st.staff.push(s.id); });
  // AI 팀 자동 처리
  Object.values(S.teams).forEach(t=>{
    if(t.id===S.userTeam) return;
    t.roster.slice().forEach(n=>{
      const p=S.players[n]; if(!p||p.contract>0) return;
      const keep=Math.random()<0.68 && t.budget>p.salary*0.5;
      if(keep){ p.contract=ri(1,3); t.budget=Math.round((t.budget-p.salary*0.5)*10)/10; }
      else{
        t.roster=t.roster.filter(x=>x!==n);
        Object.keys(t.lineup).forEach(r=>{ if(t.lineup[r]===n) delete t.lineup[r]; });
        p.team=null; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10;
        st.aiLog.push(p.name+' → FA');
      }
    });
    ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  });
  // AI 스태프
  Object.values(S.staffLib||{}).forEach(s=>{
    if(!s.team||s.team===S.userTeam||s.contract>0) return;
    if(Math.random()<0.7){ s.contract=ri(1,2); }
    else { s.team=null; }
  });
  S.phase='offseason';
  S.offseason=st;
  saveGame();
  renderOffseason();
}
function reSignPlayer(name, years){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  const yearsN=Math.max(1,Math.min(3,Number(years)||2));
  const cost=Math.round(p.salary*(0.35+0.12*yearsN)*10)/10;
  if(t.budget<cost) return {ok:false,msg:'예산 부족 (재계약 비용 '+cost.toFixed(1)+'억)'};
  t.budget=Math.round((t.budget-cost)*10)/10;
  p.contract=yearsN;
  S.offseason.players=(S.offseason.players||[]).filter(n=>n!==name);
  toast('📝 '+name+' 재계약 — '+yearsN+'년 ('+cost.toFixed(1)+'억)');
  saveGame(); renderOffseason(); return {ok:true};
}
function releaseExpiringPlayer(name){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  if(t.roster.length<=6) return {ok:false,msg:'최소 6명은 유지해야 합니다'};
  t.roster=t.roster.filter(n=>n!==name);
  Object.keys(t.lineup).forEach(r=>{ if(t.lineup[r]===name) delete t.lineup[r]; });
  p.team=null; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10; p.contract=0;
  ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  S.offseason.players=(S.offseason.players||[]).filter(n=>n!==name);
  toast('🚪 '+name+' FA 방출 — 이적시장으로 나갑니다');
  saveGame(); renderOffseason(); return {ok:true};
}
function offseasonRenewStaff(id, years){
  const st=S.staffLib[id]; if(!st||st.team!==S.userTeam) return {ok:false,msg:'우리 스태프가 아닙니다'};
  const yearsN=Math.max(1,Math.min(3,Number(years)||2));
  const cost=Math.round(st.salary*0.6*yearsN*10)/10;
  if(myTeam().budget<cost) return {ok:false,msg:'예산 부족 (재계약 '+cost.toFixed(1)+'억)'};
  myTeam().budget=Math.round((myTeam().budget-cost)*10)/10;
  st.contract=yearsN;
  S.offseason.staff=(S.offseason.staff||[]).filter(x=>x!==id);
  toast('🤝 '+st.name+' 재계약 — '+yearsN+'시즌');
  saveGame(); renderOffseason(); return {ok:true};
}
function finishOffseason(){
  if((S.offseason&&S.offseason.players&&S.offseason.players.length)||(S.offseason&&S.offseason.staff&&S.offseason.staff.length)){
    // 남은 만료자는 자동 FA 처리
    (S.offseason.players||[]).slice().forEach(n=>releaseExpiringPlayer(n));
    (S.offseason.staff||[]).slice().forEach(id=>{
      const st=S.staffLib[id]; if(st&&st.team===S.userTeam){
        const cur=S.staff[S.userTeam];
        if(st.role==='HEAD') cur.head=null; else cur.coaches=cur.coaches.filter(x=>x!==id);
        st.team=null; st.contract=0;
      }
    });
    S.offseason={players:[],staff:[],aiLog:(S.offseason.aiLog||[])};
  }
  nextSeason();
}

function nextSeason(){
  S.season++;
  S.week=1; S.phase='regular'; S.results=[]; S.history=[]; S.playoffs=null; S.champion=null;
  S.worlds=null; S.lckChampion=null; S.myExit=null; S.trainingLog=[]; S.offseason=null;
  S.meta={tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}}; S.patches=[]; S.patchNotes=[]; S.patchNo=0;
  S.currentSeries=null; S.seriesMomentum=0;
  Object.values(S.teams).forEach(t=>{t.wins=0;t.losses=0;t.gw=0;t.gl=0;t.form=[];t.pogTotal=0;});
  Object.values(S.players).forEach(p=>{
    p.age++;
    if(p.age<=21){ const k=pickOf(['lane','fight','pool']); p.stats[k]=clamp(p.stats[k]+ri(1,3),40,99); p.stats.macro=clamp(p.stats.macro+ri(0,2),40,99); }
    else if(p.age>=27){ const k=pickOf(['lane','fight','mental']); p.stats[k]=clamp(p.stats[k]-ri(1,2),40,99); }
    p.stats.mental=clamp(p.stats.mental+ri(-1,2),40,99);
    p.form=ri(65,85); p.fatigue=ri(3,15);

    if(Math.random()<0.3 && p.bad&&p.bad.length) p.bad.pop();
    rollTraits(p,p.grade);
  });
  S.schedule=genSchedule(lckIds());
  saveGame();
  if(myTeam().region!=='LCK'){ startWorlds(); return; }
  renderAll();
}

function clubInit(){
  if(!S) return;
  if(!S.owner) S.owner={name:'박성수', role:'구단주'};
  if(!S.club) S.club={};
  const c=S.club;
  if(typeof c.fanbase!=='number') c.fanbase=52;
  if(typeof c.prestige!=='number'){ const tier=(S.teams[S.userTeam].tier||'A'); c.prestige=({ 'S+':88,'S':82,'A+':74,'A':68,'B+':58,'B':52,'B-':48,'C':42 })[tier]||60; }
  if(typeof c.membership!=='number') c.membership=1.0;
  if(!c.sponsors) c.sponsors={main:null, sub:[]};
  if(!Array.isArray(c.sponsors.sub)) c.sponsors.sub=[];
  if(!c.offers||!c.offers.main||!c.offers.main.length) rollSponsorOffers();
  if(!c.plan) c.plan={};
  if(!Array.isArray(c.academy)||!c.academy.length) c.academy=academyGen();
  if(!c.acadInvest) c.acadInvest='std';
  if(!Array.isArray(c.goods)) c.goods=[];
  if(!Array.isArray(c.meetings)) c.meetings=[];
  if(!Array.isArray(c.campaigns)) c.campaigns=[];
  if(!Array.isArray(c.news)) c.news=[];
  if(!c.community) c.community=null;
  if(!c.goals) c.goals=ownerGoals();
  if(!c.facts) c.facts={};
  if(!c.carry) c.carry=S.teams[S.userTeam].budget;
  if(!c.trust) c.trust=55;
  if(typeof c.tickWeek!=='number') c.tickWeek=0;
  if(!S.kespa) S.kespa=kespaInit();
  return c;
}
function clubC(){ if(!S) return null; if(!S.club) return clubInit(); return S.club; }

/* ---------- 주간 일정표 ---------- */
function matchDayIndex(){ return (S.week%2===1)?1:4; }
function planGet(name){ const c=clubC(); const p=c.plan[name]; if(p&&p.length===7) return p.slice(); return ['none','none','none','none','none','none','none']; }
function planSet(name,day,k){
  const c=clubC();
  if(typeof day!=='number'||day<0||day>6) return;
  const md=matchDayIndex();
  if(day===md) return;
  const p=planGet(name); p[day]=k; c.plan[name]=p; saveGame();
}
function planSetAll(name,k){ const c=clubC(); const md=matchDayIndex(); const p=planGet(name); for(let i=0;i<7;i++){ if(i!==md) p[i]=k; } c.plan[name]=p; saveGame(); }
function planSetDay(day,k){ if(day===matchDayIndex()) return; startersOfMine().forEach(p=>planSet(p.name,day,k)); saveGame(); }
function planSetWeek(k){ startersOfMine().forEach(p=>planSetAll(p.name,k)); }
function startersOfMine(){ return lineupOf(myTeam()); }
function planAutofill(force){
  const c=clubC(); const md=matchDayIndex();
  const t=myTeam();
  const ordered=t.roster.map(n=>S.players[n]).filter(Boolean);
  ordered.forEach((p,pi)=>{
    const p7=[];
    const needRest=p.fatigue>=55?2:p.fatigue>=35?1:1;
    let restLeft=needRest;
    for(let d=0;d<7;d++){
      if(d===md){ p7.push('match'); continue; }
      if(restLeft>0 && (d===3 || d===6 || d===5-((pi)%2))){ p7.push('rest'); restLeft--; continue; }
      p7.push(restLeft>0?'rest':['scrim','solo','champ','scrim','solo','champ'][ (d+pi)%6 ]);
    }
    // 경기 다음날은 회복
    if(md+1<7) p7[md+1]='rest';
    c.plan[p.name]=p7;
  });
  saveGame();
  if(force) toast('🧑‍🏫 수석코치가 선수단 주간 일정을 편성했습니다');
}
function planIsEmpty(){
  const c=clubC(); return startersOfMine().every(p=>{ const p7=c.plan[p.name]; return !p7||p7.every(k=>k==='none'||k==='match'); });
}

/* ---------- 주간 일정 적용 ---------- */
function clubApplyWeekPlan(){
  const c=clubC(); const t=myTeam();
  const sm=staffTrainingMods(t.id);
  const players=t.roster.map(n=>S.players[n]).filter(Boolean);
  let evDays=0;
  players.forEach(p=>{
    const p7=c.plan[p.name];
    if(!p7||!p7.length) return;
    let rest=0,train=0;
    p7.forEach(k=>{
      if(k==='rest') rest++;
      else if(k==='scrim'){ train++; p.form=clamp(p.form+ri(2,5),10,100); p.fatigue=clamp(p.fatigue+ri(9,13),0,100); if(Math.random()<0.32) p.stats.macro=clamp(p.stats.macro+1,40,99); }
      else if(k==='solo'){ train++; p.form=clamp(p.form+ri(1,4),10,100); p.fatigue=clamp(p.fatigue+ri(5,8),0,100); const key=pickOf(['lane','fight']); p.stats[key]=clamp(p.stats[key]+ri(1,2),40,99); }
      else if(k==='champ'){ train++; p.fatigue=clamp(p.fatigue+ri(6,9),0,100); p.stats.pool=clamp(p.stats.pool+ri(1,2),40,99); }
      else if(k==='event'){ evDays++; p.form=clamp(p.form-ri(0,2),10,100); p.fatigue=clamp(p.fatigue+ri(2,5),0,100); }
    });
    if(rest===0){ p.fatigue=clamp(p.fatigue+12,0,100); p.form=clamp(p.form-6,10,100); traitLog(p.name+' — 휴식 없는 주간으로 컨디션이 급락했습니다','bad'); }
    else if(rest>=2){ p.fatigue=clamp(p.fatigue-6,0,100); p.form=clamp(p.form+3,10,100); }
    if(train>=6&&rest===0) p.fatigue=clamp(p.fatigue+6,0,100);
  });
  if(evDays>0){
    c.fanbase=clamp(c.fanbase+evDays*0.35,0,100);
    c.prestige=clamp(c.prestige+evDays*0.15,0,100);
  }
}

/* ---------- 재정 장부 ---------- */
function clubScale(){ try{ return clamp(teamSalary(myTeam())/44,0.5,8); }catch(e){ return 1; } }
function finLedger(){
  const c=clubC(); const t=myTeam();
  let sp=sponsorAnnualTotal();
  const signed=(c.sponsors.main?1:0)+(c.sponsors.sub||[]).length;
  const slots=Math.max(0,sponsorCapacity()-signed);
  if(slots>0){
    const pool=((c.offers&&c.offers.main)||[]).concat((c.offers&&c.offers.sub)||[]);
    const avg=pool.length?pool.reduce((a,x)=>a+(x.pay||0),0)/pool.length:0;
    sp=Math.round((sp+avg*slots)*10)/10;
  }
  const pay=teamSalary(t);
  const prestigeBonus=Math.round(pay*(c.prestige>=80?0.16:c.prestige>=65?0.11:c.prestige>=50?0.075:0.05)*10)/10;
  const support=Math.round(pay*0.06*10)/10;
  const membership=Math.round(pay*(c.fanbase>=70?0.05:c.fanbase>=50?0.04:0.02)*10)/10;
  const inc={carry:c.carry, sponsor:sp, prestige:prestigeBonus, support:support, membership:membership};
  inc.total=Math.round((inc.carry+inc.sponsor+inc.prestige+inc.support+inc.membership)*10)/10;
  const acad=ACAD_MAP[c.acadInvest]||ACAD_MAP.std;
  const exp={salary:Math.round(teamSalary(t)*10)/10, academy:acad.cost, scouter:1.7, staff:Math.round(staffPayroll(t.id)*10)/10};
  exp.total=Math.round((exp.salary+exp.academy+exp.scouter+exp.staff)*10)/10;
  let expected=Math.round((inc.total-exp.total)*10)/10;
  // 리그 배분금 — 적자 구단이 최소 손익분기 근처에서 시작하도록
  if(expected<2){
    const room=Math.round(pay*0.26*10)/10;
    const add=Math.min(room, Math.round((2-expected)*10)/10);
    if(add>0){ inc.league=add; inc.total=Math.round((inc.total+add)*10)/10; expected=Math.round((inc.total-exp.total)*10)/10; }
  }
  return {inc:inc, exp:exp, expected:expected};
}
function sponsorAnnualTotal(){
  const c=clubC(); let n=0;
  if(c.sponsors.main&&c.sponsors.main.pay) n+=c.sponsors.main.pay;
  (c.sponsors.sub||[]).forEach(s=>{ if(s&&s.pay) n+=s.pay; });
  return Math.round(n*10)/10;
}
function sponsorCapacity(){ return clubC()?3:3; }

function rollSponsorOffers(){
  const c=clubC();
  const cap=sponsorCapacity();
  const pres=c.prestige;
  const mul=(0.7+pres/200)*clubScale();
  const sc=(x)=>Math.round(x*mul*10)/10;
  const mains=SPONSOR_DEFS.filter(s=>s.tier==='main').map(s=>Object.assign({},s,{pay:sc(s.pay),bonus:sc(s.bonus)}));
  const subs=SPONSOR_DEFS.filter(s=>s.tier==='sub').map(s=>Object.assign({},s,{pay:sc(s.pay),bonus:sc(s.bonus)}));
  c.offers={main:mains, sub:subs, cap:cap, rolledAt:S.season+'-'+S.week};
}
function sponsorSign(tier,id,years,terms){
  const c=clubC();
  const pool=(c.offers&&(tier==='main'?c.offers.main:c.offers.sub))||[];
  const def=pool.find(s=>s.id===id);
  if(!def) return {ok:false,msg:'이미 사라진 제안입니다'};
  const cap=sponsorCapacity();
  if(tier==='main'){
    if(c.sponsors.main) return {ok:false,msg:'이미 메인 스폰서가 있습니다'};
  }else{
    if(c.sponsors.sub.length>=Math.max(0,cap-1)) return {ok:false,msg:'서브 스폰서 자리가 없습니다 (명성 '+(c.prestige|0)+' 기준 '+(cap-1)+'개)'};
  }
  // 협상 조건
  let pay=def.pay, bonus=def.bonus;
  if(terms==='base'){ pay=Math.round(def.pay*1.08*10)/10; bonus=Math.round(def.bonus*0.78*10)/10; }
  else if(terms==='bonus'){ pay=Math.round(def.pay*0.93*10)/10; bonus=Math.round(def.bonus*1.3*10)/10; }
  const con={id:def.id, name:def.name, cat:def.cat, color:def.color, logo:def.logo, tier:tier,
    pay:pay, bonus:bonus, goal:def.goal, years:years, left:years, terms:terms||'same', signed:S.season};
  if(tier==='main') c.sponsors.main=con; else c.sponsors.sub.push(con);
  c.offers.main=(c.offers.main||[]).filter(s=>s.id!==id);
  c.offers.sub=(c.offers.sub||[]).filter(s=>s.id!==id);
  newsAdd('sponsor', '🤝 스폰서 계약 — '+def.name+' ('+(tier==='main'?'메인':'서브')+') · '+(con.years)+'년 · 연 '+con.pay.toFixed(1)+'억');
  saveGame();
  return {ok:true,msg:def.name+'와 '+years+'년 계약을 체결했습니다'};
}

function communityTone(){
  const c=clubC();
  const last=S.lastSeries;
  let tone='calm';
  if(last&&last.win) tone='win';
  if(last&&!last.win) tone='lose';
  if(c.fanbase>=75&&last&&last.win) tone='big';
  if(c.fanbase<42) tone='drama';
  return tone;
}
function eventTopic(){
  const c=clubC();
  if((c.meetings||[]).length&&c.meetings[c.meetings.length-1].week===S.week) return 'fan';
  if((c.goods||[]).some(g=>g.week<=1&&g.season===S.season)) return 'merch';

function communityBuild(){
  const c=clubC();
  if(c.commVer!==2){ c.commVer=2; c.community=null; }
  const key='v2-'+S.season+'-'+S.week+'-'+S.phase+'-'+(c.goods.length)+'-'+((c.meetings||[]).length)+'-'+(c.fanbase|0)+'-'+(S.lastSeries?S.lastSeries.score:'')+'-'+S.split+'-'+((c.news||[]).length);
  if(c.community&&c.community.key===key) return c.community;
  const tone=communityTone();
  const pickDistinct=(pool,tag,n)=>{
    const idx=pool.map((_,i)=>i).sort((a,b)=>{
      const ha=hashN(key+'|'+tag+'|'+a), hb=hashN(key+'|'+tag+'|'+b);
      return ha-hb;
    });
    const out=idx.slice(0,Math.min(n,pool.length)).map(i=>pool[i]);
    while(out.length<n&&pool.length) out.push(pool[out.length%pool.length]);
    return out;
  };
  const mk=(t,tag,i)=>({t:t, c:(hashN(key+tag+i+'c')%900+40), id:tag+i});
  const gp=GAL_POOL[tone]||GAL_POOL.calm;
  const ap=(AM_POOL[tone]||AM_POOL.calm);
  const tp=(TW_POOL[tone]||TW_POOL.calm);
  const et=EVENT_POOL[eventTopic()]||EVENT_POOL.draft;
  const pickN=(pool,tag,off)=>{ const i=(hashN(key+'|'+tag)+off*5)%pool.length; return pool[i]; };
  const gall=[mk(pickN(gp,'g0',0),'g',0), mk(pickN(et,'g1',1),'g',1), mk(pickN(OFF_POOL,'g2',1),'g',2)];
  const am=[mk(pickN(ap,'a0',1),'a',0), mk(pickN(et,'a1',2),'a',1), mk(pickN(OFF_POOL,'a2',3),'a',2)];
  const tw=[mk(pickN(tp,'t0',2),'t',0), mk(pickN(et,'t1',4),'t',1), mk(pickN(OFF_POOL,'t2',6),'t',2)];
  const mood=c.fanbase>=72?'여론 뜨거움':c.fanbase>=52?'조용합니다':c.fanbase>=38?'여론 한산·중립':'여론이 나쁩니다';
  c.community={key:key, tone:tone, mood:mood, gall:gall, am:am, tw:tw};
  return c.community;
}

function goodsProject(tierK, modelName){
  const c=clubC(); const g=GOODS_MAP[tierK]||GOODS_MAP.x;
  const m=goodsModels().find(x=>x.name===modelName);
  const mult=m?m.mult:1;
  const base=clamp(0.35+c.fanbase/130,0.3,1.05);
  const scale={x:1,low:1,mid:1,high:0.95,max:0.6}[tierK]||1;

/* ---------- 케스파컵 ---------- */
function kespaInit(){
  const ids=lckIds().slice().sort((a,b)=>teamPowerRaw(T(b))-teamPowerRaw(T(a)));
  const seeds=ids.slice(0,8);
  const shuf=seeds.slice();
  // 1-8, 2-7, 3-6, 4-5
  const pairs=[[shuf[0],shuf[7]],[shuf[3],shuf[4]],[shuf[1],shuf[6]],[shuf[2],shuf[5]]];
  return {
    done:false, started:false, roundIdx:0, prize:0,
    rounds:[{name:'8강', bo:3, matches:pairs.map(x=>({a:x[0],b:x[1],sa:0,sb:0,done:false,winner:null}))}],
  };
}
function kespaRound(){ return S.kespa?S.kespa.rounds[S.kespa.roundIdx]:null; }
function kespaMyMatch(){
  const r=kespaRound(); if(!r) return null;
  return r.matches.find(m=>!m.done&&(m.a===S.userTeam||m.b===S.userTeam))||null;
}
function kespaAdvanceRound(){
  const k=S.kespa; const r=k.rounds[k.roundIdx];
  if(!r||r.matches.some(m=>!m.done)) return;
  const winners=r.matches.map(m=>m.winner);
  if(winners.length===1){ k.done=true; k.prize=winners[0]===S.userTeam?3.0:0.6; return; }
  const next={name:winners.length===4?'4강':winners.length===2?'결승':r.name, bo:3, matches:[]};
  for(let i=0;i<winners.length;i+=2) next.matches.push({a:winners[i],b:winners[i+1],sa:0,sb:0,done:false,winner:null});
  k.rounds.push(next); k.roundIdx++;
}
function kespaSimOthers(){
  const k=S.kespa; const r=kespaRound(); if(!r) return;
  r.matches.forEach(m=>{
    if(m.done) return;
    if(m.a===S.userTeam||m.b===S.userTeam) return;
    const pa=teamPowerRaw(T(m.a))+rnd(-3,3), pb=teamPowerRaw(T(m.b))+rnd(-3,3);
    let a=0,b=0;
    while(a<2&&b<2){ if(Math.random()<sig((pa-pb)/6)) a++; else b++; }
    m.sa=a; m.sb=b; m.done=true; m.winner=a>b?m.a:m.b;
  });
}
function kespaRecord(matchRef, meScore, oppScore){
  const k=S.kespa; const r=kespaRound(); if(!r) return;
  const m=r.matches.find(x=>x.a===matchRef.a&&x.b===matchRef.b)||r.matches.find(x=>!x.done&&(x.a===S.userTeam||x.b===S.userTeam));
  if(!m) return;
  if(m.a===S.userTeam){ m.sa=meScore; m.sb=oppScore; } else { m.sa=oppScore; m.sb=meScore; }
  m.done=true;
  m.winner=m.sa>m.sb?m.a:m.b;
  if(m.winner===S.userTeam && !S.club.facts.kespa4){ S.club.facts.kespa4=true; newsAdd('cup','🏆 케스파컵 4강 진출 달성'); }
  kespaSimOthers();
  kespaAdvanceRound();
  if(k.done){

function clubWeekAdvance(){
  const c=clubC();

    else{ c.prestige=clamp(c.prestige-0.3,0,100); c.fanbase=clamp(c.fanbase-0.8,0,100); }
  }

  if(S.playoffs&&S.playoffs.rounds){ c.facts.playoffs=true; }
  if(S.msi&&S.msi.rounds&&(S.msi.seeds||[]).indexOf(S.userTeam)>=0) c.facts.msi=true;

/* ---------- 시즌 결산 ---------- */
function clubSeasonSettle(){
  const c=clubC(); const t=myTeam();
  const led=finLedger();
  const net=led.expected;
  t.budget=Math.round((t.budget+Math.max(-8,Math.min(12,net*0.35)))*10)/10;
  // 목표 보너스
  const goals=c.goals||[];
  let bonus=0, trustDelta=0;
  goals.forEach(g=>{
    let ok=false;
    if(g.k==='lck') ok=!!c.facts.lckWin;
    else if(g.k==='final') ok=!!c.facts.final;
    else if(g.k==='kespa') ok=!!c.facts.kespa4;
    else if(g.k==='worlds') ok=!!c.facts.worlds;
    else if(g.k==='top3') ok=!!c.facts.top3;
    if(ok){ bonus+=g.bonus; }
    else if(g.must){ trustDelta+=g.trust; }
  });
  if(bonus>0) t.budget=Math.round((t.budget+bonus*0.15)*10)/10;
  // 스폰서 보너스
  const all=[c.sponsors.main].concat(c.sponsors.sub||[]).filter(Boolean);
  all.forEach(s=>{ if(sponsorGoalMet(s.goal)){ t.budget=Math.round((t.budget+s.bonus*0.1)*10)/10; } });
  c.trust=clamp((c.trust||55)+trustDelta+Math.round((t.wins-t.losses)*0.4),0,100);
  // 다음 시즌 준비
  c.carry=t.budget;
  const next=[];
  [c.sponsors.main].concat(c.sponsors.sub||[]).forEach(s=>{ if(!s) return; s.left=(s.left||1)-1; if(s.left>0) next.push(s); });
  c.sponsors={main:null, sub:[]};
  next.forEach(s=>{ if(s.tier==='main'&&!c.sponsors.main) c.sponsors.main=s; else c.sponsors.sub.push(s); });
  c.facts={};
  c.goals=ownerGoals();
  c.academy=academyGen();
  rollSponsorOffers();
  newsAdd('club','📅 시즌 결산 — 목표 보너스를 정산했습니다');
  saveGame();
}
