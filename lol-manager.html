/* ---------- playstyle / trait effects ---------- */
function traitChampAffinity(t,c,role){
  const e=t.e||{}; let a=0;
  if(e.lane) a += (c.cv[0]>=4?0.55:0.2);
  if(e.fight) a += (c.tags.fight>=2?0.55:0.15);
  if(e.obj) a += ((c.tags.engage||0)>=2?0.45:0.1);
  if(e.macro) a += ((c.tags.split||0)>=2?0.45:0.12);
  if(e.vision) a += ((role==='SUP'||role==='JGL')?0.45:0.1);
  if(e.pool) a += (c.r.length>1?0.55:0.2);
  if(e.mental) a += 0.15;
  if(e.risk) a -= 0.12;
  return a;
}
/* 특정 챔피언/라인에서 선수 성향이 얼마나 맞는지 (0 ~ +7) */
function styleSynergy(p,c,role){
  if(!p||!c) return 0;
  role=role||p.role;
  const hero=p.playKey?TRAIT_MAP[p.playKey]:null;
  let s=0;
  traitDefs(p,true).forEach(t=>{
    const w = (t===hero)?1.5:0.55;
    s += traitChampAffinity(t,c,role)*w;
  });
  if(!c.r.includes(role)){
    const flexOk=(p.playKey==='joker'||p.playKey==='multiRole'||p.playKey==='flexAce'||p.playKey==='champOcean');
    s += flexOk?2.4:-1.8;
    s += traitSum(p,'pool')*0.45;
  }
  return Math.max(-3, Math.min(7, s));
}
/* 팀 특성 총합 (경기 시뮬레이션용) */
function teamTraitEdge(team){
  const ps=lineupOf(team);
  let fight=0,macro=0,obj=0,vision=0,risk=0,lane=0;
  ps.forEach(p=>{ fight+=traitSum(p,'fight'); macro+=traitSum(p,'macro'); obj+=traitSum(p,'obj');
    vision+=traitSum(p,'vision'); risk+=traitSum(p,'risk'); lane+=traitSum(p,'lane'); });
  return {fight,macro,obj,vision,risk,lane};
}
function champFit(p,c,role){
  role=role||p.role;
  let f=0.96;
  if(!c.r.includes(role)) f-=0.07;
  if(p.role!==role) f-=0.02;
  if(p.sigs.includes(c.n)) f+=0.05;
  f+=(p.stats.pool-72)/900 + traitSum(p,'pool')*0.0015;
  return f;
}
function laneScore(p,c,role){
  if(!p||!c) return 55;
  role=role||p.role;
  let s=(75+(effRating(p)-75)*0.8)*champFit(p,c,role) + clamp((champTier(c)-3)*2,-3,3);
  s += traitSum(p,'lane')*0.7;
  s += (p.sigs.includes(c.n)?1.6:0);
  if(c.sigK==='lane'||c.sigK==='poke') s+=0.4;
  if(c.sigK==='scale'&&role!=='SUP') s+=0.2;
  return s;
}
/* 라인 상성 (내 챔프가 상대 챔프를 얼마나 이기는가) */
function counterScore(a,b){
  if(!a||!b) return 0;
  let s=0;
  s += ((a.tags.poke||0)-(b.tags.engage||0))*0.35;
  s += ((a.tags.engage||0)-(b.tags.poke||0))*0.3;
  s += ((a.cv[0]||3)-(b.cv[0]||3))*0.6;
  s += ((a.cc||0)-(b.cc||0))*0.25;
  s += ((a.f||0)-(b.f||0))*0.2;
  s += (a.d==='AD'&&b.d==='TANK')?0.4:0;
  s += (a.d==='TANK'&&b.d==='AD')?-0.3:0;
  // 챔피언 고유 특징 상성
  const A=a.sigK, B=b.sigK;
  if(A==='grab'&&(b.cc||0)<=1) s+=0.45;
  if(A==='poke'&&(b.tags.engage||0)<=1) s+=0.4;
  if(A==='dive'&&(b.cv[0]||3)<=2) s+=0.35;
  if(A==='duel'&&B==='scale') s+=0.3;
  if(A==='teamfight'&&B==='split') s+=0.3;
  if(A==='turret'&&B!=='duel') s+=0.25;
  if(A==='scale'&&(b.cv[0]||3)>=4) s-=0.35;
  if(A==='pickoff'&&(b.cc||0)>=3) s-=0.3;
  return clamp(s,-2.8,2.8);
}

/* ---------- comp evaluation ---------- */
function evalComp(picks){
  const cs=picks.map(x=>CHAMP_MAP[typeof x==='string'?x:(x&&x.champ)]).filter(Boolean);
  const tags={engage:0,poke:0,fight:0,split:0,scale:0};
  cs.forEach(c=>{for(const k in tags) tags[k]+=c.tags[k];});
  const ad=cs.filter(c=>c.d==='AD').length;
  const ap=cs.filter(c=>c.d==='AP').length;
  const tank=cs.filter(c=>c.d==='TANK').length;
  const front=cs.reduce((a,c)=>a+c.f,0);
  const cc=cs.reduce((a,c)=>a+c.cc,0);
  const curve=[0,0,0];
  cs.forEach(c=>c.cv.forEach((v,i)=>{curve[i]+=v;}));
  const n=Math.max(cs.length,1);
  const curveAvg=curve.map(v=>v/n);
  const tierAvg=cs.reduce((a,c)=>a+champTier(c),0)/n;
  let score=40+(tierAvg-3)*5+tags.fight*0.9+tags.engage*0.75+tags.scale*0.7+tags.poke*0.4+tags.split*0.35;
  const warnings=[],strengths=[];
  if(ad>=4&&ap===0){score-=7;warnings.push('풀 AD 조합 — 상대 방어막 스택에 취약');}
  else if(ap>=4&&ad===0){score-=7;warnings.push('풀 AP 조합 — 상대 마저 스택에 취약');}
  else if(ad>=1&&ap>=1) strengths.push('AD/AP 밸런스 양호');
  if(tank===0&&front<6){score-=5;warnings.push('탱커·프론트라인 부재 — 한타 진형 붕괴 위험');}
  else if(front>=8) strengths.push('든든한 프론트라인');
  if(tags.engage<5){score-=4;warnings.push('이니시 수단 부족');}
  else if(tags.engage>=9) strengths.push('강력한 이니시');
  if(cc<6){score-=3;warnings.push('CC 부족 — 픽오프에 취약');}
  if(curveAvg[2]>=3.7) strengths.push('후반 밸류 최상');
  if(curveAvg[0]>=3.5) strengths.push('초반 스노우볼');
  if(curveAvg[0]<2.4&&curveAvg[2]<3.2) warnings.push('파워 스파이크가 애매함');
  return {ad,ap,tank,front,cc,tags,curve:curveAvg,tierAvg,score:clamp(score,20,96),warnings,strengths,n};
}

/* ---------- game init ---------- */
function createState(teamId, opts){
  opts=opts||{};
  const st={
    version:2, season:1, week:1, phase:'regular', split:'spring', playoffSplit:null,
    springChampion:null, summerChampion:null, msi:null, ewc:null, msiChampion:null, ewcChampion:null,
    userTeam:teamId, teams:{}, players:{},
    schedule:[], results:[], weekAction:'scrim', weekActionTarget:null, actionApplied:false,
    gameplan:null, patchIdx:0, meta:{tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}}, patches:[],
    pog:{}, playoffs:null, worlds:null, champion:null, lckChampion:null, seriesWins:0, lastResult:null,
    fearless:true, history:[], trainingLog:[], worldsHistory:[], created:Date.now(),
  };
  TEAM_DEFS.forEach(def=>{
    const t={id:def.id,name:def.name,tag:def.tag,color:def.color,region:def.region||'LCK',budget:def.budget,tier:def.tier,
      tagline:def.tagline,roster:[],lineup:{},wins:0,losses:0,gw:0,gl:0,form:[],pogTotal:0};
    def.roster.forEach((r,idx)=>{
      const p=mkPlayer(r[0],r[1],r[2],r[3],r[4],r[5],def.id);
      p.starter=idx<5;
      st.players[p.name]=p;
      t.roster.push(p.name);
      if(idx<5) t.lineup[r[1]]=p.name;
    });
    st.teams[def.id]=t;
  });
  // free agents
  FA_DEFS.forEach(r=>{
    const p=mkPlayer(r[0],r[1],r[2],r[3],r[4],r[5],null);
    p.starter=false; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10;
    st.players[p.name]=p;
  });
  st.phase='kespa';
  const sb=buildStaff();
  st.staffLib=sb.lib; st.staff=sb.byTeam;
  st.owner={name:'박성수', role:'구단주'};
  st.offseason=null;
  st.schedule=genSchedule(lckIds());
  st.pog=Object.fromEntries(Object.keys(st.players).map(n=>[n,0]));
  S=st;
  try{ st.kespa=kespaInit(); st.splashPending='kespa'; }catch(e){}
  applyPatch(0,true);
  return st;
}
function lckIds(){ return TEAM_DEFS.filter(d=>(d.region||'LCK')==='LCK').map(d=>d.id); }

/* ---------- patches ---------- */
function applyPatch(idx, silent){
  const p=PATCHES[idx]; if(!p) return null;
  S.patchIdx=idx;
  p.buffs.forEach(n=>{S.meta.tier[n]=(S.meta.tier[n]||0)+1;});
  p.nerfs.forEach(n=>{S.meta.tier[n]=(S.meta.tier[n]||0)-1;});
  S.meta.obj=p.obj;
  S.patches.push({v:p.v,name:p.name,week:S.week});
  if(!silent) toast('🛠 패치 '+p.v+' 적용 — '+p.name);
  return p;
}

/* ---------- training: 좋은 특성 습득 / 나쁜 특성 극복 ---------- */
function traitLog(text,kind){
  if(!S) return;
  S.trainingLog=S.trainingLog||[];
  S.trainingLog.unshift({week:S.week,season:S.season,text,kind:kind||'t',at:Date.now()});
  if(S.trainingLog.length>40) S.trainingLog.pop();
}
function learnGoodTrait(p,chance){
  if(!p) return false;
  p.good=p.good||[];
  if(p.good.length>=12) return false;
  if(Math.random()>(chance===undefined?0.34:chance)) return false;
  const cand=seededShuffle(traitPoolFor(p.role,true).fit,nameHash(p.name+S.week+Date.now()%97), true)
    .filter(t=>!p.good.includes(t.id));
  const t=cand[0]; if(!t) return false;
  p.good.push(t.id);
  const msg='✨ 훈련 성과 — '+p.name+'이(가) 새 특성 ['+t.n+']을(를) 습득!';
  traitLog(msg,'good'); toast(msg,3200);
  return true;
}
function cureBadTrait(p,points){
  if(!p||!p.bad||!p.bad.length) return false;
  p.cure=p.cure||{};
  const ids=p.bad.slice();
  const target=ids.sort((a,b)=>(p.cure[b]||0)-(p.cure[a]||0))[0];
  p.cure[target]=(p.cure[target]||0)+points;
  if(p.cure[target]>=100){
    const t=TRAIT_MAP[target];
    p.bad=p.bad.filter(x=>x!==target); delete p.cure[target];
    const msg='🎉 훈련으로 나쁜 특성 ['+(t?t.n:target)+'] 극복! — '+p.name;
    traitLog(msg,'cure'); toast(msg,3600);
    return true;
  }
  return false;
}
function gainBadTrait(p,chance){
  if(!p) return false;
  p.bad=p.bad||[];
  if(p.bad.length>=6) return false;
  if(Math.random()>(chance===undefined?0.10:chance)) return false;
  const cand=seededShuffle(traitPoolFor(p.role,false).fit,nameHash(p.name+'bad'+S.week+Date.now()%89))
    .filter(t=>!p.bad.includes(t.id));
  const t=cand[0]; if(!t) return false;
  p.bad.push(t.id);
  const msg='⚠ '+p.name+'에게 나쁜 특성 ['+t.n+']이(가) 생겼습니다 — 훈련으로 극복하세요';
  traitLog(msg,'bad'); toast(msg,3200);
  return true;
}

/* ---------- weekly action ---------- */
function applyWeekAction(){
  if(S.actionApplied) return;
  const t=myTeam(); const act=S.weekAction;
  const starters=lineupOf(t);
  const all=t.roster.map(n=>S.players[n]).filter(Boolean);
  const focus=S.players[S.weekActionTarget]||starters.slice().sort((a,b)=>(b.bad||[]).length-(a.bad||[]).length)[0]||starters[0];
  const sm=staffTrainingMods(t.id);
  if(act==='scrim'){
    const k=1+(sm.scrim||0);
    starters.forEach(p=>{p.form=clamp(p.form+Math.round(ri(1,5)*k),15,100);p.fatigue=clamp(p.fatigue+ri(7,13),0,100);p.stats.macro=clamp(p.stats.macro+(Math.random()<.25?1:0),40,99);});
    // 스크림: 좋은 특성 습득 기회 (낮은 확률, 전원)
    starters.forEach(p=>{ if(Math.random()<0.28*(1+(sm.bloom||0))) learnGoodTrait(p,1); });
    toast('⚔️ 스크림 3일 — 팀 합과 실전 감각이 올라갔습니다');
  }else if(act==='solo'){
    const tg=focus;
    if(tg){
      const key=(sm.lane>0&&Math.random()<0.5)?'lane':pickOf(['lane','fight','pool']);
      tg.stats[key]=clamp(tg.stats[key]+ri(2,3)+((sm.lane||0)>0&&key==='lane'?1:0),40,99);
      tg.form=clamp(tg.form+ri(2,5),15,100); tg.fatigue=clamp(tg.fatigue+ri(4,8),0,100);
      learnGoodTrait(tg,0.45*(1+(sm.bloom||0)));
      cureBadTrait(tg,Math.round(ri(8,16)*(1+(sm.cure||0))));
    }
    starters.filter(p=>p!==tg).forEach(p=>{p.fatigue=clamp(p.fatigue+ri(3,7),0,100);p.form=clamp(p.form-ri(0,2),15,100);});
    toast('🎯 '+(tg?tg.name:'선수')+' 집중 훈련 완료 — 기량이 상승했습니다');
  }else if(act==='macro'){
    starters.forEach(p=>{p.stats.macro=clamp(p.stats.macro+ri(1,3)+((sm.macroC||0)>0?1:0),40,99);p.fatigue=clamp(p.fatigue+ri(5,9),0,100);p.form=clamp(p.form-ri(1,3),15,100);});
    starters.forEach(p=>{ if(Math.random()<0.2*(1+(sm.bloom||0))) learnGoodTrait(p,1); });
    if(focus) cureBadTrait(focus,Math.round(ri(5,10)*(1+(sm.cure||0))));
    toast('🧠 전술·운영 훈련 — 후반 운영 능력이 좋아졌습니다');
  }else if(act==='feedback'){
    all.forEach(p=>{p.form=clamp(p.form+ri(2,6),15,100);p.fatigue=clamp(p.fatigue-ri(4,9),0,100);});
    if(focus){ cureBadTrait(focus,Math.round(ri(24,40)*(1+(sm.cure||0)))); learnGoodTrait(focus,0.3*(1+(sm.bloom||0))); }
    const badOnes=all.filter(p=>(p.bad||[]).length>0);
    badOnes.forEach(p=>{ if(Math.random()<0.35) cureBadTrait(p,ri(4,9)); });
    toast('🧘 멘탈·피드백 — 나쁜 특성 극복 작업을 진행했습니다');
  }else if(act==='rest'){
    all.forEach(p=>{p.fatigue=clamp(p.fatigue-Math.round(ri(14,24)*(1+(sm.condition||0))),0,100);p.form=clamp(p.form+ri(3,8),15,100);});
    toast('😴 전면 휴식 — 컨디션이 크게 회복됐습니다');
  }
  // slump / fatigue / 습관성 악습
  all.forEach(p=>{
    if(p.fatigue>82 && Math.random()<.45){ p.form=clamp(p.form-ri(3,8),10,100); }
    if(p.form<35 && Math.random()<.3){ p.form=clamp(p.form+3,10,100); }
    if(p.fatigue>78 && Math.random()<0.16*(1-(sm.mentalC||0))) gainBadTrait(p,1);
    else if(p.form<45 && Math.random()<0.08*(1-(sm.mentalC||0))) gainBadTrait(p,1);
    p.fatigue=clamp(p.fatigue-2,0,100);
  });
  S.actionApplied=true;
  saveGame(); renderAll();
}

/* ---------- transfer market ---------- */
function freeAgents(){ return Object.values(S.players).filter(p=>p.fa && !p.team); }
function signFA(name, years){
  const p=S.players[name]; if(!p||!p.fa||p.team) return {ok:false,msg:'이미 영입된 선수입니다'};
  const t=myTeam();
  const sm=staffTrainingMods(t.id);
  let fee=p.fee||Math.round(p.salary*1.7*10)/10;
  fee=Math.round(fee*(1-(sm.scout||0))*10)/10;
  if(t.budget<fee) return {ok:false,msg:'예산 부족 (필요 '+fee.toFixed(1)+'억)'};
  if(t.roster.length>=9) return {ok:false,msg:'로스터 정원 초과 (최대 9명)'};
  t.budget=Math.round((t.budget-fee)*10)/10;
  p.team=t.id; p.fa=false; p.contract=Math.max(1,Math.min(3,Number(years)||2));
  t.roster.push(p.name);
  toast('✍️ '+p.name+' 영입 완료 — 이적료 '+fee.toFixed(1)+'억 · '+p.contract+'년 계약');
  saveGame(); renderAll(); return {ok:true};
}
function releasePlayer(name){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  if(t.roster.length<=6) return {ok:false,msg:'최소 6명은 유지해야 합니다'};
  const refund=Math.round(p.salary*0.3*10)/10;
  t.roster=t.roster.filter(n=>n!==name);
  Object.keys(t.lineup).forEach(r=>{if(t.lineup[r]===name) delete t.lineup[r];});
  p.team=null; p.fa=false; p.retired=true;
  t.budget=Math.round((t.budget+refund)*10)/10;
  ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  toast('🚪 '+name+' 방출 — '+refund.toFixed(1)+'억 회수');
  saveGame(); renderAll(); return {ok:true};
}
function setSeriesSub(role,name){
  const t=myTeam(); const p=S.players[name]; if(!p||p.team!==t.id) return {ok:false,msg:'우리 팀 선수가 아닙니다'};
  const cur=t.lineup[role];
  if(cur===name) return {ok:false,msg:'이미 해당 라인 선발입니다'};
  const oldRole=Object.keys(t.lineup).find(r=>t.lineup[r]===name);
  if(oldRole) t.lineup[oldRole]=cur;
  t.lineup[role]=name;
  saveGame();
  toast('🔄 '+ROLE_KR[role]+' 교체 — '+name+' 투입');
  return {ok:true};
}
function setStarter(role, name){
  const t=myTeam(); const p=S.players[name]; if(!p) return;
  const prev=t.lineup[role];
  const oldRole=Object.keys(t.lineup).find(r=>t.lineup[r]===name);
  if(oldRole) t.lineup[oldRole]=prev;
  t.lineup[role]=name;
  saveGame(); renderAll();
}

/* ---------- player editor ---------- */
function renamePlayer(oldName,newName){
  newName=String(newName||'').trim();
  if(!newName||newName===oldName) return {ok:true};
  if(S.players[newName]) return {ok:false,msg:'이미 같은 이름의 선수가 있습니다'};
  const p=S.players[oldName]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const team=p.team?S.teams[p.team]:null;
  delete S.players[oldName];
  p.name=newName;
  S.players[newName]=p;
  if(team){
    team.roster=team.roster.map(n=>n===oldName?newName:n);
    Object.keys(team.lineup).forEach(r=>{ if(team.lineup[r]===oldName) team.lineup[r]=newName; });
  }
  if(S.pog && S.pog[oldName]!==undefined){ S.pog[newName]=S.pog[oldName]; delete S.pog[oldName]; }
  (S.currentSeries&&S.currentSeries.games||[]).forEach(g=>{ if(g.mvp===oldName) g.mvp=newName; });
  return {ok:true};
}
function applyPlayerEdit(oldName, d){
  const p=S.players[oldName]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  if(d.name && d.name!==oldName){
    const r=renamePlayer(oldName,d.name); if(!r.ok) return r;
  }
  p.age=clamp(Number(d.age)||p.age,15,40);
  if(d.role && ROLES.includes(d.role)) p.role=d.role;
  ['lane','fight','macro','pool','mental'].forEach(k=>{ if(d[k]!==undefined) p.stats[k]=clamp(Number(d[k])||p.stats[k],40,99); });
  if(d.contract!==undefined) p.contract=clamp(Number(d.contract)||1,0,3);
  if(Array.isArray(d.persons)){ const arr=d.persons.filter(k=>PERS_MAP[k]).slice(0,3); if(arr.length){ p.persons=arr; p.pers=arr[0]; } }
  else if(d.pers&&PERS_MAP[d.pers]){ p.persons=[d.pers]; p.pers=d.pers; }
  if(d.exp!==undefined) p.exp=clamp(Number(d.exp)||0,0,99);
  if(d.photo!==undefined) p.photo=String(d.photo||'').slice(0,500);
  if(d.grade && GRADE_COUNT[d.grade] && d.grade!==p.grade){ p.grade=d.grade; rollTraits(p,d.grade); }
  if(Array.isArray(d.sigs)) p.sigs=d.sigs.filter(n=>!!CHAMP_MAP[n]).slice(0,6);
  if(Array.isArray(d.good)) p.good=d.good.filter(id=>TRAIT_MAP[id]&&TRAIT_MAP[id].g>0).slice(0,12);
  if(Array.isArray(d.bad)) p.bad=d.bad.filter(id=>TRAIT_MAP[id]&&TRAIT_MAP[id].g<0).slice(0,6);
  p.cure=p.cure||{};
  Object.keys(p.cure).forEach(id=>{ if(!(p.bad||[]).includes(id)) delete p.cure[id]; });
  if(d.playKey&&TRAIT_MAP[d.playKey]&&(p.good||[]).includes(d.playKey)){ p.playKey=d.playKey; p.playName=TRAIT_MAP[d.playKey].n; }
  const t=p.team?S.teams[p.team]:null;
  if(t && t.lineup[p.role]===undefined && Object.values(t.lineup).includes(p.name)){ /* keep */ }
  saveGame();
  return {ok:true};
}

  artillery:['제라스','직스','벨코즈','럭스','조이','벡스'],

function compArchetype(names){
  const cs=names.map(n=>CHAMP_MAP[n]).filter(Boolean);
  const s={dive:0,poke:0,anti:0,split:0,pickoff:0,protect:0,scale:0,skirmish:0};
  cs.forEach(c=>{
    s.dive += (c.tags.engage||0)*1.2 + (c.cc||0)*0.45 + (c.sigK==='dive'?1.6:0);
    s.poke += (c.tags.poke||0)*1.3 + (c.sigK==='poke'?1.6:0) + (c.sigK==='turret'?0.7:0);
    s.anti += (c.cc>=2?0.5:0);
    s.split += (c.tags.split||0)*1.2 + (c.sigK==='duel'?1.6:0);
    s.pickoff += (c.sigK==='pickoff'?1.6:0)+(c.sigK==='grab'?0.6:0);
    s.protect += (c.sigK==='sustain'?1.3:0);
    s.scale += (c.tags.scale||0)*0.8 + (c.sigK==='scale'?1.6:0);
    s.skirmish += (c.tags.fight||0)*0.85;
  });
  names.forEach(n=>{
    if(CHAMP_SETS.antiDash.includes(n)) s.anti+=1.7;
    if(CHAMP_SETS.peelSup.includes(n)) s.protect+=1.5;
    if(CHAMP_SETS.global.includes(n)) s.pickoff+=1.3;
    if(CHAMP_SETS.hypercarry.includes(n)) s.scale+=0.8;
    if(CHAMP_SETS.artillery.includes(n)) s.poke+=0.8;
  });
  const arch=Object.keys(s).sort((a,b)=>s[b]-s[a])[0];
  return {s,arch};
}
function archMatchup(a,b){
  const A=a.arch,B=b.arch; let v=0; const notes=[];
  if(A==='dive'&&B==='poke'){v+=1;notes.push(['good','상대 포킹·대치 조합에 돌진 하드이니시로 정면 돌파']);}
  if(A==='poke'&&(B==='anti'||B==='protect')){v+=1;notes.push(['good','상대 받아치기·보호 조합을 포킹으로 압박']);}
  if(A==='anti'&&B==='dive'){v+=1;notes.push(['good','상대 돌진 조합에 받아치기·디스인게이지로 완벽 카운터']);}
  if(A==='protect'&&B==='dive'){v+=0.6;notes.push(['good','상대 돌진을 보호 조합으로 받아냅니다']);}
  if(A==='split'&&B==='scale'){v+=0.8;notes.push(['good','상대 후반 조합에 스플릿으로 템포 압박']);}
  if(A==='pickoff'&&B==='split'){v+=0.8;notes.push(['good','상대 스플릿에 글로벌·픽오프로 견제']);}
  if(A==='dive'&&B==='anti'){v-=1;notes.push(['bad','상대 받아치기 조합에 돌진이 막힙니다']);}
  if(A==='poke'&&B==='dive'){v-=1;notes.push(['bad','상대 돌진에 포킹 조합이 찢깁니다']);}
  if(A==='scale'&&B==='split'){v-=0.6;notes.push(['bad','상대 스플릿에 후반 밸류를 못 봅니다']);}
  return {v,notes};
}
function kitCounters(myNames,oppNames){
  let v=0; const notes=[];
  const cnt=(arr,names)=>arr.filter(n=>names.includes(n));
  const anti=cnt(CHAMP_SETS.antiDash,myNames), mob=cnt(CHAMP_SETS.mobility,oppNames);
  if(anti.length&&mob.length){ const x=Math.min(2.4,anti.length*mob.length*0.55); v+=x; notes.push(['good',anti.slice(0,2).join('·')+'의 이동기 차단으로 상대 '+mob.slice(0,2).join('·')+' 돌진 봉쇄']); }
  const antiOpp=cnt(CHAMP_SETS.antiDash,oppNames), mobMine=cnt(CHAMP_SETS.mobility,myNames);
  if(antiOpp.length&&mobMine.length){ const x=Math.min(2.4,antiOpp.length*mobMine.length*0.55); v-=x; notes.push(['bad','상대 '+antiOpp.slice(0,2).join('·')+'에게 우리 돌진이 묶입니다']); }
  const bully=cnt(CHAMP_SETS.rangedBully,myNames), jug=cnt(CHAMP_SETS.immobileMelee,oppNames);
  if(bully.length&&jug.length){ const x=Math.min(2.0,bully.length*jug.length*0.45); v+=x; notes.push(['good',bully.slice(0,2).join('·')+' 원거리 견제로 상대 뚜벅이 근접을 압박']); }
  const bullyO=cnt(CHAMP_SETS.rangedBully,oppNames), jugM=cnt(CHAMP_SETS.immobileMelee,myNames);
  if(bullyO.length&&jugM.length){ const x=Math.min(2.0,bullyO.length*jugM.length*0.45); v-=x; notes.push(['bad','상대 원거리 견제에 우리 근접 탑이 고통받습니다']); }
  const peelMy=cnt(CHAMP_SETS.peelSup,myNames), hookOpp=cnt(CHAMP_SETS.hookSup,oppNames);
  if(peelMy.length&&hookOpp.length){ v+=0.8; notes.push(['good',peelMy[0]+' 보호로 상대 '+hookOpp[0]+' 그랩을 무력화']); }
  const peelOpp=cnt(CHAMP_SETS.peelSup,oppNames), hookMy=cnt(CHAMP_SETS.hookSup,myNames);
  if(peelOpp.length&&hookMy.length){ v-=0.8; notes.push(['bad','상대 '+peelOpp[0]+' 보호에 우리 '+hookMy[0]+' 이니시가 지워집니다']); }
  const assassin=cnt(['제드','탈론','카직스','렝가','이블린','나피리','피즈','아칼리','에코'],myNames);
  const carry=cnt(CHAMP_SETS.hypercarry,oppNames);
  if(assassin.length&&carry.length&&!peelOpp.length){ v+=1.2; notes.push(['good','상대 무보호 하이퍼캐리 '+carry[0]+'에게 암살 위협']); }
  const globalMy=cnt(CHAMP_SETS.global,myNames), splitMy=cnt(['피오라','카밀','잭스','트린다미어','요릭','나서스','사이온','이렐리아','케일'],myNames);
  if(globalMy.length&&splitMy.length){ v+=0.9; notes.push(['good',globalMy[0]+' 글로벌 합류로 '+splitMy[0]+' 스플릿 증폭']); }
  return {v,notes};
}

/* ---------- DRAFT (official order + post-draft lane assignment) ---------- */
/* 공식 대회 밴픽 순서: 블루밴1·레드밴1·블루밴2·레드밴2·블루밴3·레드밴3 →
   블루픽1·레드픽1·레드픽2·블루픽2·블루픽3·레드픽3 →
   레드밴4·블루밴4·레드밴5·블루밴5 → 레드픽4·블루픽4·블루픽5·레드픽5 */
const DRAFT_ORDER = [
  {t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},
  {t:'pick',s:'blue'},{t:'pick',s:'red'},{t:'pick',s:'red'},{t:'pick',s:'blue'},{t:'pick',s:'blue'},{t:'pick',s:'red'},
  {t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},
  {t:'pick',s:'red'},{t:'pick',s:'blue'},{t:'pick',s:'blue'},{t:'pick',s:'red'},
];

function startDraft(series){
  if(!series) return;
  if(!(series.meta&&series.meta.pressDone===true)&&typeof pressNeededFor==='function'&&pressNeededFor(series)){
    S.currentSeries=series; saveGame(); openPress(series); return;
  }
  const oppId=series.oppId, meId=S.userTeam;
  const gameIdx=series.games.length;
  const mySide=series.sides[gameIdx]||'blue';
  D={
    series, gameIdx, mySide, oppId, step:0,
    bans:{blue:[],red:[]}, picks:{blue:[],red:[]},
    phase:'ban', done:false, roleFilter:'ALL',
    locked: series.fearless? series.fearlessUsed.slice():[],
    assign:{me:null,opp:null}, sel:null, result:null,
  };
  if(series.games.length>0){ const b=seriesStaffBonus(S.userTeam); if(b) series.nextEdge=(series.nextEdge||0)+b; }
  D.phase=dPhaseNow();
  renderDraft();
  if(dActor()==='opp') setTimeout(()=>{ if(D&&!D.done) aiDraftAct(); }, 460);
}
function otherSide(s){ return s==='blue'?'red':'blue'; }
function mySideKey(){ return D.mySide; }
function oppSideKey(){ return otherSide(D.mySide); }
function dMyPicks(){ return D.picks[D.mySide]||[]; }
function dOppPicks(){ return D.picks[otherSide(D.mySide)]||[]; }
function dMyBans(){ return D.bans[D.mySide]||[]; }
function dOppBans(){ return D.bans[otherSide(D.mySide)]||[]; }
function dCur(){ return DRAFT_ORDER[D.step]||null; }
function dActor(){ const c=dCur(); if(!c) return null; return c.s===D.mySide?'me':'opp'; }
function dPhaseNow(){ const c=dCur(); return c?c.t:'done'; }
function dUsed(){ return dMyBans().concat(dOppBans(),dMyPicks(),dOppPicks(),D.locked); }
function dAvailable(){ const used=new Set(dUsed()); return CHAMPS.filter(c=>!used.has(c.n)); }
function dBanCount(){ return dMyBans().length; }
function dPickCount(){ return dMyPicks().length; }

/* ---- AI ---- */
function PICK_EVAL_CACHE(picks){
  const cs=picks.map(x=>CHAMP_MAP[typeof x==='string'?x:x.champ]).filter(Boolean);
  return {
    ad:cs.filter(c=>c.d==='AD').length, ap:cs.filter(c=>c.d==='AP').length,
    front:cs.reduce((a,c)=>a+c.f,0), cc:cs.reduce((a,c)=>a+c.cc,0),
    tags:{engage:cs.reduce((a,c)=>a+c.tags.engage,0),fight:cs.reduce((a,c)=>a+c.tags.fight,0)},
  };
}
function aiPickChamp(){
  const avail=dAvailable(); if(!avail.length) return null;
  const opp=T(D.oppId); const players=lineupOf(opp);
  const comp=PICK_EVAL_CACHE(dOppPicks());
  let best=null,bestScore=-1e9;
  avail.forEach(c=>{
    let s=champTier(c)*3.4;
    let bestFit=-9;
    players.forEach(p=>{
      const sc=(laneScore(p,c,p.role)-72)*0.22 + styleSynergy(p,c,p.role)*0.5 + (p.sigs.includes(c.n)?4.2:0);
      if(sc>bestFit) bestFit=sc;
    });
    s+=bestFit;
    const t=c.tags;
    if(comp.ap===0&&c.d==='AP') s+=4.2;
    if(comp.ad===0&&c.d==='AD') s+=4.2;
    if(comp.front<3&&c.f>=2) s+=3.2;
    if(comp.tags.engage<4&&t.engage>=2) s+=3.4;
    if(comp.cc<4&&c.cc>=2) s+=2.4;
    if(c.r.length>1) s+=1.2;
    s+=rnd(-3,3);
    if(s>bestScore){bestScore=s;best=c;}
  });
  return best||avail[0];
}
function aiBanChamp(){
  const avail=dAvailable(); if(!avail.length) return null;
  const me=myTeam();
  let best=null,bs=-1e9;
  avail.forEach(c=>{
    let s=champTier(c)*4.6;
    let sig=0;
    Object.values(me.lineup).forEach(n=>{const p=S.players[n]; if(p&&p.sigs.includes(c.n)) sig+=7;});
    s+=sig;
    if(c.r.some(r=>ROLE_W[r]>=1.05)) s+=2;
    s+=rnd(-4,4);
    if(s>bs){bs=s;best=c;}
  });
  return best||avail[0];
}
function aiDraftAct(){
  if(!D||D.done) return;
  if(dActor()!=='opp') return;
  const cur=dCur(); if(!cur) return;
  if(cur.t==='ban'){
    const c=aiBanChamp(); if(!c) return;
    D.bans[otherSide(D.mySide)].push(c.n);
  }else{
    const c=aiPickChamp(); if(!c) return;
    D.picks[otherSide(D.mySide)].push(c.n);
  }
  advanceDraft();
}

/* ---- user actions ---- */
function draftMyBan(name){
  if(!D||D.done) return;
  const cur=dCur(); if(!cur||cur.t!=='ban'||dActor()!=='me') return;
  const c=CHAMP_MAP[name]; if(!c||dUsed().includes(name)) return;
  D.bans[D.mySide].push(name);
  advanceDraft();
}
function draftMyPick(name){
  if(!D||D.done) return;
  const cur=dCur(); if(!cur||cur.t!=='pick'||dActor()!=='me') return;
  const c=CHAMP_MAP[name]; if(!c||dUsed().includes(name)) return;
  D.picks[D.mySide].push(name);
  advanceDraft();
}
function advanceDraft(){
  D.step++;
  if(D.step>=DRAFT_ORDER.length){ enterAssign(); return; }
  D.phase=dPhaseNow();
  renderDraft();
  if(dActor()==='opp') setTimeout(()=>{ if(D&&!D.done) aiDraftAct(); }, 420);
}

/* ---- 포스트 드래프트 라인 배정 ---- */
function assignOptions(){ return ROLES.slice(); }
function assignScoreFor(p, champName, role){
  const c=CHAMP_MAP[champName]; if(!p||!c) return -999;
  let s=laneScore(p,c,role);
  s += styleSynergy(p,c,role)*1.1;
  if(p.role===role) s+=6;
  if(p.role!==role) s-=14;
  if(c.r[0]===role) s+=5;
  else if(c.r.includes(role)) s+=2.5;
  else s-=28;                       // 자연 포지션이 아닌 챔피언은 크게 감점
  if(p.sigs.includes(champName)) s+=3;
  // 플렉스/조커 성향만 오프롤 소화 가능
  const flex=(p.playKey==='joker'||p.playKey==='multiRole'||p.playKey==='flexAce'||p.playKey==='champOcean');
  if(!c.r.includes(role)&&flex) s+=16;
  return s;
}
function bestAssign(champNames, team){
  const players=ROLES.map(r=>S.players[team.lineup[r]]);
  const names=champNames.slice();
  let best=null, bestScore=-1e9;
  const perm=(arr,used,acc)=>{
    if(acc.length===5){
      let sc=0;
      ROLES.forEach((r,i)=>{ sc+=assignScoreFor(players[i],acc[i],r); });
      if(sc>bestScore){bestScore=sc;best=acc.slice();}
      return;
    }
    for(let i=0;i<arr.length;i++){
      if(used[i]) continue;
      used[i]=true; acc.push(arr[i]); perm(arr,used,acc); acc.pop(); used[i]=false;
    }
  };
  perm(names,new Array(names.length).fill(false),[]);
  const out={}; ROLES.forEach((r,i)=>{ out[r]=best?best[i]:(names[i]||null); });
  return out;
}
function aiAssign(champNames, teamId){ return bestAssign(champNames, T(teamId)); }
function recommendAssign(champNames){ return bestAssign(champNames, myTeam()); }

function enterAssign(){
  D.phase='assign';
  D.assign={ opp: aiAssign(dOppPicks(), D.oppId), me: recommendAssign(dMyPicks()) };
  D.result=evalDraft();
  renderDraft();
  saveGame();
}
function swapAssign(role, champName){
  if(!D||D.phase!=='assign') return;
  const a=D.assign.me;
  const prevRole=ROLES.find(r=>a[r]===champName);
  const prevChamp=a[role];
  if(prevRole) a[prevRole]=prevChamp;
  a[role]=champName;
  D.result=evalDraft();
  renderDraft();
}
function setAssign(role, champName){
  if(!D) return;
  if(D.assign&&D.assign.me) swapAssign(role,champName);
}
function confirmAssign(){
  if(!D) return;
  D.phase='done'; D.done=true; D.result=evalDraft(); D.sel=null;
  saveGame(); renderDraft();
}

/* ---- draft evaluation: 밴픽 우세도 ---- */
function assignedFor(sideKey){
  if(D&&D.assign&&D.assign[sideKey]) return D.assign[sideKey];
  if(sideKey==='me') return recommendAssign(dMyPicks());
  return aiAssign(dOppPicks(), D.oppId);
}
function evalDraft(){
  if(!D) return null;
  const me=T(S.userTeam), opp=T(D.oppId);
  const myA=assignedFor('me'), opA=assignedFor('opp');
  const lane={};
  let myStyle=0, opStyle=0;
  ROLES.forEach(r=>{
    const mp=S.players[me.lineup[r]], op=S.players[opp.lineup[r]];
    const mc=myA[r]?CHAMP_MAP[myA[r]]:null, oc=opA[r]?CHAMP_MAP[opA[r]]:null;
    const myBase=mp&&mc?laneScore(mp,mc,r):60;
    const opBase=op&&oc?laneScore(op,oc,r):60;
    const mySyn=mc?styleSynergy(mp,mc,r):0;
    const opSyn=oc?styleSynergy(op,oc,r):0;
    const ct=(mc&&oc)?counterScore(mc,oc):0;
    myStyle+=mySyn; opStyle+=opSyn;
    lane[r]={my:myBase+mySyn*0.9+ct*0.8, opp:opBase+opSyn*0.9-ct*0.8, counter:ct,
      myChamp:mc?mc.n:'', oppChamp:oc?oc.n:'', myPlayer:mp?mp.name:'', oppPlayer:op?op.name:'',
      myRole:mp?mp.role:'', oppRole:op?op.role:'', mySyn, opSyn};
  });
  const myComp=evalComp(dMyPicks()), oppComp=evalComp(dOppPicks());
  let laneAdv=0; ROLES.forEach(r=>{laneAdv+=(lane[r].my-lane[r].opp);}); laneAdv=laneAdv/5/2.5;
  // 사이드 보너스 (블루 1픽 우선권 / 레드 카운터픽)
  let sideBonus=0;
  if(D.mySide==='blue'){ sideBonus+=0.8; if(dMyPicks()[0]&&champTier(dMyPicks()[0])>=4) sideBonus+=0.9; }
  else { sideBonus+=0.8; const opFirst=dOppPicks()[0]; if(opFirst&&champTier(opFirst)>=4) sideBonus-=0.5; }
  const myArch=compArchetype(dMyPicks()), opArch=compArchetype(dOppPicks());
  const am=archMatchup(myArch,opArch);
  const kc=kitCounters(dMyPicks(),dOppPicks());
  const feedback=[...am.notes,...kc.notes];
  const compDiff=myComp.score-oppComp.score;
  const styleDiff=myStyle-opStyle;
  const myStaff=staffDraftBonus(S.userTeam), opStaff=staffDraftBonus(D.oppId);
  const staffDiff=myStaff-opStaff;
  const raw=compDiff*0.5 + laneAdv*2.6 + styleDiff*0.35 + sideBonus + staffDiff + am.v*2.4 + kc.v*0.9;
  const myPct=clamp(Math.round((50+raw*0.9)*10)/10,18,82);
  return {lane, myComp, oppComp, laneAdv, sideBonus, compDiff, styleDiff, staffDiff, myStaff, opStaff,
    myScore:myComp.score+laneAdv+styleDiff*0.4, oppScore:oppComp.score-laneAdv-styleDiff*0.4,
    myPct, oppPct:Math.round((100-myPct)*10)/10, assign:{me:myA,opp:opA}, myStyle, opStyle,
    arch:{me:myArch,opp:opArch,label:ARCH_LABEL}, archV:am.v, kitV:kc.v, feedback,
    staff:{me:staffAll(S.userTeam).map(st=>({name:st.name,role:st.role,rating:st.rating,traits:st.traits.slice()})),
           opp:staffAll(D.oppId).map(st=>({name:st.name,role:st.role,rating:st.rating,traits:st.traits.slice()}))}};
}

function liveTacticEdge(){

  const fo=M.focusKey?FOCUS_MAP[M.focusKey]:null;
  const st=M.stance?STANCE_MAP[M.stance]:null;
  let e=0;
  if(fo) e+=(fo.edge||0);
  if(fo&&typeof tacticEdgeBonus==='function') e+=tacticEdgeBonus(M.focusKey);
  if(fo&&CHEESE_TACTICS[M.focusKey]){
    const pe=M.powerEdge||0;
    if(pe<0) e+=clamp(Math.abs(pe)*0.018,0.01,0.10);
    e+=(Math.random()-0.45)*0.05;
  }
  if(st) e+=(st.edge||0);
  if(fo){
    ROLES.forEach(r=>{
      const p=playerAt('me',r); if(!p) return;
      const cats=playCats(p);
      if(fo.mm==='top'&&r==='TOP'&&cats.includes('운영')) e+=0.02;
      if(fo.mm==='bot'&&(r==='ADC'||r==='SUP')&&cats.includes('교전')) e+=0.02;
      if((M.focusKey==='split131'||M.focusKey==='split14')&&cats.includes('운영')) e+=0.015;
      if(M.focusKey==='baronBush'&&cats.includes('시야')) e+=0.02;

      if(M.focusKey==='obj'&&cats.includes('오브젝트')) e+=0.02;

  }
  return clamp(e,-0.3,0.4);
}

function startMatch(draftResult){

  const mySide=draftResult.mySide||D.mySide;

  const myPct=draftResult.myPct;
  const draftLogit=clamp((myPct-50)*0.034,-1.15,1.15);
  let edge=(myPower-oppPower)*0.9;
  const styleEdge=((myTrait.fight-opTrait.fight)*0.012 + (myTrait.obj-opTrait.obj)*0.012 + (myTrait.macro-opTrait.macro)*0.01 + (myTrait.vision-opTrait.vision)*0.008);
  if(gp.jungle==='top'){ edge+=(lane.TOP.my-lane.TOP.opp)*0.08; }
  if(gp.jungle==='bot'){ edge+=(lane.ADC.my-lane.ADC.opp)*0.08; }
  if(gp.laneSwap){ const botGap=lane.ADC.my-lane.ADC.opp; if(botGap<0) edge+=-botGap*0.14; edge-=0.4; }
  if(gp.dive) edge+=0.5;
  if(gp.invade==='steal') edge+=0.45;
  if(gp.invade==='ward') edge+=0.2;
  if(gp.jungle==='farm') edge+=0.15;
  edge += (S.seriesMomentum||0) + ((S.currentSeries&&S.currentSeries.nextEdge)||0);
  edge += (S.pressEdge||0)*0.55;
  // 상대 에이스 시그니처 밴 보상
  try{

    let banPay=0;

  }catch(e){}
  if(myPower<oppPower) edge += (myCoach.underdog||0)*1.4;
  edge += (chemMe-chemOp)*0.35 + (fitMe-fitOp)*0.8;
  const ace=lineupOf(me).slice().sort((a,b)=>rawOverall(b)-rawOverall(a))[0];
  if(ace) edge += (myCoach.star||0)*(ace.form-70)*0.02;
  M={
    sec:0, minute:0, gold:[0,0], kills:[0,0], towers:[0,0], dragons:[0,0], grubs:[0,0], barons:[0,0], heralds:[0,0],
    dragonElems:{me:[],opp:[]}, soulType:{me:null,opp:null}, soulGranted:{me:false,opp:false},
    elderAt:null, elder:{me:false,opp:false}, elderUntil:{me:0,opp:0}, elderCount:[0,0],
    fights:[0,0], vision:[0,0], events:[], over:false, running:false, speed:4,
    edge, styleEdge:(styleEdge+(myCoach.order||0)*0.5-(opCoach.order||0)*0.5),
    draftLogit, draftPct:myPct, powerEdge:(myPower-oppPower)*0.9,
    coach:{me:myCoach,opp:opCoach}, earlyEdge:((myCoach.early||0)-(opCoach.early||0)),
    chem:{me:chemMe,opp:chemOp}, coachFit:{me:fitMe,opp:fitOp},
    mySide, oppId:opp.id, oppName:opp.name, myName:me.name,
    myComp:draftResult.myComp, oppComp:draftResult.oppComp, arch:draftResult.arch,
    lane, gp, stance:'standard', focusKey:null, stanceAt:0, focusAt:0,
    history:[], winProb:0.5, series:D.series, gameIdx:D.gameIdx,
    trait:{me:myTrait,opp:opTrait}, assign:{me:myA,opp:opA},
    lineups:{
      me:ROLES.map(r=>({role:r,name:(S.players[me.lineup[r]]||{}).name||'',champ:myA[r]||'',p:(S.players[me.lineup[r]]||{}).name||''})),
      opp:ROLES.map(r=>({role:r,name:(S.players[opp.lineup[r]]||{}).name||'',champ:opA[r]||'',p:(S.players[opp.lineup[r]]||{}).name||''}))
    },
    mvp:null, needTactic:false, pending:null, startStyle:myPct,
  };
  M.tacticEdge=liveTacticEdge();
  M.winProb=winProb();
  M.history.push({min:0,diff:0});
  logEvent('sys','밴픽 완료 — '+me.name+' vs '+opp.name+', '+ (mySide==='blue'?'블루':'레드') +' 사이드');
  logEvent('sys','밴픽 우세도 '+myPct.toFixed(0)+'% : '+(100-myPct).toFixed(0)+'% · 상대 조합: '+dOppPicks().join(' · '));
  renderMatch(); startTimer();
}
function startTimer(){
  stopTimer();
  TIMER=setInterval(()=>{ if(!M||M.over||!M.running) return; tick(); }, Math.round(1000/(M.speed||4)));
}
function stopTimer(){ if(TIMER){clearInterval(TIMER);TIMER=null;} }
function setSpeed(s){ if(!M) return; M.speed=s; stopTimer(); TIMER=setInterval(()=>{ if(!M||M.over||!M.running) return; tick(); }, Math.round(620/s)); renderMatch(); }
function togglePlay(){ if(!M) return; M.running=!M.running; renderMatch(); }

function logEvent(kind,text,minute){
  if(!M) return;
  text=String(text).replace(/^\d+분 · /,'');
  M.events.unshift({kind,text,minute:minute===undefined?M.minute:minute});
  if(M.events.length>90) M.events.pop();
}
function curveAt(comp,min){
  const c=comp.curve;
  if(min<15) return c[0];
  if(min<25) return c[1];
  return c[2];
}
function winProb(){
  if(!M) return 0.5;
  const gd=M.gold[0]-M.gold[1];
  const kd=M.kills[0]-M.kills[1];
  const td=M.towers[0]-M.towers[1];
  const dd=M.dragons[0]-M.dragons[1];
  const bd=M.barons[0]-M.barons[1];
  const cd=curveAt(M.myComp,M.minute)-curveAt(M.oppComp,M.minute);
  const tf=clamp(M.minute/14,0.3,1);
  const st=M.stance?STANCE_MAP[M.stance]:null;
  const lateStance=(st&&st.late&&M.minute>=25)?st.late:0;
  const pe=(M.powerEdge||0);
  const underdog=pe<0?clamp(1+Math.abs(pe)*0.055,1,2.1):1;
  let s=(gd/2500)*tf + kd*0.05 + td*0.07 + dd*0.13 + bd*0.4 + cd*0.16
    + M.draftLogit*(pe<0?1.45:1) + pe*0.02 + (M.styleEdge||0) + (M.tacticEdge||0)*underdog + lateStance
    + ((M.soulGranted&&M.soulGranted.me)?0.12:0) - ((M.soulGranted&&M.soulGranted.opp)?0.12:0)
    + ((M.elder&&M.elder.me&&M.minute<=(M.elderUntil.me||0))?0.3:0) - ((M.elder&&M.elder.opp&&M.minute<=(M.elderUntil.opp||0))?0.3:0)
    + (M.minute<=12?(M.earlyEdge||0)*0.35:0);
  return clamp(sig(s),0.03,0.97);
}
function sideIdx(team){ return team==='me'?0:1; }
function addGold(team,amount){ M.gold[sideIdx(team)]+=Math.round(amount); }
function lineupAt(team,role){ return (M.lineups[team==='me'?'me':'opp'].find(x=>x.role===role)||{}); }
function myChampAt(role){ return lineupAt('me',role).champ||'챔피언'; }
function oppChampAt(role){ return lineupAt('opp',role).champ||'챔피언'; }
function myNameAt(role){ return lineupAt('me',role).name||'우리 팀'; }
function oppNameAt(role){ return lineupAt('opp',role).name||'상대'; }
function playerAt(team,role){ const l=lineupAt(team,role); return S.players[l.name]||null; }

function weightedPick(items,weights){
  const total=weights.reduce((a,b)=>a+b,0); let r=Math.random()*total;
  for(let i=0;i<items.length;i++){ r-=weights[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}

function tickBody(){
  if(!M||M.over) return;
  if(!M.running&&!M.over){ return; }
  M.sec=(M.sec||0)+1;
  if(M.sec%60===0) simStep();
  else {
    // 초 단위 잔잔한 진행: 골드 소폭 증가
    M.gold[0]=Math.round((M.gold[0]||0)+rnd(3,9));
    M.gold[1]=Math.round((M.gold[1]||0)+rnd(3,9));
    if(M.history&&(M.sec%5===0)) M.history.push({min:M.sec/60,diff:M.gold[0]-M.gold[1]});
  }
  M.winProb=winProb();
  renderMatch();
}
function tick(){
  try{ tickBody(); }
  catch(e){
    try{ logEvent('sys','⚠ 시뮬레이션 예외 — '+e.message); }catch(_){}
    if(M){ M.over=true; M.running=false; stopTimer(); }
    try{ if(S.currentSeries&&!S.currentSeries.done){ if(S.currentSeries.score.me+S.currentSeries.score.opp===0){ S.currentSeries.score.me+=M.meWin===false?0:1; } renderSeriesResult(); } else renderAll(); }catch(_){}
  }
}
function simStep(){
  if(!M||M.over) return;
  if(!M.lane) M.lane={TOP:{my:60,opp:60},MID:{my:60,opp:60},ADC:{my:60,opp:60},JGL:{my:60,opp:60},SUP:{my:60,opp:60}};
  M.minute++;
  const m=M.minute;
  const sta=STANCE_MAP[M.stance]||STANCE_MAP.standard;
  const fo=M.focusKey?FOCUS_MAP[M.focusKey]:null;
  // 마일스톤 알림 (진행을 막지 않음)
  MILESTONES.forEach(ms=>{ if(ms.m===m) logEvent('sys','⏱ '+ms.n); });
  // 골드
  const LN=M.lane||{TOP:{my:60,opp:60},MID:{my:60,opp:60},ADC:{my:60,opp:60}};
  const eco=((LN.TOP.my-LN.TOP.opp)+(LN.MID.my-LN.MID.opp)+(LN.ADC.my-LN.ADC.opp))*0.9;
  const macroDiff=(M.trait.me.macro-M.trait.opp.macro)*6;
  const stanceGold=(sta.gold||0)*40;
  addGold('me', 620+eco*1.1+macroDiff+stanceGold+rnd(-35,35));
  addGold('opp', 620-eco*1.1-macroDiff-stanceGold+rnd(-35,35));
  if(sta.late&&m>=25) addGold('me',40);
  if(fo&&fo.gold) addGold('me',Math.round(fo.gold*700));
  if(fo&&fo.late&&m>=25) addGold('me',35);
  const p=winProb();
  const killFavor=clamp(0.5+(p-0.5)*0.6,0.12,0.88);
  const aggr=Math.max(0.35,1+(sta.aggr||0)+((fo&&fo.fight)||0)*0.4);
  // 라인 킬
  if(Math.random()<Math.max(0.12,0.30*aggr+(fo&&fo.kill?fo.kill:0))){
    const lb=(fo&&fo.laneBias)||{};
    const laneBias={TOP:lb.TOP||1,MID:lb.MID||1,ADC:lb.ADC||1};
    if(fo){ if(fo.mm==='top') laneBias.TOP=2.4; if(fo.mm==='bot'||fo.mm==='diveBot') laneBias.ADC=2.4; if(fo.mm==='mid') laneBias.MID=2.2; if(fo.mm==='assassin') laneBias.MID=1.9; }
    const role=weightedPick(ROLES, ROLES.map(r=>{
      const L=M.lane[r]||{my:60,opp:60};
      return (0.7+Math.abs((L.my||60)-(L.opp||60))*0.3)*(laneBias[r]||1);
    }));
    const L=M.lane[role]||{my:60,opp:60};
    let laneFavor=clamp(0.5+(L.my-L.opp)*0.05+(p-0.5)*0.5,0.08,0.92);
    if(M.soulGranted.me) laneFavor=clamp(laneFavor+0.02,0.08,0.94);
    if(M.elder.me&&m<=(M.elderUntil.me||0)) laneFavor=clamp(laneFavor+0.05,0.08,0.95);
    if(M.stance==='aggro') laneFavor=clamp(laneFavor+0.04,0.08,0.93);
    if(M.stance==='defensive') laneFavor=clamp(laneFavor-0.03,0.07,0.92);
    const meWins=Math.random()<laneFavor;
    const team=meWins?'me':'opp';
    addGold(team,300); M.kills[sideIdx(team)]++;
    const champ=team==='me'?myChampAt(role):oppChampAt(role);
    const nm=team==='me'?myNameAt(role):oppNameAt(role);
    const pl=playerAt(team,role);
    const flavour=styleLine(pl);
    const cdef=CHAMP_MAP[champ];
    const sigLine=(cdef&&cdef.sig)?('<i>'+cdef.sig.split('·')[0].trim()+'</i>'):'';
    const sideCls=team==='me'?'blue':'red';
    if(Math.random()<0.42){
      const victim=team==='me'?oppNameAt(role):myNameAt(role);
      logEvent(sideCls, m+'분 · <b>'+nm+'</b>('+champ+') 솔로킬! '+(sigLine?sigLine+' — ':'')+(flavour?'<i>'+flavour+'</i> · ':'')+ROLE_KR[role]+'에서 '+victim+'를 잡아냅니다.');
    }else{
      const gankRole=pickOf(ROLES.filter(r=>r!==role));
      const gankName=team==='me'?myNameAt(gankRole):oppNameAt(gankRole);
      const gankChamp=team==='me'?myChampAt(gankRole):oppChampAt(gankRole);
      const gc=CHAMP_MAP[gankChamp];
      logEvent(sideCls, m+'분 · '+ROLE_KR[role]+' 로밍 킬 — <b>'+gankName+'</b>('+gankChamp+')이(가) '+(gc&&gc.sig?'<i>'+gc.sig.split('·')[0].trim()+'</i>으로 ':'')+(flavour?flavour+'으로 ':'')+'마무리합니다.');
    }
  }
  // 픽오프 (바론/용 시야 낚시)
  if(fo&&fo.pickoff&&Math.random()<fo.pickoff*0.5){
    const meWins=Math.random()<clamp(killFavor+0.08,0.1,0.92);
    const team=meWins?'me':'opp';
    const role=pickOf(['SUP','JGL','MID']);
    addGold(team,380); M.kills[sideIdx(team)]++;
    logEvent(team==='me'?'blue':'red', m+'분 · <b>부시 매복 픽오프</b> — '+(team==='me'?myNameAt(role):oppNameAt(role))+'이(가) 시야 밖에서 끊어냅니다.');
  }
  // 위험 특성
  const riskMe=Math.max(0,M.trait.me.risk-1.2), riskOp=Math.max(0,M.trait.opp.risk-1.2);
  const calmMul=1-Math.min(0.5,(M.coach.me.calm||0));
  if(Math.abs(M.gold[0]-M.gold[1])>1800 && Math.random()<0.035*(riskMe+riskOp)*calmMul){
    const loser=(M.gold[0]>M.gold[1])?'me':'opp';
    const team=loser==='me'?'opp':'me';
    addGold(team,420); M.kills[sideIdx(team)]++;
    const role=pickOf(ROLES);
    const pl=playerAt(team==='me'?'opp':'me',role);
    const bad=badStyleLine(pl)||'무리한 진입';
    logEvent(team==='me'?'blue':'red', m+'분 · <b>'+bad+'</b> — '+(team==='me'?M.oppName:M.myName)+'이(가) 역습 킬을 챙깁니다.');
  }
  // 공허 유충
  if(m===6||m===10){
    const focus=(M.gp.firstObj==='grub'?0.25:-0.05)+(fo&&fo.mm==='top'?0.1:0)+((M.focusKey==='grubs'||M.focusKey==='obj')?0.12:0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.012+(M.trait.me.vision-M.trait.opp.vision)*0.006;
    const meWins=Math.random()<clamp(killFavor+focus+objEdge+(sta.obj||0),0.08,0.92);
    const team=meWins?'me':'opp';
    M.grubs[sideIdx(team)]+=3; addGold(team,190*S.meta.obj.grub);
    logEvent(team==='me'?'blue':'red', m+'분 · 공허 유충 3스택 — <b>'+(team==='me'?M.myName:M.oppName)+'</b>이(가) 유충을 가져갑니다.');
  }
  // ---------- 드래곤: 원소 · 영혼 · 장로 ----------
  const dTimes=[5,11,17,23,29];
  const soulClaimed=(M.soulGranted.me||M.soulGranted.opp);
  const soulEdgeDiff=((M.soulGranted.me?0.03:0)-(M.soulGranted.opp?0.03:0));
  const elderEdgeDiff=((M.elder.me&&m<=(M.elderUntil.me||0))?0.08:0)-((M.elder.opp&&m<=(M.elderUntil.opp||0))?0.08:0);
  if(!soulClaimed && dTimes.includes(m)){
    const dFocus=(M.gp.firstObj==='dragon'?0.2:-0.05)+(M.gp.jungle==='bot'?0.08:0)+(fo?(fo.obj||0):0)+(sta.obj||0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.014+(M.trait.me.vision-M.trait.opp.vision)*0.007+((M.coach.me.obj||0)-(M.coach.opp.obj||0))*0.3+soulEdgeDiff+elderEdgeDiff;
    const meWins=Math.random()<clamp(killFavor+dFocus+objEdge,0.08,0.92);
    const team=meWins?'me':'opp';
    const n=(M.dragons[sideIdx(team)]||0)+1;
    M.dragons[sideIdx(team)]=n;
    const elem=(n>=4&&M.soulType[team])?M.soulType[team]:(pickOf(DRAKE_ELEMENTS).k);
    M.dragonElems[team].push(elem);
    addGold(team,380*S.meta.obj.dragon);
    if(n===3&&!M.soulType[team]){
      M.soulType[team]=elem;
      logEvent(team==='me'?'blue':'red', m+'분 · <b>3용</b> — '+(team==='me'?M.myName:M.oppName)+'의 드래곤 영혼 예고: <b>'+drakeName(elem)+'의 영혼</b>');
    }else if(n>=4&&!M.soulGranted[team]){
      M.soulGranted[team]=true; M.soulType[team]=M.soulType[team]||elem;
      M.elderAt=m+6;
      logEvent(team==='me'?'blue':'red', m+'분 · 💠 <b>드래곤 영혼 획득!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) '+drakeName(M.soulType[team])+'의 영혼을 흡수했습니다 — 한타력 급상승');
    }else{
      logEvent(team==='me'?'blue':'red', m+'분 · '+drakeIcon(elem)+' '+drakeName(elem)+' 드래곤 처치 — <b>'+(team==='me'?M.myName:M.oppName)+'</b> ('+n+'스택)');
    }
  }
  // 장로 드래곤 (영혼 획득 6분 후)
  if(M.elderAt && m>=M.elderAt && (m-M.elderAt)%6===0){
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.012+soulEdgeDiff;
    const meWins=Math.random()<clamp(killFavor+0.02+objEdge,0.08,0.92);
    const team=meWins?'me':'opp';
    M.elder[team]=true; M.elderUntil[team]=m+3; M.elderCount[sideIdx(team)]++;
    addGold(team,600);
    logEvent(team==='me'?'blue':'red', m+'분 · 🐲 <b>장로 드래곤 처치!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) 처형 버프를 얻습니다 (3분)');
  }
  // 협곡의 전령
  if(m===14){
    const meWins=Math.random()<clamp(killFavor+(fo&&fo.mm==='top'?0.1:0)+(M.gp.firstObj==='grub'?0.05:0)+(M.gp.firstObj==='herald'?0.18:0),0.08,0.92);
    const team=meWins?'me':'opp';
    M.heralds[sideIdx(team)]++;
    addGold(team,450);
    logEvent(team==='me'?'blue':'red', m+'분 · 🕯 <b>협곡의 전령 처치</b> — '+(team==='me'?M.myName:M.oppName)+'이(가) 전령을 확보해 타워 압박에 나섭니다.');
  }
  // 타워
  if(m>=8 && Math.random()<Math.max(0.05,0.20+(fo?(fo.tower||0):0))*(M.stance==='defensive'?0.85:1)*S.meta.obj.tower){
    const meWins=Math.random()<clamp(killFavor+(M.trait.me.macro-M.trait.opp.macro)*0.008,0.08,0.92);
    const team=meWins?'me':'opp';
    M.towers[sideIdx(team)]++;
    addGold(team,240);
    if(M.towers[sideIdx(team)]%2===0) logEvent(team==='me'?'blue':'red', m+'분 · '+(team==='me'?M.myName:M.oppName)+' 외곽 타워 철거 — 시야가 넓어집니다.');
  }
  // 한타
  if(m>=13 && Math.random()<0.07*(1+((fo&&fo.fight)||0))*(1+(M.stance==='aggro'?0.5:M.stance==='defensive'?-0.35:0))){
    let fightEdge=(M.myComp.tags.fight-M.oppComp.tags.fight)*0.015+(M.myComp.front-M.oppComp.front)*0.01+(M.myComp.cc-M.oppComp.cc)*0.006+(M.trait.me.fight-M.trait.opp.fight)*0.012;
    if(M.soulGranted.me) fightEdge+=0.035; if(M.soulGranted.opp) fightEdge-=0.035;
    if(M.elder.me&&m<=(M.elderUntil.me||0)) fightEdge+=0.06; if(M.elder.opp&&m<=(M.elderUntil.opp||0)) fightEdge-=0.06;
    const meWins=Math.random()<clamp(killFavor+fightEdge+(M.stance==='aggro'?0.04:0)-(M.stance==='defensive'?0.05:0),0.05,0.95);
    const team=meWins?'me':'opp';
    const n=ri(1,3);
    M.kills[sideIdx(team)]+=n; addGold(team,n*300+120);
    M.fights[sideIdx(team)]++;
    const hero=pickOf(ROLES);
    const pl=playerAt(team,hero);
    const flavour=pl?styleLine(pl):'';
    const archTag=(M.arch&&M.arch.label)?(' <i>'+M.arch.label[(team==='me'?M.arch.me:M.arch.opp).arch]+'</i>'):'';
    logEvent(team==='me'?'blue':'red', m+'분 · <b>대규모 한타</b> — '+(team==='me'?M.myName:M.oppName)+archTag+'이(가) '+n+'킬 스왑'+(flavour?' · '+flavour+'!':'하며 주도권을 가져갑니다.'));
  }
  // 바론
  if([20,26,32].includes(m)){
    const baronFocus=(M.focusKey==='baronBush'?0.45:0)+(fo&&fo.mm==='obj'?0.2:0)+(M.grubs[0]>M.grubs[1]?0.06:0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.016;
    const meWins=Math.random()<clamp(killFavor+baronFocus+objEdge,0.05,0.95);
    const team=meWins?'me':'opp';
    M.barons[sideIdx(team)]++;
    addGold(team,1200*S.meta.obj.baron);
    logEvent(team==='me'?'blue':'red', m+'분 · <b>바론 처치!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) 바론 버프로 압박을 시작합니다.');
  }
  // 작전 패시브
  if(M.focusKey==='split131'||M.focusKey==='split14'||M.focusKey==='cross'){
    const bonus=M.focusKey==='split14'?60:M.focusKey==='split131'?48:40;
    addGold(Math.random()<killFavor?'me':'opp',bonus);
  }
  M.vision[0]+=ri(2,4); M.vision[1]+=ri(2,4);
  M.winProb=winProb();
  M.history.push({min:m,diff:M.gold[0]-M.gold[1]});
  const gd=M.gold[0]-M.gold[1];
  if((m>=27&&Math.abs(gd)>6000)||(m>=31&&Math.abs(gd)>3800)||(m>=35&&Math.abs(gd)>2000)||m>=38){
    finishGame();
    return;
  }
  renderMatch();
}
function finishGame(){
  if(!M||M.over) return;
  M.over=true; M.running=false; stopTimer();
  const gd=M.gold[0]-M.gold[1];
  let meWin;
  if(Math.abs(gd)>3000) meWin=gd>0;
  else meWin=Math.random()<clamp(0.5+gd/6000,0.15,0.85);
  M.meWin=meWin;
  M.winProb=meWin?1:0;
  const winTeam=meWin?'me':'opp';
  logEvent(meWin?'blue':'red', M.minute+'분 · <b>넥서스 파괴!</b> '+(meWin?M.myName:M.oppName)+' 승리', M.minute);
  const winners=winTeam==='me'?M.lineups.me:M.lineups.opp;
  const mvp=pickOf(winners.filter(x=>x.name));
  M.mvp=mvp;
  S.seriesMomentum=meWin?0.8:-0.8;
  const me=T(S.userTeam), opp=T(M.oppId);
  const myPlayers=lineupOf(me), oppPlayers=lineupOf(opp);
  const volOf=p=>persMod(p,'vol','avg');
  if(meWin){
    myPlayers.forEach(p=>{p.form=clamp(p.form+Math.round(ri(2,6)*volOf(p)),10,100);p.fatigue=clamp(p.fatigue+ri(6,11),0,100);});
    oppPlayers.forEach(p=>{p.form=clamp(p.form-Math.round(ri(2,6)*volOf(p)),10,100);p.fatigue=clamp(p.fatigue+ri(5,10),0,100);});
  }else{
    const wall=1-Math.min(0.6,(staffMods(S.userTeam).mental||0)*0.9);
    myPlayers.forEach(p=>{p.form=clamp(p.form-Math.round(ri(2,6)*wall),10,100);p.fatigue=clamp(p.fatigue+ri(6,11),0,100);});
    oppPlayers.forEach(p=>{p.form=clamp(p.form+ri(1,4),10,100);});
  }
  if(M.mvp && M.mvp.name) S.pog[M.mvp.name]=(S.pog[M.mvp.name]||0)+(meWin?100:60);
  // ---- 실전 경험치 & 성장 ----
  S.lastGrowth=[];
  const growTeam=(teamId,won)=>{
    const team=(typeof teamId==='string')?T(teamId):teamId;
    if(!team||!team.lineup) return;
    ROLES.forEach(r=>{
      const p=S.players[team.lineup[r]]; if(!p) return;
      let base=18+(won?8:0)+(p.age<=21?10:p.age<=23?5:0);
      if(M.mvp&&M.mvp.name===p.name) base+=18;
      const mult=persMod(p,'growth','avg');
      p.exp=(p.exp||0)+Math.round(base*mult);
      if(p.exp>=100){
        p.exp-=100;
        const keys=({TOP:['lane','fight','macro'],JGL:['macro','fight','mental'],MID:['lane','fight','macro'],ADC:['lane','fight','mental'],SUP:['macro','mental','lane']})[p.role]||['lane','fight'];
        const k=keys[Math.floor(Math.random()*keys.length)];
        const before=p.stats[k];
        p.stats[k]=clamp(p.stats[k]+1,40,99);
        S.lastGrowth.push({team,name:p.name,stat:k,amt:p.stats[k]-before,exp:0});
      }else{
        S.lastGrowth.push({team,name:p.name,exp:p.exp});
      }
    });
  };
  try{ growTeam(S.userTeam,meWin); growTeam(M.oppId,!meWin); }catch(e){ S.lastGrowth=S.lastGrowth||[]; }
  try{ if(typeof statApplyMyGame==='function') statApplyMyGame(); }catch(e){}
  const sr=M.series;
  if(meWin) sr.score.me++; else sr.score.opp++;
  S.bestDraftPct=Math.max(S.bestDraftPct||0, M.draftPct||0);
  if(M.elder&&M.elder.me) S.elderTaken=(S.elderTaken||0)+1;
  if(M.soulGranted&&M.soulGranted.opp&&meWin) S.soulComeback=(S.soulComeback||0)+1;
  if(M.barons[0]>0&&M.gold[0]<M.gold[1]-3000&&meWin) S.baronSteals=(S.baronSteals||0)+1;
  sr.games.push({win:meWin, minute:M.minute, kills:M.kills.slice(), gold:M.gold.slice(),
    mvp:(M.mvp||{}).name||'', mvpChamp:(M.mvp||{}).champ||'',
    dragons:M.dragons.slice(), towers:M.towers.slice(), barons:M.barons.slice(),
    myComp:M.myComp, oppComp:M.oppComp, lane:M.lane, edge:M.edge, tactics:M.tacticAt, history:M.history.slice(),
    myPct:M.draftPct, myPicks:dMyPicks().slice(), oppPicks:dOppPicks().slice(),
    assign:{me:Object.assign({},D.assign.me),opp:Object.assign({},D.assign.opp)}});
  if(sr.fearless){ sr.fearlessUsed.push(...dMyPicks(), ...dOppPicks()); }
  if(sr.bo>=3&&sr.score.me-sr.score.opp>=2) S.sweeps=(S.sweeps||0)+1;
  saveGame();
  try{ checkAchievements(); }catch(e){}
  try{ gameEndFlow(); }catch(e){ try{ renderSeriesResult(); }catch(e2){ try{ renderAll(); }catch(e3){} } }
}
function analyzeGame(game){
  if(!game) return {reasons:[]};
  const lane=game.lane||{}; const reasons=[]; const laneR=[];
  ROLES.forEach(r=>{ if(!lane[r]) lane[r]={my:60,opp:60}; });
  ROLES.forEach(r=>{
    const d=(lane[r]?lane[r].my-lane[r].opp:0);
    if(Math.abs(d)>2.5) laneR.push({k:'lane',v:Math.sign(d),d,txt:ROLE_KR[r]+' 라인전 '+(d>0?'우위':'열세')+' ('+(d>0?'+':'')+d.toFixed(1)+')'});
  });
  laneR.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  laneR.slice(0,3).forEach(x=>reasons.push(x));
  const myC=game.myComp, opC=game.oppComp;
  if(myC&&opC){
    if(game.win && opC.tags.scale>myC.tags.scale+2) reasons.push({k:'comp',v:1,txt:'후반 밸류 싸움에서 앞섰습니다'});
    if(!game.win && myC.tags.scale<opC.tags.scale-2) reasons.push({k:'late',v:-1,txt:'후반 밸류 열세 — 30분 이후 한타에서 밀렸습니다'});
    if(!game.win && myC.tags.engage<opC.tags.engage-2) reasons.push({k:'engage',v:-1,txt:'이니시 싸움에서 밀렸습니다'});
    if(!game.win && myC.front<opC.front-2) reasons.push({k:'front',v:-1,txt:'프론트라인이 무너졌습니다'});
    if(myC.tags.engage>=9 && game.win) reasons.push({k:'engage',v:1,txt:'강한 이니시로 교전을 열었습니다'});
  }
  if(game.kills && game.kills[0]<game.kills[1]-4) reasons.push({k:'fight',v:-1,txt:'교전 킬 스코어 열세'});
  if(game.myPct){ const adv=game.myPct-50; reasons.push({k:'draft',v:Math.sign(adv),txt:'밴픽 우세도 '+game.myPct.toFixed(0)+'% : '+(100-game.myPct).toFixed(0)+'% — '+(adv>0?'밴픽에서 앞섰습니다':'밴픽에서 밀렸습니다')}); }
  return {reasons};
}

/* ============ SEASON / FLOW ============ */
const CAL_WEEKS=['1월 3주','2월 1주','2월 4주','3월 3주','4월 2주','5월 4주','7월 1주','8월 1주','8월 4주'];
const CAL_STAGES=[
  {k:'spring', month:'1~3월', label:'LCK 스프링', detail:'정규 5주 + 플레이오프', icon:'🌸'},
  {k:'msi',    month:'5월',   label:'MSI', detail:'LCK·LPL·LEC·LCS 8팀 토너먼트', icon:'🌏'},
  {k:'summer', month:'6~8월', label:'LCK 서머', detail:'정규 4주 + 플레이오프', icon:'☀️'},
  {k:'ewc',    month:'7월',   label:'EWC 이스포츠 월드컵', detail:'8팀 초청 토너먼트', icon:'🏅'},
  {k:'worlds', month:'10~11월', label:'롤드컵', detail:'스위스 → 8강 → 4강 → 결승', icon:'🌍'},
  {k:'offseason', month:'11~12월', label:'스토브리그', detail:'재계약 · FA 이적시장', icon:'💼'},
];
function stagePhase(){ return S?S.phase:'regular'; }
function calendarNow(){
  if(!S) return 'spring';
  if(S.phase==='msi') return 'msi';
  if(S.phase==='ewc') return 'ewc';
  if(S.phase==='offseason') return 'offseason';
  if(S.phase==='regular') return S.split==='summer'?'summer':'spring';
  if(S.phase==='playoffs') return S.split==='summer'?'summer':'spring';
  if(S.phase==='worlds'){
    const W=S.worlds;
    if(W){
      if(W.stage==='swiss') return 'swiss';
      if(W.stage==='bracket'){ const r=W.bracket?W.bracket.round:0; return r<=0?'quarters':r===1?'semis':'final'; }
      return 'final';
    }
    return 'swiss';
  }
  return 'worlds';
}
function weekCalLabel(w){ return CAL_WEEKS[(w-1)%CAL_WEEKS.length]; }

function genSchedule(ids){
  const arr=ids.slice(); const n=arr.length; const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i],b=arr[n-1-i];
      pairs.push(r%2===0?[a,b]:[b,a]);
    }
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function standings(){
  return Object.values(S.teams).filter(t=>t.region==='LCK').sort((x,y)=>(y.wins-x.wins)||((y.gw-y.gl)-(x.gw-x.gl))||(y.gw-x.gw));
}
function myRank(){ return standings().findIndex(t=>t.id===S.userTeam)+1; }
function weekOpponent(){
  const pairs=S.schedule[S.week-1]||[];
  const p=pairs.find(x=>x.includes(S.userTeam));
  if(!p) return null;
  return {oppId:p[0]===S.userTeam?p[1]:p[0], pair:p};
}
function recordResult(aId,bId,sa,sb,week,stage){
  const a=T(aId),b=T(bId);
  a.gw+=sa;a.gl+=sb;b.gw+=sb;b.gl+=sa;
  if(sa>sb){a.wins++;b.losses++;a.form.push('W');b.form.push('L');}
  else{b.wins++;a.losses++;b.form.push('W');a.form.push('L');}
  if(a.form.length>6)a.form.shift(); if(b.form.length>6)b.form.shift();
  try{
    if(typeof simAiStats==='function'){
      const kA=ri(6,18)+sa*3, kB=ri(6,18)+sb*3;
      if(aId!==S.userTeam) simAiStats(aId,sa>sb,kA,kB);
      if(bId!==S.userTeam) simAiStats(bId,sb>sa,kB,kA);
    }
  }catch(e){}
  if(aId!==S.userTeam && bId!==S.userTeam){
    const winT=sa>sb?a:b;
    const ps=winT.roster.map(n=>S.players[n]).filter(Boolean);
    const star=ps.sort((x,y)=>rawOverall(y)-rawOverall(x)).slice(0,2);
    star.forEach(p=>{ S.pog[p.name]=(S.pog[p.name]||0)+ri(40,100); });
  }
  S.results.push({week,stage,a:aId,b:bId,sa,sb});
}
function simAIBo(aId,bId,bo){
  const pa=teamPower(T(aId)),pb=teamPower(T(bId));
  const need=Math.ceil(bo/2); let sa=0,sb=0;
  const base=sig((pa-pb)/5.5);
  while(sa<need&&sb<need){
    if(Math.random()<clamp(base+ (Math.random()-0.5)*0.16,0.05,0.95)) sa++; else sb++;
  }
  return {sa,sb};
}

/* ---------- series ---------- */
function createSeries(oppId,bo,stage,meta){
  const s={oppId,bo,stage,meta:meta||{},score:{me:0,opp:0},games:[],sides:[],fearless:!!S.fearless,
    fearlessUsed:[],done:false,pendingSide:false,coach:null,momentum:0,startedAt:Date.now()};
  s.sides[0]=Math.random()<0.5?'blue':'red';
  S.currentSeries=s; S.seriesMomentum=0;
  return s;
}
function seriesWinNeed(s){ return Math.ceil(s.bo/2); }
function seriesOver(s){ return s.score.me>=seriesWinNeed(s)||s.score.opp>=seriesWinNeed(s); }
function userWonSeries(s){ return s.score.me>=seriesWinNeed(s); }
function aiSideChoice(){
  const opp=T(S.currentSeries.oppId);
  const topPick=Math.max(...Object.values(opp.lineup).map(n=>{
    const p=S.players[n]; return p?Math.max(...p.sigs.map(x=>champTier(x))):0;
  }));
  return topPick>=5?'blue':'red';
}
function setNextSide(side){
  const s=S.currentSeries; if(!s) return;
  s.sides[s.games.length]=side; s.pendingSide=false;
  startDraft(s);
}
function nextSeriesGame(){
  const s=S.currentSeries; if(!s) return;
  if(seriesOver(s)){ finishSeries(); return; }
  const last=s.games[s.games.length-1];
  if(!last){ startDraft(s); return; }
  const userLost=!last.win;
  if(userLost){ s.pendingSide=true; renderSideChoice(); }
  else { s.sides[s.games.length]=aiSideChoice(); startDraft(s); }
}
function applyCoaching(kind){
  const s=S.currentSeries; if(!s||!s.coach||s.coach.applied) return;
  const me=myTeam();
  if(kind==='mental'){
    lineupOf(me).forEach(p=>{p.form=clamp(p.form+ri(5,10),20,100);p.fatigue=clamp(p.fatigue-ri(3,7),0,100);});
    s.coach.msg='멘탈 케어 완료 — 선수단 컨디션과 집중력이 올라갔습니다';
  }else if(kind==='tactic'){
    s.nextEdge=(s.nextEdge||0)+1.1;
    s.coach.msg='전술 수정 — 다음 세트 초반 설계와 교전 규칙을 재정비했습니다';
  }else if(kind==='sub'){
    const worst=lineupOf(me).slice().sort((a,b)=>effRating(a)-effRating(b))[0];
    const bench=me.roster.map(n=>S.players[n]).filter(p=>!Object.values(me.lineup).includes(p.name));
    const best=bench.sort((a,b)=>effRating(b)-effRating(a))[0];
    if(worst&&best){
      const role=Object.keys(me.lineup).find(r=>me.lineup[r]===worst.name);
      me.lineup[role]=best.name;
      s.coach.msg='식스맨 교체 — '+worst.name+' OUT, '+best.name+' IN ('+ROLE_KR[role]+')';
    }else{ s.coach.msg='교체 가능한 식스맨이 없습니다'; }
  }
  s.coach.applied=kind;
  saveGame(); renderSeriesResult();
}
function finishSeries(){
  const s=S.currentSeries; if(!s) return;
  s.done=true;
  const meWon=userWonSeries(s);
  const oppId=s.oppId;
  if(s.stage==='regular'){
    recordResult(S.userTeam,oppId,s.score.me,s.score.opp,S.week,'regular');
    (S.schedule[S.week-1]||[]).forEach(([a,b])=>{
      if(a===S.userTeam||b===S.userTeam) return;
      const r=simAIBo(a,b,3);
      recordResult(a,b,r.sa,r.sb,S.week,'regular');
    });
    S.history.push({week:S.week,opp:oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'regular'});
    try{
      if(S.pressTrash&&S.club){
        const c=S.club;
        if(meWon){
          c.fanbase=clamp(c.fanbase+8,0,100); c.prestige=clamp(c.prestige+3,0,100); c.trust=clamp((c.trust||55)+2,0,100);
          newsAdd('press','🔥 도발 적중 — 여론 폭발! 팬심 +8 · 명성 +3');
        }else{
          c.fanbase=clamp(c.fanbase-6,0,100); c.prestige=clamp(c.prestige-2,0,100); c.trust=clamp((c.trust||55)-3,0,100);
          newsAdd('press','💬 도발 역풍 — 커뮤니티가 들끓습니다. 팬심 -6 · 명성 -2');
        }
        S.pressTrash=null; c.community=null;
      }
    }catch(e){}
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'regular'};
    S.week++;
    S.actionApplied=false; S.weekActionTarget=null; S.gameplan=null;
    try{ clubWeekAdvance(); }catch(e){}
    if(S.split==='spring'&&S.week>5){ startPlayoffs('spring'); }
    else if(S.split==='summer'&&S.week>ROUNDS){ startPlayoffs('summer'); }
    else if([3,6].includes(S.week)){ applyRandomPatch('WK'+S.week); }
    else if(S.split==='summer'&&S.week===8&&!S.ewc){ startEWC(); }
    S.currentSeries=null; S.seriesMomentum=0;
  }else if(s.stage==='kespa'){
    const km=s.meta&&s.meta.kespaMatch;
    if(km){ kespaRecord(km,s.score.me,s.score.opp); }
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'kespa'};
    if(meWon){ S.club.fanbase=clamp(S.club.fanbase+2,0,100); }
    S.currentSeries=null; S.seriesMomentum=0;
    saveGame();
    renderAll();
    return;
  }else if(s.stage==='msi'||s.stage==='ewc'){
    const m=s.meta.match;
    if(m){ m.sa=s.score.me; m.sb=s.score.opp; m.winner=s.score.me>s.score.opp?S.userTeam:oppId; m.done=true; }
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:s.stage};
    S.currentSeries=null; S.seriesMomentum=0;
    saveGame();
    renderIntl();
    return;
  }else if(s.stage==='worlds'){
    const m=s.meta.match;
    if(m){ m.sa=s.score.me; m.sb=s.score.opp; m.winner=s.score.me>s.score.opp?S.userTeam:oppId; m.done=true; }
    S.history.push({stage:'worlds',round:(s.meta.roundName||'월즈'),opp:oppId,score:s.score.me+'-'+s.score.opp,win:meWon});
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'worlds'};
    S.currentSeries=null; S.seriesMomentum=0;
    saveGame();
    renderWorlds();
    return;
  }else{
    const m=s.meta.match;
    m.sa=s.score.me; m.sb=s.score.opp; m.winner=meWon?S.userTeam:oppId; m.done=true;
    recordResult(S.userTeam,oppId,s.score.me,s.score.opp,S.week,'playoffs');
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:s.stage};
    if(!meWon) S.myExit={round:(s.meta&&s.meta.roundName)||'플레이오프',score:s.score.opp+'-'+s.score.me};
    S.currentSeries=null; S.seriesMomentum=0;
    checkPlayoffComplete();
  }
  saveGame();
  if(S.phase==='worlds'){ renderWorlds(); return; }
  if(S.phase==='end'){ renderChampion(); return; }
  renderAfterSeries();
}

/* ---------- playoffs ---------- */
function startPlayoffs(split){
  S.playoffSplit=split||S.split||'summer';
  applyRandomPatch('플레이오프 직전');
  const st=standings();
  const seeds=st.slice(0,6).map(t=>t.id);
  S.playoffs={
    seeds,
    rounds:[
      {name:'6강 PO',matches:[
        {a:seeds[2],b:seeds[5],done:false},
        {a:seeds[3],b:seeds[4],done:false},
      ]},
      {name:'4강 PO',matches:[
        {a:seeds[0],b:null,done:false},
        {a:seeds[1],b:null,done:false},
      ]},
      {name:'결승',matches:[{a:null,b:null,done:false}]},
    ],
    done:false,
  };
  S.phase='playoffs';
  saveGame();
}
function ensureBracket(){
  const P=S.playoffs; if(!P) return;
  const r0=P.rounds[0],r1=P.rounds[1],r2=P.rounds[2];
  if(r0.matches.every(m=>m.done)){
    r1.matches[0].b=r0.matches[0].winner;
    r1.matches[1].b=r0.matches[1].winner;
  }
  if(r1.matches.every(m=>m.done&&m.winner)){
    r2.matches[0].a=r1.matches[0].winner;
    r2.matches[0].b=r1.matches[1].winner;
  }
}
function checkPlayoffComplete(){
  const P=S.playoffs; if(!P) return false;
  const fin=P.rounds[2].matches[0];
  if(!fin.done) return false;
  P.done=true;
  S.lckChampion=fin.winner;
  S.lckRunnerUp=fin.winner===fin.a?fin.b:fin.a;
  S.champion=S.lckChampion; S.runnerUp=S.lckRunnerUp;
  if(S.playoffSplit==='spring'){
    S.springChampion=fin.winner; S.springRunnerUp=S.lckRunnerUp;
    try{ if(typeof computeAwards==='function') S.awardsPending=computeAwards('spring'); }catch(e){}
    startMSI();
  }else{
    S.summerChampion=fin.winner; S.summerRunnerUp=S.lckRunnerUp;
    try{ if(typeof computeAwards==='function') S.awardsPending=computeAwards('summer'); }catch(e){}
    startWorlds();
  }
  return true;
}
function playoffNext(){
  const P=S.playoffs; if(!P||P.done) return {action:'done'};
  for(let pass=0;pass<6;pass++){
    ensureBracket();
    let simmed=false;
    for(let r=0;r<P.rounds.length;r++){
      for(const m of P.rounds[r].matches){
        if(m.done||!m.a||!m.b) continue;
        if(m.a===S.userTeam||m.b===S.userTeam){
          return {action:'user',match:m,round:r,roundName:P.rounds[r].name};
        }
        const res=simAIBo(m.a,m.b,5);
        m.sa=res.sa;m.sb=res.sb;m.winner=res.sa>res.sb?m.a:m.b;m.done=true;
        recordResult(m.a,m.b,res.sa,res.sb,S.week,'playoffs');
        simmed=true;
      }
    }
    ensureBracket();
    const fin=P.rounds[2].matches[0];
    if(fin.done){ checkPlayoffComplete(); return {action:'done'}; }
    if(!simmed) break;
  }
  return {action:'none'};
}
function startPlayoffSeries(match,roundName){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const s=createSeries(oppId,5,'playoff',{match,roundName});
  if(!s.sides[0]) s.sides[0]='blue';
  saveGame();
  return s;
}

/* ================= MSI / EWC 국제 초청 토너먼트 ================= */
function startMSI(){
  try{ S.splashPending='msi'; }catch(e){}
  const st=standings();
  const lck=[S.springChampion,S.springRunnerUp].filter(id=>id&&S.teams[id]);
  st.forEach(t=>{ if(lck.length<2&&!lck.includes(t.id)) lck.push(t.id); });
  const teams=[lck[0],lck[1],'BLG','TES','G2','FNC','FLY','TL'].filter((x,i,a)=>x&&a.indexOf(x)===i);
  S.msi={kind:'msi',name:'MSI',month:'5월',bo:5,teams,bracket:makeIntlBracket(teams,5,'5월'),
    done:false,champion:null,runnerUp:null,userIn:teams.includes(S.userTeam)};
  S.phase='msi';
  applyRandomPatch('MSI 패치');
  saveGame();
}
function startEWC(){
  try{ S.splashPending='ewc'; }catch(e){}
  const lck=standings().slice(0,2).map(t=>t.id);
  const teams=[...lck,'BLG','TES','G2','FNC','FLY','TL'].filter((x,i,a)=>x&&a.indexOf(x)===i);
  S.ewc={kind:'ewc',name:'EWC 이스포츠 월드컵',month:'7월',bo:3,teams,bracket:makeIntlBracket(teams,3,'7월'),
    done:false,champion:null,runnerUp:null,userIn:teams.includes(S.userTeam)};
  S.phase='ewc';
  saveGame();
}
function makeIntlBracket(teams,bo,month){
  const s=teams.slice(0,8);
  const mk=(a,b)=>({a,b,bo,done:false});
  return {round:0, rounds:[
    {name:'8강', month, matches:[mk(s[0],s[7]),mk(s[3],s[4]),mk(s[1],s[6]),mk(s[2],s[5])]},
    {name:'4강', month, matches:[mk(null,null),mk(null,null)]},
    {name:'결승', month, matches:[mk(null,null)]},
  ]};
}
function intlNow(){ return S.phase==='msi'?S.msi:(S.phase==='ewc'?S.ewc:null); }
function simIntlMatch(m,tour){
  const r=simAIBo(m.a,m.b,m.bo||tour.bo||5);
  m.sa=r.sa; m.sb=r.sb; m.winner=r.sa>r.sb?m.a:m.b; m.done=true;
}
function intlAdvance(tour){
  const B=tour.bracket; const rd=B.rounds[B.round];
  if(!rd.matches.every(m=>m.done)) return {action:'pending'};
  if(B.round>=B.rounds.length-1){
    const fin=rd.matches[0];
    tour.done=true; tour.champion=fin.winner; tour.runnerUp=fin.winner===fin.a?fin.b:fin.a;
    if(tour.kind==='msi'){
      S.msiChampion=tour.champion;
      S.split='summer'; S.phase='regular'; S.week=6; S.splashPending='summer';
      S.actionApplied=false; S.weekActionTarget=null; S.gameplan=null;
      toast('☀️ MSI 종료 — 서머 시즌이 시작됩니다');
    }else{
      S.ewcChampion=tour.champion;
      S.phase='regular'; S.splashPending='summer';
      toast('🏅 EWC 종료 — 서머 시즌으로 복귀합니다');
    }
    saveGame();
    return {action:'done'};
  }
  const winners=rd.matches.map(m=>m.winner);
  const next=B.rounds[B.round+1];
  next.matches.forEach((m,i)=>{ m.a=winners[i*2]||null; m.b=winners[i*2+1]||null; });
  B.round++;
  saveGame();
  return {action:'advanced'};
}
function intlNext(){
  const tour=intlNow(); if(!tour) return {action:'none'};
  const rd=tour.bracket.rounds[tour.bracket.round];
  const mine=rd.matches.find(m=>!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam));
  if(mine) return {action:'user',match:mine,roundName:rd.name,tour};
  rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b) simIntlMatch(m,tour); });
  return intlAdvance(tour);
}
function intlSeries(match,roundName,tour){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const bo=match.bo||tour.bo||5;
  const s=createSeries(oppId,bo,tour.kind,{match,roundName});
  s.sides[0]=Math.random()<0.5?'blue':'red';
  saveGame();
  return s;
}

/* ================= WORLDS (롤드컵) ================= */
const WORLDS_INTL=['BLG','TES','LNG','WBG','G2','FNC','MKOI','KC','FLY','TL','C9','100T'];
function lckSeeds(){
  const P=S.playoffs;
  const st=standings().map(t=>t.id);
  const out=[];
  const fin=P?P.rounds[2].matches[0]:null;
  if(fin&&fin.winner){
    out.push(fin.winner);
    const loser=fin.winner===fin.a?fin.b:fin.a;
    if(loser&&!out.includes(loser)) out.push(loser);
  }
  if(P&&P.rounds[1]){
    P.rounds[1].matches.forEach(m=>{ if(m.done&&m.winner){ const loser=m.winner===m.a?m.b:m.a; if(loser&&!out.includes(loser)) out.push(loser); } });
  }
  st.forEach(id=>{ if(out.length<4&&!out.includes(id)) out.push(id); });
  return out.slice(0,4);
}
function startWorlds(seedOverride){
  try{ S.splashPending='worlds'; }catch(e){}
  applyRandomPatch('월즈 메이저 패치');
  let seeds=(seedOverride&&seedOverride.length?seedOverride:lckSeeds()).slice(0,4);
  if(!seedOverride&&S.msiChampion&&T(S.msiChampion)&&T(S.msiChampion).region==='LCK'&&!seeds.includes(S.msiChampion)){
    seeds=[S.msiChampion,...seeds.slice(0,3)];
  }
  const teams=[...seeds, ...WORLDS_INTL.filter(id=>!seeds.includes(id)&&T(id))];
  const rec={};
  teams.forEach(id=>{ rec[id]={w:0,l:0,opp:[],region:T(id).region}; });
  S.worlds={
    season:S.season, teams, rec, seeds, round:0, rounds:[],
    stage:'swiss', qualified:[], eliminated:[], bracket:null,
    champion:null, runnerUp:null, done:false, userIn:teams.includes(S.userTeam),
  };
  S.phase='worlds';
  worldsPairRound();
  saveGame();
}
function worldsActive(){
  const W=S.worlds; if(!W) return [];
  return W.teams.filter(id=>!W.qualified.includes(id)&&!W.eliminated.includes(id));
}
function worldsPairRound(){
  const W=S.worlds; if(!W) return;
  const active=worldsActive();
  const groups={};
  active.forEach(id=>{ const k=W.rec[id].w+'-'+W.rec[id].l; (groups[k]=groups[k]||[]).push(id); });
  const matches=[];
  Object.keys(groups).forEach(k=>{
    const list=groups[k].sort((a,b)=>teamPowerRaw(T(b))-teamPowerRaw(T(a)));
    const pool=list.slice();
    while(pool.length>=2){
      const a=pool.shift();
      let idx=pool.findIndex(b=>!W.rec[a].opp.includes(b)&&b!==a);
      if(idx<0) idx=0;
      const b=pool.splice(idx,1)[0];
      matches.push({a,b,bo:1,done:false,stage:'swiss',round:W.round+1});
    }
  });
  W.rounds.push({name:'스위스 R'+(W.round+1), swiss:true, matches, done:false, month:'10월'});
  W.round++;
  saveGame();
}
function simWorldsMatch(m){
  if(m.done) return;
  const bo=m.bo||1;
  const r=simAIBo(m.a,m.b,bo);
  m.sa=r.sa; m.sb=r.sb; m.winner=r.sa>r.sb?m.a:m.b; m.done=true;
  const w=m.winner,l=(w===m.a?m.b:m.a);
  const ps=(w===S.userTeam?[]:[]);
  return m;
}
function worldsCloseRound(){
  const W=S.worlds; if(!W) return;
  const rd=W.rounds[W.rounds.length-1];
  rd.matches.forEach(m=>{
    const w=m.winner, l=(w===m.a?m.b:m.a);
    if(!W.rec[w]) return;
    W.rec[w].w++; W.rec[l].l++;
    W.rec[w].opp.push(l); W.rec[l].opp.push(w);
    if(W.rec[w].w>=3&&!W.qualified.includes(w)) W.qualified.push(w);
    if(W.rec[l].l>=3&&!W.eliminated.includes(l)) W.eliminated.push(l);
  });
  rd.done=true;
  if(W.qualified.length>=8){ W.stage='bracket'; buildWorldsBracket(); return; }
  worldsPairRound();
}
function worldsSeedOrder(){
  const W=S.worlds;
  return W.qualified.slice().sort((a,b)=>{
    const ra=W.rec[a], rb=W.rec[b];
    return (rb.w-ra.w)||(ra.l-rb.l)||(teamPowerRaw(T(b))-teamPowerRaw(T(a)));
  });
}
function buildWorldsBracket(){
  const W=S.worlds;
  const s=worldsSeedOrder();
  const mk=(a,b)=>({a,b,bo:5,done:false,stage:'ko'});
  W.bracket={ round:0, rounds:[
    {name:'8강', month:'10월', matches:[mk(s[0],s[7]),mk(s[3],s[4]),mk(s[1],s[6]),mk(s[2],s[5])]},
    {name:'4강', month:'11월', matches:[{a:null,b:null,bo:5,done:false,stage:'ko'},{a:null,b:null,bo:5,done:false,stage:'ko'}]},
    {name:'결승', month:'11월', matches:[{a:null,b:null,bo:5,done:false,stage:'ko'}]},
  ]};
  W.stage='bracket';
  saveGame();
}
function worldsBracketRound(){ const W=S.worlds; return W&&W.bracket?W.bracket.rounds[W.bracket.round]:null; }
function worldsAdvanceBracket(){
  const W=S.worlds; const B=W.bracket; if(!B) return {action:'none'};
  const rd=B.rounds[B.round];
  if(!rd.matches.every(m=>m.done)) return {action:'pending'};
  if(B.round>=B.rounds.length-1){ worldsFinish(); return {action:'done'}; }
  const winners=rd.matches.map(m=>m.winner);
  const next=B.rounds[B.round+1];
  next.matches.forEach((m,i)=>{ m.a=winners[i*2]||null; m.b=winners[i*2+1]||null; });
  B.round++;
  saveGame();
  return {action:'advanced'};
}
function worldsNext(){
  const W=S.worlds; if(!W) return {action:'none'};
  if(W.stage==='swiss'){
    const rd=W.rounds[W.rounds.length-1];
    if(!rd) return {action:'none'};
    const mine=rd.matches.find(m=>!m.done&&(m.a===S.userTeam||m.b===S.userTeam));
    if(mine) return {action:'user', match:mine, roundName:rd.name};
    rd.matches.forEach(m=>{ if(!m.done) simWorldsMatch(m); });
    worldsCloseRound();
    return {action:'advanced'};
  }
  if(W.stage==='bracket'){
    const rd=worldsBracketRound();
    if(!rd) return {action:'none'};
    const mine=rd.matches.find(m=>!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam));
    if(mine) return {action:'user', match:mine, roundName:rd.name};
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b) simWorldsMatch(m); });
    return worldsAdvanceBracket();
  }
  return {action:'none'};
}
function worldsSeries(match,roundName){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const bo=match.bo||1;
  const s=createSeries(oppId,bo,'worlds',{match,roundName});
  s.sides[0]=Math.random()<0.5?'blue':'red';
  saveGame();
  return s;
}
function worldsFinish(){
  const W=S.worlds; if(!W||!W.bracket) return;
  const fin=W.bracket.rounds[2].matches[0];
  W.done=true; W.stage='done';
  W.champion=fin.winner; W.runnerUp=fin.winner===fin.a?fin.b:fin.a;
  S.phase='end';
  S.champion=W.champion; S.runnerUp=W.runnerUp;
  S.worldsHistory=S.worldsHistory||[];
  S.worldsHistory.push({season:S.season, champion:W.champion, runnerUp:W.runnerUp, userTeam:S.userTeam, place:worldsUserPlace()});
  saveGame();
}
function worldsUserPlace(){
  const W=S.worlds; if(!W) return '-';
  if(W.champion===S.userTeam) return '우승';
  if(W.runnerUp===S.userTeam) return '준우승';
  if(!W.userIn) return '진출 실패';
  if(W.bracket){
    for(const rd of W.bracket.rounds){
      for(const m of rd.matches){
        if(m.done&&(m.a===S.userTeam||m.b===S.userTeam)&&m.winner!==S.userTeam) return rd.name+' 탈락';
      }
    }
  }
  return '스위스 탈락';
}
/* 월즈 모드: 정규시즌 없이 바로 롤드컵 */
function startWorldsMode(teamId){
  createState(teamId,{});
  const region=T(teamId).region;
