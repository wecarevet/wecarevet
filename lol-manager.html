/* ---------- offseason: 계약 만료 · 재계약 / FA ---------- */
function startOffseason(){
  const st={players:[],staff:[],aiLog:[]};
  // 계약 1년 차감
  Object.values(S.players).forEach(p=>{
    if(p.retired) return;
    p.contract=(p.contract===undefined?1:p.contract)-1;
  });
  Object.values(S.staffLib||{}).forEach(s=>{ if(s.team) s.contract=(s.contract===undefined?1:s.contract)-1; });
  // 우리 팀 만료자
  const me=myTeam();
  me.roster.forEach(n=>{
    const p=S.players[n];
    if(p && p.contract<=0) st.players.push(n);
  });
  staffAll(S.userTeam).forEach(s=>{ if(s.contract<=0) st.staff.push(s.id); });
  // AI 팀 자동 처리
  Object.values(S.teams).forEach(t=>{
    if(t.id===S.userTeam) return;
    t.roster.slice().forEach(n=>{
      const p=S.players[n]; if(!p||p.contract>0) return;
      const keep=Math.random()<0.68 && t.budget>p.salary*0.5;
      if(keep){ p.contract=ri(1,3); t.budget=Math.round((t.budget-p.salary*0.5)*10)/10; }
      else{
        t.roster=t.roster.filter(x=>x!==n);
        Object.keys(t.lineup).forEach(r=>{ if(t.lineup[r]===n) delete t.lineup[r]; });
        p.team=null; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10;
        st.aiLog.push(p.name+' → FA');
      }
    });
    ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  });
  // AI 스태프
  Object.values(S.staffLib||{}).forEach(s=>{
    if(!s.team||s.team===S.userTeam||s.contract>0) return;
    if(Math.random()<0.7){ s.contract=ri(1,2); }
    else { s.team=null; }
  });
  S.phase='offseason';
  S.offseason=st;
  saveGame();
  renderOffseason();
}
function reSignPlayer(name, years){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  const yearsN=Math.max(1,Math.min(3,Number(years)||2));
  const cost=Math.round(p.salary*(0.35+0.12*yearsN)*10)/10;
  if(t.budget<cost) return {ok:false,msg:'예산 부족 (재계약 비용 '+cost.toFixed(1)+'억)'};
  t.budget=Math.round((t.budget-cost)*10)/10;
  p.contract=yearsN;
  S.offseason.players=(S.offseason.players||[]).filter(n=>n!==name);
  toast('📝 '+name+' 재계약 — '+yearsN+'년 ('+cost.toFixed(1)+'억)');
  saveGame(); renderOffseason(); return {ok:true};
}
function releaseExpiringPlayer(name){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  if(t.roster.length<=6) return {ok:false,msg:'최소 6명은 유지해야 합니다'};
  t.roster=t.roster.filter(n=>n!==name);
  Object.keys(t.lineup).forEach(r=>{ if(t.lineup[r]===name) delete t.lineup[r]; });
  p.team=null; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10; p.contract=0;
  ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  S.offseason.players=(S.offseason.players||[]).filter(n=>n!==name);
  toast('🚪 '+name+' FA 방출 — 이적시장으로 나갑니다');
  saveGame(); renderOffseason(); return {ok:true};
}
function offseasonRenewStaff(id, years){
  const st=S.staffLib[id]; if(!st||st.team!==S.userTeam) return {ok:false,msg:'우리 스태프가 아닙니다'};
  const yearsN=Math.max(1,Math.min(3,Number(years)||2));
  const cost=Math.round(st.salary*0.6*yearsN*10)/10;
  if(myTeam().budget<cost) return {ok:false,msg:'예산 부족 (재계약 '+cost.toFixed(1)+'억)'};
  myTeam().budget=Math.round((myTeam().budget-cost)*10)/10;
  st.contract=yearsN;
  S.offseason.staff=(S.offseason.staff||[]).filter(x=>x!==id);
  toast('🤝 '+st.name+' 재계약 — '+yearsN+'시즌');
  saveGame(); renderOffseason(); return {ok:true};
}
function finishOffseason(){
  if((S.offseason&&S.offseason.players&&S.offseason.players.length)||(S.offseason&&S.offseason.staff&&S.offseason.staff.length)){
    // 남은 만료자는 자동 FA 처리
    (S.offseason.players||[]).slice().forEach(n=>releaseExpiringPlayer(n));
    (S.offseason.staff||[]).slice().forEach(id=>{
      const st=S.staffLib[id]; if(st&&st.team===S.userTeam){
        const cur=S.staff[S.userTeam];
        if(st.role==='HEAD') cur.head=null; else cur.coaches=cur.coaches.filter(x=>x!==id);
        st.team=null; st.contract=0;
      }
    });
    S.offseason={players:[],staff:[],aiLog:(S.offseason.aiLog||[])};
  }
  nextSeason();
}

/* ---------- season transition ---------- */
function nextSeason(){
  S.season++;
  S.week=1; S.phase='regular'; S.results=[]; S.history=[]; S.playoffs=null; S.champion=null;
  S.worlds=null; S.lckChampion=null; S.myExit=null; S.trainingLog=[]; S.offseason=null;
  S.meta={tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}}; S.patches=[]; S.patchNotes=[]; S.patchNo=0;
  S.currentSeries=null; S.seriesMomentum=0;
  Object.values(S.teams).forEach(t=>{t.wins=0;t.losses=0;t.gw=0;t.gl=0;t.form=[];t.pogTotal=0;});
  Object.values(S.players).forEach(p=>{
    p.age++;
    if(p.age<=21){ const k=pickOf(['lane','fight','pool']); p.stats[k]=clamp(p.stats[k]+ri(1,3),40,99); p.stats.macro=clamp(p.stats.macro+ri(0,2),40,99); }
    else if(p.age>=27){ const k=pickOf(['lane','fight','mental']); p.stats[k]=clamp(p.stats[k]-ri(1,2),40,99); }
    p.stats.mental=clamp(p.stats.mental+ri(-1,2),40,99);
    p.form=ri(65,85); p.fatigue=ri(3,15);
    // 시즌마다 특성 재정비 (등급 기준 유지, 나쁜 특성은 일부 자연 극복)
    if(Math.random()<0.3 && p.bad&&p.bad.length) p.bad.pop();
    rollTraits(p,p.grade);
  });
  S.schedule=genSchedule(lckIds());
  saveGame();
  if(myTeam().region!=='LCK'){ startWorlds(); return; }
  renderAll();
}

/* ---------- save ---------- */
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const s=JSON.parse(raw);
    if(!s||!s.teams||!s.userTeam) return false;
    S=s;
    if(!S.meta) S.meta={tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}};
    if(!S.patches) S.patches=[];
    if(!S.pog) S.pog={};
    if(!S.trainingLog) S.trainingLog=[];
    if(!S.worldsHistory) S.worldsHistory=[];
    Object.values(S.players||{}).forEach(p=>{
      if(p&&Array.isArray(p.sigs)) p.sigs=p.sigs.filter(n=>!!CHAMP_MAP[n]);
      if(p&&(!p.good||!p.good.length)) rollTraits(p,p.grade||gradeOfRating(rawOverall(p)));
    });
    return true;
  }catch(e){ return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function deleteSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ============ V3 — 구단 운영 · 스폰서 · 주간 일정 · 마케팅 · 아카데미 ============ */

function clubInit(){
  if(!S) return;
  if(!S.owner) S.owner={name:'박성수', role:'구단주'};
  if(!S.club) S.club={};
  const c=S.club;
  if(typeof c.fanbase!=='number') c.fanbase=52;
  if(typeof c.prestige!=='number'){ const tier=(S.teams[S.userTeam].tier||'A'); c.prestige=({ 'S+':88,'S':82,'A+':74,'A':68,'B+':58,'B':52,'B-':48,'C':42 })[tier]||60; }
  if(typeof c.membership!=='number') c.membership=1.0;
  if(!c.sponsors) c.sponsors={main:null, sub:[]};
  if(!Array.isArray(c.sponsors.sub)) c.sponsors.sub=[];
  if(!c.offers||!c.offers.main||!c.offers.main.length) rollSponsorOffers();
  if(!c.plan) c.plan={};
  if(!Array.isArray(c.academy)||!c.academy.length) c.academy=academyGen();
  if(!c.acadInvest) c.acadInvest='std';
  if(!Array.isArray(c.goods)) c.goods=[];
  if(!Array.isArray(c.meetings)) c.meetings=[];
  if(!Array.isArray(c.news)) c.news=[];
  if(!c.community) c.community=null;
  if(!c.goals) c.goals=ownerGoals();
  if(!c.facts) c.facts={};
  if(!c.carry) c.carry=S.teams[S.userTeam].budget;
  if(!c.trust) c.trust=55;
  if(typeof c.tickWeek!=='number') c.tickWeek=0;
  if(!S.kespa) S.kespa=kespaInit();
  return c;
}
function clubC(){ if(!S) return null; if(!S.club) return clubInit(); return S.club; }

/* ---------- 주간 일정표 ---------- */
function matchDayIndex(){ return (S.week%2===1)?1:4; }
function planGet(name){ const c=clubC(); const p=c.plan[name]; if(p&&p.length===7) return p.slice(); return ['none','none','none','none','none','none','none']; }
function planSet(name,day,k){
  const c=clubC();
  if(typeof day!=='number'||day<0||day>6) return;
  const md=matchDayIndex();
  if(day===md) return;
  const p=planGet(name); p[day]=k; c.plan[name]=p; saveGame();
}
function planSetAll(name,k){ const c=clubC(); const md=matchDayIndex(); const p=planGet(name); for(let i=0;i<7;i++){ if(i!==md) p[i]=k; } c.plan[name]=p; saveGame(); }
function planSetDay(day,k){ if(day===matchDayIndex()) return; startersOfMine().forEach(p=>planSet(p.name,day,k)); saveGame(); }
function planSetWeek(k){ startersOfMine().forEach(p=>planSetAll(p.name,k)); }
function startersOfMine(){ return lineupOf(myTeam()); }
function planAutofill(force){
  const c=clubC(); const md=matchDayIndex();
  const t=myTeam();
  const ordered=t.roster.map(n=>S.players[n]).filter(Boolean);
  ordered.forEach((p,pi)=>{
    const p7=[];
    const needRest=p.fatigue>=55?2:p.fatigue>=35?1:1;
    let restLeft=needRest;
    for(let d=0;d<7;d++){
      if(d===md){ p7.push('match'); continue; }
      if(restLeft>0 && (d===3 || d===6 || d===5-((pi)%2))){ p7.push('rest'); restLeft--; continue; }
      p7.push(restLeft>0?'rest':['scrim','solo','champ','scrim','solo','champ'][ (d+pi)%6 ]);
    }
    // 경기 다음날은 회복
    if(md+1<7) p7[md+1]='rest';
    c.plan[p.name]=p7;
  });
  saveGame();
  if(force) toast('🧑‍🏫 수석코치가 선수단 주간 일정을 편성했습니다');
}
function planIsEmpty(){
  const c=clubC(); return startersOfMine().every(p=>{ const p7=c.plan[p.name]; return !p7||p7.every(k=>k==='none'||k==='match'); });
}

/* ---------- 주간 일정 적용 ---------- */
function clubApplyWeekPlan(){
  const c=clubC(); const t=myTeam();
  const sm=staffTrainingMods(t.id);
  const players=t.roster.map(n=>S.players[n]).filter(Boolean);
  let evDays=0;
  players.forEach(p=>{
    const p7=c.plan[p.name];
    if(!p7||!p7.length) return;
    let rest=0,train=0;
    p7.forEach(k=>{
      if(k==='rest') rest++;
      else if(k==='scrim'){ train++; p.form=clamp(p.form+ri(2,5),10,100); p.fatigue=clamp(p.fatigue+ri(9,13),0,100); if(Math.random()<0.32) p.stats.macro=clamp(p.stats.macro+1,40,99); }
      else if(k==='solo'){ train++; p.form=clamp(p.form+ri(1,4),10,100); p.fatigue=clamp(p.fatigue+ri(5,8),0,100); const key=pickOf(['lane','fight']); p.stats[key]=clamp(p.stats[key]+ri(1,2),40,99); }
      else if(k==='champ'){ train++; p.fatigue=clamp(p.fatigue+ri(6,9),0,100); p.stats.pool=clamp(p.stats.pool+ri(1,2),40,99); }
      else if(k==='event'){ evDays++; p.form=clamp(p.form-ri(0,2),10,100); p.fatigue=clamp(p.fatigue+ri(2,5),0,100); }
    });
    if(rest===0){ p.fatigue=clamp(p.fatigue+12,0,100); p.form=clamp(p.form-6,10,100); traitLog(p.name+' — 휴식 없는 주간으로 컨디션이 급락했습니다','bad'); }
    else if(rest>=2){ p.fatigue=clamp(p.fatigue-6,0,100); p.form=clamp(p.form+3,10,100); }
    if(train>=6&&rest===0) p.fatigue=clamp(p.fatigue+6,0,100);
  });
  if(evDays>0){
    c.fanbase=clamp(c.fanbase+evDays*0.35,0,100);
    c.prestige=clamp(c.prestige+evDays*0.15,0,100);
  }
}

/* ---------- 재정 장부 ---------- */
function clubScale(){ try{ return clamp(teamSalary(myTeam())/44,0.5,8); }catch(e){ return 1; } }
function finLedger(){
  const c=clubC(); const t=myTeam();
  let sp=sponsorAnnualTotal();
  const signed=(c.sponsors.main?1:0)+(c.sponsors.sub||[]).length;
  const slots=Math.max(0,sponsorCapacity()-signed);
  if(slots>0){
    const pool=((c.offers&&c.offers.main)||[]).concat((c.offers&&c.offers.sub)||[]);
    const avg=pool.length?pool.reduce((a,x)=>a+(x.pay||0),0)/pool.length:0;
    sp=Math.round((sp+avg*slots)*10)/10;
  }
  const pay=teamSalary(t);
  const prestigeBonus=Math.round(pay*(c.prestige>=80?0.16:c.prestige>=65?0.11:c.prestige>=50?0.075:0.05)*10)/10;
  const support=Math.round(pay*0.06*10)/10;
  const membership=Math.round(pay*(c.fanbase>=70?0.05:c.fanbase>=50?0.04:0.02)*10)/10;
  const inc={carry:c.carry, sponsor:sp, prestige:prestigeBonus, support:support, membership:membership};
  inc.total=Math.round((inc.carry+inc.sponsor+inc.prestige+inc.support+inc.membership)*10)/10;
  const acad=ACAD_MAP[c.acadInvest]||ACAD_MAP.std;
  const exp={salary:Math.round(teamSalary(t)*10)/10, academy:acad.cost, scouter:1.7, staff:Math.round(staffPayroll(t.id)*10)/10};
  exp.total=Math.round((exp.salary+exp.academy+exp.scouter+exp.staff)*10)/10;
  let expected=Math.round((inc.total-exp.total)*10)/10;
  // 리그 배분금 — 적자 구단이 최소 손익분기 근처에서 시작하도록
  if(expected<2){
    const room=Math.round(pay*0.26*10)/10;
    const add=Math.min(room, Math.round((2-expected)*10)/10);
    if(add>0){ inc.league=add; inc.total=Math.round((inc.total+add)*10)/10; expected=Math.round((inc.total-exp.total)*10)/10; }
  }
  return {inc:inc, exp:exp, expected:expected};
}
function sponsorAnnualTotal(){
  const c=clubC(); let n=0;
  if(c.sponsors.main&&c.sponsors.main.pay) n+=c.sponsors.main.pay;
  (c.sponsors.sub||[]).forEach(s=>{ if(s&&s.pay) n+=s.pay; });
  return Math.round(n*10)/10;
}
function sponsorCapacity(){ return clubC()?3:3; }

function rollSponsorOffers(){
  const c=clubC();
  const cap=sponsorCapacity();
  const pres=c.prestige;
  const mul=(0.7+pres/200)*clubScale();
  const sc=(x)=>Math.round(x*mul*10)/10;
  const mains=SPONSOR_DEFS.filter(s=>s.tier==='main').map(s=>Object.assign({},s,{pay:sc(s.pay),bonus:sc(s.bonus)}));
  const subs=SPONSOR_DEFS.filter(s=>s.tier==='sub').map(s=>Object.assign({},s,{pay:sc(s.pay),bonus:sc(s.bonus)}));
  c.offers={main:mains, sub:subs, cap:cap, rolledAt:S.season+'-'+S.week};
}
function sponsorSign(tier,id,years,terms){
  const c=clubC();
  const pool=(c.offers&&(tier==='main'?c.offers.main:c.offers.sub))||[];
  const def=pool.find(s=>s.id===id);
  if(!def) return {ok:false,msg:'이미 사라진 제안입니다'};
  const cap=sponsorCapacity();
  if(tier==='main'){
    if(c.sponsors.main) return {ok:false,msg:'이미 메인 스폰서가 있습니다'};
  }else{
    if(c.sponsors.sub.length>=Math.max(0,cap-1)) return {ok:false,msg:'서브 스폰서 자리가 없습니다 (명성 '+(c.prestige|0)+' 기준 '+(cap-1)+'개)'};
  }
  // 협상 조건
  let pay=def.pay, bonus=def.bonus;
  if(terms==='base'){ pay=Math.round(def.pay*1.08*10)/10; bonus=Math.round(def.bonus*0.78*10)/10; }
  else if(terms==='bonus'){ pay=Math.round(def.pay*0.93*10)/10; bonus=Math.round(def.bonus*1.3*10)/10; }
  const con={id:def.id, name:def.name, cat:def.cat, color:def.color, logo:def.logo, tier:tier,
    pay:pay, bonus:bonus, goal:def.goal, years:years, left:years, terms:terms||'same', signed:S.season};
  if(tier==='main') c.sponsors.main=con; else c.sponsors.sub.push(con);
  c.offers.main=(c.offers.main||[]).filter(s=>s.id!==id);
  c.offers.sub=(c.offers.sub||[]).filter(s=>s.id!==id);
  newsAdd('sponsor', '🤝 스폰서 계약 — '+def.name+' ('+(tier==='main'?'메인':'서브')+') · '+(con.years)+'년 · 연 '+con.pay.toFixed(1)+'억');
  saveGame();
  return {ok:true,msg:def.name+'와 '+years+'년 계약을 체결했습니다'};
}

  if(c.fanbase>=75&&last&&last.win) tone='big';
  if(c.fanbase<42) tone='drama';
  return tone;
}
function eventTopic(){
  const c=clubC();
  if((c.meetings||[]).length&&c.meetings[c.meetings.length-1].week===S.week) return 'fan';
  if((c.goods||[]).some(g=>g.week<=1&&g.season===S.season)) return 'merch';
  if((c.news||[]).some(n=>n.k==='press'&&n.w===S.week)) return 'press';
  if(S.lastSeries) return 'pog';
  return 'draft';
}
function communityBuild(){
  const c=clubC();
  if(c.commVer!==2){ c.commVer=2; c.community=null; }
  const key='v2-'+S.season+'-'+S.week+'-'+S.phase+'-'+(c.goods.length)+'-'+((c.meetings||[]).length)+'-'+(c.fanbase|0)+'-'+(S.lastSeries?S.lastSeries.score:'')+'-'+S.split+'-'+((c.news||[]).length);
  if(c.community&&c.community.key===key) return c.community;
  const tone=communityTone();
  const pickDistinct=(pool,tag,n)=>{
    const idx=pool.map((_,i)=>i).sort((a,b)=>{
      const ha=hashN(key+'|'+tag+'|'+a), hb=hashN(key+'|'+tag+'|'+b);
      return ha-hb;
    });
    const out=idx.slice(0,Math.min(n,pool.length)).map(i=>pool[i]);
    while(out.length<n&&pool.length) out.push(pool[out.length%pool.length]);
    return out;
  };
  const mk=(t,tag,i)=>({t:t, c:(hashN(key+tag+i+'c')%900+40)});
  const gp=GAL_POOL[tone]||GAL_POOL.calm;
  const ap=(AM_POOL[tone]||AM_POOL.calm);
  const tp=(TW_POOL[tone]||TW_POOL.calm);
  const et=EVENT_POOL[eventTopic()]||EVENT_POOL.draft;
  const pickN=(pool,tag,off)=>{ const i=(hashN(key+'|'+tag)+off*5)%pool.length; return pool[i]; };
  const gall=[mk(pickN(gp,'g0',0),'g',0), mk(pickN(et,'g1',1),'g',1), mk(pickN(OFF_POOL,'g2',1),'g',2)];
  const am=[mk(pickN(ap,'a0',1),'a',0), mk(pickN(et,'a1',2),'a',1), mk(pickN(OFF_POOL,'a2',3),'a',2)];
  const tw=[mk(pickN(tp,'t0',2),'t',0), mk(pickN(et,'t1',4),'t',1), mk(pickN(OFF_POOL,'t2',6),'t',2)];
  const mood=c.fanbase>=72?'여론 뜨거움':c.fanbase>=52?'조용합니다':c.fanbase>=38?'여론 한산·중립':'여론이 나쁩니다';
  c.community={key:key, tone:tone, mood:mood, gall:gall, am:am, tw:tw};
  return c.community;
}

function goodsModels(){
  return lineupOf(myTeam()).map(p=>({name:p.name, role:p.role, pop:Math.round(rawOverall(p)*0.55+p.form*0.45), mult:1+(rawOverall(p)>=85?0.15:rawOverall(p)>=78?0.1:0.05)}));
}
function goodsProject(tierK, modelName){
  const c=clubC(); const g=GOODS_MAP[tierK]||GOODS_MAP.x;
  const m=goodsModels().find(x=>x.name===modelName);
  const mult=m?m.mult:1;
  const base=clamp(0.35+c.fanbase/130,0.3,1.05);
  const scale={x:1,low:1,mid:1,high:0.95,max:0.6}[tierK]||1;
  const rate=clamp(base*scale,0.3,1);
  const rev=Math.round(g.sell*rate*mult*100)/100;
  const profit=Math.round((rev-g.cost)*100)/100;
  return {cost:g.cost, rev:rev, profit:profit, rate:rate, mult:mult, model:m?m.name:null, tier:g.k, tierName:g.n};
}
function goodsCreate(tierK, modelName){
  const c=clubC();
  if(tierK==='x') return {ok:false,msg:'제작량을 선택하세요'};
  const g=GOODS_MAP[tierK]; if(!g) return {ok:false,msg:'제작량 오류'};
  const t=myTeam();
  if(t.budget<g.cost) return {ok:false,msg:'예산 부족 (제작비 '+g.cost+'억)'};
  const pr=goodsProject(tierK, modelName);
  t.budget=Math.round((t.budget-g.cost)*10)/10;
  c.goods.push({tier:tierK, name:g.n, cost:g.cost, plan:pr.rev, model:modelName||null, sold:0, week:0, total:4, at:S.week, season:S.season, done:false});
  c.fanbase=clamp(c.fanbase+1.2,0,100);
  newsAdd('merch','🛍 '+g.n+' 굿즈 제작 — '+(modelName?modelName+' 모델':'모델 없음')+' · 예상 순익 '+pr.profit.toFixed(2)+'억');
  saveGame();
  renderAll();
  return {ok:true,msg:'굿즈 '+g.n+' 제작을 시작했습니다'};
}
function goodsSellTick(){
  const c=clubC(); const t=myTeam();
  let income=0;
  c.goods.forEach(g=>{
    if(g.done) return;
    g.week=(g.week||0)+1;
    const share=g.plan/g.total;
    const jitter=0.85+Math.random()*0.3;
    const amt=Math.round(share*jitter*100)/100;
    income+=amt; g.sold=Math.round((g.sold+amt)*100)/100;
    if(g.week>=g.total){ g.done=true; }
  });
  if(income>0){ t.budget=Math.round((t.budget+income)*10)/10; c.fanbase=clamp(c.fanbase+0.8,0,100); }
  return income;
}

/* ---------- 케스파컵 ---------- */
function kespaInit(){
  const ids=lckIds().slice().sort((a,b)=>teamPowerRaw(T(b))-teamPowerRaw(T(a)));
  const seeds=ids.slice(0,8);
  const shuf=seeds.slice();
  // 1-8, 2-7, 3-6, 4-5
  const pairs=[[shuf[0],shuf[7]],[shuf[3],shuf[4]],[shuf[1],shuf[6]],[shuf[2],shuf[5]]];
  return {
    done:false, started:false, roundIdx:0, prize:0,
    rounds:[{name:'8강', bo:3, matches:pairs.map(x=>({a:x[0],b:x[1],sa:0,sb:0,done:false,winner:null}))}],
  };
}
function kespaRound(){ return S.kespa?S.kespa.rounds[S.kespa.roundIdx]:null; }
function kespaMyMatch(){
  const r=kespaRound(); if(!r) return null;
  return r.matches.find(m=>!m.done&&(m.a===S.userTeam||m.b===S.userTeam))||null;
}
function kespaAdvanceRound(){
  const k=S.kespa; const r=k.rounds[k.roundIdx];
  if(!r||r.matches.some(m=>!m.done)) return;
  const winners=r.matches.map(m=>m.winner);
  if(winners.length===1){ k.done=true; k.prize=winners[0]===S.userTeam?3.0:0.6; return; }
  const next={name:winners.length===4?'4강':winners.length===2?'결승':r.name, bo:3, matches:[]};
  for(let i=0;i<winners.length;i+=2) next.matches.push({a:winners[i],b:winners[i+1],sa:0,sb:0,done:false,winner:null});
  k.rounds.push(next); k.roundIdx++;
}
function kespaSimOthers(){
  const k=S.kespa; const r=kespaRound(); if(!r) return;
  r.matches.forEach(m=>{
    if(m.done) return;
    if(m.a===S.userTeam||m.b===S.userTeam) return;
    const pa=teamPowerRaw(T(m.a))+rnd(-3,3), pb=teamPowerRaw(T(m.b))+rnd(-3,3);
    let a=0,b=0;
    while(a<2&&b<2){ if(Math.random()<sig((pa-pb)/6)) a++; else b++; }
    m.sa=a; m.sb=b; m.done=true; m.winner=a>b?m.a:m.b;
  });
}
function kespaRecord(matchRef, meScore, oppScore){
  const k=S.kespa; const r=kespaRound(); if(!r) return;
  const m=r.matches.find(x=>x.a===matchRef.a&&x.b===matchRef.b)||r.matches.find(x=>!x.done&&(x.a===S.userTeam||x.b===S.userTeam));
  if(!m) return;
  if(m.a===S.userTeam){ m.sa=meScore; m.sb=oppScore; } else { m.sa=oppScore; m.sb=meScore; }
  m.done=true;
  m.winner=m.sa>m.sb?m.a:m.b;
  if(m.winner===S.userTeam && !S.club.facts.kespa4){ S.club.facts.kespa4=true; newsAdd('cup','🏆 케스파컵 4강 진출 달성'); }
  kespaSimOthers();
  kespaAdvanceRound();
  if(k.done){
    S.phase='regular'; S.splashPending='spring'; S.actionApplied=false;
    newsAdd('cup','🏆 케스파컵 종료 — LCK 스프링 개막');
    const t=myTeam();
    if(k.prize) t.budget=Math.round((t.budget+k.prize)*10)/10;
    S.club.prestige=clamp(S.club.prestige+(k.rounds[k.rounds.length-1].matches[0].winner===S.userTeam?6:2),0,100);
    newsAdd('cup','🏆 케스파컵 종료 — 우승 '+(k.rounds[k.rounds.length-1].matches[0].winner===S.userTeam?'우리 팀! 상금 3.0억':T(k.rounds[k.rounds.length-1].matches[0].winner).name));
  }
  saveGame();
}

/* ---------- 시즌 결산 ---------- */
function clubSeasonSettle(){
  const c=clubC(); const t=myTeam();
  const led=finLedger();
  const net=led.expected;
  t.budget=Math.round((t.budget+Math.max(-8,Math.min(12,net*0.35)))*10)/10;
  // 목표 보너스
  const goals=c.goals||[];
  let bonus=0, trustDelta=0;
  goals.forEach(g=>{
    let ok=false;
    if(g.k==='lck') ok=!!c.facts.lckWin;
    else if(g.k==='final') ok=!!c.facts.final;
    else if(g.k==='kespa') ok=!!c.facts.kespa4;
    else if(g.k==='worlds') ok=!!c.facts.worlds;
    else if(g.k==='top3') ok=!!c.facts.top3;
    if(ok){ bonus+=g.bonus; }
    else if(g.must){ trustDelta+=g.trust; }
  });
  if(bonus>0) t.budget=Math.round((t.budget+bonus*0.15)*10)/10;
  // 스폰서 보너스
  const all=[c.sponsors.main].concat(c.sponsors.sub||[]).filter(Boolean);
  all.forEach(s=>{ if(sponsorGoalMet(s.goal)){ t.budget=Math.round((t.budget+s.bonus*0.1)*10)/10; } });
  c.trust=clamp((c.trust||55)+trustDelta+Math.round((t.wins-t.losses)*0.4),0,100);
  // 다음 시즌 준비
  c.carry=t.budget;
  const next=[];
  [c.sponsors.main].concat(c.sponsors.sub||[]).forEach(s=>{ if(!s) return; s.left=(s.left||1)-1; if(s.left>0) next.push(s); });
  c.sponsors={main:null, sub:[]};
  next.forEach(s=>{ if(s.tier==='main'&&!c.sponsors.main) c.sponsors.main=s; else c.sponsors.sub.push(s); });
  c.facts={};
  c.goals=ownerGoals();
  c.academy=academyGen();
  rollSponsorOffers();
  newsAdd('club','📅 시즌 결산 — 목표 보너스를 정산했습니다');
  saveGame();
}

function autoDraftChoose(kind){
  const q=autoDraftQuality();
  const pool=dAvailable();
  if(!pool.length) return null;
  if(kind==='ban'){
    const opp=T(D.oppId);
    const sigs=[];
    ROLES.forEach(r=>{ const p=S.players[opp.lineup[r]]; if(p&&p.sigs) p.sigs.forEach(n=>sigs.push(n)); });
    const scored=pool.map(ch=>({n:ch.n, s:(sigs.indexOf(ch.n)>=0?9*q:0)+champTier(ch)*1.1+Math.random()*9*(1-q)}));
    scored.sort((a,b)=>b.s-a.s);
    return scored[0].n;
  }
  const myS=dMySigs();
  const myPicked=typeof dMyPicks==='function'?dMyPicks():[];
  const covered={};
  myPicked.forEach(n=>{ const cc=CHAMP_MAP[n]; if(cc&&cc.r) cc.r.forEach(r=>{covered[r]=1;}); });
  const scored=pool.map(ch=>{
    let best=-999;
    if(ch.r&&!covered[ch.r[0]]) best+=26;
    else if(ch.r&&covered[ch.r[0]]) best-=14;
    ROLES.forEach(r=>{
      const p=S.players[myTeam().lineup[r]]; if(!p) return;

    return {n:ch.n, s:best+champTier(ch)*0.6+Math.random()*11*(1-q)};

function simAiStats(teamId,win,killsFor,killsAgainst){

    statAdd(p.name,share,d,a,dpm);

  // 죽음 총합 보정

    const factor=killsAgainst/Math.max(1,Math.round(killsAgainst*0.98));

    const rows=(side==='me'?ps.me:ps.opp)||[];
    rows.forEach(x=>{
      if(!x||!x.name||!S.players[x.name]) return;

    });
  });
}

function statBoards(){
  const st=statsInit();
  const arr=Object.keys(st).map(n=>({name:n,r:st[n],p:S.players[n]})).filter(o=>o.p&&(o.r.g||0)>0);
  const by=(fn)=>arr.slice().sort(fn).filter(o=>o.p);
  return {
    kda:by((a,b)=>statKDA(b.r)-statKDA(a.r)).slice(0,10),
    kills:by((a,b)=>(b.r.k||0)-(a.r.k||0)).slice(0,10),
    assists:by((a,b)=>(b.r.a||0)-(a.r.a||0)).slice(0,10),
    dpm:by((a,b)=>(b.r.dpm||0)-(a.r.dpm||0)).slice(0,10),
    pog:by((a,b)=>((S.pog[b.name]||0)-(S.pog[a.name]||0))).slice(0,10),
  };
}
/* ---------- 어워드 ---------- */
function computeAwards(split){
  const st=statsInit();
  const splitName=split==='spring'?'스프링':'서머';
  const entries=Object.keys(st).map(n=>({name:n,r:st[n],p:S.players[n]})).filter(o=>o.p);
  const games=(o)=>o.r.g||0;
  const score=(o)=>((o.r.k||0)*1.1+(o.r.a||0)*0.9-Math.max(0,(o.r.d||0))*0.6)/Math.max(1,games(o))+(S.pog[o.name]||0)/400+rawOverall(o.p)/100;
  const mvp=entries.slice().sort((a,b)=>score(b)-score(a))[0];
  const team=(n)=>{ const p=S.players[n]; const t=p&&p.team?T(p.team):null; return t?t.tag:'FA'; };
  const awards=[];
  if(mvp) awards.push({k:'mvp',title:splitName+' 정규시즌 MVP',name:mvp.name,team:team(mvp.name),val:Math.round(score(mvp)*100)/100});
  // 파이널 MVP — 결승에서 POG를 가장 많이 받은 선수
  const fin=(S.playoffs&&S.playoffs.rounds&&S.playoffs.rounds[2]&&S.playoffs.rounds[2].matches[0])||null;
  if(fin&&fin.winner){
    const wteam=T(fin.winner);
    const ps=ROLES.map(r=>S.players[wteam.lineup[r]]).filter(Boolean);
    const fm=ps.slice().sort((a,b)=>(S.pog[b.name]||0)-(S.pog[a.name]||0))[0];
    if(fm) awards.push({k:'fmvp',title:splitName+' 파이널 MVP',name:fm.name,team:wteam.tag,val:null});
  }
  // All-LCK 1/2/3팀 (포지션별 상위 3)
  const allLck=[];
  ROLES.forEach(r=>{
    const list=entries.filter(o=>o.p.role===r).sort((a,b)=>score(b)-score(a)).slice(0,3);
    list.forEach((o,i)=>{ allLck.push({teamNo:i+1,role:r,name:o.name,team:team(o.name),val:Math.round(score(o)*100)/100}); });
  });
  awards.push({k:'alllck',title:'All-LCK 팀',list:allLck});
  // 지표 1위
  const boards=statBoards();
  const leaders=[
    ['KDA왕',boards.kda[0],o=>statKDA(o.r)],
    ['킬왕',boards.kills[0],o=>(o.r.k||0)],
    ['어시왕',boards.assists[0],o=>(o.r.a||0)],
    ['DPM왕',boards.dpm[0],o=>(o.r.dpm||0)],
    ['POG왕',boards.pog[0],o=>(S.pog[o.name]||0)],
  ].filter(x=>x[1]).map(x=>({k:'leader',title:x[0],name:x[1].name,team:team(x[1].name),val:x[2](x[1])}));
  const rec={season:S.season, split:split, at:S.week, awards:awards, leaders:leaders};
  S.awards.push(rec);
  // 트로피 적립
  awards.forEach(a=>{
    if(a.name) addTrophy(a.name,a.title,S.season,split);
    if(a.k==='alllck'&&a.list) a.list.forEach(x=>addTrophy(x.name,'All-LCK '+x.teamNo+'팀',S.season,split));
  });
  leaders.forEach(l=>addTrophy(l.name,l.title,S.season,split));
  const champId=split==='spring'?S.springChampion:S.summerChampion;
  if(champId){
    const ct=T(champId);
    ROLES.map(r=>S.players[ct.lineup[r]]).filter(Boolean).forEach(p=>addTrophy(p.name,'LCK '+splitName+' 우승',S.season,split));
  }
  if(mvp&&S.teams[mvp.p.team]===myTeam()) S.clubTrophies.push({t:splitName+' MVP',n:mvp.name,s:S.season});
  saveGame();
  return rec;
}
function addTrophy(name,title,season,split){
  if(!name||!S.players[name]) return;
  S.trophies=S.trophies||{};
  S.trophies[name]=S.trophies[name]||[];
  if(!S.trophies[name].some(t=>t.title===title&&t.season===season&&t.split===split))
    S.trophies[name].push({title:title,season:season,split:split});
}
function playerTrophies(name){
  const t=(S.trophies&&S.trophies[name])||[];
  const p=S.players[name];
  const out=t.slice();
  if(p&&p.team){
    if(S.lckChampion===p.team) out.push({title:'LCK 우승',season:S.season,split:S.playoffSplit||S.split});
    if(S.msiChampion===p.team) out.push({title:'MSI 우승',season:S.season});
    if(S.ewcChampion===p.team) out.push({title:'EWC 우승',season:S.season});
    if(S.champion===p.team) out.push({title:'월드 챔피언십',season:S.season});
  }
  return out;
}

/* ============ AUDIO — Web Audio 밴픽 BGM & 효과음 (외부 파일 0) ============ */
const SND={ctx:null, master:null, bgmGain:null, on:true, playing:null, timer:null, step:0, nextAt:0, ready:false};
function sndCtx(){
  if(SND.ctx) return SND.ctx;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    SND.ctx=new AC();
    SND.master=SND.ctx.createGain(); SND.master.gain.value=0.9; SND.master.connect(SND.ctx.destination);
    SND.bgmGain=SND.ctx.createGain(); SND.bgmGain.gain.value=0.0; SND.bgmGain.connect(SND.master);
    SND.ready=true;
  }catch(e){ SND.ready=false; }
  return SND.ctx;
}
function sndWake(){
  const c=sndCtx();
  if(c&&c.state==='suspended'){ try{ c.resume(); }catch(e){} }
}
document.addEventListener('pointerdown',sndWake,{passive:true});
document.addEventListener('keydown',sndWake,{passive:true});
function sndTone(freq,dur,type,vol,when,detune){
  const c=sndCtx(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(detune) o.detune.value=detune;
  const t0=(when||c.currentTime);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.15),t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(SND.master);
  o.start(t0); o.stop(t0+dur+0.02);
}
function sndNoise(dur,vol,when,filterHz){
  const c=sndCtx(); if(!c) return;
  const len=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,len,c.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*(1-i/len); }
  const src=c.createBufferSource(); src.buffer=buf;
  const g=c.createGain(); g.gain.value=vol||0.2;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=filterHz||1800; f.Q.value=0.8;
  src.connect(f); f.connect(g); g.connect(SND.master);
  const t0=when||c.currentTime;
  g.gain.setValueAtTime(vol||0.2,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.start(t0); src.stop(t0+dur+0.02);
}
function sfx(kind){
  if(!SND.on) return; const c=sndCtx(); if(!c) return; sndWake();
  const t=c.currentTime;
  if(kind==='ban'){
    sndTone(180,0.16,'sawtooth',0.20,t);
    sndTone(120,0.22,'square',0.16,t+0.04);
    sndNoise(0.16,0.16,t,'1200');
    sndTone(70,0.26,'sine',0.20,t+0.02);
  }else if(kind==='pick'){
    [660,880,1320].forEach((f,i)=>sndTone(f,0.14,'triangle',0.13,t+i*0.055));
    sndNoise(0.08,0.06,t+0.02,'3200');
  }else if(kind==='lock'){
    sndTone(523,0.10,'triangle',0.16,t);
    sndTone(784,0.18,'triangle',0.16,t+0.08);
    sndTone(1046,0.22,'sine',0.10,t+0.14);
  }else if(kind==='start'){
    sndNoise(0.5,0.18,t,'700');
    [110,165,220,330].forEach((f,i)=>sndTone(f,0.42,'sawtooth',0.11,t+i*0.03));
    sndTone(55,0.7,'sine',0.20,t);
  }else if(kind==='win'){
    const seq=[523,659,784,1046,1318];
    seq.forEach((f,i)=>sndTone(f,0.34,'triangle',0.15,t+i*0.11));
    sndTone(261,0.9,'sine',0.10,t);
  }else if(kind==='lose'){
    [440,392,330,262].forEach((f,i)=>sndTone(f,0.4,'sine',0.13,t+i*0.14));
  }else if(kind==='tick'){
    sndTone(1100,0.04,'square',0.05,t);
  }else if(kind==='click'){
    sndTone(880,0.05,'triangle',0.06,t);
  }else if(kind==='alert'){
    sndTone(880,0.12,'square',0.10,t);
    sndTone(660,0.16,'square',0.10,t+0.12);
  }
}
/* ---- BGM: 8분음표 시퀀서 ---- */
const BGM_PAT={
  /* A단조 긴장감 루프 */
  bass:[55,55,82.4,55, 55,55,73.4,55, 65.4,65.4,98,65.4, 49,49,73.4,49],
  lead:[440,0,523,0, 659,0,523,0, 587,0,494,0, 392,0,440,0],
  chord:[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,196,246.9]],
};
function bgmStart(mode){
  if(!SND.on) return;
  if(typeof bgmStartCustom==='function'&&bgmStartCustom(mode)){ sndWake(); return; }
  stopCustomBgm();
  const c=sndCtx(); if(!c) return;
  sndWake();
  if(SND.playing===mode) return;
  SND.playing=mode; SND.step=0; SND.nextAt=c.currentTime+0.06;
  try{ SND.bgmGain.gain.cancelScheduledValues(c.currentTime); SND.bgmGain.gain.setValueAtTime(0.0001,c.currentTime); SND.bgmGain.gain.linearRampToValueAtTime(mode==='draft'?0.55:0.35,c.currentTime+0.6); }catch(e){}
  if(SND.timer) clearInterval(SND.timer);
  const spb=60/(mode==='draft'?104:96)/2;  // 8분음표
  SND.timer=setInterval(()=>{ bgmSchedule(spb,mode); },70);
}
function bgmSchedule(spb,mode){
  const c=SND.ctx; if(!c||!SND.playing) return;
  while(SND.nextAt<c.currentTime+0.25){
    const i=SND.step%16, t=SND.nextAt;
    const bass=BGM_PAT.bass[i];
    // 베이스
    const o=c.createOscillator(), g=c.createGain();
    o.type='sawtooth'; o.frequency.value=bass;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.10,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+spb*0.9);
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420;
    o.connect(f); f.connect(g); g.connect(SND.bgmGain);
    o.start(t); o.stop(t+spb*1.1);
    // 하이햇
    if(i%2===0){
      const len=Math.max(1,Math.floor(c.sampleRate*0.05));
      const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0);
      for(let n=0;n<len;n++) d[n]=(Math.random()*2-1)*(1-n/len);
      const src=c.createBufferSource(); src.buffer=buf;
      const hg=c.createGain(); hg.gain.value=i%4===0?0.055:0.03;
      const hf=c.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=6500;
      src.connect(hf); hf.connect(hg); hg.connect(SND.bgmGain);
      src.start(t); src.stop(t+0.06);
    }
    // 리드 (밴픽 모드에서만)
    if(mode==='draft'&&BGM_PAT.lead[i]){
      const lo=c.createOscillator(), lg=c.createGain();
      lo.type='triangle'; lo.frequency.value=BGM_PAT.lead[i];
      lg.gain.setValueAtTime(0.0001,t);
      lg.gain.exponentialRampToValueAtTime(0.045,t+0.02);
      lg.gain.exponentialRampToValueAtTime(0.0001,t+spb*1.6);
      lo.connect(lg); lg.connect(SND.bgmGain);
      lo.start(t); lo.stop(t+spb*1.8);
    }
    // 패드 (2마디마다)
    if(i%8===0){
      const ch=BGM_PAT.chord[(Math.floor(SND.step/8))%4];
      ch.forEach((fq,ci)=>{
        const po=c.createOscillator(), pg=c.createGain();
        po.type='sine'; po.frequency.value=fq; po.detune.value=(ci-1)*6;
        pg.gain.setValueAtTime(0.0001,t);
        pg.gain.linearRampToValueAtTime(0.022,t+0.35);
        pg.gain.linearRampToValueAtTime(0.0001,t+spb*7.6);
        po.connect(pg); pg.connect(SND.bgmGain);
        po.start(t); po.stop(t+spb*8);
      });
    }
    SND.nextAt+=spb; SND.step++;
  }
}
function bgmStop(){
  SND.playing=null;
  try{ stopCustomBgm(); }catch(e){}
  if(SND.timer){ clearInterval(SND.timer); SND.timer=null; }
  const c=SND.ctx;
  if(c&&SND.bgmGain){
    try{ SND.bgmGain.gain.cancelScheduledValues(c.currentTime); SND.bgmGain.gain.setValueAtTime(SND.bgmGain.gain.value,c.currentTime); SND.bgmGain.gain.linearRampToValueAtTime(0.0001,c.currentTime+0.25); }catch(e){}
  }
}

const BGMST={draft:{mode:'synth',yt:'',data:'',name:''},worlds:{mode:'synth',yt:'',data:'',name:''}};
let YTEL=null, FILEEL=null;
function bgmLoad(){ try{ const v=JSON.parse(localStorage.getItem('lckManager.bgm')||'null'); if(v&&v.draft&&v.worlds){ BGMST.draft=v.draft; BGMST.worlds=v.worlds; } }catch(e){} }

function ytId(url){
  if(!url) return '';
  const m=String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{6,}$/.test(url)) return url;
  return '';
}
function stopCustomBgm(){
  if(YTEL){ try{ YTEL.remove(); }catch(e){} YTEL=null; }
  if(FILEEL){ try{ FILEEL.pause(); FILEEL.currentTime=0; }catch(e){} if(FILEEL.parentElement) FILEEL.parentElement.removeChild(FILEEL); FILEEL=null; }
}
function playCustomBgm(ctxKey){
  const c=BGMST[ctxKey]; if(!c||c.mode==='synth') return false;
  if(c.mode==='yt'){
    const id=ytId(c.yt); if(!id) return false;
    stopCustomBgm();
    YTEL=document.createElement('iframe');
    YTEL.setAttribute('allow','autoplay');
    YTEL.setAttribute('title','custom bgm');
    YTEL.style.cssText='position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0';
    YTEL.src='https://www.youtube.com/embed/'+id+'?autoplay=1&loop=1&playlist='+id+'&controls=0&modestbranding=1&playsinline=1';
    document.body.appendChild(YTEL);
    return true;
  }
  if(c.mode==='file'&&c.data){
    stopCustomBgm();
    FILEEL=document.createElement('audio');
    FILEEL.src=c.data; FILEEL.loop=true; FILEEL.volume=0.85;
    FILEEL.style.cssText='display:none';
    document.body.appendChild(FILEEL);
    const pr=FILEEL.play();
    if(pr&&pr.catch) pr.catch(()=>{});
    return true;
  }
  return false;
}
function bgmStartCustom(mode){
  const ctxKey=(mode==='worlds'||mode==='final')?'worlds':'draft';
  if(playCustomBgm(ctxKey)){ SND.playing='custom'; return true; }
  return false;
}

function renderAll(){
  if(!S){ show('title'); renderTitle(); return; }

  if(S.phase==='offseason'){ show('offseason'); renderOffseason(); return; }
  if(S.phase==='worlds'){ show('worlds'); renderWorlds(); return; }

/* ---------- 팀 로고 · 선수 아바타 (inline SVG) ---------- */
function _shade(hex,amt){
  const h=(hex||'#25e0ff').replace('#','');
  const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function teamLogoSVG(team,size){
  if(!team) return '';
  const c=team.color||'#25e0ff';
  const light=_shade(c,40), dark=_shade(c,-70);
  const uid='lg'+String(team.id).replace(/[^A-Za-z0-9]/g,'');
  const v=(nameHash(team.id)%3);
  const motif=v===0?'<path d="M0 30 L40 10 L40 18 L0 38 Z" fill="#fff" opacity=".10"/>'
    :v===1?'<circle cx="34" cy="8" r="9" fill="#fff" opacity=".12"/>'
    :'<path d="M0 8 L40 8 L40 14 L0 26 Z" fill="#fff" opacity=".10"/>';
  return `<svg class="tlogo" width="${size||34}" height="${size||34}" viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${light}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${dark}"/>
    </linearGradient></defs>
    <path d="M20 2 L36 7 V20 C36 30 28 36 20 38 C12 36 4 30 4 20 V7 Z" fill="url(#${uid})" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>
    ${motif}
    <text x="20" y="24" text-anchor="middle" font-family="Pretendard,system-ui,sans-serif" font-size="${String(team.tag).length>3?8:10}" font-weight="900" fill="#fff" letter-spacing="-.3">${esc(team.tag)}</text>
  </svg>`;
}
function pAvatarSVG(p,size){
  if(!p) return '';
  const team=p.team&&S&&S.teams?S.teams[p.team]:null;
  const c=team?team.color:'#5d6884';

  const roleIc=({TOP:'🗡',JGL:'🌿',MID:'✨',ADC:'🏹',SUP:'🛡'})[p.role]||'✦';

    <path d="M15.5 15 C15.5 9 32.5 9 32.5 15" fill="none" stroke="#0b1220" stroke-width="2.4"/>
    <rect x="14.5" y="14" width="3" height="6" rx="1.5" fill="#0b1220"/>

function calendarHTML(){

  const nowIdx=Math.max(0,order.indexOf(now));
  return `<div class="card tight"><div class="cal">
    ${CAL_STAGES.map(c=>{

/* ---------- hub bindings ---------- */
function bindHub(){
  const c=$('view-hub');
  c.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ S.weekAction=b.dataset.act; renderHub(); });
  c.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{ S.weekActionTarget=b.dataset.focus; renderHub(); });
  const gm=$('goMatch'); if(gm) gm.onclick=()=>prepareMatch();
  const rs=$('resumeSeries'); if(rs) rs.onclick=()=>{ if(S.currentSeries){ if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries);} };
  const sp=$('seePatch'); if(sp) sp.onclick=()=>{ if(S.patchNotes&&S.patchNotes[0]) showPatchNote(S.patchNotes[0]); };
  const gs=$('goStaff'); if(gs) gs.onclick=()=>{TAB='staff';renderHub();};
  const os=$('openStaffTab'); if(os) os.onclick=()=>{TAB='staff';renderHub();};
  const oe=$('openEditor'); if(oe) oe.onclick=()=>openPlayerEditor(null);
  const vw=$('viewWorlds'); if(vw) vw.onclick=()=>{ if(S.worlds){ show('worlds'); renderWorlds(); } };
  c.querySelectorAll('[data-player]').forEach(el=>el.onclick=()=>openPlayer(el.dataset.player));
  c.querySelectorAll('[data-sign]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const sel=c.querySelector('[data-years="'+b.dataset.sign.replace(/"/g,'\\"')+'"]');
    const years=sel?Number(sel.value):2;
    const r=signFA(b.dataset.sign,years); if(!r.ok) toast(r.msg);
  });
  c.querySelectorAll('[data-release]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); if(confirm(b.dataset.release+' 선수를 방출할까요?')){const r=releasePlayer(b.dataset.release); if(!r.ok) toast(r.msg);}});
  c.querySelectorAll('[data-hire]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const sel=c.querySelector('[data-styears="'+b.dataset.hire+'"]');
    const seasons=sel?Number(sel.value):2;
    const r=hireStaff(b.dataset.hire,seasons); if(!r.ok) toast(r.msg);
  });
  c.querySelectorAll('[data-renew]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); const r=renewStaff(b.dataset.renew); if(!r.ok) toast(r.msg);});
  c.querySelectorAll('[data-fire]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); if(confirm('이 스태프와 계약을 해지할까요? (위약금 발생)')){const r=fireStaff(b.dataset.fire); if(!r.ok) toast(r.msg);}});
  c.querySelectorAll('[data-subgo]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const role=b.dataset.subgo;
    const sel=c.querySelector('[data-subsel="'+role+'"]');
    if(sel){ const r=setSeriesSub(role,sel.value); if(r&&!r.ok) toast(r.msg); else renderHub(); }
  });
  const cq=$('codexQ'); if(cq) cq.oninput=()=>{ CODEX.q=cq.value; renderHub(); const el=$('codexQ'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} };
  c.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ CODEX.cat=b.dataset.cat; renderHub(); });
  c.querySelectorAll('[data-patchview]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const rec=(S.patchNotes||[]).find(x=>String(x.no)===String(b.dataset.patchview)); if(rec) showPatchNote(rec); });
  c.querySelectorAll('[data-editstaff]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); openStaffEditor(b.dataset.editstaff);});
}
function prepareMatch(){
  if(S.currentSeries && !S.currentSeries.done){
    if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries);
    return;
  }
  if(!S.actionApplied) applyWeekAction();
  const opp=weekOpponent(); if(!opp) return;
  const s=createSeries(opp.oppId,3,'regular',{});
  saveGame();
  startDraft(s);
}

/* ---------- 특성/성향 설명 카드 ---------- */
function effectLines(t){
  const e=t.e||{}; const out=[];
  const map={lane:'라인전',fight:'한타',macro:'운영',obj:'오브젝트',mental:'멘탈',pool:'챔프폭',vision:'시야',risk:'리스크'};
  Object.keys(map).forEach(k=>{ if(e[k]) out.push(map[k]+' '+(e[k]>0?'+':'')+e[k].toFixed(1)); });
  if(t.late) out.push('후반(25분+) 추가 효과');
  if(t.early) out.push('초반(12분-) 추가 효과');
  return out;
}
function showTraitCard(kind,id){
  let html='';

    if(x.vol) lines.push('폼 기복 x'+x.vol);
    if(x.growth) lines.push('성장 배율 x'+x.growth);
    if(x.peak) lines.push('최고 컨디션 성능 x'+x.peak);
    if(x.mental) lines.push('멘탈 저항 '+(x.mental>0?'+':'')+x.mental);

    html=`<div class="tiny" style="letter-spacing:.16em;font-weight:900;color:#ffd9a8">PERSONALITY</div>
      <h3 style="font-size:19px;margin:4px 0 4px">${x.icon} ${esc(x.n)}</h3>
      <div class="tiny" style="line-height:1.5">${esc(x.d)}</div>

  const tl=t.closest('#openTL');
  if(tl&&M){ openTacticDrawer(); return; }

function weekStrip(){
  const md=matchDayIndex();
  const base=new Date(2026,0,1);
  const wk=S.week;

  const labels=['결과 분석','경기','회복 훈련','스크림','경기','미디어 데이','휴식'];
  for(let i=0;i<4;i++){
    const d=(wk*2+i*2)%28+1;

    out.push({date:'1/'+(d)+'('+DAYS[dayIdx]+')', label:i===0?'경기':i===2?'경기':'스크림', kind:i%2===0?'match':'','idx':dayIdx});

}

/* ---------- bindings ---------- */
function bindHub(){
  const c=$('view-hub'); if(!c) return;
  if(c._bound) return;
  c._bound=true;
  c.addEventListener('click',ev=>{
    const el=ev.target.closest('[data-a]'); if(!el) return;
    ev.preventDefault(); ev.stopPropagation();
    hubAction(el.dataset.a,el.dataset.v,el);
  });
  c.addEventListener('input',ev=>{
    if(ev.target&&ev.target.id==='codexQ'){
      CODEX.q=ev.target.value; renderHub();
      const el=$('codexQ'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} }
    }
  });
}
function prepareMatchV3(){
  if(S.phase==='kespa'){ kespaBegin(); return; }
  if(S.currentSeries && !S.currentSeries.done){ prepareMatch(); return; }
  prepareMatch();
}
function hubAction(a,v,el){
  if(!S) return;
  clubInit();
  if(a==='noop') return;
  try{ if(typeof hubActionMkt==='function'&&hubActionMkt(a,v,el)) return; }catch(e){}
  if(a==='tab'){
    if(!v){ return; }
    const parts=v.split(':');
    TAB=parts[0];
    if(parts[1]){
      if(TAB==='club') CLUB_TAB=parts[1];
      if(TAB==='marketing') MK_TAB=parts[1];
      if(TAB==='league') LG_TAB=parts[1];
      if(TAB==='records') REC_TAB=parts[1];
    }
    sfx('click'); renderHub(); return;
  }
  if(a==='advance'){ prepareMatchV3(); return; }
  if(a==='match'){ prepareMatchV3(); return; }
  if(a==='resume'){ if(S.currentSeries){ if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries); } return; }
  if(a==='player'){ openPlayer(v); return; }
  if(a==='setstarter'){ const parts=String(v||'').split(':'); const r=setStarter(parts[0],parts[1]); closeModal(); renderHub(); return; }
  if(a==='editor'){ openPlayerEditor(null); return; }
  if(a==='plan'){ planSet(v,Number(el.dataset.d),cyclePlan(planGet(v)[Number(el.dataset.d)])); renderHub(); return; }
  if(a==='pland'){ openPlanPicker(Number(v),null); return; }
  if(a==='planrow'){ openPlanPicker(null,v); return; }
  if(a==='planweek'){ openPlanPicker(null,'ALL'); return; }
  if(a==='coach'){ planAutofill(true); renderHub(); return; }
  if(a==='invest'){ academyInvestSet(v); return; }
  if(a==='callup'){ const r=academyCallup(Number(v)); toast(r.msg); if(r.ok) renderHub(); return; }
  if(a==='acadsign'){ academySign(); return; }
  if(a==='hire'){ const sel=$('view-hub').querySelector('[data-styears="'+v+'"]'); const n=sel?Number(sel.value):2; const r=hireStaff(v,n); if(!r.ok) toast(r.msg); else { toast('코치를 영입했습니다'); renderHub(); } return; }
  if(a==='sppick'){ const s=SPONSOR_MAP[v]; if(s){ negot={years:2,terms:'same',id:v}; toast(s.name+' — 협상 조건을 조정하세요'); renderHub(); } return; }
  if(a==='spyears'){ negot.years=Number(v); renderHub(); return; }
  if(a==='spterms'){ negot.terms=v; renderHub(); return; }
  if(a==='spsign'){
    const c=clubC();
    const def=negoTarget(); if(!def) return;
    const tier=(c.sponsors.main?'sub':'main');
    const r=sponsorSign(tier,def.id,negot.years,negot.terms);
    toast(r.msg);
    if(r.ok){ negot={years:2,terms:'same',id:null}; renderHub(); }
    return;
  }
  if(a==='spnext'){
    const c=clubC(); const d=negoTarget();
    if(d){ c.offers.main=(c.offers.main||[]).filter(x=>x.id!==d.id); c.offers.sub=(c.offers.sub||[]).filter(x=>x.id!==d.id); }
    negot={years:2,terms:'same',id:null}; renderHub(); return;
  }
  if(a==='newsread'){ newsReadAll(); renderHub(); return; }
  if(a==='board'){ STAT_BOARD=v; renderHub(); return; }
  if(a==='pledge'){ introApplyPledge(v); return; }
  if(a==='intro'){ introNext(v); return; }
  if(a==='cat'){ CODEX.cat=v; renderHub(); return; }
  if(a==='patchview'){ const rec=(S.patchNotes||[]).find(x=>String(x.no)===String(v)); if(rec) showPatchNote(rec); return; }
  if(a==='trait'){ const parts=String(v||'').split(':'); showTraitCard(parts[0]||'good',parts[1]||''); return; }
  if(a==='press'){ pressAnswer(v); return; }
  if(a==='pressauto'){ pressAuto(); return; }
  if(a==='go'){ if(v){ TAB=v; renderHub(); } return; }
}
function cyclePlan(k){
  const order=['none','scrim','solo','champ','rest','event'];
  const i=order.indexOf(k); return order[(i<0?0:i+1)%order.length];
}
function openPlanPicker(day,name){
  const acts=PLAN_ACTIONS.filter(a=>a.k!=='none');
  $('modal').innerHTML=`<div class="modal-wrap" id="modalWrap"><div class="modal">
    <div class="grab"></div>
    <h3 style="font-size:16px;margin-bottom:8px">${name==='ALL'?'한 주 통째로':name?esc(name)+' · '+DAYS[day]:DAYS[day]+'요일 전원'}</h3>
    <div class="stack" style="gap:6px">
      ${acts.map(a=>`<button class="pick-act ${a.k}" data-pick="${a.k}"><span>${a.ic}</span><b>${a.n}</b><em>${a.d}</em></button>`).join('')}
      <button class="pick-act none" data-pick="none"><span>·</span><b>미설정</b><em>아무 일도 없습니다</em></button>
    </div>
    <div style="height:10px"></div>
    <button class="btn ghost block" id="modalClose">닫기</button>
  </div></div>`;
  $('modal').classList.remove('hidden');
  $('modal').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.pick;
    if(name==='ALL') planSetWeek(k);
    else if(name) planSetAll(name,k);
    else planSetDay(day,k);
    closeModal(); renderHub();
  });
  $('modalClose').onclick=closeModal;
  $('modalWrap').onclick=e=>{ if(e.target.id==='modalWrap') closeModal(); };
}

    </div>`;

    <div style="height:12px"></div>
    <button class="btn ghost block" id="modalClose">닫기</button>
  </div></div>`;

  $('modalWrap').onclick=e=>{ if(e.target.id==='modalWrap') closeModal(); };
  const sa=$('sndAll'); if(sa) sa.onclick=()=>{ sndToggle(); openAudioSettings(); };
  $('modal').querySelectorAll('[data-aud]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.aud;
    if(b.dataset.mode){ BGMST[key].mode=b.dataset.mode; bgmSave(); openAudioSettings(); return; }
    const act=b.dataset.act;
    if(act==='saveyt'){
      const inp=$('yt_'+key); const id=ytId(inp?inp.value:'');
      if(!id){ toast('YouTube URL을 확인하세요'); return; }
      BGMST[key].yt=inp.value; BGMST[key].mode='yt'; bgmSave(); toast('🎵 YouTube BGM을 저장했습니다'); openAudioSettings(); return;
    }
    if(act==='test'){ bgmStop(); const cfg=BGMST[key]; const ok=playCustomBgm(key); toast(ok?'재생 중… (브라우저가 막으면 한 번 더)':'재생할 수 없습니다'); return; }
  });
  $('modal').querySelectorAll('input[type=file]').forEach(inp=>{
    inp.onchange=()=>{
      const key=inp.id.slice(2);
      const f=inp.files&&inp.files[0]; if(!f) return;
      if(f.size>3.5*1024*1024){ toast('파일이 너무 큽니다 (3.5MB 이하)'); return; }
      const rd=new FileReader();
      rd.onload=()=>{ BGMST[key].data=String(rd.result); BGMST[key].name=f.name; BGMST[key].mode='file'; bgmSave(); toast('🎵 '+f.name+' 저장'); openAudioSettings(); };
      rd.readAsDataURL(f);
    };
  });
}

function kespaBegin(){
  const k=S.kespa||kespaInit();

  const m=kespaMyMatch();
  if(!m) return;
  const oppId=m.a===S.userTeam?m.b:m.a;
  const s=createSeries(oppId,3,'kespa',{roundName:(kespaRound()||{}).name,kespaMatch:{a:m.a,b:m.b}});

  saveGame();
  startDraft(s);

function hubActionMkt(a,v,el){
  if(a==='goods'){ goodsTier=v; renderHub(); return true; }
  if(a==='model'){ goodsModelIdx=Number(v); renderHub(); return true; }
  if(a==='goodsgo'){
    const models=goodsModels(); const m=models[goodsModelIdx];
    const r=goodsCreate(goodsTier,m?m.name:null); toast(r.msg); return true;
  }
  if(a==='fmwhen'||a==='fmplace'){
    FM_SEL[a==='fmwhen'?'when':'place']=v;
    renderHub(); return true;
  }
  if(a==='fmhold'){ const r=meetingHold(FM_SEL.when,FM_SEL.place); toast(r.msg); return true; }
  if(a==='fmopen'){ toast('올해 팬미팅은 열지 않습니다'); renderHub(); return true; }
  if(a==='kespastart'){ kespaBegin(); return true; }
  if(a==='kespago'){ kespaBegin(); return true; }
  if(a==='kespasim'){ kespaSimOthers(); kespaAdvanceRound(); renderHub(); return true; }
  if(a==='signfa'){
    const sel=document.querySelector('[data-years="'+v+'"]');
    const years=sel?Number(sel.value):2;
    const r=signFA(v,years); toast(r.msg); if(r.ok) renderHub(); return true;
  }
  if(a==='viewworlds'){ if(S.worlds){ show('worlds'); renderWorlds(); } return true; }
  return false;
}

  const cur=dCur();
  const phase=D.phase==='assign'?'라인 배정':D.phase==='done'?'밴픽 완료':(cur&&cur.t==='ban'?'BAN PHASE':'PICK PHASE');
  const sr=D.series;
  return `<div class="draft-head">
    <div>
      <div class="draft-phase">${phase} · ${D.mySide==='blue'?'블루':'레드'} 사이드</div>
      <div class="tiny" style="margin-top:2px">${esc(myTeam().tag)} ${sr.score.me} : ${sr.score.opp} ${esc(T(D.oppId).tag)} · ${D.gameIdx+1}세트${D.series.bo>1?' · Bo'+D.series.bo:''}${typeof isRival==='function'&&isRival(D.oppId)?' <em class="derby">라이벌전</em>':''}</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="auto-draft" data-auto="draft">자동 밴픽</button>
    </div>
    <div style="text-align:right">
      <div class="draft-timer">${D.phase==='assign'?'감독 배정':D.phase==='done'?'확정':(dActor()==='me'?'내 차례':'상대 차례')}</div>
      <div class="tiny">밴 ${dMyBans().length}/5 · 픽 ${dMyPicks().length}/5</div>
    </div>
  </div>`;
}
function draftTimeline(){
  return `<div class="draft-timeline">${DRAFT_ORDER.map((o,i)=>{
    const active=i===D.step&&D.phase!=='assign'&&D.phase!=='done';
    const done=i<D.step||D.phase==='assign'||D.phase==='done';
    const mine=o.s===D.mySide;
    return `<span class="dt ${o.t} ${mine?'mine':'enemy'} ${active?'on':''} ${done?'done':''}" title="${o.t==='ban'?'밴':'픽'} ${mine?'(우리)':'(상대)'}">${o.t==='ban'?'B':'P'}</span>`;
  }).join('')}</div>`;
}
function banSlots(list, mine){
  let h='';
  for(let i=0;i<5;i++){
    const n=list[i];
    h+=`<div class="ban-slot ${n?'filled':''} ${mine?'':'enemy'}">${n?esc(n):'—'}</div>`;
  }
  return h;
}
function pickSlots(names, mine){
  const roles=D.assign&&D.assign[mine?'me':'opp'];
  const arr=(names||[]).slice(0,5); while(arr.length<5) arr.push(null);
  return arr.map((n,i)=>{
    const c=n?CHAMP_MAP[n]:null;
    const roleKey=mine?'me':'opp';
    const role=roles?Object.keys(roles).find(r=>roles[r]===n):null;
    return `<div class="pick-slot ${n?'':'empty'} ${mine?'':'enemy'}">
      <div class="role">${role?ROLE_KR[role]:'P'+(i+1)}</div>
      ${c?`<img src="${DD(c.k)}" alt="" onerror="this.style.opacity=0">`:'<div style="flex:1"></div>'}
      <div class="ps-name">${n?esc(n):'—'}</div>
      ${n&&mySigs().includes(n)&&mine?'<span class="sig">★</span>':''}
    </div>`;
  }).join('');
}
function compMini(comp){
  const v=k=>Math.round((comp.tags[k]/15)*100);
  return `<div class="synergy">
    ${[['이니시','engage','cyan'],['포킹','poke','violet'],['한타','fight','gold'],['스플릿','split','green'],['후반','scale','red']].map(([label,k,cls])=>`
      <div class="syn"><div class="sn">${label}</div><div class="sv">${v(k)}</div><div class="sb ${cls}"><i style="width:${v(k)}%"></i></div></div>`).join('')}
  </div>`;
}
function curveBars(comp){
  const labels=['초반','중반','후반'];
  return `<div class="bars">${comp.curve.map((v,i)=>`
    <div class="bar-row"><span>${labels[i]}</span><div class="bar ${i===0?'cyan':i===1?'violet':'gold'}"><i style="width:${(v/5)*100}%"></i></div><b>${v.toFixed(1)}</b></div>`).join('')}</div>`;
}
function laneBars(lane){
  return `<div class="stack" style="gap:7px">${ROLES.map(r=>{
    const L=lane[r]; if(!L) return '';
    const d=(L.my-L.opp)/2.5;
    const w=clamp(Math.abs(d)*2.2,4,50);
    return `<div class="lane-row">
      <span class="lr">${ROLE_KR[r]}</span>
      <div class="lane-bar"><div class="lane-mid"></div><div class="my ${d<0?'neg':''}" style="width:${w}%"></div></div>
      <span class="lane-val" style="color:${d>0?'var(--cyan)':'var(--red)'}">${d>0?'+':''}${d.toFixed(1)}</span>
    </div>`;
  }).join('')}</div>`;
}
function draftAdvBar(r){
  if(!r) return '';
  const pct=r.myPct;
  return `<div class="adv-card">
    <div class="adv-top"><span>밴픽 우세도</span><span class="adv-num ${pct>=50?'up':'down'}">${pct.toFixed(1)}% <i>:</i> ${(100-pct).toFixed(1)}%</span></div>
    <div class="adv-bar"><i style="width:${pct}%"></i><span></span></div>
    <div class="tiny" style="margin-top:4px">${pct>=56?'밴픽에서 크게 앞섰습니다 — 라인 상성·조합 우위':pct>=52?'밴픽 소폭 우위':pct<=44?'밴픽 열세 — 운영과 교전 설계로 뒤집어야 합니다':'밴픽 팽팽한 승부'}</div>
  </div>`;
}
function traitChips(p, max){
  if(!p) return '';
  const good=(p.good||[]).slice(0,max||99), bad=(p.bad||[]).slice(0,Math.max(1,Math.round((max||99)/2)));
  return good.map(id=>{const t=TRAIT_MAP[id];return t?`<span class="tr good" title="${esc(t.d)}">${esc(t.n)}</span>`:'';}).join('')
    + (p.bad||[]).slice(0,3).map(id=>{const t=TRAIT_MAP[id];return t?`<span class="tr bad" title="${esc(t.d)}">${esc(t.n)}</span>`:'';}).join('');
}
function playChip(p){
  if(!p) return '';
  return `<span class="play-chip" title="대표 성향">${playIcon(p)} ${esc(playName(p))}</span>`;
}

function bindAutoDraft(){
  const v=$('view-draft'); if(!v) return;
  const b=v.querySelector('[data-auto="draft"]');
  if(b) b.onclick=()=>{ try{ autoDraftRun(); }catch(e){ toast('자동 밴픽 실패: '+e.message); } };
}
function renderDraft(){
  const me=myTeam(), opp=T(D.oppId);
  const myComp=evalComp(dMyPicks()), oppComp=evalComp(dOppPicks());
  const myTurn=dActor()==='me';
  const phaseNow=(D.phase==='assign'||D.phase==='done')?D.phase:dPhaseNow();
  const grid=CHAMPS.slice().sort((a,b)=>champTier(b)-champTier(a)).map(c=>{
    const used=dUsed().includes(c.n);
    const banned=dMyBans().includes(c.n)||dOppBans().includes(c.n);
    const matches=D.roleFilter==='ALL'||c.r.includes(D.roleFilter);
    const q=(D.q||'').trim().toLowerCase();
    const qok=!q||c.n.toLowerCase().indexOf(q)>=0||String(c.k||'').toLowerCase().indexOf(q)>=0||String(c.sig||'').toLowerCase().indexOf(q)>=0;
    if(!matches&&!banned) return '';
    if(!qok&&!banned) return '';
    const sig=mySigs().includes(c.n);
    const cls=['champ'];
    if(used) cls.push('used');
    if(banned) cls.push('ban');
    if(sig) cls.push('sig');
    return `<button class="${cls.join(' ')}" data-champ="${c.n}" data-sig="${esc(c.sig||'')}" title="${esc(c.n)} — ${esc(c.sig||'')} · ${esc(c.sd||'')}" ${(used||banned)?'disabled':''}>
      <span class="fb">${esc(c.n.slice(0,1))}</span>
      <img src="${DD(c.k)}" alt="${esc(c.n)}" loading="lazy" onerror="this.style.opacity=0">
      <span class="cp">${champTier(c)}</span>
      <span class="cn">${esc(c.n)}</span>

  }).join('');
  const phase=phaseNow;
  $('view-draft').innerHTML=`
    ${draftHead()}
    <div class="draft-body">
      ${typeof coachAdviceHTML==='function'?coachAdviceHTML():''}
      ${DRAFT_ORDER&&phase!=='assign'&&phase!=='done'?`<div class="card tight" style="padding:9px 10px">${draftTimeline()}</div>`:''}
      ${phase==='done'?draftSummaryHTML(myComp,oppComp,me,opp):phase==='assign'?assignHTML(myComp,oppComp,me,opp):`
      <div class="card tight" style="padding:10px">
        <div class="row between" style="margin-bottom:6px"><span class="tiny" style="font-weight:800">내 밴 ${dMyBans().length}/5</span><span class="tiny">상대 밴 ${dOppBans().length}/5</span></div>
        <div class="row" style="gap:8px">
          <div style="flex:1"><div class="ban-row">${banSlots(dMyBans(),true)}</div></div>
          <div style="flex:1"><div class="ban-row">${banSlots(dOppBans(),false)}</div></div>
        </div>
      </div>
      <div class="card tight" style="padding:10px">
        <div class="row between" style="margin-bottom:6px"><span class="tiny" style="font-weight:800;color:var(--cyan)">${esc(me.tag)} 픽 (픽 순서)</span><span class="tiny" style="color:var(--red)">${esc(opp.tag)} 픽</span></div>
        <div class="pick-row" style="margin-bottom:6px">${pickSlots(dMyPicks(),true)}</div>
        <div class="pick-row">${pickSlots(dOppPicks(),false)}</div>
        <div class="tiny" style="margin-top:6px">라인은 밴픽이 끝난 뒤 배정합니다 — 플렉스 픽으로 상대를 흔들어 보세요</div>
      </div>
      <div class="card tight">
        <div class="row between" style="margin-bottom:7px">
          <span class="tiny" style="font-weight:800;letter-spacing:.08em">내 조합 진단</span>
          <span class="tiny">${dMyPicks().length}/5 픽</span>
        </div>
        ${dMyPicks().length?compMini(myComp):'<div class="empty-note" style="padding:8px">챔피언을 픽하면 조합 진단이 표시됩니다</div>'}
        ${dMyPicks().length>=2?`
          <div class="divider" style="margin:9px -14px"></div>
          <div class="row between" style="margin-bottom:5px"><span class="tiny">피해 유형</span>
          <span class="tiny"><b style="color:var(--gold)">AD ${myComp.ad}</b> · <b style="color:#c4b1ff">AP ${myComp.ap}</b> · 탱커 ${myComp.tank}</span></div>
          <div class="row between" style="margin-bottom:5px"><span class="tiny">파워 스파이크</span><span class="tiny">CC ${myComp.cc}/15 · 프론트 ${myComp.front}/15</span></div>
          ${curveBars(myComp)}
          ${myComp.warnings.length?`<div class="tag-row" style="margin-top:7px">${myComp.warnings.map(w=>`<span class="chip sm red">⚠ ${esc(w)}</span>`).join('')}</div>`:''}
          ${myComp.strengths.length?`<div class="tag-row" style="margin-top:5px">${myComp.strengths.map(w=>`<span class="chip sm green">✓ ${esc(w)}</span>`).join('')}</div>`:''}
        `:''}
        ${dOppPicks().length>=3?`
          <div class="divider" style="margin:9px -14px"></div>
          <div class="row between" style="margin-bottom:4px"><span class="tiny" style="color:var(--red)">상대 조합</span>
          <span class="tiny">AD ${oppComp.ad} · AP ${oppComp.ap} · CC ${oppComp.cc}</span></div>
          <div class="tag-row">${oppComp.warnings.slice(0,2).map(w=>`<span class="chip sm red">${esc(w)}</span>`).join('')}
          ${oppComp.strengths.slice(0,2).map(w=>`<span class="chip sm">${esc(w)}</span>`).join('')}</div>
        `:''}
      </div>
      <div class="row between" style="padding:0 4px">
        <span class="tiny" style="font-weight:800">${phase==='pick'?(myTurn?'내 픽 차례 — 아무 챔피언이나 가능':'상대 픽 대기'):(myTurn?'내 밴 차례':'상대 밴 대기')}</span>

      <div class="role-tabs">
        ${['ALL',...ROLES].map(r=>`<button class="chip ${D.roleFilter===r?'on':''}" data-rf="${r}">${r==='ALL'?'전체':ROLE_KR[r]}</button>`).join('')}

      </div>
      <div class="champ-grid">${grid}</div>
      <div class="champ-info" id="champInfo">챔피언을 길게 누르거나 마우스를 올리면 <b>고유 특징</b>이 표시됩니다</div>
      <div class="tiny" style="text-align:center;padding:6px 0">★ = 우리 팀 주특기 · 숫자 = 메타 티어 · 픽 순서와 라인은 무관</div>
      `}
    </div>`;
  bindDraft();
  bindAutoDraft();
  show('draft');
}

    </div>
    <button class="btn primary block" id="confirmAssign">라인 배정 확정 · 전략 수립 →</button>
    <div style="height:8px"></div>`;
}

function bindDraft(){
  const v=$('view-draft');
  v.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{D.roleFilter=b.dataset.rf;renderDraft();});
  const cq=$('champQ');
  if(cq){
    cq.oninput=()=>{ D.q=cq.value; renderDraft(); };
    cq.onkeydown=(e)=>{ if(e.key==='Escape'){ D.q=''; renderDraft(); } };
    if(D.q){ cq.focus(); try{ cq.setSelectionRange(cq.value.length,cq.value.length); }catch(e){} }
  }
  v.querySelectorAll('[data-champ]').forEach(b=>{
    const showInfo=()=>{ const el=$('champInfo'); if(el){ const c=CHAMP_MAP[b.dataset.champ]; if(c) el.innerHTML='<b>'+esc(c.n)+'</b> · '+esc(c.sig||'')+' — <span class="tiny">'+esc(c.sd||'')+'</span>'; } };
    b.onmouseenter=showInfo; b.onfocus=showInfo;
  });
  v.querySelectorAll('[data-champ]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.champ;
    const ph=dPhaseNow();
    if(ph==='ban'){
      if(dActor()!=='me'){ toast('상대 밴을 기다리는 중입니다'); return; }
      draftMyBan(n);
    }else if(ph==='pick'){
      if(dActor()!=='me'){ toast('상대 픽을 기다리는 중입니다'); return; }
      draftMyPick(n);
    }
  });
  v.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ D.sel=(D.sel===b.dataset.sel?null:b.dataset.sel); renderDraft(); });
  v.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
    if(D.phase!=='assign') return;
    const role=b.dataset.role;
    if(D.sel){ setAssign(role,D.sel); D.sel=null; }
    else { const cur=D.assign.me[role]; if(cur) D.sel=cur; renderDraft(); }
  });
  const aa=$('autoAssign'); if(aa) aa.onclick=()=>{ D.assign.me=recommendAssign(dMyPicks()); D.sel=null; D.result=evalDraft(); renderDraft(); toast('추천 배정을 적용했습니다'); };
  const ca=$('confirmAssign'); if(ca) ca.onclick=()=>{
    if(ROLES.some(r=>!D.assign.me[r])){ toast('5개 라인을 모두 배정하세요'); return; }
    confirmAssign();
  };
  const tp=$('toPlan'); if(tp) tp.onclick=()=>renderGameplan();
}

function suggestTactics(){
  const m=M.minute;
  const gd=M.gold[0]-M.gold[1];
  const behind=gd<-1500, ahead=gd>1500;
  const soulNear=(M.dragons[0]>=2||M.dragons[1]>=2);
  const out=[];
  if(m<14){
    out.push('topDive','botDive','midJungle','invade','plate');
    if(behind) out.splice(3,2,'freeze','counterGank');
    if(ahead) out.splice(4,1,'laneSwap');
  }else if(m<20){
    out.push('heraldMid','grubs','dragonTrade','split131','cross');
    if(soulNear) out.unshift('soulDeny');
    if(behind) out.splice(3,2,'freeze','tpFlank');
  }else{
    out.push('baronBush','baronBurst','soulDeny','engage','peel');
    if(ahead) out.splice(4,1,'push3');
    if(behind) out.splice(3,2,'avoid','scale');
    if(M.soulGranted.opp||M.elderAt) out.unshift('elderAll');
  }
  return [...new Set(out)].slice(0,5).map(k=>FOCUS_MAP[k]).filter(Boolean);
}

function drawGraph(){
  const cv=$('goldCanvas'); if(!cv||!M) return;
  const w=cv.clientWidth||320, h=132, dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){ const y=h*i/4; ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke(); }
  const hist=M.history.length>1?M.history:[{min:0,diff:0},{min:M.minute,diff:0}];
  const span=Math.max(30,Math.min(40,Math.ceil((M.minute*1.35)/5)*5));
  const maxAbs=Math.max(2000,...hist.map(p=>Math.abs(p.diff)))*1.2;
  const X=m=>8+(m/span)*(w-16);
  const Y=d=>h/2-(d/maxAbs)*(h/2-8);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
  const pts=hist.map(p=>[X(Math.min(p.min,span)),Y(p.diff)]);
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(37,224,255,.35)');grad.addColorStop(.5,'rgba(37,224,255,.03)');grad.addColorStop(.5,'rgba(255,77,109,.03)');grad.addColorStop(1,'rgba(255,77,109,.35)');
  ctx.beginPath(); ctx.moveTo(pts[0][0],h/2);
  pts.forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(pts[pts.length-1][0],h/2); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.strokeStyle='#7ceaff'; ctx.lineWidth=2; ctx.stroke();
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],3.2,0,7); ctx.fillStyle=M.gold[0]>=M.gold[1]?'#25e0ff':'#ff4d6d'; ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='9px sans-serif';
  ctx.fillText("+"+Math.round(maxAbs/1000)+"K",6,14);
  ctx.fillText("-"+Math.round(maxAbs/1000)+"K",6,h-6);
  ctx.fillText(span+"'",w-20,h-6);
}

function mmLaneAdv(lane){
  const roleMap={TOP:'TOP',MID:'MID',BOT:'ADC'};
  const L=(M&&M.lane&&M.lane[roleMap[lane]])||{my:60,opp:60};
  return (L.my-L.opp)/26;   // -1.5 ~ 1.5
}
function mmLaneFrontT(lane){
  const adv=clamp(mmLaneAdv(lane)+((MM.towerIdx.opp||0)-(MM.towerIdx.me||0))*0.10,-1,1);
  return clamp(0.5+adv*0.30,0.20,0.80);
}
function laneDir(lane,t){
  const a=mmPathPoint(LANE_PATH[lane],Math.max(0,t-0.02));
  const b=mmPathPoint(LANE_PATH[lane],Math.min(1,t+0.02));
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const d=Math.hypot(dx,dy)||1;
  return [dx/d,dy/d];
}
/* 라인 프런트에 붙는 위치 — 웨이포인트를 따라서만 이동 (정글 관통 금지) */
function mmLaneFrontPos(lane,side,back){
  const t=mmLaneFrontT(lane);
  const off=back||0.012;
  const tt=clamp(side==='me'?t-off:t+off,0.02,0.98);
  const p=mmPathPoint(LANE_PATH[lane],tt);
  const dir=laneDir(lane,tt);
  // 라인 수직 방향 미세 오프셋 (카이팅)
  const px=-dir[1]*0.006, py=dir[0]*0.006;
  return [clamp(p[0]+px,0.03,0.97),clamp(p[1]+py,0.03,0.97)];
}
function mmJungleCamp(side,m){
  const camps=CAMPS[side];
  const slot=Math.floor((m*2+ (side==='me'?0:3))/2)%(camps.length+1);
  return camps[Math.min(camps.length-1,slot)];
}
function mmComputeTargets(){
  if(!M) return;
  const m=M.minute;
  const focus=mmUpdatePhase();
  const objWin=mmObjectiveWindow(m);

  const dragonPit=PIT.dragon, baronPit=PIT.baron;

  const now=performance.now();
  ROLES.forEach((role,ri)=>{
    ['me','opp'].forEach(side=>{
      const k=mmTokenKey(side,role);
      const u=MM.units[k]; if(!u) return;

      if(u.alive&&u.hp<26&&m>2&&!objWin){

        // 갱킹: 3분마다 라인 개입
        if(m>=2&&(m+ri)%3===0){
          const lanes=['TOP','MID','BOT'];
          const tgtLane=lanes[(Math.floor(m/3)+ri+(side==='me'?0:1))%3];
          const fp=mmLaneFrontPos(tgtLane,side,0.055);

      }

        const spread={TOP:[-0.05,0.03],MID:[-0.02,-0.02],ADC:[0.03,0.04],SUP:[0.05,-0.01]}[role]||[0,0];
        tx=pit[0]+spread[0]*sgn+ (side==='me'?-0.02:0.02);

      }

            else if(role==='JGL'){ const p=mmPathPoint(LANE_PATH.BOT,side==='me'?behind:1-behind); tx=p[0]; ty=p[1]; }

            if(role==='JGL'||role==='SUP'||role==='ADC'){ tx=0.335; ty=0.245; }
            else { const p=mmPathPoint(LANE_PATH.MID,side==='me'?own+0.02:own-0.02); tx=p[0]; ty=p[1]; }
            break;
          case 'group': tx=groupPt[0]+(sgn*-0.02); ty=groupPt[1]; break;
          case 'flank':
            if(role==='TOP'){ tx=0.24; ty=0.30; }
            else if(role==='MID'){ const p=mmPathPoint(LANE_PATH.MID,0.42); tx=p[0]; ty=p[1]-0.03; }
            break;
          case 'backdoor':
            if(role==='TOP'||role==='MID'){ const lane=role==='TOP'?'BOT':'TOP'; const p=mmPathPoint(LANE_PATH[lane],side==='me'?0.95:0.05); tx=p[0]; ty=p[1]; }
            break;
          case 'assassin': if(role==='MID'||role==='JGL'){ const fp=mmLaneFrontPos('BOT',side==='me'?'opp':'me',0.02); tx=fp[0]; ty=fp[1]; } break;
          case 'poke': { const p=mmPathPoint(LANE_PATH.MID,side==='me'?0.62:0.38); tx=p[0]; ty=p[1]; } break;
          case 'safe': { const q=mmLaneFrontPos(T,side,0.06); tx=q[0]; ty=q[1]; } break;
          case 'swap': {
            const laneMap={TOP:'BOT',ADC:'TOP',SUP:'TOP',MID:'MID',JGL:'MID'};
            const tl=laneMap[role]||T;
            const p=mmLaneFrontPos(tl,side,role==='SUP'?0.03:0.012);
            tx=p[0]; ty=p[1];
            break;
          }
        }
      }
      if(focus){
        const w={JGL:0.85,SUP:0.78,MID:0.6,TOP:0.45,ADC:0.5}[role]||0.5;
        tx=tx*(1-w)+focus[0]*w; ty=ty*(1-w)+focus[1]*w;
      }
      const st=M.stance;
      if(st==='aggro'){ tx+=sgn*-0.02; ty+=sgn*-0.012; }
      if(st==='defensive'){ tx+=sgn*-0.012; ty+=sgn*-0.008; }
      MM.tgt[k]={x:Math.max(0.045,Math.min(0.955,tx)),y:Math.max(0.045,Math.min(0.955,ty))};
    });
  });
}

/* ---------- 이벤트 동기화 (매 게임 분) ---------- */
function mmAddFx(o){ o.at=performance.now(); MM.fx.push(o); if(MM.fx.length>40) MM.fx.shift(); }
function mmSync(){

      }
    }
  });
  MM.last.kills=(M.kills||[0,0]).slice();
  // 타워 파괴 → 잔해 + 레이저
  ['me','opp'].forEach(side=>{
    const idx=side==='me'?0:1;
    const cur=M.towers[idx]||0, prev=MM.last.towers[idx]||0;
    if(cur>prev){
      const enemy=side==='me'?'opp':'me';
      for(let i=prev;i<cur;i++){
        const ti=MM.towerIdx[enemy]||0;

        MM.marks.push({x:tp[0],y:tp[1],type:'tower',side:enemy,at:M.minute});
        mmAddFx({type:'laser',x1:tp[0],y1:tp[1],x2:tp[0]+(enemy==='opp'?-0.05:0.05),y2:tp[1]+0.03,col:SIDE_COL[side],life:700});
        mmAddFx({type:'burst',x:tp[0],y:tp[1],col:'#ffc94a',life:900,label:'TOWER'});
        MM.towerIdx[enemy]=ti+1;
      }
    }
  });
  MM.last.towers=(M.towers||[0,0]).slice();
  [['dragons','dragon'],['barons','baron'],['grubs','grub']].forEach(([kk,kind])=>{
    const tot=(M[kk][0]||0)+(M[kk][1]||0);
    const prev=(MM.last[kk][0]||0)+(MM.last[kk][1]||0);
    if(tot>prev){
      const side=(M[kk][0]||0)>(MM.last[kk][0]||0)?'me':'opp';
      const pit=PIT[kind];
      MM.marks.push({x:pit[0],y:pit[1],type:kind,side,at:M.minute});
      mmAddFx({type:'ring',x:pit[0],y:pit[1],col:'#ffc94a',life:1100,r:0.06});
      mmAddFx({type:'burst',x:pit[0],y:pit[1],col:'#ffc94a',life:1100,label:kind==='dragon'?'DRAGON':kind==='baron'?'BARON':'GRUB'});
      if(MM.zoom.on) mmZoomTo(pit[0],pit[1],1.85,3400);
    }
    MM.last[kk]=M[kk].slice();
  });
  // 한타
  const ft=(M.fights[0]||0)+(M.fights[1]||0), fprev=(MM.last.fights[0]||0)+(MM.last.fights[1]||0);
  if(ft>fprev){
    const lane=['TOP','MID','ADC'][Math.floor(Math.random()*3)];
    const side=Math.random()<0.5?'me':'opp';
    const lp=LANE_POS[lane][side];
    MM.focus=[lp[0],lp[1]]; MM.focusUntil=M.minute+2;
    mmAddFx({type:'ring',x:lp[0],y:lp[1],col:'#ffc94a',life:1200,r:0.05});
    mmAddFx({type:'burst',x:lp[0],y:lp[1],col:'#ffc94a',life:1200,label:'FIGHT'});
    if(MM.zoom.on) mmZoomTo(lp[0],lp[1],1.8,3400);
  }
  MM.last.fights=(M.fights||[0,0]).slice();
  // 미니언 웨이브
  if(!MM.minions.length) mmSpawnWave();
}
/* ---------- 미니언 ---------- */
function mmPathPoint(pts,t){
  let total=0; const segs=[];
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    segs.push(d); total+=d;
  }
  let target=Math.max(0,Math.min(1,t))*total;
  for(let i=0;i<segs.length;i++){
    if(target<=segs[i]||i===segs.length-1){
      const f=segs[i]?target/segs[i]:0;
      return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];
    }
    target-=segs[i];
  }
  return pts[pts.length-1];
}
function mmLaneFront(lane){
  const role={TOP:'TOP',MID:'MID',BOT:'ADC'}[lane];
  const L=(M&&M.lane&&M.lane[role])||{my:60,opp:60};
  const adv=clamp((L.my-L.opp)/40,-0.12,0.12);
  const towers=((MM.towerIdx.opp||0)-(MM.towerIdx.me||0))*0.012;
  return clamp(0.5-adv-towers,0.28,0.72);
}
function mmSpawnWave(){
  MM.minions=[];
  ['TOP','MID','BOT'].forEach(lane=>{
    ['me','opp'].forEach(side=>{
      for(let i=0;i<4;i++){
        const ranged=i===3;
        MM.minions.push({lane,side,t:side==='me'?0.01+i*0.009:0.99-i*0.009,
          hp:30,alive:true,off:(Math.random()-0.5)*0.02+(ranged?0.012:0),spd:0.010+Math.random()*0.003,ranged});
      }
    });
  });
  MM.waveAt=performance.now();
}
/* ---------- 발사체 · 이펙트 ---------- */
function mmSpawnProjectile(){
  const alive=Object.keys(MM.units).filter(k=>MM.units[k].alive);
  if(alive.length<2) return null;
  const a=MM.units[alive[Math.floor(Math.random()*alive.length)]];
  const enemies=alive.filter(k=>MM.units[k].side!==a.side).map(k=>MM.units[k]);
  if(!enemies.length) return null;
  enemies.sort((x,y)=>Math.hypot(x.x-a.x,x.y-a.y)-Math.hypot(y.x-a.y,y.y-a.y));
  const b=enemies[0];
  const dist=Math.hypot(b.x-a.x,b.y-a.y);
  if(dist>0.3) return null;
  const skill=Math.random()<0.35;
  MM.proj.push({x:a.x,y:a.y,tx:b.x,ty:b.y,side:a.side,kind:skill?'skill':'auto',
    spd:skill?0.9:0.55,col:a.side==='me'?'#7cf7ff':'#ff9aa9',life:0,target:b,skill});
  return true;
}
/* ---------- 메인 루프 ---------- */
function mmStart(){
  if(MM.started) return;
  MM.started=true; MM.lastTs=0;
  const loop=(ts)=>{
    if(!MM.started) return;
    MM.rafId=requestAnimationFrame(loop);
    const dt=MM.lastTs?Math.min(64,ts-MM.lastTs):16; MM.lastTs=ts;
    mmUpdate(dt);
    mmDraw(dt);
  };
  MM.rafId=requestAnimationFrame(loop);
}
function mmStop(){
  MM.started=false;
  if(MM.rafId){ cancelAnimationFrame(MM.rafId); MM.rafId=null; }
}
function mmUpdate(dt){
  if(!M) return;
  const now=performance.now();
  const paused=!M.running&&!M.over;
  const step=paused?0:Math.min(dt,64)/1000;
  MM.t+=step;
  // 유닛 이동 (속도 기반 → 순간이동 없음)
  Object.keys(MM.units).forEach(k=>{
    const u=MM.units[k], t=MM.tgt[k]||u;
    if(!u.alive){
      if(now>u.deadUntil){
        const fountain=u.side==='me'?[0.10,0.90]:[0.90,0.10];
        u.x=fountain[0]; u.y=fountain[1]; u.hp=u.hpMax; u.alive=true;
      }else return;
    }
    const dx=t.x-u.x, dy=t.y-u.y, d=Math.hypot(dx,dy);
    const spd=u.step*(u.role==='JGL'?1.15:1);
    let desired=[0,0];
    if(d>0.004){ desired=[dx/d*spd, dy/d*spd]; }
    // 아군/적군 근접 시 카이팅 (밀고 물러나기)
    const en=Object.values(MM.units).filter(o=>o.side!==u.side&&o.alive);
    let near=null,nd=9;
    en.forEach(o=>{ const dd=Math.hypot(o.x-u.x,o.y-u.y); if(dd<nd){nd=dd;near=o;} });
    if(near&&nd<0.14){
      const away=[(u.x-near.x)/nd*0.02,(u.y-near.y)/nd*0.02];
      const wob=Math.sin(now/380+k.length)*0.02;
      desired=[desired[0]*0.55+away[0]+wob*0.3, desired[1]*0.55+away[1]+Math.cos(now/420)*0.01];
      if(Math.random()<0.02) mmAddFx({type:'spark',x:u.x,y:u.y,life:300});
    }
    u.vx+=(desired[0]-u.vx)*Math.min(1,dt/90);
    u.vy+=(desired[1]-u.vy)*Math.min(1,dt/90);
    u.x=Math.max(0.03,Math.min(0.97,u.x+u.vx*step));
    u.y=Math.max(0.03,Math.min(0.97,u.y+u.vy*step));
    // 체력 재생
    if(u.alive) u.hp=Math.min(u.hpMax,u.hp+step*3.5);
  });
  // 미니언
  if(now-MM.waveAt>26000) mmSpawnWave();
  MM.minions.forEach(mn=>{
    if(!mn.alive) return;
    const front=mmLaneFront(mn.lane);
    const dir=mn.side==='me'?1:-1;
    const dist=(front-mn.t)*dir;
    if(dist>0.006){ mn.t=Math.max(0,Math.min(1,mn.t+dir*mn.spd*step*60)); }
    else if(Math.random()<0.02){ const p=mmPathPoint(LANE_PATH[mn.lane],mn.t); mmAddFx({type:'spark',x:p[0]+mn.off,y:p[1],life:260}); }
  });
  // 발사체 생성
  if(Math.random()<step*2.4) mmSpawnProjectile();
  // 발사체 이동
  for(let i=MM.proj.length-1;i>=0;i--){
    const p=MM.proj[i];
    if(p.target&&p.target.alive){ p.tx=p.target.x; p.ty=p.target.y; }
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
    if(d<0.008||p.life>2.2){
      MM.proj.splice(i,1);
      mmAddFx({type:'hit',x:p.tx,y:p.ty,life:260,col:p.col});
      if(p.target&&p.target.alive){
        p.target.hp=Math.max(26,p.target.hp-(p.skill?6:3));
        if(p.skill) mmAddFx({type:'ring',x:p.tx,y:p.ty,col:p.col,life:420,r:0.03});
      }
      continue;
    }
    p.x+=dx/d*p.spd*step*60*0.016*60/3;
    p.y+=dy/d*p.spd*step*60*0.016*60/3;
    p.life+=step;
  }
  // fx 수명
  MM.fx=MM.fx.filter(f=>now-f.at<(f.life||600));
}
function mmDraw(dt){
  const cv=document.getElementById('riftCanvas');
  if(!cv||!M) return;
  const wrap=cv.parentElement;
  const cssW=Math.round((wrap?wrap.clientWidth:cv.clientWidth)||320);
  const cssH=cssW;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(cssW*dpr)||cv.height!==Math.round(cssH*dpr)){
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    cv.style.height=cssH+'px';
  }
  const ctx=cv.getContext('2d'); if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=cssW,h=cssH;

  }else{
  const bg=ctx.createRadialGradient(w*0.3,h*0.7,10,w*0.5,h*0.5,w*0.9);

  // 정글 지형
  ctx.fillStyle='rgba(26,66,50,.75)';
  ctx.beginPath(); ctx.moveTo(0,h*0.30); ctx.lineTo(w*0.20,h*0.10); ctx.lineTo(w*0.42,h*0.34);
  ctx.quadraticCurveTo(w*0.40,h*0.55,w*0.30,h*0.62); ctx.lineTo(w*0.30,h*0.92);
  ctx.lineTo(0,h*0.92); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(58,38,74,.7)';
  ctx.beginPath(); ctx.moveTo(w,h*0.70); ctx.lineTo(w*0.80,h*0.90); ctx.lineTo(w*0.58,h*0.66);
  ctx.quadraticCurveTo(w*0.60,h*0.45,w*0.70,h*0.38); ctx.lineTo(w*0.70,h*0.08);
  ctx.lineTo(w,h*0.08); ctx.closePath(); ctx.fill();
  // 정글 벽 블록
  const wall=(x,y,ww,hh,col)=>{ const r=3;
    ctx.beginPath(); ctx.moveTo(x*w+r,y*h); ctx.arcTo(x*w+ww*w,y*h,x*w+ww*w,y*h+hh*h,r);
    ctx.arcTo(x*w+ww*w,y*h+hh*h,x*w,y*h+hh*h,r); ctx.arcTo(x*w,y*h+hh*h,x*w,y*h,r); ctx.arcTo(x*w,y*h,x*w+ww*w,y*h,r);
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
    ctx.strokeStyle='rgba(150,220,190,.16)'; ctx.lineWidth=1; ctx.stroke();
  };
  MAP_WALLS.me.forEach(([x,y,ww,hh])=>wall(x,y,ww,hh,'rgba(9,32,25,.95)'));
  MAP_WALLS.opp.forEach(([x,y,ww,hh])=>wall(x,y,ww,hh,'rgba(28,16,38,.95)'));
  // 수풀
  MAP_BRUSH.forEach(([x,y])=>{
