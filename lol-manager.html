.fin3{margin:auto 0}
/* tournament splash themes */
.splash.spring{background:radial-gradient(700px 420px at 50% 32%,rgba(40,90,170,.34),transparent 70%),linear-gradient(160deg,#0a1020,#0d1526 45%,#080b13)}
.splash.spring .sp-k{color:#7fb4f0}.splash.spring .sp-logo span{color:#3f7bd6}.splash.spring .sp-logo b{color:#9dc8ff}
.splash.spring .sp-lines{color:#b6c9e0}.splash.spring .sp-big{color:#d7e6f7}
.splash.spring .sp-sub{background:linear-gradient(180deg,#fff,#8fc0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash.summer{background:radial-gradient(700px 420px at 50% 32%,rgba(190,120,40,.30),transparent 70%),linear-gradient(160deg,#12100a,#1a1408 45%,#0b0905)}
.splash.summer .sp-k{color:#e6c07a}.splash.summer .sp-logo span{color:#c79a4a}
.splash.summer .sp-lines{color:#e0cba6}.splash.summer .sp-sub{background:linear-gradient(180deg,#fff,#ffd08a);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash.msi{background:radial-gradient(700px 420px at 50% 32%,rgba(30,140,140,.30),transparent 70%),linear-gradient(160deg,#04100f,#081817 45%,#03100e)}
.splash.msi .sp-k{color:#6fe0d0}.splash.msi .sp-logo span{color:#2fae9c}
.splash.msi .sp-lines{color:#b6e6df}.splash.msi .sp-sub{background:linear-gradient(180deg,#fff,#7ff0dc);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash.ewc{background:radial-gradient(700px 420px at 50% 32%,rgba(170,60,40,.32),transparent 70%),linear-gradient(160deg,#14080a,#1c0c0a 45%,#0b0505)}
.splash.ewc .sp-k{color:#ffb08a}.splash.ewc .sp-logo span{color:#d2603c}
.splash.ewc .sp-lines{color:#f0c6b0}.splash.ewc .sp-sub{background:linear-gradient(180deg,#fff,#ffb27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash.worlds{background:radial-gradient(800px 500px at 50% 30%,rgba(200,160,60,.28),transparent 70%),linear-gradient(160deg,#0b0a12,#14101a 45%,#07060a)}
.splash.worlds .sp-k{color:#e8c979}.splash.worlds .sp-logo span{color:#c9a44a}
.splash.worlds .sp-lines{color:#e2d3b0}.splash.worlds .sp-sub{background:linear-gradient(180deg,#fff,#ffdc94);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash .sp-logo{font-size:34px}
/* owner inauguration */
.intro{max-width:920px;margin:0 auto;padding:26px 16px 40px;display:flex;flex-direction:column;gap:6px}
.in-k{font-size:10.5px;letter-spacing:.3em;font-weight:900;color:var(--gold);text-align:center}
.in-h{font-size:30px;font-weight:900;letter-spacing:-.04em;text-align:center;margin-top:4px}
.in-sub{text-align:center;font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:12px}
.in-card{max-width:760px;margin:0 auto;width:100%}
.in-input{width:100%;padding:11px 13px;border-radius:9px;background:#0f1116;border:1px solid #2b2f38;color:#fff;font-size:15px;font-weight:800}
.in-input:focus{outline:none;border-color:rgba(230,196,129,.6)}
.pledges{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(max-width:700px){.pledges{grid-template-columns:1fr}}
.pledge{display:flex;flex-direction:column;gap:3px;padding:11px;border-radius:10px;border:1px solid #262a33;background:#12141a;text-align:left}
.pledge.on{border-color:rgba(230,196,129,.6);background:linear-gradient(180deg,rgba(230,196,129,.12),#12141a);box-shadow:0 0 0 1px rgba(230,196,129,.2)}
.pl-ic{font-size:18px}
.pledge b{font-size:13px;font-weight:900;color:#eceef3}
.pledge em{font-style:normal;font-size:10.5px;color:var(--dim);line-height:1.45}
.pl-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.pl-tags i{font-style:normal;font-size:9px;font-weight:900;padding:1px 5px;border-radius:4px;background:rgba(230,196,129,.14);color:var(--gold2)}
.in-foot,.intro-foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:14px;padding:0 2px 10px;max-width:1180px;width:100%;margin-left:auto;margin-right:auto}
.in-foot .tiny,.intro-foot .tiny{flex:1}
.btn.disabled{opacity:.4;pointer-events:none}
.tl-cd{font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:5px;background:#2a1720;color:#ff9aa9;letter-spacing:.02em}
.tl-cd.ready{background:rgba(110,207,158,.16);color:#8ff0c4}
.tl-chip.cooling{opacity:.45}
/* stats boards */
.board{display:flex;flex-direction:column;gap:1px}
.brow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.04);font-size:11.5px}
.brow.me{background:rgba(230,196,129,.07)}
.bk{width:18px;font-weight:900;color:var(--dim2);text-align:center}
.bn{flex:1;min-width:0}
.bn b{display:block;font-size:12px;font-weight:900;color:#eceef3}
.bn span{display:block;font-size:9.5px;color:var(--dim2);font-weight:700}
.bv{font-size:15px;font-weight:900;color:var(--gold2);text-align:right}
.bv em{display:block;font-style:normal;font-size:9px;color:var(--dim2);font-weight:800}
.aw-sum{display:flex;flex-direction:column;gap:2px}
.aw-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dotted rgba(255,255,255,.08);font-size:11.5px}
.aw-row span{width:88px;color:var(--dim2);font-weight:800;font-size:10.5px}
.aw-row b{flex:1;color:#eceef3;font-weight:900}
.aw-row i{font-style:normal;font-size:10px;color:var(--dim2);font-weight:800}
.troph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.troph{border:1px solid #24272f;border-radius:9px;padding:9px;background:#12141a;text-align:center}
.troph.on{border-color:rgba(230,196,129,.5);background:linear-gradient(180deg,rgba(230,196,129,.12),#12141a)}
.troph span{font-size:20px;display:block;filter:grayscale(1) opacity(.35)}
.troph.on span{filter:none}
.troph b{display:block;font-size:11px;font-weight:900;margin-top:3px}
.troph i{font-style:normal;font-size:9px;color:var(--dim2);font-weight:800}
.aw-modal{max-width:520px}
.aw-k{font-size:9.5px;letter-spacing:.3em;color:var(--gold);font-weight:900;text-align:center}
.aw-h{font-size:22px;font-weight:900;text-align:center;margin:4px 0 10px;background:linear-gradient(180deg,#fff,#e6c481);-webkit-background-clip:text;background-clip:text;color:transparent}
.aw-mvp{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:linear-gradient(100deg,rgba(230,196,129,.16),rgba(18,20,26,.8));border:1px solid rgba(230,196,129,.4);margin-bottom:8px}
.aw-cup{font-size:26px}
.aw-mvp span{display:block;font-size:9.5px;color:var(--gold2);font-weight:900;letter-spacing:.06em}
.aw-mvp b{display:block;font-size:19px;font-weight:900}
.aw-mvp i{font-style:normal;font-size:10px;color:var(--dim2);font-weight:800}
.aw-line{display:flex;gap:8px;padding:5px 0;border-bottom:1px dotted rgba(255,255,255,.08);font-size:11.5px}
.aw-line span{width:86px;color:var(--dim2);font-weight:800;font-size:10.5px}
.aw-line b{flex:1;font-weight:900}
.aw-line i{font-style:normal;font-size:9.5px;color:var(--dim2)}
.aw-note{font-size:9.5px;color:var(--dim2);margin:8px 0;text-align:center}
/* rail 숨김 시 전체 폭 사용 */
#app:has(> .rail.hidden){grid-template-columns:minmax(0,1fr)}
#app:has(> .rail.hidden) > .maincol{grid-column:1}
.splash{min-height:100dvh;border-radius:0}
.view.no-pad>.bcast{width:100%}
.derby{font-style:normal;font-size:9px;font-weight:900;padding:1px 6px;border-radius:4px;background:linear-gradient(90deg,#e0687a,#e6c481);color:#1a0e10;letter-spacing:.02em}
.arw{font-style:normal;font-size:9px;font-weight:900;color:#6b7182;margin-left:2px}
.arw.up{color:#6ecf9e}.arw.dn{color:#e0687a}
.syn-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.syn-badge{font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:5px;background:linear-gradient(90deg,rgba(230,196,129,.22),rgba(196,177,255,.18));border:1px solid rgba(230,196,129,.45);color:#f7e2ae}
.cb-tip.synergy{color:#f0d69b}
button.comrow{width:100%;text-align:left;border:0;background:none;cursor:pointer}
button.comrow:hover{background:rgba(255,255,255,.05)}
.post-modal{max-width:520px}
.pm-tag{font-size:9.5px;font-weight:900;color:#a9d3f0;letter-spacing:.04em}
.pm-title{font-size:17px;font-weight:900;margin:4px 0 3px;line-height:1.35}
.pm-meta{font-size:10px;color:var(--dim2);font-weight:700;margin-bottom:10px}
.pm-body{font-size:12.5px;line-height:1.65;color:#dfe3ea;padding:10px;border-radius:9px;background:#12141a;border:1px solid #24272f}
.pm-cl{font-size:11px;font-weight:900;color:var(--gold2);margin-bottom:6px}
.pm-comments{display:flex;flex-direction:column;gap:6px;max-height:36dvh;overflow-y:auto;margin-bottom:10px}
.pm-c{border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:5px}
.pm-cn{font-size:10px;font-weight:900;color:#9fd0f0}
.pm-ct{font-size:12px;color:#dfe3ea;line-height:1.45;margin:1px 0}
.pm-cu{font-size:9px;color:var(--dim2);font-weight:800}

/* ================= V4: 애니메이션 · 마케팅 · 카드 ================= */
@keyframes vFadeSlide{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
.view.v-enter{animation:vFadeSlide .42s cubic-bezier(.22,.8,.3,1) both}
@media(prefers-reduced-motion:reduce){.view.v-enter{animation:none}}

/* ---- 레벨 표시 ---- */
.bpl-lv{position:absolute;right:-2px;bottom:-3px;font-size:8px;font-weight:900;letter-spacing:.02em;
  padding:0 3px;border-radius:4px;background:#0a1220;border:1px solid rgba(255,255,255,.22);color:#c9d4e6}
.bpl-lv.ult1{color:#bdf0ff;border-color:rgba(139,214,255,.75);box-shadow:0 0 6px rgba(37,224,255,.35)}
.bpl-lv.ult2{color:#d9ccff;border-color:rgba(196,177,255,.8);box-shadow:0 0 8px rgba(139,92,246,.45)}
.bpl-lv.ult3{color:#ffd98f;border-color:rgba(255,201,74,.9);box-shadow:0 0 10px rgba(255,201,74,.5)}
.bpl-lv.lvup{animation:lvPop .5s ease}
@keyframes lvPop{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
.bpl-p{position:relative}

/* ---- 밴픽 연출 ---- */
@keyframes banSlam{0%{transform:scale(1.6) rotate(-7deg);filter:brightness(2.2);opacity:.2}
  45%{transform:scale(.92) rotate(2deg);filter:brightness(1.25);opacity:1}
  70%{transform:scale(1.04) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
.ban-slot.slam{animation:banSlam .6s cubic-bezier(.2,.9,.25,1) both;
  border-color:rgba(255,77,109,.9)!important;box-shadow:0 0 18px rgba(255,77,109,.55)}
@keyframes pickLock{0%{transform:scale(.6);opacity:0;filter:brightness(2.6)}
  55%{transform:scale(1.08);opacity:1;filter:brightness(1.3)}100%{transform:scale(1);filter:none}}
.pick-slot.lockin{animation:pickLock .55s cubic-bezier(.2,.9,.25,1) both;
  border-color:rgba(255,201,74,.95)!important;box-shadow:0 0 22px rgba(255,201,74,.55),inset 0 0 22px rgba(255,201,74,.18)}

/* ---- 스폰서 계약 스탬프 ---- */
.stamp-wrap{display:grid;place-items:center;padding:14px}
.stamp-doc{width:min(360px,92vw);position:relative;padding:18px 16px 26px;border-radius:12px;
  background:linear-gradient(165deg,#f7f3e6,#e8e0cb);color:#2a2418;border:1px solid #d9cfae;
  box-shadow:0 22px 60px rgba(0,0,0,.6);transform:rotate(-.4deg)}
.stamp-k{font-size:8.5px;letter-spacing:.22em;font-weight:900;color:#8a7a52}
.stamp-h{font-size:23px;font-weight:900;margin:2px 0;letter-spacing:-.02em}
.stamp-cat{font-size:10px;font-weight:800;color:#6b5f42;margin-bottom:10px}
.stamp-rows{display:flex;flex-direction:column;gap:4px;font-size:11px}
.stamp-rows>div{display:flex;justify-content:space-between;border-bottom:1px dotted #c9bd9a;padding:3px 0}
.stamp-rows b{font-weight:900}
.stamp-sign{font-family:'Brush Script MT',cursive;font-size:19px;margin-top:16px;color:#1d2a52;
  border-bottom:1px solid #b9ad8a;padding-bottom:2px;width:70%}
.stamp-mark{position:absolute;right:14px;bottom:16px;font-size:13px;font-weight:900;letter-spacing:.08em;
  color:#b4362f;border:2.5px solid #b4362f;border-radius:8px;padding:5px 8px;transform:rotate(-12deg);
  opacity:0;text-transform:uppercase}
.stamp-doc.stamped .stamp-mark{animation:stampIn .5s .12s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes stampIn{0%{opacity:0;transform:rotate(-12deg) scale(2.6)}60%{opacity:1;transform:rotate(-12deg) scale(.92)}
  100%{opacity:.92;transform:rotate(-12deg) scale(1)}}

/* ---- POG 골드 ---- */
@keyframes pogShimmer{0%{background-position:-220% 0}100%{background-position:220% 0}}
.pog-gold .pog-card{position:relative;overflow:hidden}
.pog-gold .pog-card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,235,170,.42) 48%,rgba(255,255,255,.15) 52%,transparent 65%);
  background-size:220% 100%;animation:pogShimmer 2.4s ease-in-out infinite}
.pog-gold .pog-h{animation:pogPulse 1.8s ease-in-out infinite}
@keyframes pogPulse{0%,100%{text-shadow:0 0 0 rgba(255,201,74,0)}50%{text-shadow:0 0 18px rgba(255,201,74,.75)}}

/* ---- 토너먼트 스플래시 ---- */
@keyframes splashIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes splashZoom{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
.splash .sp-k{animation:splashIn .5s .02s both}
.splash .sp-logo{animation:splashZoom .7s .06s cubic-bezier(.2,1.2,.3,1) both}
.splash .sp-lines{animation:splashIn .6s .22s both}
.splash .sp-big{animation:splashZoom .8s .34s cubic-bezier(.2,1.2,.3,1) both}
.splash .sp-sub{animation:splashIn .6s .5s both}
.splash .sp-go{animation:splashIn .6s .62s both}
.splash .sp-foot{animation:splashIn .6s .74s both}

/* ---- 마케팅 V4 ---- */
.mkt-nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px 4px;position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,rgba(8,11,18,.98),rgba(8,11,18,.72));backdrop-filter:blur(8px)}
.mkt-tab{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:60px;padding:6px 8px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);font-size:9.5px;font-weight:900;color:#8f97a6;white-space:nowrap}
.mkt-tab span{font-size:15px;line-height:1.1}
.mkt-tab.on{background:linear-gradient(150deg,rgba(230,196,129,.22),rgba(196,177,255,.12));border-color:rgba(230,196,129,.55);color:#f7e2ae;
  box-shadow:0 4px 16px rgba(230,196,129,.16)}
.mk-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mk-kind{display:flex;flex-direction:column;gap:1px;align-items:flex-start;padding:9px 8px;border-radius:11px;text-align:left;
  background:#0d121c;border:1px solid #202836;transition:transform .14s,border-color .14s,background .14s}
.mk-kind:active{transform:scale(.97)}
.mk-kind b{font-size:12px;font-weight:900;color:#e6ebf5}
.mk-kind .mk-ic{font-size:17px}
.mk-kind em{font-style:normal;font-size:9px;color:#8f97a6;font-weight:800}
.mk-kind i{font-style:normal;font-size:8.5px;color:#5d6884;font-weight:700}
.mk-kind u{text-decoration:none;font-size:9px;font-weight:900;color:#6ecf9e}
.mk-kind.on{border-color:rgba(230,196,129,.8);background:linear-gradient(160deg,rgba(230,196,129,.16),rgba(20,24,34,.9));
  box-shadow:0 0 0 1px rgba(230,196,129,.25) inset,0 6px 18px rgba(230,196,129,.12)}
.mk-kind.on u{color:#ffd98f}
.mk-pl{margin-top:10px;border-radius:10px;border:1px solid #232b3a;overflow:hidden}
.mk-pl-h,.mk-pl-r{display:grid;grid-template-columns:1fr 1fr 0.7fr 1fr;gap:4px;padding:6px 8px;font-size:9.5px}
.mk-pl-h{background:#121826;color:#8f97a6;font-weight:900;letter-spacing:.03em}
.mk-pl-r{background:#0b1018;font-weight:900;font-size:10.5px}
.mk-pl-r span{text-align:right}
.mk-pl-h span{text-align:right}
.mk-pl-h span:first-child,.mk-pl-r span:first-child{text-align:left}
.mk-bar-row{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:10px}
.mk-bar-row>span{width:38px;font-weight:900;color:#a9b3c6}
.mk-bar-row>b{width:64px;text-align:right;font-weight:900}
.mk-bar{flex:1;height:8px;border-radius:5px;background:#151b26;overflow:hidden}
.mk-bar i{display:block;height:100%;border-radius:5px;animation:barGrow .6s ease both}
.mk-bar i.pos{background:linear-gradient(90deg,#2f9e6f,#6ecf9e)}
.mk-bar i.neg{background:linear-gradient(90deg,#b4362f,#e0687a)}
@keyframes barGrow{from{width:0}}

/* ---- 선수 카드 (3D 플립) ---- */
.pcard{transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.pcard-wrap.pc-deal{animation:cardDealW .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes cardDealW{0%{opacity:0;transform:translateY(22px) scale(.96)}100%{opacity:1;transform:none}}
.pc-front{position:relative;overflow:hidden}
.pc-shine{position:absolute;inset:-40% -60%;pointer-events:none;
  background:radial-gradient(220px 120px at 30% 10%,rgba(255,240,190,.22),transparent 70%),
             linear-gradient(115deg,transparent 42%,rgba(255,255,255,.10) 50%,transparent 58%);
  animation:cardShine 5.5s linear infinite}
@keyframes cardShine{0%{transform:translateX(-16%)}50%{transform:translateX(16%)}100%{transform:translateX(-16%)}}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start}
.pc-tagbox{text-align:right;font-size:11px;font-weight:900;letter-spacing:.16em;color:#f0d69b}
.pc-tagbox em{display:block;font-style:normal;font-size:8px;letter-spacing:.18em;color:#8a7a52}
.pc-av{position:relative;display:grid;place-items:center;margin:4px 0 2px}

/* ---- 기타 마이크로 애니메이션 ---- */
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* ---- 타이틀 스크린 ---- */
.tstage{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:34px 16px 28px;overflow:hidden;
  background:radial-gradient(900px 520px at 50% -8%,rgba(230,196,129,.16),transparent 62%),
             radial-gradient(700px 420px at 80% 110%,rgba(120,80,220,.14),transparent 60%),
             linear-gradient(180deg,#0a0b0e,#07080b 60%,#05060a)}
.ts-beams{position:absolute;inset:-20% -10%;pointer-events:none;overflow:hidden}
.ts-beams i{position:absolute;top:-30%;width:2px;height:160%;transform-origin:top center;
  background:linear-gradient(180deg,rgba(230,196,129,.42),rgba(230,196,129,0));
  filter:blur(.4px);opacity:.55;animation:beamSway 9s ease-in-out infinite}
.ts-beams i:nth-child(1){left:18%;transform:rotate(14deg);animation-delay:0s}
.ts-beams i:nth-child(2){left:38%;transform:rotate(-9deg);animation-delay:1.4s;opacity:.35}
.ts-beams i:nth-child(3){left:58%;transform:rotate(11deg);animation-delay:.6s;opacity:.5}
.ts-beams i:nth-child(4){left:74%;transform:rotate(-14deg);animation-delay:2.1s;opacity:.3}
.ts-beams i:nth-child(5){left:88%;transform:rotate(7deg);animation-delay:1.1s;opacity:.42}
@keyframes beamSway{0%,100%{transform:translateX(0) rotate(var(--r,8deg));opacity:.28}50%{transform:translateX(14px) rotate(var(--r,8deg));opacity:.6}}
.ts-parts{position:absolute;inset:0;pointer-events:none}
.ts-parts b{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,235,180,.85);
  left:calc(6% + (var(--i) * 5.2%));top:calc(12% + (var(--i) * 4.6%));
  box-shadow:0 0 8px rgba(255,220,150,.7);opacity:.25;animation:partFloat 7s ease-in-out infinite;animation-delay:calc(var(--i) * -.42s)}
@keyframes partFloat{0%{transform:translateY(12px);opacity:.1}45%{opacity:.7}100%{transform:translateY(-26px);opacity:0}}
.ts-emblem{position:relative;text-align:center;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px}
.ts-hex{position:relative;width:112px;height:112px;display:grid;place-items:center;filter:drop-shadow(0 12px 26px rgba(230,196,129,.35))}
.ts-hex svg{position:absolute;inset:0;width:100%;height:100%;animation:hexGlow 4s ease-in-out infinite}
@keyframes hexGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(230,196,129,.35))}50%{filter:drop-shadow(0 0 16px rgba(255,225,160,.6))}}
.ts-hex span{font-size:30px;font-weight:900;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff7e0,#e6c481 45%,#9a7833);-webkit-background-clip:text;background-clip:text;color:transparent}
.ts-kicker{font-size:10px;letter-spacing:.34em;font-weight:900;color:#c9a45c;text-transform:uppercase}
.ts-h{font-family:Pretendard,system-ui,sans-serif;font-size:clamp(34px,9vw,58px);line-height:.98;letter-spacing:-.045em;font-weight:900;
  background:linear-gradient(180deg,#fff8e6 0%,#f0d69b 38%,#c9a45c 62%,#8a6b28 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)) drop-shadow(0 10px 26px rgba(230,196,129,.28));margin:0}
.ts-h em{font-style:normal;letter-spacing:-.03em}
.ts-h b{font-size:1.12em;color:transparent;background:linear-gradient(180deg,#fff,#ffd98f 55%,#c9a45c);-webkit-background-clip:text;background-clip:text}
.ts-tag{font-size:11.5px;color:#a99a78;font-weight:800;letter-spacing:.02em;max-width:340px;line-height:1.5}
.ts-cta{position:relative;z-index:2;width:100%;max-width:430px;display:flex;flex-direction:column;gap:9px}
.ts-card{display:flex;align-items:center;gap:11px;text-align:left;padding:13px 14px;border-radius:14px;
  background:linear-gradient(140deg,rgba(28,30,38,.96),rgba(12,14,20,.98));
  border:1px solid rgba(230,196,129,.26);box-shadow:0 10px 30px rgba(0,0,0,.5);
  transition:transform .14s ease,border-color .2s,box-shadow .2s}
.ts-card:active{transform:scale(.985)}
.ts-card.new,.ts-card.continue{border-color:rgba(230,196,129,.5);

.ts-card .tc-ic{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;font-size:19px;
  background:rgba(230,196,129,.12);border:1px solid rgba(230,196,129,.32)}
.ts-card.worlds .tc-ic{background:rgba(120,160,255,.12);border-color:rgba(120,160,255,.32)}
.ts-card .tc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ts-card .tc-body b{font-size:14.5px;font-weight:900;color:#f4ecd9;letter-spacing:-.02em}

.ts-card .tc-go{color:#e6c481;font-size:12px;opacity:.8}
.ts-foot{position:relative;z-index:2;font-size:9.5px;color:#5d5a52;font-weight:700;text-align:center}

/* ---- 실측 티어를 게임 챔피언 데이터에 반영 ---- */
const LOLPS_MAP = LOLPS.champs;
function lolpsOf(n){ return LOLPS_MAP[n] || null; }
function lolpsLaneStat(n, role){
  const r = lolpsOf(n); if(!r) return null;
  if(role && r.l[role]) return r.l[role];
  return r.l[r.m] || r.l[Object.keys(r.l)[0]] || null;
}
function lolpsTier(n, role){            // lol.ps opTier(1=최상) → 게임 티어(5=최상)
  const s = lolpsLaneStat(n, role); if(!s) return null;
  return 6 - s.t;
}
function lolpsPct(v){ return (Math.round(v*10)/10).toFixed(1)+'%'; }
function lolpsIdName(id){ return LOLPS.names[String(id)] || null; }
function lolpsItemName(id){ return LOLPS.items[String(id)] || null; }
/* 실측 상성: a가 b를 상대했을 때 a의 승률(%) */
function lolpsVs(aName, bName){
  const A = lolpsOf(aName); if(!A) return null;
  const bid = (lolpsOf(bName)||{}).id; if(!bid) return null;
  let hit = (A.weak||[]).find(x=>x[0]===bid);
  if(hit) return {wr:hit[1], cnt:hit[2], kind:'weak'};
  hit = (A.strong||[]).find(x=>x[0]===bid);
  if(hit) return {wr:hit[1], cnt:hit[2], kind:'strong'};
  return null;
}
/* a가 이기는 상대(실측) / a가 지는 상대(실측) — 게임 로스터에 있는 챔프만 */
function lolpsCounterList(aName, kind){
  const A = lolpsOf(aName); if(!A) return [];
  const src = kind==='strong' ? (A.strong||[]) : (A.weak||[]);
  return src.map(x=>({n:lolpsIdName(x[0]), wr:x[1], cnt:x[2]})).filter(x=>x.n && CHAMP_MAP[x.n]);
}
/* 실측 메타 순위표 (라인 필터, opScore 내림차순) */
function lolpsBoard(role){
  const out = [];
  CHAMPS.forEach(c=>{
    const r = lolpsOf(c.n); if(!r) return;
    if(role && role!=='ALL' && !r.l[role]) return;
    const st = role && role!=='ALL' ? r.l[role] : lolpsLaneStat(c.n);
    if(!st) return;
    out.push({n:c.n, k:c.k, role:role&&role!=='ALL'?role:r.m, t:st.t, wr:st.wr, pr:st.pr, br:st.br, rk:st.rk, all:st.all, cnt:st.n, sc:st.sc});
  });
  return out.sort((a,b)=>b.sc-a.sc);
}
/* 실측 티어 반영: 게임 base 티어(c.t)를 lol.ps opTier 로 교체 (실측 없으면 기존 값 유지) */
CHAMPS.forEach(c=>{
  const t = lolpsTier(c.n);
  if(t!=null){ c.tReal = t; c.t = t; }
  c.ps = lolpsLaneStat(c.n);              // 주 라인 실측 지표
});

/* 이름 기반 결정적 해시 (재접속해도 특성이 바뀌지 않도록) */
function nameHash(s){ let h=2166136261; for(let i=0;i<String(s).length;i++){ h^=String(s).charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seededShuffle(arr,seed){
  const a=arr.slice(); let s=seed||1;
  for(let i=a.length-1;i>0;i--){ s=(Math.imul(s,1103515245)+12345)>>>0; const j=s%(i+1); const t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
/* 포지션에 맞는 특성 풀 */
function traitPoolFor(role, good){
  const base = good?GOOD_TRAITS:BAD_TRAIT_POOL;
  const fit = base.filter(t=>!t.r||t.r.includes(role));
  const rest = base.filter(t=>t.r&&!t.r.includes(role));
  return {fit, rest};
}
/* 등급에 맞춰 특성 배정 (기존 대표 성향은 유지) */
function rollTraits(p, grade){
  const g=grade||p.grade||gradeOfRating(rawOverall(p));
  p.grade=g;
  const cnt=GRADE_COUNT[g]||GRADE_COUNT.B;
  const seed=nameHash(p.name);
  const ov=PLAY_OVERRIDE[p.name];
  const heroId = (ov&&ov[0]&&TRAIT_MAP[ov[0]]) ? ov[0] : (p.playKey&&TRAIT_MAP[p.playKey]?p.playKey:null);
  const gp=traitPoolFor(p.role,true);
  let goodIds=[];
  if(heroId) goodIds.push(heroId);
  const goodCand=seededShuffle(gp.fit.filter(t=>!goodIds.includes(t.id)),seed).concat(seededShuffle(gp.rest,seed+7));
  for(const t of goodCand){ if(goodIds.length>=cnt.good) break; if(!goodIds.includes(t.id)) goodIds.push(t.id); }
  const bp=traitPoolFor(p.role,false);
  const badCand=seededShuffle(bp.fit,seed+13).concat(seededShuffle(bp.rest,seed+29));
  const badIds=badCand.slice(0,cnt.bad).map(t=>t.id);
  p.good=goodIds; p.bad=badIds;
  p.cure={};
  const hero = heroId?TRAIT_MAP[heroId]:(TRAIT_MAP[goodIds[0]]||null);
  p.playKey = hero?hero.id:null;
  p.playName = (ov&&ov[0]===heroId&&ov[1])?ov[1]:(hero?hero.n:'균형형');
  return p;
}
/* 특성 합계 */
function traitIds(p){ return ((p&&p.good)||[]).concat((p&&p.bad)||[]); }
function traitSum(p,key){ let s=0; const ids=traitIds(p); for(const id of ids){ const t=TRAIT_MAP[id]; if(t&&t.e&&t.e[key]) s+=t.e[key]; } return s; }
function traitDefs(p, goodOnly){ const ids=goodOnly===true?(p.good||[]):goodOnly===false?(p.bad||[]):traitIds(p); return ids.map(id=>TRAIT_MAP[id]).filter(Boolean); }
function playOf(p){ return p&&p.playKey?TRAIT_MAP[p.playKey]:null; }
function playName(p){ return (p&&p.playName)||(playOf(p)||{}).n||'균형형'; }
function playIcon(p){ const t=playOf(p); return t?({라인전:'🗡',교전:'⚔️',운영:'🧭',오브젝트:'🐉',멘탈:'🧠',챔프폭:'🎲',시야:'👁',리스크:'🔥'}[t.c]||'✦'):'✦'; }
/* 이름/태그로 특성 찾기 (에디터) */
function findTrait(id){ return TRAIT_MAP[id]||null; }

function teamChemistry(team){
  const ps=ROLES.map(r=>S.players[team.lineup[r]]).filter(Boolean);
  if(!ps.length) return 0;
  let sum=0; ps.forEach(p=>{ sum += persMod(p,'chem'); });
  const base=sum/ps.length;
  /* 페어 케미(선수 간 관계) 반영 */
  let pair=0,cnt=0;
  if(typeof chemOf==='function'){
    for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){ pair+=chemOf(ps[i].name,ps[j].name,team.id); cnt++; }
  }
  const avg=cnt?pair/cnt:50;
  return base+(avg-50)/34;

function coachFit(teamId){

  const t=S.teams[teamId]; if(!t) return 0;
  const ps=ROLES.map(r=>S.players[t.lineup[r]]).filter(Boolean);
  let fit=0;
  ps.forEach(p=>{

/* ---------- playstyle / trait effects ---------- */
function traitChampAffinity(t,c,role){
  const e=t.e||{}; let a=0;
  if(e.lane) a += (c.cv[0]>=4?0.55:0.2);
  if(e.fight) a += (c.tags.fight>=2?0.55:0.15);
  if(e.obj) a += ((c.tags.engage||0)>=2?0.45:0.1);
  if(e.macro) a += ((c.tags.split||0)>=2?0.45:0.12);
  if(e.vision) a += ((role==='SUP'||role==='JGL')?0.45:0.1);
  if(e.pool) a += (c.r.length>1?0.55:0.2);
  if(e.mental) a += 0.15;
  if(e.risk) a -= 0.12;
  return a;
}
/* 특정 챔피언/라인에서 선수 성향이 얼마나 맞는지 (0 ~ +7) */
function styleSynergy(p,c,role){
  if(!p||!c) return 0;
  role=role||p.role;
  const hero=p.playKey?TRAIT_MAP[p.playKey]:null;
  let s=0;
  traitDefs(p,true).forEach(t=>{
    const w = (t===hero)?1.5:0.55;
    s += traitChampAffinity(t,c,role)*w;
  });
  if(!c.r.includes(role)){
    const flexOk=(p.playKey==='joker'||p.playKey==='multiRole'||p.playKey==='flexAce'||p.playKey==='champOcean');
    s += flexOk?2.4:-1.8;
    s += traitSum(p,'pool')*0.45;
  }
  return Math.max(-3, Math.min(7, s));
}
/* 팀 특성 총합 (경기 시뮬레이션용) */
function teamTraitEdge(team){
  const ps=lineupOf(team);
  let fight=0,macro=0,obj=0,vision=0,risk=0,lane=0;
  ps.forEach(p=>{ fight+=traitSum(p,'fight'); macro+=traitSum(p,'macro'); obj+=traitSum(p,'obj');
    vision+=traitSum(p,'vision'); risk+=traitSum(p,'risk'); lane+=traitSum(p,'lane'); });
  return {fight,macro,obj,vision,risk,lane};
}
function champFit(p,c,role){
  role=role||p.role;
  let f=0.96;
  if(!c.r.includes(role)) f-=0.07;
  if(p.role!==role) f-=0.02;
  if(p.sigs.includes(c.n)) f+=0.05;
  f+=(p.stats.pool-72)/900 + traitSum(p,'pool')*0.0015;
  return f;
}
function laneScore(p,c,role){
  if(!p||!c) return 55;
  role=role||p.role;
  let s=(75+(effRating(p)-75)*0.8)*champFit(p,c,role) + clamp((champTier(c)-3)*2,-3,3);
  s += traitSum(p,'lane')*0.7;
  s += (p.sigs.includes(c.n)?1.6:0);
  if(c.sigK==='lane'||c.sigK==='poke') s+=0.4;
  if(c.sigK==='scale'&&role!=='SUP') s+=0.2;
  return s;
}
/* 라인 상성 (내 챔프가 상대 챔프를 얼마나 이기는가) */
function counterScore(a,b){
  if(!a||!b) return 0;
  // lol.ps 실측 상성(같은 라인 맞대결 승률)이 있으면 그걸 우선한다
  if(typeof lolpsVs==='function'){
    const real=lolpsVs(a.n,b.n);
    if(real&&real.cnt>=200) return clamp((real.wr-50)/50*2.6,-2.8,2.8);
  }
  let s=0;
  s += ((a.tags.poke||0)-(b.tags.engage||0))*0.35;
  s += ((a.tags.engage||0)-(b.tags.poke||0))*0.3;
  s += ((a.cv[0]||3)-(b.cv[0]||3))*0.6;
  s += ((a.cc||0)-(b.cc||0))*0.25;
  s += ((a.f||0)-(b.f||0))*0.2;
  s += (a.d==='AD'&&b.d==='TANK')?0.4:0;
  s += (a.d==='TANK'&&b.d==='AD')?-0.3:0;
  // 챔피언 고유 특징 상성
  const A=a.sigK, B=b.sigK;
  if(A==='grab'&&(b.cc||0)<=1) s+=0.45;
  if(A==='poke'&&(b.tags.engage||0)<=1) s+=0.4;
  if(A==='dive'&&(b.cv[0]||3)<=2) s+=0.35;
  if(A==='duel'&&B==='scale') s+=0.3;
  if(A==='teamfight'&&B==='split') s+=0.3;
  if(A==='turret'&&B!=='duel') s+=0.25;
  if(A==='scale'&&(b.cv[0]||3)>=4) s-=0.35;
  if(A==='pickoff'&&(b.cc||0)>=3) s-=0.3;
  return clamp(s,-2.8,2.8);
}

/* ---------- comp evaluation ---------- */
function evalComp(picks){
  const cs=picks.map(x=>CHAMP_MAP[typeof x==='string'?x:(x&&x.champ)]).filter(Boolean);
  const tags={engage:0,poke:0,fight:0,split:0,scale:0};
  cs.forEach(c=>{for(const k in tags) tags[k]+=c.tags[k];});
  const ad=cs.filter(c=>c.d==='AD').length;
  const ap=cs.filter(c=>c.d==='AP').length;
  const tank=cs.filter(c=>c.d==='TANK').length;
  const front=cs.reduce((a,c)=>a+c.f,0);
  const cc=cs.reduce((a,c)=>a+c.cc,0);
  const curve=[0,0,0];
  cs.forEach(c=>c.cv.forEach((v,i)=>{curve[i]+=v;}));
  const n=Math.max(cs.length,1);
  const curveAvg=curve.map(v=>v/n);
  const tierAvg=cs.reduce((a,c)=>a+champTier(c),0)/n;
  let score=40+(tierAvg-3)*5+tags.fight*0.9+tags.engage*0.75+tags.scale*0.7+tags.poke*0.4+tags.split*0.35;
  const warnings=[],strengths=[];
  if(ad>=4&&ap===0){score-=7;warnings.push('풀 AD 조합 — 상대 방어막 스택에 취약');}
  else if(ap>=4&&ad===0){score-=7;warnings.push('풀 AP 조합 — 상대 마저 스택에 취약');}
  else if(ad>=1&&ap>=1) strengths.push('AD/AP 밸런스 양호');
  if(tank===0&&front<6){score-=5;warnings.push('탱커·프론트라인 부재 — 한타 진형 붕괴 위험');}
  else if(front>=8) strengths.push('든든한 프론트라인');
  if(tags.engage<5){score-=4;warnings.push('이니시 수단 부족');}
  else if(tags.engage>=9) strengths.push('강력한 이니시');
  if(cc<6){score-=3;warnings.push('CC 부족 — 픽오프에 취약');}
  if(curveAvg[2]>=3.7) strengths.push('후반 밸류 최상');
  if(curveAvg[0]>=3.5) strengths.push('초반 스노우볼');
  if(curveAvg[0]<2.4&&curveAvg[2]<3.2) warnings.push('파워 스파이크가 애매함');
  return {ad,ap,tank,front,cc,tags,curve:curveAvg,tierAvg,score:clamp(score,20,96),warnings,strengths,n};
}

/* ---------- game init ---------- */
function createState(teamId, opts){
  opts=opts||{};
  const st={
    version:2, season:1, week:1, phase:'regular', split:'spring', playoffSplit:null,
    springChampion:null, summerChampion:null, msi:null, ewc:null, msiChampion:null, ewcChampion:null,
    userTeam:teamId, teams:{}, players:{},
    schedule:[], results:[], weekAction:'scrim', weekActionTarget:null, actionApplied:false,
    gameplan:null, patchIdx:0, meta:{tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}}, patches:[],
    pog:{}, playoffs:null, worlds:null, champion:null, lckChampion:null, seriesWins:0, lastResult:null,
    fearless:true, history:[], trainingLog:[], worldsHistory:[], created:Date.now(),
  };
  TEAM_DEFS.forEach(def=>{
    const t={id:def.id,name:def.name,tag:def.tag,color:def.color,region:def.region||'LCK',budget:def.budget,tier:def.tier,
      tagline:def.tagline,roster:[],lineup:{},wins:0,losses:0,gw:0,gl:0,form:[],pogTotal:0};
    def.roster.forEach((r,idx)=>{
      const p=mkPlayer(r[0],r[1],r[2],r[3],r[4],r[5],def.id);
      p.starter=idx<5;
      st.players[p.name]=p;
      t.roster.push(p.name);
      if(idx<5) t.lineup[r[1]]=p.name;
    });
    st.teams[def.id]=t;
  });
  // free agents
  FA_DEFS.forEach(r=>{
    const p=mkPlayer(r[0],r[1],r[2],r[3],r[4],r[5],null);
    p.starter=false; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10;
    st.players[p.name]=p;
  });
  st.patchVer = (typeof LOLPS!=='undefined' && LOLPS.patch) ? (parseInt(String(LOLPS.patch).split('.')[1],10)||22) : 22;
  st.phase='kespa';
  const sb=buildStaff();
  st.staffLib=sb.lib; st.staff=sb.byTeam;
  st.owner={name:'박성수', role:'구단주'};
  st.offseason=null;
  st.schedule=genSchedule(lckIds());
  st.pog=Object.fromEntries(Object.keys(st.players).map(n=>[n,0]));
  S=st;
  try{ st.kespa=kespaInit(); st.splashPending='kespa'; }catch(e){}
  applyPatch(0,true);
  st.patchNotes=[realPatchRecord()];
  return st;
}
/* 실제 lol.ps 실측 메타를 PATCH 1 노트로 기록 (buff/nerf 를 지어내지 않는다) */
function realPatchRecord(){
  const v=(typeof LOLPS!=='undefined'&&LOLPS.patch)?LOLPS.patch:PATCHES[0].v;
  const p=PATCHES[0]||{};
  return {no:0, label:v, tag:'lol.ps 실측', real:true, name:p.name||('실측 메타 '+v),
    note:p.note||'lol.ps 실측 티어표 기준.', buffs:[], nerfs:[], obj:S.meta.obj,
    src:(typeof LOLPS!=='undefined')?LOLPS.src:'lol.ps',
    updated:(typeof LOLPS!=='undefined')?LOLPS.updated:'',
    week:S.week, season:S.season};
}
function lckIds(){ return TEAM_DEFS.filter(d=>(d.region||'LCK')==='LCK').map(d=>d.id); }

/* ---------- patches ---------- */
function applyPatch(idx, silent){
  const p=PATCHES[idx]; if(!p) return null;
  S.patchIdx=idx;
  if(!p.real){
    p.buffs.forEach(n=>{S.meta.tier[n]=(S.meta.tier[n]||0)+1;});
    p.nerfs.forEach(n=>{S.meta.tier[n]=(S.meta.tier[n]||0)-1;});
  }
  S.meta.obj=p.obj;
  S.patches.push({v:p.v,name:p.name,week:S.week});
  if(!silent) toast('🛠 패치 '+p.v+' 적용 — '+p.name);
  return p;
}

/* ---------- training: 좋은 특성 습득 / 나쁜 특성 극복 ---------- */
function traitLog(text,kind){
  if(!S) return;
  S.trainingLog=S.trainingLog||[];
  S.trainingLog.unshift({week:S.week,season:S.season,text,kind:kind||'t',at:Date.now()});
  if(S.trainingLog.length>40) S.trainingLog.pop();
}
function learnGoodTrait(p,chance){
  if(!p) return false;
  p.good=p.good||[];
  if(p.good.length>=12) return false;
  if(Math.random()>(chance===undefined?0.34:chance)) return false;
  const cand=seededShuffle(traitPoolFor(p.role,true).fit,nameHash(p.name+S.week+Date.now()%97), true)
    .filter(t=>!p.good.includes(t.id));
  const t=cand[0]; if(!t) return false;
  p.good.push(t.id);
  const msg='✨ 훈련 성과 — '+p.name+'이(가) 새 특성 ['+t.n+']을(를) 습득!';
  traitLog(msg,'good'); toast(msg,3200);
  return true;
}
function cureBadTrait(p,points){
  if(!p||!p.bad||!p.bad.length) return false;
  p.cure=p.cure||{};
  const ids=p.bad.slice();
  const target=ids.sort((a,b)=>(p.cure[b]||0)-(p.cure[a]||0))[0];
  p.cure[target]=(p.cure[target]||0)+points;
  if(p.cure[target]>=100){
    const t=TRAIT_MAP[target];
    p.bad=p.bad.filter(x=>x!==target); delete p.cure[target];
    const msg='🎉 훈련으로 나쁜 특성 ['+(t?t.n:target)+'] 극복! — '+p.name;
    traitLog(msg,'cure'); toast(msg,3600);
    return true;
  }
  return false;
}
function gainBadTrait(p,chance){
  if(!p) return false;
  p.bad=p.bad||[];
  if(p.bad.length>=6) return false;
  if(Math.random()>(chance===undefined?0.10:chance)) return false;
  const cand=seededShuffle(traitPoolFor(p.role,false).fit,nameHash(p.name+'bad'+S.week+Date.now()%89))
    .filter(t=>!p.bad.includes(t.id));
  const t=cand[0]; if(!t) return false;
  p.bad.push(t.id);
  const msg='⚠ '+p.name+'에게 나쁜 특성 ['+t.n+']이(가) 생겼습니다 — 훈련으로 극복하세요';
  traitLog(msg,'bad'); toast(msg,3200);
  return true;
}

/* ---------- weekly action ---------- */
function applyWeekAction(){
  if(S.actionApplied) return;
  const t=myTeam(); const act=S.weekAction;
  const starters=lineupOf(t);
  const all=t.roster.map(n=>S.players[n]).filter(Boolean);
  const focus=S.players[S.weekActionTarget]||starters.slice().sort((a,b)=>(b.bad||[]).length-(a.bad||[]).length)[0]||starters[0];
  const sm=staffTrainingMods(t.id);
  if(act==='scrim'){
    const k=1+(sm.scrim||0);
    starters.forEach(p=>{p.form=clamp(p.form+Math.round(ri(1,5)*k),15,100);p.fatigue=clamp(p.fatigue+ri(7,13),0,100);p.stats.macro=clamp(p.stats.macro+(Math.random()<.25?1:0),40,99);});
    // 스크림: 좋은 특성 습득 기회 (낮은 확률, 전원)
    starters.forEach(p=>{ if(Math.random()<0.28*(1+(sm.bloom||0))) learnGoodTrait(p,1); });
    toast('⚔️ 스크림 3일 — 팀 합과 실전 감각이 올라갔습니다');
  }else if(act==='solo'){
    const tg=focus;
    if(tg){
      const key=(sm.lane>0&&Math.random()<0.5)?'lane':pickOf(['lane','fight','pool']);
      tg.stats[key]=clamp(tg.stats[key]+ri(2,3)+((sm.lane||0)>0&&key==='lane'?1:0),40,99);
      tg.form=clamp(tg.form+ri(2,5),15,100); tg.fatigue=clamp(tg.fatigue+ri(4,8),0,100);
      learnGoodTrait(tg,0.45*(1+(sm.bloom||0)));
      cureBadTrait(tg,Math.round(ri(8,16)*(1+(sm.cure||0))));
    }
    starters.filter(p=>p!==tg).forEach(p=>{p.fatigue=clamp(p.fatigue+ri(3,7),0,100);p.form=clamp(p.form-ri(0,2),15,100);});
    toast('🎯 '+(tg?tg.name:'선수')+' 집중 훈련 완료 — 기량이 상승했습니다');
  }else if(act==='macro'){
    starters.forEach(p=>{p.stats.macro=clamp(p.stats.macro+ri(1,3)+((sm.macroC||0)>0?1:0),40,99);p.fatigue=clamp(p.fatigue+ri(5,9),0,100);p.form=clamp(p.form-ri(1,3),15,100);});
    starters.forEach(p=>{ if(Math.random()<0.2*(1+(sm.bloom||0))) learnGoodTrait(p,1); });
    if(focus) cureBadTrait(focus,Math.round(ri(5,10)*(1+(sm.cure||0))));
    toast('🧠 전술·운영 훈련 — 후반 운영 능력이 좋아졌습니다');
  }else if(act==='feedback'){
    all.forEach(p=>{p.form=clamp(p.form+ri(2,6),15,100);p.fatigue=clamp(p.fatigue-ri(4,9),0,100);});
    if(focus){ cureBadTrait(focus,Math.round(ri(24,40)*(1+(sm.cure||0)))); learnGoodTrait(focus,0.3*(1+(sm.bloom||0))); }
    const badOnes=all.filter(p=>(p.bad||[]).length>0);
    badOnes.forEach(p=>{ if(Math.random()<0.35) cureBadTrait(p,ri(4,9)); });
    toast('🧘 멘탈·피드백 — 나쁜 특성 극복 작업을 진행했습니다');
  }else if(act==='rest'){
    all.forEach(p=>{p.fatigue=clamp(p.fatigue-Math.round(ri(14,24)*(1+(sm.condition||0))),0,100);p.form=clamp(p.form+ri(3,8),15,100);});
    toast('😴 전면 휴식 — 컨디션이 크게 회복됐습니다');
  }
  // slump / fatigue / 습관성 악습
  all.forEach(p=>{
    if(p.fatigue>82 && Math.random()<.45){ p.form=clamp(p.form-ri(3,8),10,100); }
    if(p.form<35 && Math.random()<.3){ p.form=clamp(p.form+3,10,100); }
    if(p.fatigue>78 && Math.random()<0.16*(1-(sm.mentalC||0))) gainBadTrait(p,1);
    else if(p.form<45 && Math.random()<0.08*(1-(sm.mentalC||0))) gainBadTrait(p,1);
    p.fatigue=clamp(p.fatigue-2,0,100);
  });
  S.actionApplied=true;
  saveGame(); renderAll();
}

/* ---------- transfer market ---------- */
function freeAgents(){ return Object.values(S.players).filter(p=>p.fa && !p.team); }
function signFA(name, years){
  const p=S.players[name]; if(!p||!p.fa||p.team) return {ok:false,msg:'이미 영입된 선수입니다'};
  const t=myTeam();
  const sm=staffTrainingMods(t.id);
  let fee=p.fee||Math.round(p.salary*1.7*10)/10;
  fee=Math.round(fee*(1-(sm.scout||0))*10)/10;
  if(t.budget<fee) return {ok:false,msg:'예산 부족 (필요 '+fee.toFixed(1)+'억)'};
  if(t.roster.length>=9) return {ok:false,msg:'로스터 정원 초과 (최대 9명)'};
  t.budget=Math.round((t.budget-fee)*10)/10;
  p.team=t.id; p.fa=false; p.contract=Math.max(1,Math.min(3,Number(years)||2));
  t.roster.push(p.name);
  toast('✍️ '+p.name+' 영입 완료 — 이적료 '+fee.toFixed(1)+'억 · '+p.contract+'년 계약');
  saveGame(); renderAll(); return {ok:true};
}
function releasePlayer(name){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  if(t.roster.length<=6) return {ok:false,msg:'최소 6명은 유지해야 합니다'};
  const refund=Math.round(p.salary*0.3*10)/10;
  t.roster=t.roster.filter(n=>n!==name);
  Object.keys(t.lineup).forEach(r=>{if(t.lineup[r]===name) delete t.lineup[r];});
  p.team=null; p.fa=false; p.retired=true;
  t.budget=Math.round((t.budget+refund)*10)/10;
  ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  toast('🚪 '+name+' 방출 — '+refund.toFixed(1)+'억 회수');
  saveGame(); renderAll(); return {ok:true};
}
function setSeriesSub(role,name){
  const t=myTeam(); const p=S.players[name]; if(!p||p.team!==t.id) return {ok:false,msg:'우리 팀 선수가 아닙니다'};
  const cur=t.lineup[role];
  if(cur===name) return {ok:false,msg:'이미 해당 라인 선발입니다'};
  const oldRole=Object.keys(t.lineup).find(r=>t.lineup[r]===name);
  if(oldRole) t.lineup[oldRole]=cur;
  t.lineup[role]=name;
  saveGame();
  toast('🔄 '+ROLE_KR[role]+' 교체 — '+name+' 투입');
  return {ok:true};
}
function setStarter(role, name){
  const t=myTeam(); const p=S.players[name]; if(!p) return;
  const prev=t.lineup[role];
  const oldRole=Object.keys(t.lineup).find(r=>t.lineup[r]===name);
  if(oldRole) t.lineup[oldRole]=prev;
  t.lineup[role]=name;
  saveGame(); renderAll();
}

/* ---------- player editor ---------- */
function renamePlayer(oldName,newName){
  newName=String(newName||'').trim();
  if(!newName||newName===oldName) return {ok:true};
  if(S.players[newName]) return {ok:false,msg:'이미 같은 이름의 선수가 있습니다'};
  const p=S.players[oldName]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const team=p.team?S.teams[p.team]:null;
  delete S.players[oldName];
  p.name=newName;
  S.players[newName]=p;
  if(team){
    team.roster=team.roster.map(n=>n===oldName?newName:n);
    Object.keys(team.lineup).forEach(r=>{ if(team.lineup[r]===oldName) team.lineup[r]=newName; });
  }
  if(S.pog && S.pog[oldName]!==undefined){ S.pog[newName]=S.pog[oldName]; delete S.pog[oldName]; }
  (S.currentSeries&&S.currentSeries.games||[]).forEach(g=>{ if(g.mvp===oldName) g.mvp=newName; });
  return {ok:true};
}
function applyPlayerEdit(oldName, d){
  const p=S.players[oldName]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  if(d.name && d.name!==oldName){
    const r=renamePlayer(oldName,d.name); if(!r.ok) return r;
  }
  p.age=clamp(Number(d.age)||p.age,15,40);
  if(d.role && ROLES.includes(d.role)) p.role=d.role;
  ['lane','fight','macro','pool','mental'].forEach(k=>{ if(d[k]!==undefined) p.stats[k]=clamp(Number(d[k])||p.stats[k],40,99); });
  if(d.contract!==undefined) p.contract=clamp(Number(d.contract)||1,0,3);
  if(Array.isArray(d.persons)){ const arr=d.persons.filter(k=>PERS_MAP[k]).slice(0,3); if(arr.length){ p.persons=arr; p.pers=arr[0]; } }
  else if(d.pers&&PERS_MAP[d.pers]){ p.persons=[d.pers]; p.pers=d.pers; }
  if(d.exp!==undefined) p.exp=clamp(Number(d.exp)||0,0,99);
  if(d.photo!==undefined) p.photo=String(d.photo||'').slice(0,500);
  if(d.grade && GRADE_COUNT[d.grade] && d.grade!==p.grade){ p.grade=d.grade; rollTraits(p,d.grade); }
  if(Array.isArray(d.sigs)) p.sigs=d.sigs.filter(n=>!!CHAMP_MAP[n]).slice(0,6);
  if(Array.isArray(d.good)) p.good=d.good.filter(id=>TRAIT_MAP[id]&&TRAIT_MAP[id].g>0).slice(0,12);
  if(Array.isArray(d.bad)) p.bad=d.bad.filter(id=>TRAIT_MAP[id]&&TRAIT_MAP[id].g<0).slice(0,6);
  p.cure=p.cure||{};
  Object.keys(p.cure).forEach(id=>{ if(!(p.bad||[]).includes(id)) delete p.cure[id]; });
  if(d.playKey&&TRAIT_MAP[d.playKey]&&(p.good||[]).includes(d.playKey)){ p.playKey=d.playKey; p.playName=TRAIT_MAP[d.playKey].n; }
  const t=p.team?S.teams[p.team]:null;
  if(t && t.lineup[p.role]===undefined && Object.values(t.lineup).includes(p.name)){ /* keep */ }
  saveGame();
  return {ok:true};
}


/* ---------- 조합 아키타입 & 상성 카운터 ---------- */
const ARCH_LABEL={dive:'돌진·하드이니시',poke:'포킹·대치',anti:'받아치기·디스인게이지',split:'스플릿',pickoff:'글로벌·픽오프',protect:'보호·뚜벅이',scale:'후반 밸류',skirmish:'교전'};
const CHAMP_SETS={
  antiDash:['뽀삐','탈리야','벡스','카시오페아','아지르','브라움','자야','레나타 글라스크','리산드라'],

  immobileMelee:['가렌','다리우스','문도 박사','세트','우르곳','일라오이','모데카이저','나서스','트런들','볼리베어','초가스','사이온','신지드','럼블','말파이트','오른','우디르','워윅'],

  hypercarry:['코그모','징크스','베인','스몰더','아펠리오스','트위치','제리','카이사','자야','이즈리얼','세나'],
  peelSup:['룰루','나미','소라카','잔나','유미','밀리오','카르마','세라핀','모르가나','타릭','브라움','레나타 글라스크'],
  hookSup:['블리츠크랭크','쓰레쉬','노틸러스','파이크','레오나','알리스타','렐','라칸'],
  global:['녹턴','갈리오','트위스티드 페이트','탈리야','쉔','판테온','아우렐리온 솔'],
  artillery:['제라스','직스','벨코즈','럭스','조이','벡스'],
};
function compArchetype(names){
  const cs=names.map(n=>CHAMP_MAP[n]).filter(Boolean);
  const s={dive:0,poke:0,anti:0,split:0,pickoff:0,protect:0,scale:0,skirmish:0};
  cs.forEach(c=>{
    s.dive += (c.tags.engage||0)*1.2 + (c.cc||0)*0.45 + (c.sigK==='dive'?1.6:0);
    s.poke += (c.tags.poke||0)*1.3 + (c.sigK==='poke'?1.6:0) + (c.sigK==='turret'?0.7:0);
    s.anti += (c.cc>=2?0.5:0);
    s.split += (c.tags.split||0)*1.2 + (c.sigK==='duel'?1.6:0);
    s.pickoff += (c.sigK==='pickoff'?1.6:0)+(c.sigK==='grab'?0.6:0);
    s.protect += (c.sigK==='sustain'?1.3:0);
    s.scale += (c.tags.scale||0)*0.8 + (c.sigK==='scale'?1.6:0);
    s.skirmish += (c.tags.fight||0)*0.85;
  });
  names.forEach(n=>{
    if(CHAMP_SETS.antiDash.includes(n)) s.anti+=1.7;
    if(CHAMP_SETS.peelSup.includes(n)) s.protect+=1.5;

}

function kitCounters(myNames,oppNames){

/* ---------- DRAFT (official order + post-draft lane assignment) ---------- */
/* 공식 대회 밴픽 순서: 블루밴1·레드밴1·블루밴2·레드밴2·블루밴3·레드밴3 →
   블루픽1·레드픽1·레드픽2·블루픽2·블루픽3·레드픽3 →
   레드밴4·블루밴4·레드밴5·블루밴5 → 레드픽4·블루픽4·블루픽5·레드픽5 */
const DRAFT_ORDER = [
  {t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},
  {t:'pick',s:'blue'},{t:'pick',s:'red'},{t:'pick',s:'red'},{t:'pick',s:'blue'},{t:'pick',s:'blue'},{t:'pick',s:'red'},
  {t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},
  {t:'pick',s:'red'},{t:'pick',s:'blue'},{t:'pick',s:'blue'},{t:'pick',s:'red'},
];

function startDraft(series){
  if(!series) return;
  if(!(series.meta&&series.meta.pressDone===true)&&typeof pressNeededFor==='function'&&pressNeededFor(series)){
    S.currentSeries=series; saveGame(); openPress(series); return;
  }
  const oppId=series.oppId, meId=S.userTeam;
  const gameIdx=series.games.length;
  const mySide=series.sides[gameIdx]||'blue';
  D={
    series, gameIdx, mySide, oppId, step:0,
    bans:{blue:[],red:[]}, picks:{blue:[],red:[]},
    phase:'ban', done:false, roleFilter:'ALL',
    locked: series.fearless? series.fearlessUsed.slice():[],
    assign:{me:null,opp:null}, sel:null, result:null,
  };
  if(series.games.length>0){ const b=seriesStaffBonus(S.userTeam); if(b) series.nextEdge=(series.nextEdge||0)+b; }
  D.phase=dPhaseNow();
  renderDraft();
  if(dActor()==='opp') setTimeout(()=>{ if(D&&!D.done) aiDraftAct(); }, 460);
}
function otherSide(s){ return s==='blue'?'red':'blue'; }
function mySideKey(){ return D.mySide; }
function oppSideKey(){ return otherSide(D.mySide); }
function dMyPicks(){ return D.picks[D.mySide]||[]; }
function dOppPicks(){ return D.picks[otherSide(D.mySide)]||[]; }
function dMyBans(){ return D.bans[D.mySide]||[]; }
function dOppBans(){ return D.bans[otherSide(D.mySide)]||[]; }
function dCur(){ return DRAFT_ORDER[D.step]||null; }
function dActor(){ const c=dCur(); if(!c) return null; return c.s===D.mySide?'me':'opp'; }
function dPhaseNow(){ const c=dCur(); return c?c.t:'done'; }
function dUsed(){ return dMyBans().concat(dOppBans(),dMyPicks(),dOppPicks(),D.locked); }
function dAvailable(){ const used=new Set(dUsed()); return CHAMPS.filter(c=>!used.has(c.n)); }
function dBanCount(){ return dMyBans().length; }
function dPickCount(){ return dMyPicks().length; }

/* ---- AI ---- */
function PICK_EVAL_CACHE(picks){
  const cs=picks.map(x=>CHAMP_MAP[typeof x==='string'?x:x.champ]).filter(Boolean);
  return {
    ad:cs.filter(c=>c.d==='AD').length, ap:cs.filter(c=>c.d==='AP').length,
    front:cs.reduce((a,c)=>a+c.f,0), cc:cs.reduce((a,c)=>a+c.cc,0),
    tags:{engage:cs.reduce((a,c)=>a+c.tags.engage,0),fight:cs.reduce((a,c)=>a+c.tags.fight,0)},
  };
}
function aiPickChamp(){
  const avail=dAvailable(); if(!avail.length) return null;
  const opp=T(D.oppId); const players=lineupOf(opp);
  const comp=PICK_EVAL_CACHE(dOppPicks());
  let best=null,bestScore=-1e9;
  avail.forEach(c=>{
    let s=champTier(c)*3.4;
    let bestFit=-9;
    players.forEach(p=>{
      const sc=(laneScore(p,c,p.role)-72)*0.22 + styleSynergy(p,c,p.role)*0.5 + (p.sigs.includes(c.n)?4.2:0);
      if(sc>bestFit) bestFit=sc;
    });
    s+=bestFit;
    const t=c.tags;
    if(comp.ap===0&&c.d==='AP') s+=4.2;
    if(comp.ad===0&&c.d==='AD') s+=4.2;
    if(comp.front<3&&c.f>=2) s+=3.2;
    if(comp.tags.engage<4&&t.engage>=2) s+=3.4;
    if(comp.cc<4&&c.cc>=2) s+=2.4;
    if(c.r.length>1) s+=1.2;
    s+=rnd(-3,3);
    if(s>bestScore){bestScore=s;best=c;}
  });
  return best||avail[0];
}
function aiBanChamp(){
  const avail=dAvailable(); if(!avail.length) return null;
  const me=myTeam();
  let best=null,bs=-1e9;
  avail.forEach(c=>{
    let s=champTier(c)*4.6;
    let sig=0;
    Object.values(me.lineup).forEach(n=>{const p=S.players[n]; if(p&&p.sigs.includes(c.n)) sig+=7;});
    s+=sig;
    if(c.r.some(r=>ROLE_W[r]>=1.05)) s+=2;
    s+=rnd(-4,4);
    if(s>bs){bs=s;best=c;}
  });
  return best||avail[0];
}
function aiDraftAct(){
  if(!D||D.done) return;
  if(dActor()!=='opp') return;
  const cur=dCur(); if(!cur) return;
  if(cur.t==='ban'){
    const c=aiBanChamp(); if(!c) return;
    D.bans[otherSide(D.mySide)].push(c.n);
    D.anim={t:'ban', name:c.n, at:Date.now(), side:'opp'};
  }else{
    const c=aiPickChamp(); if(!c) return;
    D.picks[otherSide(D.mySide)].push(c.n);
    D.anim={t:'pick', name:c.n, at:Date.now(), side:'opp'};
  }
  advanceDraft();
}

/* ---- user actions ---- */
function draftMyBan(name){
  if(!D||D.done) return;
  const cur=dCur(); if(!cur||cur.t!=='ban'||dActor()!=='me') return;
  const c=CHAMP_MAP[name]; if(!c||dUsed().includes(name)) return;
  D.bans[D.mySide].push(name);
  D.anim={t:'ban', name:name, at:Date.now(), side:'me'};
  advanceDraft();
}
function draftMyPick(name){
  if(!D||D.done) return;
  const cur=dCur(); if(!cur||cur.t!=='pick'||dActor()!=='me') return;
  const c=CHAMP_MAP[name]; if(!c||dUsed().includes(name)) return;
  D.picks[D.mySide].push(name);
  D.anim={t:'pick', name:name, at:Date.now(), side:'me'};
  advanceDraft();
}
function advanceDraft(){
  D.step++;
  if(D.step>=DRAFT_ORDER.length){ enterAssign(); return; }
  D.phase=dPhaseNow();
  renderDraft();
  if(dActor()==='opp') setTimeout(()=>{ if(D&&!D.done) aiDraftAct(); }, 420);
}

/* ---- 포스트 드래프트 라인 배정 ---- */
function assignOptions(){ return ROLES.slice(); }
function assignScoreFor(p, champName, role){
  const c=CHAMP_MAP[champName]; if(!p||!c) return -999;
  let s=laneScore(p,c,role);
  s += styleSynergy(p,c,role)*1.1;
  if(p.role===role) s+=6;
  if(p.role!==role) s-=14;
  if(c.r[0]===role) s+=5;
  else if(c.r.includes(role)) s+=2.5;
  else s-=28;                       // 자연 포지션이 아닌 챔피언은 크게 감점
  if(p.sigs.includes(champName)) s+=3;
  // 플렉스/조커 성향만 오프롤 소화 가능
  const flex=(p.playKey==='joker'||p.playKey==='multiRole'||p.playKey==='flexAce'||p.playKey==='champOcean');
  if(!c.r.includes(role)&&flex) s+=16;
  return s;
}
function bestAssign(champNames, team){
  const players=ROLES.map(r=>S.players[team.lineup[r]]);
  const names=champNames.slice();
  let best=null, bestScore=-1e9;
  const perm=(arr,used,acc)=>{
    if(acc.length===5){
      let sc=0;
      ROLES.forEach((r,i)=>{ sc+=assignScoreFor(players[i],acc[i],r); });
      if(sc>bestScore){bestScore=sc;best=acc.slice();}
      return;
    }
    for(let i=0;i<arr.length;i++){
      if(used[i]) continue;
      used[i]=true; acc.push(arr[i]); perm(arr,used,acc); acc.pop(); used[i]=false;
    }
  };
  perm(names,new Array(names.length).fill(false),[]);
  const out={}; ROLES.forEach((r,i)=>{ out[r]=best?best[i]:(names[i]||null); });
  return out;
}
function aiAssign(champNames, teamId){ return bestAssign(champNames, T(teamId)); }
function recommendAssign(champNames){ return bestAssign(champNames, myTeam()); }

function enterAssign(){
  D.phase='assign';
  D.assign={ opp: aiAssign(dOppPicks(), D.oppId), me: recommendAssign(dMyPicks()) };
  D.result=evalDraft();
  renderDraft();
  saveGame();
}
function swapAssign(role, champName){
  if(!D||D.phase!=='assign') return;
  const a=D.assign.me;
  const prevRole=ROLES.find(r=>a[r]===champName);
  const prevChamp=a[role];
  if(prevRole) a[prevRole]=prevChamp;
  a[role]=champName;
  D.result=evalDraft();
  renderDraft();
}
function setAssign(role, champName){
  if(!D) return;
  if(D.assign&&D.assign.me) swapAssign(role,champName);
}
function confirmAssign(){
  if(!D) return;
  D.phase='done'; D.done=true; D.result=evalDraft(); D.sel=null;
  saveGame(); renderDraft();
}

/* ---- draft evaluation: 밴픽 우세도 ---- */
function assignedFor(sideKey){
  if(D&&D.assign&&D.assign[sideKey]) return D.assign[sideKey];
  if(sideKey==='me') return recommendAssign(dMyPicks());
  return aiAssign(dOppPicks(), D.oppId);
}
function evalDraft(){
  if(!D) return null;
  const me=T(S.userTeam), opp=T(D.oppId);
  const myA=assignedFor('me'), opA=assignedFor('opp');
  const lane={};
  let myStyle=0, opStyle=0;
  ROLES.forEach(r=>{
    const mp=S.players[me.lineup[r]], op=S.players[opp.lineup[r]];
    const mc=myA[r]?CHAMP_MAP[myA[r]]:null, oc=opA[r]?CHAMP_MAP[opA[r]]:null;
    const myBase=mp&&mc?laneScore(mp,mc,r):60;
    const opBase=op&&oc?laneScore(op,oc,r):60;
    const mySyn=mc?styleSynergy(mp,mc,r):0;
    const opSyn=oc?styleSynergy(op,oc,r):0;
    const ct=(mc&&oc)?counterScore(mc,oc):0;
    myStyle+=mySyn; opStyle+=opSyn;
    lane[r]={my:myBase+mySyn*0.9+ct*0.8, opp:opBase+opSyn*0.9-ct*0.8, counter:ct,
      myChamp:mc?mc.n:'', oppChamp:oc?oc.n:'', myPlayer:mp?mp.name:'', oppPlayer:op?op.name:'',
      myRole:mp?mp.role:'', oppRole:op?op.role:'', mySyn, opSyn};
  });
  const myComp=evalComp(dMyPicks()), oppComp=evalComp(dOppPicks());
  let laneAdv=0; ROLES.forEach(r=>{laneAdv+=(lane[r].my-lane[r].opp);}); laneAdv=laneAdv/5/2.5;
  // 사이드 보너스 (블루 1픽 우선권 / 레드 카운터픽)
  let sideBonus=0;
  if(D.mySide==='blue'){ sideBonus+=0.8; if(dMyPicks()[0]&&champTier(dMyPicks()[0])>=4) sideBonus+=0.9; }
  else { sideBonus+=0.8; const opFirst=dOppPicks()[0]; if(opFirst&&champTier(opFirst)>=4) sideBonus-=0.5; }
  const myArch=compArchetype(dMyPicks()), opArch=compArchetype(dOppPicks());
  const am=archMatchup(myArch,opArch);
  const kc=kitCounters(dMyPicks(),dOppPicks());
  const feedback=[...am.notes,...kc.notes];
  const compDiff=myComp.score-oppComp.score;
  const styleDiff=myStyle-opStyle;
  const myStaff=staffDraftBonus(S.userTeam), opStaff=staffDraftBonus(D.oppId);
  const staffDiff=myStaff-opStaff;
  const raw=compDiff*0.5 + laneAdv*2.6 + styleDiff*0.35 + sideBonus + staffDiff + am.v*2.4 + kc.v*0.9;
  const myPct=clamp(Math.round((50+raw*0.9)*10)/10,18,82);
  return {lane, myComp, oppComp, laneAdv, sideBonus, compDiff, styleDiff, staffDiff, myStaff, opStaff,
    myScore:myComp.score+laneAdv+styleDiff*0.4, oppScore:oppComp.score-laneAdv-styleDiff*0.4,
    myPct, oppPct:Math.round((100-myPct)*10)/10, assign:{me:myA,opp:opA}, myStyle, opStyle,
    arch:{me:myArch,opp:opArch,label:ARCH_LABEL}, archV:am.v, kitV:kc.v, feedback,
    staff:{me:staffAll(S.userTeam).map(st=>({name:st.name,role:st.role,rating:st.rating,traits:st.traits.slice()})),
           opp:staffAll(D.oppId).map(st=>({name:st.name,role:st.role,rating:st.rating,traits:st.traits.slice()}))}};
}

function startMatch(draftResult){
  if(!draftResult||!D) return;
  const me=T(S.userTeam), opp=T(D.oppId);
  const mySide=draftResult.mySide||D.mySide;
  const lane=draftResult.lane||{};
  ROLES.forEach(r=>{ if(!lane[r]) lane[r]={my:60,opp:60,counter:0,myChamp:'',oppChamp:'',myPlayer:'',oppPlayer:'',mySyn:0,opSyn:0}; });
  const myA=(draftResult.assign&&draftResult.assign.me)||{}, opA=(draftResult.assign&&draftResult.assign.opp)||{};
  const gp=S.gameplan||{jungle:'mid',laneSwap:false,firstObj:'grub',dive:false,invade:'none'};
  const myPower=teamPower(me), oppPower=teamPower(opp);
  const myTrait=teamTraitEdge(me), opTrait=teamTraitEdge(opp);
  const myCoach=staffMatchEdge(S.userTeam), opCoach=staffMatchEdge(D.oppId);
  const chemMe=teamChemistry(me), chemOp=teamChemistry(opp);
  const fitMe=coachFit(S.userTeam), fitOp=coachFit(D.oppId);
  const myPct=draftResult.myPct;
  const draftLogit=clamp((myPct-50)*0.034,-1.15,1.15);
  let edge=(myPower-oppPower)*0.9;
  const styleEdge=((myTrait.fight-opTrait.fight)*0.012 + (myTrait.obj-opTrait.obj)*0.012 + (myTrait.macro-opTrait.macro)*0.01 + (myTrait.vision-opTrait.vision)*0.008);
  if(gp.jungle==='top'){ edge+=(lane.TOP.my-lane.TOP.opp)*0.08; }
  if(gp.jungle==='bot'){ edge+=(lane.ADC.my-lane.ADC.opp)*0.08; }
  if(gp.laneSwap){ const botGap=lane.ADC.my-lane.ADC.opp; if(botGap<0) edge+=-botGap*0.14; edge-=0.4; }
  if(gp.dive) edge+=0.5;
  if(gp.invade==='steal') edge+=0.45;
  if(gp.invade==='ward') edge+=0.2;
  if(gp.jungle==='farm') edge+=0.15;
  edge += (S.seriesMomentum||0) + ((S.currentSeries&&S.currentSeries.nextEdge)||0);
  edge += (S.pressEdge||0)*0.55;
  try{
    const myNames=(D&&D.picks&&D.picks[D.mySide])||[];
    const opNames=(D&&D.picks&&D.picks[otherSide(D.mySide)])||[];
    if(typeof synergyBonus==='function') edge += synergyBonus(myNames)*0.35 - synergyBonus(opNames)*0.35;
  }catch(e){}
  // 상대 에이스 시그니처 밴 보상
  try{
    const myBans=(D&&D.bans&&D.bans[D.mySide])?D.bans[D.mySide]:[];
    const oppStars=ROLES.map(r=>S.players[opp.lineup[r]]).filter(Boolean).sort((a,b)=>rawOverall(b)-rawOverall(a)).slice(0,2);
    let banPay=0;
    oppStars.forEach(p=>{ (p.sigs||[]).forEach(x=>{ if(myBans.indexOf(x)>=0) banPay+=0.55; }); });
    edge += clamp(banPay,0,2.2);
  }catch(e){}
  if(myPower<oppPower) edge += (myCoach.underdog||0)*1.4;
  edge += (chemMe-chemOp)*0.35 + (fitMe-fitOp)*0.8;
  /* 미드-정글 / 봇듀오 케미 시너지 */
  if(typeof chemRoleEdge==='function'){ try{ edge += (chemRoleEdge(me)-chemRoleEdge(opp)); }catch(e){} }
  const ace=lineupOf(me).slice().sort((a,b)=>rawOverall(b)-rawOverall(a))[0];
  if(ace) edge += (myCoach.star||0)*(ace.form-70)*0.02;
  M={
    sec:0, minute:0, gold:[0,0], kills:[0,0], towers:[0,0], dragons:[0,0], grubs:[0,0], barons:[0,0], heralds:[0,0],
    dragonElems:{me:[],opp:[]}, soulType:{me:null,opp:null}, soulGranted:{me:false,opp:false},
    elderAt:null, elder:{me:false,opp:false}, elderUntil:{me:0,opp:0}, elderCount:[0,0],
    fights:[0,0], vision:[0,0], events:[], over:false, running:false, speed:4,
    edge, styleEdge:(styleEdge+(myCoach.order||0)*0.5-(opCoach.order||0)*0.5),
    draftLogit, draftPct:myPct, powerEdge:(myPower-oppPower)*0.9,
    coach:{me:myCoach,opp:opCoach}, earlyEdge:((myCoach.early||0)-(opCoach.early||0)),
    chem:{me:chemMe,opp:chemOp}, coachFit:{me:fitMe,opp:fitOp},
    mySide, oppId:opp.id, oppName:opp.name, myName:me.name,
    myComp:draftResult.myComp, oppComp:draftResult.oppComp, arch:draftResult.arch,
    lane, gp, stance:'standard', focusKey:null, stanceAt:0, focusAt:0,
    history:[], winProb:0.5, series:D.series, gameIdx:D.gameIdx,
    trait:{me:myTrait,opp:opTrait}, assign:{me:myA,opp:opA},
    lineups:{
      me:ROLES.map(r=>({role:r,name:(S.players[me.lineup[r]]||{}).name||'',champ:myA[r]||'',p:(S.players[me.lineup[r]]||{}).name||''})),
      opp:ROLES.map(r=>({role:r,name:(S.players[opp.lineup[r]]||{}).name||'',champ:opA[r]||'',p:(S.players[opp.lineup[r]]||{}).name||''}))
    },
    mvp:null, needTactic:false, pending:null, startStyle:myPct,
    campSteal:{me:0,opp:0}, campStealAtMe:-9, campStealAtOpp:-9, tpAt:null,
  };
  try{ if(typeof v5InitMatch==='function') v5InitMatch(); }catch(e){}
  M.tacticEdge=liveTacticEdge();
  lvInit();
  /* ---- 언더독 업셋 설계: 전력 열세일수록 치즈/카운터 전술의 변동성이 커진다 ---- */
  const underdogMe=myPower<oppPower;
  const cheeseCnt=(gp.invade==='steal'?1:0)+(gp.laneSwap?1:0)+(gp.dive?1:0)+(myPct<47?1:0);
  M.upset={under:underdogMe, gap:Math.max(0,oppPower-myPower), cheese:cheeseCnt};
  M.luckSwing=underdogMe?rnd(-0.045,0.075)*(1+Math.min(2,cheeseCnt)):rnd(-0.018,0.018);
  try{
    if(D&&D.series){ D.series.meta=D.series.meta||{}; D.series.meta.power={my:myPower,opp:oppPower}; }
  }catch(e){}
  M.winProb=winProb();
  M.history.push({min:0,diff:0});
  logEvent('sys','밴픽 완료 — '+me.name+' vs '+opp.name+', '+ (mySide==='blue'?'블루':'레드') +' 사이드');
  logEvent('sys','밴픽 우세도 '+myPct.toFixed(0)+'% : '+(100-myPct).toFixed(0)+'% · 상대 조합: '+dOppPicks().join(' · '));
  renderMatch(); startTimer();
}
/* ---------- 시뮬레이션 클럭 (배속 즉시 반영 · rAF 누적기) ---------- */
const SIM_BASE_MS=620;   // 1x = 게임 1초당 620ms
const SIMCLK={raf:null,last:0,acc:0,lastRender:0,stale:0};
function startTimer(){
  if(typeof requestAnimationFrame!=='function'){ /* 헤드리스 폴백 */
    stopTimer();
    TIMER=setInterval(()=>{ if(!M||M.over||!M.running) return; tick(); try{ renderMatch(); }catch(e){} }, Math.max(16,Math.round(SIM_BASE_MS/(M.speed||1))));
    return;
  }
  if(SIMCLK.raf) return;
  SIMCLK.last=0; SIMCLK.acc=0; SIMCLK.lastRender=0;
  const loop=(ts)=>{
    if(!SIMCLK.raf) return;
    SIMCLK.raf=requestAnimationFrame(loop);
    if(!M||M.over||!M.running){ SIMCLK.last=ts; SIMCLK.acc=0; return; }
    if(!SIMCLK.last) SIMCLK.last=ts;
    const dt=Math.max(0,Math.min(250, ts-SIMCLK.last)); SIMCLK.last=ts;
    const sp=clamp(Number(M.speed)||1,1,8);
    SIMCLK.acc += dt*sp/SIM_BASE_MS;
    let steps=Math.floor(SIMCLK.acc);
    if(steps>900){ steps=900; SIMCLK.acc=0; }
    else SIMCLK.acc-=steps;
    for(let i=0;i<steps && M && !M.over;i++) tick(true);
    if(ts-(SIMCLK.lastRender||0)>=64){ SIMCLK.lastRender=ts; try{ renderMatch(); }catch(e){} }
  };
  SIMCLK.raf=requestAnimationFrame(loop);
}
function stopTimer(){
  if(SIMCLK.raf){ try{ cancelAnimationFrame(SIMCLK.raf); }catch(e){} SIMCLK.raf=null; }
  if(TIMER){clearInterval(TIMER);TIMER=null;}
}
function speedUI(){

function setSpeed(s){

}
function togglePlay(){ if(!M) return; M.running=!M.running; SIMCLK.acc=0; renderMatch(); }

function logEvent(kind,text,minute){
  if(!M) return;
  text=String(text).replace(/^\d+분 · /,'');
  M.events.unshift({kind,text,minute:minute===undefined?M.minute:minute});

function curveAt(comp,min){
  const c=comp.curve;
  if(min<15) return c[0];
  if(min<25) return c[1];
  return c[2];
}
function winProb(){
  if(!M) return 0.5;
  const lvEdge=(M.lvEdge!=null?M.lvEdge:0);
  const gd=M.gold[0]-M.gold[1];
  const kd=M.kills[0]-M.kills[1];
  const td=M.towers[0]-M.towers[1];
  const dd=M.dragons[0]-M.dragons[1];
  const bd=M.barons[0]-M.barons[1];
  const cd=curveAt(M.myComp,M.minute)-curveAt(M.oppComp,M.minute);
  const tf=clamp(M.minute/14,0.3,1);
  const st=M.stance?STANCE_MAP[M.stance]:null;
  const lateStance=(st&&st.late&&M.minute>=25)?st.late:0;
  const pe=(M.powerEdge||0);
  const underdog=pe<0?clamp(1+Math.abs(pe)*0.075,1,2.6):1;
  let s=(gd/2500)*tf + kd*0.05 + td*0.07 + dd*0.13 + bd*0.4 + cd*0.16
    + M.draftLogit*(pe<0?1.9:1) + pe*0.02 + (M.styleEdge||0) + (M.tacticEdge||0)*underdog + lateStance
    + lvEdge + (M.luckSwing||0)
    + ((M.soulGranted&&M.soulGranted.me)?0.12:0) - ((M.soulGranted&&M.soulGranted.opp)?0.12:0)
    + ((M.elder&&M.elder.me&&M.minute<=(M.elderUntil.me||0))?0.3:0) - ((M.elder&&M.elder.opp&&M.minute<=(M.elderUntil.opp||0))?0.3:0)
    + (M.minute<=12?(M.earlyEdge||0)*0.35:0)
    + (M.scuttleEdge||0) + (typeof v5VisionScoreEdge==='function'?v5VisionScoreEdge():0);
  return clamp(sig(s),0.03,0.97);
}
function sideIdx(team){ return team==='me'?0:1; }
function addGold(team,amount){ M.gold[sideIdx(team)]+=Math.round(amount); }
function lineupAt(team,role){ return (M.lineups[team==='me'?'me':'opp'].find(x=>x.role===role)||{}); }
function myChampAt(role){ return lineupAt('me',role).champ||'챔피언'; }
function oppChampAt(role){ return lineupAt('opp',role).champ||'챔피언'; }
function myNameAt(role){ return lineupAt('me',role).name||'우리 팀'; }
function oppNameAt(role){ return lineupAt('opp',role).name||'상대'; }
function playerAt(team,role){ const l=lineupAt(team,role); return S.players[l.name]||null; }

function weightedPick(items,weights){
  const total=weights.reduce((a,b)=>a+b,0); let r=Math.random()*total;
  for(let i=0;i<items.length;i++){ r-=weights[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}

function tickBody(silent){
  if(!M||M.over) return;
  if(!M.running&&!M.over){ return; }
  M.sec=(M.sec||0)+1;
  /* 03:30 바위게 — 초 단위로 정확히 한 번 */
  try{ if(typeof v5Scuttle==='function'&&(!M.scuttleWar||!M.scuttleWar.fired)&&M.sec>=V5_SCUTTLE_SEC) v5Scuttle(); }catch(e){}
  if(!M.lv) lvInit();
  lvTick(1);
  if(M.sec%60===0) simStep(silent);
  else {
    // 초 단위 잔잔한 진행: 골드 소폭 증가
    M.gold[0]=Math.round((M.gold[0]||0)+rnd(3,9));
    M.gold[1]=Math.round((M.gold[1]||0)+rnd(3,9));
    if(M.history&&(M.sec%5===0)) M.history.push({min:M.sec/60,diff:M.gold[0]-M.gold[1]});
  }
  M.winProb=winProb();
  if(!silent) renderMatch();
}

/* ============ 챔피언 레벨 1~18 ============ */
const LV_MAX=18, ULT_LEVELS=[6,11,16];
const LV_XP=[0];
for(let n=2;n<=LV_MAX;n++) LV_XP[n]=Math.round(43*Math.pow(n-1,1.3));
/* 솔로 라인(탑·미드)이 가장 빠르고, 정글은 중간, 봇/서폿은 경험치를 나눠 1~2렙 뒤진다 */
const LV_RATE={TOP:1.00,MID:1.00,JGL:0.90,ADC:0.72,SUP:0.58};
function lvInit(){
  M.lv={me:{},opp:{}}; M.xp={me:{},opp:{}}; M.lvUlt={me:0,opp:0}; M.lvEdge=0;
  ROLES.forEach(r=>{ ['me','opp'].forEach(s=>{ M.lv[s][r]=1; M.xp[s][r]=0; }); });
}
function lvOf(side,role){ return (M&&M.lv&&M.lv[side]&&M.lv[side][role])||1; }
function lvFromXp(xp){ let n=1; for(let i=2;i<=LV_MAX;i++){ if(xp>=LV_XP[i]) n=i; else break; } return n; }
function lvAddXp(side,role,amt){
  if(!M||!amt) return;
  if(!M.lv) lvInit();
  if(!M.lv[side]||M.lv[side][role]==null) return;
  const before=M.lv[side][role];
  M.xp[side][role]=(M.xp[side][role]||0)+amt;
  const now=lvFromXp(M.xp[side][role]);
  if(now>before){
    M.lv[side][role]=now;
    if(ULT_LEVELS.indexOf(now)>=0){
      M.lvUlt[side]=(M.lvUlt[side]||0)+1;
      const nm=side==='me'?M.myName:M.oppName;
      const l=lineupAt(side,role)||{};
      logEvent('sys','⬆ '+(l.name||nm)+' '+(l.champ||ROLE_KR[role])+' <b>Lv.'+now+'</b> — 궁극기 강화'+(now>=16?' (최종 3레벨)':''));
    }
  }
}
function lvTick(ds){
  if(!M||!M.lv) return;
  const m=M.minute||0;
  const adv=(M.winProb||0.5)-0.5;
  ['me','opp'].forEach(side=>{
    const a=side==='me'?adv:-adv;
    ROLES.forEach(r=>{
      let rate=(LV_RATE[r]||0.8);
      if(m<3) rate*=1.04;            // 초반 웨이브 경험치
      rate+=a*0.06;                   // 라인 주도권 → 경험치 우위
      lvAddXp(side,r,rate*(ds||1));
    });
  });
  M.lvEdge=lvEdgeNow();
}
function lvTeamAvg(side){ let s=0; ROLES.forEach(r=>s+=lvOf(side,r)); return s/5; }
function lvEdgeNow(){
  if(!M||!M.lv) return 0;
  const d=lvTeamAvg('me')-lvTeamAvg('opp');
  const ult=(M.lvUlt.me||0)-(M.lvUlt.opp||0);
  return d*0.014 + ult*0.010;   // 승률 로짓 기여 (레벨·궁극기 급점)
}
function tick(silent){
  try{ tickBody(silent); }
  catch(e){
    try{ logEvent('sys','⚠ 시뮬레이션 예외 — '+e.message); }catch(_){}
    if(M){ M.over=true; M.running=false; stopTimer(); }
    try{ if(S.currentSeries&&!S.currentSeries.done){ if(S.currentSeries.score.me+S.currentSeries.score.opp===0){ S.currentSeries.score.me+=M.meWin===false?0:1; } renderSeriesResult(); } else renderAll(); }catch(_){}
  }
}
function simStep(silent){
  if(!M||M.over) return;
  if(!M.lane) M.lane={TOP:{my:60,opp:60},MID:{my:60,opp:60},ADC:{my:60,opp:60},JGL:{my:60,opp:60},SUP:{my:60,opp:60}};
  M.minute++;
  const m=M.minute;
  /* 시간대가 끝난 전술은 자동 종료하고, 지금 쓸 수 있는 운영 전술로 바꾼다 */
  if(M.focusKey&&FOCUS_MAP[M.focusKey]){
    const tm=tacticTimeOk(M.focusKey);
    if(!tm.ok){
      const oldN=FOCUS_MAP[M.focusKey].n;
      M.focusKey=null; M.tacticEdge=liveTacticEdge();
      logEvent('sys','⏱ '+oldN+' 종료 — '+tm.why);
      try{
        const cands=FOCUS_TACTICS.filter(f=>f.cat!=='early'&&tacticTimeOk(f.k).ok&&tacticUnlocked(f.k).ok);
        if(cands.length){
          const best=cands.slice().sort((a,b)=>(b.edge||0)-(a.edge||0))[0];
          M.focusKey=best.k; M.tacticEdge=liveTacticEdge();
          logEvent('sys','📋 전술 전환 → '+best.icon+' '+best.n+' — '+m+'분, '+best.d);
        }
      }catch(e){}
    }
  }
  const sta=STANCE_MAP[M.stance]||STANCE_MAP.standard;
  const fo=M.focusKey?FOCUS_MAP[M.focusKey]:null;
  // 마일스톤 알림 (진행을 막지 않음)
  MILESTONES.forEach(ms=>{ if(ms.m===m) logEvent('sys','⏱ '+ms.n); });
  // 골드
  const LN=M.lane||{TOP:{my:60,opp:60},MID:{my:60,opp:60},ADC:{my:60,opp:60}};
  const eco=((LN.TOP.my-LN.TOP.opp)+(LN.MID.my-LN.MID.opp)+(LN.ADC.my-LN.ADC.opp))*0.9;
  const macroDiff=(M.trait.me.macro-M.trait.opp.macro)*6;
  const stanceGold=(sta.gold||0)*40;
  addGold('me', 620+eco*1.1+macroDiff+stanceGold+rnd(-35,35));
  addGold('opp', 620-eco*1.1-macroDiff-stanceGold+rnd(-35,35));
  if(sta.late&&m>=25) addGold('me',40);
  if(fo&&fo.gold) addGold('me',Math.round(fo.gold*700));
  if(fo&&fo.late&&m>=25) addGold('me',35);
  const p=winProb();
  const killFavor=clamp(0.5+(p-0.5)*0.6,0.12,0.88);
  const aggr=Math.max(0.35,1+(sta.aggr||0)+((fo&&fo.fight)||0)*0.4);
  // 라인 킬
  if(Math.random()<Math.max(0.12,0.30*aggr+(fo&&fo.kill?fo.kill:0))){
    const lb=(fo&&fo.laneBias)||{};
    const laneBias={TOP:lb.TOP||1,MID:lb.MID||1,ADC:lb.ADC||1};
    if(fo){ if(fo.mm==='top') laneBias.TOP=2.4; if(fo.mm==='bot'||fo.mm==='diveBot') laneBias.ADC=2.4; if(fo.mm==='mid') laneBias.MID=2.2; if(fo.mm==='assassin') laneBias.MID=1.9; }
    const role=weightedPick(ROLES, ROLES.map(r=>{
      const L=M.lane[r]||{my:60,opp:60};
      return (0.7+Math.abs((L.my||60)-(L.opp||60))*0.3)*(laneBias[r]||1);
    }));
    const L=M.lane[role]||{my:60,opp:60};
    let laneFavor=clamp(0.5+(L.my-L.opp)*0.05+(p-0.5)*0.5,0.08,0.92);
    if(M.soulGranted.me) laneFavor=clamp(laneFavor+0.02,0.08,0.94);
    if(M.elder.me&&m<=(M.elderUntil.me||0)) laneFavor=clamp(laneFavor+0.05,0.08,0.95);
    if(M.stance==='aggro') laneFavor=clamp(laneFavor+0.04,0.08,0.93);
    if(M.stance==='defensive') laneFavor=clamp(laneFavor-0.03,0.07,0.92);
    const meWins=Math.random()<laneFavor;
    const team=meWins?'me':'opp';
    addGold(team,300); M.kills[sideIdx(team)]++;
    lvAddXp(team,role,30);
    ROLES.forEach(r=>{ if(r!==role) lvAddXp(team,r,8); });
    const champ=team==='me'?myChampAt(role):oppChampAt(role);
    const nm=team==='me'?myNameAt(role):oppNameAt(role);
    const pl=playerAt(team,role);
    const flavour=styleLine(pl);
    const cdef=CHAMP_MAP[champ];
    const sigLine=(cdef&&cdef.sig)?('<i>'+cdef.sig.split('·')[0].trim()+'</i>'):'';
    const sideCls=team==='me'?'blue':'red';
    if(Math.random()<0.42){

      logEvent(sideCls, m+'분 · <b>'+nm+'</b>('+champ+') 솔로킬! '+(sigLine?sigLine+' — ':'')+(flavour?'<i>'+flavour+'</i> · ':'')+ROLE_KR[role]+'에서 '+victim+'를 잡아냅니다.');
    }else{
      const gankRole=pickOf(ROLES.filter(r=>r!==role));
      const gankName=team==='me'?myNameAt(gankRole):oppNameAt(gankRole);
      const gankChamp=team==='me'?myChampAt(gankRole):oppChampAt(gankRole);
      const gc=CHAMP_MAP[gankChamp];
      logEvent(sideCls, m+'분 · '+ROLE_KR[role]+' 로밍 킬 — <b>'+gankName+'</b>('+gankChamp+')이(가) '+(gc&&gc.sig?'<i>'+gc.sig.split('·')[0].trim()+'</i>으로 ':'')+(flavour?flavour+'으로 ':'')+'마무리합니다.');
    }
  }
  // 픽오프 (바론/용 시야 낚시)
  if(fo&&fo.pickoff&&Math.random()<fo.pickoff*0.5){

    const team=meWins?'me':'opp';

    addGold(team,380); M.kills[sideIdx(team)]++;
