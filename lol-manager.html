    ctx.fillStyle='rgba(70,160,90,.35)'; ctx.fill();
    ctx.strokeStyle='rgba(140,230,160,.25)'; ctx.lineWidth=.8; ctx.stroke();
  });
  // 강 (굽이치는 형태)
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(30,110,170,.45)'; ctx.lineWidth=Math.max(20,w*0.09);
  ctx.beginPath(); ctx.moveTo(w*0.10,h*0.22);
  ctx.bezierCurveTo(w*0.32,h*0.30,w*0.44,h*0.46,w*0.50,h*0.50);
  ctx.bezierCurveTo(w*0.58,h*0.56,w*0.68,h*0.68,w*0.88,h*0.80); ctx.stroke();
  ctx.strokeStyle='rgba(90,200,255,.20)'; ctx.lineWidth=Math.max(8,w*0.035);
  ctx.beginPath(); ctx.moveTo(w*0.10,h*0.22);
  ctx.bezierCurveTo(w*0.32,h*0.30,w*0.44,h*0.46,w*0.50,h*0.50);
  ctx.bezierCurveTo(w*0.58,h*0.56,w*0.68,h*0.68,w*0.88,h*0.80); ctx.stroke();
  }
  // 오브젝트 핏 알코브
  const alcove=(x,y,col,r2)=>{ ctx.beginPath(); ctx.arc(x*w,y*h,r2,0,7);
    ctx.fillStyle='rgba(8,14,22,.9)'; ctx.fill(); ctx.strokeStyle=col+'77'; ctx.lineWidth=1.4; ctx.stroke(); };
  alcove(0.70,0.72,'#ff8a5c',Math.max(13,w*0.05));
  alcove(0.30,0.28,'#b98cff',Math.max(13,w*0.05));
  // 기지 (넥서스·억제기)

    ctx.beginPath(); ctx.moveTo(w*0.055,h*0.045); ctx.lineTo(w*0.04,h*0.03); ctx.lineTo(w*0.055,h*0.015); ctx.closePath(); ctx.fill();
    ctx.restore();

  basePlate(0.09,0.91,'#2f9bdc',false); basePlate(0.91,0.09,'#d0455f',true);
  // 라인
  const drawLane=(pts,width)=>{

    seg(Math.min(0.99,ft+0.01),1,'255,85,112');

  ribbon('TOP'); ribbon('MID'); ribbon('BOT');
  // 기지
  const drawBase=(x,y,col)=>{
    ctx.beginPath(); ctx.arc(x*w,y*h,Math.max(9,w*0.037),0,7);
    ctx.fillStyle=col; ctx.globalAlpha=.9; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.4; ctx.stroke();
  };

  // 오브젝트 핏
  const soulActive=M.soulGranted&&(M.soulGranted.me||M.soulGranted.opp);
  const elderActive=M.elderAt&&M.minute>=M.elderAt;
  const pitIcon=(kind,icon)=>kind==='dragon'?(soulActive?'💠':icon):kind==='baron'&&elderActive?'🐲':icon;
  const pitCol=(kind,col)=>kind==='dragon'?(soulActive?'#b98cff':col):kind==='baron'&&elderActive?'#ff5c9a':col;
  [['dragon',0.70,0.72,'🐉','#ff8a5c'],['baron',0.30,0.28,'👁','#b98cff'],['grub',0.28,0.32,'🪱','#ffc94a']].forEach(([kind,x,y,icon0,col0])=>{
    const icon=pitIcon(kind,icon0), col=pitCol(kind,col0);
    const dead=MM.marks.some(mk=>mk.type===kind&&(M.minute-mk.at)<4);
    ctx.beginPath(); ctx.arc(x*w,y*h,Math.max(8,w*0.032),0,7);
    ctx.fillStyle=dead?'rgba(70,80,100,.5)':'rgba(20,30,44,.9)'; ctx.fill();
    ctx.strokeStyle=dead?'rgba(120,130,150,.45)':col+'cc'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.font=`${Math.round(w*0.032)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=dead?0.3:0.95; ctx.fillStyle='#fff'; ctx.fillText(icon,x*w,y*h); ctx.globalAlpha=1;
  });
  // 타워 & 잔해
  const drawTower=(x,y,side,destroyed)=>{
    ctx.save(); ctx.translate(x*w,y*h);
    if(destroyed){
      ctx.strokeStyle='rgba(160,170,190,.45)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-3,-3); ctx.lineTo(3,3); ctx.moveTo(3,-3); ctx.lineTo(-3,3); ctx.stroke();
    }else{
      ctx.fillStyle=side==='me'?'#3aa8e0':'#e0566f';
      ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(3.2,2.6); ctx.lineTo(-3.2,2.6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=.7; ctx.stroke();
    }
    ctx.restore();
  };
  MAP_TOWERS.me.forEach((tp,i)=>drawTower(tp[0],tp[1],'me',i<(MM.towerIdx.me||0)));
  MAP_TOWERS.opp.forEach((tp,i)=>drawTower(tp[0],tp[1],'opp',i<(MM.towerIdx.opp||0)));
  // 미니언
  MM.minions.forEach(mn=>{
    if(!mn.alive) return;
    const p=mmPathPoint(LANE_PATH[mn.lane],mn.t);
    const x=(p[0]+mn.off)*w, y=(p[1]+mn.off)*h;
    const rad=Math.max(2.4,w*0.0098)*(mn.ranged?1.15:1);
    ctx.beginPath();
    if(mn.ranged){ ctx.rect(x-rad,y-rad,rad*2,rad*2); }
    else ctx.arc(x,y,rad,0,7);
    ctx.fillStyle=mn.side==='me'?'#4fc3ff':'#ff6b84';
    ctx.shadowColor=mn.side==='me'?'#25e0ff':'#ff4d6d'; ctx.shadowBlur=5;
    ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=.7; ctx.stroke();
  });
  // 발사체
  MM.proj.forEach(p=>{
    const x=p.x*w,y=p.y*h;
    ctx.beginPath(); ctx.arc(x,y,p.skill?3:1.8,0,7);
    ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
    if(p.skill){
      ctx.strokeStyle=p.col+'66'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.lineTo(x+(p.tx-p.x)*w*0.35,y+(p.ty-p.y)*h*0.35); ctx.stroke();
    }
  });
  // 챔피언
  ROLES.forEach(role=>{
    ['me','opp'].forEach(side=>{
      const k=mmTokenKey(side,role), u=MM.units[k]; if(!u) return;
      const line=M.lineups?lineupAt(side,role):null;
      const champ=(line&&line.champ)||ROLE_KR[role];
      const x=u.x*w, y=u.y*h;
      const r=Math.max(6,w*0.026);
      const col=SIDE_COL[side];
      if(!u.alive){
        const f=side==='me'?[0.10,0.90]:[0.90,0.10];
        const fx=f[0]*w, fy=f[1]*h;
        ctx.globalAlpha=.35;
        ctx.beginPath(); ctx.arc(fx,fy,r,0,7); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke();
        ctx.fillStyle=col; ctx.font=`900 ${Math.round(r*0.8)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(Math.ceil((u.deadUntil-now)/1000)+'',fx,fy);
        ctx.globalAlpha=1;
        return;
      }
      const glow=ctx.createRadialGradient(x,y,1,x,y,r*2.3);
      glow.addColorStop(0,col+'88'); glow.addColorStop(1,col+'00');
      ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(x,y,r*2.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(x,y,r,0,7);
      ctx.fillStyle=side==='me'?'#0d3a52':'#4a1420'; ctx.fill();
      ctx.lineWidth=1.8; ctx.strokeStyle=col; ctx.stroke();
      const im=champ?MM.imgs[champ]:null;
      if(im&&im.complete&&im.naturalWidth){
        ctx.save(); ctx.beginPath(); ctx.arc(x,y,r-0.6,0,7); ctx.clip();
        ctx.drawImage(im,x-r,y-r,r*2,r*2); ctx.restore();
        ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.lineWidth=1.8; ctx.strokeStyle=col; ctx.stroke();
      }else{
        ctx.fillStyle='#fff'; ctx.font=`900 ${Math.round(r*0.92)}px sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText((champ||'?').slice(0,1),x,y+0.5);
      }
      // 플레이어 IGN
      const ign=(line&&line.name)||'';
      if(ign){
        ctx.font=`900 ${Math.max(7,Math.round(w*0.019))}px Pretendard,sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        const tw=ctx.measureText(ign).width;
        ctx.fillStyle='rgba(4,8,14,.72)'; ctx.fillRect(x-tw/2-2,y-r-13,tw+4,10);
        ctx.fillStyle=side==='me'?'#bdf0ff':'#ffc2cd';
        ctx.fillText(ign,x,y-r-4);
      }
      // HP 바
      const bw=Math.max(14,r*2.1), bh=2.6;
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x-bw/2,y-r-6,bw,bh);
      const hp=Math.max(0,Math.min(1,u.hp/u.hpMax));
      ctx.fillStyle=hp>0.55?'#3ddc97':hp>0.28?'#ffc94a':'#ff4d6d';
      ctx.fillRect(x-bw/2,y-r-6,bw*hp,bh);
    });
  });
  // 이펙트
  MM.fx=MM.fx.filter(f=>now-f.at<(f.life||600));
  MM.fx.forEach(f=>{
    const age=(now-f.at)/(f.life||600);
    ctx.globalAlpha=Math.max(0,1-age);
    const x=f.x!=null?f.x*w:0, y=f.y!=null?f.y*h:0;
    if(f.type==='burst'){
      ctx.strokeStyle=f.col||'#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,y,6+age*Math.max(16,w*0.07),0,7); ctx.stroke();
      if(f.label){ ctx.fillStyle=f.col||'#fff'; ctx.font=`900 ${Math.round(w*0.025)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(f.label,x,y-10-age*8); }
    }else if(f.type==='ring'){
      ctx.strokeStyle=f.col||'#fff'; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(x,y,(f.r||0.04)*w*(0.4+age*2.6),0,7); ctx.stroke();
    }else if(f.type==='hit'){
      ctx.fillStyle=f.col||'#fff';
      for(let i=0;i<3;i++){ const a=(i/3)*6.28; ctx.beginPath(); ctx.arc(x+Math.cos(a)*age*8,y+Math.sin(a)*age*8,1.6,0,7); ctx.fill(); }
    }else if(f.type==='spark'){
      ctx.fillStyle='rgba(255,240,180,.9)'; ctx.beginPath(); ctx.arc(x,y,1.8,0,7); ctx.fill();
    }else if(f.type==='flash'){
      ctx.fillStyle='rgba(255,230,120,.85)';
      ctx.beginPath(); ctx.arc(x,y,(1-age)*Math.max(8,w*0.03),0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.4;
      for(let i=0;i<4;i++){ const a=i/4*6.28+f.at; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*w*0.04,y+Math.sin(a)*h*0.04); ctx.stroke(); }
    }else if(f.type==='laser'){
      ctx.strokeStyle=f.col||'#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(f.x1*w,f.y1*h); ctx.lineTo(f.x2*w,f.y2*h); ctx.stroke();
    }
    ctx.globalAlpha=1;
  });
  ctx.restore();
  // ---- 미니 PiP (줌 상태) ----
  if(z.s>1.06){
    const pw=Math.max(84,w*0.26), ph=pw, px=w-pw-10, py=10;
    ctx.save();
    ctx.beginPath(); ctx.rect(px,py,pw,ph); ctx.clip();
    ctx.fillStyle='#060a12'; ctx.fillRect(px,py,pw,ph);
    if(MM.mapReady&&MM.mapImg&&MM.mapImg.complete) ctx.drawImage(MM.mapImg,px,py,pw,ph);
    else { ctx.fillStyle='#0c1a24'; ctx.fillRect(px,py,pw,ph); }
    Object.keys(MM.units).forEach(k=>{
      const u=MM.units[k]; if(!u.alive) return;
      ctx.fillStyle=SIDE_COL[u.side];
      ctx.beginPath(); ctx.arc(px+u.x*pw,py+u.y*ph,1.7,0,7); ctx.fill();
    });
    const vw=pw/z.s, vh=ph/z.s;
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=1.2;
    ctx.strokeRect(px+(z.cx-vw/2)*pw,py+(z.cy-vh/2)*ph,vw*pw,vh*ph);
    ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.strokeRect(px,py,pw,ph);
    ctx.restore();
  }
  // HUD
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(6,6,Math.max(96,w*0.4),18);
  ctx.fillStyle=MM.phase==='fight'?'#ffc94a':MM.phase==='obj'?'#ff9e2c':'#8bd6ff';
  ctx.font=`900 ${Math.round(w*0.028)}px sans-serif`;
  const mm2=String(Math.floor(M.minute/60)).padStart(2,'0'), ss2=String(M.minute%60).padStart(2,'0');
  ctx.fillText(MM.phaseLabel+" · "+mm2+":"+ss2,12,10);
  ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(w-76,6,70,18);
  ctx.fillStyle='#9fb2cc'; ctx.font=`800 ${Math.round(w*0.024)}px sans-serif`; ctx.textAlign='right';
  ctx.fillText(M.kills[0]+' : '+M.kills[1],w-12,10);
  ctx.textAlign='left';
  if(M.soulGranted&&(M.soulGranted.me||M.soulGranted.opp)){
    const str='💠 '+(M.soulGranted.me?myTeam().tag:T(M.oppId).tag);
    ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(6,26,Math.max(60,w*0.2),15);
    ctx.fillStyle='#c4b1ff'; ctx.font=`800 ${Math.round(w*0.022)}px sans-serif`;
    ctx.fillText(str,11,28);
  }
}

function champImg(name,size,cls){
  const c=CHAMP_MAP[name];
  if(!c) return `<span class="cimg ph ${cls||''}" style="width:${size}px;height:${size}px">${esc((name||'?').slice(0,1))}</span>`;
  return `<img class="cimg ${cls||''}" src="${DD(c.k)}" alt="${esc(name)}" style="width:${size}px;height:${size}px" loading="lazy">`;

function mmKdaInit(){
  MM.kda={};
  ROLES.forEach(r=>{ MM.kda['me-'+r]={k:0,d:0,a:0}; MM.kda['opp-'+r]={k:0,d:0,a:0}; });
}
function mmKdaTick(){
  if(!MM.kda) mmKdaInit();
  ['me','opp'].forEach((side,idx)=>{
    const cur=M.kills[idx]||0, prev=MMDOM.kills[idx]||0;
    if(cur>prev){
      for(let n=0;n<Math.min(cur-prev,2);n++){
        const killers=ROLES.filter(r=>(MM.units[side+'-'+r]||{}).alive);
        const victims=ROLES.filter(r=>(MM.units[(side==='me'?'opp':'me')+'-'+r]||{}).alive);
        const k=killers.length?pickOf(killers):null;
        const v=victims.length?pickOf(victims):null;
        if(k){ MM.kda[side+'-'+k].k++; }
        if(v){ const vs=side==='me'?'opp':'me'; MM.kda[vs+'-'+v].d++; }
        killers.filter(r=>r!==k).slice(0,2).forEach(r=>{ MM.kda[side+'-'+r].a++; });
      }
    }
  });
  MMDOM.kills=(M.kills||[0,0]).slice();
}

let CAST_PH=-1, CAST_LINE=[];
function casterLines(){
  const m=M.minute;
  const last=(M.events||[]).find(e=>e.kind!=='sys');
  let key='lane';
  if(M.focusUntil>m||(M.fights[0]+M.fights[1]>0&&m>=20&&(m%3===0))) key='fight';
  if(mmObjectiveWindow(m)) key='obj';
  if(last&&/(킬|솔로킬|로밍|역습)/.test(last.text)) key='kill';
  if(Math.abs((M.dragons[0]+M.dragons[1]))>0&&m%7===0) key='obj';
  if(m>=28) key='late';
  if(m<1) key='intro';
  const bucket=key==='kill'?'kill':key;
  const c1=CASTER_POOL[bucket]||CASTER_POOL.lane;
  const c2=ANALYST_POOL[bucket]||ANALYST_POOL.lane;
  const hk=hashN('c'+(S.currentSeries?S.currentSeries.startedAt:0)+'-'+m+'-'+key);
  const lead=(last&&key!=='intro')?last.text.replace(/<[^>]+>/g,'').slice(0,60):c1[hk%c1.length];
  return [lead, c2[(hk+1)%c2.length]];
}

/* ---------- 게임 종료 → POG → 박스스코어 ---------- */
function buildPstats(){
  const meWin=!!M.meWin;
  const rnd2=(a,b)=>a+Math.random()*(b-a);
  const sideOf=(sd)=>{
    const win=(sd==='me')===meWin;
    const kills=M.kills[sd==='me'?0:1]||0;
    const deaths=M.kills[sd==='me'?1:0]||0;
    const totK=Math.max(1,kills);
    const rows=ROLES.map(r=>{
      const l=lineupAt(sd,r);
      const p=S.players[l.name];
      const ovr=p?rawOverall(p):70;
      const wgt=(ovr-60)/40+(r==='ADC'||r==='MID'?0.35:0);
      return {role:r, name:l.name||ROLE_KR[r], champ:l.champ, ovr:ovr, w:Math.max(0.15,wgt)};
    });
    const wsum=rows.reduce((a,x)=>a+x.w,0)||1;
    // 킬 분배
    let kLeft=totK;
    rows.forEach((x,i)=>{
      const share=Math.round(totK*x.w/wsum);
      x.k=i===rows.length-1?Math.max(0,kLeft):Math.min(kLeft,Math.max(0,share));
      kLeft-=x.k;
    });
    // 데스 분배 (팀 데스 수를 정확히 나눔)
    let dLeft=deaths;
    const dw=rows.map(x=>({x:x,w:x.role==='SUP'?0.7:x.role==='TOP'?1.2:1}));
    const dwSum=dw.reduce((a,o)=>a+o.w,0)||1;
    dw.forEach((o,i)=>{
      const share=Math.round(deaths*o.w/dwSum*rnd2(0.7,1.3));
      o.x.d=i===dw.length-1?Math.max(0,dLeft):Math.min(dLeft,Math.max(0,share));
      dLeft-=o.x.d;
    });
    rows.forEach(x=>{
      const role=x.role;
      x.a=Math.max(0,Math.round(totK*rnd2(0.35,0.8)));
      x.kp=Math.min(100,Math.round((x.k+x.a)/Math.max(1,totK)*100));
      const roleDpm={TOP:520,JGL:430,MID:640,ADC:700,SUP:180}[role]||500;
      x.dpm=clamp(Math.round(roleDpm*(win?1.08:0.92)*rnd2(0.85,1.15)*((x.ovr-65)/26+0.92)),150,1050);
      x.tc=Math.round(rnd2(45,120)*(role==='TOP'?1:0.6));
      x.gsr=role==='JGL'?Math.round(rnd2(420,620)):Math.round(rnd2(6,9));
      x.vc=role==='SUP'?Math.round(rnd2(40,80)):Math.round(rnd2(15,45));
      x.rating=Math.round(clamp(6+(x.k*0.5+x.a*0.22-x.d*0.4)/Math.max(1,totK/3)+(win?1.1:0),4,10)*10)/10;
    });
    return rows;
  };
  const me=sideOf('me'), opp=sideOf('opp');
  const winner=meWin?'me':'opp';
  const pool=(winner==='me'?me:opp).slice().sort((a,b)=>b.rating-a.rating);
  const mvp=pool[0];
  if(mvp) mvp.pog=true;
  M.pstats={me:me, opp:opp, mvp:mvp, win:meWin};
  return M.pstats;
}

function drawBoxGold(){
  const cv=$('boxGold'); if(!cv||!M) return;
  const w=cv.clientWidth||320, h=140, dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const hist=(M.history&&M.history.length>1)?M.history:[{min:0,diff:0},{min:M.minute||1,diff:0}];
  const span=Math.max(20,M.minute);
  const maxAbs=Math.max(3000,...hist.map(p=>Math.abs(p.diff)))*1.25;
  const X=m=>6+(m/span)*(w-12), Y=d=>h/2-(d/maxAbs)*(h/2-10);
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){ const y=h*i/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
  const pts=hist.map(p=>[X(Math.min(p.min,span)),Y(p.diff)]);
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(79,168,255,.35)'); g.addColorStop(.5,'rgba(79,168,255,.02)'); g.addColorStop(1,'rgba(255,85,112,.02)');
  ctx.beginPath(); ctx.moveTo(pts[0][0],h/2); pts.forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.lineTo(pts[pts.length-1][0],h/2); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle='#8fd0ff'; ctx.lineWidth=2; ctx.stroke();
  // 이벤트 마커
  (M.events||[]).filter(e=>/드래곤|바론|전령|유충|타워|킬|교전/.test(e.text)).slice(0,24).forEach(e=>{
    const p=hist.reduce((a,b)=>Math.abs(b.min-e.minute)<Math.abs(a.min-e.minute)?b:a,hist[0]);
    const x=X(Math.min(p.min,span)), y=Y(p.diff);
    ctx.fillStyle=/드래곤|바론|전령|유충/.test(e.text)?'#ffc94a':/타워/.test(e.text)?'#9fe4ff':'#ff8095';
    ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill();
  });
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='9px sans-serif';
  ctx.fillText('+'+(maxAbs/1000).toFixed(0)+'K',6,12);
  ctx.fillText('-'+(maxAbs/1000).toFixed(0)+'K',6,h-4);
}

function playoffAction(){
  const um=nextUserPlayoffMatch();

    saveGame();
    startDraft(s);
    return;
  }
  const r=playoffNext();
  if(r.action==='done'){
    if(S.phase==='worlds'){ renderWorlds(); return; }

}
function renderAfterSeries(){
  if(S.phase==='end'){ renderChampion(); return; }
  if(S.phase==='worlds'){ renderWorlds(); return; }

function teamStar(t){
  const ps=ROLES.map(r=>S.players[t.lineup[r]]).filter(Boolean);
  const s=ps.sort((a,b)=>rawOverall(b)-rawOverall(a))[0];
  return s? s.name+' · '+playName(s):'';
}
function worldsAction(){
  const r=worldsNext();
  if(r.action==='user'){
    const s=worldsSeries(r.match,r.roundName);
    saveGame();
    startDraft(s);
    return;
  }
  if(r.action==='done'){ renderChampion(); return; }
  renderWorlds();
  if(r.action==='advanced') toast('다음 라운드로 진행합니다');
}
function worldsSimAll(){
  let guard=0;
  while(!S.worlds.done && guard++<80){
    const W=S.worlds;
    let rd=null;
    if(W.stage==='swiss') rd=W.rounds[W.rounds.length-1];
    else if(W.bracket) rd=W.bracket.rounds[W.bracket.round];
    if(!rd) break;
    let any=false;
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b){ simWorldsMatch(m); any=true; } });
    if(!any) break;
    if(W.stage==='swiss') worldsCloseRound();
    else { const ar=worldsAdvanceBracket(); if(ar.action==='done') break; }
  }
  saveGame();
  if(S.phase==='end') renderChampion(); else renderWorlds();
}

      <h1 style="font-size:26px">스토브리그</h1>
      <p>계약이 만료된 선수·코치를 재계약하거나 FA로 보내세요.<br>결정하지 않으면 자동으로 FA가 됩니다.</p>
      <div class="row" style="justify-content:center;gap:6px;margin-top:8px">
        <span class="chip gold">예산 ${t.budget.toFixed(1)}억</span>
        <span class="chip">${S.season}시즌 종료</span>
      </div>
    </div>
    <div class="section-title"><h3>계약 만료 선수</h3><div class="line"></div><span class="tiny">${expPlayers.length}명</span></div>
    ${expPlayers.length?`<div class="stack">${expPlayers.map(p=>`
      <div class="staff-card">
        <div class="row between">
          <div class="row" style="gap:8px">
            <div class="p-avatar">${esc(p.name.slice(0,1))}</div>
            <div><div style="font-weight:900;font-size:14px">${esc(p.name)} <span class="role-tag">${ROLE_KR[p.role]}</span><span class="grade ${p.grade}">${p.grade}</span></div>
            <div class="tiny">${p.age}세 · ${rawOverall(p)} · 연봉 ${p.salary}억 · ${esc(playName(p))}</div></div>
          </div>
          <div class="row" style="gap:4px">
            <select class="mini-select" data-py="${esc(p.name)}"><option value="1">1년</option><option value="2" selected>2년</option><option value="3">3년</option></select>
            <button class="btn sm primary" data-signp="${esc(p.name)}">재계약</button>
            <button class="btn sm danger" data-fap="${esc(p.name)}">FA</button>
          </div>
        </div>
        <div class="tag-row" style="margin-top:5px">${(p.good||[]).slice(0,4).map(id=>{const tr=TRAIT_MAP[id];return tr?`<span class="tr good">${esc(tr.n)}</span>`:'';}).join('')}${(p.bad||[]).slice(0,2).map(id=>{const tr=TRAIT_MAP[id];return tr?`<span class="tr bad">${esc(tr.n)}</span>`:'';}).join('')}</div>
      </div>`).join('')}</div>`:'<div class="card"><div class="empty-note">만료되는 선수가 없습니다</div></div>'}
    <div class="section-title"><h3>계약 만료 스태프</h3><div class="line"></div><span class="tiny">${expStaff.length}명</span></div>
    ${expStaff.length?`<div class="stack">${expStaff.map(st=>`
      <div class="staff-card">
        <div class="row between">
          <div class="row" style="gap:8px"><span class="chip gold">${staffRoleLabel(st.role)}</span>
            <div><div style="font-weight:900;font-size:14px">${esc(st.name)}</div><div class="tiny">연봉 ${st.salary}억 · ${(st.traits||[]).map(id=>STAFF_TRAITS[id]&&STAFF_TRAITS[id].n).filter(Boolean).join(' · ')}</div></div>
          </div>
          <div class="row" style="gap:4px">
            <select class="mini-select" data-sy="${st.id}"><option value="1">1시즌</option><option value="2" selected>2시즌</option></select>
            <button class="btn sm primary" data-signs="${st.id}">재계약</button>
          </div>
        </div>
      </div>`).join('')}</div>`:'<div class="card"><div class="empty-note">만료되는 스태프가 없습니다</div></div>'}
    <div class="card tight">
      <div class="tiny">남은 만료자를 처리하면 다음 시즌이 시작됩니다. FA가 된 선수는 이적시장에서 다시 영입할 수 있습니다.</div>
    </div>
    <button class="btn primary block" id="startNextSeason">${S.season+1}시즌 시작 →</button>
    <div style="height:14px"></div>`;
  const v=$('view-offseason');
  v.querySelectorAll('[data-signp]').forEach(b=>b.onclick=()=>{
    const sel=v.querySelector('[data-py="'+b.dataset.signp.replace(/"/g,'\\"')+'"]');
    const r=reSignPlayer(b.dataset.signp, sel?Number(sel.value):2); if(!r.ok) toast(r.msg);
  });
  v.querySelectorAll('[data-fap]').forEach(b=>b.onclick=()=>{ if(confirm(b.dataset.fap+' 선수를 FA로 보낼까요?')){ const r=releaseExpiringPlayer(b.dataset.fap); if(!r.ok) toast(r.msg); } });
  v.querySelectorAll('[data-signs]').forEach(b=>b.onclick=()=>{
    const sel=v.querySelector('[data-sy="'+b.dataset.signs+'"]');
    const r=offseasonRenewStaff(b.dataset.signs, sel?Number(sel.value):2); if(!r.ok) toast(r.msg);
  });
  $('startNextSeason').onclick=()=>{ finishOffseason(); toast('새 시즌이 시작됩니다'); };
  show('offseason');
}


/* ---------- MSI / EWC ---------- */
function intlBracketHTML(tour){
  return `<div class="bracket">
    ${tour.bracket.rounds.map((r,ri)=>`<div class="bround">
      <div class="bl">${esc(r.name)} · ${esc(r.month)}</div>
      ${r.matches.map(m=>`<div class="bmatch ${tour.bracket.round===ri&&!m.done?'live':''}">
        <div class="bs ${m.done&&m.winner===m.a?'win':''} ${m.a===S.userTeam?'me':''}">${m.a?badge(T(m.a),'sm')+'<span>'+esc(T(m.a).tag)+'</span>':'<span>TBD</span>'}<span class="bsc">${m.done?m.sa:'—'}</span></div>
        <div class="bs ${m.done&&m.winner===m.b?'win':''} ${m.b===S.userTeam?'me':''}">${m.b?badge(T(m.b),'sm')+'<span>'+esc(T(m.b).tag)+'</span>':'<span>TBD</span>'}<span class="bsc">${m.done?m.sb:'—'}</span></div>
      </div>`).join('')}
    </div>`).join('')}
  </div>`;
}
function intlUserMatch(tour){
  const rd=tour.bracket.rounds[tour.bracket.round];
  return rd.matches.find(m=>!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam));
}
function renderIntl(){
  const tour=intlNow();
  if(!tour){ renderAll(); return; }
  const rd=tour.bracket.rounds[tour.bracket.round];
  const mine=intlUserMatch(tour);
  const isMSI=tour.kind==='msi';
  $('view-intl').innerHTML=`
    <div class="hero worlds-hero" style="padding:18px 14px 6px">
      <div class="kicker">${isMSI?'MID-SEASON INVITATIONAL':'ESPORTS WORLD CUP'} · ${tour.month}</div>
      <h1 style="font-size:26px">${isMSI?'MSI':'EWC'}</h1>
      <p>${esc(tour.name)} · 8팀 초청 · Bo${tour.bo}</p>
      <div class="row" style="justify-content:center;gap:6px;margin-top:8px">
        <span class="chip sm">${tour.teams.map(id=>esc(T(id).tag)).join(' · ')}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h4>토너먼트</h4><span class="k">${esc(rd.name)} · ${rd.matches.filter(m=>m.done).length}/${rd.matches.length}</span></div>
      ${intlBracketHTML(tour)}
    </div>
    ${tour.done?`
      <div class="card glow" style="border-color:rgba(255,201,74,.45)">
        <div class="row between"><div><div class="tiny">${isMSI?'MSI 우승':'EWC 우승'}</div><div style="font-weight:900;font-size:18px;color:var(--gold)">${esc(T(tour.champion).name)}</div></div>${badge(T(tour.champion),'lg')}</div>
        <div class="row between" style="margin-top:6px"><span class="tiny">준우승</span><b style="font-size:12px">${esc(T(tour.runnerUp).name)}</b></div>
        ${isMSI?'<div class="tiny" style="margin-top:6px">MSI 우승 팀이 LCK 소속이면 롤드컵 시드 보너스가 주어집니다</div>':''}
      </div>
      <button class="btn primary block" id="intlNext">${isMSI?'서머 시즌 시작 →':'서머 재개 →'}</button>
    `:`
      ${mine?`<div class="card" style="border-color:rgba(37,224,255,.5)">
        <div class="card-h"><h4>${esc(rd.name)} · 우리 경기</h4><span class="k">Bo${mine.bo||tour.bo}</span></div>
        <div class="row between" style="margin-bottom:10px">
          <div class="row" style="gap:7px">${badge(myTeam())}<b>${esc(myTeam().tag)}</b></div>
          <span class="chip sm">VS</span>
          <div class="row" style="gap:7px"><b>${esc(T(mine.a===S.userTeam?mine.b:mine.a).tag)}</b>${badge(T(mine.a===S.userTeam?mine.b:mine.a))}</div>
        </div>
        <button class="btn primary block" id="intlPlay">경기 시작 · 밴픽</button>
      </div>`:`
      <div class="card">
        <div class="card-h"><h4>${tour.userIn?'다음 경기':'관전 모드'}</h4><span class="k">${tour.month}</span></div>
        <div class="tiny" style="margin-bottom:10px">${tour.userIn?'다른 경기를 시뮬레이션하고 다음 라운드로 진행합니다.':'우리 팀은 초청되지 않았습니다. 대회를 관전하세요.'}</div>
        <button class="btn primary block" id="intlPlay">경기 진행</button>
        <button class="btn sm block" id="intlSim" style="margin-top:6px">대회 전체 자동 진행 ⏩</button>
      </div>`}
    `}
    <div class="card">
      <div class="card-h"><h4>참가팀</h4><span class="k">8팀</span></div>
      <div class="stack" style="gap:3px">${tour.teams.map(id=>{const t=T(id);return `<div class="kv"><span>${badge(t,'sm')} ${esc(t.name)} <i class="tiny">${esc(t.region)}</i></span><b style="font-size:11px">${esc(teamStar(t))}</b></div>`;}).join('')}</div>
    </div>
    <div style="height:10px"></div>`;
  const p1=$('intlPlay'); if(p1) p1.onclick=()=>intlAction();
  const p2=$('intlNext'); if(p2) p2.onclick=()=>{ intlAction(); };
  const p3=$('intlSim'); if(p3) p3.onclick=()=>{ intlSimAll(); };
  show('intl');
}
function intlAction(){
  const r=intlNext();
  if(r.action==='user'){
    const s=intlSeries(r.match,r.roundName,r.tour);
    saveGame(); startDraft(s); return;
  }
  if(r.action==='done' || !intlNow()){ renderAll(); return; }
  renderIntl();
}
function intlSimAll(){
  let guard=0;
  while(intlNow()&&guard++<40){
    const tour=intlNow();
    const rd=tour.bracket.rounds[tour.bracket.round];
    let any=false;
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b){ simIntlMatch(m,tour); any=true; } });
    if(!any) break;
    const r=intlAdvance(tour);
    if(r.action==='done') break;
  }
  saveGame();
  renderAll();
}


/* boot */
window.__game={get S(){return S},get M(){return M},get D(){return D}};
sndLoad();bgmLoad();
renderTitle();

</script>
