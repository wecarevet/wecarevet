<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#05070d">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>LCK 매니저 2025 · LoL Esports Manager</title>
<style>
/* ===== LCK Manager — esports dark UI ===== */
:root{
  --bg:#05070d;
  --bg2:#0a0f1c;
  --panel:rgba(17,23,40,.88);
  --panel2:rgba(26,34,56,.9);
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.14);
  --txt:#eaf0ff;
  --dim:#8b97b5;
  --dim2:#5d6884;
  --cyan:#25e0ff;
  --violet:#8b5cf6;
  --gold:#ffc94a;
  --red:#ff4d6d;
  --green:#3ddc97;
  --blue:#4d8dff;
  --grad:linear-gradient(135deg,#25e0ff 0%,#7c5cff 100%);
  --grad-gold:linear-gradient(135deg,#ffd76a,#ff9e2c);
  --r:16px;
  --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 600px at 80% -10%, rgba(124,92,255,.22), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(37,224,255,.13), transparent 60%),
    linear-gradient(180deg,#05070d,#070a14 40%,#05070d);
  color:var(--txt);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.45;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 80%);
}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:rgba(5,7,13,.35)}
@media(min-width:900px){#app{box-shadow:0 0 90px rgba(0,0,0,.7);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.hidden{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
input,select{font-family:inherit;color:inherit}

/* ---- top bar ---- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:linear-gradient(180deg,rgba(9,12,22,.98),rgba(9,12,22,.82));
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.tb-team{display:flex;align-items:center;gap:9px;min-width:0}
.tb-name{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.tb-spacer{flex:1}
.tb-pill{
  display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  font-size:10px;color:var(--dim2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.tb-pill b{font-size:14px;color:var(--gold);letter-spacing:-.01em}
.tb-week{
  font-size:11px;font-weight:800;color:var(--cyan);
  border:1px solid rgba(37,224,255,.35);background:rgba(37,224,255,.09);
  padding:4px 9px;border-radius:999px;white-space:nowrap;
}

/* ---- badges ---- */
.badge{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  display:grid;place-items:center;
  font-weight:900;font-size:12px;letter-spacing:-.03em;
  color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 4px 14px rgba(0,0,0,.45);
}
.badge.lg{width:46px;height:46px;border-radius:14px;font-size:15px}
.badge.xl{width:64px;height:64px;border-radius:20px;font-size:19px}
.badge.sm{width:26px;height:26px;border-radius:8px;font-size:10px}

/* ---- layout ---- */
main{flex:1;display:flex;flex-direction:column;padding-bottom:calc(var(--tab-h) + 18px)}
.view{padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px;animation:fade .22s ease}
.view.no-pad{padding:0}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--dim);font-size:12.5px}
.tiny{font-size:11px;color:var(--dim2)}
.section-title{display:flex;align-items:center;gap:8px;margin:2px 2px -2px}
.section-title h3{font-size:13px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.section-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* ---- cards ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.card.tight{padding:11px}
.card.glow::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px 120px at 15% 0,rgba(124,92,255,.16),transparent)}
.card-h{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.card-h h4{font-size:13.5px;letter-spacing:.02em}
.card-h .k{font-size:11px;color:var(--dim2);font-weight:700;letter-spacing:.06em}
.divider{height:1px;background:var(--line);margin:10px -14px}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;font-weight:800;font-size:14px;
  background:rgba(255,255,255,.07);border:1px solid var(--line2);
  transition:transform .1s ease,filter .15s ease,background .15s ease;
  letter-spacing:-.01em;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#04121a;border:0;box-shadow:0 6px 22px rgba(37,224,255,.28)}
.btn.gold{background:var(--grad-gold);color:#241402;border:0;box-shadow:0 6px 22px rgba(255,180,60,.3)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.4);color:#ff8fa3}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ---- tab bar ---- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  max-width:560px;margin:0 auto;
  display:flex;background:rgba(8,11,20,.96);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--dim2);
  transition:color .15s ease,background .15s ease;
}
.tabbar button .ic{font-size:18px;line-height:1;filter:grayscale(1) opacity(.6)}
.tabbar button.on{color:var(--cyan);background:rgba(37,224,255,.08)}
.tabbar button.on .ic{filter:none}

/* ---- team select ---- */
.hero{padding:26px 18px 10px;text-align:center}
.hero .kicker{font-size:11px;letter-spacing:.3em;color:var(--cyan);font-weight:800;text-transform:uppercase}
.hero h1{font-size:30px;line-height:1.1;margin:8px 0 6px;background:linear-gradient(120deg,#fff,#9fd8ff 45%,#b79bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:13px;margin:0 auto;max-width:330px}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-card{
  position:relative;text-align:left;padding:12px;border-radius:14px;
  background:linear-gradient(160deg,rgba(30,38,62,.9),rgba(14,19,33,.92));
  border:1px solid var(--line);overflow:hidden;transition:transform .12s ease,border-color .2s;
  display:flex;flex-direction:column;gap:8px;
}
.team-card:active{transform:scale(.975)}
.team-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,#fff);opacity:.9}
.team-card .nm{font-weight:800;font-size:13.5px;letter-spacing:-.02em}
.team-card .meta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);font-weight:700}
.team-card .stars{color:var(--gold);letter-spacing:1px;font-size:10px}
.team-card .tagline{font-size:10.5px;color:var(--dim2);font-weight:600}
.team-card .lineup{display:flex;gap:3px;margin-top:2px}
.team-card .dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}

/* ---- pills / chips ---- */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);
  white-space:nowrap;
}
.chip.on{background:rgba(37,224,255,.14);border-color:rgba(37,224,255,.45);color:var(--cyan)}
.chip.gold{background:rgba(255,201,74,.13);border-color:rgba(255,201,74,.4);color:var(--gold)}
.chip.red{background:rgba(255,77,109,.13);border-color:rgba(255,77,109,.35);color:#ff92a5}
.chip.green{background:rgba(61,220,151,.13);border-color:rgba(61,220,151,.35);color:var(--green)}
.chip.violet{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.4);color:#c4b1ff}
.chip.sm{padding:2px 7px;font-size:10px}
.role-tag{font-size:9.5px;font-weight:900;letter-spacing:.05em;color:var(--dim2);border:1px solid var(--line2);border-radius:5px;padding:1px 4px}

/* ---- stat bars ---- */
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:52px 1fr 30px;gap:8px;align-items:center;font-size:11px;color:var(--dim)}
.bar-row b{color:var(--txt);font-size:11.5px;text-align:right}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--grad);transition:width .4s ease}
.bar.gold>i{background:var(--grad-gold)}
.bar.green>i{background:linear-gradient(90deg,#2fe08a,#8ef2b7)}
.bar.red>i{background:linear-gradient(90deg,#ff4d6d,#ff9d8a)}
.bar.violet>i{background:linear-gradient(90deg,#8b5cf6,#d3b4ff)}
.bar.cyan>i{background:linear-gradient(90deg,#25e0ff,#7cf7ff)}

/* ---- roster ---- */
.p-card{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.p-card.main{border-color:rgba(37,224,255,.28);background:linear-gradient(100deg,rgba(37,224,255,.07),rgba(17,23,40,.9) 45%)}
.p-avatar{
  width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  font-weight:900;font-size:15px;color:#dfeaff;letter-spacing:-.03em;
  background:linear-gradient(150deg,rgba(124,92,255,.45),rgba(37,224,255,.2));
  border:1px solid rgba(255,255,255,.16);
}
.p-name{font-weight:800;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.p-meta{font-size:11px;color:var(--dim);display:flex;gap:7px;align-items:center}
.p-rating{font-weight:900;font-size:17px;letter-spacing:-.03em;background:linear-gradient(120deg,#fff,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.p-cond{display:flex;flex-direction:column;gap:3px;width:64px}
.cond-label{font-size:9px;color:var(--dim2);font-weight:800;letter-spacing:.06em;display:flex;justify-content:space-between}
.cond-label span{color:var(--dim)}

/* ---- modal ---- */
.modal-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,9,.72);backdrop-filter:blur(4px);animation:fade .16s ease}
.modal{
  width:100%;max-width:560px;max-height:88dvh;overflow:auto;
  background:linear-gradient(180deg,#141a2c,#0b1020);
  border:1px solid var(--line2);border-bottom:0;
  border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .24s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:-6px auto 12px}
.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px);transform:translateX(-50%);
  z-index:100;background:rgba(20,27,45,.97);border:1px solid var(--line2);
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .2s ease;max-width:88vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---- weekly actions ---- */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action{
  text-align:left;padding:11px;border-radius:13px;border:1px solid var(--line);
  background:rgba(17,23,40,.75);display:flex;flex-direction:column;gap:4px;transition:.15s;
}
.action .ai{font-size:19px;line-height:1}
.action .an{font-weight:800;font-size:13px}
.action .ad{font-size:10.5px;color:var(--dim2);line-height:1.3}
.action.on{border-color:rgba(37,224,255,.55);background:linear-gradient(150deg,rgba(37,224,255,.14),rgba(124,92,255,.1));box-shadow:0 0 0 1px rgba(37,224,255,.2),0 8px 24px rgba(37,224,255,.1)}
.action.on .ad{color:#b9d9ea}

/* ---- next match banner ---- */
.match-banner{
  position:relative;border-radius:16px;overflow:hidden;padding:14px;
  background:linear-gradient(115deg,rgba(124,92,255,.28),rgba(37,224,255,.12) 55%,rgba(17,23,40,.9));
  border:1px solid rgba(124,92,255,.35);
}
.mb-top{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#cfd9ff;text-transform:uppercase}
.vs-row{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.vs-row .side{display:flex;align-items:center;gap:8px;min-width:0}
.vs-row .side.right{flex-direction:row-reverse;text-align:right}
.vs-row .nm{font-weight:800;font-size:14px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-badge{font-size:11px;font-weight:900;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:4px 8px;border-radius:8px;letter-spacing:.06em}

/* ---- standings ---- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10px;letter-spacing:.08em;color:var(--dim2);font-weight:800;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.045);text-align:right;font-weight:700}
.tbl td:first-child{text-align:left}
.tbl tr.me td{background:rgba(37,224,255,.07)}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.tbl tr.playoff td:first-child{box-shadow:inset 3px 0 0 rgba(139,92,246,.55)}
.tbl .tn{display:flex;align-items:center;gap:7px;font-weight:800;white-space:nowrap}
.tbl .w{color:var(--green)}
.tbl .l{color:var(--dim)}
.form{display:inline-flex;gap:2px}
.form i{width:7px;height:7px;border-radius:2px;background:rgba(255,255,255,.13)}
.form i.w{background:var(--green)}
.form i.l{background:var(--red)}

/* ---- draft ---- */
.draft-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(9,12,22,.9);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.draft-phase{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.draft-timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;color:var(--gold)}
.draft-body{padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px}
.ban-row{display:flex;gap:6px;align-items:center}
.ban-slot{
  flex:1;height:38px;border-radius:9px;border:1px dashed rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:10px;color:var(--dim2);font-weight:800;
  background:rgba(255,255,255,.02);overflow:hidden;position:relative;
}
.ban-slot.filled{border-style:solid;border-color:rgba(255,77,109,.45);background:rgba(255,77,109,.08);color:#ffb2be;text-decoration:line-through;text-decoration-color:rgba(255,77,109,.7)}
.ban-slot.filled.enemy{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#c8d2e8;text-decoration:none}
.pick-row{display:flex;gap:5px}
.pick-slot{
  flex:1;border-radius:11px;border:1px solid var(--line);background:rgba(17,23,40,.7);
  overflow:hidden;display:flex;flex-direction:column;align-items:center;position:relative;
  aspect-ratio:3/4;
}
.pick-slot .role{font-size:8.5px;font-weight:900;color:var(--dim2);letter-spacing:.05em;padding:4px 0 0}
.pick-slot img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#131a2b}
.pick-slot .ps-name{font-size:8.5px;font-weight:800;color:var(--txt);text-align:center;line-height:1.1;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.pick-slot.empty img{display:none}
.pick-slot.empty .ps-name{color:var(--dim2);font-weight:700}
.pick-slot.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(37,224,255,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(37,224,255,.5),0 0 26px rgba(37,224,255,.4)}}
.pick-slot.enemy{border-color:rgba(255,77,109,.3)}
.pick-slot.enemy.active{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.pick-slot .sig{position:absolute;top:2px;right:2px;font-size:9px}
.champ-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:2px}
.champ{
  position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:#101728;padding:0;aspect-ratio:1;transition:transform .1s,border-color .15s;
}
.champ img{width:100%;height:100%;object-fit:cover;display:block}
.champ .cn{position:absolute;left:0;right:0;bottom:0;font-size:8px;font-weight:800;text-align:center;padding:2px 1px;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.champ:active{transform:scale(.93)}
.champ.offrole{opacity:.42}
.champ.used{opacity:.22;pointer-events:none;filter:grayscale(1)}
.champ.ban{filter:grayscale(1) sepia(.6) hue-rotate(-40deg) brightness(.6)}
.champ.ban::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:#ff7b8f;text-shadow:0 0 6px #000}
.champ.sig{outline:2px solid var(--gold);outline-offset:-2px}
.champ .cp{position:absolute;top:2px;left:3px;font-size:8px;font-weight:900;color:#ffd76a;text-shadow:0 1px 3px #000}
.role-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.role-tabs::-webkit-scrollbar{display:none}
.role-tabs .chip{flex:0 0 auto}
.synergy{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.syn{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.syn .sn{font-size:9px;color:var(--dim2);font-weight:800;letter-spacing:.02em}
.syn .sv{font-size:14px;font-weight:900;letter-spacing:-.03em}
.syn .sb{height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:3px;overflow:hidden}
.syn .sb>i{display:block;height:100%;background:var(--grad)}
.lane-row{display:flex;align-items:center;gap:7px;font-size:11px}
.lane-row .lr{width:30px;color:var(--dim2);font-weight:800;font-size:9.5px}
.lane-bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.lane-bar .adv{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#25e0ff,#3ddc97)}
.lane-bar .my{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#25e0ff,#3ddc97);left:50%;border-radius:0 4px 4px 0}
.lane-bar .my.neg{left:auto;right:50%;background:linear-gradient(270deg,#ff4d6d,#ff9d8a);border-radius:4px 0 0 4px}
.lane-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.2)}
.lane-val{width:34px;text-align:right;font-weight:900;font-size:10.5px}

.score{display:flex;align-items:center;justify-content:space-between;gap:6px}
.score .sd{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.score .sd.right{flex-direction:row-reverse}
.score .sn{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .sk{font-size:22px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score .mid{text-align:center;flex:0 0 auto}
.clock{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold);letter-spacing:.02em}
.series-score{font-size:10px;font-weight:800;color:var(--dim)}
.obj-row{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.obj{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;color:var(--dim2);font-weight:800}
.obj b{font-size:12px;color:var(--txt);font-variant-numeric:tabular-nums}
.obj .oi{font-size:12px;opacity:.9}
.winprob{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;color:var(--dim2)}
.wp-bar{flex:1;height:7px;border-radius:5px;background:rgba(255,77,109,.35);overflow:hidden;position:relative}
.wp-bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#25e0ff,#4d8dff);transition:width .4s ease}
.wp-bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.35)}
.graph-wrap{padding:0 0 2px;position:relative}
canvas#goldCanvas{width:100%;height:132px;display:block}
.feed{padding:0 12px;display:flex;flex-direction:column;gap:6px;min-height:180px;max-height:34dvh;overflow-y:auto}
.ev{font-size:12px;line-height:1.4;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.035);border-left:2px solid var(--line2);animation:fade .2s ease}
.ev b{font-weight:800}
.ev .t{color:var(--gold);font-weight:900;font-size:10.5px;margin-right:5px;font-variant-numeric:tabular-nums}
.ev.blue{border-left-color:var(--cyan);background:rgba(37,224,255,.06)}
.ev.red{border-left-color:var(--red);background:rgba(255,77,109,.06)}
.ev.big{border-left-color:var(--gold);background:rgba(255,201,74,.08);font-weight:700}
.ev.sys{border-left-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05);color:var(--dim);font-size:11px}
.tactic-panel{position:sticky;bottom:var(--tab-h);z-index:25;padding:10px 12px;background:linear-gradient(0deg,rgba(8,11,20,.99),rgba(12,17,30,.94));border-top:1px solid rgba(37,224,255,.3);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.tactic-panel .th{font-size:10.5px;font-weight:900;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.tactic-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tac{text-align:left;padding:9px 10px;border-radius:11px;border:1px solid var(--line2);background:rgba(26,34,56,.9)}
.tac .tn{font-weight:800;font-size:12.5px;display:flex;gap:5px;align-items:center}
.tac .td{font-size:10px;color:var(--dim2);line-height:1.3;margin-top:2px}
.tac:active{transform:scale(.97)}
.tac.on{border-color:var(--cyan);background:rgba(37,224,255,.13)}
.tac:disabled{opacity:.4}
.match-controls{padding:10px 12px;display:flex;gap:8px;align-items:center}
.speed-pill{display:flex;gap:3px;background:rgba(255,255,255,.06);padding:3px;border-radius:9px}
.speed-pill button{padding:5px 9px;border-radius:7px;font-size:11px;font-weight:800;color:var(--dim)}
.speed-pill button.on{background:var(--grad);color:#03121a}

/* ---- result ---- */
.result-hero{text-align:center;padding:22px 14px 14px;position:relative}
.result-hero .rr{font-size:12px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.result-hero .rw{font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1.05;margin:6px 0}
.result-hero .rw.win{background:linear-gradient(120deg,#4df3c0,#25e0ff 60%,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-hero .rw.lose{background:linear-gradient(120deg,#ff8ea0,#ff4d6d);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-hero .rs{font-size:13px;color:var(--dim);font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.stat-box .sl{font-size:9.5px;color:var(--dim2);font-weight:800;letter-spacing:.04em}
.stat-box .sv{font-size:17px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mvp-card{display:flex;align-items:center;gap:11px;padding:11px;border-radius:13px;background:linear-gradient(100deg,rgba(255,201,74,.16),rgba(17,23,40,.7));border:1px solid rgba(255,201,74,.35)}

/* ---- bracket ---- */
.bracket{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.bracket::-webkit-scrollbar{display:none}
.bround{flex:0 0 auto;min-width:132px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.bround .bl{font-size:9.5px;font-weight:900;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;text-align:center}
.bmatch{background:rgba(17,23,40,.9);border:1px solid var(--line);border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:4px;font-size:11px}
.bmatch .bs{display:flex;align-items:center;justify-content:space-between;gap:4px;color:var(--dim);font-weight:700}
.bmatch .bs.win{color:var(--txt);font-weight:900}
.bmatch .bs.me{color:var(--cyan)}
.bmatch .bsc{font-variant-numeric:tabular-nums;font-weight:900}

/* ---- champion screen ---- */
.trophy{padding:34px 16px 10px;text-align:center;position:relative}
.trophy .cup{font-size:72px;line-height:1;filter:drop-shadow(0 10px 30px rgba(255,201,74,.45));animation:cup 3s ease-in-out infinite}
@keyframes cup{50%{transform:translateY(-8px) rotate(-2deg)}}
.trophy h2{font-size:26px;margin-top:10px;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:7px;height:12px;border-radius:2px;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translateY(560px) rotate(420deg);opacity:.1}}

/* ---- misc ---- */
.kv{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--dim)}
.kv b{color:var(--txt);font-weight:800}
.dotsep{color:var(--dim2);opacity:.5}
.pointer{cursor:pointer}
.empty-note{text-align:center;color:var(--dim2);font-size:12px;padding:20px 10px}
.spin-note{font-size:11px;color:var(--dim2);text-align:center}
.tag-row{display:flex;gap:4px;flex-wrap:wrap}
.slide-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.slide-item:last-child{border-bottom:0}
.fa-rank{font-size:11px;font-weight:900;color:var(--dim2);width:18px}
.mini-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:8px;font-weight:900;color:#fff}

/* ---------- player helpers ---------- */
function mkPlayer(name,role,age,rating,styleKey,sigs,teamId){
  const st=STYLES[styleKey]||STYLES.stable;
  const stats={};
  ['lane','fight','macro','pool','mental'].forEach(k=>{ stats[k]=clamp(Math.round(rating+st[k]+ri(-3,3)),40,99); });
  const p={name,role,age,stats,sigs:sigs.slice(),form:ri(68,88),fatigue:ri(4,18),
    salary:Math.round(((Math.max(rating,50)-54)**1.62)/11*2)/2, team:teamId, growth:age<=21?ri(0,2):0};
  return p;
}
function rawOverall(p){const s=p.stats;return Math.round(s.lane*.24+s.fight*.26+s.macro*.2+s.pool*.15+s.mental*.15);}
function condMul(p){return clamp(0.86+(p.form/100)*0.2-p.fatigue*0.0013,0.62,1.12);}
function effRating(p){return rawOverall(p)*condMul(p);}
function condLabel(p){ if(p.fatigue>75) return '지침'; if(p.form<50) return '부진'; if(p.form>82&&p.fatigue<40) return '상승세'; return '보통'; }
function salaryOf(p){return p.salary;}
function teamSalary(t){return t.roster.reduce((a,n)=>a+(S.players[n]?S.players[n].salary:0),0);}
function lineupOf(t){return ROLES.map(r=>S.players[t.lineup[r]]).filter(Boolean);}
function teamPower(t){
  let s=0,w=0;
  ROLES.forEach(r=>{const p=S.players[t.lineup[r]]; if(!p) return; const off=p.role===r?1:0.85; s+=effRating(p)*ROLE_W[r]*off; w+=ROLE_W[r];});
  return w?s/w:50;
}
function teamPowerRaw(t){
  let s=0,w=0;
  ROLES.forEach(r=>{const p=S.players[t.lineup[r]]; if(!p) return; const off=p.role===r?1:0.85; s+=rawOverall(p)*ROLE_W[r]*off; w+=ROLE_W[r];});
  return w?s/w:50;
}
function T(id){return S.teams[id];}
function myTeam(){return S.teams[S.userTeam];}
function champTier(c){
  if(typeof c==='string') c=CHAMP_MAP[c];
  const mod=(S&&S.meta&&S.meta.tier&&S.meta.tier[c.n])||0;
  return clamp(c.t+mod,1,5);
}
function champFit(p,c){
  let f=0.96;
  if(!c.r.includes(p.role)) f-=0.05;
  if(p.sigs.includes(c.n)) f+=0.05;
  f+=(p.stats.pool-72)/900;
  return f;
}
function laneScore(p,c){
  if(!p) return 55;
  return (75+(effRating(p)-75)*0.8)*champFit(p,c) + clamp((champTier(c)-3)*2,-3,3);
}

/* ---------- comp evaluation ---------- */
function evalComp(picks){
  const cs=picks.map(x=>CHAMP_MAP[x.champ]).filter(Boolean);
  const tags={engage:0,poke:0,fight:0,split:0,scale:0};
  cs.forEach(c=>{for(const k in tags) tags[k]+=c.tags[k];});
  const ad=cs.filter(c=>c.d==='AD').length;
  const ap=cs.filter(c=>c.d==='AP').length;
  const tank=cs.filter(c=>c.d==='TANK').length;
  const front=cs.reduce((a,c)=>a+c.f,0);
  const cc=cs.reduce((a,c)=>a+c.cc,0);
  const curve=[0,0,0];
  cs.forEach(c=>c.cv.forEach((v,i)=>{curve[i]+=v;}));
  const n=Math.max(cs.length,1);
  const curveAvg=curve.map(v=>v/n);
  const tierAvg=cs.reduce((a,c)=>a+champTier(c),0)/n;
  let score=40+(tierAvg-3)*5+tags.fight*0.9+tags.engage*0.75+tags.scale*0.7+tags.poke*0.4+tags.split*0.35;
  const warnings=[],strengths=[];
  if(ad>=4&&ap===0){score-=7;warnings.push('풀 AD 조합 — 상대 방어막 스택에 취약');}
  else if(ap>=4&&ad===0){score-=7;warnings.push('풀 AP 조합 — 상대 마저 스택에 취약');}
  else if(ad>=1&&ap>=1) strengths.push('AD/AP 밸런스 양호');
  if(tank===0&&front<6){score-=5;warnings.push('탱커·프론트라인 부재 — 한타 진형 붕괴 위험');}
  else if(front>=8) strengths.push('든든한 프론트라인');
  if(tags.engage<5){score-=4;warnings.push('이니시 수단 부족');}
  else if(tags.engage>=9) strengths.push('강력한 이니시');
  if(cc<6){score-=3;warnings.push('CC 부족 — 픽오프에 취약');}
  if(curveAvg[2]>=3.7) strengths.push('후반 밸류 최상');
  if(curveAvg[0]>=3.5) strengths.push('초반 스노우볼');
  if(curveAvg[0]<2.4&&curveAvg[2]<3.2) warnings.push('파워 스파이크가 애매함');
  return {ad,ap,tank,front,cc,tags,curve:curveAvg,tierAvg,score:clamp(score,20,96),warnings,strengths,n};
}

/* ---------- game init ---------- */
function createState(teamId, opts){
  opts=opts||{};
  const st={
    version:1, season:1, week:1, phase:'regular',
    userTeam:teamId, teams:{}, players:{},
    schedule:[], results:[], weekAction:'scrim', weekActionTarget:null, actionApplied:false,
    gameplan:null, patchIdx:0, meta:{tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}}, patches:[],
    pog:{}, playoffs:null, champion:null, seriesWins:0, lastResult:null,
    fearless:true, history:[], created:Date.now(),
  };
  TEAM_DEFS.forEach(def=>{
    const t={id:def.id,name:def.name,tag:def.tag,color:def.color,budget:def.budget,tier:def.tier,
      tagline:def.tagline,roster:[],lineup:{},wins:0,losses:0,gw:0,gl:0,form:[],pogTotal:0};
    def.roster.forEach((r,idx)=>{
      const p=mkPlayer(r[0],r[1],r[2],r[3],r[4],r[5],def.id);
      p.starter=idx<5;
      st.players[p.name]=p;
      t.roster.push(p.name);
      if(idx<5) t.lineup[r[1]]=p.name;
    });
    st.teams[def.id]=t;
  });
  // free agents
  FA_DEFS.forEach(r=>{
    const p=mkPlayer(r[0],r[1],r[2],r[3],r[4],r[5],null);
    p.starter=false; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10;
    st.players[p.name]=p;
  });
  st.schedule=genSchedule(Object.keys(st.teams));
  st.pog=Object.fromEntries(Object.keys(st.players).map(n=>[n,0]));
  S=st;
  applyPatch(0,true);
  return st;
}

/* ---------- patches ---------- */
function applyPatch(idx, silent){
  const p=PATCHES[idx]; if(!p) return null;
  S.patchIdx=idx;
  p.buffs.forEach(n=>{S.meta.tier[n]=(S.meta.tier[n]||0)+1;});
  p.nerfs.forEach(n=>{S.meta.tier[n]=(S.meta.tier[n]||0)-1;});
  S.meta.obj=p.obj;
  S.patches.push({v:p.v,name:p.name,week:S.week});
  if(!silent) toast('🛠 패치 '+p.v+' 적용 — '+p.name);
  return p;
}

/* ---------- weekly action ---------- */
function applyWeekAction(){
  if(S.actionApplied) return;
  const t=myTeam(); const act=S.weekAction;
  const starters=lineupOf(t);
  const all=t.roster.map(n=>S.players[n]);
  if(act==='scrim'){
    starters.forEach(p=>{p.form=clamp(p.form+ri(1,5),15,100);p.fatigue=clamp(p.fatigue+ri(7,13),0,100);p.stats.macro=clamp(p.stats.macro+(Math.random()<.25?1:0),40,99);});
    toast('⚔️ 스크림 3일 — 팀 합과 실전 감각이 올라갔습니다');
  }else if(act==='solo'){
    const tg=S.players[S.weekActionTarget]||starters[0];
    if(tg){ const key=pickOf(['lane','fight','pool']); tg.stats[key]=clamp(tg.stats[key]+ri(2,3),40,99); tg.form=clamp(tg.form+ri(2,5),15,100); tg.fatigue=clamp(tg.fatigue+ri(4,8),0,100); }
    starters.filter(p=>p!==tg).forEach(p=>{p.fatigue=clamp(p.fatigue+ri(3,7),0,100);p.form=clamp(p.form-ri(0,2),15,100);});
    toast('🎯 '+(tg?tg.name:'선수')+' 집중 훈련 완료 — 기량이 상승했습니다');
  }else if(act==='macro'){
    starters.forEach(p=>{p.stats.macro=clamp(p.stats.macro+ri(1,3),40,99);p.fatigue=clamp(p.fatigue+ri(5,9),0,100);p.form=clamp(p.form-ri(1,3),15,100);});
    toast('🧠 전술·운영 훈련 — 후반 운영 능력이 좋아졌습니다');
  }else if(act==='rest'){
    all.forEach(p=>{p.fatigue=clamp(p.fatigue-ri(14,24),0,100);p.form=clamp(p.form+ri(3,8),15,100);});
    toast('😴 전면 휴식 — 컨디션이 크게 회복됐습니다');
  }
  // slump / fatigue side effects
  all.forEach(p=>{
    if(p.fatigue>82 && Math.random()<.45){ p.form=clamp(p.form-ri(3,8),10,100); }
    if(p.form<35 && Math.random()<.3){ p.form=clamp(p.form+3,10,100); }
    p.fatigue=clamp(p.fatigue-2,0,100);
  });
  S.actionApplied=true;
  saveGame(); renderAll();
}

/* ---------- transfer market ---------- */
function freeAgents(){ return Object.values(S.players).filter(p=>p.fa && !p.team); }
function signFA(name){
  const p=S.players[name]; if(!p||!p.fa||p.team) return {ok:false,msg:'이미 영입된 선수입니다'};
  const t=myTeam();
  const fee=p.fee||Math.round(p.salary*1.7*10)/10;
  if(t.budget<fee) return {ok:false,msg:'예산 부족 (필요 '+fee.toFixed(1)+'억)'};
  if(t.roster.length>=9) return {ok:false,msg:'로스터 정원 초과 (최대 9명)'};
  t.budget=Math.round((t.budget-fee)*10)/10;
  p.team=t.id; p.fa=false; t.roster.push(p.name);
  toast('✍️ '+p.name+' 영입 완료 — 이적료 '+fee.toFixed(1)+'억');
  saveGame(); renderAll(); return {ok:true};
}
function releasePlayer(name){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  if(t.roster.length<=6) return {ok:false,msg:'최소 6명은 유지해야 합니다'};
  const refund=Math.round(p.salary*0.3*10)/10;
  t.roster=t.roster.filter(n=>n!==name);
  Object.keys(t.lineup).forEach(r=>{if(t.lineup[r]===name) delete t.lineup[r];});
  p.team=null; p.fa=false; p.retired=true;
  t.budget=Math.round((t.budget+refund)*10)/10;
  // auto fill lineup
  ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  toast('🚪 '+name+' 방출 — '+refund.toFixed(1)+'억 회수');
  saveGame(); renderAll(); return {ok:true};
}
function setStarter(role, name){
  const t=myTeam(); const p=S.players[name]; if(!p) return;
  // if already starter elsewhere, swap
  const prev=t.lineup[role];
  const oldRole=Object.keys(t.lineup).find(r=>t.lineup[r]===name);
  if(oldRole) t.lineup[oldRole]=prev;
  t.lineup[role]=name;
  saveGame(); renderAll();
}

/* ---------- draft ---------- */
const BAN_SEQ=['me','opp','me','opp','me','opp'];
const PICK_SEQ_BLUE=['me','opp','opp','me','me','opp','opp','me','me','opp'];

function startDraft(series){
  const oppId=series.oppId, meId=S.userTeam;
  const gameIdx=series.games.length;
  const mySide=series.sides[gameIdx]||'blue';
  D={
    series, gameIdx, mySide, oppId, step:0,
    myBans:[], oppBans:[], myPicks:[], oppPicks:[],
    roleFilter:'ALL', phase:'ban', done:false,
    locked: series.fearless? series.fearlessUsed.slice():[],
    oppPicksView:[],
  };
  if(mySide==='blue') D.seq=BAN_SEQ.slice();
  else D.seq=BAN_SEQ.map(s=>s==='me'?'opp':'me');
  D.pickSeq = mySide==='blue'?PICK_SEQ_BLUE.slice():PICK_SEQ_BLUE.map(s=>s==='me'?'opp':'me');
  renderDraft();
  if(dTurn()==='opp') setTimeout(()=>{ if(D&&!D.done){ D.phase==='ban'?draftOppBan():draftOppPick(); } }, 520);
}

function dUsed(){ return D.myBans.concat(D.oppBans,D.myPicks.map(p=>p.champ),D.oppPicks.map(p=>p.champ),D.locked); }
function dAvailable(){ const used=new Set(dUsed()); return CHAMPS.filter(c=>!used.has(c.n)); }
function dMyRoles(){ return ROLES.filter(r=>!D.myPicks.some(p=>p.role===r)); }
function dOppRoles(){ return ROLES.filter(r=>!D.oppPicks.some(p=>p.role===r)); }
function dTurn(){ return D.phase==='ban'? D.seq[D.step] : D.pickSeq[D.step]; }

function aiPickChamp(){
  const avail=dAvailable(); const opp=T(D.oppId);
  const need=dOppRoles(); if(!need.length) return avail[0];
  const role=need[0];
  const p=S.players[opp.lineup[role]];
  const comp=PICK_EVAL_CACHE(D.oppPicks);
  let best=null,bestScore=-1e9;
  avail.forEach(c=>{
    if(!c.r.includes(role)&&!c.r.some(r=>need.includes(r))) return;
    let s=champTier(c)*4.5;
    if(p) s+=laneScore(p,c)*0.25;
    if(p&&p.sigs.includes(c.n)) s+=6;
    // comp needs
    const t=c.tags;
    if(comp.ap===0&&c.d==='AP') s+=5;
    if(comp.ad===0&&c.d==='AD') s+=5;
    if(comp.front<3&&c.f>=2) s+=4;
    if(comp.tags.engage<4&&t.engage>=2) s+=4;
    if(comp.cc<4&&c.cc>=2) s+=3;
    s+=rnd(-3,3);
    if(s>bestScore){bestScore=s;best=c;}
  });
  return best||avail[0];
}
function PICK_EVAL_CACHE(picks){
  const cs=picks.map(x=>CHAMP_MAP[x.champ]).filter(Boolean);
  return {
    ad:cs.filter(c=>c.d==='AD').length, ap:cs.filter(c=>c.d==='AP').length,
    front:cs.reduce((a,c)=>a+c.f,0), cc:cs.reduce((a,c)=>a+c.cc,0),
    tags:{engage:cs.reduce((a,c)=>a+c.tags.engage,0),fight:cs.reduce((a,c)=>a+c.tags.fight,0)},
  };
}
function aiBanChamp(){
  const avail=dAvailable(); const me=myTeam();
  // deny signature comfort or top meta
  let best=null,bs=-1e9;
  avail.forEach(c=>{
    let s=champTier(c)*5;
    let sig=0;
    Object.values(me.lineup).forEach(n=>{const p=S.players[n]; if(p&&p.sigs.includes(c.n)) sig+=7;});
    s+=sig;
    if(c.r.some(r=>ROLE_W[r]>=1.05)) s+=2;
    s+=rnd(-4,4);
    if(s>bs){bs=s;best=c;}
  });
  return best||avail[0];
}
function assignRoleForPick(c){
  const need=dMyRoles();
  if(c.r.some(r=>need.includes(r))){
    // prefer primary role if unfilled
    if(need.includes(c.r[0])) return c.r[0];
    return c.r.find(r=>need.includes(r));
  }
  return null;
}
function draftMyBan(champName){
  if(D.phase!=='ban'||dTurn()!=='me') return;
  const c=CHAMP_MAP[champName]; if(!c||dUsed().includes(champName)) return;
  D.myBans.push(champName);
  D.step++;
  if(D.step>=6){ D.phase='pick'; D.step=0; }
  afterDraftStep();
}
function draftMyPick(champName){
  if(D.phase!=='pick'||dTurn()!=='me') return;
  const c=CHAMP_MAP[champName]; if(!c||dUsed().includes(champName)) return;
  const role=assignRoleForPick(c); if(!role) return;
  const starter=S.players[T(S.userTeam).lineup[role]];
  D.myPicks.push({role, champ:champName, player:starter?starter.name:''});
  D.step++;
  afterDraftStep();
}
function draftOppBan(){ const c=aiBanChamp(); D.oppBans.push(c.n); D.step++; if(D.step>=6){D.phase='pick';D.step=0;} afterDraftStep(); }
function draftOppPick(){ const c=aiPickChamp(); const need=dOppRoles(); const role=(c.r.find(r=>need.includes(r))||need[0]); D.oppPicks.push({role, champ:c.n, player:(S.players[T(D.oppId).lineup[role]]||{}).name||''}); D.step++; afterDraftStep(); }

function afterDraftStep(){
  if(D.phase==='pick' && D.step>=10){
    D.phase='done'; D.done=true;
    D.result=evalDraft();
    saveGame(); renderDraft(); return;
  }
  renderDraft();
  if(!D.done && dTurn()==='opp'){
    setTimeout(()=>{
      if(!D||D.done) return;
      if(D.phase==='ban') draftOppBan(); else draftOppPick();
    }, 480);
  }
}

function evalDraft(){
  const me=T(S.userTeam), opp=T(D.oppId);
  const lane={};
  ROLES.forEach(r=>{
    const mine=D.myPicks.find(p=>p.role===r);
    const theirs=D.oppPicks.find(p=>p.role===r);
    const mp=S.players[me.lineup[r]], op=S.players[opp.lineup[r]];
    const mc=mine?CHAMP_MAP[mine.champ]:null, oc=theirs?CHAMP_MAP[theirs.champ]:null;
    lane[r]={my:mc?laneScore(mp,mc):60, opp:oc?laneScore(op,oc):60,
      myChamp:mine?mine.champ:'', oppChamp:theirs?theirs.champ:'', myPlayer:mp?mp.name:'', oppPlayer:op?op.name:''};
  });
  const myComp=evalComp(D.myPicks), oppComp=evalComp(D.oppPicks);
  let laneAdv=0; ROLES.forEach(r=>{laneAdv+=(lane[r].my-lane[r].opp);});
  laneAdv/=5;
  // side bonuses: blue = first-pick priority (+1.5), red = counter pick (+1.5 in mid/adc)
  let sideBonus=0;
  if(D.mySide==='blue'){ sideBonus+=0.6; if(D.myPicks[0]&&champTier(D.myPicks[0].champ)>=4) sideBonus+=0.8; }
  else { sideBonus+=0.6; const last=D.myPicks[D.myPicks.length-1]; if(last) sideBonus+=0.5; }
  return {lane, myComp, oppComp, laneAdv, sideBonus,
    myScore: myComp.score+laneAdv*0.55+sideBonus,
    oppScore: oppComp.score-laneAdv*0.55};
}

/* ---------- match sim ---------- */
const TACTICS=[
  {k:'split131',n:'1-3-1 사이드',d:'사이드 압박 → 타워·골드 이득, 한타 약화',icon:'🧭'},
  {k:'split14', n:'1-4 스플릿',d:'4인 미드 압박 → 오브젝트·타워 압박',icon:'🚀'},
  {k:'baron',   n:'바론 시야·낚시',d:'시야 장악 후 픽오프 유도',icon:'🕯'},
  {k:'force',   n:'한타 강제 개시',d:'이니시로 즉시 교전, 리스크 큼',icon:'💥'},
  {k:'trade',   n:'크로스맵 교환',d:'오브젝트 주고 사이드 이득',icon:'🔀'},
];

function startMatch(draftResult){
  const me=T(S.userTeam), opp=T(D.oppId);
  const mySide=draftResult.mySide||D.mySide;
  const lane=draftResult.lane;
  const gp=S.gameplan||{jungle:'mid',laneSwap:false,firstObj:'grub',dive:false};
  const myPower=teamPower(me), oppPower=teamPower(opp);
  let edge=(myPower-oppPower)*0.85 + (draftResult.myComp.score-draftResult.oppComp.score)*0.3 + draftResult.laneAdv*0.25 + draftResult.sideBonus;
  // gameplan effects
  if(gp.jungle==='top'){ edge+=(lane.TOP.my-lane.TOP.opp)*0.06; }
  if(gp.jungle==='bot'){ edge+=(lane.ADC.my-lane.ADC.opp)*0.06; }
  if(gp.laneSwap){ const botGap=lane.ADC.my-lane.ADC.opp; if(botGap<0) edge+=-botGap*0.12; edge-=0.4; }
  if(gp.dive) edge+=0.5;
  edge += (S.seriesMomentum||0) + ((S.currentSeries&&S.currentSeries.nextEdge)||0);
  M={
    minute:0, gold:[0,0], kills:[0,0], towers:[0,0], dragons:[0,0], grubs:[0,0], barons:[0,0],
    fights:[0,0], vision:[0,0], events:[], over:false, running:false, speed:1,
    edge, mySide, oppId:opp.id, oppName:opp.name, myName:me.name,
    myComp:draftResult.myComp, oppComp:draftResult.oppComp,
    lane, gp, tactic:null, tacticAt:[], lastTacticMin:0,
    history:[], winProb:0.5, series:D.series, gameIdx:D.gameIdx,
    lineups:{me:ROLES.map(r=>({role:r,name:(S.players[me.lineup[r]]||{}).name||'',champ:(D.myPicks.find(p=>p.role===r)||{}).champ||''})),
             opp:ROLES.map(r=>({role:r,name:(S.players[opp.lineup[r]]||{}).name||'',champ:(D.oppPicks.find(p=>p.role===r)||{}).champ||''}))},
    mvp:null, needTactic:false, pending:null,
  };
  M.winProb=winProb();
  M.history.push({min:0,diff:0});
  logEvent('sys','밴픽 완료 — '+me.name+' vs '+opp.name+', '+ (mySide==='blue'?'블루':'레드') +' 사이드');
  // side intro
  logEvent('sys', '상대 조합: '+(D.oppPicks.map(p=>p.champ).join(' · ')));
  renderMatch(); startTimer();
}
function startTimer(){
  stopTimer();
  TIMER=setInterval(()=>{ if(!M||M.over||!M.running) return; tick(); }, 620);
}
function stopTimer(){ if(TIMER){clearInterval(TIMER);TIMER=null;} }
function setSpeed(s){ if(!M) return; M.speed=s; stopTimer(); TIMER=setInterval(()=>{ if(!M||M.over||!M.running) return; tick(); }, Math.round(620/s)); renderMatch(); }
function togglePlay(){ if(!M) return; M.running=!M.running; if(M.running&&M.needTactic) M.running=false; renderMatch(); }

function logEvent(kind,text,minute){
  if(!M) return;
  text=String(text).replace(/^\d+분 · /,'');
  M.events.unshift({kind,text,minute:minute===undefined?M.minute:minute});
  if(M.events.length>90) M.events.pop();
}
function curveAt(comp,min){
  const c=comp.curve;
  if(min<15) return c[0];
  if(min<25) return c[1];
  return c[2];
}
function winProb(){
  if(!M) return 0.5;
  const gd=M.gold[0]-M.gold[1];
  const kd=M.kills[0]-M.kills[1];
  const td=M.towers[0]-M.towers[1];
  const dd=M.dragons[0]-M.dragons[1];
  const bd=M.barons[0]-M.barons[1];
  const cd=curveAt(M.myComp,M.minute)-curveAt(M.oppComp,M.minute);
  const tf=clamp(M.minute/14,0.3,1);
  let s=(gd/2600)*tf + kd*0.05 + td*0.07 + dd*0.13 + bd*0.4 + cd*0.22 + M.edge*0.032 + (M.tacticEdge||0);
  return clamp(sig(s),0.03,0.97);
}
function sideIdx(team){ return team==='me'?0:1; }
function addGold(team,amount){ M.gold[sideIdx(team)]+=Math.round(amount); }
function myChampAt(role){ return (M.lineups.me.find(x=>x.role===role)||{}).champ||'챔피언'; }
function oppChampAt(role){ return (M.lineups.opp.find(x=>x.role===role)||{}).champ||'챔피언'; }
function myNameAt(role){ return (M.lineups.me.find(x=>x.role===role)||{}).name||'우리 팀'; }
function oppNameAt(role){ return (M.lineups.opp.find(x=>x.role===role)||{}).name||'상대'; }

function tick(){
  if(!M||M.over) return;
  M.minute++;
  const m=M.minute;
  // passive gold (economy edge from lane advantages)
  const eco=(M.lane ? (M.lane.TOP.my-M.lane.TOP.opp)+(M.lane.ADC.my-M.lane.ADC.opp) : 0)*1.1;
  addGold('me', 620+eco*1.1+rnd(-35,35));
  addGold('opp', 620-eco*1.1+rnd(-35,35));
  // tactics prompts
  if((m===12||m===22) && !M.tacticAt.includes(m)){
    M.needTactic=true; M.running=false;
    logEvent('sys','⏸ '+m+'분 — 미드게임 작전을 지시하세요');
    renderMatch(); return;
  }
  const p=winProb();
  const killFavor=clamp(0.5+(p-0.5)*0.55,0.12,0.88);
  // individual kills
  const aggr=1+(M.tactic==='force'?0.35:0)+(M.tactic==='split131'?0.08:0);
  if(Math.random()<0.30*aggr){
    const meWins=Math.random()<killFavor;
    const team=meWins?'me':'opp';
    const role=pickOf(ROLES);
    addGold(team,300); M.kills[sideIdx(team)]++;
    const champ=team==='me'?myChampAt(role):oppChampAt(role);
    const nm=team==='me'?myNameAt(role):oppNameAt(role);
    const sideCls=team==='me'?'blue':'red';
    if(Math.random()<0.4){
      const victimRole=team==='me'?pickOf(ROLES):pickOf(ROLES);
      const victim=team==='me'?oppNameAt(victimRole):myNameAt(victimRole);
      logEvent(sideCls, m+'분 · <b>'+nm+'</b>('+champ+') 솔로킬! '+ROLE_KR[role]+'에서 '+victim+'를 잡아냅니다.');
    }else{
      const gankRole=pickOf(ROLES.filter(r=>r!==role));
      const gankName=team==='me'?myNameAt(gankRole):oppNameAt(gankRole);
      const gankChamp=team==='me'?myChampAt(gankRole):oppChampAt(gankRole);
      logEvent(sideCls, m+'분 · '+ROLE_KR[gankRole]+' 갱킹 성공 — <b>'+gankName+'</b>('+gankChamp+')이(가) 킬을 챙깁니다.');
    }
  }
  // grubs (both teams contest regardless of priority)
  if(m===6||m===10){
    const focus=(M.tactic==='trade'?-0.9:0)+(M.gp.firstObj==='grub'?0.3:-0.1)+(M.gp.jungle==='top'?0.12:0);
    const meWins=Math.random()<clamp(killFavor+focus,0.08,0.92);
    const team=meWins?'me':'opp';
    M.grubs[sideIdx(team)]+=3; addGold(team,190*S.meta.obj.grub);
    logEvent(team==='me'?'blue':'red', m+'분 · 공허 유충 3스택 — <b>'+(team==='me'?M.myName:M.oppName)+'</b>이(가) 유충을 가져갑니다.');
  }
  // dragons
  const dTimes=[5,11,17,23,29];
  if(dTimes.includes(m)){
    const dFocus=(M.gp.firstObj==='dragon'?0.25:-0.08)+(M.tactic==='trade'?-1.1:0)+(M.tactic==='baron'?0.15:0)+(M.gp.jungle==='bot'?0.1:0);
    const mep=clamp(killFavor+dFocus,0.08,0.92);
    const meWins=Math.random()<mep;
    const team=meWins?'me':'opp';
    M.dragons[sideIdx(team)]++;
    addGold(team,380*S.meta.obj.dragon);
    const dn=M.dragons[sideIdx(team)];
    let txt=m+'분 · 드래곤 처치 — <b>'+(team==='me'?M.myName:M.oppName)+'</b> ('+dn+'스택)';
    if(dn>=4) txt=m+'분 · <b>드래곤 소울 획득!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) 장로 버프를 확보합니다.';
    logEvent(team==='me'?'blue':'red',txt);
  }
  // towers
  if(m>=8 && Math.random()<0.20*S.meta.obj.tower){
    const meWins=Math.random()<clamp(killFavor+(M.tactic==='split131'?0.08:0)+(M.tactic==='split14'?0.1:0)+(M.tactic==='trade'?0.1:0),0.08,0.92);
    const team=meWins?'me':'opp';
    M.towers[sideIdx(team)]++;
    addGold(team,240);
    if(M.towers[sideIdx(team)]%2===0) logEvent(team==='me'?'blue':'red', m+'분 · '+(team==='me'?M.myName:M.oppName)+' 외곽 타워 철거 — 시야가 넓어집니다.');
  }
  // teamfights
  if(m>=13 && Math.random()<0.07*(1+(M.tactic==='force'?1.0:0))){
    const fightEdge=(M.myComp.tags.fight-M.oppComp.tags.fight)*0.015+(M.myComp.front-M.oppComp.front)*0.01+(M.myComp.cc-M.oppComp.cc)*0.006;
    const meWins=Math.random()<clamp(killFavor+fightEdge+(M.tactic==='force'?0.06:0)-(M.tactic==='split131'?0.08:0),0.05,0.95);
    const team=meWins?'me':'opp';
    const n=ri(1,3);
    M.kills[sideIdx(team)]+=n; addGold(team,n*300+120);
    M.fights[sideIdx(team)]++;
    logEvent(team==='me'?'blue':'red', m+'분 · <b>대규모 한타</b> — '+(team==='me'?M.myName:M.oppName)+'이(가) '+n+'킬 스왑하며 주도권을 가져갑니다.');
  }
  // baron
  if([20,26,32].includes(m)){
    const baronFocus=(M.tactic==='baron'?0.7:0)+(M.tactic==='trade'?-1.0:0);
    const meWins=Math.random()<clamp(killFavor+baronFocus+(M.grubs[0]>M.grubs[1]?0.06:0),0.05,0.95);
    const team=meWins?'me':'opp';
    M.barons[sideIdx(team)]++;
    addGold(team,1200*S.meta.obj.baron);
    logEvent(team==='me'?'blue':'red', m+'분 · <b>바론 처치!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) 바론 버프로 압박을 시작합니다.');
  }
  // tactic passive effects
  if(M.tactic==='split131'||M.tactic==='split14'||M.tactic==='trade'){
    const bonus=M.tactic==='split14'?60:M.tactic==='split131'?48:34;
    addGold(Math.random()<killFavor?'me':'opp',bonus);
  }
  M.vision[0]+=ri(2,4); M.vision[1]+=ri(2,4);
  M.winProb=winProb();
  M.history.push({min:m,diff:M.gold[0]-M.gold[1]});
  // end conditions
  const gd=M.gold[0]-M.gold[1];
  if((m>=27&&Math.abs(gd)>6000)||(m>=31&&Math.abs(gd)>3800)||(m>=35&&Math.abs(gd)>2000)||m>=38){
    finishGame();
    return;
  }
  renderMatch();
}
function chooseTactic(k){
  if(!M||M.over) return;
  M.tactic=k; M.tacticAt.push(M.minute); M.needTactic=false;
  const bonuses={split131:0.05,split14:0.06,baron:0.09,force:0.03,trade:0.02};
  M.tacticEdge=(bonuses[k]||0)+(M.myComp.tags.split-M.oppComp.tags.split)*0.012;
  const tname=(TACTICS.find(t=>t.k===k)||{}).n;
  logEvent('sys','📋 감독 지시: '+tname);
  M.running=true;
  renderMatch();
}
function finishGame(){
  if(!M||M.over) return;
  M.over=true; M.running=false; stopTimer();
  const gd=M.gold[0]-M.gold[1];
  let meWin;
  if(Math.abs(gd)>3000) meWin=gd>0;
  else meWin=Math.random()<clamp(0.5+gd/6000,0.15,0.85);
  M.meWin=meWin;
  M.winProb=meWin?1:0;
  const winTeam=meWin?'me':'opp';
  logEvent(meWin?'blue':'red', M.minute+'분 · <b>넥서스 파괴!</b> '+(meWin?M.myName:M.oppName)+' 승리', M.minute);
  // mvp
  const winners=winTeam==='me'?M.lineups.me:M.lineups.opp;
  const mvp=pickOf(winners.filter(x=>x.name));
  M.mvp=mvp;
  S.seriesMomentum=meWin?0.8:-0.8;
  // apply consequences
  const me=T(S.userTeam), opp=T(M.oppId);
  const myPlayers=lineupOf(me), oppPlayers=lineupOf(opp);
  if(meWin){
    myPlayers.forEach(p=>{p.form=clamp(p.form+ri(2,6),10,100);p.fatigue=clamp(p.fatigue+ri(6,11),0,100);});
    oppPlayers.forEach(p=>{p.form=clamp(p.form-ri(2,6),10,100);p.fatigue=clamp(p.fatigue+ri(5,10),0,100);});
  }else{
    myPlayers.forEach(p=>{p.form=clamp(p.form-ri(2,6),10,100);p.fatigue=clamp(p.fatigue+ri(6,11),0,100);});
    oppPlayers.forEach(p=>{p.form=clamp(p.form+ri(1,4),10,100);});
  }
  if(M.mvp && M.mvp.name) S.pog[M.mvp.name]=(S.pog[M.mvp.name]||0)+(meWin?100:60);
  // series update
  const sr=M.series;
  if(meWin) sr.score.me++; else sr.score.opp++;
  sr.games.push({win:meWin, minute:M.minute, kills:M.kills.slice(), gold:M.gold.slice(),
    mvp:(M.mvp||{}).name||'', mvpChamp:(M.mvp||{}).champ||'',
    dragons:M.dragons.slice(), towers:M.towers.slice(), barons:M.barons.slice(),
    myComp:M.myComp, oppComp:M.oppComp, lane:M.lane, edge:M.edge, tactics:M.tacticAt, history:M.history.slice()});
  // fearless lock
  if(sr.fearless){ sr.fearlessUsed.push(...D.myPicks.map(p=>p.champ), ...D.oppPicks.map(p=>p.champ)); }
  saveGame();
  renderSeriesResult();
}
function analyzeGame(game){
  if(!game) return {reasons:[]};
  const lane=game.lane||{}; const reasons=[]; const laneR=[];
  ROLES.forEach(r=>{
    const d=(lane[r]?lane[r].my-lane[r].opp:0);
    if(Math.abs(d)>2.5) laneR.push({k:'lane',v:Math.sign(d),d,txt:ROLE_KR[r]+' 라인전 '+(d>0?'우위':'열세')+' ('+(d>0?'+':'')+d.toFixed(1)+')'});
  });
  laneR.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  laneR.slice(0,3).forEach(x=>reasons.push(x));
  const myC=game.myComp, opC=game.oppComp;
  if(myC&&opC){
    if(game.win && opC.tags.scale>myC.tags.scale+2) reasons.push({k:'comp',v:1,txt:'후반 밸류 싸움에서 앞섰습니다'});
    if(!game.win && myC.tags.scale<opC.tags.scale-2) reasons.push({k:'late',v:-1,txt:'후반 밸류 열세 — 30분 이후 한타에서 밀렸습니다'});
    if(!game.win && myC.tags.engage<opC.tags.engage-2) reasons.push({k:'engage',v:-1,txt:'이니시 싸움에서 밀렸습니다'});
    if(!game.win && myC.front<opC.front-2) reasons.push({k:'front',v:-1,txt:'프론트라인이 무너졌습니다'});
    if(myC.tags.engage>=9 && game.win) reasons.push({k:'engage',v:1,txt:'강한 이니시로 교전을 열었습니다'});
  }
  if(game.kills && game.kills[0]<game.kills[1]-4) reasons.push({k:'fight',v:-1,txt:'교전 킬 스코어 열세'});
  return {reasons};
}

/* ============ SEASON / FLOW ============ */
function genSchedule(ids){
  const arr=ids.slice(); const n=arr.length; const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i],b=arr[n-1-i];
      pairs.push(r%2===0?[a,b]:[b,a]);
    }
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function standings(){
  return Object.values(S.teams).sort((x,y)=>(y.wins-x.wins)||((y.gw-y.gl)-(x.gw-x.gl))||(y.gw-x.gw));
}
function myRank(){ return standings().findIndex(t=>t.id===S.userTeam)+1; }
function weekOpponent(){
  const pairs=S.schedule[S.week-1]||[];
  const p=pairs.find(x=>x.includes(S.userTeam));
  if(!p) return null;
  return {oppId:p[0]===S.userTeam?p[1]:p[0], pair:p};
}
function recordResult(aId,bId,sa,sb,week,stage){
  const a=T(aId),b=T(bId);
  a.gw+=sa;a.gl+=sb;b.gw+=sb;b.gl+=sa;
  if(sa>sb){a.wins++;b.losses++;a.form.push('W');b.form.push('L');}
  else{b.wins++;a.losses++;b.form.push('W');a.form.push('L');}
  if(a.form.length>6)a.form.shift(); if(b.form.length>6)b.form.shift();
  S.results.push({week,stage,a:aId,b:bId,sa,sb});
}
function simAIBo(aId,bId,bo){
  const pa=teamPower(T(aId)),pb=teamPower(T(bId));
  const need=Math.ceil(bo/2); let sa=0,sb=0;
  const base=sig((pa-pb)/5.5);
  while(sa<need&&sb<need){
    if(Math.random()<clamp(base+ (Math.random()-0.5)*0.16,0.05,0.95)) sa++; else sb++;
  }
  return {sa,sb};
}

/* ---------- series ---------- */
function createSeries(oppId,bo,stage,meta){
  const s={oppId,bo,stage,meta:meta||{},score:{me:0,opp:0},games:[],sides:[],fearless:!!S.fearless,
    fearlessUsed:[],done:false,pendingSide:false,coach:null,momentum:0,startedAt:Date.now()};
  s.sides[0]=Math.random()<0.5?'blue':'red';
  S.currentSeries=s; S.seriesMomentum=0;
  return s;
}
function seriesWinNeed(s){ return Math.ceil(s.bo/2); }
function seriesOver(s){ return s.score.me>=seriesWinNeed(s)||s.score.opp>=seriesWinNeed(s); }
function userWonSeries(s){ return s.score.me>=seriesWinNeed(s); }
function aiSideChoice(){
  const opp=T(S.currentSeries.oppId);
  const topPick=Math.max(...Object.values(opp.lineup).map(n=>{
    const p=S.players[n]; return p?Math.max(...p.sigs.map(x=>champTier(x))):0;
  }));
  return topPick>=5?'blue':'red';
}
function setNextSide(side){
  const s=S.currentSeries; if(!s) return;
  s.sides[s.games.length]=side; s.pendingSide=false;
  startDraft(s);
}
function nextSeriesGame(){
  const s=S.currentSeries; if(!s) return;
  if(seriesOver(s)){ finishSeries(); return; }
  const last=s.games[s.games.length-1];
  if(!last){ startDraft(s); return; }
  const userLost=!last.win;
  if(userLost){ s.pendingSide=true; renderSideChoice(); }
  else { s.sides[s.games.length]=aiSideChoice(); startDraft(s); }
}
function applyCoaching(kind){
  const s=S.currentSeries; if(!s||!s.coach||s.coach.applied) return;
  const me=myTeam();
  if(kind==='mental'){
    lineupOf(me).forEach(p=>{p.form=clamp(p.form+ri(5,10),20,100);p.fatigue=clamp(p.fatigue-ri(3,7),0,100);});
    s.coach.msg='멘탈 케어 완료 — 선수단 컨디션과 집중력이 올라갔습니다';
  }else if(kind==='tactic'){
    s.nextEdge=(s.nextEdge||0)+1.1;
    s.coach.msg='전술 수정 — 다음 세트 초반 설계와 교전 규칙을 재정비했습니다';
  }else if(kind==='sub'){
    const worst=lineupOf(me).slice().sort((a,b)=>effRating(a)-effRating(b))[0];
    const bench=me.roster.map(n=>S.players[n]).filter(p=>!Object.values(me.lineup).includes(p.name));
    const best=bench.sort((a,b)=>effRating(b)-effRating(a))[0];
    if(worst&&best){
      const role=Object.keys(me.lineup).find(r=>me.lineup[r]===worst.name);
      me.lineup[role]=best.name;
      s.coach.msg='식스맨 교체 — '+worst.name+' OUT, '+best.name+' IN ('+ROLE_KR[role]+')';
    }else{ s.coach.msg='교체 가능한 식스맨이 없습니다'; }
  }
  s.coach.applied=kind;
  saveGame(); renderSeriesResult();
}
function finishSeries(){
  const s=S.currentSeries; if(!s) return;
  s.done=true;
  const meWon=userWonSeries(s);
  const oppId=s.oppId;
  if(s.stage==='regular'){
    recordResult(S.userTeam,oppId,s.score.me,s.score.opp,S.week,'regular');
    // other matches of the week
    (S.schedule[S.week-1]||[]).forEach(([a,b])=>{
      if(a===S.userTeam||b===S.userTeam) return;
      const r=simAIBo(a,b,3);
      recordResult(a,b,r.sa,r.sb,S.week,'regular');
    });
    S.history.push({week:S.week,opp:oppId,score:s.score.me+'-'+s.score.opp,win:meWon});
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'regular'};
    S.week++;
    S.actionApplied=false; S.weekActionTarget=null; S.gameplan=null;
    if(S.week>ROUNDS){ startPlayoffs(); }
    else if([4,7].includes(S.week)){ applyPatch(S.week===4?1:2); }
    S.currentSeries=null; S.seriesMomentum=0;
  }else{
    const m=s.meta.match;
    m.sa=s.score.me; m.sb=s.score.opp; m.winner=meWon?S.userTeam:oppId; m.done=true;
    recordResult(S.userTeam,oppId,s.score.me,s.score.opp,S.week,'playoffs');
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:s.stage};
    S.currentSeries=null; S.seriesMomentum=0;
    if(s.stage==='final'){
      S.phase='end';
      S.champion=meWon?S.userTeam:oppId;
      S.runnerUp=meWon?oppId:S.userTeam;
      applyPatch(3,true);
    }
  }
  saveGame();
  if(S.phase==='end'){ renderChampion(); }
  else renderAfterSeries();
}

/* ---------- playoffs ---------- */
function startPlayoffs(){
  const st=standings();
  const seeds=st.slice(0,6).map(t=>t.id);
  S.playoffs={
    seeds,
    rounds:[
      {name:'6강 PO',matches:[
        {a:seeds[2],b:seeds[5],done:false},
        {a:seeds[3],b:seeds[4],done:false},
      ]},
      {name:'4강 PO',matches:[
        {a:seeds[0],b:null,done:false},
        {a:seeds[1],b:null,done:false},
      ]},
      {name:'결승',matches:[{a:null,b:null,done:false}]},
    ],
    done:false,
  };
  S.phase='playoffs';
  applyPatch(3,true);
  saveGame();
}
function ensureBracket(){
  const P=S.playoffs; if(!P) return;
  const r0=P.rounds[0],r1=P.rounds[1],r2=P.rounds[2];
  if(r0.matches.every(m=>m.done)){
    r1.matches[0].b=r0.matches[0].winner;
    r1.matches[1].b=r0.matches[1].winner;
  }
  if(r1.matches.every(m=>m.done&&m.winner)){
    r2.matches[0].a=r1.matches[0].winner;
    r2.matches[0].b=r1.matches[1].winner;
  }
}
function playoffNext(){
  const P=S.playoffs; if(!P||P.done) return {action:'done'};
  for(let pass=0;pass<6;pass++){
    ensureBracket();
    let simmed=false;
    for(let r=0;r<P.rounds.length;r++){
      for(const m of P.rounds[r].matches){
        if(m.done||!m.a||!m.b) continue;
        if(m.a===S.userTeam||m.b===S.userTeam){
          return {action:'user',match:m,round:r,roundName:P.rounds[r].name};
        }
        const res=simAIBo(m.a,m.b,5);
        m.sa=res.sa;m.sb=res.sb;m.winner=res.sa>res.sb?m.a:m.b;m.done=true;
        recordResult(m.a,m.b,res.sa,res.sb,S.week,'playoffs');
        simmed=true;
      }
    }
    const fin=P.rounds[2].matches[0];
    if(fin.done){
      P.done=true;
      S.phase='end';
      S.champion=fin.winner;
      S.runnerUp=fin.winner===fin.a?fin.b:fin.a;
      saveGame();
      return {action:'done'};
    }
    if(!simmed) break;
  }
  return {action:'none'};
}
function startPlayoffSeries(match,roundName){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const s=createSeries(oppId,5,'playoff',{match,roundName});
  if(!s.sides[0]) s.sides[0]='blue';
  saveGame();
  return s;
}

/* ---------- season transition ---------- */
function nextSeason(){
  S.season++;
  S.week=1; S.phase='regular'; S.results=[]; S.history=[]; S.playoffs=null; S.champion=null;
  S.meta={tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}}; S.patches=[];
  S.currentSeries=null; S.seriesMomentum=0;
  Object.values(S.teams).forEach(t=>{t.wins=0;t.losses=0;t.gw=0;t.gl=0;t.form=[];});
  Object.values(S.players).forEach(p=>{
    p.age++;
    if(p.age<=21){ const k=pickOf(['lane','fight','pool']); p.stats[k]=clamp(p.stats[k]+ri(1,3),40,99); p.stats.macro=clamp(p.stats.macro+ri(0,2),40,99); }
    else if(p.age>=27){ const k=pickOf(['lane','fight','mental']); p.stats[k]=clamp(p.stats[k]-ri(1,2),40,99); }
    p.stats.mental=clamp(p.stats.mental+ri(-1,2),40,99);
    p.form=ri(65,85); p.fatigue=ri(3,15);
  });
  // AI roster shuffle: swap some free agents
  S.schedule=genSchedule(Object.keys(S.teams));
  applyPatch(0,true);
  saveGame(); renderAll();
}

/* ---------- save ---------- */
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const s=JSON.parse(raw);
    if(!s||!s.teams||!s.userTeam) return false;
    S=s;
    if(!S.meta) S.meta={tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}};
    if(!S.patches) S.patches=[];
    if(!S.pog) S.pog={};
    return true;
  }catch(e){ return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function deleteSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function toast(msg,ms){
  const t=$('toast'); if(!t) return;
  t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.add('hidden'),ms||2400);
}

  const sigs=[].concat(...ps.map(p=>p.sigs));
  const tags={engage:0,poke:0,fight:0,split:0,scale:0};
  sigs.forEach(n=>{const c=CHAMP_MAP[n]; if(c) for(const k in tags) tags[k]+=c.tags[k];});
  const styleKey=Object.keys(tags).sort((a,b)=>tags[b]-tags[a])[0];

function spaceLabel(){
  const ps=lineupOf(myTeam());
  const avg=ps.reduce((a,p)=>a+p.form-p.fatigue*0.6,0)/Math.max(ps.length,1);
  if(avg>52) return '최상';
  if(avg>38) return '양호';
  if(avg>24) return '보통';
  return '위험';
}

/* ---------- hub bindings ---------- */
function bindHub(){
  const c=$('view-hub');
  c.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ S.weekAction=b.dataset.act; renderHub(); });
  c.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{ S.weekActionTarget=b.dataset.focus; renderHub(); });
  const gm=$('goMatch'); if(gm) gm.onclick=()=>prepareMatch();
  const rs=$('resumeSeries'); if(rs) rs.onclick=()=>{ if(S.currentSeries){ if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries);} };
  c.querySelectorAll('[data-player]').forEach(el=>el.onclick=()=>openPlayer(el.dataset.player));
  c.querySelectorAll('[data-sign]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); const r=signFA(b.dataset.sign); if(!r.ok) toast(r.msg);});
  c.querySelectorAll('[data-release]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); if(confirm(b.dataset.release+' 선수를 방출할까요?')){const r=releasePlayer(b.dataset.release); if(!r.ok) toast(r.msg);}});
}
function prepareMatch(){
  if(!S.actionApplied) applyWeekAction();
  const opp=weekOpponent(); if(!opp) return;
  const s=createSeries(opp.oppId,3,'regular',{});
  saveGame();
  startDraft(s);
}

function drawGraph(){
  const cv=$('goldCanvas'); if(!cv||!M) return;
  const w=cv.clientWidth||320, h=132, dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  // grid
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){ const y=h*i/4; ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke(); }
  const hist=M.history.length>1?M.history:[{min:0,diff:0},{min:M.minute,diff:0}];
  const maxAbs=Math.max(2000,...hist.map(p=>Math.abs(p.diff)))*1.2;
  const X=m=>8+(m/40)*(w-16);
  const Y=d=>h/2-(d/maxAbs)*(h/2-8);
  // center
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
  const pts=hist.map(p=>[X(Math.min(p.min,40)),Y(p.diff)]);
  // area
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(37,224,255,.35)');grad.addColorStop(.5,'rgba(37,224,255,.03)');grad.addColorStop(.5,'rgba(255,77,109,.03)');grad.addColorStop(1,'rgba(255,77,109,.35)');
  ctx.beginPath(); ctx.moveTo(pts[0][0],h/2);
  pts.forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(pts[pts.length-1][0],h/2); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  // line
  ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.strokeStyle='#7ceaff'; ctx.lineWidth=2; ctx.stroke();
  // head
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],3.2,0,7); ctx.fillStyle=M.gold[0]>=M.gold[1]?'#25e0ff':'#ff4d6d'; ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='9px sans-serif';
  ctx.fillText('+'+Math.round(maxAbs/1000)+'K',6,14);
  ctx.fillText('-'+Math.round(maxAbs/1000)+'K',6,h-6);
  ctx.fillText('40\'',w-20,h-6);
}

  $('modalWrap').onclick=e=>{ if(e.target.id==='modalWrap') closeModal(); };
}

/* ---------- playoffs ---------- */
function bracketHTML(){
  const P=S.playoffs; if(!P) return '';
  return `<div class="bracket">
    ${P.rounds.map(rd=>`<div class="bround">
      <div class="bl">${esc(rd.name)}</div>
      ${rd.matches.map(m=>{
        const a=m.a?T(m.a):null,b=m.b?T(m.b):null;
        return `<div class="bmatch">
          <div class="bs ${m.done&&m.winner===m.a?'win':''} ${m.a===S.userTeam?'me':''}">
            ${a?badge(a,'sm')+'<span>'+esc(a.tag)+'</span>':'<span>TBD</span>'}<span class="bsc">${m.done?m.sa:'—'}</span>
          </div>
          <div class="bs ${m.done&&m.winner===m.b?'win':''} ${m.b===S.userTeam?'me':''}">
            ${b?badge(b,'sm')+'<span>'+esc(b.tag)+'</span>':'<span>TBD</span>'}<span class="bsc">${m.done?m.sb:'—'}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('')}
  </div>`;
}
function nextUserPlayoffMatch(){
  const P=S.playoffs; if(!P) return null;
  ensureBracket();
  for(const rd of P.rounds) for(const m of rd.matches){
    if(!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam)) return {m,rd};
  }
  return null;
}
function renderPlayoffs(){
  const P=S.playoffs; if(!P){ renderAll(); return; }
  const fin=P.rounds[2].matches[0];
  const um=nextUserPlayoffMatch();
  const st=standings();
  const myPos=st.findIndex(t=>t.id===S.userTeam)+1;
  const alive=!P.done && !P.rounds.flatMap(r=>r.matches).some(m=>m.done&&m.winner&&((m.a===S.userTeam&&m.winner!==S.userTeam)||(m.b===S.userTeam&&m.winner!==S.userTeam)));
  const resumable=S.currentSeries&&!S.currentSeries.done?S.currentSeries:null;
  $('view-playoffs').innerHTML=`
    <div class="hero" style="padding:16px 14px 4px">
      <div class="kicker">LCK PLAYOFFS</div>
      <h1 style="font-size:26px">${S.season}시즌 플레이오프</h1>
      <p>6강 단판 시리즈 · 3위부터 시작하는 ${esc(T(P.seeds[0]).tag)}의 기다림</p>
    </div>
    <div class="card">
      <div class="card-h"><h4>대진표</h4><span class="k">Bo5</span></div>
      ${bracketHTML()}
      <div class="tiny" style="margin-top:6px">6강: 3v6 · 4v5 → 4강: 1위 vs 승자, 2위 vs 승자 → 결승</div>
    </div>
    <div class="card">
      <div class="row between">
        <div><div class="tiny">정규시즌 최종 순위</div><div style="font-weight:900;font-size:17px">${myPos}위 · ${esc(myTeam().tag)}</div></div>
        <span class="chip ${P.seeds.includes(S.userTeam)?'green':'red'}">${P.seeds.includes(S.userTeam)?'PO 진출':'PO 탈락'}</span>
      </div>
      ${P.done?`<div class="divider"></div><div class="row between"><span class="tiny">우승</span><b style="color:var(--gold)">${esc(T(P.rounds[2].matches[0].winner).name)}</b></div>`:''}
    </div>
    ${resumable?`<div class="card" style="border-color:rgba(255,201,74,.4)">
      <div class="card-h"><h4>진행 중인 플레이오프 시리즈</h4><span class="k">${resumable.score.me} : ${resumable.score.opp}</span></div>
      <button class="btn gold block" id="poResume">시리즈 이어하기</button>
    </div>`:''}
    ${um?`<div class="card" style="border-color:rgba(37,224,255,.4)">
      <div class="card-h"><h4>${esc(um.rd.name)} · 다음 경기</h4><span class="k">Bo5</span></div>
      <div class="row between" style="margin-bottom:10px">
        <div class="row" style="gap:7px">${badge(myTeam())}<b>${esc(myTeam().tag)}</b></div>
        <span class="chip sm">VS</span>
        <div class="row" style="gap:7px"><b>${esc(T(um.m.a===S.userTeam?um.m.b:um.m.a).tag)}</b>${badge(T(um.m.a===S.userTeam?um.m.b:um.m.a))}</div>
      </div>
      <button class="btn primary block" id="poBtn">경기 시작 · 밴픽</button>
    </div>`:P.done?`
      <button class="btn gold block" id="poDone">우승 세리머니 보기</button>
    `:`
      <div class="card">
        <div class="card-h"><h4>남은 경기 진행</h4><span class="k">${alive?'우리 팀 생존':'우리 팀 탈락'}</span></div>
        <div class="tiny" style="margin-bottom:10px">${alive?'다른 팀 경기를 시뮬레이션합니다':'우리 팀은 탈락했습니다. 남은 경기를 진행하세요.'}</div>
        <button class="btn block" id="poBtn">다음 경기 진행</button>
      </div>`}
    <div class="card">
      <div class="card-h"><h4>정규시즌 순위</h4><span class="k">TOP 6 진출</span></div>
      ${st.slice(0,6).map((t,i)=>`<div class="slide-item"><div class="fa-rank">${i+1}</div>${badge(t,'sm')}<div class="grow"><div style="font-size:12px;font-weight:800">${esc(t.name)}</div></div><div class="tiny">${t.wins}승 ${t.losses}패</div></div>`).join('')}
    </div>
    <div style="height:10px"></div>`;
  const pb=$('poBtn'); if(pb) pb.onclick=()=>playoffAction();
  const pr=$('poResume'); if(pr) pr.onclick=()=>{ if(resumable.pendingSide) renderSideChoice(); else startDraft(resumable); };
  const pd=$('poDone'); if(pd) pd.onclick=()=>renderChampion();
  show('playoffs');
}
function playoffAction(){
  const um=nextUserPlayoffMatch();
  if(um){
    const oppId=um.m.a===S.userTeam?um.m.b:um.m.a;
    const s=createSeries(oppId,5,'playoff',{match:um.m,roundName:um.rd.name});
    saveGame();
    startDraft(s);
    return;
  }
  const r=playoffNext();
  if(r.action==='done'){ renderChampion(); return; }
  if(r.action==='user'){
    const oppId=r.match.a===S.userTeam?r.match.b:r.match.a;
    const s=createSeries(oppId,5,'playoff',{match:r.match,roundName:r.roundName});
    saveGame(); startDraft(s); return;
  }
  renderPlayoffs(); toast('다른 경기 결과가 반영됐습니다');
}
function renderAfterSeries(){
  if(S.phase==='end'){ renderChampion(); return; }
  if(S.phase==='playoffs'){ renderPlayoffs(); return; }
  TAB='home'; renderHub();
}

/* ---------- champion ---------- */
function renderChampion(){
  const champ=T(S.champion), runner=T(S.runnerUp);
  const st=standings();
  const myPos=st.findIndex(t=>t.id===S.userTeam)+1;
  const isMe=S.champion===S.userTeam;
  const colors=['#25e0ff','#8b5cf6','#ffc94a','#3ddc97','#ff4d6d','#ff9e2c','#7cf7ff','#c4b1ff'];
  const conf=Array.from({length:26},(_,i)=>`<i style="left:${(i*4+Math.random()*3)%100}%;background:${colors[i%colors.length]};animation-duration:${2.4+Math.random()*2}s;animation-delay:${Math.random()*2}s"></i>`).join('');
  const pogTop=Object.entries(S.pog||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('view-champion').innerHTML=`
    <div class="trophy">
      <div class="confetti">${conf}</div>
      <div class="cup">🏆</div>
      <div class="kicker" style="font-size:10px">LCK ${S.season} SEASON CHAMPION</div>
      <h2>${esc(champ.name)}</h2>
      <div class="tiny" style="margin-top:6px">${isMe?'당신이 이끌어낸 우승입니다':'결승 상대: '+esc(runner.name)}</div>
    </div>
    <div class="card">
      <div class="row between">
        <div><div class="tiny">최종 순위</div><div style="font-weight:900;font-size:18px">${isMe?'1위 · 우승':'2위 · 준우승'}</div></div>
        ${badge(champ,'xl')}
      </div>
      <div class="divider"></div>
      <div class="kv"><span>정규시즌</span><b>${myPos}위 · ${myTeam().wins}승 ${myTeam().losses}패</b></div>
      <div class="kv"><span>POG 포인트</span><b>${pogTop.filter(([n])=>S.players[n]&&S.players[n].team===S.userTeam).reduce((a,b)=>a+b[1],0)}</b></div>
      <div class="kv"><span>시즌 예산</span><b>${myTeam().budget.toFixed(1)}억</b></div>
    </div>
    <div class="card">
      <div class="card-h"><h4>시즌 POG 랭킹</h4><span class="k">TOP 5</span></div>
      ${pogTop.map(([n,v],i)=>`<div class="slide-item"><div class="fa-rank">${i+1}</div><div class="grow"><div style="font-size:12.5px;font-weight:800">${esc(n)}</div><div class="tiny">${esc((S.teams[(S.players[n]||{}).team]||{tag:'FA'}).tag)}</div></div><b style="color:var(--gold)">${v}</b></div>`).join('')}
    </div>
    <div class="card">
      <div class="card-h"><h4>최종 순위표</h4><span class="k">1 - 10</span></div>
      ${st.map((t,i)=>`<div class="slide-item"><div class="fa-rank">${i+1}</div>${badge(t,'sm')}<div class="grow"><div style="font-size:12px;font-weight:800;${t.id===S.userTeam?'color:var(--cyan)':''}">${esc(t.name)}</div></div><div class="tiny">${t.wins}-${t.losses}</div></div>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn" id="toTitle">타이틀로</button>
      <button class="btn primary" id="newSeason">다음 시즌</button>
    </div>
    <div style="height:14px"></div>`;
  $('toTitle').onclick=()=>{ S=null; renderTitle(); };
  $('newSeason').onclick=()=>{ nextSeason(); toast('새 시즌이 시작됩니다'); };
  show('champion');
}


/* boot */
window.__game={get S(){return S},get M(){return M},get D(){return D}};
renderTitle();

</script>
</body>
</html>
