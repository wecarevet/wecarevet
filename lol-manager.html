function stopTimer(){ if(TIMER){clearInterval(TIMER);TIMER=null;} }
function setSpeed(s){ if(!M) return; M.speed=s; stopTimer(); TIMER=setInterval(()=>{ if(!M||M.over||!M.running) return; tick(); }, Math.round(620/s)); renderMatch(); }
function togglePlay(){ if(!M) return; M.running=!M.running; renderMatch(); }

function logEvent(kind,text,minute){
  if(!M) return;
  text=String(text).replace(/^\d+분 · /,'');
  M.events.unshift({kind,text,minute:minute===undefined?M.minute:minute});
  if(M.events.length>90) M.events.pop();
}
function curveAt(comp,min){
  const c=comp.curve;
  if(min<15) return c[0];
  if(min<25) return c[1];
  return c[2];
}
function winProb(){
  if(!M) return 0.5;
  const gd=M.gold[0]-M.gold[1];
  const kd=M.kills[0]-M.kills[1];
  const td=M.towers[0]-M.towers[1];
  const dd=M.dragons[0]-M.dragons[1];
  const bd=M.barons[0]-M.barons[1];
  const cd=curveAt(M.myComp,M.minute)-curveAt(M.oppComp,M.minute);
  const tf=clamp(M.minute/14,0.3,1);
  const st=M.stance?STANCE_MAP[M.stance]:null;
  const lateStance=(st&&st.late&&M.minute>=25)?st.late:0;
  let s=(gd/2500)*tf + kd*0.05 + td*0.07 + dd*0.13 + bd*0.4 + cd*0.16
    + M.draftLogit + (M.powerEdge||0)*0.02 + (M.styleEdge||0) + (M.tacticEdge||0) + lateStance
    + ((M.soulGranted&&M.soulGranted.me)?0.12:0) - ((M.soulGranted&&M.soulGranted.opp)?0.12:0)
    + ((M.elder&&M.elder.me&&M.minute<=(M.elderUntil.me||0))?0.3:0) - ((M.elder&&M.elder.opp&&M.minute<=(M.elderUntil.opp||0))?0.3:0)
    + (M.minute<=12?(M.earlyEdge||0)*0.35:0);
  return clamp(sig(s),0.03,0.97);
}
function sideIdx(team){ return team==='me'?0:1; }
function addGold(team,amount){ M.gold[sideIdx(team)]+=Math.round(amount); }
function lineupAt(team,role){ return (M.lineups[team==='me'?'me':'opp'].find(x=>x.role===role)||{}); }
function myChampAt(role){ return lineupAt('me',role).champ||'챔피언'; }
function oppChampAt(role){ return lineupAt('opp',role).champ||'챔피언'; }
function myNameAt(role){ return lineupAt('me',role).name||'우리 팀'; }
function oppNameAt(role){ return lineupAt('opp',role).name||'상대'; }
function playerAt(team,role){ const l=lineupAt(team,role); return S.players[l.name]||null; }

function weightedPick(items,weights){
  const total=weights.reduce((a,b)=>a+b,0); let r=Math.random()*total;
  for(let i=0;i<items.length;i++){ r-=weights[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}

function tick(){
  if(!M||M.over) return;
  M.minute++;
  const m=M.minute;
  const sta=STANCE_MAP[M.stance]||STANCE_MAP.standard;
  const fo=M.focusKey?FOCUS_MAP[M.focusKey]:null;
  // 마일스톤 알림 (진행을 막지 않음)
  MILESTONES.forEach(ms=>{ if(ms.m===m) logEvent('sys','⏱ '+ms.n); });
  // 골드
  const eco=(M.lane ? ((M.lane.TOP.my-M.lane.TOP.opp)+(M.lane.MID.my-M.lane.MID.opp)+(M.lane.ADC.my-M.lane.ADC.opp)) : 0)*0.9;
  const macroDiff=(M.trait.me.macro-M.trait.opp.macro)*6;
  const stanceGold=(sta.gold||0)*40;
  addGold('me', 620+eco*1.1+macroDiff+stanceGold+rnd(-35,35));
  addGold('opp', 620-eco*1.1-macroDiff-stanceGold+rnd(-35,35));
  if(sta.late&&m>=25) addGold('me',40);
  if(fo&&fo.gold) addGold('me',Math.round(fo.gold*700));
  if(fo&&fo.late&&m>=25) addGold('me',35);
  const p=winProb();
  const killFavor=clamp(0.5+(p-0.5)*0.6,0.12,0.88);
  const aggr=Math.max(0.35,1+(sta.aggr||0)+((fo&&fo.fight)||0)*0.4);
  // 라인 킬
  if(Math.random()<Math.max(0.12,0.30*aggr+(fo&&fo.kill?fo.kill:0))){
    const lb=(fo&&fo.laneBias)||{};
    const laneBias={TOP:lb.TOP||1,MID:lb.MID||1,ADC:lb.ADC||1};
    if(fo){ if(fo.mm==='top') laneBias.TOP=2.4; if(fo.mm==='bot'||fo.mm==='diveBot') laneBias.ADC=2.4; if(fo.mm==='mid') laneBias.MID=2.2; if(fo.mm==='assassin') laneBias.MID=1.9; }
    const role=weightedPick(ROLES, ROLES.map(r=>{
      const L=M.lane[r]||{my:60,opp:60};
      return (0.7+Math.abs((L.my||60)-(L.opp||60))*0.3)*(laneBias[r]||1);
    }));
    const L=M.lane[role]||{my:60,opp:60};
    let laneFavor=clamp(0.5+(L.my-L.opp)*0.05+(p-0.5)*0.5,0.08,0.92);
    if(M.soulGranted.me) laneFavor=clamp(laneFavor+0.02,0.08,0.94);
    if(M.elder.me&&m<=(M.elderUntil.me||0)) laneFavor=clamp(laneFavor+0.05,0.08,0.95);
    if(M.stance==='aggro') laneFavor=clamp(laneFavor+0.04,0.08,0.93);
    if(M.stance==='defensive') laneFavor=clamp(laneFavor-0.03,0.07,0.92);
    const meWins=Math.random()<laneFavor;
    const team=meWins?'me':'opp';
    addGold(team,300); M.kills[sideIdx(team)]++;
    const champ=team==='me'?myChampAt(role):oppChampAt(role);
    const nm=team==='me'?myNameAt(role):oppNameAt(role);
    const pl=playerAt(team,role);
    const flavour=styleLine(pl);
    const cdef=CHAMP_MAP[champ];
    const sigLine=(cdef&&cdef.sig)?('<i>'+cdef.sig.split('·')[0].trim()+'</i>'):'';
    const sideCls=team==='me'?'blue':'red';
    if(Math.random()<0.42){
      const victim=team==='me'?oppNameAt(role):myNameAt(role);
      logEvent(sideCls, m+'분 · <b>'+nm+'</b>('+champ+') 솔로킬! '+(sigLine?sigLine+' — ':'')+(flavour?'<i>'+flavour+'</i> · ':'')+ROLE_KR[role]+'에서 '+victim+'를 잡아냅니다.');
    }else{
      const gankRole=pickOf(ROLES.filter(r=>r!==role));
      const gankName=team==='me'?myNameAt(gankRole):oppNameAt(gankRole);
      const gankChamp=team==='me'?myChampAt(gankRole):oppChampAt(gankRole);
      const gc=CHAMP_MAP[gankChamp];
      logEvent(sideCls, m+'분 · '+ROLE_KR[role]+' 로밍 킬 — <b>'+gankName+'</b>('+gankChamp+')이(가) '+(gc&&gc.sig?'<i>'+gc.sig.split('·')[0].trim()+'</i>으로 ':'')+(flavour?flavour+'으로 ':'')+'마무리합니다.');
    }
  }
  // 픽오프 (바론/용 시야 낚시)
  if(fo&&fo.pickoff&&Math.random()<fo.pickoff*0.5){
    const meWins=Math.random()<clamp(killFavor+0.08,0.1,0.92);
    const team=meWins?'me':'opp';
    const role=pickOf(['SUP','JGL','MID']);
    addGold(team,380); M.kills[sideIdx(team)]++;
    logEvent(team==='me'?'blue':'red', m+'분 · <b>부시 매복 픽오프</b> — '+(team==='me'?myNameAt(role):oppNameAt(role))+'이(가) 시야 밖에서 끊어냅니다.');
  }
  // 위험 특성
  const riskMe=Math.max(0,M.trait.me.risk-1.2), riskOp=Math.max(0,M.trait.opp.risk-1.2);
  const calmMul=1-Math.min(0.5,(M.coach.me.calm||0));
  if(Math.abs(M.gold[0]-M.gold[1])>1800 && Math.random()<0.035*(riskMe+riskOp)*calmMul){
    const loser=(M.gold[0]>M.gold[1])?'me':'opp';
    const team=loser==='me'?'opp':'me';
    addGold(team,420); M.kills[sideIdx(team)]++;
    const role=pickOf(ROLES);
    const pl=playerAt(team==='me'?'opp':'me',role);
    const bad=badStyleLine(pl)||'무리한 진입';
    logEvent(team==='me'?'blue':'red', m+'분 · <b>'+bad+'</b> — '+(team==='me'?M.oppName:M.myName)+'이(가) 역습 킬을 챙깁니다.');
  }
  // 공허 유충
  if(m===6||m===10){
    const focus=(M.gp.firstObj==='grub'?0.25:-0.05)+(fo&&fo.mm==='top'?0.1:0)+((M.focusKey==='grubs'||M.focusKey==='obj')?0.12:0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.012+(M.trait.me.vision-M.trait.opp.vision)*0.006;
    const meWins=Math.random()<clamp(killFavor+focus+objEdge+(sta.obj||0),0.08,0.92);
    const team=meWins?'me':'opp';
    M.grubs[sideIdx(team)]+=3; addGold(team,190*S.meta.obj.grub);
    logEvent(team==='me'?'blue':'red', m+'분 · 공허 유충 3스택 — <b>'+(team==='me'?M.myName:M.oppName)+'</b>이(가) 유충을 가져갑니다.');
  }
  // ---------- 드래곤: 원소 · 영혼 · 장로 ----------
  const dTimes=[5,11,17,23,29];
  const soulClaimed=(M.soulGranted.me||M.soulGranted.opp);
  const soulEdgeDiff=((M.soulGranted.me?0.03:0)-(M.soulGranted.opp?0.03:0));
  const elderEdgeDiff=((M.elder.me&&m<=(M.elderUntil.me||0))?0.08:0)-((M.elder.opp&&m<=(M.elderUntil.opp||0))?0.08:0);
  if(!soulClaimed && dTimes.includes(m)){
    const dFocus=(M.gp.firstObj==='dragon'?0.2:-0.05)+(M.gp.jungle==='bot'?0.08:0)+(fo?(fo.obj||0):0)+(sta.obj||0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.014+(M.trait.me.vision-M.trait.opp.vision)*0.007+((M.coach.me.obj||0)-(M.coach.opp.obj||0))*0.3+soulEdgeDiff+elderEdgeDiff;
    const meWins=Math.random()<clamp(killFavor+dFocus+objEdge,0.08,0.92);
    const team=meWins?'me':'opp';
    const n=(M.dragons[sideIdx(team)]||0)+1;
    M.dragons[sideIdx(team)]=n;
    const elem=(n>=4&&M.soulType[team])?M.soulType[team]:(pickOf(DRAKE_ELEMENTS).k);
    M.dragonElems[team].push(elem);
    addGold(team,380*S.meta.obj.dragon);
    if(n===3&&!M.soulType[team]){
      M.soulType[team]=elem;
      logEvent(team==='me'?'blue':'red', m+'분 · <b>3용</b> — '+(team==='me'?M.myName:M.oppName)+'의 드래곤 영혼 예고: <b>'+drakeName(elem)+'의 영혼</b>');
    }else if(n>=4&&!M.soulGranted[team]){
      M.soulGranted[team]=true; M.soulType[team]=M.soulType[team]||elem;
      M.elderAt=m+6;
      logEvent(team==='me'?'blue':'red', m+'분 · 💠 <b>드래곤 영혼 획득!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) '+drakeName(M.soulType[team])+'의 영혼을 흡수했습니다 — 한타력 급상승');
    }else{
      logEvent(team==='me'?'blue':'red', m+'분 · '+drakeIcon(elem)+' '+drakeName(elem)+' 드래곤 처치 — <b>'+(team==='me'?M.myName:M.oppName)+'</b> ('+n+'스택)');
    }
  }
  // 장로 드래곤 (영혼 획득 6분 후)
  if(M.elderAt && m>=M.elderAt && (m-M.elderAt)%6===0){
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.012+soulEdgeDiff;
    const meWins=Math.random()<clamp(killFavor+0.02+objEdge,0.08,0.92);
    const team=meWins?'me':'opp';
    M.elder[team]=true; M.elderUntil[team]=m+3; M.elderCount[sideIdx(team)]++;
    addGold(team,600);
    logEvent(team==='me'?'blue':'red', m+'분 · 🐲 <b>장로 드래곤 처치!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) 처형 버프를 얻습니다 (3분)');
  }
  // 협곡의 전령
  if(m===14){
    const meWins=Math.random()<clamp(killFavor+(fo&&fo.mm==='top'?0.1:0)+(M.gp.firstObj==='grub'?0.05:0),0.08,0.92);
    const team=meWins?'me':'opp';
    M.heralds[sideIdx(team)]++;
    addGold(team,450);
    logEvent(team==='me'?'blue':'red', m+'분 · 🕯 <b>협곡의 전령 처치</b> — '+(team==='me'?M.myName:M.oppName)+'이(가) 전령을 확보해 타워 압박에 나섭니다.');
  }
  // 타워
  if(m>=8 && Math.random()<Math.max(0.05,0.20+(fo?(fo.tower||0):0))*(M.stance==='defensive'?0.85:1)*S.meta.obj.tower){
    const meWins=Math.random()<clamp(killFavor+(M.trait.me.macro-M.trait.opp.macro)*0.008,0.08,0.92);
    const team=meWins?'me':'opp';
    M.towers[sideIdx(team)]++;
    addGold(team,240);
    if(M.towers[sideIdx(team)]%2===0) logEvent(team==='me'?'blue':'red', m+'분 · '+(team==='me'?M.myName:M.oppName)+' 외곽 타워 철거 — 시야가 넓어집니다.');
  }
  // 한타
  if(m>=13 && Math.random()<0.07*(1+((fo&&fo.fight)||0))*(1+(M.stance==='aggro'?0.5:M.stance==='defensive'?-0.35:0))){
    let fightEdge=(M.myComp.tags.fight-M.oppComp.tags.fight)*0.015+(M.myComp.front-M.oppComp.front)*0.01+(M.myComp.cc-M.oppComp.cc)*0.006+(M.trait.me.fight-M.trait.opp.fight)*0.012;
    if(M.soulGranted.me) fightEdge+=0.035; if(M.soulGranted.opp) fightEdge-=0.035;
    if(M.elder.me&&m<=(M.elderUntil.me||0)) fightEdge+=0.06; if(M.elder.opp&&m<=(M.elderUntil.opp||0)) fightEdge-=0.06;
    const meWins=Math.random()<clamp(killFavor+fightEdge+(M.stance==='aggro'?0.04:0)-(M.stance==='defensive'?0.05:0),0.05,0.95);
    const team=meWins?'me':'opp';
    const n=ri(1,3);
    M.kills[sideIdx(team)]+=n; addGold(team,n*300+120);
    M.fights[sideIdx(team)]++;
    const hero=pickOf(ROLES);
    const pl=playerAt(team,hero);
    const flavour=pl?styleLine(pl):'';
    const archTag=(M.arch&&M.arch.label)?(' <i>'+M.arch.label[(team==='me'?M.arch.me:M.arch.opp).arch]+'</i>'):'';
    logEvent(team==='me'?'blue':'red', m+'분 · <b>대규모 한타</b> — '+(team==='me'?M.myName:M.oppName)+archTag+'이(가) '+n+'킬 스왑'+(flavour?' · '+flavour+'!':'하며 주도권을 가져갑니다.'));
  }
  // 바론
  if([20,26,32].includes(m)){
    const baronFocus=(M.focusKey==='baronBush'?0.45:0)+(fo&&fo.mm==='obj'?0.2:0)+(M.grubs[0]>M.grubs[1]?0.06:0);
    const objEdge=(M.trait.me.obj-M.trait.opp.obj)*0.016;
    const meWins=Math.random()<clamp(killFavor+baronFocus+objEdge,0.05,0.95);
    const team=meWins?'me':'opp';
    M.barons[sideIdx(team)]++;
    addGold(team,1200*S.meta.obj.baron);
    logEvent(team==='me'?'blue':'red', m+'분 · <b>바론 처치!</b> '+(team==='me'?M.myName:M.oppName)+'이(가) 바론 버프로 압박을 시작합니다.');
  }
  // 작전 패시브
  if(M.focusKey==='split131'||M.focusKey==='split14'||M.focusKey==='cross'){
    const bonus=M.focusKey==='split14'?60:M.focusKey==='split131'?48:40;
    addGold(Math.random()<killFavor?'me':'opp',bonus);
  }
  M.vision[0]+=ri(2,4); M.vision[1]+=ri(2,4);
  M.winProb=winProb();
  M.history.push({min:m,diff:M.gold[0]-M.gold[1]});
  const gd=M.gold[0]-M.gold[1];
  if((m>=27&&Math.abs(gd)>6000)||(m>=31&&Math.abs(gd)>3800)||(m>=35&&Math.abs(gd)>2000)||m>=38){
    finishGame();
    return;
  }
  renderMatch();
}
function finishGame(){
  if(!M||M.over) return;
  M.over=true; M.running=false; stopTimer();
  const gd=M.gold[0]-M.gold[1];
  let meWin;
  if(Math.abs(gd)>3000) meWin=gd>0;
  else meWin=Math.random()<clamp(0.5+gd/6000,0.15,0.85);
  M.meWin=meWin;
  M.winProb=meWin?1:0;
  const winTeam=meWin?'me':'opp';
  logEvent(meWin?'blue':'red', M.minute+'분 · <b>넥서스 파괴!</b> '+(meWin?M.myName:M.oppName)+' 승리', M.minute);
  const winners=winTeam==='me'?M.lineups.me:M.lineups.opp;
  const mvp=pickOf(winners.filter(x=>x.name));
  M.mvp=mvp;
  S.seriesMomentum=meWin?0.8:-0.8;
  const me=T(S.userTeam), opp=T(M.oppId);
  const myPlayers=lineupOf(me), oppPlayers=lineupOf(opp);
  const volOf=p=>persMod(p,'vol','avg');
  if(meWin){
    myPlayers.forEach(p=>{p.form=clamp(p.form+Math.round(ri(2,6)*volOf(p)),10,100);p.fatigue=clamp(p.fatigue+ri(6,11),0,100);});
    oppPlayers.forEach(p=>{p.form=clamp(p.form-Math.round(ri(2,6)*volOf(p)),10,100);p.fatigue=clamp(p.fatigue+ri(5,10),0,100);});
  }else{
    const wall=1-Math.min(0.6,(staffMods(S.userTeam).mental||0)*0.9);
    myPlayers.forEach(p=>{p.form=clamp(p.form-Math.round(ri(2,6)*wall),10,100);p.fatigue=clamp(p.fatigue+ri(6,11),0,100);});
    oppPlayers.forEach(p=>{p.form=clamp(p.form+ri(1,4),10,100);});
  }
  if(M.mvp && M.mvp.name) S.pog[M.mvp.name]=(S.pog[M.mvp.name]||0)+(meWin?100:60);
  // ---- 실전 경험치 & 성장 ----
  S.lastGrowth=[];
  const growTeam=(team,won)=>{
    ROLES.forEach(r=>{
      const p=S.players[team.lineup[r]]; if(!p) return;
      let base=18+(won?8:0)+(p.age<=21?10:p.age<=23?5:0);
      if(M.mvp&&M.mvp.name===p.name) base+=18;
      const mult=persMod(p,'growth','avg');
      p.exp=(p.exp||0)+Math.round(base*mult);
      if(p.exp>=100){
        p.exp-=100;
        const keys=({TOP:['lane','fight','macro'],JGL:['macro','fight','mental'],MID:['lane','fight','macro'],ADC:['lane','fight','mental'],SUP:['macro','mental','lane']})[p.role]||['lane','fight'];
        const k=keys[Math.floor(Math.random()*keys.length)];
        const before=p.stats[k];
        p.stats[k]=clamp(p.stats[k]+1,40,99);
        S.lastGrowth.push({team,name:p.name,stat:k,amt:p.stats[k]-before,exp:0});
      }else{
        S.lastGrowth.push({team,name:p.name,exp:p.exp});
      }
    });
  };
  growTeam(S.userTeam,meWin);
  growTeam(M.oppId,!meWin);
  const sr=M.series;
  if(meWin) sr.score.me++; else sr.score.opp++;
  sr.games.push({win:meWin, minute:M.minute, kills:M.kills.slice(), gold:M.gold.slice(),
    mvp:(M.mvp||{}).name||'', mvpChamp:(M.mvp||{}).champ||'',
    dragons:M.dragons.slice(), towers:M.towers.slice(), barons:M.barons.slice(),
    myComp:M.myComp, oppComp:M.oppComp, lane:M.lane, edge:M.edge, tactics:M.tacticAt, history:M.history.slice(),
    myPct:M.draftPct, myPicks:dMyPicks().slice(), oppPicks:dOppPicks().slice(),
    assign:{me:Object.assign({},D.assign.me),opp:Object.assign({},D.assign.opp)}});
  if(sr.fearless){ sr.fearlessUsed.push(...dMyPicks(), ...dOppPicks()); }
  saveGame();
  renderSeriesResult();
}
function analyzeGame(game){
  if(!game) return {reasons:[]};
  const lane=game.lane||{}; const reasons=[]; const laneR=[];
  ROLES.forEach(r=>{
    const d=(lane[r]?lane[r].my-lane[r].opp:0);
    if(Math.abs(d)>2.5) laneR.push({k:'lane',v:Math.sign(d),d,txt:ROLE_KR[r]+' 라인전 '+(d>0?'우위':'열세')+' ('+(d>0?'+':'')+d.toFixed(1)+')'});
  });
  laneR.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  laneR.slice(0,3).forEach(x=>reasons.push(x));
  const myC=game.myComp, opC=game.oppComp;
  if(myC&&opC){
    if(game.win && opC.tags.scale>myC.tags.scale+2) reasons.push({k:'comp',v:1,txt:'후반 밸류 싸움에서 앞섰습니다'});
    if(!game.win && myC.tags.scale<opC.tags.scale-2) reasons.push({k:'late',v:-1,txt:'후반 밸류 열세 — 30분 이후 한타에서 밀렸습니다'});
    if(!game.win && myC.tags.engage<opC.tags.engage-2) reasons.push({k:'engage',v:-1,txt:'이니시 싸움에서 밀렸습니다'});
    if(!game.win && myC.front<opC.front-2) reasons.push({k:'front',v:-1,txt:'프론트라인이 무너졌습니다'});
    if(myC.tags.engage>=9 && game.win) reasons.push({k:'engage',v:1,txt:'강한 이니시로 교전을 열었습니다'});
  }
  if(game.kills && game.kills[0]<game.kills[1]-4) reasons.push({k:'fight',v:-1,txt:'교전 킬 스코어 열세'});
  if(game.myPct){ const adv=game.myPct-50; reasons.push({k:'draft',v:Math.sign(adv),txt:'밴픽 우세도 '+game.myPct.toFixed(0)+'% : '+(100-game.myPct).toFixed(0)+'% — '+(adv>0?'밴픽에서 앞섰습니다':'밴픽에서 밀렸습니다')}); }
  return {reasons};
}

/* ============ SEASON / FLOW ============ */
const CAL_WEEKS=['1월 3주','2월 1주','2월 4주','3월 3주','4월 2주','5월 4주','7월 1주','8월 1주','8월 4주'];
const CAL_STAGES=[
  {k:'spring', month:'1~3월', label:'LCK 스프링', detail:'정규 5주 + 플레이오프', icon:'🌸'},
  {k:'msi',    month:'5월',   label:'MSI', detail:'LCK·LPL·LEC·LCS 8팀 토너먼트', icon:'🌏'},
  {k:'summer', month:'6~8월', label:'LCK 서머', detail:'정규 4주 + 플레이오프', icon:'☀️'},
  {k:'ewc',    month:'7월',   label:'EWC 이스포츠 월드컵', detail:'8팀 초청 토너먼트', icon:'🏅'},
  {k:'worlds', month:'10~11월', label:'롤드컵', detail:'스위스 → 8강 → 4강 → 결승', icon:'🌍'},
  {k:'offseason', month:'11~12월', label:'스토브리그', detail:'재계약 · FA 이적시장', icon:'💼'},
];
function stagePhase(){ return S?S.phase:'regular'; }
function calendarNow(){
  if(!S) return 'spring';
  if(S.phase==='msi') return 'msi';
  if(S.phase==='ewc') return 'ewc';
  if(S.phase==='offseason') return 'offseason';
  if(S.phase==='regular') return S.split==='summer'?'summer':'spring';
  if(S.phase==='playoffs') return S.split==='summer'?'summer':'spring';
  if(S.phase==='worlds'){
    const W=S.worlds;
    if(W){
      if(W.stage==='swiss') return 'swiss';
      if(W.stage==='bracket'){ const r=W.bracket?W.bracket.round:0; return r<=0?'quarters':r===1?'semis':'final'; }
      return 'final';
    }
    return 'swiss';
  }
  return 'worlds';
}
function weekCalLabel(w){ return CAL_WEEKS[(w-1)%CAL_WEEKS.length]; }

function genSchedule(ids){
  const arr=ids.slice(); const n=arr.length; const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i],b=arr[n-1-i];
      pairs.push(r%2===0?[a,b]:[b,a]);
    }
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function standings(){
  return Object.values(S.teams).filter(t=>t.region==='LCK').sort((x,y)=>(y.wins-x.wins)||((y.gw-y.gl)-(x.gw-x.gl))||(y.gw-x.gw));
}
function myRank(){ return standings().findIndex(t=>t.id===S.userTeam)+1; }
function weekOpponent(){
  const pairs=S.schedule[S.week-1]||[];
  const p=pairs.find(x=>x.includes(S.userTeam));
  if(!p) return null;
  return {oppId:p[0]===S.userTeam?p[1]:p[0], pair:p};
}
function recordResult(aId,bId,sa,sb,week,stage){
  const a=T(aId),b=T(bId);
  a.gw+=sa;a.gl+=sb;b.gw+=sb;b.gl+=sa;
  if(sa>sb){a.wins++;b.losses++;a.form.push('W');b.form.push('L');}
  else{b.wins++;a.losses++;b.form.push('W');a.form.push('L');}
  if(a.form.length>6)a.form.shift(); if(b.form.length>6)b.form.shift();
  if(aId!==S.userTeam && bId!==S.userTeam){
    const winT=sa>sb?a:b;
    const ps=winT.roster.map(n=>S.players[n]).filter(Boolean);
    const star=ps.sort((x,y)=>rawOverall(y)-rawOverall(x)).slice(0,2);
    star.forEach(p=>{ S.pog[p.name]=(S.pog[p.name]||0)+ri(40,100); });
  }
  S.results.push({week,stage,a:aId,b:bId,sa,sb});
}
function simAIBo(aId,bId,bo){
  const pa=teamPower(T(aId)),pb=teamPower(T(bId));
  const need=Math.ceil(bo/2); let sa=0,sb=0;
  const base=sig((pa-pb)/5.5);
  while(sa<need&&sb<need){
    if(Math.random()<clamp(base+ (Math.random()-0.5)*0.16,0.05,0.95)) sa++; else sb++;
  }
  return {sa,sb};
}

/* ---------- series ---------- */
function createSeries(oppId,bo,stage,meta){
  const s={oppId,bo,stage,meta:meta||{},score:{me:0,opp:0},games:[],sides:[],fearless:!!S.fearless,
    fearlessUsed:[],done:false,pendingSide:false,coach:null,momentum:0,startedAt:Date.now()};
  s.sides[0]=Math.random()<0.5?'blue':'red';
  S.currentSeries=s; S.seriesMomentum=0;
  return s;
}
function seriesWinNeed(s){ return Math.ceil(s.bo/2); }
function seriesOver(s){ return s.score.me>=seriesWinNeed(s)||s.score.opp>=seriesWinNeed(s); }
function userWonSeries(s){ return s.score.me>=seriesWinNeed(s); }
function aiSideChoice(){
  const opp=T(S.currentSeries.oppId);
  const topPick=Math.max(...Object.values(opp.lineup).map(n=>{
    const p=S.players[n]; return p?Math.max(...p.sigs.map(x=>champTier(x))):0;
  }));
  return topPick>=5?'blue':'red';
}
function setNextSide(side){
  const s=S.currentSeries; if(!s) return;
  s.sides[s.games.length]=side; s.pendingSide=false;
  startDraft(s);
}
function nextSeriesGame(){
  const s=S.currentSeries; if(!s) return;
  if(seriesOver(s)){ finishSeries(); return; }
  const last=s.games[s.games.length-1];
  if(!last){ startDraft(s); return; }
  const userLost=!last.win;
  if(userLost){ s.pendingSide=true; renderSideChoice(); }
  else { s.sides[s.games.length]=aiSideChoice(); startDraft(s); }
}
function applyCoaching(kind){
  const s=S.currentSeries; if(!s||!s.coach||s.coach.applied) return;
  const me=myTeam();
  if(kind==='mental'){
    lineupOf(me).forEach(p=>{p.form=clamp(p.form+ri(5,10),20,100);p.fatigue=clamp(p.fatigue-ri(3,7),0,100);});
    s.coach.msg='멘탈 케어 완료 — 선수단 컨디션과 집중력이 올라갔습니다';
  }else if(kind==='tactic'){
    s.nextEdge=(s.nextEdge||0)+1.1;
    s.coach.msg='전술 수정 — 다음 세트 초반 설계와 교전 규칙을 재정비했습니다';
  }else if(kind==='sub'){
    const worst=lineupOf(me).slice().sort((a,b)=>effRating(a)-effRating(b))[0];
    const bench=me.roster.map(n=>S.players[n]).filter(p=>!Object.values(me.lineup).includes(p.name));
    const best=bench.sort((a,b)=>effRating(b)-effRating(a))[0];
    if(worst&&best){
      const role=Object.keys(me.lineup).find(r=>me.lineup[r]===worst.name);
      me.lineup[role]=best.name;
      s.coach.msg='식스맨 교체 — '+worst.name+' OUT, '+best.name+' IN ('+ROLE_KR[role]+')';
    }else{ s.coach.msg='교체 가능한 식스맨이 없습니다'; }
  }
  s.coach.applied=kind;
  saveGame(); renderSeriesResult();
}
function finishSeries(){
  const s=S.currentSeries; if(!s) return;
  s.done=true;
  const meWon=userWonSeries(s);
  const oppId=s.oppId;
  if(s.stage==='regular'){
    recordResult(S.userTeam,oppId,s.score.me,s.score.opp,S.week,'regular');
    (S.schedule[S.week-1]||[]).forEach(([a,b])=>{
      if(a===S.userTeam||b===S.userTeam) return;
      const r=simAIBo(a,b,3);
      recordResult(a,b,r.sa,r.sb,S.week,'regular');
    });
    S.history.push({week:S.week,opp:oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'regular'});
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'regular'};
    S.week++;
    S.actionApplied=false; S.weekActionTarget=null; S.gameplan=null;
    if(S.split==='spring'&&S.week>5){ startPlayoffs('spring'); }
    else if(S.split==='summer'&&S.week>ROUNDS){ startPlayoffs('summer'); }
    else if([3,6].includes(S.week)){ applyRandomPatch('WK'+S.week); }
    else if(S.split==='summer'&&S.week===8&&!S.ewc){ startEWC(); }
    S.currentSeries=null; S.seriesMomentum=0;
  }else if(s.stage==='msi'||s.stage==='ewc'){
    const m=s.meta.match;
    if(m){ m.sa=s.score.me; m.sb=s.score.opp; m.winner=s.score.me>s.score.opp?S.userTeam:oppId; m.done=true; }
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:s.stage};
    S.currentSeries=null; S.seriesMomentum=0;
    saveGame();
    renderIntl();
    return;
  }else if(s.stage==='worlds'){
    const m=s.meta.match;
    if(m){ m.sa=s.score.me; m.sb=s.score.opp; m.winner=s.score.me>s.score.opp?S.userTeam:oppId; m.done=true; }
    S.history.push({stage:'worlds',round:(s.meta.roundName||'월즈'),opp:oppId,score:s.score.me+'-'+s.score.opp,win:meWon});
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:'worlds'};
    S.currentSeries=null; S.seriesMomentum=0;
    saveGame();
    renderWorlds();
    return;
  }else{
    const m=s.meta.match;
    m.sa=s.score.me; m.sb=s.score.opp; m.winner=meWon?S.userTeam:oppId; m.done=true;
    recordResult(S.userTeam,oppId,s.score.me,s.score.opp,S.week,'playoffs');
    S.lastSeries={oppId,score:s.score.me+'-'+s.score.opp,win:meWon,stage:s.stage};
    if(!meWon) S.myExit={round:(s.meta&&s.meta.roundName)||'플레이오프',score:s.score.opp+'-'+s.score.me};
    S.currentSeries=null; S.seriesMomentum=0;
    checkPlayoffComplete();
  }
  saveGame();
  if(S.phase==='worlds'){ renderWorlds(); return; }
  if(S.phase==='end'){ renderChampion(); return; }
  renderAfterSeries();
}

/* ---------- playoffs ---------- */
function startPlayoffs(split){
  S.playoffSplit=split||S.split||'summer';
  applyRandomPatch('플레이오프 직전');
  const st=standings();
  const seeds=st.slice(0,6).map(t=>t.id);
  S.playoffs={
    seeds,
    rounds:[
      {name:'6강 PO',matches:[
        {a:seeds[2],b:seeds[5],done:false},
        {a:seeds[3],b:seeds[4],done:false},
      ]},
      {name:'4강 PO',matches:[
        {a:seeds[0],b:null,done:false},
        {a:seeds[1],b:null,done:false},
      ]},
      {name:'결승',matches:[{a:null,b:null,done:false}]},
    ],
    done:false,
  };
  S.phase='playoffs';
  saveGame();
}
function ensureBracket(){
  const P=S.playoffs; if(!P) return;
  const r0=P.rounds[0],r1=P.rounds[1],r2=P.rounds[2];
  if(r0.matches.every(m=>m.done)){
    r1.matches[0].b=r0.matches[0].winner;
    r1.matches[1].b=r0.matches[1].winner;
  }
  if(r1.matches.every(m=>m.done&&m.winner)){
    r2.matches[0].a=r1.matches[0].winner;
    r2.matches[0].b=r1.matches[1].winner;
  }
}
function checkPlayoffComplete(){
  const P=S.playoffs; if(!P) return false;
  const fin=P.rounds[2].matches[0];
  if(!fin.done) return false;
  P.done=true;
  S.lckChampion=fin.winner;
  S.lckRunnerUp=fin.winner===fin.a?fin.b:fin.a;
  S.champion=S.lckChampion; S.runnerUp=S.lckRunnerUp;
  if(S.playoffSplit==='spring'){
    S.springChampion=fin.winner; S.springRunnerUp=S.lckRunnerUp;
    startMSI();
  }else{
    S.summerChampion=fin.winner; S.summerRunnerUp=S.lckRunnerUp;
    startWorlds();
  }
  return true;
}
function playoffNext(){
  const P=S.playoffs; if(!P||P.done) return {action:'done'};
  for(let pass=0;pass<6;pass++){
    ensureBracket();
    let simmed=false;
    for(let r=0;r<P.rounds.length;r++){
      for(const m of P.rounds[r].matches){
        if(m.done||!m.a||!m.b) continue;
        if(m.a===S.userTeam||m.b===S.userTeam){
          return {action:'user',match:m,round:r,roundName:P.rounds[r].name};
        }
        const res=simAIBo(m.a,m.b,5);
        m.sa=res.sa;m.sb=res.sb;m.winner=res.sa>res.sb?m.a:m.b;m.done=true;
        recordResult(m.a,m.b,res.sa,res.sb,S.week,'playoffs');
        simmed=true;
      }
    }
    ensureBracket();
    const fin=P.rounds[2].matches[0];
    if(fin.done){ checkPlayoffComplete(); return {action:'done'}; }
    if(!simmed) break;
  }
  return {action:'none'};
}
function startPlayoffSeries(match,roundName){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const s=createSeries(oppId,5,'playoff',{match,roundName});
  if(!s.sides[0]) s.sides[0]='blue';
  saveGame();
  return s;
}

/* ================= MSI / EWC 국제 초청 토너먼트 ================= */
function startMSI(){
  const st=standings();
  const lck=[S.springChampion,S.springRunnerUp].filter(id=>id&&S.teams[id]);
  st.forEach(t=>{ if(lck.length<2&&!lck.includes(t.id)) lck.push(t.id); });
  const teams=[lck[0],lck[1],'BLG','TES','G2','FNC','FLY','TL'].filter((x,i,a)=>x&&a.indexOf(x)===i);
  S.msi={kind:'msi',name:'MSI',month:'5월',bo:5,teams,bracket:makeIntlBracket(teams,5,'5월'),
    done:false,champion:null,runnerUp:null,userIn:teams.includes(S.userTeam)};
  S.phase='msi';
  applyRandomPatch('MSI 패치');
  saveGame();
}
function startEWC(){
  const lck=standings().slice(0,2).map(t=>t.id);
  const teams=[...lck,'BLG','TES','G2','FNC','FLY','TL'].filter((x,i,a)=>x&&a.indexOf(x)===i);
  S.ewc={kind:'ewc',name:'EWC 이스포츠 월드컵',month:'7월',bo:3,teams,bracket:makeIntlBracket(teams,3,'7월'),
    done:false,champion:null,runnerUp:null,userIn:teams.includes(S.userTeam)};
  S.phase='ewc';
  saveGame();
}
function makeIntlBracket(teams,bo,month){
  const s=teams.slice(0,8);
  const mk=(a,b)=>({a,b,bo,done:false});
  return {round:0, rounds:[
    {name:'8강', month, matches:[mk(s[0],s[7]),mk(s[3],s[4]),mk(s[1],s[6]),mk(s[2],s[5])]},
    {name:'4강', month, matches:[mk(null,null),mk(null,null)]},
    {name:'결승', month, matches:[mk(null,null)]},
  ]};
}
function intlNow(){ return S.phase==='msi'?S.msi:(S.phase==='ewc'?S.ewc:null); }
function simIntlMatch(m,tour){
  const r=simAIBo(m.a,m.b,m.bo||tour.bo||5);
  m.sa=r.sa; m.sb=r.sb; m.winner=r.sa>r.sb?m.a:m.b; m.done=true;
}
function intlAdvance(tour){
  const B=tour.bracket; const rd=B.rounds[B.round];
  if(!rd.matches.every(m=>m.done)) return {action:'pending'};
  if(B.round>=B.rounds.length-1){
    const fin=rd.matches[0];
    tour.done=true; tour.champion=fin.winner; tour.runnerUp=fin.winner===fin.a?fin.b:fin.a;
    if(tour.kind==='msi'){
      S.msiChampion=tour.champion;
      S.split='summer'; S.phase='regular'; S.week=6;
      S.actionApplied=false; S.weekActionTarget=null; S.gameplan=null;
      toast('☀️ MSI 종료 — 서머 시즌이 시작됩니다');
    }else{
      S.ewcChampion=tour.champion;
      S.phase='regular';
      toast('🏅 EWC 종료 — 서머 시즌으로 복귀합니다');
    }
    saveGame();
    return {action:'done'};
  }
  const winners=rd.matches.map(m=>m.winner);
  const next=B.rounds[B.round+1];
  next.matches.forEach((m,i)=>{ m.a=winners[i*2]||null; m.b=winners[i*2+1]||null; });
  B.round++;
  saveGame();
  return {action:'advanced'};
}
function intlNext(){
  const tour=intlNow(); if(!tour) return {action:'none'};
  const rd=tour.bracket.rounds[tour.bracket.round];
  const mine=rd.matches.find(m=>!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam));
  if(mine) return {action:'user',match:mine,roundName:rd.name,tour};
  rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b) simIntlMatch(m,tour); });
  return intlAdvance(tour);
}
function intlSeries(match,roundName,tour){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const bo=match.bo||tour.bo||5;
  const s=createSeries(oppId,bo,tour.kind,{match,roundName});
  s.sides[0]=Math.random()<0.5?'blue':'red';
  saveGame();
  return s;
}

/* ================= WORLDS (롤드컵) ================= */
const WORLDS_INTL=['BLG','TES','LNG','WBG','G2','FNC','MKOI','KC','FLY','TL','C9','100T'];
function lckSeeds(){
  const P=S.playoffs;
  const st=standings().map(t=>t.id);
  const out=[];
  const fin=P?P.rounds[2].matches[0]:null;
  if(fin&&fin.winner){
    out.push(fin.winner);
    const loser=fin.winner===fin.a?fin.b:fin.a;
    if(loser&&!out.includes(loser)) out.push(loser);
  }
  if(P&&P.rounds[1]){
    P.rounds[1].matches.forEach(m=>{ if(m.done&&m.winner){ const loser=m.winner===m.a?m.b:m.a; if(loser&&!out.includes(loser)) out.push(loser); } });
  }
  st.forEach(id=>{ if(out.length<4&&!out.includes(id)) out.push(id); });
  return out.slice(0,4);
}
function startWorlds(seedOverride){
  applyRandomPatch('월즈 메이저 패치');
  let seeds=(seedOverride&&seedOverride.length?seedOverride:lckSeeds()).slice(0,4);
  if(!seedOverride&&S.msiChampion&&T(S.msiChampion)&&T(S.msiChampion).region==='LCK'&&!seeds.includes(S.msiChampion)){
    seeds=[S.msiChampion,...seeds.slice(0,3)];
  }
  const teams=[...seeds, ...WORLDS_INTL.filter(id=>!seeds.includes(id)&&T(id))];
  const rec={};
  teams.forEach(id=>{ rec[id]={w:0,l:0,opp:[],region:T(id).region}; });
  S.worlds={
    season:S.season, teams, rec, seeds, round:0, rounds:[],
    stage:'swiss', qualified:[], eliminated:[], bracket:null,
    champion:null, runnerUp:null, done:false, userIn:teams.includes(S.userTeam),
  };
  S.phase='worlds';
  worldsPairRound();
  saveGame();
}
function worldsActive(){
  const W=S.worlds; if(!W) return [];
  return W.teams.filter(id=>!W.qualified.includes(id)&&!W.eliminated.includes(id));
}
function worldsPairRound(){
  const W=S.worlds; if(!W) return;
  const active=worldsActive();
  const groups={};
  active.forEach(id=>{ const k=W.rec[id].w+'-'+W.rec[id].l; (groups[k]=groups[k]||[]).push(id); });
  const matches=[];
  Object.keys(groups).forEach(k=>{
    const list=groups[k].sort((a,b)=>teamPowerRaw(T(b))-teamPowerRaw(T(a)));
    const pool=list.slice();
    while(pool.length>=2){
      const a=pool.shift();
      let idx=pool.findIndex(b=>!W.rec[a].opp.includes(b)&&b!==a);
      if(idx<0) idx=0;
      const b=pool.splice(idx,1)[0];
      matches.push({a,b,bo:1,done:false,stage:'swiss',round:W.round+1});
    }
  });
  W.rounds.push({name:'스위스 R'+(W.round+1), swiss:true, matches, done:false, month:'10월'});
  W.round++;
  saveGame();
}
function simWorldsMatch(m){
  if(m.done) return;
  const bo=m.bo||1;
  const r=simAIBo(m.a,m.b,bo);
  m.sa=r.sa; m.sb=r.sb; m.winner=r.sa>r.sb?m.a:m.b; m.done=true;
  const w=m.winner,l=(w===m.a?m.b:m.a);
  const ps=(w===S.userTeam?[]:[]);
  return m;
}
function worldsCloseRound(){
  const W=S.worlds; if(!W) return;
  const rd=W.rounds[W.rounds.length-1];
  rd.matches.forEach(m=>{
    const w=m.winner, l=(w===m.a?m.b:m.a);
    if(!W.rec[w]) return;
    W.rec[w].w++; W.rec[l].l++;
    W.rec[w].opp.push(l); W.rec[l].opp.push(w);
    if(W.rec[w].w>=3&&!W.qualified.includes(w)) W.qualified.push(w);
    if(W.rec[l].l>=3&&!W.eliminated.includes(l)) W.eliminated.push(l);
  });
  rd.done=true;
  if(W.qualified.length>=8){ W.stage='bracket'; buildWorldsBracket(); return; }
  worldsPairRound();
}
function worldsSeedOrder(){
  const W=S.worlds;
  return W.qualified.slice().sort((a,b)=>{
    const ra=W.rec[a], rb=W.rec[b];
    return (rb.w-ra.w)||(ra.l-rb.l)||(teamPowerRaw(T(b))-teamPowerRaw(T(a)));
  });
}
function buildWorldsBracket(){
  const W=S.worlds;
  const s=worldsSeedOrder();
  const mk=(a,b)=>({a,b,bo:5,done:false,stage:'ko'});
  W.bracket={ round:0, rounds:[
    {name:'8강', month:'10월', matches:[mk(s[0],s[7]),mk(s[3],s[4]),mk(s[1],s[6]),mk(s[2],s[5])]},
    {name:'4강', month:'11월', matches:[{a:null,b:null,bo:5,done:false,stage:'ko'},{a:null,b:null,bo:5,done:false,stage:'ko'}]},
    {name:'결승', month:'11월', matches:[{a:null,b:null,bo:5,done:false,stage:'ko'}]},
  ]};
  W.stage='bracket';
  saveGame();
}
function worldsBracketRound(){ const W=S.worlds; return W&&W.bracket?W.bracket.rounds[W.bracket.round]:null; }
function worldsAdvanceBracket(){
  const W=S.worlds; const B=W.bracket; if(!B) return {action:'none'};
  const rd=B.rounds[B.round];
  if(!rd.matches.every(m=>m.done)) return {action:'pending'};
  if(B.round>=B.rounds.length-1){ worldsFinish(); return {action:'done'}; }
  const winners=rd.matches.map(m=>m.winner);
  const next=B.rounds[B.round+1];
  next.matches.forEach((m,i)=>{ m.a=winners[i*2]||null; m.b=winners[i*2+1]||null; });
  B.round++;
  saveGame();
  return {action:'advanced'};
}
function worldsNext(){
  const W=S.worlds; if(!W) return {action:'none'};
  if(W.stage==='swiss'){
    const rd=W.rounds[W.rounds.length-1];
    if(!rd) return {action:'none'};
    const mine=rd.matches.find(m=>!m.done&&(m.a===S.userTeam||m.b===S.userTeam));
    if(mine) return {action:'user', match:mine, roundName:rd.name};
    rd.matches.forEach(m=>{ if(!m.done) simWorldsMatch(m); });
    worldsCloseRound();
    return {action:'advanced'};
  }
  if(W.stage==='bracket'){
    const rd=worldsBracketRound();
    if(!rd) return {action:'none'};
    const mine=rd.matches.find(m=>!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam));
    if(mine) return {action:'user', match:mine, roundName:rd.name};
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b) simWorldsMatch(m); });
    return worldsAdvanceBracket();
  }
  return {action:'none'};
}
function worldsSeries(match,roundName){
  const oppId=match.a===S.userTeam?match.b:match.a;
  const bo=match.bo||1;
  const s=createSeries(oppId,bo,'worlds',{match,roundName});
  s.sides[0]=Math.random()<0.5?'blue':'red';
  saveGame();
  return s;
}
function worldsFinish(){
  const W=S.worlds; if(!W||!W.bracket) return;
  const fin=W.bracket.rounds[2].matches[0];
  W.done=true; W.stage='done';
  W.champion=fin.winner; W.runnerUp=fin.winner===fin.a?fin.b:fin.a;
  S.phase='end';
  S.champion=W.champion; S.runnerUp=W.runnerUp;
  S.worldsHistory=S.worldsHistory||[];
  S.worldsHistory.push({season:S.season, champion:W.champion, runnerUp:W.runnerUp, userTeam:S.userTeam, place:worldsUserPlace()});
  saveGame();
}
function worldsUserPlace(){
  const W=S.worlds; if(!W) return '-';
  if(W.champion===S.userTeam) return '우승';
  if(W.runnerUp===S.userTeam) return '준우승';
  if(!W.userIn) return '진출 실패';
  if(W.bracket){
    for(const rd of W.bracket.rounds){
      for(const m of rd.matches){
        if(m.done&&(m.a===S.userTeam||m.b===S.userTeam)&&m.winner!==S.userTeam) return rd.name+' 탈락';
      }
    }
  }
  return '스위스 탈락';
}
/* 월즈 모드: 정규시즌 없이 바로 롤드컵 */
function startWorldsMode(teamId){
  createState(teamId,{});
  const region=T(teamId).region;
  let seeds;
  if(region==='LCK'){
    const byPower=lckIds().slice().sort((a,b)=>teamPowerRaw(T(b))-teamPowerRaw(T(a)));
    seeds=[teamId, ...byPower.filter(id=>id!==teamId).slice(0,3)];
  }else{
    const byPower=lckIds().slice().sort((a,b)=>teamPowerRaw(T(b))-teamPowerRaw(T(a)));
    seeds=byPower.slice(0,4);
  }
  S.schedule=[];
  S.week=1;
  startWorlds(seeds);
  saveGame();
  renderAll();
}

/* ---------- offseason: 계약 만료 · 재계약 / FA ---------- */
function startOffseason(){
  const st={players:[],staff:[],aiLog:[]};
  // 계약 1년 차감
  Object.values(S.players).forEach(p=>{
    if(p.retired) return;
    p.contract=(p.contract===undefined?1:p.contract)-1;
  });
  Object.values(S.staffLib||{}).forEach(s=>{ if(s.team) s.contract=(s.contract===undefined?1:s.contract)-1; });
  // 우리 팀 만료자
  const me=myTeam();
  me.roster.forEach(n=>{
    const p=S.players[n];
    if(p && p.contract<=0) st.players.push(n);
  });
  staffAll(S.userTeam).forEach(s=>{ if(s.contract<=0) st.staff.push(s.id); });
  // AI 팀 자동 처리
  Object.values(S.teams).forEach(t=>{
    if(t.id===S.userTeam) return;
    t.roster.slice().forEach(n=>{
      const p=S.players[n]; if(!p||p.contract>0) return;
      const keep=Math.random()<0.68 && t.budget>p.salary*0.5;
      if(keep){ p.contract=ri(1,3); t.budget=Math.round((t.budget-p.salary*0.5)*10)/10; }
      else{
        t.roster=t.roster.filter(x=>x!==n);
        Object.keys(t.lineup).forEach(r=>{ if(t.lineup[r]===n) delete t.lineup[r]; });
        p.team=null; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10;
        st.aiLog.push(p.name+' → FA');
      }
    });
    ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  });
  // AI 스태프
  Object.values(S.staffLib||{}).forEach(s=>{
    if(!s.team||s.team===S.userTeam||s.contract>0) return;
    if(Math.random()<0.7){ s.contract=ri(1,2); }
    else { s.team=null; }
  });
  S.phase='offseason';
  S.offseason=st;
  saveGame();
  renderOffseason();
}
function reSignPlayer(name, years){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  const yearsN=Math.max(1,Math.min(3,Number(years)||2));
  const cost=Math.round(p.salary*(0.35+0.12*yearsN)*10)/10;
  if(t.budget<cost) return {ok:false,msg:'예산 부족 (재계약 비용 '+cost.toFixed(1)+'억)'};
  t.budget=Math.round((t.budget-cost)*10)/10;
  p.contract=yearsN;
  S.offseason.players=(S.offseason.players||[]).filter(n=>n!==name);
  toast('📝 '+name+' 재계약 — '+yearsN+'년 ('+cost.toFixed(1)+'억)');
  saveGame(); renderOffseason(); return {ok:true};
}
function releaseExpiringPlayer(name){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  if(t.roster.length<=6) return {ok:false,msg:'최소 6명은 유지해야 합니다'};
  t.roster=t.roster.filter(n=>n!==name);
  Object.keys(t.lineup).forEach(r=>{ if(t.lineup[r]===name) delete t.lineup[r]; });
  p.team=null; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10; p.contract=0;
  ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  S.offseason.players=(S.offseason.players||[]).filter(n=>n!==name);
  toast('🚪 '+name+' FA 방출 — 이적시장으로 나갑니다');
  saveGame(); renderOffseason(); return {ok:true};
}
function offseasonRenewStaff(id, years){
  const st=S.staffLib[id]; if(!st||st.team!==S.userTeam) return {ok:false,msg:'우리 스태프가 아닙니다'};
  const yearsN=Math.max(1,Math.min(3,Number(years)||2));
  const cost=Math.round(st.salary*0.6*yearsN*10)/10;
  if(myTeam().budget<cost) return {ok:false,msg:'예산 부족 (재계약 '+cost.toFixed(1)+'억)'};
  myTeam().budget=Math.round((myTeam().budget-cost)*10)/10;
  st.contract=yearsN;
  S.offseason.staff=(S.offseason.staff||[]).filter(x=>x!==id);
  toast('🤝 '+st.name+' 재계약 — '+yearsN+'시즌');
  saveGame(); renderOffseason(); return {ok:true};
}
function finishOffseason(){
  if((S.offseason&&S.offseason.players&&S.offseason.players.length)||(S.offseason&&S.offseason.staff&&S.offseason.staff.length)){
    // 남은 만료자는 자동 FA 처리
    (S.offseason.players||[]).slice().forEach(n=>releaseExpiringPlayer(n));
    (S.offseason.staff||[]).slice().forEach(id=>{
      const st=S.staffLib[id]; if(st&&st.team===S.userTeam){
        const cur=S.staff[S.userTeam];
        if(st.role==='HEAD') cur.head=null; else cur.coaches=cur.coaches.filter(x=>x!==id);
        st.team=null; st.contract=0;
      }
    });
    S.offseason={players:[],staff:[],aiLog:(S.offseason.aiLog||[])};
  }
  nextSeason();
}

/* ---------- season transition ---------- */
function nextSeason(){
  S.season++;
  S.week=1; S.phase='regular'; S.results=[]; S.history=[]; S.playoffs=null; S.champion=null;
  S.worlds=null; S.lckChampion=null; S.myExit=null; S.trainingLog=[]; S.offseason=null;
  S.meta={tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}}; S.patches=[]; S.patchNotes=[]; S.patchNo=0;
  S.currentSeries=null; S.seriesMomentum=0;
  Object.values(S.teams).forEach(t=>{t.wins=0;t.losses=0;t.gw=0;t.gl=0;t.form=[];t.pogTotal=0;});
  Object.values(S.players).forEach(p=>{
    p.age++;
    if(p.age<=21){ const k=pickOf(['lane','fight','pool']); p.stats[k]=clamp(p.stats[k]+ri(1,3),40,99); p.stats.macro=clamp(p.stats.macro+ri(0,2),40,99); }
    else if(p.age>=27){ const k=pickOf(['lane','fight','mental']); p.stats[k]=clamp(p.stats[k]-ri(1,2),40,99); }
    p.stats.mental=clamp(p.stats.mental+ri(-1,2),40,99);
    p.form=ri(65,85); p.fatigue=ri(3,15);
    // 시즌마다 특성 재정비 (등급 기준 유지, 나쁜 특성은 일부 자연 극복)
    if(Math.random()<0.3 && p.bad&&p.bad.length) p.bad.pop();
    rollTraits(p,p.grade);
  });
  S.schedule=genSchedule(lckIds());
  saveGame();
  if(myTeam().region!=='LCK'){ startWorlds(); return; }
  renderAll();
}

function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const s=JSON.parse(raw);
    if(!s||!s.teams||!s.userTeam) return false;
    S=s;
    if(!S.meta) S.meta={tier:{},obj:{dragon:1,grub:1,baron:1,tower:1}};
    if(!S.patches) S.patches=[];
    if(!S.pog) S.pog={};
    if(!S.trainingLog) S.trainingLog=[];
    if(!S.worldsHistory) S.worldsHistory=[];
    Object.values(S.players||{}).forEach(p=>{
      if(p&&Array.isArray(p.sigs)) p.sigs=p.sigs.filter(n=>!!CHAMP_MAP[n]);
      if(p&&(!p.good||!p.good.length)) rollTraits(p,p.grade||gradeOfRating(rawOverall(p)));
    });
    return true;
  }catch(e){ return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }

/* ---------- 팀 로고 · 선수 아바타 (inline SVG) ---------- */
function _shade(hex,amt){
  const h=(hex||'#25e0ff').replace('#','');
  const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function teamLogoSVG(team,size){
  if(!team) return '';
  const c=team.color||'#25e0ff';
  const light=_shade(c,40), dark=_shade(c,-70);
  const uid='lg'+String(team.id).replace(/[^A-Za-z0-9]/g,'');
  const v=(nameHash(team.id)%3);
  const motif=v===0?'<path d="M0 30 L40 10 L40 18 L0 38 Z" fill="#fff" opacity=".10"/>'
    :v===1?'<circle cx="34" cy="8" r="9" fill="#fff" opacity=".12"/>'
    :'<path d="M0 8 L40 8 L40 14 L0 26 Z" fill="#fff" opacity=".10"/>';
  return `<svg class="tlogo" width="${size||34}" height="${size||34}" viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${light}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${dark}"/>
    </linearGradient></defs>
    <path d="M20 2 L36 7 V20 C36 30 28 36 20 38 C12 36 4 30 4 20 V7 Z" fill="url(#${uid})" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>
    ${motif}
    <text x="20" y="24" text-anchor="middle" font-family="Pretendard,system-ui,sans-serif" font-size="${String(team.tag).length>3?8:10}" font-weight="900" fill="#fff" letter-spacing="-.3">${esc(team.tag)}</text>
  </svg>`;
}

/* ---------- hub bindings ---------- */
function bindHub(){
  const c=$('view-hub');
  c.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ S.weekAction=b.dataset.act; renderHub(); });
  c.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{ S.weekActionTarget=b.dataset.focus; renderHub(); });
  const gm=$('goMatch'); if(gm) gm.onclick=()=>prepareMatch();
  const rs=$('resumeSeries'); if(rs) rs.onclick=()=>{ if(S.currentSeries){ if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries);} };
  const sp=$('seePatch'); if(sp) sp.onclick=()=>{ if(S.patchNotes&&S.patchNotes[0]) showPatchNote(S.patchNotes[0]); };
  const gs=$('goStaff'); if(gs) gs.onclick=()=>{TAB='staff';renderHub();};
  const os=$('openStaffTab'); if(os) os.onclick=()=>{TAB='staff';renderHub();};
  const oe=$('openEditor'); if(oe) oe.onclick=()=>openPlayerEditor(null);
  const vw=$('viewWorlds'); if(vw) vw.onclick=()=>{ if(S.worlds){ show('worlds'); renderWorlds(); } };
  c.querySelectorAll('[data-player]').forEach(el=>el.onclick=()=>openPlayer(el.dataset.player));
  c.querySelectorAll('[data-sign]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const sel=c.querySelector('[data-years="'+b.dataset.sign.replace(/"/g,'\\"')+'"]');
    const years=sel?Number(sel.value):2;
    const r=signFA(b.dataset.sign,years); if(!r.ok) toast(r.msg);
  });
  c.querySelectorAll('[data-release]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); if(confirm(b.dataset.release+' 선수를 방출할까요?')){const r=releasePlayer(b.dataset.release); if(!r.ok) toast(r.msg);}});
  c.querySelectorAll('[data-hire]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const sel=c.querySelector('[data-styears="'+b.dataset.hire+'"]');
    const seasons=sel?Number(sel.value):2;
    const r=hireStaff(b.dataset.hire,seasons); if(!r.ok) toast(r.msg);
  });
  c.querySelectorAll('[data-renew]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); const r=renewStaff(b.dataset.renew); if(!r.ok) toast(r.msg);});
  c.querySelectorAll('[data-fire]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); if(confirm('이 스태프와 계약을 해지할까요? (위약금 발생)')){const r=fireStaff(b.dataset.fire); if(!r.ok) toast(r.msg);}});
  c.querySelectorAll('[data-subgo]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const role=b.dataset.subgo;
    const sel=c.querySelector('[data-subsel="'+role+'"]');
    if(sel){ const r=setSeriesSub(role,sel.value); if(r&&!r.ok) toast(r.msg); else renderHub(); }
  });
  c.querySelectorAll('[data-patchview]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const rec=(S.patchNotes||[]).find(x=>String(x.no)===String(b.dataset.patchview)); if(rec) showPatchNote(rec); });
  c.querySelectorAll('[data-editstaff]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); openStaffEditor(b.dataset.editstaff);});
}
function prepareMatch(){
  if(S.currentSeries && !S.currentSeries.done){
    if(S.currentSeries.pendingSide) renderSideChoice(); else startDraft(S.currentSeries);
    return;
  }
  if(!S.actionApplied) applyWeekAction();
  const opp=weekOpponent(); if(!opp) return;
  const s=createSeries(opp.oppId,3,'regular',{});
  saveGame();
  startDraft(s);
}

let ED=null;
function openPlayerEditor(name){
  const pool=Object.values(S.players).filter(p=>!p.retired);
  const p=name?S.players[name]:(lineupOf(myTeam())[0]||pool[0]);
  if(!p) return;
  ED={orig:p.name, team:p.team, name:p.name, role:p.role, age:p.age, grade:p.grade, contract:(p.contract===undefined?1:p.contract),
      lane:p.stats.lane, fight:p.stats.fight, macro:p.stats.macro, pool:p.stats.pool, mental:p.stats.mental,
      persons:(Array.isArray(p.persons)?p.persons.slice():(p.pers?[p.pers]:['quiet'])), exp:p.exp||0, photo:p.photo||'',
      sigs:(p.sigs||[]).slice(), good:(p.good||[]).slice(), bad:(p.bad||[]).slice()};
  renderEditor();
}
function renderEditor(){
  if(!ED) return;
  const p=S.players[ED.orig];
  const champs=CHAMPS.filter(c=>c.r.includes(ED.role));

/* ---------- 특성/성향 설명 카드 ---------- */
function effectLines(t){
  const e=t.e||{}; const out=[];
  const map={lane:'라인전',fight:'한타',macro:'운영',obj:'오브젝트',mental:'멘탈',pool:'챔프폭',vision:'시야',risk:'리스크'};
  Object.keys(map).forEach(k=>{ if(e[k]) out.push(map[k]+' '+(e[k]>0?'+':'')+e[k].toFixed(1)); });
  if(t.late) out.push('후반(25분+) 추가 효과');
  if(t.early) out.push('초반(12분-) 추가 효과');
  return out;
}
function showTraitCard(kind,id){
  let html='';
  if(kind==='pers'){
    const x=PERS_MAP[id]; if(!x) return;
    const lines=[];
    if(x.chem) lines.push('팀 케미 '+(x.chem>0?'+':'')+x.chem);
    if(x.vol) lines.push('폼 기복 x'+x.vol);
    if(x.growth) lines.push('성장 배율 x'+x.growth);
    if(x.peak) lines.push('최고 컨디션 성능 x'+x.peak);
    if(x.mental) lines.push('멘탈 저항 '+(x.mental>0?'+':'')+x.mental);
    if(x.likes) lines.push('선호 코치 특성: '+((STAFF_TRAITS[x.likes]||{}).n||x.likes));
    html=`<div class="tiny" style="letter-spacing:.16em;font-weight:900;color:#ffd9a8">PERSONALITY</div>
      <h3 style="font-size:19px;margin:4px 0 4px">${x.icon} ${esc(x.n)}</h3>
      <div class="tiny" style="line-height:1.5">${esc(x.d)}</div>
      <div class="divider"></div>
      <div class="tag-row">${lines.map(l=>`<span class="chip sm">${esc(l)}</span>`).join('')}</div>`;
  }else if(kind==='staff'){
    const x=STAFF_TRAITS[id]; if(!x) return;
    html=`<div class="tiny" style="letter-spacing:.16em;font-weight:900;color:var(--gold)">STAFF TRAIT</div>
      <h3 style="font-size:19px;margin:4px 0">${esc(x.n)}</h3>
      <div class="tiny" style="line-height:1.5">${esc(x.d)}</div>`;
  }else{
    const t=TRAIT_MAP[id]; if(!t) return;
    html=`<div class="tiny" style="letter-spacing:.16em;font-weight:900;color:${t.g>0?'#8ff0c4':'#ff9aa9'}">${t.g>0?'GOOD':'BAD'} TRAIT · ${esc(t.c)}</div>
      <h3 style="font-size:19px;margin:4px 0">${esc(t.n)}</h3>
      <div class="tiny" style="line-height:1.5">${esc(t.d)}</div>
      <div class="divider"></div>
      <div class="tag-row">${effectLines(t).map(l=>`<span class="chip sm ${t.g>0?'green':'red'}">${esc(l)}</span>`).join('')}</div>
      <div class="tiny" style="margin-top:8px">이 수치는 라인전·한타·운영·오브젝트 판정과 경기 시뮬레이션에 실제 반영됩니다.</div>`;
  }
  $('modal').innerHTML=`<div class="modal-wrap" id="modalWrap"><div class="modal" style="max-height:70dvh">
    <div class="grab"></div>${html}<div style="height:12px"></div>
    <button class="btn ghost block" id="modalClose">닫기</button></div></div>`;
  $('modal').classList.remove('hidden');
  $('modalClose').onclick=closeModal;
  $('modalWrap').onclick=e=>{ if(e.target.id==='modalWrap') closeModal(); };
}
document.addEventListener('click',(e)=>{
  const el=e.target.closest&&e.target.closest('[data-trait],[data-pers],[data-stafftrait]');
  if(!el) return;
  e.preventDefault(); e.stopPropagation();
  if(el.dataset.trait) showTraitCard('trait',el.dataset.trait);
  else if(el.dataset.pers) showTraitCard('pers',el.dataset.pers);
  else if(el.dataset.stafftrait) showTraitCard('staff',el.dataset.stafftrait);
}, true);

function mySigs(){ return lineupOf(myTeam()).flatMap(p=>p.sigs); }
function draftHead(){
  const cur=dCur();
  const phase=D.phase==='assign'?'라인 배정':D.phase==='done'?'밴픽 완료':(cur&&cur.t==='ban'?'BAN PHASE':'PICK PHASE');
  const sr=D.series;
  return `<div class="draft-head">
    <div>
      <div class="draft-phase">${phase} · ${D.mySide==='blue'?'블루':'레드'} 사이드</div>
      <div class="tiny" style="margin-top:2px">${esc(myTeam().tag)} ${sr.score.me} : ${sr.score.opp} ${esc(T(D.oppId).tag)} · ${D.gameIdx+1}세트${D.series.bo>1?' · Bo'+D.series.bo:''}</div>
    </div>
    <div style="text-align:right">
      <div class="draft-timer">${D.phase==='assign'?'감독 배정':D.phase==='done'?'확정':(dActor()==='me'?'내 차례':'상대 차례')}</div>
      <div class="tiny">밴 ${dMyBans().length}/5 · 픽 ${dMyPicks().length}/5</div>
    </div>
  </div>`;
}
function draftTimeline(){
  return `<div class="draft-timeline">${DRAFT_ORDER.map((o,i)=>{
    const active=i===D.step&&D.phase!=='assign'&&D.phase!=='done';
    const done=i<D.step||D.phase==='assign'||D.phase==='done';
    const mine=o.s===D.mySide;
    return `<span class="dt ${o.t} ${mine?'mine':'enemy'} ${active?'on':''} ${done?'done':''}" title="${o.t==='ban'?'밴':'픽'} ${mine?'(우리)':'(상대)'}">${o.t==='ban'?'B':'P'}</span>`;
  }).join('')}</div>`;
}
function banSlots(list, mine){
  let h='';
  for(let i=0;i<5;i++){
    const n=list[i];
    h+=`<div class="ban-slot ${n?'filled':''} ${mine?'':'enemy'}">${n?esc(n):'—'}</div>`;
  }
  return h;
}
function pickSlots(names, mine){
  const roles=D.assign&&D.assign[mine?'me':'opp'];
  const arr=(names||[]).slice(0,5); while(arr.length<5) arr.push(null);
  return arr.map((n,i)=>{
    const c=n?CHAMP_MAP[n]:null;
    const roleKey=mine?'me':'opp';
    const role=roles?Object.keys(roles).find(r=>roles[r]===n):null;
    return `<div class="pick-slot ${n?'':'empty'} ${mine?'':'enemy'}">
      <div class="role">${role?ROLE_KR[role]:'P'+(i+1)}</div>
      ${c?`<img src="${DD(c.k)}" alt="" onerror="this.style.opacity=0">`:'<div style="flex:1"></div>'}
      <div class="ps-name">${n?esc(n):'—'}</div>
      ${n&&mySigs().includes(n)&&mine?'<span class="sig">★</span>':''}
    </div>`;
  }).join('');
}
function compMini(comp){
  const v=k=>Math.round((comp.tags[k]/15)*100);
  return `<div class="synergy">
    ${[['이니시','engage','cyan'],['포킹','poke','violet'],['한타','fight','gold'],['스플릿','split','green'],['후반','scale','red']].map(([label,k,cls])=>`
      <div class="syn"><div class="sn">${label}</div><div class="sv">${v(k)}</div><div class="sb ${cls}"><i style="width:${v(k)}%"></i></div></div>`).join('')}
  </div>`;
}
function curveBars(comp){
  const labels=['초반','중반','후반'];
  return `<div class="bars">${comp.curve.map((v,i)=>`
    <div class="bar-row"><span>${labels[i]}</span><div class="bar ${i===0?'cyan':i===1?'violet':'gold'}"><i style="width:${(v/5)*100}%"></i></div><b>${v.toFixed(1)}</b></div>`).join('')}</div>`;
}
function laneBars(lane){
  return `<div class="stack" style="gap:7px">${ROLES.map(r=>{
    const L=lane[r]; if(!L) return '';
    const d=(L.my-L.opp)/2.5;
    const w=clamp(Math.abs(d)*2.2,4,50);
    return `<div class="lane-row">
      <span class="lr">${ROLE_KR[r]}</span>
      <div class="lane-bar"><div class="lane-mid"></div><div class="my ${d<0?'neg':''}" style="width:${w}%"></div></div>
      <span class="lane-val" style="color:${d>0?'var(--cyan)':'var(--red)'}">${d>0?'+':''}${d.toFixed(1)}</span>
    </div>`;
  }).join('')}</div>`;
}
function draftAdvBar(r){
  if(!r) return '';
  const pct=r.myPct;
  return `<div class="adv-card">
    <div class="adv-top"><span>밴픽 우세도</span><span class="adv-num ${pct>=50?'up':'down'}">${pct.toFixed(1)}% <i>:</i> ${(100-pct).toFixed(1)}%</span></div>
    <div class="adv-bar"><i style="width:${pct}%"></i><span></span></div>
    <div class="tiny" style="margin-top:4px">${pct>=56?'밴픽에서 크게 앞섰습니다 — 라인 상성·조합 우위':pct>=52?'밴픽 소폭 우위':pct<=44?'밴픽 열세 — 운영과 교전 설계로 뒤집어야 합니다':'밴픽 팽팽한 승부'}</div>
  </div>`;
}
function traitChips(p, max){
  if(!p) return '';
  const good=(p.good||[]).slice(0,max||99), bad=(p.bad||[]).slice(0,Math.max(1,Math.round((max||99)/2)));
  return good.map(id=>{const t=TRAIT_MAP[id];return t?`<span class="tr good" title="${esc(t.d)}">${esc(t.n)}</span>`:'';}).join('')
    + (p.bad||[]).slice(0,3).map(id=>{const t=TRAIT_MAP[id];return t?`<span class="tr bad" title="${esc(t.d)}">${esc(t.n)}</span>`:'';}).join('');
}
function playChip(p){
  if(!p) return '';
  return `<span class="play-chip" title="대표 성향">${playIcon(p)} ${esc(playName(p))}</span>`;
}

function suggestTactics(){
  const m=M.minute;
  const gd=M.gold[0]-M.gold[1];
  const behind=gd<-1500, ahead=gd>1500;
  const soulNear=(M.dragons[0]>=2||M.dragons[1]>=2);
  const out=[];
  if(m<14){
    out.push('topDive','botDive','midJungle','invade','plate');
    if(behind) out.splice(3,2,'freeze','counterGank');
    if(ahead) out.splice(4,1,'laneSwap');
  }else if(m<20){
    out.push('heraldMid','grubs','dragonTrade','split131','cross');
    if(soulNear) out.unshift('soulDeny');
    if(behind) out.splice(3,2,'freeze','tpFlank');
  }else{
    out.push('baronBush','baronBurst','soulDeny','engage','peel');
    if(ahead) out.splice(4,1,'push3');
    if(behind) out.splice(3,2,'avoid','scale');
    if(M.soulGranted.opp||M.elderAt) out.unshift('elderAll');
  }
  return [...new Set(out)].slice(0,5).map(k=>FOCUS_MAP[k]).filter(Boolean);
}

function drawGraph(){
  const cv=$('goldCanvas'); if(!cv||!M) return;
  const w=cv.clientWidth||320, h=132, dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){ const y=h*i/4; ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke(); }
  const hist=M.history.length>1?M.history:[{min:0,diff:0},{min:M.minute,diff:0}];
  const span=Math.max(30,Math.min(40,Math.ceil((M.minute*1.35)/5)*5));
  const maxAbs=Math.max(2000,...hist.map(p=>Math.abs(p.diff)))*1.2;
  const X=m=>8+(m/span)*(w-16);
  const Y=d=>h/2-(d/maxAbs)*(h/2-8);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
  const pts=hist.map(p=>[X(Math.min(p.min,span)),Y(p.diff)]);
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(37,224,255,.35)');grad.addColorStop(.5,'rgba(37,224,255,.03)');grad.addColorStop(.5,'rgba(255,77,109,.03)');grad.addColorStop(1,'rgba(255,77,109,.35)');
  ctx.beginPath(); ctx.moveTo(pts[0][0],h/2);
  pts.forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(pts[pts.length-1][0],h/2); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.strokeStyle='#7ceaff'; ctx.lineWidth=2; ctx.stroke();
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],3.2,0,7); ctx.fillStyle=M.gold[0]>=M.gold[1]?'#25e0ff':'#ff4d6d'; ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='9px sans-serif';
  ctx.fillText("+"+Math.round(maxAbs/1000)+"K",6,14);
  ctx.fillText("-"+Math.round(maxAbs/1000)+"K",6,h-6);
  ctx.fillText(span+"'",w-20,h-6);
}

/* ============ LIVE 2D MATCH ENGINE — 소환사 협곡 (FM 2D 스타일) ============ */
const MM={
  init:false, key:null, units:{}, tgt:{}, minions:[], proj:[], fx:[], marks:[],
  focus:null, focusUntil:0, dead:{}, towerIdx:{me:0,opp:0}, waveAt:0,
  last:{kills:[0,0],towers:[0,0],dragons:[0,0],barons:[0,0],grubs:[0,0],fights:[0,0]},
  phase:'lane', phaseLabel:'라인전', rafId:null, lastTs:0, started:false, t:0,
};
const LANE_PATH={
  TOP:[[0.10,0.90],[0.07,0.55],[0.07,0.16],[0.16,0.07],[0.62,0.07],[0.90,0.10]],
  MID:[[0.10,0.90],[0.30,0.70],[0.50,0.50],[0.70,0.30],[0.90,0.10]],

const MAP_TOWERS={
  me:[[0.20,0.10],[0.10,0.30],[0.10,0.55],[0.30,0.70],[0.22,0.78],[0.14,0.86],[0.55,0.91],[0.75,0.91],[0.90,0.78]],
  opp:[[0.60,0.08],[0.80,0.10],[0.90,0.30],[0.70,0.30],[0.78,0.22],[0.86,0.14],[0.91,0.55],[0.91,0.75],[0.88,0.90]],
};
const LANE_POS={
  TOP:{me:[0.34,0.10],opp:[0.56,0.12]},
  MID:{me:[0.40,0.60],opp:[0.60,0.40]},
  ADC:{me:[0.56,0.91],opp:[0.70,0.88]},

};
const CAMPS={
  me:[[0.18,0.78],[0.10,0.64],[0.26,0.62],[0.40,0.80],[0.24,0.90],[0.50,0.86]],
  opp:[[0.82,0.22],[0.90,0.36],[0.74,0.38],[0.60,0.20],[0.76,0.10],[0.50,0.14]],
};
const PIT={dragon:[0.70,0.72],baron:[0.30,0.28],grub:[0.30,0.28]};
const OBJ_TIMES={dragon:[5,11,17,23,29],grub:[6,10],baron:[20,26,32]};
const SIDE_COL={me:'#25e0ff',opp:'#ff4d6d'};

function mmTokenKey(side,role){ return side+'-'+role; }
function mmReset(){
  MM.units={}; MM.tgt={}; MM.minions=[]; MM.proj=[]; MM.fx=[]; MM.marks=[];
  MM.focus=null; MM.focusUntil=0; MM.dead={}; MM.towerIdx={me:0,opp:0};
  MM.waveAt=0; MM.t=0; MM.phase='lane'; MM.phaseLabel='라인전';
  MM.last={kills:[0,0],towers:[0,0],dragons:[0,0],barons:[0,0],grubs:[0,0],fights:[0,0]};
  ROLES.forEach(role=>{
    ['me','opp'].forEach(side=>{
      const k=mmTokenKey(side,role);
      const b=role==='JGL'?CAMPS[side][0]:LANE_POS[role][side];
      MM.units[k]={x:b[0],y:b[1],vx:0,vy:0,hp:100,hpMax:100,alive:true,deadUntil:0,
        side,role,cool:Math.random()*1.2,step:role==='JGL'?0.15:0.12};
      MM.tgt[k]={x:b[0],y:b[1]};
    });

}
function mmJumpTargets(){
  if(!M||!M.lineups) return;
  ROLES.forEach(role=>{
    ['me','opp'].forEach(side=>{
      const k=mmTokenKey(side,role);
      if(!MM.units[k]){
        const b=role==='JGL'?CAMPS[side][0]:LANE_POS[role][side];
        MM.units[k]={x:b[0],y:b[1],vx:0,vy:0,hp:100,hpMax:100,alive:true,deadUntil:0,side,role,cool:0,step:0.12};
        MM.tgt[k]={x:b[0],y:b[1]};
      }
    });
