<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#05070d">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>LCK 매니저 2025 · LoL Esports Manager</title>
<style>
/* ===== LCK Manager — esports dark UI ===== */
:root{
  --bg:#05070d;
  --bg2:#0a0f1c;
  --panel:rgba(17,23,40,.88);
  --panel2:rgba(26,34,56,.9);
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.14);
  --txt:#eaf0ff;
  --dim:#8b97b5;
  --dim2:#5d6884;
  --cyan:#25e0ff;
  --violet:#8b5cf6;
  --gold:#ffc94a;
  --red:#ff4d6d;
  --green:#3ddc97;
  --blue:#4d8dff;
  --grad:linear-gradient(135deg,#25e0ff 0%,#7c5cff 100%);
  --grad-gold:linear-gradient(135deg,#ffd76a,#ff9e2c);
  --r:16px;
  --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 600px at 80% -10%, rgba(124,92,255,.22), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(37,224,255,.13), transparent 60%),
    linear-gradient(180deg,#05070d,#070a14 40%,#05070d);
  color:var(--txt);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.45;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 80%);
}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:rgba(5,7,13,.35)}
@media(min-width:900px){#app{box-shadow:0 0 90px rgba(0,0,0,.7);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.hidden{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
input,select{font-family:inherit;color:inherit}

/* ---- top bar ---- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:linear-gradient(180deg,rgba(9,12,22,.98),rgba(9,12,22,.82));
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.tb-team{display:flex;align-items:center;gap:9px;min-width:0}
.tb-name{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.tb-spacer{flex:1}
.tb-pill{
  display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  font-size:10px;color:var(--dim2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.tb-pill b{font-size:14px;color:var(--gold);letter-spacing:-.01em}
.tb-week{
  font-size:11px;font-weight:800;color:var(--cyan);
  border:1px solid rgba(37,224,255,.35);background:rgba(37,224,255,.09);
  padding:4px 9px;border-radius:999px;white-space:nowrap;
}

/* ---- badges ---- */
.badge{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  display:grid;place-items:center;
  font-weight:900;font-size:12px;letter-spacing:-.03em;
  color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 4px 14px rgba(0,0,0,.45);
}
.badge.lg{width:46px;height:46px;border-radius:14px;font-size:15px}
.badge.xl{width:64px;height:64px;border-radius:20px;font-size:19px}
.badge.sm{width:26px;height:26px;border-radius:8px;font-size:10px}

/* ---- layout ---- */
main{flex:1;display:flex;flex-direction:column;padding-bottom:calc(var(--tab-h) + 18px)}
.view{padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px;animation:fade .22s ease}
.view.no-pad{padding:0}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--dim);font-size:12.5px}
.tiny{font-size:11px;color:var(--dim2)}
.section-title{display:flex;align-items:center;gap:8px;margin:2px 2px -2px}
.section-title h3{font-size:13px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.section-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* ---- cards ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.card.tight{padding:11px}
.card.glow::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px 120px at 15% 0,rgba(124,92,255,.16),transparent)}
.card-h{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.card-h h4{font-size:13.5px;letter-spacing:.02em}
.card-h .k{font-size:11px;color:var(--dim2);font-weight:700;letter-spacing:.06em}
.divider{height:1px;background:var(--line);margin:10px -14px}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;font-weight:800;font-size:14px;
  background:rgba(255,255,255,.07);border:1px solid var(--line2);
  transition:transform .1s ease,filter .15s ease,background .15s ease;
  letter-spacing:-.01em;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#04121a;border:0;box-shadow:0 6px 22px rgba(37,224,255,.28)}
.btn.gold{background:var(--grad-gold);color:#241402;border:0;box-shadow:0 6px 22px rgba(255,180,60,.3)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.4);color:#ff8fa3}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ---- tab bar ---- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  max-width:560px;margin:0 auto;
  display:flex;background:rgba(8,11,20,.96);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--dim2);
  transition:color .15s ease,background .15s ease;
}
.tabbar button .ic{font-size:18px;line-height:1;filter:grayscale(1) opacity(.6)}
.tabbar button.on{color:var(--cyan);background:rgba(37,224,255,.08)}
.tabbar button.on .ic{filter:none}

#view-title{min-height:calc(100dvh - 24px);justify-content:center;padding-bottom:50px}
#view-title .hero{padding-top:0}
/* ---- team select ---- */
.hero{padding:26px 18px 10px;text-align:center}
.hero .kicker{font-size:11px;letter-spacing:.3em;color:var(--cyan);font-weight:800;text-transform:uppercase}
.hero h1{font-size:30px;line-height:1.1;margin:8px 0 6px;background:linear-gradient(120deg,#fff,#9fd8ff 45%,#b79bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:13px;margin:0 auto;max-width:330px}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-card{
  position:relative;text-align:left;padding:12px;border-radius:14px;
  background:linear-gradient(160deg,rgba(30,38,62,.9),rgba(14,19,33,.92));
  border:1px solid var(--line);overflow:hidden;transition:transform .12s ease,border-color .2s;
  display:flex;flex-direction:column;gap:8px;
}
.team-card:active{transform:scale(.975)}
.team-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,#fff);opacity:.9}
.team-card .nm{font-weight:800;font-size:13.5px;letter-spacing:-.02em}
.team-card .meta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);font-weight:700}
.team-card .stars{color:var(--gold);letter-spacing:1px;font-size:10px}
.team-card .tagline{font-size:10.5px;color:var(--dim2);font-weight:600}
.team-card .lineup{display:flex;gap:3px;margin-top:2px}
.team-card .dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}

/* ---- pills / chips ---- */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);
  white-space:nowrap;
}
.chip.on{background:rgba(37,224,255,.14);border-color:rgba(37,224,255,.45);color:var(--cyan)}
.chip.gold{background:rgba(255,201,74,.13);border-color:rgba(255,201,74,.4);color:var(--gold)}
.chip.red{background:rgba(255,77,109,.13);border-color:rgba(255,77,109,.35);color:#ff92a5}
.chip.green{background:rgba(61,220,151,.13);border-color:rgba(61,220,151,.35);color:var(--green)}
.chip.violet{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.4);color:#c4b1ff}
.chip.sm{padding:2px 7px;font-size:10px}
.role-tag{font-size:9.5px;font-weight:900;letter-spacing:.05em;color:var(--dim2);border:1px solid var(--line2);border-radius:5px;padding:1px 4px}

/* ---- stat bars ---- */
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:52px 1fr 30px;gap:8px;align-items:center;font-size:11px;color:var(--dim)}
.bar-row b{color:var(--txt);font-size:11.5px;text-align:right}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--grad);transition:width .4s ease}
.bar.gold>i{background:var(--grad-gold)}
.bar.green>i{background:linear-gradient(90deg,#2fe08a,#8ef2b7)}
.bar.red>i{background:linear-gradient(90deg,#ff4d6d,#ff9d8a)}
.bar.violet>i{background:linear-gradient(90deg,#8b5cf6,#d3b4ff)}
.bar.cyan>i{background:linear-gradient(90deg,#25e0ff,#7cf7ff)}

/* ---- roster ---- */
.p-card{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.p-card.main{border-color:rgba(37,224,255,.28);background:linear-gradient(100deg,rgba(37,224,255,.07),rgba(17,23,40,.9) 45%)}
.p-avatar{
  width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  font-weight:900;font-size:15px;color:#dfeaff;letter-spacing:-.03em;
  background:linear-gradient(150deg,rgba(124,92,255,.45),rgba(37,224,255,.2));
  border:1px solid rgba(255,255,255,.16);
}
.p-name{font-weight:800;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.p-meta{font-size:11px;color:var(--dim);display:flex;gap:7px;align-items:center}
.p-rating{font-weight:900;font-size:17px;letter-spacing:-.03em;background:linear-gradient(120deg,#fff,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.p-cond{display:flex;flex-direction:column;gap:3px;width:64px}
.cond-label{font-size:9px;color:var(--dim2);font-weight:800;letter-spacing:.06em;display:flex;justify-content:space-between}
.cond-label span{color:var(--dim)}

/* ---- modal ---- */
.modal-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,9,.72);backdrop-filter:blur(4px);animation:fade .16s ease}
.modal{
  width:100%;max-width:560px;max-height:88dvh;overflow:auto;
  background:linear-gradient(180deg,#141a2c,#0b1020);
  border:1px solid var(--line2);border-bottom:0;
  border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .24s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:-6px auto 12px}
.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px);transform:translateX(-50%);
  z-index:100;background:rgba(20,27,45,.97);border:1px solid var(--line2);
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .2s ease;max-width:88vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---- weekly actions ---- */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action{
  text-align:left;padding:11px;border-radius:13px;border:1px solid var(--line);
  background:rgba(17,23,40,.75);display:flex;flex-direction:column;gap:4px;transition:.15s;
}
.action .ai{font-size:19px;line-height:1}
.action .an{font-weight:800;font-size:13px}
.action .ad{font-size:10.5px;color:var(--dim2);line-height:1.3}
.action.on{border-color:rgba(37,224,255,.55);background:linear-gradient(150deg,rgba(37,224,255,.14),rgba(124,92,255,.1));box-shadow:0 0 0 1px rgba(37,224,255,.2),0 8px 24px rgba(37,224,255,.1)}
.action.on .ad{color:#b9d9ea}

/* ---- next match banner ---- */
.match-banner{
  position:relative;border-radius:16px;overflow:hidden;padding:14px;
  background:linear-gradient(115deg,rgba(124,92,255,.28),rgba(37,224,255,.12) 55%,rgba(17,23,40,.9));
  border:1px solid rgba(124,92,255,.35);
}
.mb-top{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#cfd9ff;text-transform:uppercase}
.vs-row{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.vs-row .side{display:flex;align-items:center;gap:8px;min-width:0}
.vs-row .side.right{flex-direction:row-reverse;text-align:right}
.vs-row .nm{font-weight:800;font-size:14px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-badge{font-size:11px;font-weight:900;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:4px 8px;border-radius:8px;letter-spacing:.06em}

/* ---- standings ---- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10px;letter-spacing:.08em;color:var(--dim2);font-weight:800;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.045);text-align:right;font-weight:700}
.tbl td:first-child{text-align:left}
.tbl tr.me td{background:rgba(37,224,255,.07)}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.tbl tr.playoff td:first-child{box-shadow:inset 3px 0 0 rgba(139,92,246,.55)}
.tbl .tn{display:flex;align-items:center;gap:7px;font-weight:800;white-space:nowrap}
.tbl .w{color:var(--green)}
.tbl .l{color:var(--dim)}
.form{display:inline-flex;gap:2px}
.form i{width:7px;height:7px;border-radius:2px;background:rgba(255,255,255,.13)}
.form i.w{background:var(--green)}
.form i.l{background:var(--red)}

/* ---- draft ---- */
.draft-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(9,12,22,.9);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.draft-phase{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
.draft-timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;color:var(--gold)}
.draft-body{padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px}
.ban-row{display:flex;gap:6px;align-items:center}
.ban-slot{
  flex:1;height:38px;border-radius:9px;border:1px dashed rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:10px;color:var(--dim2);font-weight:800;
  background:rgba(255,255,255,.02);overflow:hidden;position:relative;
}
.ban-slot.filled{border-style:solid;border-color:rgba(255,77,109,.45);background:rgba(255,77,109,.08);color:#ffb2be;text-decoration:line-through;text-decoration-color:rgba(255,77,109,.7)}
.ban-slot.filled.enemy{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#c8d2e8;text-decoration:none}
.pick-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.pick-slot{min-width:0;max-width:110px;overflow:hidden;
  flex:1;border-radius:11px;border:1px solid var(--line);background:rgba(17,23,40,.7);
  overflow:hidden;display:flex;flex-direction:column;align-items:center;position:relative;
  aspect-ratio:3/4;
}
.pick-slot .role{font-size:8.5px;font-weight:900;color:var(--dim2);letter-spacing:.05em;padding:4px 0 0}
.pick-slot img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#131a2b}
.pick-slot .ps-name{font-size:8.5px;font-weight:800;color:var(--txt);text-align:center;line-height:1.1;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.pick-slot.empty img{display:none}
.pick-slot.empty .ps-name{color:var(--dim2);font-weight:700}
.pick-slot.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(37,224,255,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(37,224,255,.5),0 0 26px rgba(37,224,255,.4)}}
.pick-slot.enemy{border-color:rgba(255,77,109,.3)}
.pick-slot.enemy.active{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.pick-slot .sig{position:absolute;top:2px;right:2px;font-size:9px}
.champ-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:2px}
.champ{
  position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:#101728;padding:0;aspect-ratio:1;transition:transform .1s,border-color .15s;
}
.champ img{width:100%;height:100%;object-fit:cover;display:block}
.champ .cn{position:absolute;left:0;right:0;bottom:0;font-size:8px;font-weight:800;text-align:center;padding:2px 1px;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.champ:active{transform:scale(.93)}
.champ.offrole{opacity:.42}
.champ.used{opacity:.22;pointer-events:none;filter:grayscale(1)}
.champ.ban{filter:grayscale(1) sepia(.6) hue-rotate(-40deg) brightness(.6)}
.champ.ban::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:#ff7b8f;text-shadow:0 0 6px #000}
.champ.sig{outline:2px solid var(--gold);outline-offset:-2px}
.champ .cp{position:absolute;top:2px;left:3px;font-size:8px;font-weight:900;color:#ffd76a;text-shadow:0 1px 3px #000}
.role-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.role-tabs::-webkit-scrollbar{display:none}
.role-tabs .chip{flex:0 0 auto}
.synergy{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.syn{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.syn .sn{font-size:9px;color:var(--dim2);font-weight:800;letter-spacing:.02em}
.syn .sv{font-size:14px;font-weight:900;letter-spacing:-.03em}
.syn .sb{height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:3px;overflow:hidden}
.syn .sb>i{display:block;height:100%;background:var(--grad)}
.lane-row{display:flex;align-items:center;gap:7px;font-size:11px}
.lane-row .lr{width:30px;color:var(--dim2);font-weight:800;font-size:9.5px}
.lane-bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.lane-bar .adv{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#25e0ff,#3ddc97)}
.lane-bar .my{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#25e0ff,#3ddc97);left:50%;border-radius:0 4px 4px 0}
.lane-bar .my.neg{left:auto;right:50%;background:linear-gradient(270deg,#ff4d6d,#ff9d8a);border-radius:4px 0 0 4px}
.lane-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.2)}
.lane-val{width:34px;text-align:right;font-weight:900;font-size:10.5px}

/* ---- live match ---- */
.live-top{padding:10px 14px 12px;background:linear-gradient(180deg,rgba(12,17,30,.98),rgba(12,17,30,.86));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.score{display:flex;align-items:center;justify-content:space-between;gap:6px}
.score .sd{display:flex;align-items:center;gap:7px;min-width:0;flex:1 1 0;overflow:hidden}
.score .sd.right{flex-direction:row-reverse}
.score .sn{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .sk{font-size:22px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;flex:0 0 auto}
.score .mid{text-align:center;flex:0 0 auto;min-width:88px;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.clock{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold);letter-spacing:.02em;white-space:nowrap;line-height:1.15}
.series-score{font-size:9.5px;font-weight:800;color:var(--dim);white-space:nowrap;line-height:1.15}
.series-score{font-size:10px;font-weight:800;color:var(--dim)}
.series-line{text-align:center;font-size:9.5px;color:var(--dim2);font-weight:800;letter-spacing:.1em;margin-top:3px}
.obj-row{display:flex;justify-content:space-between;gap:6px;margin-top:8px}
.obj{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;color:var(--dim2);font-weight:800}
.obj b{font-size:12px;color:var(--txt);font-variant-numeric:tabular-nums}
.obj .oi{font-size:12px;opacity:.9}
.winprob{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;color:var(--dim2)}
.wp-bar{flex:1;height:7px;border-radius:5px;background:rgba(255,77,109,.35);overflow:hidden;position:relative}
.wp-bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#25e0ff,#4d8dff);transition:width .4s ease}
.wp-bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.35)}
.graph-wrap{padding:0 0 2px;position:relative}
canvas#goldCanvas{width:100%;height:132px;display:block}
.feed{padding:0 12px;display:flex;flex-direction:column;gap:6px;min-height:180px;max-height:34dvh;overflow-y:auto}
.ev{font-size:12px;line-height:1.4;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.035);border-left:2px solid var(--line2);animation:fade .2s ease}
.ev b{font-weight:800}
.ev .t{color:var(--gold);font-weight:900;font-size:10.5px;margin-right:5px;font-variant-numeric:tabular-nums}
.ev.blue{border-left-color:var(--cyan);background:rgba(37,224,255,.06)}
.ev.red{border-left-color:var(--red);background:rgba(255,77,109,.06)}
.ev.big{border-left-color:var(--gold);background:rgba(255,201,74,.08);font-weight:700}
.ev.sys{border-left-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05);color:var(--dim);font-size:11px}
.tactic-panel{position:sticky;bottom:var(--tab-h);z-index:25;padding:10px 12px;background:linear-gradient(0deg,rgba(8,11,20,.99),rgba(12,17,30,.94));border-top:1px solid rgba(37,224,255,.3);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.tactic-panel .th{font-size:10.5px;font-weight:900;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.tactic-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tac{text-align:left;padding:9px 10px;border-radius:11px;border:1px solid var(--line2);background:rgba(26,34,56,.9)}
.tac .tn{font-weight:800;font-size:12.5px;display:flex;gap:5px;align-items:center}
.tac .td{font-size:10px;color:var(--dim2);line-height:1.3;margin-top:2px}
.tac:active{transform:scale(.97)}
.tac.on{border-color:var(--cyan);background:rgba(37,224,255,.13)}
.tac:disabled{opacity:.4}
.match-controls{padding:10px 12px;display:flex;gap:8px;align-items:center}
.speed-pill{display:flex;gap:3px;background:rgba(255,255,255,.06);padding:3px;border-radius:9px}
.speed-pill button{padding:5px 9px;border-radius:7px;font-size:11px;font-weight:800;color:var(--dim)}
.speed-pill button.on{background:var(--grad);color:#03121a}

/* ---- result ---- */
.result-hero{text-align:center;padding:22px 14px 14px;position:relative}
.result-hero .rr{font-size:12px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.result-hero .rw{font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1.05;margin:6px 0}
.result-hero .rw.win{background:linear-gradient(120deg,#4df3c0,#25e0ff 60%,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-hero .rw.lose{background:linear-gradient(120deg,#ff8ea0,#ff4d6d);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-hero .rs{font-size:13px;color:var(--dim);font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.stat-box .sl{font-size:9.5px;color:var(--dim2);font-weight:800;letter-spacing:.04em}
.stat-box .sv{font-size:17px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mvp-card{display:flex;align-items:center;gap:11px;padding:11px;border-radius:13px;background:linear-gradient(100deg,rgba(255,201,74,.16),rgba(17,23,40,.7));border:1px solid rgba(255,201,74,.35)}

/* ---- bracket ---- */
.bracket{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.bracket::-webkit-scrollbar{display:none}
.bround{flex:0 0 auto;min-width:132px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.bround .bl{font-size:9.5px;font-weight:900;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;text-align:center}
.bmatch{background:rgba(17,23,40,.9);border:1px solid var(--line);border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:4px;font-size:11px}
.bmatch .bs{display:flex;align-items:center;justify-content:space-between;gap:4px;color:var(--dim);font-weight:700}
.bmatch .bs.win{color:var(--txt);font-weight:900}
.bmatch .bs.me{color:var(--cyan)}
.bmatch .bsc{font-variant-numeric:tabular-nums;font-weight:900}

/* ---- champion screen ---- */
.trophy{padding:34px 16px 10px;text-align:center;position:relative}
.trophy .cup{font-size:72px;line-height:1;filter:drop-shadow(0 10px 30px rgba(255,201,74,.45));animation:cup 3s ease-in-out infinite}
@keyframes cup{50%{transform:translateY(-8px) rotate(-2deg)}}
.trophy h2{font-size:26px;margin-top:10px;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:7px;height:12px;border-radius:2px;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translateY(560px) rotate(420deg);opacity:.1}}

/* ---- misc ---- */
.kv{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--dim)}
.kv b{color:var(--txt);font-weight:800}
.dotsep{color:var(--dim2);opacity:.5}
.pointer{cursor:pointer}
.empty-note{text-align:center;color:var(--dim2);font-size:12px;padding:20px 10px}
.spin-note{font-size:11px;color:var(--dim2);text-align:center}
.tag-row{display:flex;gap:4px;flex-wrap:wrap}
.slide-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.slide-item:last-child{border-bottom:0}
.fa-rank{font-size:11px;font-weight:900;color:var(--dim2);width:18px}
.mini-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:8px;font-weight:900;color:#fff}

/* ===== 2025 upgrade: traits, draft timeline, minimap, worlds, staff ===== */
.grade{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;font-size:9.5px;font-weight:900;letter-spacing:0;color:#0a1220;background:#8b97b5}
.grade.S{background:linear-gradient(145deg,#ffe07a,#ff9e2c);box-shadow:0 0 8px rgba(255,201,74,.45)}
.grade.A{background:linear-gradient(145deg,#9be8ff,#25b7ff)}
.grade.B{background:linear-gradient(145deg,#c9d3e8,#8b97b5)}
.grade.C{background:linear-gradient(145deg,#a0a8bb,#5d6884);color:#0b1220}
.tr{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:6px;font-size:9.5px;font-weight:800;line-height:1.35;border:1px solid transparent;letter-spacing:-.01em}
.tr.good{background:rgba(61,220,151,.11);border-color:rgba(61,220,151,.28);color:#8ff0c4}
.tr.bad{background:rgba(255,77,109,.12);border-color:rgba(255,77,109,.3);color:#ffa2b1}
.tr.staff-g{background:rgba(255,201,74,.12);border-color:rgba(255,201,74,.32);color:#ffdc8f}
.tr.more{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--dim2)}
button.tr{cursor:pointer}
.play-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;color:#bfe9ff;background:linear-gradient(100deg,rgba(37,224,255,.16),rgba(139,92,246,.12));border:1px solid rgba(37,224,255,.28);border-radius:7px;padding:2px 7px}
.warn{color:#ff9aa9!important;font-weight:800}
.draft-timeline{display:flex;gap:3px;align-items:center;overflow-x:auto;scrollbar-width:none}
.draft-timeline::-webkit-scrollbar{display:none}
.dt{flex:1 0 auto;display:grid;place-items:center;min-width:15px;height:19px;border-radius:5px;font-size:8.5px;font-weight:900;background:rgba(255,255,255,.05);color:var(--dim2);border:1px solid var(--line)}
.dt.ban{border-color:rgba(255,77,109,.28);color:#ffb2be}
.dt.pick{border-color:rgba(37,224,255,.25);color:#9fe4ff}
.dt.enemy{opacity:.55}
.dt.done{opacity:.4}
.dt.on{transform:scale(1.18);box-shadow:0 0 0 1px var(--gold),0 0 12px rgba(255,201,74,.45);opacity:1;color:#ffe6a8}
.adv-card{background:linear-gradient(120deg,rgba(37,224,255,.1),rgba(139,92,246,.08));border:1px solid rgba(37,224,255,.28);border-radius:14px;padding:11px 12px}
.adv-top{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.06em;color:#cfe6f5}
.adv-num{font-size:15px;letter-spacing:-.02em}
.adv-num i{font-style:normal;color:var(--dim2);font-size:11px}
.adv-num.up{color:#7cf7ff}.adv-num.down{color:#ff9aa9}
.adv-bar{position:relative;height:8px;border-radius:6px;background:rgba(255,77,109,.3);overflow:hidden;margin-top:7px}
.adv-bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#25e0ff,#8b5cf6);transition:width .35s ease}
.adv-bar>span{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.4)}
.assign-pool{display:flex;gap:5px;flex-wrap:wrap}
.ap{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);width:56px}
.ap img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#131a2b}
.ap span{font-size:8px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ap.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 14px rgba(37,224,255,.3)}
.ap.placed{opacity:.55}
.asg{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.asg.pickable{border-color:rgba(37,224,255,.35);cursor:pointer}
.asg.pickable:active{background:rgba(37,224,255,.1)}
.asg.empty{border-style:dashed;color:var(--dim2)}
.asg-role{font-size:9.5px;font-weight:900;color:var(--dim2);width:26px;flex:0 0 auto}
.asg-champ{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.asg-champ img{width:30px;height:30px;border-radius:7px;object-fit:cover;background:#131a2b}
.asg-champ .ph{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.05);color:var(--dim2);font-weight:900}
.ac-n{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asg-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.fit{font-weight:900;font-size:12px;color:#bfe9ff}
.syn-plus{font-size:9px;font-weight:900;color:#8ff0c4}
.draft-line{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;font-weight:800;color:var(--dim2)}
.draft-line b.up{color:#7cf7ff}.draft-line b.down{color:#ff9aa9}
.map-card{margin:0 12px;border-radius:14px;border:1px solid var(--line);background:rgba(10,15,26,.9);overflow:hidden}
.map-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:10.5px;font-weight:900;letter-spacing:.06em;color:#cfe6f5;background:rgba(37,224,255,.06);border-bottom:1px solid var(--line)}
.map-wrap{position:relative;width:100%;aspect-ratio:1;background:#070d15}
.map-wrap canvas{display:block;width:100%;height:100%}
.map-legend{display:flex;flex-wrap:wrap;gap:8px;padding:6px 10px 8px;font-size:9.5px;font-weight:800;color:var(--dim2)}
.map-legend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
.map-legend .dot.blue{background:#25e0ff;box-shadow:0 0 6px #25e0ff}
.map-legend .dot.red{background:#ff4d6d;box-shadow:0 0 6px #ff4d6d}
.wtable{display:flex;flex-direction:column;gap:2px}
.wrow{display:flex;align-items:center;gap:7px;padding:5px 4px;border-radius:8px;font-size:12px}
.wrow.me{background:rgba(37,224,255,.08)}
.wrow.q{box-shadow:inset 2px 0 0 var(--green)}
.wrow.e{opacity:.5}
.wrow .wn{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .reg{font-style:normal;font-size:8.5px;color:var(--dim2);font-weight:900;margin-left:3px}
.wrow .wl{font-size:10.5px;color:var(--dim);font-weight:800;font-variant-numeric:tabular-nums}
.wmatch{display:flex;gap:6px}
.wm-team{flex:1;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:11.5px;font-weight:800}
.wm-team b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim)}
.wm-team.win{background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.3);color:#c8f7e0}
.wm-team.win b{color:#8ff0c4}
.wm-team.hl{box-shadow:inset 0 0 0 1px rgba(37,224,255,.45)}
.bmatch.live{border-color:rgba(37,224,255,.5);box-shadow:0 0 0 1px rgba(37,224,255,.25)}
.cal{display:flex;flex-direction:column;gap:3px}
.cal-row{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:9px;font-size:11px;color:var(--dim);border:1px solid transparent}
.cal-row.on{background:linear-gradient(90deg,rgba(37,224,255,.14),rgba(139,92,246,.08));border-color:rgba(37,224,255,.35);color:var(--txt)}
.cal-row.done{opacity:.5}
.cal-month{width:52px;flex:0 0 auto;font-size:9.5px;font-weight:900;color:var(--dim2)}
.cal-icon{font-size:13px}
.cal-label{flex:1;font-weight:800;font-size:11.5px;display:flex;flex-direction:column}
.cal-label i{font-style:normal;font-size:9.5px;color:var(--dim2);font-weight:700}
.staff-mini{margin-top:2px}
.staff-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px 10px}
.cure-row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:10.5px}
.cure-bar{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.cure-bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff8a5c,#ffc94a);transition:width .3s}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.ed-grid label,.ed-stats label{display:flex;flex-direction:column;gap:3px;font-size:9.5px;font-weight:800;color:var(--dim2);letter-spacing:.04em}
.ed-grid input,.ed-grid select{background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:700;color:var(--txt);width:100%}
.ed-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.ed-stats label{flex-direction:row;align-items:center;gap:6px}
.ed-stats label .tiny{width:20px;text-align:right;color:var(--txt);font-weight:900}
.ed-stats input[type=range]{flex:1;accent-color:#25e0ff}
.mini-select{background:rgba(255,255,255,.07);border:1px solid var(--line2);border-radius:8px;padding:5px 6px;font-size:10.5px;font-weight:800;color:var(--txt)}
.var-lines{display:flex;flex-direction:column;gap:1px}
.worlds-hero h1{background:linear-gradient(120deg,#ffe6a8,#ffc94a 40%,#ff9e2c);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== objectives · touchline ===== */
.obj-panel{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 4px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.op-side{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.op-side.opp{align-items:flex-end;text-align:right}
.op-team{font-size:9.5px;font-weight:900;color:var(--dim);display:flex;align-items:center;gap:4px;margin-bottom:1px}
.op-row{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--dim)}
.op-row b{color:var(--txt);font-size:11px;font-variant-numeric:tabular-nums}
.op-row .elems{font-style:normal;font-size:9px;letter-spacing:-1px}
.op-row .soul{color:#c4b1ff;font-weight:900;font-size:9.5px;white-space:nowrap}
.op-center{flex:0 0 96px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.next-obj{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:900;color:#ffe6a8}
.next-obj b{font-size:12px;color:var(--gold)}
.next-obj i{font-style:normal;font-size:9px;color:var(--dim)}
.touchline{margin:0 12px;border-radius:14px;border:1px solid rgba(37,224,255,.22);background:linear-gradient(160deg,rgba(16,24,40,.95),rgba(10,15,26,.92));padding:10px}
.tl-head{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:900;letter-spacing:.08em;color:#bfe9ff;margin-bottom:7px}
.stance-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.stance{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 3px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.03);text-align:center}
.stance span{font-size:13px;line-height:1}
.stance b{font-size:10.5px;font-weight:900}
.stance i{font-style:normal;font-size:8.5px;color:var(--dim2);line-height:1.2}
.stance.on{border-color:var(--cyan);background:rgba(37,224,255,.13);box-shadow:0 0 0 1px rgba(37,224,255,.25)}
.stance.on i{color:#b9d9ea}
.tl-sugg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.tl-chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 7px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left}
.tl-chip span{font-size:11px}
.tl-chip b{font-size:10.5px;font-weight:900}
.tl-chip i{font-style:normal;font-size:8.5px;color:var(--dim2);line-height:1.2}
.tl-chip.on{border-color:var(--gold);background:rgba(255,201,74,.12);box-shadow:0 0 0 1px rgba(255,201,74,.25)}
.tl-chip.on i{color:#ffe6a8}
.tl-note{margin-top:6px;text-align:center}
.tl-tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.tl-tabs::-webkit-scrollbar{display:none}
.tl-tab{flex:1 0 auto;padding:6px 8px;border-radius:8px;font-size:10.5px;font-weight:800;color:var(--dim);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tl-tab.on{color:#0a1220;background:var(--grad);border-color:transparent}
.tl-drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:46dvh;overflow:auto}
.tl-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left}
.tl-card .tc-ic{font-size:14px}
.tl-card .tc-n{font-size:11px;font-weight:900}
.tl-card .tc-d{font-size:9px;color:var(--dim2);line-height:1.25}
.tl-card.on{border-color:var(--gold);background:rgba(255,201,74,.12)}
.map-ctrl{display:flex;gap:3px;align-items:center}
.mbtn{padding:2px 6px;border-radius:6px;font-size:9.5px;font-weight:900;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.mbtn.on{background:var(--grad);color:#04121a;border-color:transparent}
.pers-chip{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:900;color:#ffd9a8;background:rgba(255,158,44,.12);border:1px solid rgba(255,158,44,.3);border-radius:6px;padding:2px 6px}
.exp-bar{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.exp-bar>i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#25e0ff)}
.sub-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.sub-role{width:26px;flex:0 0 auto;font-size:9.5px;font-weight:900;color:var(--dim2)}
.sub-cur{flex:0 0 64px;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-row .mini-select{flex:1;min-width:0}
button.pers-chip{cursor:pointer}
.champ-info{margin-top:6px;padding:7px 9px;border-radius:9px;background:rgba(37,224,255,.07);border:1px solid rgba(37,224,255,.18);font-size:10.5px;color:#cfe6f5;line-height:1.4}
.champ-info b{color:#fff}
.sig-line{color:#9fe4ff!important;font-size:9px!important}

/* pick slot size guard (wide tablets / Fold) */
.pick-row .pick-slot{width:100%}
.pick-row .pick-slot img{width:100%;height:auto;max-height:96px;object-fit:cover}
@media(min-width:640px){.pick-row{max-width:560px}.pick-row .pick-slot{max-width:104px}}
.badge.svg{background:none!important;box-shadow:none!important;display:grid;place-items:center}
.badge.svg .tlogo{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}

function _autoSig(c){
  const t=c.tags||{};
  const pick=[];
  if(t.engage>=2) pick.push(['이니시 변수','teamfight']);
  if(t.poke>=2) pick.push(['포킹 견제','poke']);
  if(t.split>=2) pick.push(['사이드 압박','duel']);
  if(t.scale>=4) pick.push(['후반 밸류','scale']);
  if((c.cv&&c.cv[0]>=4)) pick.push(['초반 스노우볼','lane']);
  if((c.cc||0)>=2) pick.push(['확정 CC','grab']);
  const a=pick[0]||['균형형','lane'], b=pick[1]||['상황 대응','lane'];
  return [a[0]+' · '+b[0], (c.r&&c.r.length>1?'여러 라인을 소화하는 플렉스 픽':'한 가지 역할에 특화된 픽'), a[1]];
}
CHAMPS.forEach(c=>{
  const s=CHAMP_SIG[c.n];
  if(s){ c.sig=s[0]; c.sd=s[1]; c.sigK=s[2]||'lane'; }
  else { const a=_autoSig(c); c.sig=a[0]; c.sd=a[1]; c.sigK=a[2]; }
});

/* 이름 기반 결정적 해시 (재접속해도 특성이 바뀌지 않도록) */
function nameHash(s){ let h=2166136261; for(let i=0;i<String(s).length;i++){ h^=String(s).charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seededShuffle(arr,seed){
  const a=arr.slice(); let s=seed||1;
  for(let i=a.length-1;i>0;i--){ s=(Math.imul(s,1103515245)+12345)>>>0; const j=s%(i+1); const t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
/* 포지션에 맞는 특성 풀 */
function traitPoolFor(role, good){
  const base = good?GOOD_TRAITS:BAD_TRAIT_POOL;
  const fit = base.filter(t=>!t.r||t.r.includes(role));
  const rest = base.filter(t=>t.r&&!t.r.includes(role));
  return {fit, rest};
}
/* 등급에 맞춰 특성 배정 (기존 대표 성향은 유지) */
function rollTraits(p, grade){
  const g=grade||p.grade||gradeOfRating(rawOverall(p));
  p.grade=g;
  const cnt=GRADE_COUNT[g]||GRADE_COUNT.B;
  const seed=nameHash(p.name);
  const ov=PLAY_OVERRIDE[p.name];
  const heroId = (ov&&ov[0]&&TRAIT_MAP[ov[0]]) ? ov[0] : (p.playKey&&TRAIT_MAP[p.playKey]?p.playKey:null);
  const gp=traitPoolFor(p.role,true);
  let goodIds=[];
  if(heroId) goodIds.push(heroId);
  const goodCand=seededShuffle(gp.fit.filter(t=>!goodIds.includes(t.id)),seed).concat(seededShuffle(gp.rest,seed+7));
  for(const t of goodCand){ if(goodIds.length>=cnt.good) break; if(!goodIds.includes(t.id)) goodIds.push(t.id); }
  const bp=traitPoolFor(p.role,false);
  const badCand=seededShuffle(bp.fit,seed+13).concat(seededShuffle(bp.rest,seed+29));
  const badIds=badCand.slice(0,cnt.bad).map(t=>t.id);
  p.good=goodIds; p.bad=badIds;
  p.cure={};
  const hero = heroId?TRAIT_MAP[heroId]:(TRAIT_MAP[goodIds[0]]||null);
  p.playKey = hero?hero.id:null;
  p.playName = (ov&&ov[0]===heroId&&ov[1])?ov[1]:(hero?hero.n:'균형형');
  return p;
}
/* 특성 합계 */
function traitIds(p){ return ((p&&p.good)||[]).concat((p&&p.bad)||[]); }
function traitSum(p,key){ let s=0; const ids=traitIds(p); for(const id of ids){ const t=TRAIT_MAP[id]; if(t&&t.e&&t.e[key]) s+=t.e[key]; } return s; }
function traitDefs(p, goodOnly){ const ids=goodOnly===true?(p.good||[]):goodOnly===false?(p.bad||[]):traitIds(p); return ids.map(id=>TRAIT_MAP[id]).filter(Boolean); }
function playOf(p){ return p&&p.playKey?TRAIT_MAP[p.playKey]:null; }
function playName(p){ return (p&&p.playName)||(playOf(p)||{}).n||'균형형'; }
function playIcon(p){ const t=playOf(p); return t?({라인전:'🗡',교전:'⚔️',운영:'🧭',오브젝트:'🐉',멘탈:'🧠',챔프폭:'🎲',시야:'👁',리스크:'🔥'}[t.c]||'✦'):'✦'; }
/* 이름/태그로 특성 찾기 (에디터) */
function findTrait(id){ return TRAIT_MAP[id]||null; }

function rawOverall(p){const s=p.stats;return Math.round(s.lane*.24+s.fight*.26+s.macro*.2+s.pool*.15+s.mental*.15);}
function condMul(p){return clamp(0.86+(p.form/100)*0.2-p.fatigue*0.0013,0.62,1.12);}

/* ---------- playstyle / trait effects ---------- */
function traitChampAffinity(t,c,role){
  const e=t.e||{}; let a=0;
  if(e.lane) a += (c.cv[0]>=4?0.55:0.2);
  if(e.fight) a += (c.tags.fight>=2?0.55:0.15);
  if(e.obj) a += ((c.tags.engage||0)>=2?0.45:0.1);
  if(e.macro) a += ((c.tags.split||0)>=2?0.45:0.12);
  if(e.vision) a += ((role==='SUP'||role==='JGL')?0.45:0.1);
  if(e.pool) a += (c.r.length>1?0.55:0.2);
  if(e.mental) a += 0.15;
  if(e.risk) a -= 0.12;
  return a;
}
/* 특정 챔피언/라인에서 선수 성향이 얼마나 맞는지 (0 ~ +7) */
function styleSynergy(p,c,role){
  if(!p||!c) return 0;
  role=role||p.role;
  const hero=p.playKey?TRAIT_MAP[p.playKey]:null;
  let s=0;
  traitDefs(p,true).forEach(t=>{
    const w = (t===hero)?1.5:0.55;
    s += traitChampAffinity(t,c,role)*w;
  });
  if(!c.r.includes(role)){
    const flexOk=(p.playKey==='joker'||p.playKey==='multiRole'||p.playKey==='flexAce'||p.playKey==='champOcean');
    s += flexOk?2.4:-1.8;
    s += traitSum(p,'pool')*0.45;
  }
  return Math.max(-3, Math.min(7, s));
}
/* 팀 특성 총합 (경기 시뮬레이션용) */
function teamTraitEdge(team){
  const ps=lineupOf(team);
  let fight=0,macro=0,obj=0,vision=0,risk=0,lane=0;
  ps.forEach(p=>{ fight+=traitSum(p,'fight'); macro+=traitSum(p,'macro'); obj+=traitSum(p,'obj');
    vision+=traitSum(p,'vision'); risk+=traitSum(p,'risk'); lane+=traitSum(p,'lane'); });
  return {fight,macro,obj,vision,risk,lane};
}
function champFit(p,c,role){
  role=role||p.role;
  let f=0.96;
  if(!c.r.includes(role)) f-=0.07;
  if(p.role!==role) f-=0.02;
  if(p.sigs.includes(c.n)) f+=0.05;
  f+=(p.stats.pool-72)/900 + traitSum(p,'pool')*0.0015;
  return f;
}
function laneScore(p,c,role){
  if(!p||!c) return 55;
  role=role||p.role;
  let s=(75+(effRating(p)-75)*0.8)*champFit(p,c,role) + clamp((champTier(c)-3)*2,-3,3);
  s += traitSum(p,'lane')*0.7;
  s += (p.sigs.includes(c.n)?1.6:0);
  if(c.sigK==='lane'||c.sigK==='poke') s+=0.4;
  if(c.sigK==='scale'&&role!=='SUP') s+=0.2;
  return s;
}
/* 라인 상성 (내 챔프가 상대 챔프를 얼마나 이기는가) */
function counterScore(a,b){
  if(!a||!b) return 0;
  let s=0;
  s += ((a.tags.poke||0)-(b.tags.engage||0))*0.35;
  s += ((a.tags.engage||0)-(b.tags.poke||0))*0.3;
  s += ((a.cv[0]||3)-(b.cv[0]||3))*0.6;
  s += ((a.cc||0)-(b.cc||0))*0.25;
  s += ((a.f||0)-(b.f||0))*0.2;
  s += (a.d==='AD'&&b.d==='TANK')?0.4:0;
  s += (a.d==='TANK'&&b.d==='AD')?-0.3:0;
  // 챔피언 고유 특징 상성
  const A=a.sigK, B=b.sigK;
  if(A==='grab'&&(b.cc||0)<=1) s+=0.45;
  if(A==='poke'&&(b.tags.engage||0)<=1) s+=0.4;
  if(A==='dive'&&(b.cv[0]||3)<=2) s+=0.35;
  if(A==='duel'&&B==='scale') s+=0.3;
  if(A==='teamfight'&&B==='split') s+=0.3;
  if(A==='turret'&&B!=='duel') s+=0.25;
  if(A==='scale'&&(b.cv[0]||3)>=4) s-=0.35;
  if(A==='pickoff'&&(b.cc||0)>=3) s-=0.3;
  return clamp(s,-2.8,2.8);
}

/* ---------- comp evaluation ---------- */
function evalComp(picks){
  const cs=picks.map(x=>CHAMP_MAP[typeof x==='string'?x:(x&&x.champ)]).filter(Boolean);
  const tags={engage:0,poke:0,fight:0,split:0,scale:0};
  cs.forEach(c=>{for(const k in tags) tags[k]+=c.tags[k];});
  const ad=cs.filter(c=>c.d==='AD').length;
  const ap=cs.filter(c=>c.d==='AP').length;
  const tank=cs.filter(c=>c.d==='TANK').length;
  const front=cs.reduce((a,c)=>a+c.f,0);
  const cc=cs.reduce((a,c)=>a+c.cc,0);
  const curve=[0,0,0];
  cs.forEach(c=>c.cv.forEach((v,i)=>{curve[i]+=v;}));
  const n=Math.max(cs.length,1);
  const curveAvg=curve.map(v=>v/n);
  const tierAvg=cs.reduce((a,c)=>a+champTier(c),0)/n;
  let score=40+(tierAvg-3)*5+tags.fight*0.9+tags.engage*0.75+tags.scale*0.7+tags.poke*0.4+tags.split*0.35;
  const warnings=[],strengths=[];
  if(ad>=4&&ap===0){score-=7;warnings.push('풀 AD 조합 — 상대 방어막 스택에 취약');}
  else if(ap>=4&&ad===0){score-=7;warnings.push('풀 AP 조합 — 상대 마저 스택에 취약');}
  else if(ad>=1&&ap>=1) strengths.push('AD/AP 밸런스 양호');
  if(tank===0&&front<6){score-=5;warnings.push('탱커·프론트라인 부재 — 한타 진형 붕괴 위험');}
  else if(front>=8) strengths.push('든든한 프론트라인');
  if(tags.engage<5){score-=4;warnings.push('이니시 수단 부족');}
  else if(tags.engage>=9) strengths.push('강력한 이니시');
  if(cc<6){score-=3;warnings.push('CC 부족 — 픽오프에 취약');}
  if(curveAvg[2]>=3.7) strengths.push('후반 밸류 최상');
  if(curveAvg[0]>=3.5) strengths.push('초반 스노우볼');
  if(curveAvg[0]<2.4&&curveAvg[2]<3.2) warnings.push('파워 스파이크가 애매함');
  return {ad,ap,tank,front,cc,tags,curve:curveAvg,tierAvg,score:clamp(score,20,96),warnings,strengths,n};
}

  TEAM_DEFS.forEach(def=>{
    const t={id:def.id,name:def.name,tag:def.tag,color:def.color,region:def.region||'LCK',budget:def.budget,tier:def.tier,
      tagline:def.tagline,roster:[],lineup:{},wins:0,losses:0,gw:0,gl:0,form:[],pogTotal:0};
    def.roster.forEach((r,idx)=>{
      const p=mkPlayer(r[0],r[1],r[2],r[3],r[4],r[5],def.id);
      p.starter=idx<5;
      st.players[p.name]=p;
      t.roster.push(p.name);
      if(idx<5) t.lineup[r[1]]=p.name;
    });
    st.teams[def.id]=t;
  });
  // free agents
  FA_DEFS.forEach(r=>{
    const p=mkPlayer(r[0],r[1],r[2],r[3],r[4],r[5],null);
    p.starter=false; p.fa=true; p.fee=Math.round(p.salary*1.7*10)/10;
    st.players[p.name]=p;
  });
  const sb=buildStaff();
  st.staffLib=sb.lib; st.staff=sb.byTeam;
  st.owner={name:'박성수', role:'구단주'};
  st.offseason=null;
  st.schedule=genSchedule(lckIds());
  st.pog=Object.fromEntries(Object.keys(st.players).map(n=>[n,0]));
  S=st;
  applyPatch(0,true);
  return st;
}
function lckIds(){ return TEAM_DEFS.filter(d=>(d.region||'LCK')==='LCK').map(d=>d.id); }

/* ---------- patches ---------- */
function applyPatch(idx, silent){
  const p=PATCHES[idx]; if(!p) return null;
  S.patchIdx=idx;
  p.buffs.forEach(n=>{S.meta.tier[n]=(S.meta.tier[n]||0)+1;});
  p.nerfs.forEach(n=>{S.meta.tier[n]=(S.meta.tier[n]||0)-1;});
  S.meta.obj=p.obj;
  S.patches.push({v:p.v,name:p.name,week:S.week});
  if(!silent) toast('🛠 패치 '+p.v+' 적용 — '+p.name);
  return p;
}

/* ---------- training: 좋은 특성 습득 / 나쁜 특성 극복 ---------- */
function traitLog(text,kind){
  if(!S) return;
  S.trainingLog=S.trainingLog||[];
  S.trainingLog.unshift({week:S.week,season:S.season,text,kind:kind||'t',at:Date.now()});
  if(S.trainingLog.length>40) S.trainingLog.pop();
}
function learnGoodTrait(p,chance){
  if(!p) return false;
  p.good=p.good||[];
  if(p.good.length>=12) return false;
  if(Math.random()>(chance===undefined?0.34:chance)) return false;
  const cand=seededShuffle(traitPoolFor(p.role,true).fit,nameHash(p.name+S.week+Date.now()%97), true)
    .filter(t=>!p.good.includes(t.id));
  const t=cand[0]; if(!t) return false;
  p.good.push(t.id);
  const msg='✨ 훈련 성과 — '+p.name+'이(가) 새 특성 ['+t.n+']을(를) 습득!';
  traitLog(msg,'good'); toast(msg,3200);
  return true;
}
function cureBadTrait(p,points){
  if(!p||!p.bad||!p.bad.length) return false;
  p.cure=p.cure||{};
  const ids=p.bad.slice();
  const target=ids.sort((a,b)=>(p.cure[b]||0)-(p.cure[a]||0))[0];
  p.cure[target]=(p.cure[target]||0)+points;
  if(p.cure[target]>=100){
    const t=TRAIT_MAP[target];
    p.bad=p.bad.filter(x=>x!==target); delete p.cure[target];
    const msg='🎉 훈련으로 나쁜 특성 ['+(t?t.n:target)+'] 극복! — '+p.name;
    traitLog(msg,'cure'); toast(msg,3600);
    return true;
  }
  return false;
}
function gainBadTrait(p,chance){
  if(!p) return false;
  p.bad=p.bad||[];
  if(p.bad.length>=6) return false;
  if(Math.random()>(chance===undefined?0.10:chance)) return false;
  const cand=seededShuffle(traitPoolFor(p.role,false).fit,nameHash(p.name+'bad'+S.week+Date.now()%89))
    .filter(t=>!p.bad.includes(t.id));
  const t=cand[0]; if(!t) return false;
  p.bad.push(t.id);
  const msg='⚠ '+p.name+'에게 나쁜 특성 ['+t.n+']이(가) 생겼습니다 — 훈련으로 극복하세요';
  traitLog(msg,'bad'); toast(msg,3200);
  return true;
}

/* ---------- weekly action ---------- */
function applyWeekAction(){
  if(S.actionApplied) return;
  const t=myTeam(); const act=S.weekAction;
  const starters=lineupOf(t);
  const all=t.roster.map(n=>S.players[n]).filter(Boolean);
  const focus=S.players[S.weekActionTarget]||starters.slice().sort((a,b)=>(b.bad||[]).length-(a.bad||[]).length)[0]||starters[0];
  const sm=staffTrainingMods(t.id);
  if(act==='scrim'){
    const k=1+(sm.scrim||0);
    starters.forEach(p=>{p.form=clamp(p.form+Math.round(ri(1,5)*k),15,100);p.fatigue=clamp(p.fatigue+ri(7,13),0,100);p.stats.macro=clamp(p.stats.macro+(Math.random()<.25?1:0),40,99);});
    // 스크림: 좋은 특성 습득 기회 (낮은 확률, 전원)
    starters.forEach(p=>{ if(Math.random()<0.28*(1+(sm.bloom||0))) learnGoodTrait(p,1); });
    toast('⚔️ 스크림 3일 — 팀 합과 실전 감각이 올라갔습니다');
  }else if(act==='solo'){
    const tg=focus;
    if(tg){
      const key=(sm.lane>0&&Math.random()<0.5)?'lane':pickOf(['lane','fight','pool']);
      tg.stats[key]=clamp(tg.stats[key]+ri(2,3)+((sm.lane||0)>0&&key==='lane'?1:0),40,99);
      tg.form=clamp(tg.form+ri(2,5),15,100); tg.fatigue=clamp(tg.fatigue+ri(4,8),0,100);
      learnGoodTrait(tg,0.45*(1+(sm.bloom||0)));
      cureBadTrait(tg,Math.round(ri(8,16)*(1+(sm.cure||0))));
    }
    starters.filter(p=>p!==tg).forEach(p=>{p.fatigue=clamp(p.fatigue+ri(3,7),0,100);p.form=clamp(p.form-ri(0,2),15,100);});
    toast('🎯 '+(tg?tg.name:'선수')+' 집중 훈련 완료 — 기량이 상승했습니다');
  }else if(act==='macro'){
    starters.forEach(p=>{p.stats.macro=clamp(p.stats.macro+ri(1,3)+((sm.macroC||0)>0?1:0),40,99);p.fatigue=clamp(p.fatigue+ri(5,9),0,100);p.form=clamp(p.form-ri(1,3),15,100);});
    starters.forEach(p=>{ if(Math.random()<0.2*(1+(sm.bloom||0))) learnGoodTrait(p,1); });
    if(focus) cureBadTrait(focus,Math.round(ri(5,10)*(1+(sm.cure||0))));
    toast('🧠 전술·운영 훈련 — 후반 운영 능력이 좋아졌습니다');
  }else if(act==='feedback'){
    all.forEach(p=>{p.form=clamp(p.form+ri(2,6),15,100);p.fatigue=clamp(p.fatigue-ri(4,9),0,100);});
    if(focus){ cureBadTrait(focus,Math.round(ri(24,40)*(1+(sm.cure||0)))); learnGoodTrait(focus,0.3*(1+(sm.bloom||0))); }
    const badOnes=all.filter(p=>(p.bad||[]).length>0);
    badOnes.forEach(p=>{ if(Math.random()<0.35) cureBadTrait(p,ri(4,9)); });
    toast('🧘 멘탈·피드백 — 나쁜 특성 극복 작업을 진행했습니다');
  }else if(act==='rest'){
    all.forEach(p=>{p.fatigue=clamp(p.fatigue-Math.round(ri(14,24)*(1+(sm.condition||0))),0,100);p.form=clamp(p.form+ri(3,8),15,100);});
    toast('😴 전면 휴식 — 컨디션이 크게 회복됐습니다');
  }
  // slump / fatigue / 습관성 악습
  all.forEach(p=>{
    if(p.fatigue>82 && Math.random()<.45){ p.form=clamp(p.form-ri(3,8),10,100); }
    if(p.form<35 && Math.random()<.3){ p.form=clamp(p.form+3,10,100); }
    if(p.fatigue>78 && Math.random()<0.16*(1-(sm.mentalC||0))) gainBadTrait(p,1);
    else if(p.form<45 && Math.random()<0.08*(1-(sm.mentalC||0))) gainBadTrait(p,1);
    p.fatigue=clamp(p.fatigue-2,0,100);
  });
  S.actionApplied=true;
  saveGame(); renderAll();
}

/* ---------- transfer market ---------- */
function freeAgents(){ return Object.values(S.players).filter(p=>p.fa && !p.team); }
function signFA(name, years){
  const p=S.players[name]; if(!p||!p.fa||p.team) return {ok:false,msg:'이미 영입된 선수입니다'};
  const t=myTeam();
  const sm=staffTrainingMods(t.id);
  let fee=p.fee||Math.round(p.salary*1.7*10)/10;
  fee=Math.round(fee*(1-(sm.scout||0))*10)/10;
  if(t.budget<fee) return {ok:false,msg:'예산 부족 (필요 '+fee.toFixed(1)+'억)'};
  if(t.roster.length>=9) return {ok:false,msg:'로스터 정원 초과 (최대 9명)'};
  t.budget=Math.round((t.budget-fee)*10)/10;
  p.team=t.id; p.fa=false; p.contract=Math.max(1,Math.min(3,Number(years)||2));
  t.roster.push(p.name);
  toast('✍️ '+p.name+' 영입 완료 — 이적료 '+fee.toFixed(1)+'억 · '+p.contract+'년 계약');
  saveGame(); renderAll(); return {ok:true};
}
function releasePlayer(name){
  const p=S.players[name]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const t=myTeam();
  if(t.roster.length<=6) return {ok:false,msg:'최소 6명은 유지해야 합니다'};
  const refund=Math.round(p.salary*0.3*10)/10;
  t.roster=t.roster.filter(n=>n!==name);
  Object.keys(t.lineup).forEach(r=>{if(t.lineup[r]===name) delete t.lineup[r];});
  p.team=null; p.fa=false; p.retired=true;
  t.budget=Math.round((t.budget+refund)*10)/10;
  ROLES.forEach(r=>{ if(!t.lineup[r]){ const c=t.roster.map(n=>S.players[n]).find(pp=>pp.role===r); if(c) t.lineup[r]=c.name; }});
  toast('🚪 '+name+' 방출 — '+refund.toFixed(1)+'억 회수');
  saveGame(); renderAll(); return {ok:true};
}
function setSeriesSub(role,name){
  const t=myTeam(); const p=S.players[name]; if(!p||p.team!==t.id) return {ok:false,msg:'우리 팀 선수가 아닙니다'};
  const cur=t.lineup[role];
  if(cur===name) return {ok:false,msg:'이미 해당 라인 선발입니다'};
  const oldRole=Object.keys(t.lineup).find(r=>t.lineup[r]===name);
  if(oldRole) t.lineup[oldRole]=cur;
  t.lineup[role]=name;
  saveGame();
  toast('🔄 '+ROLE_KR[role]+' 교체 — '+name+' 투입');
  return {ok:true};
}
function setStarter(role, name){
  const t=myTeam(); const p=S.players[name]; if(!p) return;
  const prev=t.lineup[role];
  const oldRole=Object.keys(t.lineup).find(r=>t.lineup[r]===name);
  if(oldRole) t.lineup[oldRole]=prev;
  t.lineup[role]=name;
  saveGame(); renderAll();
}

/* ---------- player editor ---------- */
function renamePlayer(oldName,newName){
  newName=String(newName||'').trim();
  if(!newName||newName===oldName) return {ok:true};
  if(S.players[newName]) return {ok:false,msg:'이미 같은 이름의 선수가 있습니다'};
  const p=S.players[oldName]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  const team=p.team?S.teams[p.team]:null;
  delete S.players[oldName];
  p.name=newName;
  S.players[newName]=p;
  if(team){
    team.roster=team.roster.map(n=>n===oldName?newName:n);
    Object.keys(team.lineup).forEach(r=>{ if(team.lineup[r]===oldName) team.lineup[r]=newName; });
  }
  if(S.pog && S.pog[oldName]!==undefined){ S.pog[newName]=S.pog[oldName]; delete S.pog[oldName]; }
  (S.currentSeries&&S.currentSeries.games||[]).forEach(g=>{ if(g.mvp===oldName) g.mvp=newName; });
  return {ok:true};
}
function applyPlayerEdit(oldName, d){
  const p=S.players[oldName]; if(!p) return {ok:false,msg:'선수를 찾을 수 없습니다'};
  if(d.name && d.name!==oldName){
    const r=renamePlayer(oldName,d.name); if(!r.ok) return r;
  }
  p.age=clamp(Number(d.age)||p.age,15,40);
  if(d.role && ROLES.includes(d.role)) p.role=d.role;
  ['lane','fight','macro','pool','mental'].forEach(k=>{ if(d[k]!==undefined) p.stats[k]=clamp(Number(d[k])||p.stats[k],40,99); });
  if(d.contract!==undefined) p.contract=clamp(Number(d.contract)||1,0,3);
  if(Array.isArray(d.persons)){ const arr=d.persons.filter(k=>PERS_MAP[k]).slice(0,3); if(arr.length){ p.persons=arr; p.pers=arr[0]; } }
  else if(d.pers&&PERS_MAP[d.pers]){ p.persons=[d.pers]; p.pers=d.pers; }
  if(d.exp!==undefined) p.exp=clamp(Number(d.exp)||0,0,99);
  if(d.photo!==undefined) p.photo=String(d.photo||'').slice(0,500);
  if(d.grade && GRADE_COUNT[d.grade] && d.grade!==p.grade){ p.grade=d.grade; rollTraits(p,d.grade); }
  if(Array.isArray(d.sigs)) p.sigs=d.sigs.filter(n=>!!CHAMP_MAP[n]).slice(0,6);
  if(Array.isArray(d.good)) p.good=d.good.filter(id=>TRAIT_MAP[id]&&TRAIT_MAP[id].g>0).slice(0,12);
  if(Array.isArray(d.bad)) p.bad=d.bad.filter(id=>TRAIT_MAP[id]&&TRAIT_MAP[id].g<0).slice(0,6);
  p.cure=p.cure||{};
  Object.keys(p.cure).forEach(id=>{ if(!(p.bad||[]).includes(id)) delete p.cure[id]; });
  if(d.playKey&&TRAIT_MAP[d.playKey]&&(p.good||[]).includes(d.playKey)){ p.playKey=d.playKey; p.playName=TRAIT_MAP[d.playKey].n; }
  const t=p.team?S.teams[p.team]:null;
  if(t && t.lineup[p.role]===undefined && Object.values(t.lineup).includes(p.name)){ /* keep */ }
  saveGame();
  return {ok:true};
}


/* ---------- 조합 아키타입 & 상성 카운터 ---------- */
const ARCH_LABEL={dive:'돌진·하드이니시',poke:'포킹·대치',anti:'받아치기·디스인게이지',split:'스플릿',pickoff:'글로벌·픽오프',protect:'보호·뚜벅이',scale:'후반 밸류',skirmish:'교전'};
const CHAMP_SETS={
  antiDash:['뽀삐','탈리야','벡스','카시오페아','아지르','브라움','자야','레나타 글라스크','리산드라'],
  mobility:['리 신','아칼리','르블랑','바이','라칸','암베사','크산테','요네','카밀','이렐리아','야스오','피즈','에코','제드','탈론','카직스','렝가','나피리','제리','아크샨'],
  immobileMelee:['가렌','다리우스','문도 박사','세트','우르곳','일라오이','모데카이저','나서스','트런들','볼리베어','초가스','사이온','신지드','럼블','말파이트','오른','우디르','워윅'],
  rangedBully:['제이스','케넨','나르','베인','바루스','케이틀린','애쉬','미스 포츈','제라스','직스','벨코즈','럭스','퀸'],
  hypercarry:['코그모','징크스','베인','스몰더','아펠리오스','트위치','제리','카이사','자야','이즈리얼','세나'],
  peelSup:['룰루','나미','소라카','잔나','유미','밀리오','카르마','세라핀','모르가나','타릭','브라움','레나타 글라스크'],
  hookSup:['블리츠크랭크','쓰레쉬','노틸러스','파이크','레오나','알리스타','렐','라칸'],
  global:['녹턴','갈리오','트위스티드 페이트','탈리야','쉔','판테온','아우렐리온 솔'],
  artillery:['제라스','직스','벨코즈','럭스','조이','벡스'],
};
function compArchetype(names){
  const cs=names.map(n=>CHAMP_MAP[n]).filter(Boolean);
  const s={dive:0,poke:0,anti:0,split:0,pickoff:0,protect:0,scale:0,skirmish:0};
  cs.forEach(c=>{
    s.dive += (c.tags.engage||0)*1.2 + (c.cc||0)*0.45 + (c.sigK==='dive'?1.6:0);
    s.poke += (c.tags.poke||0)*1.3 + (c.sigK==='poke'?1.6:0) + (c.sigK==='turret'?0.7:0);
    s.anti += (c.cc>=2?0.5:0);
    s.split += (c.tags.split||0)*1.2 + (c.sigK==='duel'?1.6:0);
    s.pickoff += (c.sigK==='pickoff'?1.6:0)+(c.sigK==='grab'?0.6:0);
    s.protect += (c.sigK==='sustain'?1.3:0);
    s.scale += (c.tags.scale||0)*0.8 + (c.sigK==='scale'?1.6:0);
    s.skirmish += (c.tags.fight||0)*0.85;
  });
  names.forEach(n=>{
    if(CHAMP_SETS.antiDash.includes(n)) s.anti+=1.7;
    if(CHAMP_SETS.peelSup.includes(n)) s.protect+=1.5;
    if(CHAMP_SETS.global.includes(n)) s.pickoff+=1.3;
    if(CHAMP_SETS.hypercarry.includes(n)) s.scale+=0.8;
    if(CHAMP_SETS.artillery.includes(n)) s.poke+=0.8;
  });
  const arch=Object.keys(s).sort((a,b)=>s[b]-s[a])[0];
  return {s,arch};
}
function archMatchup(a,b){
  const A=a.arch,B=b.arch; let v=0; const notes=[];
  if(A==='dive'&&B==='poke'){v+=1;notes.push(['good','상대 포킹·대치 조합에 돌진 하드이니시로 정면 돌파']);}
  if(A==='poke'&&(B==='anti'||B==='protect')){v+=1;notes.push(['good','상대 받아치기·보호 조합을 포킹으로 압박']);}
  if(A==='anti'&&B==='dive'){v+=1;notes.push(['good','상대 돌진 조합에 받아치기·디스인게이지로 완벽 카운터']);}
  if(A==='protect'&&B==='dive'){v+=0.6;notes.push(['good','상대 돌진을 보호 조합으로 받아냅니다']);}
  if(A==='split'&&B==='scale'){v+=0.8;notes.push(['good','상대 후반 조합에 스플릿으로 템포 압박']);}
  if(A==='pickoff'&&B==='split'){v+=0.8;notes.push(['good','상대 스플릿에 글로벌·픽오프로 견제']);}
  if(A==='dive'&&B==='anti'){v-=1;notes.push(['bad','상대 받아치기 조합에 돌진이 막힙니다']);}
  if(A==='poke'&&B==='dive'){v-=1;notes.push(['bad','상대 돌진에 포킹 조합이 찢깁니다']);}
  if(A==='scale'&&B==='split'){v-=0.6;notes.push(['bad','상대 스플릿에 후반 밸류를 못 봅니다']);}
  return {v,notes};
}
function kitCounters(myNames,oppNames){
  let v=0; const notes=[];
  const cnt=(arr,names)=>arr.filter(n=>names.includes(n));
  const anti=cnt(CHAMP_SETS.antiDash,myNames), mob=cnt(CHAMP_SETS.mobility,oppNames);
  if(anti.length&&mob.length){ const x=Math.min(2.4,anti.length*mob.length*0.55); v+=x; notes.push(['good',anti.slice(0,2).join('·')+'의 이동기 차단으로 상대 '+mob.slice(0,2).join('·')+' 돌진 봉쇄']); }
  const antiOpp=cnt(CHAMP_SETS.antiDash,oppNames), mobMine=cnt(CHAMP_SETS.mobility,myNames);
  if(antiOpp.length&&mobMine.length){ const x=Math.min(2.4,antiOpp.length*mobMine.length*0.55); v-=x; notes.push(['bad','상대 '+antiOpp.slice(0,2).join('·')+'에게 우리 돌진이 묶입니다']); }
  const bully=cnt(CHAMP_SETS.rangedBully,myNames), jug=cnt(CHAMP_SETS.immobileMelee,oppNames);
  if(bully.length&&jug.length){ const x=Math.min(2.0,bully.length*jug.length*0.45); v+=x; notes.push(['good',bully.slice(0,2).join('·')+' 원거리 견제로 상대 뚜벅이 근접을 압박']); }
  const bullyO=cnt(CHAMP_SETS.rangedBully,oppNames), jugM=cnt(CHAMP_SETS.immobileMelee,myNames);
  if(bullyO.length&&jugM.length){ const x=Math.min(2.0,bullyO.length*jugM.length*0.45); v-=x; notes.push(['bad','상대 원거리 견제에 우리 근접 탑이 고통받습니다']); }
  const peelMy=cnt(CHAMP_SETS.peelSup,myNames), hookOpp=cnt(CHAMP_SETS.hookSup,oppNames);
  if(peelMy.length&&hookOpp.length){ v+=0.8; notes.push(['good',peelMy[0]+' 보호로 상대 '+hookOpp[0]+' 그랩을 무력화']); }
  const peelOpp=cnt(CHAMP_SETS.peelSup,oppNames), hookMy=cnt(CHAMP_SETS.hookSup,myNames);
  if(peelOpp.length&&hookMy.length){ v-=0.8; notes.push(['bad','상대 '+peelOpp[0]+' 보호에 우리 '+hookMy[0]+' 이니시가 지워집니다']); }
  const assassin=cnt(['제드','탈론','카직스','렝가','이블린','나피리','피즈','아칼리','에코'],myNames);
  const carry=cnt(CHAMP_SETS.hypercarry,oppNames);
  if(assassin.length&&carry.length&&!peelOpp.length){ v+=1.2; notes.push(['good','상대 무보호 하이퍼캐리 '+carry[0]+'에게 암살 위협']); }
  const globalMy=cnt(CHAMP_SETS.global,myNames), splitMy=cnt(['피오라','카밀','잭스','트린다미어','요릭','나서스','사이온','이렐리아','케일'],myNames);
  if(globalMy.length&&splitMy.length){ v+=0.9; notes.push(['good',globalMy[0]+' 글로벌 합류로 '+splitMy[0]+' 스플릿 증폭']); }
  return {v,notes};
}

/* ---------- DRAFT (official order + post-draft lane assignment) ---------- */
/* 공식 대회 밴픽 순서: 블루밴1·레드밴1·블루밴2·레드밴2·블루밴3·레드밴3 →
   블루픽1·레드픽1·레드픽2·블루픽2·블루픽3·레드픽3 →
   레드밴4·블루밴4·레드밴5·블루밴5 → 레드픽4·블루픽4·블루픽5·레드픽5 */
const DRAFT_ORDER = [
  {t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},
  {t:'pick',s:'blue'},{t:'pick',s:'red'},{t:'pick',s:'red'},{t:'pick',s:'blue'},{t:'pick',s:'blue'},{t:'pick',s:'red'},
  {t:'ban',s:'red'},{t:'ban',s:'blue'},{t:'ban',s:'red'},{t:'ban',s:'blue'},
  {t:'pick',s:'red'},{t:'pick',s:'blue'},{t:'pick',s:'blue'},{t:'pick',s:'red'},
];

function startDraft(series){
  if(!series) return;
  const oppId=series.oppId, meId=S.userTeam;
  const gameIdx=series.games.length;
  const mySide=series.sides[gameIdx]||'blue';
  D={
    series, gameIdx, mySide, oppId, step:0,
    bans:{blue:[],red:[]}, picks:{blue:[],red:[]},
    phase:'ban', done:false, roleFilter:'ALL',
    locked: series.fearless? series.fearlessUsed.slice():[],
    assign:{me:null,opp:null}, sel:null, result:null,
  };
  if(series.games.length>0){ const b=seriesStaffBonus(S.userTeam); if(b) series.nextEdge=(series.nextEdge||0)+b; }
  D.phase=dPhaseNow();
  renderDraft();
  if(dActor()==='opp') setTimeout(()=>{ if(D&&!D.done) aiDraftAct(); }, 460);
}
function otherSide(s){ return s==='blue'?'red':'blue'; }
function mySideKey(){ return D.mySide; }
function oppSideKey(){ return otherSide(D.mySide); }
function dMyPicks(){ return D.picks[D.mySide]||[]; }
function dOppPicks(){ return D.picks[otherSide(D.mySide)]||[]; }
function dMyBans(){ return D.bans[D.mySide]||[]; }
function dOppBans(){ return D.bans[otherSide(D.mySide)]||[]; }
function dCur(){ return DRAFT_ORDER[D.step]||null; }
function dActor(){ const c=dCur(); if(!c) return null; return c.s===D.mySide?'me':'opp'; }
function dPhaseNow(){ const c=dCur(); return c?c.t:'done'; }
function dUsed(){ return dMyBans().concat(dOppBans(),dMyPicks(),dOppPicks(),D.locked); }
function dAvailable(){ const used=new Set(dUsed()); return CHAMPS.filter(c=>!used.has(c.n)); }
function dBanCount(){ return dMyBans().length; }
function dPickCount(){ return dMyPicks().length; }

/* ---- AI ---- */
function PICK_EVAL_CACHE(picks){
  const cs=picks.map(x=>CHAMP_MAP[typeof x==='string'?x:x.champ]).filter(Boolean);
  return {
    ad:cs.filter(c=>c.d==='AD').length, ap:cs.filter(c=>c.d==='AP').length,
    front:cs.reduce((a,c)=>a+c.f,0), cc:cs.reduce((a,c)=>a+c.cc,0),
    tags:{engage:cs.reduce((a,c)=>a+c.tags.engage,0),fight:cs.reduce((a,c)=>a+c.tags.fight,0)},
  };
}
function aiPickChamp(){
  const avail=dAvailable(); if(!avail.length) return null;
  const opp=T(D.oppId); const players=lineupOf(opp);
  const comp=PICK_EVAL_CACHE(dOppPicks());
  let best=null,bestScore=-1e9;
  avail.forEach(c=>{
    let s=champTier(c)*3.4;
    let bestFit=-9;
    players.forEach(p=>{
      const sc=(laneScore(p,c,p.role)-72)*0.22 + styleSynergy(p,c,p.role)*0.5 + (p.sigs.includes(c.n)?4.2:0);
      if(sc>bestFit) bestFit=sc;
    });
    s+=bestFit;
    const t=c.tags;
    if(comp.ap===0&&c.d==='AP') s+=4.2;
    if(comp.ad===0&&c.d==='AD') s+=4.2;
    if(comp.front<3&&c.f>=2) s+=3.2;
    if(comp.tags.engage<4&&t.engage>=2) s+=3.4;
    if(comp.cc<4&&c.cc>=2) s+=2.4;
    if(c.r.length>1) s+=1.2;
    s+=rnd(-3,3);
    if(s>bestScore){bestScore=s;best=c;}
  });
  return best||avail[0];
}
function aiBanChamp(){
  const avail=dAvailable(); if(!avail.length) return null;
  const me=myTeam();
  let best=null,bs=-1e9;
  avail.forEach(c=>{
    let s=champTier(c)*4.6;
    let sig=0;
    Object.values(me.lineup).forEach(n=>{const p=S.players[n]; if(p&&p.sigs.includes(c.n)) sig+=7;});
    s+=sig;
    if(c.r.some(r=>ROLE_W[r]>=1.05)) s+=2;
    s+=rnd(-4,4);
    if(s>bs){bs=s;best=c;}
  });
  return best||avail[0];
}
function aiDraftAct(){
  if(!D||D.done) return;
  if(dActor()!=='opp') return;
  const cur=dCur(); if(!cur) return;
  if(cur.t==='ban'){
    const c=aiBanChamp(); if(!c) return;
    D.bans[otherSide(D.mySide)].push(c.n);
  }else{
    const c=aiPickChamp(); if(!c) return;
    D.picks[otherSide(D.mySide)].push(c.n);
  }
  advanceDraft();
}

/* ---- user actions ---- */
function draftMyBan(name){
  if(!D||D.done) return;
  const cur=dCur(); if(!cur||cur.t!=='ban'||dActor()!=='me') return;
  const c=CHAMP_MAP[name]; if(!c||dUsed().includes(name)) return;
  D.bans[D.mySide].push(name);
  advanceDraft();
}
function draftMyPick(name){
  if(!D||D.done) return;
  const cur=dCur(); if(!cur||cur.t!=='pick'||dActor()!=='me') return;
  const c=CHAMP_MAP[name]; if(!c||dUsed().includes(name)) return;
  D.picks[D.mySide].push(name);
  advanceDraft();
}
function advanceDraft(){
  D.step++;
  if(D.step>=DRAFT_ORDER.length){ enterAssign(); return; }
  D.phase=dPhaseNow();
  renderDraft();
  if(dActor()==='opp') setTimeout(()=>{ if(D&&!D.done) aiDraftAct(); }, 420);
}

/* ---- 포스트 드래프트 라인 배정 ---- */
function assignOptions(){ return ROLES.slice(); }
function assignScoreFor(p, champName, role){
  const c=CHAMP_MAP[champName]; if(!p||!c) return -999;
  let s=laneScore(p,c,role);
  s += styleSynergy(p,c,role)*1.1;
  if(p.role===role) s+=6;
  if(p.role!==role) s-=14;
  if(c.r[0]===role) s+=5;
  else if(c.r.includes(role)) s+=2.5;
  else s-=28;                       // 자연 포지션이 아닌 챔피언은 크게 감점
  if(p.sigs.includes(champName)) s+=3;
  // 플렉스/조커 성향만 오프롤 소화 가능
  const flex=(p.playKey==='joker'||p.playKey==='multiRole'||p.playKey==='flexAce'||p.playKey==='champOcean');
  if(!c.r.includes(role)&&flex) s+=16;
  return s;
}
function bestAssign(champNames, team){
  const players=ROLES.map(r=>S.players[team.lineup[r]]);
  const names=champNames.slice();
  let best=null, bestScore=-1e9;
  const perm=(arr,used,acc)=>{
    if(acc.length===5){
      let sc=0;
      ROLES.forEach((r,i)=>{ sc+=assignScoreFor(players[i],acc[i],r); });
      if(sc>bestScore){bestScore=sc;best=acc.slice();}
      return;
    }
    for(let i=0;i<arr.length;i++){
      if(used[i]) continue;
      used[i]=true; acc.push(arr[i]); perm(arr,used,acc); acc.pop(); used[i]=false;
    }
  };
  perm(names,new Array(names.length).fill(false),[]);
  const out={}; ROLES.forEach((r,i)=>{ out[r]=best?best[i]:(names[i]||null); });
  return out;
}
function aiAssign(champNames, teamId){ return bestAssign(champNames, T(teamId)); }
function recommendAssign(champNames){ return bestAssign(champNames, myTeam()); }

function enterAssign(){
  D.phase='assign';
  D.assign={ opp: aiAssign(dOppPicks(), D.oppId), me: recommendAssign(dMyPicks()) };
  D.result=evalDraft();
  renderDraft();
  saveGame();
}
function swapAssign(role, champName){
  if(!D||D.phase!=='assign') return;
  const a=D.assign.me;
  const prevRole=ROLES.find(r=>a[r]===champName);
  const prevChamp=a[role];
  if(prevRole) a[prevRole]=prevChamp;
  a[role]=champName;
  D.result=evalDraft();
  renderDraft();
}
function setAssign(role, champName){
  if(!D) return;
  if(D.assign&&D.assign.me) swapAssign(role,champName);
}
function confirmAssign(){
  if(!D) return;
  D.phase='done'; D.done=true; D.result=evalDraft(); D.sel=null;
  saveGame(); renderDraft();
}

/* ---- draft evaluation: 밴픽 우세도 ---- */
function assignedFor(sideKey){
  if(D&&D.assign&&D.assign[sideKey]) return D.assign[sideKey];
  if(sideKey==='me') return recommendAssign(dMyPicks());
  return aiAssign(dOppPicks(), D.oppId);
}
function evalDraft(){
  if(!D) return null;
  const me=T(S.userTeam), opp=T(D.oppId);
  const myA=assignedFor('me'), opA=assignedFor('opp');
  const lane={};
  let myStyle=0, opStyle=0;
  ROLES.forEach(r=>{
    const mp=S.players[me.lineup[r]], op=S.players[opp.lineup[r]];
    const mc=myA[r]?CHAMP_MAP[myA[r]]:null, oc=opA[r]?CHAMP_MAP[opA[r]]:null;
    const myBase=mp&&mc?laneScore(mp,mc,r):60;
    const opBase=op&&oc?laneScore(op,oc,r):60;
    const mySyn=mc?styleSynergy(mp,mc,r):0;
    const opSyn=oc?styleSynergy(op,oc,r):0;
    const ct=(mc&&oc)?counterScore(mc,oc):0;
    myStyle+=mySyn; opStyle+=opSyn;
    lane[r]={my:myBase+mySyn*0.9+ct*0.8, opp:opBase+opSyn*0.9-ct*0.8, counter:ct,
      myChamp:mc?mc.n:'', oppChamp:oc?oc.n:'', myPlayer:mp?mp.name:'', oppPlayer:op?op.name:'',
      myRole:mp?mp.role:'', oppRole:op?op.role:'', mySyn, opSyn};
  });
  const myComp=evalComp(dMyPicks()), oppComp=evalComp(dOppPicks());
  let laneAdv=0; ROLES.forEach(r=>{laneAdv+=(lane[r].my-lane[r].opp);}); laneAdv=laneAdv/5/2.5;
  // 사이드 보너스 (블루 1픽 우선권 / 레드 카운터픽)
  let sideBonus=0;
  if(D.mySide==='blue'){ sideBonus+=0.8; if(dMyPicks()[0]&&champTier(dMyPicks()[0])>=4) sideBonus+=0.9; }
  else { sideBonus+=0.8; const opFirst=dOppPicks()[0]; if(opFirst&&champTier(opFirst)>=4) sideBonus-=0.5; }
  const myArch=compArchetype(dMyPicks()), opArch=compArchetype(dOppPicks());
  const am=archMatchup(myArch,opArch);
  const kc=kitCounters(dMyPicks(),dOppPicks());
  const feedback=[...am.notes,...kc.notes];
  const compDiff=myComp.score-oppComp.score;
  const styleDiff=myStyle-opStyle;
  const myStaff=staffDraftBonus(S.userTeam), opStaff=staffDraftBonus(D.oppId);
  const staffDiff=myStaff-opStaff;
  const raw=compDiff*0.5 + laneAdv*2.6 + styleDiff*0.35 + sideBonus + staffDiff + am.v*2.4 + kc.v*0.9;
  const myPct=clamp(Math.round((50+raw*0.9)*10)/10,18,82);
  return {lane, myComp, oppComp, laneAdv, sideBonus, compDiff, styleDiff, staffDiff, myStaff, opStaff,
    myScore:myComp.score+laneAdv+styleDiff*0.4, oppScore:oppComp.score-laneAdv-styleDiff*0.4,
    myPct, oppPct:Math.round((100-myPct)*10)/10, assign:{me:myA,opp:opA}, myStyle, opStyle,
    arch:{me:myArch,opp:opArch,label:ARCH_LABEL}, archV:am.v, kitV:kc.v, feedback,
    staff:{me:staffAll(S.userTeam).map(st=>({name:st.name,role:st.role,rating:st.rating,traits:st.traits.slice()})),
           opp:staffAll(D.oppId).map(st=>({name:st.name,role:st.role,rating:st.rating,traits:st.traits.slice()}))}};
}

  const extra=seededShuffle(pool, (Date.now()%99991)+(S.week||1));
  const buffs=[...theme.focus, ...extra.slice(0,Math.max(0,7-theme.focus.length))].slice(0,8);

function liveTacticEdge(){
  if(!M) return 0;
  const fo=M.focusKey?FOCUS_MAP[M.focusKey]:null;
  const st=M.stance?STANCE_MAP[M.stance]:null;
  let e=0;
  if(fo) e+=(fo.edge||0);
  if(st) e+=(st.edge||0);
  if(fo){
    ROLES.forEach(r=>{
      const p=playerAt('me',r); if(!p) return;
      const cats=playCats(p);
      if(fo.mm==='top'&&r==='TOP'&&cats.includes('운영')) e+=0.02;
      if(fo.mm==='bot'&&(r==='ADC'||r==='SUP')&&cats.includes('교전')) e+=0.02;
      if((M.focusKey==='split131'||M.focusKey==='split14')&&cats.includes('운영')) e+=0.015;
      if(M.focusKey==='baronBush'&&cats.includes('시야')) e+=0.02;
      if(M.focusKey==='force'&&cats.includes('교전')) e+=0.02;
      if(M.focusKey==='obj'&&cats.includes('오브젝트')) e+=0.02;
    });
  }
  return clamp(e,-0.3,0.4);
}
function setStance(k){
  if(!M||M.over||!STANCE_MAP[k]) return;
  M.stance=k; M.stanceAt=M.minute; M.tacticEdge=liveTacticEdge();
  logEvent('sys','🎯 교전 성향 → '+STANCE_MAP[k].n+' ('+STANCE_MAP[k].d+')');
  renderMatch();
}
function setFocus(k){
  if(!M||M.over) return;
  M.focusKey=(M.focusKey===k?null:(FOCUS_MAP[k]?k:null));
  M.focusAt=M.minute; M.tacticEdge=liveTacticEdge();
  logEvent('sys','📋 집중 전술 → '+(M.focusKey?FOCUS_MAP[M.focusKey].n:'해제'));
  renderMatch();
}

function startMatch(draftResult){
  if(!draftResult||!D) return;
  const me=T(S.userTeam), opp=T(D.oppId);
  const mySide=draftResult.mySide||D.mySide;
  const lane=draftResult.lane;
  const myA=draftResult.assign.me, opA=draftResult.assign.opp;
  const gp=S.gameplan||{jungle:'mid',laneSwap:false,firstObj:'grub',dive:false};
  const myPower=teamPower(me), oppPower=teamPower(opp);
  const myTrait=teamTraitEdge(me), opTrait=teamTraitEdge(opp);
  const myCoach=staffMatchEdge(S.userTeam), opCoach=staffMatchEdge(D.oppId);
  const chemMe=teamChemistry(me), chemOp=teamChemistry(opp);
  const fitMe=coachFit(S.userTeam), fitOp=coachFit(D.oppId);
  const myPct=draftResult.myPct;
  const draftLogit=clamp((myPct-50)*0.034,-1.15,1.15);
  let edge=(myPower-oppPower)*0.9;
  const styleEdge=((myTrait.fight-opTrait.fight)*0.012 + (myTrait.obj-opTrait.obj)*0.012 + (myTrait.macro-opTrait.macro)*0.01 + (myTrait.vision-opTrait.vision)*0.008);
  if(gp.jungle==='top'){ edge+=(lane.TOP.my-lane.TOP.opp)*0.08; }
  if(gp.jungle==='bot'){ edge+=(lane.ADC.my-lane.ADC.opp)*0.08; }
  if(gp.laneSwap){ const botGap=lane.ADC.my-lane.ADC.opp; if(botGap<0) edge+=-botGap*0.14; edge-=0.4; }
  if(gp.dive) edge+=0.5;
  edge += (S.seriesMomentum||0) + ((S.currentSeries&&S.currentSeries.nextEdge)||0);
  if(myPower<oppPower) edge += (myCoach.underdog||0)*1.4;
  edge += (chemMe-chemOp)*0.35 + (fitMe-fitOp)*0.8;
  const ace=lineupOf(me).slice().sort((a,b)=>rawOverall(b)-rawOverall(a))[0];
  if(ace) edge += (myCoach.star||0)*(ace.form-70)*0.02;
  M={
    minute:0, gold:[0,0], kills:[0,0], towers:[0,0], dragons:[0,0], grubs:[0,0], barons:[0,0], heralds:[0,0],
    dragonElems:{me:[],opp:[]}, soulType:{me:null,opp:null}, soulGranted:{me:false,opp:false},
    elderAt:null, elder:{me:false,opp:false}, elderUntil:{me:0,opp:0}, elderCount:[0,0],
    fights:[0,0], vision:[0,0], events:[], over:false, running:false, speed:1,
    edge, styleEdge:(styleEdge+(myCoach.order||0)*0.5-(opCoach.order||0)*0.5),
    draftLogit, draftPct:myPct, powerEdge:(myPower-oppPower)*0.9,
    coach:{me:myCoach,opp:opCoach}, earlyEdge:((myCoach.early||0)-(opCoach.early||0)),
    chem:{me:chemMe,opp:chemOp}, coachFit:{me:fitMe,opp:fitOp},
    mySide, oppId:opp.id, oppName:opp.name, myName:me.name,
    myComp:draftResult.myComp, oppComp:draftResult.oppComp, arch:draftResult.arch,
    lane, gp, stance:'standard', focusKey:null, stanceAt:0, focusAt:0,
    history:[], winProb:0.5, series:D.series, gameIdx:D.gameIdx,
    trait:{me:myTrait,opp:opTrait}, assign:{me:myA,opp:opA},
    lineups:{
      me:ROLES.map(r=>({role:r,name:(S.players[me.lineup[r]]||{}).name||'',champ:myA[r]||'',p:(S.players[me.lineup[r]]||{}).name||''})),
      opp:ROLES.map(r=>({role:r,name:(S.players[opp.lineup[r]]||{}).name||'',champ:opA[r]||'',p:(S.players[opp.lineup[r]]||{}).name||''}))
    },
    mvp:null, needTactic:false, pending:null, startStyle:myPct,
  };
  M.tacticEdge=liveTacticEdge();
  M.winProb=winProb();
  M.history.push({min:0,diff:0});
  logEvent('sys','밴픽 완료 — '+me.name+' vs '+opp.name+', '+ (mySide==='blue'?'블루':'레드') +' 사이드');
  logEvent('sys','밴픽 우세도 '+myPct.toFixed(0)+'% : '+(100-myPct).toFixed(0)+'% · 상대 조합: '+dOppPicks().join(' · '));
  renderMatch(); startTimer();
}
function startTimer(){
  stopTimer();
  TIMER=setInterval(()=>{ if(!M||M.over||!M.running) return; tick(); }, 620);
