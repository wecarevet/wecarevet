}
function mmObjectiveWindow(m){
  for(const kind in OBJ_TIMES){ if(OBJ_TIMES[kind].some(t=>m>=t-1&&m<=t+1)) return kind; }
  return null;
}
function mmUpdatePhase(){
  const m=M.minute;
  if(MM.focusUntil>m){ MM.phase='fight'; MM.phaseLabel='한타 교전'; return MM.focus; }
  const win=mmObjectiveWindow(m);
  if(win){ MM.phase='obj'; MM.phaseLabel=(win==='dragon'?'드래곤':win==='baron'?'바론':'공허 유충')+' 교전'; return PIT[win]; }
  if(m>=25){ MM.phase='late'; MM.phaseLabel='후반 운영'; return null; }
  MM.phase='lane'; MM.phaseLabel='라인전'; return null;
}
function mmComputeTargets(){
  if(!M) return;
  const m=M.minute;
  const focus=mmUpdatePhase();
  const objWin=mmObjectiveWindow(m);
  const fk=M.focusKey||null, fe=fk?FOCUS_MAP[fk]:null;
  const mmB=(fe&&fe.mm)||null;
  const soulSide=M.soulGranted&&(M.soulGranted.me||M.soulGranted.opp);
  const dragonPit=PIT.dragon, baronPit=PIT.baron;
  const enemyPit=(m>=20||soulSide)?baronPit:dragonPit;
  const groupPt=(m>=20||soulSide)?[0.40,0.34]:[0.56,0.62];
  const ownSide=s=>s==='me'?-1:1;
  ROLES.forEach(role=>{
    ['me','opp'].forEach(side=>{
      const k=mmTokenKey(side,role);
      const sgn=ownSide(side);
      let base;
      if(role==='JGL'){
        const camps=CAMPS[side];
        base=camps[Math.floor(m/2)%camps.length];
        if(m<12 && m%3===0){
          const gl=['TOP','MID','ADC'][Math.floor((m/3+(side==='me'?0:1))%3)];
          const lp=LANE_POS[gl][side];
          base=[lp[0]+(sgn*-0.035), lp[1]];
        }
        if(objWin) base=PIT[objWin==='dragon'?'dragon':'baron'];
      }else if(role==='SUP'&&m>=8&&m%4===0){
        const lp=LANE_POS['MID'][side];
        base=[lp[0]+(sgn*-0.05), lp[1]+0.04];
      }else{
        base=LANE_POS[role][side];
        if(m>=22) base=[base[0]+(sgn*-0.05), base[1]+(sgn*-0.03)];
      }
      // ---- 전술에 따른 포지셔닝 ----
      let tx=base[0], ty=base[1];
      const lane=role==='ADC'?LANE_POS.ADC[side]:role==='TOP'?LANE_POS.TOP[side]:role==='MID'?LANE_POS.MID[side]:null;
      switch(mmB){
        case 'top': if(role==='TOP'){ tx=lane[0]; ty=lane[1]; } else if(role==='JGL'){ tx=lane[0]+(sgn*-0.02); ty=lane[1]+0.05; } break;
        case 'diveBot': if(role==='ADC'||role==='SUP'){ tx=LANE_POS.ADC[side][0]+(sgn*-0.02); ty=LANE_POS.ADC[side][1]; } else if(role==='JGL'||role==='MID'){ tx=LANE_POS.ADC[side][0]+(sgn*-0.06); ty=LANE_POS.ADC[side][1]-0.03; } break;
        case 'mid': if(role==='MID'||role==='JGL'){ tx=0.5+(sgn*-0.06); ty=0.5; } break;
        case 'invade': if(role==='JGL'){ const ep=CAMPS[side==='me'?'opp':'me'][2]; tx=ep[0]; ty=ep[1]; } break;
        case 'hold': if(role==='JGL'){ tx=0.5+(sgn*-0.12); ty=0.5+(sgn*-0.06); } break;
        case 'freeze': if(role==='TOP'||role==='MID'||role==='ADC'){ tx=base[0]+(sgn*-0.05); ty=base[1]; } break;
        case 'siege': if(role==='TOP'){ tx=LANE_POS.TOP[side][0]+(sgn*-0.08); ty=LANE_POS.TOP[side][1]; } else { tx=0.5+(sgn*-0.14); ty=0.5+(sgn*-0.05); } break;
        case 'push3': tx=base[0]+(sgn*-0.12); ty=base[1]; break;
        case 'split': if(role==='TOP'){ tx=0.78; ty=0.22; } else if(role==='MID'){ tx=0.22; ty=0.78; } else { tx=0.5+(sgn*-0.04); ty=0.5; } break;
        case 'split14': if(role==='TOP'){ tx=0.2; ty=0.2; } else { tx=0.62; ty=0.86; } break;
        case 'cross': tx=enemyPit[0]+(sgn*-0.04); ty=enemyPit[1]; break;
        case 'bush': tx=groupPt[0]+(sgn*-0.05); ty=groupPt[1]+(sgn*-0.03); break;
        case 'group': tx=groupPt[0]+(sgn*-0.04); ty=groupPt[1]; break;
        case 'flank': if(role==='TOP'){ tx=0.22; ty=0.30; } else { tx=0.46+(sgn*-0.03); ty=0.52; } break;
        case 'backdoor': if(role==='TOP'){ tx=0.84; ty=0.16; } else if(role==='MID'){ tx=0.78; ty=0.2; } else { tx=0.60; ty=0.40; } break;
        case 'assassin': if(role==='MID'||role==='JGL'){ const ap=LANE_POS.ADC[side==='me'?'opp':'me']; tx=ap[0]+(sgn*-0.04); ty=ap[1]-0.04; } break;
        case 'poke': tx=0.48+(sgn*-0.06); ty=0.52+(sgn*-0.02); break;
        case 'safe': tx=base[0]+(sgn*-0.09); ty=base[1]+(sgn*-0.06); break;
        case 'swap': if(role==='ADC'||role==='SUP'){ tx=LANE_POS.TOP[side][0]; ty=LANE_POS.TOP[side][1]+0.03; } else if(role==='TOP'){ tx=LANE_POS.ADC[side][0]+(sgn*-0.04); ty=LANE_POS.ADC[side][1]; } break;
      }
      if(focus){
        const w={JGL:0.85,SUP:0.78,MID:0.6,TOP:0.45,ADC:0.5}[role]||0.5;
        tx=tx*(1-w)+focus[0]*w; ty=ty*(1-w)+focus[1]*w;
      }
      // 스탠스: 공격적이면 적진 쪽, 수비적이면 아군 쪽
      const st=M.stance;
      if(st==='aggro'){ tx+=sgn*-0.03; ty+=sgn*-0.02; }
      if(st==='defensive'){ tx+=sgn*-0.02; ty+=sgn*-0.01; }
      MM.tgt[k]={x:Math.max(0.04,Math.min(0.96,tx)),y:Math.max(0.04,Math.min(0.96,ty))};
    });
  });
}
/* ---------- 이벤트 동기화 (매 게임 분) ---------- */
function mmAddFx(o){ o.at=performance.now(); MM.fx.push(o); if(MM.fx.length>40) MM.fx.shift(); }
function mmSync(){
  if(!M) return;
  const key=(M.series?(M.series.startedAt||0):0)+'-'+M.gameIdx;
  if(!MM.init||MM.key!==key){ MM.key=key; mmReset(); mmJumpTargets(); }
  mmJumpTargets();
  mmComputeTargets();
  // 킬 → 사망/리스폰
  ['me','opp'].forEach(side=>{
    const idx=side==='me'?0:1;
    const cur=M.kills[idx]||0, prev=MM.last.kills[idx]||0;
    if(cur>prev){
      const victim=side==='me'?'opp':'me';
      for(let i=0;i<Math.min(cur-prev,2);i++){
        const cands=ROLES.map(r=>mmTokenKey(victim,r)).filter(k=>MM.units[k]&&MM.units[k].alive);
        const k=cands.length?cands[Math.floor(Math.random()*cands.length)]:null;
        if(k){
          const u=MM.units[k];
          mmAddFx({type:'burst',x:u.x,y:u.y,col:SIDE_COL[side],life:900,label:'KILL'});
          mmAddFx({type:'flash',x:u.x,y:u.y,life:520});
          u.alive=false; u.hp=0; u.deadUntil=performance.now()+4200;
        }
      }
    }
  });
  MM.last.kills=(M.kills||[0,0]).slice();
  // 타워 파괴 → 잔해 + 레이저
  ['me','opp'].forEach(side=>{
    const idx=side==='me'?0:1;
    const cur=M.towers[idx]||0, prev=MM.last.towers[idx]||0;
    if(cur>prev){
      const enemy=side==='me'?'opp':'me';
      for(let i=prev;i<cur;i++){
        const ti=MM.towerIdx[enemy]||0;
        const tp=MAP_TOWERS[enemy][Math.min(ti,8)];
        MM.marks.push({x:tp[0],y:tp[1],type:'tower',side:enemy,at:M.minute});
        mmAddFx({type:'laser',x1:tp[0],y1:tp[1],x2:tp[0]+(enemy==='opp'?-0.05:0.05),y2:tp[1]+0.03,col:SIDE_COL[side],life:700});
        mmAddFx({type:'burst',x:tp[0],y:tp[1],col:'#ffc94a',life:900,label:'TOWER'});
        MM.towerIdx[enemy]=ti+1;
      }
    }
  });
  MM.last.towers=(M.towers||[0,0]).slice();
  [['dragons','dragon'],['barons','baron'],['grubs','grub']].forEach(([kk,kind])=>{
    const tot=(M[kk][0]||0)+(M[kk][1]||0);
    const prev=(MM.last[kk][0]||0)+(MM.last[kk][1]||0);
    if(tot>prev){
      const side=(M[kk][0]||0)>(MM.last[kk][0]||0)?'me':'opp';
      const pit=PIT[kind];
      MM.marks.push({x:pit[0],y:pit[1],type:kind,side,at:M.minute});
      mmAddFx({type:'ring',x:pit[0],y:pit[1],col:'#ffc94a',life:1100,r:0.06});
      mmAddFx({type:'burst',x:pit[0],y:pit[1],col:'#ffc94a',life:1100,label:kind==='dragon'?'DRAGON':kind==='baron'?'BARON':'GRUB'});
    }
    MM.last[kk]=M[kk].slice();
  });
  // 한타
  const ft=(M.fights[0]||0)+(M.fights[1]||0), fprev=(MM.last.fights[0]||0)+(MM.last.fights[1]||0);
  if(ft>fprev){
    const lane=['TOP','MID','ADC'][Math.floor(Math.random()*3)];
    const side=Math.random()<0.5?'me':'opp';
    const lp=LANE_POS[lane][side];
    MM.focus=[lp[0],lp[1]]; MM.focusUntil=M.minute+2;
    mmAddFx({type:'ring',x:lp[0],y:lp[1],col:'#ffc94a',life:1200,r:0.05});
    mmAddFx({type:'burst',x:lp[0],y:lp[1],col:'#ffc94a',life:1200,label:'FIGHT'});
  }
  MM.last.fights=(M.fights||[0,0]).slice();
  // 미니언 웨이브
  if(!MM.minions.length) mmSpawnWave();
}
/* ---------- 미니언 ---------- */
function mmPathPoint(pts,t){
  let total=0; const segs=[];
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    segs.push(d); total+=d;
  }
  let target=Math.max(0,Math.min(1,t))*total;
  for(let i=0;i<segs.length;i++){
    if(target<=segs[i]||i===segs.length-1){
      const f=segs[i]?target/segs[i]:0;
      return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];
    }
    target-=segs[i];
  }
  return pts[pts.length-1];
}
function mmSpawnWave(){
  MM.minions=[];
  ['TOP','MID','BOT'].forEach(lane=>{
    ['me','opp'].forEach(side=>{
      for(let i=0;i<3;i++){
        MM.minions.push({lane,side,t:side==='me'?0.02+i*0.012:0.98-i*0.012,
          hp:30,alive:true,off:(Math.random()-0.5)*0.014,spd:0.012+Math.random()*0.004});
      }
    });
  });
  MM.waveAt=performance.now();
}
/* ---------- 발사체 · 이펙트 ---------- */
function mmSpawnProjectile(){
  const alive=Object.keys(MM.units).filter(k=>MM.units[k].alive);
  if(alive.length<2) return null;
  const a=MM.units[alive[Math.floor(Math.random()*alive.length)]];
  const enemies=alive.filter(k=>MM.units[k].side!==a.side).map(k=>MM.units[k]);
  if(!enemies.length) return null;
  enemies.sort((x,y)=>Math.hypot(x.x-a.x,x.y-a.y)-Math.hypot(y.x-a.y,y.y-a.y));
  const b=enemies[0];
  const dist=Math.hypot(b.x-a.x,b.y-a.y);
  if(dist>0.3) return null;
  const skill=Math.random()<0.35;
  MM.proj.push({x:a.x,y:a.y,tx:b.x,ty:b.y,side:a.side,kind:skill?'skill':'auto',
    spd:skill?0.9:0.55,col:a.side==='me'?'#7cf7ff':'#ff9aa9',life:0,target:b,skill});
  return true;
}
/* ---------- 메인 루프 ---------- */
function mmStart(){
  if(MM.started) return;
  MM.started=true; MM.lastTs=0;
  const loop=(ts)=>{
    if(!MM.started) return;
    MM.rafId=requestAnimationFrame(loop);
    const dt=MM.lastTs?Math.min(64,ts-MM.lastTs):16; MM.lastTs=ts;
    mmUpdate(dt);
    mmDraw(dt);
  };
  MM.rafId=requestAnimationFrame(loop);
}
function mmStop(){
  MM.started=false;
  if(MM.rafId){ cancelAnimationFrame(MM.rafId); MM.rafId=null; }
}
function mmUpdate(dt){
  if(!M) return;
  const now=performance.now();
  const paused=!M.running&&!M.over;
  const step=paused?0:Math.min(dt,64)/1000;
  MM.t+=step;
  // 유닛 이동 (속도 기반 → 순간이동 없음)
  Object.keys(MM.units).forEach(k=>{
    const u=MM.units[k], t=MM.tgt[k]||u;
    if(!u.alive){
      if(now>u.deadUntil){
        const fountain=u.side==='me'?[0.10,0.90]:[0.90,0.10];
        u.x=fountain[0]; u.y=fountain[1]; u.hp=u.hpMax; u.alive=true;
      }else return;
    }
    const dx=t.x-u.x, dy=t.y-u.y, d=Math.hypot(dx,dy);
    const spd=u.step*(u.role==='JGL'?1.15:1);
    let desired=[0,0];
    if(d>0.004){ desired=[dx/d*spd, dy/d*spd]; }
    // 아군/적군 근접 시 카이팅 (밀고 물러나기)
    const en=Object.values(MM.units).filter(o=>o.side!==u.side&&o.alive);
    let near=null,nd=9;
    en.forEach(o=>{ const dd=Math.hypot(o.x-u.x,o.y-u.y); if(dd<nd){nd=dd;near=o;} });
    if(near&&nd<0.14){
      const away=[(u.x-near.x)/nd*0.02,(u.y-near.y)/nd*0.02];
      const wob=Math.sin(now/380+k.length)*0.02;
      desired=[desired[0]*0.55+away[0]+wob*0.3, desired[1]*0.55+away[1]+Math.cos(now/420)*0.01];
      if(Math.random()<0.02) mmAddFx({type:'spark',x:u.x,y:u.y,life:300});
    }
    u.vx+=(desired[0]-u.vx)*Math.min(1,dt/90);
    u.vy+=(desired[1]-u.vy)*Math.min(1,dt/90);
    u.x=Math.max(0.03,Math.min(0.97,u.x+u.vx*step));
    u.y=Math.max(0.03,Math.min(0.97,u.y+u.vy*step));
    // 체력 재생
    if(u.alive) u.hp=Math.min(u.hpMax,u.hp+step*3.5);
  });
  // 미니언
  if(now-MM.waveAt>26000) mmSpawnWave();
  MM.minions.forEach(mn=>{
    if(!mn.alive) return;
    const dir=mn.side==='me'?1:-1;
    const clash=Math.abs(mn.t-0.5)<0.07;
    if(!clash) mn.t=Math.max(0,Math.min(1,mn.t+dir*mn.spd*step*60));
    if(Math.random()<0.004) mmAddFx({type:'spark',x:mmPathPoint(LANE_PATH[mn.lane],mn.t)[0],y:mmPathPoint(LANE_PATH[mn.lane],mn.t)[1],life:220});
  });
  // 발사체 생성
  if(Math.random()<step*2.4) mmSpawnProjectile();
  // 발사체 이동
  for(let i=MM.proj.length-1;i>=0;i--){
    const p=MM.proj[i];
    if(p.target&&p.target.alive){ p.tx=p.target.x; p.ty=p.target.y; }
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
    if(d<0.008||p.life>2.2){
      MM.proj.splice(i,1);
      mmAddFx({type:'hit',x:p.tx,y:p.ty,life:260,col:p.col});
      if(p.target&&p.target.alive){
        p.target.hp=Math.max(26,p.target.hp-(p.skill?6:3));
        if(p.skill) mmAddFx({type:'ring',x:p.tx,y:p.ty,col:p.col,life:420,r:0.03});
      }
      continue;
    }
    p.x+=dx/d*p.spd*step*60*0.016*60/3;
    p.y+=dy/d*p.spd*step*60*0.016*60/3;
    p.life+=step;
  }
  // fx 수명
  MM.fx=MM.fx.filter(f=>now-f.at<(f.life||600));
}
function mmDraw(dt){
  const cv=document.getElementById('riftCanvas');
  if(!cv||!M) return;
  const wrap=cv.parentElement;
  const cssW=Math.round((wrap?wrap.clientWidth:cv.clientWidth)||320);
  const cssH=cssW;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(cssW*dpr)||cv.height!==Math.round(cssH*dpr)){
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    cv.style.height=cssH+'px';
  }
  const ctx=cv.getContext('2d'); if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=cssW,h=cssH;
  const now=performance.now();
  // 배경
  const bg=ctx.createRadialGradient(w*0.3,h*0.7,10,w*0.5,h*0.5,w*0.9);
  bg.addColorStop(0,'#0d1a24'); bg.addColorStop(1,'#070d15');
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
  // 정글
  ctx.fillStyle='rgba(28,64,52,.5)';
  ctx.beginPath(); ctx.moveTo(w*0.06,h*0.06); ctx.lineTo(w*0.5,h*0.5); ctx.lineTo(w*0.5,h*0.94); ctx.lineTo(w*0.06,h*0.94); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(52,36,64,.45)';
  ctx.beginPath(); ctx.moveTo(w*0.94,h*0.06); ctx.lineTo(w*0.94,h*0.94); ctx.lineTo(w*0.5,h*0.5); ctx.lineTo(w*0.5,h*0.06); ctx.closePath(); ctx.fill();
  // 강
  ctx.strokeStyle='rgba(37,120,200,.28)'; ctx.lineWidth=Math.max(18,w*0.085); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(w*0.16,h*0.16); ctx.quadraticCurveTo(w*0.5,h*0.5,w*0.84,h*0.84); ctx.stroke();
  ctx.strokeStyle='rgba(80,190,255,.12)'; ctx.lineWidth=Math.max(7,w*0.035);
  ctx.beginPath(); ctx.moveTo(w*0.16,h*0.16); ctx.quadraticCurveTo(w*0.5,h*0.5,w*0.84,h*0.84); ctx.stroke();
  // 라인
  const drawLane=(pts,width)=>{
    ctx.beginPath();
    pts.forEach(([x,y],i)=>{ i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h); });
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=width+4; ctx.stroke();
    ctx.beginPath();
    pts.forEach(([x,y],i)=>{ i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h); });
    ctx.strokeStyle='rgba(150,170,200,.16)'; ctx.lineWidth=width; ctx.stroke();
  };
  drawLane(LANE_PATH.TOP,6); drawLane(LANE_PATH.MID,6.5); drawLane(LANE_PATH.BOT,6);
  // 기지
  const drawBase=(x,y,col)=>{
    ctx.beginPath(); ctx.arc(x*w,y*h,Math.max(9,w*0.037),0,7);
    ctx.fillStyle=col; ctx.globalAlpha=.9; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.4; ctx.stroke();
  };
  drawBase(0.09,0.91,'#1d7fbf'); drawBase(0.91,0.09,'#b8304a');
  // 오브젝트 핏
  const soulActive=M.soulGranted&&(M.soulGranted.me||M.soulGranted.opp);
  const elderActive=M.elderAt&&M.minute>=M.elderAt;
  const pitIcon=(kind,icon)=>kind==='dragon'?(soulActive?'💠':icon):kind==='baron'&&elderActive?'🐲':icon;
  const pitCol=(kind,col)=>kind==='dragon'?(soulActive?'#b98cff':col):kind==='baron'&&elderActive?'#ff5c9a':col;
  [['dragon',0.70,0.72,'🐉','#ff8a5c'],['baron',0.30,0.28,'👁','#b98cff'],['grub',0.28,0.32,'🪱','#ffc94a']].forEach(([kind,x,y,icon0,col0])=>{
    const icon=pitIcon(kind,icon0), col=pitCol(kind,col0);
    const dead=MM.marks.some(mk=>mk.type===kind&&(M.minute-mk.at)<4);
    ctx.beginPath(); ctx.arc(x*w,y*h,Math.max(8,w*0.032),0,7);
    ctx.fillStyle=dead?'rgba(70,80,100,.5)':'rgba(20,30,44,.9)'; ctx.fill();
    ctx.strokeStyle=dead?'rgba(120,130,150,.45)':col+'cc'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.font=`${Math.round(w*0.032)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=dead?0.3:0.95; ctx.fillStyle='#fff'; ctx.fillText(icon,x*w,y*h); ctx.globalAlpha=1;
  });
  // 타워 & 잔해
  const drawTower=(x,y,side,destroyed)=>{
    ctx.save(); ctx.translate(x*w,y*h);
    if(destroyed){
      ctx.strokeStyle='rgba(160,170,190,.45)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-3,-3); ctx.lineTo(3,3); ctx.moveTo(3,-3); ctx.lineTo(-3,3); ctx.stroke();
    }else{
      ctx.fillStyle=side==='me'?'#3aa8e0':'#e0566f';
      ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(3.2,2.6); ctx.lineTo(-3.2,2.6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=.7; ctx.stroke();
    }
    ctx.restore();
  };
  MAP_TOWERS.me.forEach((tp,i)=>drawTower(tp[0],tp[1],'me',i<(MM.towerIdx.me||0)));
  MAP_TOWERS.opp.forEach((tp,i)=>drawTower(tp[0],tp[1],'opp',i<(MM.towerIdx.opp||0)));
  // 미니언
  MM.minions.forEach(mn=>{
    if(!mn.alive) return;
    const p=mmPathPoint(LANE_PATH[mn.lane],mn.t);
    const x=(p[0]+mn.off)*w, y=(p[1]+mn.off)*h;
    ctx.beginPath(); ctx.arc(x,y,Math.max(1.6,w*0.007),0,7);
    ctx.fillStyle=mn.side==='me'?'rgba(80,200,255,.85)':'rgba(255,120,140,.85)'; ctx.fill();
  });
  // 발사체
  MM.proj.forEach(p=>{
    const x=p.x*w,y=p.y*h;
    ctx.beginPath(); ctx.arc(x,y,p.skill?3:1.8,0,7);
    ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
    if(p.skill){
      ctx.strokeStyle=p.col+'66'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.lineTo(x+(p.tx-p.x)*w*0.35,y+(p.ty-p.y)*h*0.35); ctx.stroke();
    }
  });
  // 챔피언
  ROLES.forEach(role=>{
    ['me','opp'].forEach(side=>{
      const k=mmTokenKey(side,role), u=MM.units[k]; if(!u) return;
      const line=M.lineups?lineupAt(side,role):null;
      const champ=(line&&line.champ)||ROLE_KR[role];
      const x=u.x*w, y=u.y*h;
      const r=Math.max(6,w*0.026);
      const col=SIDE_COL[side];
      if(!u.alive){
        const f=side==='me'?[0.10,0.90]:[0.90,0.10];
        const fx=f[0]*w, fy=f[1]*h;
        ctx.globalAlpha=.35;
        ctx.beginPath(); ctx.arc(fx,fy,r,0,7); ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.stroke();
        ctx.fillStyle=col; ctx.font=`900 ${Math.round(r*0.8)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(Math.ceil((u.deadUntil-now)/1000)+'',fx,fy);
        ctx.globalAlpha=1;
        return;
      }
      const glow=ctx.createRadialGradient(x,y,1,x,y,r*2.3);
      glow.addColorStop(0,col+'88'); glow.addColorStop(1,col+'00');
      ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(x,y,r*2.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(x,y,r,0,7);
      ctx.fillStyle=side==='me'?'#0d3a52':'#4a1420'; ctx.fill();
      ctx.lineWidth=1.8; ctx.strokeStyle=col; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font=`900 ${Math.round(r*0.92)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText((champ||'?').slice(0,1),x,y+0.5);
      // HP 바
      const bw=Math.max(14,r*2.1), bh=2.6;
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x-bw/2,y-r-6,bw,bh);
      const hp=Math.max(0,Math.min(1,u.hp/u.hpMax));
      ctx.fillStyle=hp>0.55?'#3ddc97':hp>0.28?'#ffc94a':'#ff4d6d';
      ctx.fillRect(x-bw/2,y-r-6,bw*hp,bh);
    });
  });
  // 이펙트
  MM.fx=MM.fx.filter(f=>now-f.at<(f.life||600));
  MM.fx.forEach(f=>{
    const age=(now-f.at)/(f.life||600);
    ctx.globalAlpha=Math.max(0,1-age);
    const x=f.x!=null?f.x*w:0, y=f.y!=null?f.y*h:0;
    if(f.type==='burst'){
      ctx.strokeStyle=f.col||'#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,y,6+age*Math.max(16,w*0.07),0,7); ctx.stroke();
      if(f.label){ ctx.fillStyle=f.col||'#fff'; ctx.font=`900 ${Math.round(w*0.025)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(f.label,x,y-10-age*8); }
    }else if(f.type==='ring'){
      ctx.strokeStyle=f.col||'#fff'; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(x,y,(f.r||0.04)*w*(0.4+age*2.6),0,7); ctx.stroke();
    }else if(f.type==='hit'){
      ctx.fillStyle=f.col||'#fff';
      for(let i=0;i<3;i++){ const a=(i/3)*6.28; ctx.beginPath(); ctx.arc(x+Math.cos(a)*age*8,y+Math.sin(a)*age*8,1.6,0,7); ctx.fill(); }
    }else if(f.type==='spark'){
      ctx.fillStyle='rgba(255,240,180,.9)'; ctx.beginPath(); ctx.arc(x,y,1.8,0,7); ctx.fill();
    }else if(f.type==='flash'){
      ctx.fillStyle='rgba(255,230,120,.85)';
      ctx.beginPath(); ctx.arc(x,y,(1-age)*Math.max(8,w*0.03),0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.4;
      for(let i=0;i<4;i++){ const a=i/4*6.28+f.at; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*w*0.04,y+Math.sin(a)*h*0.04); ctx.stroke(); }
    }else if(f.type==='laser'){
      ctx.strokeStyle=f.col||'#fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(f.x1*w,f.y1*h); ctx.lineTo(f.x2*w,f.y2*h); ctx.stroke();
    }
    ctx.globalAlpha=1;
  });
  // HUD
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(6,6,Math.max(96,w*0.4),18);
  ctx.fillStyle=MM.phase==='fight'?'#ffc94a':MM.phase==='obj'?'#ff9e2c':'#8bd6ff';
  ctx.font=`900 ${Math.round(w*0.028)}px sans-serif`;
  ctx.fillText(MM.phaseLabel+" · "+M.minute+"'",12,10);
  ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(w-76,6,70,18);
  ctx.fillStyle='#9fb2cc'; ctx.font=`800 ${Math.round(w*0.024)}px sans-serif`; ctx.textAlign='right';
  ctx.fillText(M.kills[0]+' : '+M.kills[1],w-12,10);
  ctx.textAlign='left';
  if(M.soulGranted&&(M.soulGranted.me||M.soulGranted.opp)){
    const str='💠 '+(M.soulGranted.me?myTeam().tag:T(M.oppId).tag);
    ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(6,26,Math.max(60,w*0.2),15);
    ctx.fillStyle='#c4b1ff'; ctx.font=`800 ${Math.round(w*0.022)}px sans-serif`;
    ctx.fillText(str,11,28);
  }
}

      <div class="stat-box"><div class="sl">킬</div><div class="sv">${M.kills[0]}<span style="font-size:11px;color:var(--dim2)"> : ${M.kills[1]}</span></div></div>
      <div class="stat-box"><div class="sl">골드 차</div><div class="sv" style="color:${gd>0?'var(--cyan)':'var(--red)'}">${gd>0?'+':''}${(gd/1000).toFixed(1)}K</div></div>
      <div class="stat-box"><div class="sl">밴픽 우세도</div><div class="sv" style="font-size:13px">${(g.myPct||50).toFixed(0)}%</div></div>
    </div>
    <div class="card">
      <div class="card-h"><h4>경기 분석</h4><span class="k">${meWon?'WIN':'LOSS'}</span></div>
      <div class="stack" style="gap:5px">
        ${ana.reasons.slice(0,7).map(r=>`<div class="kv"><span>${r.v>0?'✓':'⚠'} ${esc(r.txt)}</span></div>`).join('')||'<div class="tiny">특이사항 없음</div>'}
      </div>
      <div class="divider"></div>
      <div class="row between"><span class="tiny">우리 조합 밸류</span><span class="tiny"><b>${Math.round(g.myComp?g.myComp.score:0)}</b> vs ${Math.round(g.oppComp?g.oppComp.score:0)}</span></div>
      <div class="row between" style="margin-top:4px"><span class="tiny">파워 스파이크(초/중/후)</span><span class="tiny">${g.myComp?g.myComp.curve.map(v=>v.toFixed(1)).join(' / '):'-'}</span></div>
      ${g.assign?`<div class="row between" style="margin-top:4px"><span class="tiny">라인 배정</span><span class="tiny">${ROLES.map(r=>ROLE_KR[r]+' '+esc(g.assign.me[r]||'-')).join(' · ')}</span></div>`:''}
    </div>

      <div class="tiny">${esc(g.mvpChamp||'')} ${esc(meWon?'승리를 이끌었습니다':'분전했습니다')}</div></div>
      <div class="chip gold">+${meWon?100:60} POG</div>

      <div class="card">
        <div class="card-h"><h4>시리즈 결과</h4><span class="k">${s.games.length}세트</span></div>
        ${s.games.map((g2,i)=>`<div class="slide-item"><div class="fa-rank">${i+1}</div><div class="grow"><div style="font-size:12px;font-weight:800">${g2.win?'승리':'패배'} · ${g2.minute}분</div><div class="tiny">${g2.mvp||''} · 밴픽 ${(g2.myPct||50).toFixed(0)}%</div></div><span class="chip sm ${g2.win?'green':'red'}">${g2.kills[0]}:${g2.kills[1]}</span></div>`).join('')}

        <div class="stack" style="gap:6px">
          <button class="btn sm block ${s.coach&&s.coach.applied==='mental'?'primary':''}" data-coach="mental" ${s.coach&&s.coach.applied?'disabled':''}>🧘 멘탈 케어 — 전원 컨디션 회복</button>
          <button class="btn sm block ${s.coach&&s.coach.applied==='tactic'?'primary':''}" data-coach="tactic" ${s.coach&&s.coach.applied?'disabled':''}>📐 전술 수정 — 다음 세트 초반 설계 보정</button>
          <button class="btn sm block ${s.coach&&s.coach.applied==='sub'?'primary':''}" data-coach="sub" ${s.coach&&s.coach.applied?'disabled':''}>🔄 식스맨 교체 — 부진 선수 교체</button>
        </div>
      </div>
      <button class="btn gold block" id="nextSetBtn">다음 세트 준비 →</button>
    `}
    <div style="height:12px"></div>`;
  const v=$('view-series');
  v.querySelectorAll('[data-coach]').forEach(b=>b.onclick=()=>applyCoaching(b.dataset.coach));
  v.querySelectorAll('[data-setgo]').forEach(b=>b.onclick=()=>{
    const role=b.dataset.setgo; const sel=v.querySelector('[data-setrole="'+role+'"]');
    if(sel){ const r=setSeriesSub(role,sel.value); if(r&&!r.ok) toast(r.msg); else renderSeriesResult(); }
  });
  const fb=$('finishSeriesBtn'); if(fb) fb.onclick=()=>{ finishSeries(); };
  const nb=$('nextSetBtn'); if(nb) nb.onclick=()=>nextSeriesGame();
  show('series');
  window.scrollTo(0,0);
}

function playoffAction(){
  const um=nextUserPlayoffMatch();
  if(um){
    const oppId=um.m.a===S.userTeam?um.m.b:um.m.a;
    const s=createSeries(oppId,5,'playoff',{match:um.m,roundName:um.rd.name});
    saveGame();
    startDraft(s);
    return;
  }
  const r=playoffNext();
  if(r.action==='done'){
    if(S.phase==='worlds'){ renderWorlds(); return; }
    renderChampion(); return;
  }
  if(r.action==='user'){
    const oppId=r.match.a===S.userTeam?r.match.b:r.match.a;

    saveGame(); startDraft(s); return;
  }
  renderPlayoffs(); toast('다른 경기 결과가 반영됐습니다');
}
function renderAfterSeries(){
  if(S.phase==='end'){ renderChampion(); return; }
  if(S.phase==='worlds'){ renderWorlds(); return; }
  if(S.phase==='playoffs'){ renderPlayoffs(); return; }
  TAB='home'; renderHub();
}

function teamStar(t){
  const ps=ROLES.map(r=>S.players[t.lineup[r]]).filter(Boolean);
  const s=ps.sort((a,b)=>rawOverall(b)-rawOverall(a))[0];
  return s? s.name+' · '+playName(s):'';
}
function worldsAction(){
  const r=worldsNext();
  if(r.action==='user'){
    const s=worldsSeries(r.match,r.roundName);
    saveGame();
    startDraft(s);
    return;
  }
  if(r.action==='done'){ renderChampion(); return; }
  renderWorlds();
  if(r.action==='advanced') toast('다음 라운드로 진행합니다');
}
function worldsSimAll(){
  let guard=0;
  while(!S.worlds.done && guard++<80){
    const W=S.worlds;
    let rd=null;
    if(W.stage==='swiss') rd=W.rounds[W.rounds.length-1];
    else if(W.bracket) rd=W.bracket.rounds[W.bracket.round];
    if(!rd) break;
    let any=false;
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b){ simWorldsMatch(m); any=true; } });
    if(!any) break;
    if(W.stage==='swiss') worldsCloseRound();
    else { const ar=worldsAdvanceBracket(); if(ar.action==='done') break; }
  }
  saveGame();
  if(S.phase==='end') renderChampion(); else renderWorlds();
}

    <div style="height:14px"></div>`;
  $('toTitle').onclick=()=>{ S=null; renderTitle(); };
  $('toOffseason').onclick=()=>{ startOffseason(); };
  show('champion');
}

/* ---------- offseason (스토브리그) ---------- */
function renderOffseason(){
  const O=S.offseason||{players:[],staff:[]};
  const t=myTeam();
  const expPlayers=(O.players||[]).map(n=>S.players[n]).filter(Boolean);
  const expStaff=(O.staff||[]).map(id=>S.staffLib[id]).filter(Boolean);
  $('view-offseason').innerHTML=`
    <div class="hero" style="padding:20px 16px 6px">
      <div class="kicker">OFFSEASON · STOVE LEAGUE</div>
      <h1 style="font-size:26px">스토브리그</h1>
      <p>계약이 만료된 선수·코치를 재계약하거나 FA로 보내세요.<br>결정하지 않으면 자동으로 FA가 됩니다.</p>
      <div class="row" style="justify-content:center;gap:6px;margin-top:8px">
        <span class="chip gold">예산 ${t.budget.toFixed(1)}억</span>
        <span class="chip">${S.season}시즌 종료</span>
      </div>
    </div>
    <div class="section-title"><h3>계약 만료 선수</h3><div class="line"></div><span class="tiny">${expPlayers.length}명</span></div>
    ${expPlayers.length?`<div class="stack">${expPlayers.map(p=>`
      <div class="staff-card">
        <div class="row between">
          <div class="row" style="gap:8px">
            <div class="p-avatar">${esc(p.name.slice(0,1))}</div>
            <div><div style="font-weight:900;font-size:14px">${esc(p.name)} <span class="role-tag">${ROLE_KR[p.role]}</span><span class="grade ${p.grade}">${p.grade}</span></div>
            <div class="tiny">${p.age}세 · ${rawOverall(p)} · 연봉 ${p.salary}억 · ${esc(playName(p))}</div></div>
          </div>
          <div class="row" style="gap:4px">
            <select class="mini-select" data-py="${esc(p.name)}"><option value="1">1년</option><option value="2" selected>2년</option><option value="3">3년</option></select>
            <button class="btn sm primary" data-signp="${esc(p.name)}">재계약</button>
            <button class="btn sm danger" data-fap="${esc(p.name)}">FA</button>
          </div>
        </div>
        <div class="tag-row" style="margin-top:5px">${(p.good||[]).slice(0,4).map(id=>{const tr=TRAIT_MAP[id];return tr?`<span class="tr good">${esc(tr.n)}</span>`:'';}).join('')}${(p.bad||[]).slice(0,2).map(id=>{const tr=TRAIT_MAP[id];return tr?`<span class="tr bad">${esc(tr.n)}</span>`:'';}).join('')}</div>
      </div>`).join('')}</div>`:'<div class="card"><div class="empty-note">만료되는 선수가 없습니다</div></div>'}
    <div class="section-title"><h3>계약 만료 스태프</h3><div class="line"></div><span class="tiny">${expStaff.length}명</span></div>
    ${expStaff.length?`<div class="stack">${expStaff.map(st=>`
      <div class="staff-card">
        <div class="row between">
          <div class="row" style="gap:8px"><span class="chip gold">${staffRoleLabel(st.role)}</span>
            <div><div style="font-weight:900;font-size:14px">${esc(st.name)}</div><div class="tiny">연봉 ${st.salary}억 · ${(st.traits||[]).map(id=>STAFF_TRAITS[id]&&STAFF_TRAITS[id].n).filter(Boolean).join(' · ')}</div></div>
          </div>
          <div class="row" style="gap:4px">
            <select class="mini-select" data-sy="${st.id}"><option value="1">1시즌</option><option value="2" selected>2시즌</option></select>
            <button class="btn sm primary" data-signs="${st.id}">재계약</button>
          </div>
        </div>
      </div>`).join('')}</div>`:'<div class="card"><div class="empty-note">만료되는 스태프가 없습니다</div></div>'}
    <div class="card tight">
      <div class="tiny">남은 만료자를 처리하면 다음 시즌이 시작됩니다. FA가 된 선수는 이적시장에서 다시 영입할 수 있습니다.</div>
    </div>
    <button class="btn primary block" id="startNextSeason">${S.season+1}시즌 시작 →</button>
    <div style="height:14px"></div>`;
  const v=$('view-offseason');
  v.querySelectorAll('[data-signp]').forEach(b=>b.onclick=()=>{
    const sel=v.querySelector('[data-py="'+b.dataset.signp.replace(/"/g,'\\"')+'"]');
    const r=reSignPlayer(b.dataset.signp, sel?Number(sel.value):2); if(!r.ok) toast(r.msg);
  });
  v.querySelectorAll('[data-fap]').forEach(b=>b.onclick=()=>{ if(confirm(b.dataset.fap+' 선수를 FA로 보낼까요?')){ const r=releaseExpiringPlayer(b.dataset.fap); if(!r.ok) toast(r.msg); } });
  v.querySelectorAll('[data-signs]').forEach(b=>b.onclick=()=>{
    const sel=v.querySelector('[data-sy="'+b.dataset.signs+'"]');
    const r=offseasonRenewStaff(b.dataset.signs, sel?Number(sel.value):2); if(!r.ok) toast(r.msg);
  });
  $('startNextSeason').onclick=()=>{ finishOffseason(); toast('새 시즌이 시작됩니다'); };
  show('offseason');
}


/* ---------- MSI / EWC ---------- */
function intlBracketHTML(tour){
  return `<div class="bracket">
    ${tour.bracket.rounds.map((r,ri)=>`<div class="bround">
      <div class="bl">${esc(r.name)} · ${esc(r.month)}</div>
      ${r.matches.map(m=>`<div class="bmatch ${tour.bracket.round===ri&&!m.done?'live':''}">
        <div class="bs ${m.done&&m.winner===m.a?'win':''} ${m.a===S.userTeam?'me':''}">${m.a?badge(T(m.a),'sm')+'<span>'+esc(T(m.a).tag)+'</span>':'<span>TBD</span>'}<span class="bsc">${m.done?m.sa:'—'}</span></div>
        <div class="bs ${m.done&&m.winner===m.b?'win':''} ${m.b===S.userTeam?'me':''}">${m.b?badge(T(m.b),'sm')+'<span>'+esc(T(m.b).tag)+'</span>':'<span>TBD</span>'}<span class="bsc">${m.done?m.sb:'—'}</span></div>
      </div>`).join('')}
    </div>`).join('')}
  </div>`;
}
function intlUserMatch(tour){
  const rd=tour.bracket.rounds[tour.bracket.round];
  return rd.matches.find(m=>!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam));
}
function renderIntl(){
  const tour=intlNow();
  if(!tour){ renderAll(); return; }
  const rd=tour.bracket.rounds[tour.bracket.round];
  const mine=intlUserMatch(tour);
  const isMSI=tour.kind==='msi';
  $('view-intl').innerHTML=`
    <div class="hero worlds-hero" style="padding:18px 14px 6px">
      <div class="kicker">${isMSI?'MID-SEASON INVITATIONAL':'ESPORTS WORLD CUP'} · ${tour.month}</div>
      <h1 style="font-size:26px">${isMSI?'MSI':'EWC'}</h1>
      <p>${esc(tour.name)} · 8팀 초청 · Bo${tour.bo}</p>
      <div class="row" style="justify-content:center;gap:6px;margin-top:8px">
        <span class="chip sm">${tour.teams.map(id=>esc(T(id).tag)).join(' · ')}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h4>토너먼트</h4><span class="k">${esc(rd.name)} · ${rd.matches.filter(m=>m.done).length}/${rd.matches.length}</span></div>
      ${intlBracketHTML(tour)}
    </div>
    ${tour.done?`
      <div class="card glow" style="border-color:rgba(255,201,74,.45)">
        <div class="row between"><div><div class="tiny">${isMSI?'MSI 우승':'EWC 우승'}</div><div style="font-weight:900;font-size:18px;color:var(--gold)">${esc(T(tour.champion).name)}</div></div>${badge(T(tour.champion),'lg')}</div>
        <div class="row between" style="margin-top:6px"><span class="tiny">준우승</span><b style="font-size:12px">${esc(T(tour.runnerUp).name)}</b></div>
        ${isMSI?'<div class="tiny" style="margin-top:6px">MSI 우승 팀이 LCK 소속이면 롤드컵 시드 보너스가 주어집니다</div>':''}
      </div>
      <button class="btn primary block" id="intlNext">${isMSI?'서머 시즌 시작 →':'서머 재개 →'}</button>
    `:`
      ${mine?`<div class="card" style="border-color:rgba(37,224,255,.5)">
        <div class="card-h"><h4>${esc(rd.name)} · 우리 경기</h4><span class="k">Bo${mine.bo||tour.bo}</span></div>
        <div class="row between" style="margin-bottom:10px">
          <div class="row" style="gap:7px">${badge(myTeam())}<b>${esc(myTeam().tag)}</b></div>
          <span class="chip sm">VS</span>
          <div class="row" style="gap:7px"><b>${esc(T(mine.a===S.userTeam?mine.b:mine.a).tag)}</b>${badge(T(mine.a===S.userTeam?mine.b:mine.a))}</div>
        </div>
        <button class="btn primary block" id="intlPlay">경기 시작 · 밴픽</button>
      </div>`:`
      <div class="card">
        <div class="card-h"><h4>${tour.userIn?'다음 경기':'관전 모드'}</h4><span class="k">${tour.month}</span></div>
        <div class="tiny" style="margin-bottom:10px">${tour.userIn?'다른 경기를 시뮬레이션하고 다음 라운드로 진행합니다.':'우리 팀은 초청되지 않았습니다. 대회를 관전하세요.'}</div>
        <button class="btn primary block" id="intlPlay">경기 진행</button>
        <button class="btn sm block" id="intlSim" style="margin-top:6px">대회 전체 자동 진행 ⏩</button>
      </div>`}
    `}
    <div class="card">
      <div class="card-h"><h4>참가팀</h4><span class="k">8팀</span></div>
      <div class="stack" style="gap:3px">${tour.teams.map(id=>{const t=T(id);return `<div class="kv"><span>${badge(t,'sm')} ${esc(t.name)} <i class="tiny">${esc(t.region)}</i></span><b style="font-size:11px">${esc(teamStar(t))}</b></div>`;}).join('')}</div>
    </div>
    <div style="height:10px"></div>`;
  const p1=$('intlPlay'); if(p1) p1.onclick=()=>intlAction();
  const p2=$('intlNext'); if(p2) p2.onclick=()=>{ intlAction(); };
  const p3=$('intlSim'); if(p3) p3.onclick=()=>{ intlSimAll(); };
  show('intl');
}
function intlAction(){
  const r=intlNext();
  if(r.action==='user'){
    const s=intlSeries(r.match,r.roundName,r.tour);
    saveGame(); startDraft(s); return;
  }
  if(r.action==='done' || !intlNow()){ renderAll(); return; }
  renderIntl();
}
function intlSimAll(){
  let guard=0;
  while(intlNow()&&guard++<40){
    const tour=intlNow();
    const rd=tour.bracket.rounds[tour.bracket.round];
    let any=false;
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b){ simIntlMatch(m,tour); any=true; } });
    if(!any) break;
    const r=intlAdvance(tour);
    if(r.action==='done') break;
  }
  saveGame();
  renderAll();
}


/* boot */
window.__game={get S(){return S},get M(){return M},get D(){return D}};
renderTitle();

</script>
