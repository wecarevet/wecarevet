function mmUpdatePhase(){
  const m=M.minute||0;
  if(m<2){ MM.phase='pre'; MM.phaseLabel='초반 설계'; return null; }
  if(MM.focusUntil>m){ MM.phase='fight'; MM.phaseLabel='한타 교전'; return MM.focus; }
  const win=mmObjectiveWindow(m);
  if(win){ MM.phase='obj'; MM.phaseLabel=(win==='dragon'?'드래곤':win==='baron'?'바론':'공허 유충')+' 교전'; return PIT[win==='grub'?'baron':win]; }
  if(m>=25){ MM.phase='late'; MM.phaseLabel='후반 운영'; return null; }
  if(m>=14){ MM.phase='mid'; MM.phaseLabel='미드게임 운영'; return null; }
  MM.phase='lane'; MM.phaseLabel='라인전'; return null;
}

/* ---------- 라인 좌표 헬퍼 ---------- */
function mmPathPoint(pts,t){
  let total=0; const segs=[];
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    segs.push(d); total+=d;
  }
  let target=Math.max(0,Math.min(1,t))*total;
  if(!total) return pts[0];
  for(let i=0;i<segs.length;i++){
    if(target<=segs[i]||i===segs.length-1){
      const f=segs[i]?target/segs[i]:0;
      return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];
    }
    target-=segs[i];
  }
  return pts[pts.length-1];
}
/* front: 0.5 = 라인 중앙(양 팀 미팅 포인트) */
function laneFrontParam(lane,front){
  const mt=LANE_MIDT[lane]||0.5;
  const f=clamp(front,0,1);
  return f<=0.5 ? mt*(f/0.5) : mt+(1-mt)*((f-0.5)/0.5);
}
function mmLaneAdv(lane){
  const roleMap={TOP:'TOP',MID:'MID',BOT:'ADC'};
  const L=(M&&M.lane&&M.lane[roleMap[lane]])||{my:60,opp:60};
  return (L.my-L.opp)/26;
}
function mmLaneFrontT(lane){
  /* 01:45~01:55 라인 합류 시점까지는 양 팀이 정확히 라인 중앙에서 만난다 */
  if(mmGameSec()<150) return 0.5;
  const td=((M&&M.towers)?((M.towers[0]||0)-(M.towers[1]||0)):0);
  const adv=clamp(mmLaneAdv(lane)+td*0.05,-1,1);
  let f=clamp(0.5+adv*0.30,0.20,0.80);
  /* 전선 잠금: 상대 첫 생존 타워를 넘어설 수 없다 */
  const maxMe=mmFrontLimit('me',lane), maxOp=mmFrontLimit('opp',lane);
  f=clamp(f,1-maxOp,maxMe);
  return f;
}
function mmFrontFromParam(lane,param){
  const mt=LANE_MIDT[lane]||0.5;
  return param<=mt ? (param/mt)*0.5 : 0.5+((param-mt)/(1-mt))*0.5;
}
function mmFrontLimit(side,lane){
  const enemy=side==='me'?'opp':'me';
  if(!M||!M.tw) return 0.985;
  const arr=(M.tw[enemy]&&M.tw[enemy][lane])||[1,1,1];
  for(let i=0;i<3;i++){
    if(arr[i]){
      const p=mmTowerParam(enemy,lane,i+1);
      return clamp(mmFrontFromParam(lane,p)-0.010,0.5,0.985);
    }
  }
  const inh=(M.inhib&&M.inhib[enemy])?M.inhib[enemy][lane]:null;
  if(inh&&inh.alive) return 0.945;
  return 0.985;
}
function mmPointFront(lane,x,y){
  let best=0.5,bd=9;
  for(let i=0;i<=36;i++){
    const t=i/36, q=mmPathPoint(LANE_PATH[lane],t);
    const d=Math.hypot(q[0]-x,q[1]-y);
    if(d<bd){ bd=d; best=t; }
  }
  return {param:best,front:mmFrontFromParam(lane,best),dist:bd};
}
function mmClampFront(side,role,x,y,deep,lane){
  const ln=lane||(role==='TOP'?'TOP':role==='MID'?'MID':'BOT');
  const pf=mmPointFront(ln,x,y);
  if(pf.dist>0.12) return [x,y];
  let maxF=mmFrontLimit(side,ln);
  if(deep) maxF=clamp(maxF+0.045,0.5,0.985);
  if(pf.front<=maxF) return [x,y];   /* 적 첫 타워 앞까지만 — 뒤쪽(아군 진영)은 제한 없음 */
  const f=maxF;
  const q=mmPathPoint(LANE_PATH[ln],laneFrontParam(ln,f));
  return [q[0],q[1]];
}
function laneDir(lane,t){
  const a=mmPathPoint(LANE_PATH[lane],Math.max(0,t-0.02));
  const b=mmPathPoint(LANE_PATH[lane],Math.min(1,t+0.02));
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const d=Math.hypot(dx,dy)||1;
  return [dx/d,dy/d];
}
function mmLaneFrontPos(lane,side,back){
  const t=mmLaneFrontT(lane);
  const off=back||0.008;
  const front=clamp(side==='me'?t-off:t+off,0.04,0.96);
  const param=laneFrontParam(lane,front);
  const p=mmPathPoint(LANE_PATH[lane],param);
  const dir=laneDir(lane,param);
  const px=-dir[1]*0.006, py=dir[0]*0.006;
  return [clamp(p[0]+px,0.03,0.97),clamp(p[1]+py,0.03,0.97)];
}

/* ---------- 정글 동선 ---------- */
function mmNearestCamp(side,role,x,y,sec){
  let best=null,bd=9;
  const list=MM.camps[side].concat(MM.scuttle);
  list.forEach(c=>{
    if(!mmCampAlive(c,sec)) return;
    if(c.prog>0&&c.by&&c.by!==side+'-'+role) return;
    const d=Math.hypot(c.x-x,c.y-y);
    // 같은 진영 캠프 우선, 게는 조금 뒤로
    const w=d+(c.side&&c.side!==side?0.16:0)+(c.kind==='scuttle'?0.12:0);
    if(w<bd){bd=w;best=c;}
  });
  return best;
}

/* ---------- 목표 지점 계산 ---------- */
function mmComputeTargets(){
  if(!M) return;
  const m=M.minute||0;
  const sec=mmGameSec();
  const focus=mmUpdatePhase();
  const objWin=mmObjectiveWindow(m);
  const fk=M.focusKey||null, fe=fk?FOCUS_MAP[fk]:null;
  const mmB=(fe&&fe.mm)||null;
  const soulSide=M.soulGranted&&(M.soulGranted.me||M.soulGranted.opp);
  const dragonPit=PIT.dragon, baronPit=PIT.baron;
  const enemyPit=(m>=20||soulSide)?baronPit:dragonPit;
  const groupPt=(m>=20||soulSide)?[0.40,0.34]:[0.56,0.62];
  ROLES.forEach((role,ri)=>{
    ['me','opp'].forEach(side=>{
      const k=mmTokenKey(side,role);
      const u=MM.units[k]; if(!u) return;
      const sgn=side==='me'?-1:1;
      let tx,ty;
      /* 텔레포트 채널 중에는 제자리 */
      if(u.tp){ MM.tgt[k]={x:u.x,y:u.y}; return; }
      const gp=M.gp||{};
      /* ---- 0-1) 1레벨 인베이드 / 안전 와딩 (00:30~01:15) ---- */
      if(sec>=30&&sec<=78&&gp.invade&&gp.invade!=='none'){
        if(gp.invade==='steal'){
          const tgtC=MM.camps.opp[1]||MM.camps.opp[0];
          const off={TOP:[-0.016,0.010],MID:[0.004,-0.014],JGL:[0.006,0.004],ADC:[0.020,0.016],SUP:[0.026,0.024]}[role]||[0,0];
          if(tgtC){ u.mode='invade'; MM.tgt[k]={x:clamp(tgtC.x+off[0],0.05,0.95),y:clamp(tgtC.y+off[1],0.05,0.95)}; return; }
        }else if(gp.invade==='ward'){
          const spots={TOP:[0.300,0.640],MID:[0.420,0.560],JGL:[0.250,0.700],ADC:[0.270,0.690],SUP:[0.330,0.620]};
          const p=mmMirrorRole(side,spots[role]||[0.30,0.62]);
          u.mode='ward'; MM.tgt[k]={x:clamp(p[0],0.05,0.95),y:clamp(p[1],0.05,0.95)}; return;
        }
      }
      /* ---- 0) 초반 스크립트: 부시 가드 → 대치 → 리쉬 → 라인 ---- */
      if(sec<116&&role!=='JGL'){
        const script=mmPreScript(role);
        let a=script[0],b=script[script.length-1];
        for(let i=0;i<script.length-1;i++){ if(sec>=script[i].sec&&sec<script[i+1].sec){ a=script[i]; b=script[i+1]; break; } }
        if(!b.pt){ /* 라인으로 이동 (라인 스왑 반영) */
          const lane=mmRoleLane(role,sec);
          const p=mmLaneFrontPos(lane,side,role==='SUP'?0.014:0.006);
          u.mode='walk';
          tx=p[0]; ty=p[1];
        }else{
          const f=(sec-a.sec)/Math.max(1,(b.sec-a.sec));
          const pa=mmMirrorRole(side,a.pt), pb=mmMirrorRole(side,b.pt);
          tx=pa[0]+(pb[0]-pa[0])*f; ty=pa[1]+(pb[1]-pa[1])*f;
          tx+=Math.sin(MM.t*0.7+ri)*0.004; ty+=Math.cos(MM.t*0.9+ri)*0.004;
          u.mode=sec<70?'guard':'leash';
        }
        MM.tgt[k]={x:clamp(tx,0.05,0.95),y:clamp(ty,0.05,0.95)};
        return;
      }
      if(sec<116&&role==='JGL'){
        /* 정글러: 90초 전까지 대치 → 90초부터 첫 캠프 (동선 계획 반영) */
        if(sec<90){
          const tgt=sec<38?GUARD[side].JGL:sec<80?STANDOFF[side].JGL:LEASH[side].JGL;
          u.mode='guard';
          MM.tgt[k]={x:tgt[0],y:tgt[1]};
          return;
        }
        const plan=gp.jungle||'mid';
        const dir=plan==='top'?'bottomUp':plan==='bot'?'topDown':null;
        const c=(dir?mmPlanCamp(side,dir):null)||mmNearestCamp(side,k,u.x,u.y,sec)||MM.camps[side][0];
        u.mode='jungle';
        MM.tgt[k]={x:c.x,y:c.y};
        return;
      }
      /* ---- 0-2) 3레벨 다이브 설계 (03:15~04:30) ---- */
      if(gp.dive&&role==='JGL'&&sec>=195&&sec<=275){
        const tp=MAP_TOWERS.opp.BOT[0];
        u.mode='dive';
        MM.tgt[k]={x:clamp(tp[0]+(side==='me'?0.02:-0.02),0.05,0.95),y:clamp(tp[1]-0.015,0.05,0.95)};
        return;
      }
      /* ---- 1) 귀환 (체력 낮음) ---- */
      if(u.alive&&u.hp<26&&m>2&&!objWin){
        const f=MM_NEXUS[side];
        u.mode='recall';
        if(Math.hypot(f[0]-u.x,f[1]-u.y)<0.05){ u.hp=u.hpMax; u.recall=false; u.hp=u.hpMax; }
        MM.tgt[k]={x:f[0],y:f[1]};
        return;
      }
      /* ---- 2) 정글러: 캠프 → 캠프 (계획 동선) ---- */
      if(role==='JGL'){
        u.mode='jungle';
        const plan=gp.jungle||'mid';
        let camp=null;
        if(objWin){
          const macro=(M.objMacro&&Math.abs((M.objMacro.at||0)-m)<=1)?M.objMacro:null;
          if(macro&&macro[side]==='trade'){
            const c2=mmNearestCamp(side,k,u.x,u.y,sec);
            if(c2){ camp=[c2.x,c2.y]; u.camp=c2.k; u.mode='jungle'; }
          }else{
            u.mode='obj';
            const pit=PIT[objWin==='grub'||objWin==='herald'?'baron':objWin];
            camp=[pit[0]+(side==='me'?-0.03:0.03),pit[1]];
          }
        }
        else if(plan==='top'||plan==='bot'){
          const c=mmPlanCamp(side,plan==='top'?'bottomUp':'topDown')||mmNearestCamp(side,k,u.x,u.y,sec);
          if(c){ camp=[c.x,c.y]; u.camp=c.k; u.mode='jungle'; }
        }
        else if(plan==='farm'){
          const c=mmNearestCamp(side,k,u.x,u.y,sec);
          if(c){ camp=[c.x,c.y]; u.camp=c.k; }
        }
        else if(m>=2&&(m+ri)%3===0){
          const lanes=['TOP','MID','BOT'];
          const tgtLane=lanes[(Math.floor(m/3)+ri+(side==='me'?0:1))%3];
          const fp=mmLaneFrontPos(tgtLane,side,0.045);
          camp=[fp[0],fp[1]]; u.mode='gank';
        }else{
          const c=mmNearestCamp(side,k,u.x,u.y,sec);
          if(c){ camp=[c.x,c.y]; u.camp=c.k; }
        }
        if(!camp) camp=[0.5,0.5];
        tx=camp[0]; ty=camp[1];
      }
      /* ---- 3) 오브젝트 셋업 (교차 이득 판단 시 반대 사이드) ---- */
      else if(objWin){
        const macro=(M.objMacro&&Math.abs((M.objMacro.at||0)-m)<=1)?M.objMacro:null;
        if(macro&&macro[side]==='trade'){
          const lane=(macro.kind==='dragon')?'TOP':(macro.kind==='baron')?'BOT':(objWin==='grub'?'BOT':'TOP');
          const tw=(MAP_TOWERS[side==='me'?'opp':'me'][lane]||[])[0]||[0.5,0.5];
          u.mode='trade';
          tx=tw[0]+(side==='me'?-0.025:0.025); ty=tw[1];
        }else{
          u.mode='obj';
          const pit=PIT[objWin==='grub'||objWin==='herald'?'baron':objWin];
          const spread={TOP:[-0.05,0.03],MID:[-0.02,-0.02],ADC:[0.03,0.04],SUP:[0.05,-0.01]}[role]||[0,0];
          tx=pit[0]+spread[0]*sgn+(side==='me'?-0.02:0.02);
          ty=pit[1]+spread[1]*sgn;
        }
      }
      /* ---- 4) 라인전 (0~14분) ---- */
      else if(m<14){
        u.mode='lane';
        const lane=mmRoleLane(role,sec);
        const back=role==='SUP'?0.016:role==='ADC'?0.008:0.006;
        const p=mmLaneFrontPos(lane,side,back);
        const dir=laneDir(lane,laneFrontParam(lane,mmLaneFrontT(lane)));
        const phase=(MM.t*0.9+ri*1.7);
        const amp=0.006;
        tx=p[0]+(-dir[1])*Math.sin(phase)*amp;
        ty=p[1]+(dir[0])*Math.sin(phase)*amp;
      }
      /* ---- 5) 미드게임 로테이션 (14분~) ---- */
      else{
        u.mode='rotate';
        if(role==='ADC'||role==='SUP'){
          const mid=mmLaneFrontPos('MID',side,role==='SUP'?0.02:0.010);
          const dr=laneDir('MID',laneFrontParam('MID',mmLaneFrontT('MID')));
          tx=mid[0]+(-dr[1])*Math.sin(MM.t*0.7+ri)*0.007;
          ty=mid[1]+(dr[0])*Math.sin(MM.t*0.7+ri)*0.007;
        }else if(role==='TOP'){
          const bot=mmLaneFrontPos('BOT',side,0.04);
          tx=bot[0]; ty=bot[1];
        }else if(role==='MID'){
          const top=mmLaneFrontPos('TOP',side,0.04);
          tx=top[0]; ty=top[1];
        }else{
          const mid=mmLaneFrontPos('MID',side,0.035);
          tx=mid[0]; ty=mid[1];
        }
      }
      /* ---- 교전 성향(먼저 적용 → 전술이 덮어쓴다) ---- */
      const st=M.stance;
      if(st==='aggro'){ tx+=sgn*-0.035; ty+=sgn*-0.02; }
      if(st==='defensive'){
        /* 전력 수비: 아군 진영 쪽으로 물러난다 (전술이 있으면 약하게) */
        const wBack=M.focusKey?0.25:0.55;
        const dlane=role==='TOP'?'TOP':role==='MID'?'MID':'BOT';
        const backP=mmPathPoint(LANE_PATH[dlane],laneFrontParam(dlane,side==='me'?0.30:0.70));
        tx=tx*(1-wBack)+backP[0]*wBack; ty=ty*(1-wBack)+backP[1]*wBack;
      }
      /* ---- 전술이 실제 이동 목표를 직접 제어 ---- */
      if(mmB){
        const T=(role==='ADC'||role==='SUP')?'BOT':role==='MID'?'MID':'TOP';
        const own=mmLaneFrontT(T);
        const deep=side==='me'?0.86:0.14;
        const behind=side==='me'?0.62:0.38;
        switch(mmB){
          case 'top':
            if(role==='TOP'){ const q=mmLaneFrontPos('TOP',side,0.006); tx=q[0]; ty=q[1]; }
            else if(role==='JGL'){ const q=mmLaneFrontPos('TOP',side,0.04); tx=q[0]; ty=q[1]; }
            break;
          case 'topDive':
            if(role==='TOP'){ const p=mmPathPoint(LANE_PATH.TOP,laneFrontParam('TOP',side==='me'?own+0.05:own-0.05)); tx=p[0]; ty=p[1]; }
            else if(role==='JGL'){ const p=mmPathPoint(LANE_PATH.TOP,side==='me'?LANE_MIDT.TOP*1.4:1-LANE_MIDT.TOP*1.4); tx=p[0]; ty=p[1]; }
            break;
          case 'diveBot':
            if(role==='ADC'||role==='SUP'){ const p=mmPathPoint(LANE_PATH.BOT,laneFrontParam('BOT',side==='me'?own+0.05:own-0.05)); tx=p[0]; ty=p[1]; }
            else if(role==='JGL'){ const p=mmPathPoint(LANE_PATH.BOT,side==='me'?LANE_MIDT.BOT*1.35:1-LANE_MIDT.BOT*1.35); tx=p[0]; ty=p[1]; }
            break;
          case 'mid': if(role==='MID'||role==='JGL'){ const p=mmPathPoint(LANE_PATH.MID,laneFrontParam('MID',side==='me'?own+0.06:own-0.06)); tx=p[0]; ty=p[1]; } break;
          case 'invade':
            if(role==='JGL'){ const ep=MM.camps[side==='me'?'opp':'me'][1]; tx=ep.x; ty=ep.y; }
            else if(role==='MID'||role==='SUP'){ const ep=MM.camps[side==='me'?'opp':'me'][2]; tx=ep.x+(side==='me'?-0.02:0.02); ty=ep.y; }
            break;
          case 'hold': if(role==='JGL'){ tx=0.5+(sgn*-0.10); ty=0.5+(sgn*-0.05); } break;
          case 'freeze': if(role==='TOP'||role==='MID'||role==='ADC'){ const q=mmLaneFrontPos(T,side,0.02); tx=q[0]; ty=q[1]; } break;
          case 'siege': if(role==='TOP'){ const p=mmPathPoint(LANE_PATH.TOP,laneFrontParam('TOP',side==='me'?own+0.05:own-0.05)); tx=p[0]; ty=p[1]; } else { tx=0.5+(sgn*-0.10); ty=0.5+(sgn*-0.03); } break;
          case 'push3': { const p=mmPathPoint(LANE_PATH[T],laneFrontParam(T,side==='me'?own+0.07:own-0.07)); tx=p[0]; ty=p[1]; } break;
          case 'split131':
            if(role==='TOP'){ const p=mmPathPoint(LANE_PATH.BOT,side==='me'?deep:1-deep); tx=p[0]; ty=p[1]; }
            else if(role==='MID'){ const p=mmPathPoint(LANE_PATH.TOP,side==='me'?deep:1-deep); tx=p[0]; ty=p[1]; }
            else { const p=mmPathPoint(LANE_PATH.MID,laneFrontParam('MID',side==='me'?own+0.04:own-0.04)); tx=p[0]; ty=p[1]; }
            break;
          case 'split14':
            if(role==='TOP'){ const p=mmPathPoint(LANE_PATH.TOP,side==='me'?0.72:0.28); tx=p[0]; ty=p[1]; }
            else { const p=mmPathPoint(LANE_PATH.MID,laneFrontParam('MID',side==='me'?own+0.09:own-0.09)); tx=p[0]+(role==='SUP'?0.02:0); ty=p[1]; }
            break;
          case 'cross': tx=enemyPit[0]+(sgn*-0.03); ty=enemyPit[1]; break;
          case 'bush':
            if(role==='JGL'||role==='SUP'||role==='ADC'){ tx=side==='me'?0.335:0.665; ty=side==='me'?0.245:0.755; }
            else { const p=mmPathPoint(LANE_PATH.MID,laneFrontParam('MID',side==='me'?own+0.02:own-0.02)); tx=p[0]; ty=p[1]; }
            break;
          case 'group': tx=groupPt[0]+(sgn*-0.02); ty=groupPt[1]; break;
          case 'flank':
            if(role==='TOP'){ tx=side==='me'?0.24:0.76; ty=side==='me'?0.30:0.70; }
            else if(role==='MID'){ const p=mmPathPoint(LANE_PATH.MID,0.42); tx=p[0]; ty=p[1]-0.03; }
            break;
          case 'backdoor':
            if(role==='TOP'||role==='MID'){ const lane=role==='TOP'?'BOT':'TOP'; const p=mmPathPoint(LANE_PATH[lane],side==='me'?0.95:0.05); tx=p[0]; ty=p[1]; }
            break;
          case 'assassin': if(role==='MID'||role==='JGL'){ const fp=mmLaneFrontPos('BOT',side==='me'?'opp':'me',0.02); tx=fp[0]; ty=fp[1]; } break;
          case 'poke': { const p=mmPathPoint(LANE_PATH.MID,side==='me'?0.62:0.38); tx=p[0]; ty=p[1]; } break;
          case 'safe': { const q=mmLaneFrontPos(T,side,0.04); tx=q[0]; ty=q[1]; } break;
          case 'swap': {
            const laneMap={TOP:'BOT',ADC:'TOP',SUP:'TOP',MID:'MID',JGL:'MID'};
            const tl=laneMap[role]||T;
            const p=mmLaneFrontPos(tl,side,role==='SUP'?0.02:0.008);
            tx=p[0]; ty=p[1];
            break;
          }
        }
      }
      if(focus){
        const w={JGL:0.85,SUP:0.78,MID:0.6,TOP:0.45,ADC:0.5}[role]||0.5;
        tx=tx*(1-w)+focus[0]*w; ty=ty*(1-w)+focus[1]*w;
      }
      /* ---- 03:30 바위게: 정글러·로밍 라이너가 게로 모인다 ---- */
      if(M.scuttleWar&&M.scuttleWar.fired){
        const gs=(M.minute||0)*60+((M.sec||0)%60);
        if(gs>=198&&gs<=255){
          const tl=M.scuttleWar.lane||'TOP';
          const sc=SCUTTLE_DEF.find(d=>d.k===(tl==='TOP'?'scuttleTop':'scuttleBot'))||SCUTTLE_DEF[0];
          const roam=(M.scuttleWar.roam&&M.scuttleWar.roam[side])||[];
          if(role==='JGL'||roam.indexOf(role)>=0){
            const w=role==='JGL'?0.92:0.62;
            tx=tx*(1-w)+sc.x*w; ty=ty*(1-w)+sc.y*w;
          }
        }
      }
      /* ---- 전선 잠금: 상대 첫 생존 타워 앞에서 멈춘다 ---- */
      const deepT=(mmB==='backdoor'||mmB==='flank'||mmB==='assassin'||mmB==='split131'||mmB==='split14'||mmB==='topDive'||mmB==='diveBot'||mmB==='cross');
      if(role!=='JGL'&&typeof mmClampFront==='function'){
        const uLane=mmRoleLane(role,sec);
        const cl=mmClampFront(side,role,tx,ty,deepT,uLane);
        tx=cl[0]; ty=cl[1];
      }
      tx=Math.max(0.045,Math.min(0.955,tx)); ty=Math.max(0.045,Math.min(0.955,ty));
      /* ---- 텔레포트: 탑·미드가 사이드/교전 합류 시 ---- */
      if((u.mode==='obj'||u.mode==='rotate')&&(role==='TOP'||role==='MID')&&sec>130){
        mmTryTeleport(u,tx,ty,sec);
      }
      MM.tgt[k]={x:tx,y:ty};
    });
  });
}

/* ---------- 텔레포트 ---------- */
function mmTryTeleport(u,tx,ty,sec){
  if(u.tp||u.flash>0) return false;
  if((u.tpCd||0)>sec) return false;
  const d=Math.hypot(tx-u.x,ty-u.y);
  if(d<0.34) return false;
  const target=mmTpTarget(u.side,u.role);
  u.tp={left:4, x:target[0], y:target[1], toX:tx, toY:ty};
  if(u.side==='me'&&M) M.tpAt=M.minute;
  u.tpCd=sec+75;
  u.vx=0; u.vy=0; u.flash=0;
  MM.tpCount++;
  mmAddFx({type:'tpring',x:u.x,y:u.y,life:900,col:'#b98cff'});
  if(u.side==='me'&&typeof logEvent==='function') logEvent('sys','🌀 '+(lineupAt('me',u.role).name||ROLE_KR[u.role])+' 텔레포트 — '+ROLE_KR[u.role]+' 라인 합류');
  return true;
}
function mmTpTarget(side,role){
  /* 아군 타워(2차) 또는 와드 위치 — 사이드면 사이드 라인 타워, 아니면 교전 지점 */
  const lane=role==='TOP'?'TOP':role==='MID'?'MID':'BOT';
  const f=side==='me'?0.30:0.70;
  const p=mmLaneFrontPos(lane,side,0.02);
  return [clamp(p[0]*0.55+f*0.45,0.05,0.95),clamp(p[1]*0.55+(1-f)*0.45,0.05,0.95)];
}

/* ---------- 이벤트 동기화 ---------- */
function mmAddFx(o){ o.at=performance.now(); MM.fx.push(o); if(MM.fx.length>60) MM.fx.shift(); }
function mmSync(){
  if(!M) return;
  const key=(M.series?(M.series.startedAt||0):0)+'-'+M.gameIdx;
  mmLoadMap();
  if(!MM.init||MM.key!==key){ MM.key=key; mmReset(); mmJumpTargets(); }
  mmJumpTargets();
  mmComputeTargets();
  ROLES.forEach(role=>{
    ['me','opp'].forEach(side=>{
      const l=lineupAt(side,role); const ch=l&&l.champ; const c=ch?CHAMP_MAP[ch]:null;
      if(c&&!MM.imgs[ch]){ const im=new Image(); im.src=DD(c.k); MM.imgs[ch]=im; }
    });
  });
  ['me','opp'].forEach(side=>{
    const idx=side==='me'?0:1;
    const cur=M.kills[idx]||0, prev=MM.last.kills[idx]||0;
    if(cur>prev){
      const victim=side==='me'?'opp':'me';
      for(let i=0;i<Math.min(cur-prev,2);i++){
        const cands=ROLES.map(r=>mmTokenKey(victim,r)).filter(k=>MM.units[k]&&MM.units[k].alive);
        const k=cands.length?cands[Math.floor(Math.random()*cands.length)]:null;
        if(k){
          const u=MM.units[k];
          mmAddFx({type:'burst',x:u.x,y:u.y,col:SIDE_COL[side],life:900,label:'KILL'});
          mmAddFx({type:'flash',x:u.x,y:u.y,life:520});
          u.alive=false; u.hp=0; u.deadUntil=performance.now()+4200;
          if(MM.zoom.on) mmZoomTo(u.x,u.y,2.0,3600);
        }
      }
    }
  });
  MM.last.kills=(M.kills||[0,0]).slice();
  ['me','opp'].forEach(side=>{
    const idx=side==='me'?0:1;
    const cur=M.towers[idx]||0, prev=MM.last.towers[idx]||0;
    if(cur>prev){
      const enemy=side==='me'?'opp':'me';
      let n=cur-prev;
      ['TOP','MID','BOT'].forEach(lane=>{
        const arr=(M.tw&&M.tw[enemy]&&M.tw[enemy][lane])||[1,1,1];
        arr.forEach((alive,i)=>{
          const key=lane+i;
          const wasAlive=(MM.twAlive[enemy]&&MM.twAlive[enemy][key]!==false);
          if(!alive&&wasAlive&&n>0){
            n--;
            const tp=(MAP_TOWERS[enemy][lane]||[])[i]||[0.5,0.5];
            MM.marks.push({x:tp[0],y:tp[1],type:'tower',side:enemy,at:M.minute});
            mmAddFx({type:'laser',x1:tp[0],y1:tp[1],x2:tp[0]+(enemy==='opp'?-0.05:0.05),y2:tp[1]+0.03,col:SIDE_COL[side],life:700});
            mmAddFx({type:'burst',x:tp[0],y:tp[1],col:'#ffc94a',life:900,label:'T'+(i+1)});
            if(MM.zoom.on) mmZoomTo(tp[0],tp[1],1.9,3200);
          }
        });
      });
      /* 넥서스 타워 */
      const nex=(M.tw&&(enemy==='me'?M.tw.meNex:M.tw.oppNex))||[1,1];
      nex.forEach((alive,i)=>{
        const key='N'+i;
        const wasAlive=(MM.twAlive[enemy]&&MM.twAlive[enemy][key]!==false);
        if(!alive&&wasAlive){
          const tp=(MAP_TOWERS[enemy].NEXUS||[])[i]||[0.5,0.5];
          MM.marks.push({x:tp[0],y:tp[1],type:'tower',side:enemy,at:M.minute});
          mmAddFx({type:'burst',x:tp[0],y:tp[1],col:'#ff5c9a',life:1100,label:'NEXUS'});
        }
      });
    }
    MM.last.towers=(M.towers||[0,0]).slice();
  });
  /* 타워 생존 스냅샷 */
  if(M.tw){
    ['me','opp'].forEach(side=>{
      const o={};
      ['TOP','MID','BOT'].forEach(l=>{ ((M.tw[side]&&M.tw[side][l])||[1,1,1]).forEach((a,i)=>{ o[l+i]=!!a; }); });
      ((side==='me'?M.tw.meNex:M.tw.oppNex)||[1,1]).forEach((a,i)=>{ o['N'+i]=!!a; });
      MM.twAlive[side]=o;
    });
  }
  [['dragons','dragon'],['barons','baron'],['grubs','grub']].forEach(([kk,kind])=>{
    const tot=(M[kk][0]||0)+(M[kk][1]||0);
    const prev=(MM.last[kk][0]||0)+(MM.last[kk][1]||0);
    if(tot>prev){
      const side=(M[kk][0]||0)>(MM.last[kk][0]||0)?'me':'opp';
      const pit=PIT[kind==='grub'?'baron':kind];
      MM.marks.push({x:pit[0],y:pit[1],type:kind,side,at:M.minute});
      mmAddFx({type:'ring',x:pit[0],y:pit[1],col:'#ffc94a',life:1100,r:0.06});
      mmAddFx({type:'burst',x:pit[0],y:pit[1],col:'#ffc94a',life:1100,label:kind==='dragon'?'DRAGON':kind==='baron'?'BARON':'GRUB'});
      if(MM.zoom.on) mmZoomTo(pit[0],pit[1],1.85,3400);
    }
    MM.last[kk]=M[kk].slice();
  });
  const ft=(M.fights[0]||0)+(M.fights[1]||0), fprev=(MM.last.fights[0]||0)+(MM.last.fights[1]||0);
  if(ft>fprev){
    const lane=['TOP','MID','ADC'][Math.floor(Math.random()*3)];
    const side=Math.random()<0.5?'me':'opp';
    const lp=LANE_POS[lane][side];
    MM.focus=[lp[0],lp[1]]; MM.focusUntil=(M.minute||0)+2;
    mmAddFx({type:'ring',x:lp[0],y:lp[1],col:'#ffc94a',life:1200,r:0.05});
    mmAddFx({type:'burst',x:lp[0],y:lp[1],col:'#ffc94a',life:1200,label:'FIGHT'});
    if(MM.zoom.on) mmZoomTo(lp[0],lp[1],1.8,3400);
  }
  MM.last.fights=(M.fights||[0,0]).slice();
  /* ---- 시야: 새로 박한 와드 · 스윕 이펙트 ---- */
  const vw=M.visionWar;
  if(vw){
    const seq=vw.seq||0;
    if(seq!==MM.vseq){
      ['me','opp'].forEach(side=>{
        (vw.wards[side]||[]).forEach(wd=>{
          if((wd.seq||0)>MM.vseq) mmAddFx({type:'ring',x:wd.x,y:wd.y,col:wd.kind==='pink'?'#ff6bd5':'#ffe066',life:700,r:0.02});
        });
      });
      (vw.sweeps||[]).forEach(s2=>{
        if((s2.seq||0)>MM.vseq) mmAddFx({type:'sweep',x:s2.x,y:s2.y,col:'#7cf7ff',life:950,r:0.03});
      });
      MM.vseq=seq;
    }
  }
  /* ---- 03:30 바위게 교전 마크 ---- */
  const scw=M.scuttleWar;
  if(scw&&scw.fired){
    const now2=[scw.me||0,scw.opp||0];
    const prev=MM.last.scuttle||[0,0];
    if(now2[0]+now2[1]>(prev[0]||0)+(prev[1]||0)){
      const tl=scw.lane||'TOP';
      const sc=SCUTTLE_DEF.find(d=>d.k===(tl==='TOP'?'scuttleTop':'scuttleBot'))||SCUTTLE_DEF[0];
      mmAddFx({type:'burst',x:sc.x,y:sc.y,col:'#ffc94a',life:1300,label:'바위게'});
      mmAddFx({type:'ring',x:sc.x,y:sc.y,col:'#ffc94a',life:1100,r:0.06});
      MM.focus=[sc.x,sc.y]; MM.focusUntil=(M.minute||0)+1;
      if(MM.zoom.on) mmZoomTo(sc.x,sc.y,1.85,3000);
    }
    MM.last.scuttle=now2;
  }
  if(!MM.minions.length) mmSpawnWave();
}

/* ---------- 미니언 ---------- */
function mmLaneFront(lane){
  const param=laneFrontParam(lane,mmLaneFrontT(lane));
  return param;
}
function mmSpawnWave(){
  MM.minions=[];
  const sup=(typeof v5SuperLanes==='function'&&M)?v5SuperLanes():{me:[],opp:[]};
  const baronOn=(side)=>!!(M&&M.baronBuff&&M.baronBuff[side]>=((M.minute||0)));
  ['TOP','MID','BOT'].forEach(lane=>{
    ['me','opp'].forEach(side=>{
      const nbar=baronOn(side)?1:0;
      for(let i=0;i<4+nbar;i++){
        const ranged=i===3;
        MM.minions.push({lane,side,t:side==='me'?0.012+i*0.008:0.988-i*0.008,
          hp:30,alive:true,off:(Math.random()-0.5)*0.016+(ranged?0.010:0),spd:0.010+Math.random()*0.002,ranged:ranged,baron:nbar&&i===4});
      }
      /* 슈퍼 미니언: 상대 억제기가 파괴된 라인에서 밀려나온다 */
      if((sup[side]||[]).indexOf(lane)>=0){
        MM.minions.push({lane,side,t:side==='me'?0.004:0.996,hp:70,alive:true,off:0,spd:0.0085,ranged:false,super:true});
      }
    });
  });
  MM.waveAt=performance.now();
}
/* ---------- 발사체 · 이펙트 ---------- */
function mmSpawnProjectile(){
  const alive=Object.keys(MM.units).filter(k=>MM.units[k].alive);
  if(alive.length<2) return null;
  const a=MM.units[alive[Math.floor(Math.random()*alive.length)]];
  const enemies=alive.filter(k=>MM.units[k].side!==a.side).map(k=>MM.units[k]);
  if(!enemies.length) return null;
  enemies.sort((x,y)=>Math.hypot(x.x-a.x,x.y-a.y)-Math.hypot(y.x-a.x,y.y-a.y));
  const b=enemies[0];
  const dist=Math.hypot(b.x-a.x,b.y-a.y);
  if(dist>0.055) return null;   /* 실제 사거리: 맵 전체를 가로지르는 사격 금지 */
  const skill=Math.random()<0.35;
  MM.proj.push({x:a.x,y:a.y,tx:b.x,ty:b.y,side:a.side,kind:skill?'skill':'auto',
    spd:skill?0.9:0.55,col:a.side==='me'?'#7cf7ff':'#ff9aa9',life:0,target:b,skill});
  return true;
}

/* ---------- 메인 루프 ---------- */
function mmStart(){
  const cv=(typeof document!=='undefined')?document.getElementById('riftCanvas'):null;
  if(cv&&!cv.__mmHover){
    cv.__mmHover=true;
    try{
      cv.addEventListener('mousemove',ev=>{
        const r=cv.getBoundingClientRect?cv.getBoundingClientRect():{left:0,top:0,width:cv.clientWidth||320,height:cv.clientHeight||320};
        if(!r.width) return;
        MM.hover={x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height,at:performance.now()};
      });
      cv.addEventListener('mouseleave',()=>{ MM.hover=null; });
      cv.addEventListener('touchstart',ev=>{
        const r=cv.getBoundingClientRect?cv.getBoundingClientRect():{left:0,top:0,width:cv.clientWidth||320,height:cv.clientHeight||320};
        const t=ev.touches&&ev.touches[0]; if(!t||!r.width) return;
        MM.hover={x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height,at:performance.now()};
      },{passive:true});
    }catch(e){}
  }
  if(MM.started) return;
  MM.started=true; MM.lastTs=0;
  const loop=(ts)=>{
    if(!MM.started) return;
    MM.rafId=requestAnimationFrame(loop);
    const dt=MM.lastTs?Math.min(64,ts-MM.lastTs):16; MM.lastTs=ts;
    mmUpdate(dt);
    mmDraw(dt);
  };
  MM.rafId=requestAnimationFrame(loop);
}
function mmStop(){
  MM.started=false;
  if(MM.rafId){ try{ cancelAnimationFrame(MM.rafId); }catch(e){} MM.rafId=null; }
}
function mmUpdate(dt){
  if(!M) return;
  const now=performance.now();
  const paused=!M.running&&!M.over;
  const step=paused?0:Math.min(dt,64)/1000;
  MM.t+=step;
  const dSim=paused?0:mmSimDelta();
  const sec=mmGameSec();
  /* ---- 캠프 리스폰 & 진행 ---- */
  mmAllCamps().forEach(c=>{
    if(!c.alive&&c.respawnAt&&sec>=c.respawnAt){ c.alive=true; c.respawnAt=0; c.prog=0; c.by=null; c.fresh=true; }
  });
  /* ---- 미니언 ---- */
  if(now-MM.waveAt>26000) mmSpawnWave();
  MM.minions.forEach(mn=>{
    if(!mn.alive) return;
    if(sec<65) return;                     /* 1:05 웨이브 시작 */
    const dir=mn.side==='me'?1:-1;
    if(mn.super){
      /* 슈퍼 미니언은 전선 무시하고 넥서스로 밀고 들어간다 */
      mn.t=Math.max(0.004,Math.min(0.996,mn.t+dir*mn.spd*step*11));
      if(Math.random()<0.015){ const p=mmPathPoint(LANE_PATH[mn.lane],mn.t); mmAddFx({type:'spark',x:p[0],y:p[1],life:320}); }
      return;
    }
    const front=mmLaneFront(mn.lane);
    const dist=(front-mn.t)*dir;
    if(dist>0.002){ mn.t=Math.max(0,Math.min(1,mn.t+dir*mn.spd*step*14)); }
    else if(Math.random()<0.02){ const p=mmPathPoint(LANE_PATH[mn.lane],mn.t); mmAddFx({type:'spark',x:p[0]+mn.off,y:p[1],life:260}); }
  });
  /* ---- 유닛 이동 ---- */
  Object.keys(MM.units).forEach(k=>{
    const u=MM.units[k], t=MM.tgt[k]||u;
    if(!u.alive){
      if(now>u.deadUntil){
        const fountain=MM_NEXUS[u.side];
        u.x=fountain[0]; u.y=fountain[1]; u.hp=u.hpMax; u.alive=true;
        u.tp=null;
      }else return;
    }
    /* 텔레포트 채널 */
    if(u.tp){
      u.tp.left-=dSim;
      if(u.tp.left<=0){
        mmAddFx({type:'tpbeam',x1:u.x,y1:u.y,x2:u.tp.x,y2:u.tp.y,life:520,col:'#b98cff'});
        mmAddFx({type:'tpring',x:u.tp.x,y:u.tp.y,life:900,col:'#d3b6ff'});
        u.x=u.tp.x; u.y=u.tp.y; u.vx=0; u.vy=0; u.tp=null;
      }
      return;
    }
    const dx=t.x-u.x, dy=t.y-u.y, d=Math.hypot(dx,dy);
    const pulsing=!!(M.tacticPulse&&(now-M.tacticPulse.at)<2600);
    const homeguard=((M.sec||0)<18)?1.75:1;   /* 00:05~00:18 본진 가속 */
    const spd=u.step*(u.role==='JGL'?1.15:1)*(pulsing?2.6:1)*homeguard;
    let desired=[0,0];
    if(d>0.004){ desired=[dx/d*spd, dy/d*spd]; }
    const en=Object.values(MM.units).filter(o=>o.side!==u.side&&o.alive);
    let near=null,nd=9;
    en.forEach(o=>{ const dd=Math.hypot(o.x-u.x,o.y-u.y); if(dd<nd){nd=dd;near=o;} });
    if(near&&nd<0.055){
      const away=[(u.x-near.x)/nd*0.02,(u.y-near.y)/nd*0.02];
      const wob=Math.sin(now/380+k.length)*0.02;
      desired=[desired[0]*0.55+away[0]+wob*0.3, desired[1]*0.55+away[1]+Math.cos(now/420)*0.01];
      if(Math.random()<0.02) mmAddFx({type:'spark',x:u.x,y:u.y,life:300});
    }
    u.vx+=(desired[0]-u.vx)*Math.min(1,dt/90);
    u.vy+=(desired[1]-u.vy)*Math.min(1,dt/90);
    u.x=Math.max(0.03,Math.min(0.97,u.x+u.vx*step));
    u.y=Math.max(0.03,Math.min(0.97,u.y+u.vy*step));
    if(u.alive) u.hp=Math.min(u.hpMax,u.hp+step*3.5);
    /* 정글 캠프 클리어 */
    if(u.role==='JGL'&&u.mode==='jungle'&&!paused){
      const c=mmAllCamps().find(c=>Math.hypot(c.x-u.x,c.y-u.y)<0.035&&mmCampAlive(c,sec));
      if(c){
        c.prog=(c.prog||0)+dSim/(c.kind==='buff'?20:c.kind==='scuttle'?12:15);
        c.by=k;
        if(c.prog>=1){
          c.alive=false; c.prog=0; c.respawnAt=sec+c.respawn; c.by=null;
          mmAddFx({type:'burst',x:c.x,y:c.y,col:c.side==='me'?'#4fa8ff':c.side==='opp'?'#ff5570':'#ffc94a',life:800,label:c.n});
          if(typeof addGold==='function') addGold(u.side,c.kind==='buff'?170:c.kind==='scuttle'?120:130);
          if(c.side&&c.side!==u.side&&M){
            M.campSteal=M.campSteal||{me:0,opp:0};
            M.campSteal[u.side]=(M.campSteal[u.side]||0)+1;
            if(u.side==='me') M.campStealAtMe=M.minute; else M.campStealAtOpp=M.minute;
          }
          if(typeof lvAddXp==='function') lvAddXp(u.side,'JGL',c.kind==='buff'?22:c.kind==='scuttle'?16:18);
        }
      }
    }
  });
  if(Math.random()<step*2.4) mmSpawnProjectile();
  for(let i=MM.proj.length-1;i>=0;i--){
    const p=MM.proj[i];
    if(p.target&&p.target.alive){ p.tx=p.target.x; p.ty=p.target.y; }
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
    if(d<0.008||p.life>2.2){
      MM.proj.splice(i,1);
      mmAddFx({type:'hit',x:p.tx,y:p.ty,life:260,col:p.col});
      if(p.target&&p.target.alive){
        p.target.hp=Math.max(26,p.target.hp-(p.skill?6:3));
        if(p.skill) mmAddFx({type:'ring',x:p.tx,y:p.ty,col:p.col,life:420,r:0.03});
      }
      continue;
    }
    p.x+=dx/d*p.spd*step*1.6;
    p.y+=dy/d*p.spd*step*1.6;
    p.life+=step;
  }
  MM.fx=MM.fx.filter(f=>now-f.at<(f.life||600));
}

/* ---------- 그리기 ---------- */
function mmRoundRect(ctx,x,y,w,h,r){
  if(ctx.roundRect){ try{ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }catch(e){} }
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
/* 전술이 가리키는 지도 위 지점 (콜아웃·화살표용) */
function mmTacticFocus(k){
  const fo=k?FOCUS_MAP[k]:null;
  const mmB=fo?fo.mm:null;
  const out=[];
  const mine=n=>n===undefined?'me':n;
  const push=(x,y,label)=>out.push({x:clamp(x,0.05,0.95),y:clamp(y,0.05,0.95),label:label});
  if(!mmB) return out;
  if(mmB==='top'){ const p=mmLaneFrontPos('TOP','me',0.01); push(p[0],p[1],'탑 압박'); }
  else if(mmB==='topDive'){ const p=mmPathPoint(LANE_PATH.TOP,laneFrontParam('TOP',0.62)); push(p[0],p[1],'탑 다이브'); }
  else if(mmB==='diveBot'){ const p=mmPathPoint(LANE_PATH.BOT,laneFrontParam('BOT',0.62)); push(p[0],p[1],'봇 다이브'); }
  else if(mmB==='mid'){ push(0.5,0.5,'미드 주도권'); }
  else if(mmB==='invade'){ const c=MM.camps.opp[1]; push(c.x,c.y,'카운터 정글'); }
  else if(mmB==='bush'){ push(0.335,0.245,'바론 부시 매복'); }
  else if(mmB==='obj'){ const p=PIT.dragon; push(p[0],p[1],'오브젝트 집중'); }
  else if(mmB==='group'){ push(0.44,0.40,'5인 집결'); }
  else if(mmB==='split131'){ const a=mmLaneFrontPos('BOT','me',0.02), b=mmLaneFrontPos('TOP','me',0.02); push(a[0],a[1],'1-3-1'); push(b[0],b[1],'1-3-1'); }
  else if(mmB==='split14'){ const a=mmLaneFrontPos('TOP','me',0.02); push(a[0],a[1],'1-4 압박'); }
  else if(mmB==='push3'){ ['TOP','MID','BOT'].forEach(l=>{ const p=mmLaneFrontPos(l,'me',0.02); push(p[0],p[1],'3라인 푸시'); }); }
  else if(mmB==='siege'){ const p=mmLaneFrontPos('MID','me',0.02); push(p[0],p[1],'공성'); }
  else if(mmB==='flank'){ push(0.28,0.34,'측면 협공'); }
  else if(mmB==='cross'){ const p=PIT.baron; push(p[0],p[1],'크로스 교환'); }
  else if(mmB==='backdoor'){ push(0.90,0.12,'백도어'); }
  else if(mmB==='safe'){ const p=mmLaneFrontPos('MID','me',0.08); push(p[0],p[1],'안전 파밍'); }
  else if(mmB==='freeze'){ const p=mmLaneFrontPos('TOP','me',0.03); push(p[0],p[1],'프리징'); }
  else if(mmB==='swap'){ const p=mmLaneFrontPos('TOP','me',0.02); push(p[0],p[1],'라인 스왑'); }
  else if(mmB==='hold'){ push(0.42,0.58,'역갱 대기'); }
  else if(mmB==='poke'){ push(0.56,0.46,'포킹 대치'); }
  else if(mmB==='assassin'){ const p=mmLaneFrontPos('BOT','opp',0.02); push(p[0],p[1],'암살 각'); }
  return out;
}
function mmDraw(dt){
  const cv=(typeof document!=='undefined')?document.getElementById('riftCanvas'):null;
  if(!cv||!M) return;
  const wrap=cv.parentElement;
  const cssW=Math.round((wrap?wrap.clientWidth:cv.clientWidth)||320);
  const cssH=cssW;
  const dpr=Math.min(2,(typeof window!=='undefined'&&window.devicePixelRatio)||1);
  if(cv.width!==Math.round(cssW*dpr)||cv.height!==Math.round(cssH*dpr)){
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    cv.style.height=cssH+'px';
  }
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=cssW,h=cssH;
  const now=performance.now();
  const sec=mmGameSec();
  mmZoomStep(dt||16);
  const z=MM.zoom;
  ctx.save();
  ctx.translate(w/2,h/2); ctx.scale(z.s,z.s); ctx.translate(-z.cx*w,-z.cy*h);
  /* 배경 */
  if(MM.mapReady&&MM.mapImg&&MM.mapImg.complete){
    ctx.drawImage(MM.mapImg,0,0,w,h);
    ctx.fillStyle='rgba(4,8,20,.16)'; ctx.fillRect(0,0,w,h);
  }else{
    const bg=ctx.createRadialGradient(w*0.3,h*0.7,10,w*0.5,h*0.5,w*0.9);
    bg.addColorStop(0,'#0b1a16'); bg.addColorStop(1,'#05090f');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(26,66,50,.75)';
    ctx.beginPath(); ctx.moveTo(0,h*0.30); ctx.lineTo(w*0.20,h*0.10); ctx.lineTo(w*0.42,h*0.34);
    ctx.quadraticCurveTo(w*0.40,h*0.55,w*0.30,h*0.62); ctx.lineTo(w*0.30,h*0.92);
    ctx.lineTo(0,h*0.92); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(58,38,74,.7)';
    ctx.beginPath(); ctx.moveTo(w,h*0.70); ctx.lineTo(w*0.80,h*0.90); ctx.lineTo(w*0.58,h*0.66);
    ctx.quadraticCurveTo(w*0.60,h*0.45,w*0.70,h*0.38); ctx.lineTo(w*0.70,h*0.08);
    ctx.lineTo(w,h*0.08); ctx.closePath(); ctx.fill();
    const wall=(x,y,ww,hh,col)=>{ const r=3;
      mmRoundRect(ctx,x*w,y*h,ww*w,hh*h,r); ctx.fillStyle=col; ctx.fill();
      ctx.strokeStyle='rgba(150,220,190,.16)'; ctx.lineWidth=1; ctx.stroke();
    };
    MAP_WALLS.me.forEach(([x,y,ww,hh])=>wall(x,y,ww,hh,'rgba(9,32,25,.95)'));
    MAP_WALLS.opp.forEach(([x,y,ww,hh])=>wall(x,y,ww,hh,'rgba(28,16,38,.95)'));
    MAP_BRUSH.forEach(([x,y])=>{
      ctx.beginPath(); ctx.ellipse(x*w,y*h,w*0.035,h*0.022,0.5,0,7);
      ctx.fillStyle='rgba(70,160,90,.35)'; ctx.fill();
      ctx.strokeStyle='rgba(140,230,160,.25)'; ctx.lineWidth=.8; ctx.stroke();
    });
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(30,110,170,.45)'; ctx.lineWidth=Math.max(20,w*0.09);
    ctx.beginPath(); ctx.moveTo(w*0.10,h*0.22);
    ctx.bezierCurveTo(w*0.32,h*0.30,w*0.44,h*0.46,w*0.50,h*0.50);
    ctx.bezierCurveTo(w*0.58,h*0.56,w*0.68,h*0.68,w*0.88,h*0.80); ctx.stroke();
    ctx.strokeStyle='rgba(90,200,255,.20)'; ctx.lineWidth=Math.max(8,w*0.035);
    ctx.beginPath(); ctx.moveTo(w*0.10,h*0.22);
    ctx.bezierCurveTo(w*0.32,h*0.30,w*0.44,h*0.46,w*0.50,h*0.50);
    ctx.bezierCurveTo(w*0.58,h*0.56,w*0.68,h*0.68,w*0.88,h*0.80); ctx.stroke();
  }
  /* 오브젝트 핏 알코브 */
  const alcove=(x,y,col,r2)=>{ ctx.beginPath(); ctx.arc(x*w,y*h,r2,0,7);
    ctx.fillStyle='rgba(8,14,22,.9)'; ctx.fill(); ctx.strokeStyle=col+'77'; ctx.lineWidth=1.4; ctx.stroke(); };
  alcove(PIT.dragon[0],PIT.dragon[1],'#ff8a5c',Math.max(13,w*0.05));
  alcove(PIT.baron[0],PIT.baron[1],'#b98cff',Math.max(13,w*0.05));
  /* 기지 */
  const basePlate=(x,y,col)=>{
    ctx.save(); ctx.translate(x*w,y*h);
    mmRoundRect(ctx,-w*0.075,-h*0.055,w*0.15,h*0.11,6);
    ctx.fillStyle='rgba(12,22,34,.95)'; ctx.fill(); ctx.strokeStyle=col+'88'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,Math.max(7,w*0.028),0,7); ctx.fillStyle=col; ctx.globalAlpha=.9; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.restore();
  };

    ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=1; ctx.strokeRect(px,py,pw,ph);
    ctx.restore();
  }
  /* ---------- HUD ---------- */
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(6,6,Math.max(96,w*0.42),18);
  ctx.fillStyle=MM.phase==='fight'?'#ffc94a':MM.phase==='obj'?'#ff9e2c':'#8bd6ff';
  ctx.font=`900 ${Math.round(w*0.028)}px sans-serif`;
  const mm2=String(Math.floor((M.minute||0)/60)).padStart(2,'0'), ss2=String((M.minute||0)%60).padStart(2,'0');
  ctx.fillText(MM.phaseLabel+' · '+mm2+':'+ss2,12,10);
  ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(w-76,6,70,18);
  ctx.fillStyle='#9fb2cc'; ctx.font=`800 ${Math.round(w*0.024)}px sans-serif`; ctx.textAlign='right';
  ctx.fillText(M.kills[0]+' : '+M.kills[1],w-12,10);
  ctx.textAlign='left';
  let hudY=26;
  if(M.soulGranted&&(M.soulGranted.me||M.soulGranted.opp)){
    const str='💠 '+(M.soulGranted.me?myTeam().tag:T(M.oppId).tag);
    ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(6,hudY,Math.max(60,w*0.2),15);
    ctx.fillStyle='#c4b1ff'; ctx.font=`800 ${Math.round(w*0.022)}px sans-serif`;
    ctx.fillText(str,11,hudY+2);
    hudY+=17;
  }
  /* 시야 점수 HUD (와드싸움) */
  {
    const v=M.vision||[0,0];
    const wm=(M.visionWar&&M.visionWar.wards)?M.visionWar.wards:{me:[],opp:[]};
    const str='👁 시야 '+Math.round(v[0])+' : '+Math.round(v[1])+'  ·  와드 '+(wm.me||[]).length+' : '+(wm.opp||[]).length;
    ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(6,hudY,Math.max(96,w*0.44),15);
    ctx.fillStyle='#9fe8c8'; ctx.font=`800 ${Math.round(w*0.022)}px sans-serif`;
    ctx.fillText(str,11,hudY+2);
    hudY+=17;
  }
  /* 바론 버프 · 억제기 상태 */
  {
    const parts=[];
    ['me','opp'].forEach(side=>{
      const b=(M.baronBuff&&M.baronBuff[side]!=null)?M.baronBuff[side]:-1;
      if(b>=((M.minute||0))) parts.push('🟣'+(side==='me'?myTeam().tag:T(M.oppId).tag)+' '+(b-(M.minute||0))+'분');
    });
    const inh=(typeof v5SuperLanes==='function')?v5SuperLanes():{me:[],opp:[]};
    if(inh.me.length) parts.push('🟡 슈퍼 '+inh.me.join('/'));
    if(inh.opp.length) parts.push('🔴 슈퍼 '+inh.opp.join('/'));
    if(parts.length){
      const str=parts.join(' · ');
      ctx.fillStyle='rgba(5,8,14,.75)'; ctx.fillRect(6,hudY,Math.max(90,w*0.42),15);
      ctx.fillStyle='#d9c2ff'; ctx.font=`800 ${Math.round(w*0.021)}px sans-serif`;
      ctx.fillText(str,11,hudY+2);
      hudY+=17;
    }
  }
  /* ---------- 호버 오버레이 ---------- */
  if(MM.hover&&now-MM.hover.at<6000){
    let best=null,bd=0.055;
    Object.keys(MM.units).forEach(k=>{
      const u=MM.units[k];
      const d=Math.hypot(u.x-MM.hover.x,u.y-MM.hover.y);
      if(d<bd){ bd=d; best=k; }
    });
    if(best){
      const u=MM.units[best];
      const line=lineupAt(u.side,u.role)||{};
      const lv=(typeof lvOf==='function')?lvOf(u.side,u.role):1;
      const kd=(MM.kda&&MM.kda[best])||{k:0,d:0,a:0};
      const rows=[
        (line.name||'—')+' · Lv.'+lv,
        (line.champ||ROLE_KR[u.role])+' · '+ROLE_KR[u.role],
        'KDA '+kd.k+'/'+kd.d+'/'+kd.a+' · HP '+Math.round(u.hp)+'%',
      ];
      ctx.font=`800 ${Math.max(8,Math.round(w*0.022))}px Pretendard,sans-serif`;
      const bw2=Math.max(...rows.map(r=>ctx.measureText(r).width))+14;
      const bh2=rows.length*14+10;
      let bx=u.x*w+12, by=u.y*h-12;
      if(bx+bw2>w-4) bx=u.x*w-bw2-12;
      if(by<4) by=4; if(by+bh2>h-4) by=h-bh2-4;
      mmRoundRect(ctx,bx,by,bw2,bh2,6);
      ctx.fillStyle='rgba(4,8,16,.92)'; ctx.fill();
      ctx.strokeStyle=u.side==='me'?'rgba(79,168,255,.8)':'rgba(255,85,112,.8)'; ctx.lineWidth=1.2; ctx.stroke();
      ctx.textAlign='left'; ctx.textBaseline='top';
      rows.forEach((r,i)=>{ ctx.fillStyle=i===0?(u.side==='me'?'#bdf0ff':'#ffc2cd'):'#c9d4e6'; ctx.fillText(r,bx+7,by+6+i*14); });
    }
  }
}

let MMDOM={key:null, ev:null, kills:[0,0], towers:[0,0], obj:null, banterAt:null};
let MMFAST=false;
function champImg(name,size,cls){
  const c=CHAMP_MAP[name];
  if(!c) return `<span class="cimg ph ${cls||''}" style="width:${size}px;height:${size}px">${esc((name||'?').slice(0,1))}</span>`;
  return `<img class="cimg ${cls||''}" src="${DD(c.k)}" alt="${esc(name)}" style="width:${size}px;height:${size}px" loading="lazy">`;
}
function sideTag(side){ return side==='me'?myTeam().tag:T(M.oppId).tag; }
function kdStr(k,d,a){ return k+'/'+d+'/'+a; }
function mmKdaInit(){
  MM.kda={};
  ROLES.forEach(r=>{
    MM.kda['me-'+r]={k:0,d:0,a:0,cs:0,dpm:0};
    MM.kda['opp-'+r]={k:0,d:0,a:0,cs:0,dpm:0};
  });
}
function mmKdaTick(){
  if(!MM.kda) mmKdaInit();
  ['me','opp'].forEach((side,idx)=>{
    const cur=M.kills[idx]||0, prev=MMDOM.kills[idx]||0;
    if(cur>prev){
      for(let n=0;n<Math.min(cur-prev,2);n++){
        const killers=ROLES.filter(r=>(MM.units[side+'-'+r]||{}).alive);
        const victims=ROLES.filter(r=>(MM.units[(side==='me'?'opp':'me')+'-'+r]||{}).alive);
        const k=killers.length?pickOf(killers):null;
        const v=victims.length?pickOf(victims):null;
        if(k){ MM.kda[side+'-'+k].k++; }
        if(v){ const vs=side==='me'?'opp':'me'; MM.kda[vs+'-'+v].d++; }
        killers.filter(r=>r!==k).slice(0,2).forEach(r=>{ MM.kda[side+'-'+r].a++; });
      }
    }
  });
  /* 실시간 CS · DPM (매 프레임 갱신) */
  const sec=M.sec||0;
  ROLES.forEach(r=>{
    ['me','opp'].forEach(side=>{
      const row=MM.kda[side+'-'+r]; if(!row) return;
      row.cs=(typeof stat5LiveCs==='function')?stat5LiveCs(side,r,sec):0;
      row.dpm=(typeof stat5LiveDpm==='function')?stat5LiveDpm(side,r):0;
    });
  });
  MMDOM.kills=(M.kills||[0,0]).slice();
}
function mmClockStr(){
  const sec=(M.sec!=null)?M.sec:(M.minute*60);
  const mm=Math.floor(sec/60), ss=Math.floor(sec%60);
  return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function mGoldK(v){ return (v/1000).toFixed(1)+'k'; }

/* ---- 해설 반복 방지: 경기별 사용 이력 + 시나리오 쿨다운 ---- */
const CASTMEM={hist:[],last:[null,null],scnAt:{},scnLast:null,at:{},n:0,banterLast:[null,null]};
const CASTCACHE={key:null,lines:['',''],evN:-1,sec:-1};
function castReset(){ CASTMEM.hist=[]; CASTMEM.last=[null,null]; CASTMEM.scnAt={}; CASTMEM.scnLast=null; CASTMEM.at={}; CASTMEM.n=0; CASTMEM.banterLast=[null,null]; CASTMEM.rot=0; CASTCACHE.key=null; CASTCACHE.evN=-1; CASTCACHE.sec=-1; CASTCACHE.lines=null; }
function castPick(pool,tag,avoid){
  if(!pool||!pool.length) return '';
  CASTMEM.n=(CASTMEM.n||0)+1;
  const hist=CASTMEM.hist;
  const av=avoid||[];
  const cool=l=>{ const t=CASTMEM.at[l]; return t===undefined?-1:t; };
  let cands=pool.filter(l=>hist.indexOf(l)<0 && av.indexOf(l)<0 && l!==CASTMEM.last[1]);
  if(!cands.length) cands=pool.filter(l=>av.indexOf(l)<0 && l!==CASTMEM.last[1] && l!==CASTMEM.last[0]);
  if(!cands.length) cands=pool.filter(l=>l!==CASTMEM.last[1]);
  if(!cands.length) cands=pool.slice();
  /* 가장 오래 안 쓴 문장 우선(least-recently-used), 동률은 무작위 */
  cands=cands.slice().sort((a,b)=>cool(a)-cool(b));
  const line=cands[0];
  CASTMEM.at[line]=CASTMEM.n;
  hist.push(line);
  if(hist.length>24) hist.shift();
  CASTMEM.last[0]=CASTMEM.last[1]; CASTMEM.last[1]=line;
  return line;
}
function lastEventText(){ const e=(M.events||[]).find(x=>x.kind!=='sys'); return e?e.text.replace(/<[^>]+>/g,''):''; }
/* 이번 분에 새로 생긴 이벤트만 사용 (같은 이벤트를 매분 읽지 않기) */
function freshEvent(){
  const e=(M.events||[]).find(x=>x.kind!=='sys');
  if(!e) return null;
  return (e.minute===M.minute)?e:null;
}
function castScenarios(){
  const m=M.minute||0, sec=M.sec||0;
  const gd=M.gold[0]-M.gold[1], kd=M.kills[0]-M.kills[1];
  const ev=freshEvent(); const evt=ev?ev.text.replace(/<[^>]+>/g,''):'';
  const keys=[];
  if(/텔레포트|TP/.test(evt)||(M.tpAt!=null&&m-M.tpAt<=1)) keys.push('tp');
  if(/스틸|강타/.test(evt)) keys.push('steal');
  if(/바론/.test(evt)&&/처치/.test(evt)) keys.push('baron');
  if(/바위게|게 하나/.test(evt)) keys.push('scuttle');
  if(/억제기|슈퍼 미니언/.test(evt)) keys.push('inhib');
  if(/바론 버프|공성/.test(evt)) keys.push('siege');
  if(/교차 이득|사이드 타워/.test(evt)) keys.push('trade');
  if(/시야 매복|픽오프|제어와드/.test(evt)) keys.push('vision');
  if(/솔로킬/.test(evt)) keys.push('solo');
  if(/한타/.test(evt)) keys.push('clutch');
  if(/드래곤|유충|전령/.test(evt)) keys.push('obj');
  if(/다이브/.test(evt)) keys.push(gd<0?'fail':'dive');
  if(/킬/.test(evt)) keys.push('kill');
  if(m<=2) keys.push('invade');
  if(M.campSteal&&((M.campSteal.me>0&&m-(M.campStealAtMe||-9)<=2)||(M.campSteal.opp>0&&m-(M.campStealAtOpp||-9)<=2))) keys.push('counterJgl');
  const diveKey=(M.focusKey==='topDive'||M.focusKey==='botDive');
  if(diveKey&&m>2) keys.push((M.kills[0]-(M.diveKills0||0))>=(M.kills[1]-(M.diveKills1||0))?'dive':'fail');
  if(m>=18&&(Math.abs(m-20)<=2||Math.abs(m-26)<=2||m>=31)) keys.push('baron');
  if(M.soulGranted&&(M.soulGranted.me||M.soulGranted.opp)) keys.push('soul');
  if(mmObjectiveWindow(m)) keys.push('obj');
  if(Math.abs(gd)>3000&&kd<0) keys.push('throw');
  if(m>=12&&(()=>{const d=MM.kda?ROLES.reduce((a,r)=>a+((MM.kda['me-'+r]||{}).d||0),0):0;return d>=7;})()) keys.push('int');
  if(m<14&&Math.abs(gd)>400) keys.push('cs');
  if((M.fights[0]+M.fights[1])>0&&M.focusUntil>m) keys.push('fight');
  if(m>=28) keys.push('late');
  if(m<1) keys.push('intro');
  if(!keys.length) keys.push(m<14?'cs':'lane');
  return keys;
}
function casterLines(){
  if(!M) return ['',''];
  const m=M.minute||0, sec=M.sec||0, evN=(M.events||[]).length;
  if(CASTCACHE.key!==null && CASTCACHE.evN===evN && sec-(CASTCACHE.sec||0)<12) return CASTCACHE.lines;
  const keys=castScenarios();
  let key=null;
  for(let i=0;i<keys.length;i++){
    const k=keys[i];
    if(k===CASTMEM.scnLast) continue;
    const at=CASTMEM.scnAt[k];
    if(at===undefined||m-at>=3){ key=k; break; }
  }
  if(!key){ key=keys.find(k=>k!==CASTMEM.scnLast)||keys[0]||'lane'; }
  CASTMEM.scnAt[key]=m; CASTMEM.scnLast=key;
  const ev=freshEvent();
  let lines;
  if(ev&&key!=='intro') lines=castEventLine(ev,key);
  else lines=castStateLines(key);
  let lead=lines[0], analyst=lines[1];
  /* 같은 문장이 연속으로 나가지 않도록 회전 */
  if(CASTCACHE.lines&&lead===CASTCACHE.lines[0]&&!ev){
    for(let i=0;i<4&&lead===CASTCACHE.lines[0];i++){
      const l2=castStateLines(key+'#'+i); lead=l2[0]; analyst=l2[1];
    }
  }
  if(analyst===lead) analyst=castStateLines(key+'!')[1];
  CASTCACHE.key=key; CASTCACHE.evN=evN; CASTCACHE.sec=sec; CASTCACHE.lines=[lead,analyst];
  return CASTCACHE.lines;
}

function castMapLines(f){
  if(f.m>=28) return ['30분을 바라보는 시점입니다, 이제 한 번의 실수가 경기를 끝냅니다'];

function castStateLines(tag){
  const f=castFacts();
  const groups=[castGoldLines(f),castKillLines(f),castObjLines(f),castNextLines(f),castMapLines(f)];
  const gi=(CASTMEM.rot=(CASTMEM.rot||0)+1)%groups.length;
  const gj=(gi+1)%groups.length;
  const lead=castPick(groups[gi],'state-'+tag+gi);
  let analyst=castPick(groups[gj],'stateA-'+tag+gj);
  if(analyst===lead) analyst=castPick(groups[(gj+1)%groups.length],'stateB-'+tag+gj);
  return [lead,castClock()+', '+analyst];
}
function castEventLine(ev,key){
  const f=castFacts();
  const raw=String(ev.text||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  const inter=['자아~!!','와!','아니','여기서','터졌습니다!'];
  const lead=castClock()+', '+castPick(inter,'int')+' '+raw;
  const tail=f.gd>=300?(f.me+' '+castK(f.gd)+' 리드'):f.gd<=-300?(f.me+' '+castK(-f.gd)+' 열세'):('골드 차 '+castK(Math.abs(f.gd)));
  const analyst=(f.meK+' 대 '+f.opK+' 킬, '+tail+'. 다음은 '+f.next.name+' '+(f.next.at||'-')+'분입니다');
  return [lead,castClock()+', '+analyst];
}
/* 2분 해설 한마디 — 같은 문장이 다시 나오지 않도록 별도 이력 사용 */
function castBanter(){
  if(!M) return null;
  const who=Math.random()<0.5?'클템':'전용준';
  const f=castFacts();
  const pool=[].concat(castGoldLines(f),castKillLines(f),castObjLines(f),castNextLines(f));
  const avoid=(CASTMEM.banterLast||[]).filter(Boolean);
  const line=castPick(pool,'banter-'+who,avoid);
  if(!line) return null;
  CASTMEM.banterLast=[line,(CASTMEM.banterLast||[])[0]||null];
  return {who:who, line:line};
}

function buildPstats(){
  const meWin=!!M.meWin;
  const mins=Math.max(12,M.minute||30);
  const rnd2=(a,b)=>a+Math.random()*(b-a);
  const sideOf=(sd)=>{

    const deaths=M.kills[sd==='me'?1:0]||0;
    const totK=Math.max(1,kills);
    const rows=ROLES.map(r=>{
      const l=lineupAt(sd,r);
      const p=S.players[l.name];
      const ovr=p?rawOverall(p):70;
      const wgt=(ovr-60)/40+(r==='ADC'||r==='MID'?0.35:0);
      return {role:r, name:l.name||ROLE_KR[r], champ:l.champ, ovr:ovr, w:Math.max(0.15,wgt)};
    });
    const wsum=rows.reduce((a,x)=>a+x.w,0)||1;
    // 킬 분배
    let kLeft=totK;
    rows.forEach((x,i)=>{
      const share=Math.round(totK*x.w/wsum);
      x.k=i===rows.length-1?Math.max(0,kLeft):Math.min(kLeft,Math.max(0,share));
      kLeft-=x.k;
    });
    // 데스 분배 (팀 데스 수를 정확히 나눔)
    let dLeft=deaths;
    const dw=rows.map(x=>({x:x,w:x.role==='SUP'?0.7:x.role==='TOP'?1.2:1}));
    const dwSum=dw.reduce((a,o)=>a+o.w,0)||1;
    dw.forEach((o,i)=>{
      const share=Math.round(deaths*o.w/dwSum*rnd2(0.7,1.3));
      o.x.d=i===dw.length-1?Math.max(0,dLeft):Math.min(dLeft,Math.max(0,share));
      dLeft-=o.x.d;
    });
    rows.forEach(x=>{
      const role=x.role;
      x.a=Math.max(0,Math.round(totK*rnd2(0.35,0.8)));
      x.kp=Math.min(100,Math.round((x.k+x.a)/Math.max(1,totK)*100));
      const roleDpm={TOP:520,JGL:430,MID:640,ADC:700,SUP:180}[role]||500;
      x.dpm=clamp(Math.round(roleDpm*(win?1.08:0.92)*rnd2(0.85,1.15)*((x.ovr-65)/26+0.92)),150,1050);
      x.tc=Math.round(rnd2(45,120)*(role==='TOP'?1:0.6));
      x.gsr=role==='JGL'?Math.round(rnd2(420,620)):Math.round(rnd2(6,9));
      x.vc=role==='SUP'?Math.round(rnd2(40,80)):Math.round(rnd2(15,45));
      const csm=({TOP:8.4,JGL:5.4,MID:9.0,ADC:9.2,SUP:1.6})[role]||8;
      x.cs=Math.round(csm*mins*rnd2(0.9,1.1));
      x.csm=Math.round((x.cs/Math.max(1,mins))*10)/10;
      x.solo=role==='SUP'?0:(Math.random()<0.18?1:0);
      x.won=(sd==='me')===meWin;
      x.champ=x.champ||'';
      x.rating=Math.round(clamp(6+(x.k*0.5+x.a*0.22-x.d*0.4)/Math.max(1,totK/3)+(win?1.1:0),4,10)*10)/10;
    });
    return rows;
  };
  const me=sideOf('me'), opp=sideOf('opp');
  const winner=meWin?'me':'opp';
  const pool=(winner==='me'?me:opp).slice().sort((a,b)=>b.rating-a.rating);
  const mvp=pool[0];
  if(mvp) mvp.pog=true;
  M.pstats={me:me, opp:opp, mvp:mvp, win:meWin};
  try{ if(typeof statApplyMyGame==='function') statApplyMyGame(); }catch(e){}
  return M.pstats;
}

function drawBoxGold(){
  const cv=$('boxGold'); if(!cv||!M) return;
  const w=cv.clientWidth||320, h=140, dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const hist=(M.history&&M.history.length>1)?M.history:[{min:0,diff:0},{min:M.minute||1,diff:0}];
  const span=Math.max(20,M.minute);
  const maxAbs=Math.max(3000,...hist.map(p=>Math.abs(p.diff)))*1.25;
  const X=m=>6+(m/span)*(w-12), Y=d=>h/2-(d/maxAbs)*(h/2-10);
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){ const y=h*i/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
  const pts=hist.map(p=>[X(Math.min(p.min,span)),Y(p.diff)]);
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(79,168,255,.35)'); g.addColorStop(.5,'rgba(79,168,255,.02)'); g.addColorStop(1,'rgba(255,85,112,.02)');
  ctx.beginPath(); ctx.moveTo(pts[0][0],h/2); pts.forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.lineTo(pts[pts.length-1][0],h/2); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle='#8fd0ff'; ctx.lineWidth=2; ctx.stroke();
  // 이벤트 마커
  (M.events||[]).filter(e=>/드래곤|바론|전령|유충|타워|킬|교전/.test(e.text)).slice(0,24).forEach(e=>{
    const p=hist.reduce((a,b)=>Math.abs(b.min-e.minute)<Math.abs(a.min-e.minute)?b:a,hist[0]);
    const x=X(Math.min(p.min,span)), y=Y(p.diff);
    ctx.fillStyle=/드래곤|바론|전령|유충/.test(e.text)?'#ffc94a':/타워/.test(e.text)?'#9fe4ff':'#ff8095';
    ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill();
  });
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.font='9px sans-serif';
  ctx.fillText('+'+(maxAbs/1000).toFixed(0)+'K',6,12);
  ctx.fillText('-'+(maxAbs/1000).toFixed(0)+'K',6,h-4);
}

function playoffAction(){
  const um=nextUserPlayoffMatch();
  if(um){
    const oppId=um.m.a===S.userTeam?um.m.b:um.m.a;
    const s=createSeries(oppId,5,'playoff',{match:um.m,roundName:um.rd.name});
    saveGame();
    startDraft(s);
    return;
  }
  const r=playoffNext();
  if(r.action==='done'){
    if(S.phase==='worlds'){ renderWorlds(); return; }
    renderChampion(); return;
  }
  if(r.action==='user'){
    const oppId=r.match.a===S.userTeam?r.match.b:r.match.a;
    const s=createSeries(oppId,5,'playoff',{match:r.match,roundName:r.roundName});
    saveGame(); startDraft(s); return;
  }
  renderPlayoffs(); toast('다른 경기 결과가 반영됐습니다');
}
function renderAfterSeries(){
  if(S.phase==='end'){ renderChampion(); return; }
  if(S.phase==='worlds'){ renderWorlds(); return; }
  if(S.phase==='playoffs'){ renderPlayoffs(); return; }
  TAB='home'; renderHub();
}

function worldsRecordRows(){
  const W=S.worlds;
  const ids=W.teams.slice().sort((a,b)=>{
    const ra=W.rec[a], rb=W.rec[b];
    return (rb.w-ra.w)||(ra.l-rb.l)||(teamPowerRaw(T(b))-teamPowerRaw(T(a)));
  });
  return ids.map((id,i)=>{
    const t=T(id), r=W.rec[id];
    const q=W.qualified.includes(id), e=W.eliminated.includes(id);

        <div class="row between"><div><div class="tiny">월즈 우승</div><div style="font-weight:900;font-size:18px;color:var(--gold)">${esc(T(W.champion).name)}</div></div>${badge(T(W.champion),'lg')}</div>
        <div class="row between" style="margin-top:6px"><span class="tiny">준우승</span><b style="font-size:12px">${esc(T(W.runnerUp).name)}</b></div>
        <div class="row between" style="margin-top:3px"><span class="tiny">우리 팀</span><b style="font-size:12px">${esc(place)}</b></div>
      </div>
      <button class="btn gold block" id="champBtn">시즌 결산 보기 →</button>
    `:`
      ${myMatch?`<div class="card" style="border-color:rgba(37,224,255,.5)">
        <div class="card-h"><h4>${esc(rd.name)} · 우리 경기</h4><span class="k">Bo${myMatch.bo||1}</span></div>
        <div class="row between" style="margin-bottom:10px">
          <div class="row" style="gap:7px">${badge(myTeam())}<b>${esc(myTeam().tag)}</b></div>
          <span class="chip sm">VS</span>
          <div class="row" style="gap:7px"><b>${esc(T(myMatch.a===S.userTeam?myMatch.b:myMatch.a).tag)}</b>${badge(T(myMatch.a===S.userTeam?myMatch.b:myMatch.a))}</div>
        </div>
        <button class="btn primary block" id="worldsPlay">경기 시작 · 밴픽</button>
      </div>`:`
      <div class="card">
        <div class="card-h"><h4>${W.userIn?'다음 경기':'관전 모드'}</h4><span class="k">${month}</span></div>
        <div class="tiny" style="margin-bottom:10px">${W.userIn?'다른 경기를 시뮬레이션하고 다음 라운드로 진행합니다.':'우리 팀은 월즈에 진출하지 못했습니다. 대회를 관전하세요.'}</div>
        <button class="btn primary block" id="worldsPlay">경기 진행</button>
        <button class="btn sm block" id="worldsSimAll" style="margin-top:6px">대회 전체 자동 진행 ⏩</button>
      </div>`}
    `}
    <div class="card">
      <div class="card-h"><h4>월즈 참가팀</h4><span class="k">16팀</span></div>
      <div class="stack" style="gap:3px">
        ${W.teams.map(id=>{const t=T(id);return `<div class="kv"><span>${badge(t,'sm')} ${esc(t.name)} <i class="tiny">${esc(t.region)}</i></span><b style="font-size:11px">${esc(teamStar(t))}</b></div>`;}).join('')}
      </div>
    </div>
    <div style="height:10px"></div>`;
  const wp=$('worldsPlay'); if(wp) wp.onclick=()=>worldsAction();
  const wa=$('worldsSimAll'); if(wa) wa.onclick=()=>{ worldsSimAll(); };
  const cb=$('champBtn'); if(cb) cb.onclick=()=>renderChampion();
  show('worlds');
}
function teamStar(t){
  const ps=ROLES.map(r=>S.players[t.lineup[r]]).filter(Boolean);
  const s=ps.sort((a,b)=>rawOverall(b)-rawOverall(a))[0];
  return s? s.name+' · '+playName(s):'';
}
function worldsAction(){
  const r=worldsNext();
  if(r.action==='user'){
    const s=worldsSeries(r.match,r.roundName);
    saveGame();
    startDraft(s);
    return;
  }
  if(r.action==='done'){ renderChampion(); return; }
  renderWorlds();
  if(r.action==='advanced') toast('다음 라운드로 진행합니다');
}
function worldsSimAll(){
  let guard=0;
  while(!S.worlds.done && guard++<80){
    const W=S.worlds;
    let rd=null;
    if(W.stage==='swiss') rd=W.rounds[W.rounds.length-1];
    else if(W.bracket) rd=W.bracket.rounds[W.bracket.round];
    if(!rd) break;
    let any=false;
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b){ simWorldsMatch(m); any=true; } });
    if(!any) break;
    if(W.stage==='swiss') worldsCloseRound();
    else { const ar=worldsAdvanceBracket(); if(ar.action==='done') break; }
  }
  saveGame();
  if(S.phase==='end') renderChampion(); else renderWorlds();
}

/* ---------- champion / season end ---------- */
function renderChampion(){
  const W=S.worlds;
  const isWorlds=!!(W&&W.champion);
  const champ=T(isWorlds?W.champion:(S.champion||S.userTeam));
  const runner=T(isWorlds?W.runnerUp:(S.runnerUp||S.champion));
  const lckChamp=S.lckChampion?T(S.lckChampion):null;
  const st=standings();
  const myPos=st.findIndex(t=>t.id===S.userTeam)+1;
  const isMe=(isWorlds?W.champion===S.userTeam:S.champion===S.userTeam);
  const placeTxt=isWorlds?worldsUserPlace():(isMe?'1위 · 우승':(S.myExit?S.myExit.round+' 탈락':'플레이오프 탈락'));
  const colors=['#25e0ff','#8b5cf6','#ffc94a','#3ddc97','#ff4d6d','#ff9e2c','#7cf7ff','#c4b1ff'];
  const conf=Array.from({length:26},(_,i)=>`<i style="left:${(i*4+Math.random()*3)%100}%;background:${colors[i%colors.length]};animation-duration:${2.4+Math.random()*2}s;animation-delay:${Math.random()*2}s"></i>`).join('');
  const pogTop=Object.entries(S.pog||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const hist=(S.worldsHistory||[]).slice(-4).reverse();
  $('view-champion').innerHTML=`
    <div class="trophy">
      <div class="confetti">${conf}</div>
      <div class="cup">${isWorlds?'🏆':'🥇'}</div>
      <div class="kicker" style="font-size:10px">${isWorlds?'WORLDS '+S.season+' CHAMPION':'LCK '+S.season+' SEASON CHAMPION'}</div>
      <h2>${esc(champ?champ.name:'-')}</h2>
      <div class="tiny" style="margin-top:6px">${isMe?'당신이 이끌어낸 우승입니다':(isWorlds?'결승 상대: '+esc(runner?runner.name:''):'결승 상대: '+esc(runner?runner.name:''))}</div>
    </div>
    <div class="card">
      <div class="row between">
        <div><div class="tiny">최종 성적</div><div style="font-weight:900;font-size:18px">${esc(placeTxt)}</div></div>
        ${badge(champ,'xl')}
      </div>
      <div class="divider"></div>
      <div class="kv"><span>LCK 스프링</span><b>${esc(S.springChampion?T(S.springChampion).name:'-')}</b></div>
      <div class="kv"><span>LCK 서머</span><b>${esc(S.summerChampion?T(S.summerChampion).name:'-')}</b></div>
      <div class="kv"><span>MSI</span><b>${esc(S.msiChampion?T(S.msiChampion).name:'-')}</b></div>
      <div class="kv"><span>EWC</span><b>${esc(S.ewcChampion?T(S.ewcChampion).name:'-')}</b></div>
      <div class="kv"><span>월즈</span><b>${W&&W.champion?esc(T(W.champion).tag)+' 우승':'진출 실패'}</b></div>
      <div class="kv"><span>정규시즌</span><b>${myPos}위 · ${myTeam().wins}승 ${myTeam().losses}패</b></div>
      <div class="kv"><span>POG 포인트</span><b>${Object.keys(S.players).filter(n=>S.players[n].team===S.userTeam).reduce((a,n)=>a+(S.pog[n]||0),0)}</b></div>
      <div class="kv"><span>시즌 예산</span><b>${myTeam().budget.toFixed(1)}억</b></div>
    </div>
    ${hist.length?`<div class="card">
      <div class="card-h"><h4>월즈 히스토리</h4><span class="k">최근 ${hist.length}회</span></div>
      ${hist.map(h=>`<div class="slide-item"><div class="fa-rank">${h.season}</div><div class="grow"><div style="font-size:12.5px;font-weight:800">${esc(T(h.champion).name)}</div><div class="tiny">준우승 ${esc(T(h.runnerUp).name)}</div></div><span class="chip sm">${esc(h.place||'')}</span></div>`).join('')}
    </div>`:''}
    <div class="card">
      <div class="card-h"><h4>시즌 POG 랭킹</h4><span class="k">TOP 5</span></div>
      ${pogTop.map(([n,v],i)=>`<div class="slide-item"><div class="fa-rank">${i+1}</div><div class="grow"><div style="font-size:12.5px;font-weight:800">${esc(n)}</div><div class="tiny">${esc((S.teams[(S.players[n]||{}).team]||{tag:'FA'}).tag)}</div></div><b style="color:var(--gold)">${v}</b></div>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn" id="toTitle">타이틀로</button>
      <button class="btn primary" id="toOffseason">스토브리그 →</button>
    </div>
    <div style="height:14px"></div>`;
  $('toTitle').onclick=()=>{ S=null; renderTitle(); };
  $('toOffseason').onclick=()=>{ startOffseason(); };
  show('champion');
}

/* ---------- offseason (스토브리그) ---------- */
function renderOffseason(){
  const O=S.offseason||{players:[],staff:[]};
  const t=myTeam();
  const expPlayers=(O.players||[]).map(n=>S.players[n]).filter(Boolean);
  const expStaff=(O.staff||[]).map(id=>S.staffLib[id]).filter(Boolean);
  $('view-offseason').innerHTML=`
    <div class="hero" style="padding:20px 16px 6px">
      <div class="kicker">OFFSEASON · STOVE LEAGUE</div>
      <h1 style="font-size:26px">스토브리그</h1>
      <p>계약이 만료된 선수·코치를 재계약하거나 FA로 보내세요.<br>결정하지 않으면 자동으로 FA가 됩니다.</p>

      <div class="staff-card">
        <div class="row between">
          <div class="row" style="gap:8px">
            <div class="p-avatar">${esc(p.name.slice(0,1))}</div>
            <div><div style="font-weight:900;font-size:14px">${esc(p.name)} <span class="role-tag">${ROLE_KR[p.role]}</span><span class="grade ${p.grade}">${p.grade}</span></div>
            <div class="tiny">${p.age}세 · ${rawOverall(p)} · 연봉 ${p.salary}억 · ${esc(playName(p))}</div></div>
          </div>
          <div class="row" style="gap:4px">
            <input class="inp sm" type="number" step="0.5" min="0.5" data-rsal="${esc(p.name)}" value="${stoveDemand(p,2)}" title="제시 연봉(억)">
            <select class="mini-select" data-py="${esc(p.name)}"><option value="1">1년</option><option value="2" selected>2년</option><option value="3">3년</option></select>
            <button class="btn sm primary" data-signp="${esc(p.name)}">재계약</button>
            <button class="btn sm danger" data-fap="${esc(p.name)}">FA</button>
          </div>
        </div>
        <div class="tag-row" style="margin-top:5px">${(p.good||[]).slice(0,4).map(id=>{const tr=TRAIT_MAP[id];return tr?`<span class="tr good">${esc(tr.n)}</span>`:'';}).join('')}${(p.bad||[]).slice(0,2).map(id=>{const tr=TRAIT_MAP[id];return tr?`<span class="tr bad">${esc(tr.n)}</span>`:'';}).join('')}</div>
      </div>`).join('')}</div>`:'<div class="card"><div class="empty-note">만료되는 선수가 없습니다</div></div>'}
    <div class="section-title"><h3>계약 만료 스태프</h3><div class="line"></div><span class="tiny">${expStaff.length}명</span></div>
    ${expStaff.length?`<div class="stack">${expStaff.map(st=>`
      <div class="staff-card">
        <div class="row between">
          <div class="row" style="gap:8px"><span class="chip gold">${staffRoleLabel(st.role)}</span>
            <div><div style="font-weight:900;font-size:14px">${esc(st.name)}</div><div class="tiny">연봉 ${st.salary}억 · ${(st.traits||[]).map(id=>STAFF_TRAITS[id]&&STAFF_TRAITS[id].n).filter(Boolean).join(' · ')}</div></div>
          </div>
          <div class="row" style="gap:4px">
            <select class="mini-select" data-sy="${st.id}"><option value="1">1시즌</option><option value="2" selected>2시즌</option></select>
            <button class="btn sm primary" data-signs="${st.id}">재계약</button>
          </div>
        </div>
      </div>`).join('')}</div>`:'<div class="card"><div class="empty-note">만료되는 스태프가 없습니다</div></div>'}
    <div class="card tight">
      <div class="tiny">남은 만료자를 처리하면 다음 시즌이 시작됩니다. FA가 된 선수는 이적시장에서 다시 영입할 수 있습니다.</div>
    </div>
    ${typeof stovePanelHTML==='function'?stovePanelHTML():''}
    <button class="btn primary block" id="startNextSeason">${S.season+1}시즌 시작 →</button>

  const v=$('view-offseason');
  v.querySelectorAll('[data-a]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); try{ hubAction(b.dataset.a,b.dataset.v,b); }catch(err){ toast('처리 중 오류가 발생했습니다'); } });
  v.querySelectorAll('[data-signp]').forEach(b=>b.onclick=()=>{
    const name=b.dataset.signp;
    const sel=v.querySelector('[data-py="'+name.replace(/"/g,'\\"')+'"]');

  show('offseason');
}


/* ---------- MSI / EWC ---------- */
function intlBracketHTML(tour){
  return `<div class="bracket">
    ${tour.bracket.rounds.map((r,ri)=>`<div class="bround">
      <div class="bl">${esc(r.name)} · ${esc(r.month)}</div>
      ${r.matches.map(m=>`<div class="bmatch ${tour.bracket.round===ri&&!m.done?'live':''}">
        <div class="bs ${m.done&&m.winner===m.a?'win':''} ${m.a===S.userTeam?'me':''}">${m.a?badge(T(m.a),'sm')+'<span>'+esc(T(m.a).tag)+'</span>':'<span>TBD</span>'}<span class="bsc">${m.done?m.sa:'—'}</span></div>
        <div class="bs ${m.done&&m.winner===m.b?'win':''} ${m.b===S.userTeam?'me':''}">${m.b?badge(T(m.b),'sm')+'<span>'+esc(T(m.b).tag)+'</span>':'<span>TBD</span>'}<span class="bsc">${m.done?m.sb:'—'}</span></div>
      </div>`).join('')}
    </div>`).join('')}
  </div>`;
}
function intlUserMatch(tour){
  const rd=tour.bracket.rounds[tour.bracket.round];
  return rd.matches.find(m=>!m.done&&m.a&&m.b&&(m.a===S.userTeam||m.b===S.userTeam));
}
function renderIntl(){
  const tour=intlNow();
  if(!tour){ renderAll(); return; }
  const rd=tour.bracket.rounds[tour.bracket.round];
  const mine=intlUserMatch(tour);
  const isMSI=tour.kind==='msi';
  $('view-intl').innerHTML=`
    <div class="hero worlds-hero" style="padding:18px 14px 6px">
      <div class="kicker">${isMSI?'MID-SEASON INVITATIONAL':'ESPORTS WORLD CUP'} · ${tour.month}</div>
      <h1 style="font-size:26px">${isMSI?'MSI':'EWC'}</h1>
      <p>${esc(tour.name)} · 8팀 초청 · Bo${tour.bo}</p>
      <div class="row" style="justify-content:center;gap:6px;margin-top:8px">
        <span class="chip sm">${tour.teams.map(id=>esc(T(id).tag)).join(' · ')}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h4>토너먼트</h4><span class="k">${esc(rd.name)} · ${rd.matches.filter(m=>m.done).length}/${rd.matches.length}</span></div>
      ${intlBracketHTML(tour)}
    </div>
    ${tour.done?`
      <div class="card glow" style="border-color:rgba(255,201,74,.45)">
        <div class="row between"><div><div class="tiny">${isMSI?'MSI 우승':'EWC 우승'}</div><div style="font-weight:900;font-size:18px;color:var(--gold)">${esc(T(tour.champion).name)}</div></div>${badge(T(tour.champion),'lg')}</div>
        <div class="row between" style="margin-top:6px"><span class="tiny">준우승</span><b style="font-size:12px">${esc(T(tour.runnerUp).name)}</b></div>
        ${isMSI?'<div class="tiny" style="margin-top:6px">MSI 우승 팀이 LCK 소속이면 롤드컵 시드 보너스가 주어집니다</div>':''}
      </div>
      <button class="btn primary block" id="intlNext">${isMSI?'서머 시즌 시작 →':'서머 재개 →'}</button>
    `:`
      ${mine?`<div class="card" style="border-color:rgba(37,224,255,.5)">
        <div class="card-h"><h4>${esc(rd.name)} · 우리 경기</h4><span class="k">Bo${mine.bo||tour.bo}</span></div>
        <div class="row between" style="margin-bottom:10px">
          <div class="row" style="gap:7px">${badge(myTeam())}<b>${esc(myTeam().tag)}</b></div>
          <span class="chip sm">VS</span>
          <div class="row" style="gap:7px"><b>${esc(T(mine.a===S.userTeam?mine.b:mine.a).tag)}</b>${badge(T(mine.a===S.userTeam?mine.b:mine.a))}</div>
        </div>
        <button class="btn primary block" id="intlPlay">경기 시작 · 밴픽</button>
      </div>`:`
      <div class="card">
        <div class="card-h"><h4>${tour.userIn?'다음 경기':'관전 모드'}</h4><span class="k">${tour.month}</span></div>
        <div class="tiny" style="margin-bottom:10px">${tour.userIn?'다른 경기를 시뮬레이션하고 다음 라운드로 진행합니다.':'우리 팀은 초청되지 않았습니다. 대회를 관전하세요.'}</div>
        <button class="btn primary block" id="intlPlay">경기 진행</button>
        <button class="btn sm block" id="intlSim" style="margin-top:6px">대회 전체 자동 진행 ⏩</button>
      </div>`}
    `}
    <div class="card">
      <div class="card-h"><h4>참가팀</h4><span class="k">8팀</span></div>
      <div class="stack" style="gap:3px">${tour.teams.map(id=>{const t=T(id);return `<div class="kv"><span>${badge(t,'sm')} ${esc(t.name)} <i class="tiny">${esc(t.region)}</i></span><b style="font-size:11px">${esc(teamStar(t))}</b></div>`;}).join('')}</div>
    </div>
    <div style="height:10px"></div>`;
  const p1=$('intlPlay'); if(p1) p1.onclick=()=>intlAction();
  const p2=$('intlNext'); if(p2) p2.onclick=()=>{ intlAction(); };
  const p3=$('intlSim'); if(p3) p3.onclick=()=>{ intlSimAll(); };
  show('intl');
}
function intlAction(){
  const r=intlNext();
  if(r.action==='user'){
    const s=intlSeries(r.match,r.roundName,r.tour);
    saveGame(); startDraft(s); return;
  }
  if(r.action==='done' || !intlNow()){ renderAll(); return; }
  renderIntl();
}
function intlSimAll(){
  let guard=0;
  while(intlNow()&&guard++<40){
    const tour=intlNow();
    const rd=tour.bracket.rounds[tour.bracket.round];
    let any=false;
    rd.matches.forEach(m=>{ if(!m.done&&m.a&&m.b){ simIntlMatch(m,tour); any=true; } });
    if(!any) break;
    const r=intlAdvance(tour);
    if(r.action==='done') break;
  }
  saveGame();
  renderAll();
}

window.__game={get S(){return S},get M(){return M},get D(){return D}};
sndLoad();bgmLoad();
renderTitle();
