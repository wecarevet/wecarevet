<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoL 매니저 26 · 화면 미리보기</title>
<style>html,body{margin:0;padding:0;background:#0b0d12}iframe{border:0;display:block;height:100vh}</style></head>
<body>
<iframe id="f"></iframe>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var w=parseInt(q.get('w')||'375',10);
  var go=q.get('go')||'trade';
  var team=q.get('team')||'BRO';
  var f=document.getElementById('f');
  f.style.width=w+'px';
  f.src='lol-preview-game-v2.html';
  f.onload=function(){
    setTimeout(function(){
      try{
        var g=f.contentWindow;
        g.createState(team); g.clubInit();
        if(go==='trade'){
          g.hubAction('tab','market'); g.hubAction('stovetab','trade');
          g.hubAction('stoveteam','T1'); g.hubAction('stovetarget','Faker');
          g.hubAction('stovemine','Clozer'); g.stoveCashSet(4);
        }else if(go==='trade2'){
          g.hubAction('tab','market'); g.hubAction('stovetab','trade');
          g.hubAction('stoveteam','KT'); g.hubAction('stovetarget','Bdd');
          g.hubAction('stovemine','deokdam'); g.stoveCashSet(12);
        }else if(go==='match'){
          g.hubAction('tab','home');
          try{ g.prepareMatch(); }catch(e){}
          try{ g.autoDraftRun(); g.D.assign.me=g.recommendAssign(g.dMyPicks()); g.D.result=g.evalDraft(); g.startMatch(g.D.result); g.M.running=true; g.M.speed=8; }catch(e){ document.title='DRAFTERR '+e.message; }
          document.title='MATCH LIVE';
          return;
        }else if(go==='staff'){ g.hubAction('tab','club:staff'); }
        else if(go==='budget'){ g.hubAction('tab','club:budget'); }
        document.title='READY '+go+' '+w;
      }catch(e){ document.title='ERR '+(e&&e.message||e); }
    },400);
  };
})();
</script>
</body></html>
