<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0e">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>투자 허브로 이동 · ETF 비교 · 백테스트</title>
<link rel="icon" href="favicon.png">
<meta http-equiv="refresh" content="0; url=stocks.html#etf">
<style>
:root{--bg:#080a0e;--card:#0e131b;--card2:#121924;--line:#1d2633;--line2:#2a3849;
  --txt:#eef2f8;--txt2:#b7c4d4;--mut:#7f8fa4;--mut2:#5a6a7e;--gold:#e6bd7a;--gold2:#c79a4e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:
  radial-gradient(900px 480px at 80% -10%,rgba(230,189,122,.10),transparent 62%),
  radial-gradient(700px 420px at 0% 0%,rgba(90,140,200,.07),transparent 58%),var(--bg);
  color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.55;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:22px;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:430px;padding:22px 20px 20px;border-radius:18px;
  background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
  box-shadow:0 18px 44px rgba(0,0,0,.5)}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:6px}
h1{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.03em}
p{margin:0 0 14px;color:var(--mut);font-size:12.5px}
a.go{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:12px;
  text-decoration:none;color:#1a1408;font-weight:800;font-size:14px;
  background:linear-gradient(180deg,#f0cd93,var(--gold));border:0}
.links{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.links a{display:flex;align-items:center;gap:7px;padding:10px;border-radius:11px;text-decoration:none;
  color:var(--txt2);font-size:12px;font-weight:700;background:rgba(255,255,255,.022);border:1px solid var(--line)}
.links a:hover{border-color:var(--line2);color:var(--txt)}
.foot{margin:14px 0 0;font-size:10.5px;color:var(--mut2);text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">ETF RESEARCH DESK → INVESTMENT HUB</div>
  <h1>투자 허브로 통합되었습니다</h1>
  <p>ETF 비교 · 백테스트 · FIRE · 절세가 <b style="color:var(--txt2)">주식 보드</b>와 한 페이지로 합쳐졌습니다. 잠시 후 자동으로 이동합니다.</p>
  <a class="go" href="stocks.html#etf">⚖️ 투자 허브 열기</a>
  <div class="links">
    <a href="stocks.html#etf">⚖️ ETF 비교</a>
    <a href="stocks.html#backtest">📈 백테스트</a>
    <a href="stocks.html#fire">🔥 FIRE · 절세</a>
    <a href="stocks.html#board">📊 시세 보드</a>
  </div>
  <p class="foot">위케어동물의료센터 개인용 · 검색 비노출 페이지</p>
</div>
<script>
(function(){
  var map = {compare:'etf', tax:'fire', backtest:'backtest', fire:'fire'};
  var h = (location.hash || '').replace('#','');
  var target = 'stocks.html#' + (map[h] || 'etf');
  try { location.replace(target); } catch(e){}
})();
</script>
</body>
</html>
