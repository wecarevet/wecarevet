name: 위케어 관심 ETF·주식 보드 갱신

# 미국장·한국장 마감 뒤 Yahoo Finance 실제 종가를 받아 stocks.html 의 데이터 블록을 다시 심습니다.
#   · 22:30 UTC (07:30 KST) 화~토 — 미국장 마감(16:00 ET) 뒤
#   · 07:00 UTC (16:00 KST) 월~금 — 한국장 마감(15:30 KST) 뒤
on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 시세 수집 · stocks.html 갱신
        run: python3 scripts/stocks/update_stocks.py

      - name: 변경분 커밋
        run: |
          git config user.name "wecarevet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stocks.html stocks.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git commit -m "stocks: 관심 ETF·주식 장 마감 시세 갱신 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
          # 그사이 다른 작업이 main 에 올렸을 수 있으니 rebase 후 push
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
